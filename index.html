。"],["向南来到隐居地，","隐姓埋名深藏匿。","闭目塞听独生活，","最终与死成伴侣。"]],[["机饵设张，","司暴子良。","范叔不廉，","凶害及身。"],["机关诱饵俱没张，","毒计强暴害子良。","范雎出使贪财物，","凶祸降至自身上。"]],[["从骑出谷，","游戏苦域。","坡高不进，","利无所得。"],["随从众人出山谷，","漫不经心入苦域。","坡高路险难行进，","最终愿望都落空。"]],[["西国强梁，","为虎作伥。","东吞齐楚，","并有其王。"],["西方秦国逞凶狂，","为虎作伥把人伤。","吞并东方齐楚国，","暴力残害其君王。"]],[["登山伐辐，","虎在我侧。","王孙无惧，","仁不见贼。"],["登山伐木做车辐，","我身之侧有猛虎。","王孙公子无所惧，","仁德在身不畏戮。"]],[["六月骙骙，","各欲有至。","专政束装，","俟时旦明。"],["六月马儿肥又壮，","各有欲望和去向。","奉命出征治好装，","等待天色渐明亮。"]],[["道陟多阪，","牛马蜿蟺。","车不利载，","请求不得。"],["道路不平山坡多，","牛疲马乏难拉车。","车儿难以载重物，","请求改善不能得。"]],[["一口三舌，","相妨无益。","君羊百牂，","不成威强。","亡马失驹，","家耗于财。"],["一张口中三只舌，","互相妨碍坏处多。","羊群中有百母羊，","不能称作威与强。","丢失大马又失驹，","家中资财消耗光。"]]],[[["大都之居，","无物不具。","抱布贸丝，","所求必得。"],["住在繁华大都市，","没有物品不具备。","抱着布匹来换丝，","有求必得皆顺利。"]],[["胶著木连，","不出牢关，","家室相安。"],["如胶着木紧相连，","不出坚固大门关，","居家度日多安然。"]],[["孟伯食长，","惧其畏王。","赖四蒙五，","抱福归房。"],["大哥家中有余粮，","惧怕强汉来解囊。","赖四蒙五受实惠，","怀抱福利回私房。"]],[["朽舆疲驷，","不任衔辔。","君子服之，","谈何容易。"],["车儿朽坏马儿累，","不堪其任难戴辔。","官人乘它去出行，","困难重重活受罪。"]],[["许嫁既婚，","利福在身。","适惠生桓，","为我鲁君。"],["许诺嫁人结了婚，","利益福气都临身。","嫁给惠公生桓公，","做了鲁国之国君。"]],[["入门大喜，","上堂见母。","妻子俱在，","兄弟饶有。"],["步入家门逢喜讯，","上堂拜见老母亲。","妻子就在身旁立，","兄弟物产饶又丰。"]],[["推车上山，","力不能任。","颠蹶蹉跌，","伤我心中。"],["推着车儿上高山，","车重山陡力不堪。","七歪八倒难前进，","满身伤痕人揪心。"]],[["鹰飞退去，","不食其雏。","禽尚如此，","何况人乎。"],["雄鹰高飞远离去，","不来残食我小鸡。","禽鸟尚且能如此，","人类更应有良知。"]],[["福弃我走，","利不可得。","幽人利贞，","终无怨慝。"],["福气离我而远去，","利益又不来此地。","隐居之人多贞正，","终无怨恶临自身。"]],[["夫妻反目，","不能正室。","翁云于南，","妪言还北。","并后区嫡，","二政乱国。"],["丈夫妻子相反目，","使得家庭不和睦。","老公说要向南去，","老伴非北莫行步。","两位正妻居皇室，","政不统一误国事。"]],[["阳衰伏匿，","阴淫为贼。","赖幸王孙，","遂至嘉国。"],["阳气衰微而伏藏，","阴气肆虐造灾殃。","多亏王孙来相助，","使我回到安乐乡。"]],[["入山求玉，","不见和璞。","终日至暮，","劳无所得。"],["进入山中求美玉，","不见和璞在何地。","从早一直到天黑，","妄受劳苦未得利。"]],[["鸣鸾四牡，","驾出行狩。","合格有获，","献公饮酒。"],["四马銮铃响叮铛，","驾车出行狩猎忙。","合格车徒得任用，","美酒献给我君王。"]],[["覆手举牍，","易为功力。","正月元日，","平饮致福。"],["翻手拿起一文牍，","毫不费力轻易举。","适逢正月元旦日，","对坐相饮招来福。"]],[["三火起明，","雨灭其光。","高位疾颠，","骄恣诛伤。"],["三堆大火红彤彤，","暴雨浇灭光不生。","处在高位易坠落，","骄横放纵灭自身。"]],[["裹糗荷粮，","与利相逢。","高飞有得，","君子获福。"],["带上干粮出了门，","巧与利益喜相逢。","高飞远走有所得，","商人获福多高兴。"]],[["水土相得，","万物蕃殖。","膏泽优沃，","君子有德。"],["水美土肥相适宜，","万物生长多繁殖。","雨露滋润多膏泽，","高尚之人怀仁德。"]],[["道理和得，","人不相贼。","君子往之，","乐有利福。"],["和睦相处得人心，","相互礼让不争讼。","贤人所至好地方，","欢欣快乐福临门。"]],[["天孙帝子，","与日月处。","光荣于世，","福禄繁祉。"],["上天之孙皇帝子，","与那日月同相居。","富贵荣光于人世，","福泽利禄都临至。"]],[["陪依在位，","乘非其器。","折足履悚，","毁伤宝玉。"],["陪伴他人居高位，","难胜其任事不遂。","鼎折其足食物撒，","宝珠玉石都摔碎。"]],[["鹢飞中退，","举事不遂。","且守仁德，","犹免失坠。"],["六鹢高飞中途退，","做事难把心意遂。","君若坚守仁与德，","保全禄位不下坠。"]],[["经枣正冠，","意盈不廉。","桀纣迷谗，","惑佞伤贤，","使国乱烦。"],["枣树旁边正其冠，","心意自满志不廉。","夏桀殷纣迷谗言，","惑于奸佞害忠贤，","致使国家遭动乱。"]],[["申酉退跌，","隐慝前作。","柯条花枝，","复泥不白。"],["申酉之时阳气衰，","隐伏之灾乘虚来。","树枝花叶多鲜艳，","陷入污泥失光彩。"]],[["平正贱使，","主服苦事。"],["平正之人操贱业，","主人去做苦力活。"]],[["钓鲂河湄，","水泛无涯，","振衣徒归。","上下昏迷，","属公逊齐。"],["前去河边去钓鱼，","水势泛滥无边际，","整衣徒劳回故里。","君臣上下皆昏庸，","昭公逃往齐国去。"]],[["胎养萌生，","始见兆形。","遭逢雷电，","摧角折颈。","采虻山头，","终安不倾。"],["家畜怀胎得萌生，","即将见到其雏形。","不幸遭逢雷电击，","摧毁头角折脖颈。","上山采得贝母来，","治愈使其保安稳。"]],[["阳春枯槁，","夏多水潦。","霜雹俱作，","伤我禾黍，","年岁困苦。"],["阳春三月枯无雨，","夏季水潦成灾异。","寒霜冰雹来侵害，","禾苗伏地不得起，","年岁困苦无收益。"]],[["三耳六齿，","痛疾不已。","龋病蠹缺，","堕落其宅。"],["三只耳朵六颗齿，","患病痛疼不停止。","牙齿受蛀皆缺损，","脱落掉在口腔里。"]],[["失时无友，","嘉耦出走，","累如丧狗。"],["失去机会无朋友，","心爱妻子又出走，","活像一条丧家狗。"]],[["宣重微民，","岁乐年息。","有国无咎，","君子安喜。"],["帝王宣召重百姓，","岁岁安乐年年丰。","举国上下无灾祸，","好人安然与喜逢。"]],[["登几上车，","驾驷南游。","合纵散横，","燕齐以强。"],["踩着小凳上了车，","四马驾行游南国。","合纵抗秦不连横，","燕齐两国得强盛。"]],[["鸟集茂林，","柔顺利贞。","心乐愿得，","感戴慈母。"],["鸟儿聚集茂林中，","柔顺和谐又贞正。","心中愿望得实现，","感谢慈母养育恩。"]],[["启蛰始生，","万物美荣。","祉禄未成，","市卖无赢。"],["惊蛰时节是初春，","万物繁荣得萌生。","福禄喜事未成功，","市场买卖利未赢。"]],[["骄胡犬形，","造恶作凶。","无所能成，","还自灭身。"],["胡人骄横如犬形，","作恶多端是元凶。","所办事情难成功，","终究只有灭自身。"]],[["异国他土，","出良骏马。","去如奔虻，","害不能伤。"],["异国他乡土地上，","出产骏马好地方。","奔跑往来如飞虻，","纵使有害不能伤。"]],[["恪敬竟职，","心不作慝。","君明臣忠，","民赖其福。"],["恭敬谨慎尽职责，","内心不存邪与恶。","君王明圣臣下忠，","民赖其福好生活。"]],[["三女求夫，","伺候山隅。","不见复关，","长思忧叹。"],["三女外出寻丈夫，","等待盼望在山隅。","不见丈夫入关来，","长久思念叹忧苦。"]],[["架福乘喜，","东至嘉国。","戴庆南行，","离我室居。"],["驾着福瑞乘着喜，","向东来到吉祥地。","戴着荣庆朝南行，","离开我的旧居室。"]],[["四奸为残，","齐鲁道难。","前驱执役，","戒守无患。"],["四位奸人来作乱，","齐鲁之间行路难。","手执武器当前驱，","戒守防备无灾患。"]],[["驾言出游，","鸟斗车前。","更相捽灭，","兵寇旦来。","回车亟还，","可以无忧。"],["乘车出门去游玩，","遇上鸟儿斗车前。","双方揪打俱灭亡，","预兆清晨有兵变。","掉回车头急归还，","可以无忧亦无患。"]],[["下忧上烦，","蠹政为患，","岁饥无年。"],["百姓忧患朝臣烦，","蛀虫残害政为患，","岁岁灾荒无丰年。"]],[["鸡雉失雏，","常畏狐狸。","黄池要盟，","越国以昌。"],["野鸡丢失其小鸡，","常常畏惧怕狐狸。","吴王会盟于黄池，","越国借机搞偷袭。"]],[["坚冰黄鸟，","终日悲号。","不见白粒，","但观蓬蒿。","数惊鸷鸟，","为我心忧。"],["冰天雪地黄鸟栖，","终日悲愁和哀泣。","没有米粒无食物，","但见蓬蒿长满地。","屡遭猛禽之威胁，","使我心中多忧虑。"]],[["玉铣铁颐，","仓库空虚。","市贾无盈，","与我为仇。"],["玉角镶在铁钟口，","仓库空空货无有。","市场生意不景气，","大利与我结怨仇。"]],[["窃名盗位，","居非其家。","霜陨不实，","为阴所贼。"],["盗取高位窃名誉，","所居并非自家室。","寒霜降下不结实，","招来阴气害自己。"]],[["贼仁伤德，","天怒不福。","斩刈宗社，","失其本域。"],["残害仁人伤道德，","上天发怒降灾祸。","毁了祖庙社稷地，","失其本土和室舍。"]],[["万物初生，","蛰虫振起。","益寿增福，","日受其喜。"],["初春万物皆复苏，","惊蛰之后虫振起。","寿比南山增福气，","天天得到喜庆事。"]],[["和气所在，","物皆不朽。","圣贤居位，","国无凶咎。"],["天地之气很和顺，","万物生长多茂盛。","圣君贤相居高位，","国家无灾亦无凶。"]],[["龙游凤舞，","岁乐民喜。"],["苍龙遨游风舞起，","年岁欢乐万民喜。"]],[["远行窘步，","次宿方舍。","居安不俱，","姬姜何忧。"],["出门远行有危难，","次日方能宿舍间。","住地安全不惧怕，","夫妻双双无忧患。"]],[["水深难游，","霜寒难涉。","商伯失利，","旅人稽留。"],["水深流急难游过，","天寒霜重难跋涉。","商人生意无利得，","行旅之人须停歇。"]],[["跛倚相随，","日暮牛罢。","陵迟后旅，","失利亡雌。"],["跛脚赶路相随从，","黄昏牛疲难行进。","斜坡之上落伍后，","利益女友皆无踪。"]],[["一牢九锁，","更相牵挛。","案明如市，","不得东西。","请谳得报，","日中被刑。"],["一间牢房九把锁，","互相牵连开不得。","案情早已查明白，","东西南北逃不脱。","议罪公文呈报上，","当天中午被处决。"]],[["春桃生花，","季女宜家。","受福孔多，","男为邦君。"],["阳春三月开桃花，","小女长大要出嫁。","福禄长长享多年，","女婿是位地方官。"]],[["雷鼓东行，","稼穑凋伤。","大夫执政，","君赞其明。"],["雷声如鼓向东行，","阵雨狂暴禾难生。","官人前来执朝政，","君王称赞其圣明。"]],[["季世多忧，","乱国淫游。","殃祸立至，","民无以休。"],["末世风气令人愁，","荒淫游乐国遭咎。","致使灾祸频频来，","贫苦民众不得休。"]],[["发温汤，","过角宿房。","宜时布和，","无所不通。"],["乘车出发于温泉，","经过角宿住房间。","依顺时令布和气，","畅通无阻永往前。"]],[["水中大贾，","求利食子。","商人不至，","市空无有。"],["前往水上做生意，","赚钱求利吃其息。","不见商人来此地，","市场空空未盈利。"]],[["春草萌生，","万物敷荣。","阴阳和调，","国乐无忧。"],["春草萌发破土生，","万物开花多繁荣。","阴阳二气皆和顺，","国家安乐无忧凶。"]],[["左眇右盲，","目视不明。","下民多孽，","君失其常。"],["左眼失明右眼盲，","双目视力不明亮。","下等游民行坏事，","君主在上失纲常。"]],[["悦以内安，","不利出门。","忧除祸消，","公孙何尤。"],["家中安定悦于心，","不利上路出远门。","忧虑祸患都消除，","乐了公子和王孙。"]],[["丹书之信，","言不负语。","易我骐骥，","君子有德。"],["丹书在手是凭证，","所言诚实非空论。","赐我一匹千里马，","好人圣明有德性。"]],[["上政骚扰，","螟虫并起。","害我嘉谷，","年岁无稷。"],["上边政治乱不安，","田间害虫皆泛滥。","伤害我的良稻谷，","丰收年景看不见。"]],[["干旄旌旗，","执职在郊。"],["牛尾鸟羽饰旗杆，","高高飘扬于郊原。"]]],[[["鲤鲔鲫鰕，","积福多鱼。","资所有无，","富我邦家。"],["水乡盛产各类鱼，","给我带来好福气。","以我所有助贫穷，","富我邦国和家室。"]],[["景星照堂，","麟游凤翔。","仁施大行，","颂声作兴。","征者无明，","失其宠光。"],["瑞星高悬照明堂，","麟麒凤凰来呈祥。","仁德之政施四方，","歌颂之声到处扬。","征者入侵不明智，","失其尊宠和荣光。"]],[["羊肠九萦，","相推稍前。","止须王孙，","乃能上天。"],["羊肠小路九道弯，","前后相推稍向前。","须向王孙来学步，","方能登天成神仙。"]],[["四手共身，","莫适所闲。","更相访接，","动失事便。"],["四手长在一人身，","各自莫适其所从。","互相扯皮又推诿，","举事失便不能成。"]],[["水流趋下，","远至东海。","求我所有，","买鲂有鲤。"],["水从高处往下流，","向东注入大海口。","出门贩鱼做生意，","如愿以偿得所有。"]],[["春粟夏枣，","山鲜希有。","斗千石万，","贵不可贩。"],["春天粟子夏天枣，","新鲜山果稀为宝。","斗值千文石值万，","价格太贵不可贩。"]],[["日往暮还，","相佑与聚，","无有凶患。"],["白天出门晚回还，","互相帮助结成伴，","没有凶险与灾患。"]],[["大蛇当路，","使季畏惧。","汤火之灾，","切近我肤。","赖其天幸，","归于室庐。"],["大蛇挡在路中央，","刘邦见之心也慌。","热水烈火灾齐降，","一同逼近我身旁。","幸赖皇天来佑助，","跑进王庐得躲藏。"]],[["徒足去域，","飞入陈国。","有所畏避，","深藏邃匿。"],["徒步离开原住址，","高飞远行陈国地。","内心胆怯又恐惧，","隐身远匿别处去。"]],[["海为水宗，","聪圣且明。","百流归德，","无有叛逆，","常饶优足。"],["江河向着大海行，","聪慧而且又圣明。","百流朝宗她之德，","不会倒流和逆行，","长久富饶又丰盈。"]],[["夏麦麸黄，","霜击其芒。","病君败国，","使年大伤。"],["夏麦结粒又灌浆，","严霜打坏其麦芒。","君主昏愦国受损，","使得年景生灾殃。"]],[["秋隼冬翔，","数被严霜。","雄犬夜鸣，","家扰不宁。"],["猛禽深秋高飞翔，","屡屡不幸逢严霜。","公狗夜半叫不停，","家受骚扰不安宁。"]],[["乐仁上德，","乐邻慕义，","来安吾国。"],["乐于行仁崇尚德，","东邻仰慕好礼节，","主动前来安我国。"]],[["逐忧除殃，","污泥生梁，","下田为汪。"],["改造地形除涝殃，","污泥地里生稻粱，","下田积水当池塘。"]],[["暗昧冥语，","转相迷误。","鬼魅所居，","谁知卧处？"],["愚昧无知之鬼话，","转相传闻谬误大。","妖魅鬼怪所居地，","谁能知道在哪搭？"]],[["南历玉田，","东入玉关。","登上福堂，","饮万岁浆。"],["向南到达和田县，","向东进入玉门关。","登上幸福之殿堂，","痛饮长生不老浆。"]],[["比目四翼，","来安我国。","福善上堂，","与我同床。"],["比翼鸟儿比目鱼，","来到我国安其居。","福庆善祥同上堂，","与我共卧一张床。"]],[["乘牛逐骥，","日暮不至。","路宿多畏，","亡其骍骓。"],["骑牛去追千里马，","追到天黑也白搭。","睡在野地多恐惧，","丢了红马杂毛马。"]],[["元吉无咎，","安宁不殆。"],["大吉大利无灾难，","平平安安无危险。"]],[["奋翅鼓翼，","翱翔外国。","逍遥徙倚，","来归温室。"],["展开翅膀鼓起翼，","回旋高飞在异域。","自由自在复徘徊，","终又返回温室来。"]],[["河伯娶妇，","东山氏女。","新婚三日，","浮云洒雨。","露我营茅，","万邦蒙佑。"],["河神娶来新媳妇，","东山氏的小公主。","结婚方才三日整，","行云降雨润田垄。","滋润草木禾苗生，","天下百姓都蒙恩。"]],[["婴儿求乳，","慈母归子，","黄麑悦喜。"],["婴儿呱呱要奶吃，","慈母归来哺其子，","黄色小鹿心欢喜。"]],[["贫鬼守门，","日破我盆。","毁罂伤瓶，","空虚无子。"],["贫鬼前来守在门，","天天打破我的盆。","毁了罐子损伤瓶，","使我穷困无子孙。"]],[["多载重负，","弃捐于野。","王母谁子，","但自劳苦。"],["多载重负力不足，","抛弃掷于野外地。","王母孤独没有子，","自招劳累受苦力。"]],[["雄狐绥绥，","登山崔嵬。","昭告显功，","大福允兴。"],["巍巍南山高又大，","雄狐步子慢慢跨。","帝王向天报功德，","大福从天而降下。"]],[["婴儿孩子，","未有知识。","彼童而争，","乱我政事。"],["乳臭未干毛孩子，","殷纣年幼而无知。","那只小羊生头角，","搅乱我的朝政事。"]],[["十丸同投，","力雉所离。","独得逃脱，","完全不亏。"],["十个弹丸同射击，","都被野鸡巧躲避。","奔跳飞跑得逃离，","保全自身无灾异。"]],[["狐济濡尾，","求橘得枳。","季姜怀悔，","鲍舍鱼臭。"],["狐狸过河尾浸湿，","欲求橘子得酸枳。","姜家小女心怀悔，","鲍鱼房中多臭气。"]],[["踆足息肩，","所忌不难。","金城铜郭，","以铁为关。","藩屏周卫，","安全无患。"],["休脚止步歇歇肩，","有所顾忌无大难。","金铸之城铜为墙，","铁做城门牢又坚。","四面屏障严卫守，","安居在此永无患。"]],[["戴尧扶禹，","松乔彭祖。","西过王母，","道路夷易，","无敢难者。"],["拥戴唐尧扶大禹，","寿如松乔和彭祖。","一同西去见王母，","道路平安又顺利，","没有谁来敢拦阻。"]],[["京庾积聚，","黍稷以极。","行者疾至，","可以厌饱。"],["方形仓库积满粮，","糜子谷子露天放。","行旅之人快快来，","可以饱食免饥荒。"]],[["良夫孔姬，","胁悝登台。","柴季不扶，","卫辄走逃。"],["浑良夫和孔伯姬，","为登家台胁孔悝。","高柴子路不扶持，","卫辄乱中忙逃离。"]],[["天之所予，","福禄常在，","不忧危殆。"],["皇天在上所赐予，","赐我利禄和福喜，","不用担心有危殆。"]],[["行触天网，","马死车伤，","身无寥赖，","困穷乏粮。"],["盲目行动触天网，","马儿死亡车损伤。","自身无依又无靠，","贫困苦穷缺食粮。"]],[["铅刀切玉，","坚不可得。","尽我筋力，","胝茧为疾。"],["钝刀用来雕刻玉，","坚硬无法刻成器。","费尽我的全身力，","手长老茧成病疾。"]],[["穆违百里，","使孟奋武。","将军帅战，","败于殽口。"],["穆公不听百里言，","命令孟明去征战。","将军督军受截击，","殽口战败军覆完。"]],[["有人追亡，","鸟言所匿，","不日而得。"],["有人追赶逃亡犯，","鸟儿告知匿藏点，","不日之内即归案。"]],[["府藏之富，","王以赈贷。","捕鱼河海，","罟网多得。"],["府库收藏很丰富，","君王救济多借出。","捕鱼前往海与河，","渔网之中多收获。"]],[["鸿飞遵陆，","公归不复，","伯氏客宿。"],["大雁沿着陆地飞，","客人归去不再回，","大哥一人独自睡。"]],[["凫过稻庐，","甘乐鳝鳅。","虽惊不去，","田畯怀忧。"],["野鸭飞过稻田里，","鳝鱼泥鳅尽情食。","虽然受惊不离去，","农官心中怀忧虑。"]],[["路多枳棘，","步刺我足。","不利旅客，","为心所毒。"],["路上枳木棘木多，","我的双脚被刺破。","不利出门去远行，","心烦意乱悔恨生。"]],[["雨师娶妇，","黄岩季女。","成礼既婚，","相呼南去。","膏泽田里，","年丰大喜。"],["雨师娶来新媳妇，","她是黄岩小女子。","举行礼仪既成婚，","相约到那南方去。","甘露滋润田野里，","年岁丰收有大喜。"]],[["蓄积有余，","粪土不居。","美哉轮奂，","出有高车。"],["家中积蓄有盈余，","简陋土屋不再居。","新房宽敞又明亮，","出门高车来代步。"]],[["重门击柝，","介士守护。","终有他道，","中惊不惧。"],["重重门户击木梆，","铠甲武士严守防。","终有通途在眼前，","纵使受惊也无妨。"]],[["大都王市，","稠人多宝。","公孙宜贾，","资货万倍。"],["大都市中大市场，","人口稠密多宝藏。","公子王孙去经商，","万倍利润入钱囊。"]],[["秋隼冬翔，","数被严霜。","甲兵充庭，","万物不生。"],["猛禽深秋高飞翔，","屡屡不幸逢严霜。","兵士充满当庭院，","使得万物难生长。"]],[["招祸致凶，","来螫我邦。","痛在手足，","不得安息。"],["招致祸患及凶殃，","手脚都被虫蜇伤。","疼痛使我难忍受，","不能安歇犯愁怅。"]],[["秦失其鹿，","疾走先得。","勇夫慕义，","君子率服。"],["秦国丢失其江山，","快行之人先得权。","勇士仰慕仁和义，","将帅相携来身边。"]],[["山陵四塞，","遏我经路。","欲前不得，","复还故处。"],["四面高山和丘陵，","使得道路不畅通。","欲想前进不能成，","重新返回故居中。"]],[["一指食肉，","口无所得，","舌谗于腹。"],["一个指头去吃肉，","口中空空无所有，","舌谗腹中真难受。"]],[["晨夜惊骇，","不知所止。","皇母相佑，","卒得安处。"],["早晚担惊受恐惧，","不晓何时能止息。","幸赖皇母来保佑，","终于安居自家室。"]],[["豺狼所言，","语无成全。","误我白马，","使干口来。"],["豺狼之辈所吐言，","荒诞离奇不成全。","使我受骗上其当，","最终干口无食粮。"]],[["呼精灵来，","魄生无忧。","疾病瘳愈，","解我患愁。"],["前呼后唤叫精灵，","招来魂魄附其身。","使得疾病获痊愈，","解除我的忧与凶。"]],[["牧羊逐兔，","使鱼捕鼠。","任非其人，","废日无功，","不免辛苦。"],["教那羊儿去追兔，","指使鱼儿去捕鼠。","所用并非有才人，","耽误时间事不成，","难免吃苦白费功。"]],[["堂祥上楼，","与福俱居。","帝姬治好，","国安无忧。"],["安闲自得登楼堂，","来与幸福同卧床。","帝王之女多美丽，","国家安定呈吉祥。"]],[["禹召诸神，","会稽南山。","执玉万国，","天下康安。"],["夏禹召集众大臣，","相聚会稽南山中。","各方诸侯执玉来，","天下康泰又安宁。"]],[["太姒文母，","乃生圣子。","昌发受命，","为天下主。"],["文王之妻和母亲，","所生儿子都聪圣。","姬昌姬发受天命，","统一天下为圣君。"]],[["两罝同室，","兔无谁告？","与狂相触，","蒙我以恶。"],["两网同将兔捉获，","逃之夭夭谁之过？","与那暴徒碰一处，","恶名反而背给我。"]],[["桃雀窃脂，","巢于小枝。","动摇不安，","为风所吹。","心寒悚惕，","常忧殆危。"],["桃雀和那窃脂鸟，","小树枝头筑起巢。","树枝摇晃不安静，","是那风儿太糟糕。","寒冷恐惧而警惕，","经常担忧受困扰。"]],[["阳春长日，","万长华实，","乐有利福。"],["阳春三月日照长，","万物开花果实香，","多利多福心欢畅。"]],[["邻不我顾，","而望玉女。","身疾疮癞，","谁肯媚者？"],["邻里小伙不爱我，","只去欣赏美女色。","身患疾病长癞疮，","谁肯喜欢丑模样？"]],[["涸旱不雨，","泽竭无流。","鱼鳖干口，","皇天不忧。"],["长久干旱雨不落，","沼泽之中水枯竭。","鱼鳖口干不得欢，","惟有皇天独自乐。"]],[["狼虎之乡，","日争凶讼。","受性贪饕，","不能容纵。"],["狼虎所居之地方，","天天争讼逞凶狂。","本性贪婪又残暴，","宽容放纵生灾殃。"]],[["阴注阳疾，","水离其室。","舟楫大作，","伤害黍稷。","民饥于食，","亦病心腹。"],["阳气衰弱阴气盛，","洪水失控乱流行。","船儿来往于水上，","庄稼受损淹田埂。","黎民饥饿无食粮，","病魔生于心腹中。"]]],[[["下堂出门，","东至九山。","逢福值喜，","得其安闲。"],["下堂走出自家门，","向东到达名山中。","遇到幸福碰上喜，","安乐悠闲好轻松。"]],[["城上有乌，","自名破家。","招呼鸩毒，","为我灾患。"],["城头之上有乌鸦，","自取其名曰破家。","招惹呼唤毒鸟来，","国家因之降灾煞。"]],[["伯虎仲熊，","德义渊泓。","使布五教，","阴阳顺序。"],["伯虎仲熊两弟兄，","道德仁义广又深。","使其布施传五教，","阴阳二气都协调。"]],[["饮酒醉酗，","跳起争斗。","伯伤仲僵，","东家治丧。"],["兄弟二人醉醺醺，","跳起身来两相争。","哥哥受伤弟弟亡，","东边邻家来治丧。"]],[["四目相视，","稍近同轨。","日昳之后，","见吾伯姊。"],["四只眼睛相对视，","同路而行到一起。","待到太阳偏西时，","与我大姐相团聚。"]],[["随时逐便，","不失利门。","多获得福，","富于封君。"],["紧随时机趁方便，","来到利益之门前。","获取甚多得大福，","财富胜于地方官。"]],[["陇西冀北，","多见骏马，","去如猋飏，","害不能伤。"],["陇西之地冀州朔，","所产马儿好又多。","来往奔驰如疾风，","不会受伤逢灾祸。"]],[["白龙黑虎，","起伏俱怒。","蚩尤败走，","死于鱼首。"],["白色巨龙黑色虎，","起伏不定俱暴怒。","蚩尤战败急逃走，","最终命丧在鱼首。"]],[["鸿飞戾天，","避害紫渊。","虽有锋门，","不能危身。"],["大雁高飞在蓝天，","避害来到紫水渊。","虽有逢门之射法，","我身独得不伤残。"]],[["平国不君，","夏氏作乱。","乌号窃发，","灵公殒命。"],["灵公不配为人君，","徵舒发泄其私愤。","阴暗角落射利箭，","君主一命丧黄泉。"]],[["江汉上游，","政逆民忧。","阴伐其阳，","雄受其殃。"],["长江汉水之上游，","政治暴虐百姓愁。","阴气盛行侵犯阳，","英雄豪杰受灾殃。"]],[["东家杀牛，","闻臭腥臊。","神怒不顾，","命衰绝周。","亳社灾烧，","宋公夷诛。"],["东家杀牛欲祭神，","脏臭腥臊太难闻。","神灵发怒不光顾，","殷命衰败周朝兴。","宗族庙宇被火烧，","后代宋人遭杀凶。"]],[["西诛不服，","恃强负力。","倍道趋敌，","师徒败覆。"],["向西讨伐叛逆国，","依仗势强兵力多。","昼夜行军趋仇敌，","全军失败遭覆灭。"]],[["一妇六夫，","乱扰不治。","张王季庄，","莫适为公；","政道壅寨，","周君失邦。"],["六夫共有一妇人，","纷扰混乱难适从。","张王李赵聚一室，","不晓认谁为老公；","政道上下皆堵塞，","周朝失国君昏庸。"]],[["配合相迎，","利之四乡。","昏以为期，","明星煌煌。","所喜爽怿，","所言得当。"],["男女相配喜相迎，","利及四方众乡亲。","约定黄昏来相会，","明星灿灿挂长空。","内心欢喜多愉快，","言语恰当又诚恳。"]],[["猿堕高木，","不踒手足，","握金怀玉，","还归其室。"],["猿从树上坠落地，","没有摔伤手和足。","手握黄金怀抱玉，","安全返回自家室。"]],[["卷领遁世，","仁得不害。","三圣攸同，","周国茂兴。"],["卷起衣领当隐士，","不使仁德受损失。","三位圣人齐尽力，","周朝得以兴盛起。"]],[["去患脱厄，","安无怵惕。","上福喜堂，","见我欢悦。"],["远离祸患脱危险，","没有恐惧甚安全。","入门登上福喜堂，","心上人儿见了面。"]],[["带季儿良，","时利权兵。","将师合战，","敌不能当。","赵魏以强。"],["带季儿良两将领，","因利乘便善用兵。","率师与敌齐奋战，","势不可挡获全胜，","赵魏赖此得强盛。"]],[["鹄思其雄，","欲随凤来。","顺里羽翼，","出次须日。","中留北邑，","复反其室。"],["天鹅觅偶长相思，","随着凤凰东飞去。","梳顺羽毛理好翼，","迎着太阳高飞起。","途中留止在城北，","终究返回自家室。"]],[["耳如惊鹿，","不能定足。","室家分散，","各走匿窜。"],["两耳直竖如惊鹿，","奔走逃命不停步。","家人四处离散去，","各自寻找藏身处。"]],[["甲乙丙丁，","俱归我庭。","三丑六子，","入门见母。"],["甲乙丙丁众弟兄，","一起回到我家中。","三个丑儿六个子，","入门见母问康宁。"]],[["蹑华巅，","观浮云。","风不摇，","雨不薄。","心安吉，","无患咎。"],["登上华山之顶峰，","遥望太空观浮云。","狂风不来侵犯我，","雨师远去不光临。","内心平安又吉利，","无有患难与灾凶。"]],[["德施流行，","利之四乡。","雨师洒道，","风伯逐殃。","巡狩封禅，","以告成功。"],["仁义道德广流行，","利及四方老百姓。","雨神前来洒道路，","风伯吹走祸与凶。","帝王巡行祭天下，","以告事业得成功。"]],[["水流趋下，","遂成东海。","求我所有，","买鳣与鲤。"],["江河奔腾向下流，","汇集注入东海口。","前去寻我欲求物，","鳣鱼鲤鱼买个够。"]],[["和气相薄，","豪润津泽，","生我嘉谷。"],["祥和之气相交融，","雨露滋润万物生，","使我庄稼很茂盛。"]],[["忧惊以除，","祸不成灾，","安全以来。"],["忧愁惊恐已离开，","祸患未能成灾害，","平安顺利回家来。"]],[["坚冰黄鸟，","常哀悲愁。","不见白粒，","但睹藜蒿。","数惊鸷鸟，","为我心忧。"],["严冬季节一黄鸟，","终日悲愁又哀嚎。","不见米粒无食物，","但见野草藜与蒿。","屡遭猛禽所惊吓，","使我心中愁难消。"]],[["翕翕軥軥，","覆堕崩颠。","灭其令名，","身命不全。"],["车声轰轰驰向前，","转而坠落遭崩颠。","毁了官人好名声，","自身性命难保全。"]],[["因祸受福，","喜盈其室。"],["因祸反而招来福，","喜庆之事充满屋。"]],[["陆居千里，","不见河海，","无有鱼市。"],["陆地居之千里外，","不见江河与大海，","难寻鱼市无买卖。"]],[["鹿得美草，","呼鸣其友。","九族和睦，","不忧饥苦。"],["鹿儿寻得鲜美草，","呦呦鸣呼把友叫。","群体上下都和睦，","不忧饥饿无烦恼。"]],[["出门得党，","不逢祸殃。","入户自苦，","不见矛戟。"],["出门得到朋友帮，","不会碰到祸与殃。","入门从容又自若，","不见矛戈不受伤。"]],[["罍尊重席，","命我嘉客。","福佑久长，","不见祸殃。"],["备好美酒设宴席，","请我贵客坐上去。","保佑幸福禄长长，","平安不逢祸与殃。"]],[["鸿雁俱飞，","北就鱼池。","鳣鲔鰋鲤，","众多饶有。","一笱获两，","得利过倍。"],["大雁鸣叫一起飞，","向北落地池塘内。","鳣鲔鲤鱼儿多，","新鲜活泼肥又美。","一笱入水获两条，","使我所得利过倍。"]],[["当风奋翼，","与鸟飞北。","入我家国，","见吾庆室。"],["迎风展翅高飞翔，","与鸟一同去北方。","进入我的国与家，","看见我的吉庆堂。"]],[["麒麟凤凰，","善政得祥。","阴阳和调，","国无灾殃。"],["麒麟凤凰呈吉祥，","政通人民得安康。","阴阳二气多和顺，","国家没有灾与殃。"]],[["逐狐东山，","水遏我前。","深不可涉，","失其后便。"],["追逐狐狸到东山，","大水阻我不得前。","河水深深难涉渡，","先失利益后得便。"]],[["丑戌亥子，","饥馑所生。","阴为暴客，","水绝我食。"],["时辰自丑回到子，","日复一日腹受饥。","阴气汹汹似强盗，","恶水漫漫绝我食。"]],[["狐狸雉兔，","畏人逃去。","分走窜匿，","不知处所。"],["狐狸野鸡和兔子，","惧怕人类皆逃去。","四处奔走躲藏起，","去向何处无人知。"]],[["桀跖恶人，","使德不通。","炎旱为殃，","年谷大伤。"],["夏桀盗跖凶恶人，","使得仁德不畅通。","烈日炎炎成旱灾，","庄稼损伤无收成。"]],[["文王四乳，","仁爱笃厚。","子畜十男，","无有夭折。"],["文王身长四乳头，","仁慈博爱且笃厚。","精心抚养十男儿，","个个健康又长寿。"]],[["兔乳在室，","行来雀食。","虎攫我子，","长号不已。"],["兔子哺乳自家室，","出行寻来鸟雀食。","恶虎捉走我儿子，","长声号啕不停止。"]],[["土阶明堂，","礼让益兴。","雄雌相得，","使我无疾。"],["沿着土阶登明堂，","礼让之风盛又广。","男欢女爱多和谐，","使我身心都健康。"]],[["送金出门，","并失玉丸。","往来井上，","破翁坏盆。"],["送金走出自家门，","玉丸一并丢失净。","往者来者于井上，","破了瓦翁坏了盆。"]],[["讽德诵功，","美周盛隆。","加其旦辅，","光济冲人。"],["歌其美德颂其功，","赞美周朝之兴盛。","更有周公来辅佐，","光济成王年轻人。"]],[["盗窃灭身，","二母不亲。","王后无当，","毁其宝灵。"],["窃取雷尊灭自身，","祖母生母不相亲。","任后行事欠妥当，","宝物毁坏不显灵。"]],[["六月骙骙，","各欲有至。","专征束装，","俟时旦明。"],["六月马儿肥又壮，","各有打算和去向。","奉命出征治好装，","等待天色渐明亮。"]],[["雀行求粒，","误入纲罭。","赖仁君子，","复说归室。"],["鸟雀出行寻米粒，","误入网罗囊袋里。","幸遇仁人来解救，","逃脱又回自家室。"]],[["仁德孔明，","患祸不伤。","期誓不至，","室人衔恤。"],["仁义道德很高尚，","纵使有祸也无殃。","约定之期未归来，","妻子在家独忧伤。"]],[["龟厌江海，","陆行不止。","自令枯槁，","失其都市，","虽忧无咎。"],["乌龟讨厌海与河，","陆地爬行不停歇。","自食恶果变枯槁，","远离都市无欢乐，","虽有忧愁却无祸。"]],[["狐独特处，","莫依为辅，","心劳志苦。"],["孤单居住独自处，","没有依靠无人扶，","心中忧伤志劳苦。"]],[["伯仲言留，","叔子云去。","虽去无咎，","主母大喜。"],["老大老二说要留，","老三独自说要走。","纵使远行也无凶，","母亲在家不用愁。"]],[["初忧不安，","后得笑欢，","虽惧无患。"],["起初忧虑心不安，","后来喜笑又欢颜，","虽有恐惧却无患。"]],[["好战亡国，","师不以津。","称上殒坠，","齐侯狠戾，","被其灾祟。"],["穷兵黩武亡了国，","军不守纪难制约。","逞强好战反坠落，","齐侯残暴甚毒恶，","终被联军所消灭。"]],[["鹿在泽陂，","豺伤其麑，","泣血独哀。"],["鹿儿在那湖泽滩，","小鹿受到豺伤残，","悲哀哭泣甚可怜。"]],[["天地闭塞，","仁智隐伏。","商旅不行，","利润难得。"],["政治腐败路闭塞，","仁智贤人隐士多。","经商之人难出行，","买卖生意利难得。"]],[["福德之士，","欢悦日喜。","夷吾相桓，","三归为臣，","赏流子孙。"],["德高之人收入多，","喜悦高兴甚欢乐。","管仲辅佐齐桓公，","三分收获归朝廷，","富贵流传至子孙。"]],[["上无飞鸟，","下无走兽。","乱扰未治，","民劳于事。"],["长空不见鸟飞行，","陆地走兽去无踪。","政治混乱不可治，","百姓劳苦难生存。"]],[["据斗运枢，","顺天无忧，","与乐并居。"],["斗柄围绕天枢行，","顺从天意无忧凶，","吉祥快乐永安宁。"]],[["戴盆望天，","不见星辰。","顾小失大，","福逃墙外。"],["头戴瓦盆去观天，","日月星辰都不见。","顾及小而失去大，","福庆逃到屋外边。"]],[["月削日衰，","工女下机。","宇宙灭明，","不见三光。"],["月儿亏损日衰落，","女工夜黑织不得。","宇宙失去光与亮，","日月星辰都泯灭。"]],[["操戟刺鱼，","被发立忧。","虎脱我衣，","狼取我袍，","亡马失财。"],["手执长戟去刺鱼，","披头散发怀忧虑。","老虎扒下我外衣，","恶狼夺走我袍子，","马匹财物皆丢失。"]],[["两人俱醉，","相与悖戾。","心乖不同，","争讼匈匈。"],["两人双双喝醉酒，","相互违逆起斗殴。","内心抵触不一致，","争吵谩骂结怨仇。"]]],[[["狼戾美谋，","无言不殊。","允厌帝心，","悦以获佑。"],["恶人暴虐善密谋，","所言无有不特殊。","赢得上帝多信任，","得其欢心和鼎助。"]],[["岁暮花落，","阳入阴室。","万物伏匿，","绝不可得。"],["年终岁末花坠落，","阳明之气入阴舍。","万物收敛皆藏匿，","最终什么都难得。"]],[["鸡鸣失时，","君骚相忧。","犬吠不休，","行者稽留。"],["母鸡鸣叫乱时辰，","君受骚扰不安宁。","家狗狂吠不停止，","旅从欲行又不能。"]],[["凫鹭游泾，","君子以宁。","履德不愆，","福禄来成。"],["野鸭鹭鸶游泾河，","君子安宁又康乐。","履行道德不违背，","幸福利禄来随我。"]],[["魃为灾虐，","风吹云却。","欲上不得，","复归其宅。"],["旱魃逞凶造灾虐，","狂风劲吹云退却。","欲要升高难上难，","返回它的原室舍。"]],[["东行破车，","步入危家。","衡门倒垂，","无以为主。","卖袍续食，","糟糠不饱。"],["东行途中车儿破，","走进危困衰败舍。","衡门垂落于正屋，","室内无人来待客。","卖掉衣服济生活，","糟糠难能解饥饿。"]],[["青牛白咽，","呼我俱田。","历山之下，","可以多耕。","岁稔时节，","民人安宁。"],["青色牛儿长白咽，","同我一齐去田间。","历山脚下多宽广，","可以多耕好良田。","秋收冬藏季节里，","百姓康宁又平安。"]],[["异国殊俗，","情不相得。","金木为仇，","百贼擅杀。"],["国别民俗各不同，","人情与我不相近。","金木相克成仇敌，","盗贼聚众擅杀人。"]],[["阴阳精液，","膏熟脱拆。","胎卵成魄，","肇生头目，","日有大喜。"],["雌性之液雄性精，","膏润成熟将出生。","精卵形成新生命，","长出脑袋和眼睛，","日内将有大喜讯。"]],[["饥蚕作茧，","偏多乱缠，","绪不可得。"],["饥饿之蚕欲作茧，","摇头吐丝胡乱缠，","欲理头绪很困难。"]],[["青蛉如云，","为兵导先。","民人冤急，","不知东西。"],["蜻蜓纷飞多如云，","引导兵士向前行。","人民冤屈说不尽，","东方西方难辨清。"]],[["班马旅师，","以息劳疲。","役夫嘉喜，","入户见妻。"],["战马班列撤回朝，","士兵休整解疲劳。","服役之人心欢喜，","回家与妻相团聚。"]],[["坐争立讼，","纷纷匈匈。","卒成祸乱，","灾及家公。"],["坐立不安起争讼，","纷乱不堪闹哄哄。","终于造成大祸乱，","灾害殃及老父亲。"]],[["鹿食美草，","逍遥求饱。","趋走山间，","过期乃还，","肥泽其厌。"],["鹿儿尽情食美草，","逍遥愉快求吃饱。","奔走来往于山中，","逾期回归大本营，","腰肥体壮毛色润。"]],[["田鼠野雉，","意常欲去。","拘制笼槛，","不得摇动。"],["田鼠和野鸡，","欲想远处去。","关在笼子里，","使其难逃离。"]],[["日趋月步，","周遍次舍。","历险致远，","无有难处。"],["太阳月亮天上行，","沿着轨道而运动。","历经艰险到远方，","没有危难能阻挡。"]],[["天孙帝子，","与日月处。","光荣于世，","福禄祉祉。"],["皇天之孙帝之子，","他与日月居一起。","富贵荣光留于世，","福禄吉祥真如意。"]],[["晨风文翰，","大举就温。","昧过我邑，","羿无所得。"],["鹯鸟皋鸡鼓其翼，","高飞去寻温和地。","黎明之前过城邑，","射手后羿未得利。"]],[["旦生夕死，","名曰婴鬼，","不可作祀。"],["早上出生晚上死，","呼它婴鬼为名字，","不可为其作祭祀。"]],[["疾贫望幸，","使伯南贩。","开牢择羊，","多得大牂。"],["贫病之人盼福来，","使哥南方去贩卖。","打开圈门挑选羊，","得到很多大母羊。"]],[["长城骊山，","生民大残。","涉叔发难，","唐叔为患。"],["修筑长城造骊宫，","百姓受难劳役重。","陈胜吴广闹起义，","刘邦祸患亦逢身。"]],[["娶于姜吕，","驾迎新妇。","少齐在门，","夫子欢喜。"],["欲娶妻子她姓姜，","驾车前往迎新娘。","新娘站在家门口，","新郎喜悦心欢畅。"]],[["随时草木，","灌枝叶起。","扶疏条桃，","长大盛美，","华沃铄舒。"],["草木顺应时节生，","灌木叶儿鲜又嫩。","桃树枝条多茂密，","茁壮成长好美盛，","光华殷实真迷人。"]],[["姬姜既欢，","二姓为婚。","霜降合好，","西施在前。"],["姬姜两家多欢喜，","二姓合为好夫妻。","霜降时节办喜事，","新娘美丽如西施。"]],[["戴笠独宿，","昼不见日。","勤苦无代，","长劳悲思。"],["头戴斗笠独自住，","不见天日妄劳苦。","辛勤耕耘无人替，","长期感伤生忧思。"]],[["始加元服，","二十系室。","新婚既乐，","伯季有得。"],["十八成年加冕礼，","二十结婚有妻室。","新婚燕尔多快乐，","兄长弟弟都有得。"]],[["二至灵台，","文所止游。","云物备具，","长乐无忧。"],["冬至夏至灵台上，","文王游此观天象。","风云万物放眼量，","长久安乐无忧伤。"]],[["久阴霖雨，","途行泥潦。","商人休止，","市空无宝。"],["秋雨绵绵天不晴，","道路行走多泥泞。","商人滞留难出门，","市场空空无营生。"]],[["城坏压境，","数为齐病。","侵伐不休，","君臣扰乱。","上下屈竭，","市民乏财。"],["城池毁坏兵压境，","屡败成为齐王病。","侵略征伐无休止，","君王纷扰臣悔恨。","举国上下财力尽，","居民无钱难聊生。"]],[["南国盛茂，","黍稷醴酒。","可以飨养，","乐我嘉友。"],["南方物产很丰盛，","谷物酿酒盛杯中。","可以赡养全家人，","用以宴请我嘉宾。"]],[["忧在心腹，","内崩为疾。","祸起萧墙，","意如制国。"],["忧患生在心腹中，","内心焦虑成疾病。","祸殃起于自家内，","平子专了鲁国政。"]],[["朽根刖树，","花叶落去。","卒逢大猋，","随风僵仆。"],["朽木烂根折了枝，","花叶纷纷飘落去。","突然遇上狂飙起，","随着大风倒在地。"]],[["树表为坛，","相与期言。","午中不会，","宠荣弃废。"],["树起日表筑高坛，","相互约定欲会面。","日至中天不见来，","荣誉废弃身受斩。"]],[["四足俱走，","奴疲在后。","两战不胜，","败于东楚。"],["骏马奋蹄齐奔走，","奴仆疲惫跟在后。","两次决战都失利，","败于东楚江山丢。"]],[["执辔西朝，","回还故处。","麦秀伤心，","叔父有忧。"],["手执缰绳向西行，","回到原来故居中。","《麦秀》之诗抒悲情，","箕子心里忧重重。"]],[["夜长日短，","阴为阳贼。","万物空枯，","藏于北陆。"],["长夜绵绵白日短，","阴气将那阳气残。","万物枯萎皆死亡，","太阳藏到最北边。"]],[["鸤鸠七子，","均而不殆。","长大成就，","弃而合好。"],["布谷喂养七个子，","平等相待不歧视。","小鸟长大远飞去，","和睦友好如当时。"]],[["三羊上山，","驰至大原。","黄龙负舟，","遂到夷阳，","宛其玉囊。"],["三只羊儿上了山，","驰骋辽阔大草原。","黄龙背上驮着船，","漂浮到那夷阳边，","聚财满其玉囊间。"]],[["手足易处，","头尾颠倒。","公为雌妪，","乱其蚕织。"],["手脚位置都更换，","头脑尾巴次序颠。","老翁变为老太婆，","养蚕纺纱全搞乱。"]],[["登高望家，","役事未休。","王事靡盬，","不得逍遥。"],["登高眺望故乡园，","劳役之事无期限。","朝廷差事没个完，","难能逍遥和安闲。"]],[["畏昏不行，","候旦天明。","燎猎受福，","老赖其庆。"],["夜色昏暗不敢行，","停留原址待天明。","烧山打猎受大福，","老来靠其享吉庆。"]],[["孤独特处，","莫依为辅。","心劳志苦。"],["孤单居住独自处，","没有依靠为辅助，","心志劳累又困苦。"]],[["戴尧扶禹，","松乔彭祖。","西遇王母，","道路夷易，","无敢难者。"],["拥戴唐尧扶大禹，","寿如松乔和彭祖。","来到西方见王母，","道路平安又顺利，","没有谁人敢拦阻。"]],[["山石朽破，","消崩堕坠。","上下离心，","君受其祟。"],["山石风化剥蚀破，","纷纷崩裂而坠落。","上下离心又离德，","好人将要受灾祸。"]],[["文母圣子，","无疆寿考。","为天下主，","人受其福。"],["文王之妃生武王，","健康幸福寿无疆。","武王成为天下主，","人民百姓把福享。"]],[["倔傀无仪，","前后相违。","言如鳖咳，","语不可知。"],["固执怪异又诡诈，","前后相违多变化。","出言犹如老鳖咳，","谁也不懂他的话。"]],[["五龙俱起，","强者败走。","露我苗稼，","年岁大有。"],["五条巨龙齐腾跃，","强敌也被吓逃跑。","雨露滋润我禾苗，","今年庄稼长势好。"]],[["豦除善猛，","难为功医。","骥疲盐车，","困于衔箠。"],["善类格斗凶又猛，","没有高强好本领。","良马驾着重盐车，","鞭子抽打难行进。"]],[["江南多蝮，","螫我手足。","冤烦诘屈，","痛彻心腹。"],["江南一带多蝮蛇，","我的手脚遭其蜇。","怨愤烦恼多委屈，","内心痛苦受折磨。"]],[["心无所据，","射鹿不得。","多言少实，","语无成事。"],["心神不定难安静，","欲射鹿儿未射中。","泛泛空言不务实，","所求事儿皆无功。"]],[["君明臣贤，","鸣求其友。","显德之士，","可以履土。"],["国君明智大臣贤，","呼唤好友来身边。","昭显仁德之人士，","践履国土百姓安。"]],[["安上宜官，","一日九迁。","逾群越等，","牧在常山。"],["安抚上司好做官，","一日能有九升迁。","超越同等平凡人，","如同田氏居常山。"]],[["峻词解谢，","除去垢污。","惊之成患，","婴去酷残。"],["严词排忧解危难，","消除过错与缺点。","受惊之后虽成患，","终能除去其酷残。"]],[["翁狂妪盲，","相牵北行。","欲归高邑，","迷惑不得。"],["老翁狂癫老妪盲，","互相扶行向北方。","欲要返回高邑去，","迷迷惑惑失方向。"]],[["醉臣道旁，","迷旦失明，","不全我生。"],["晚上喝醉倒路旁，","不辨夜黑与天亮，","岂能保全君健康。"]],[["北登鬼丘，","驾龙东游。","王叔御后，","文武何忧？"],["往北登上鬼山丘，","乘着飞龙向东游。","王良驾车随其后，","文王武王有何忧？"]],[["恬淡无患，","游戏道门。","与神往来，","长乐以安。"],["不图虚荣无忧患，","游戏求仙道门前。","常与神仙相往来，","悠悠自得多安然。"]],[["以缗易丝，","抱布自媒。","弃礼急情，","卒罹悔忧。"],["假装换丝实提亲，","抱布自来做媒人。","抛弃礼节心太急，","草率成婚生悔恨。"]],[["被服衣冠，","游戏道门。","以礼相终，","身无灾患。"],["身着长服戴高冠，","游戏往来道门前。","始终以礼相待人，","自身永远无灾患。"]],[["大麓鱼池，","陆为海涯。","君子失行，","小人相携。"],["山下林麓成渔乡，","陆地变成大海洋。","贤士受困难行进，","小人合伙偷又抢。"]],[["渊泉溢出，","为城邑祟。","道路不通，","孩子心愦。"],["深渊喷泉溢又涌，","城镇遭受洪水冲。","道路淹没难通行，","孩童心思乱纷纷。"]],[["十里望烟，","散涣四方。","形体灭亡，","可入深渊，","终不见君。"],["十里之外望云烟，","四面八方飘离散。","形象体征皆灭亡，","随即坠入其深渊，","难以再见贵人面。"]],[["传言相误，","非干径路。","鸣鼓逐狼，","不知迹处。"],["转辗传话有失误，","所行并非好路途。","擂起战鼓驱豺狼，","不知豺狼在何处。"]],[["东失大珠，","西行弃襦。","时多不利，","使我后起。"],["向东行进失大珠，","西去又丢其短服。","未逢良辰和吉日，","我独另外寻出路。"]]],[[["蒙被恩德，","长大成就。","柔顺利贞，","君臣合好。"],["承蒙皇天恩与德，","长大成就其事业。","性情温柔又守正，","君臣和睦多亲切。"]],[["东山西山，","各自止安。","心虽相望，","竟不同堂。"],["分居东山和西山，","双方各自都平安。","两心虽能遥相应，","竟然无法能会同。"]],[["登山上谷，","与虎相触。","猬与功曹，","班叔奔走，","脱之嘉国。"],["登上高山入深谷，","途中不幸碰到虎。","多亏刺猬来相助，","猛虎潜逃向北去，","使我脱险至乐都。"]],[["踬跌不起，","失利后市，","不得鹿子。"],["瘸子跌倒爬不起，","误了市场好生意，","不得小鹿未盈利。"]],[["结珠怀履，","卑斯似鬼，","为君奴婢。"],["系着珍珠怀揣鞋，","卑贱如鬼形可恶，","为人奴婢受折磨。"]],[["鸡鸣失时，","民侨劳苦。","庬吠有威，","行者留止。"],["母鸡报晓乱时辰，","苦了寄居老百姓。","半夜狗叫真畏惧，","出门人儿难行进。"]],[["陈妫敬仲，","示兆兴姜。","乃适营丘，","八世大昌。"],["陈国敬仲娶新娘，","卜卦预测要兴姜。","随即到达营丘地，","子孙八世都盛昌。"]],[["鹿畏人匿，","俱入深谷。","短命不长，","为虎所得，","死于牙腹。"],["鹿怕猎人而藏匿，","跑入深山峡谷里。","可惜命短不长久，","为虎所缚难逃离，","终成恶虎口中食。"]],[["言无约结，","不成券契。","殷叔季姬，","公孙争之，","强入委禽，","不悦於心，","乃适子南。"],["口头承诺无订约，","只凭嘴说无券契。","殷叔小妹真美丽，","二位公孙齐争之，","强行送来订婚礼。","小妹不愿嫁子皙，","终与子南成夫妻。"]],[["鼓瑟歌舞，","欢遗於酒。","龙喜张口，","大喜在后。"],["弹瑟唱歌又起舞，","酒后纵情多欢娱。","苍龙喜悦张开口，","更有喜事在后头。"]],[["凶忧灾殃，","日益章明。","祸不可救，","三郤夷伤。"],["凶事忧愁和灾殃，","日复一日得明彰。","祸患入门难避免，","晋国三郤遭伤残。"]],[["水流趋下，","遂至东海。","求我所有，","买鳣与鲤。"],["河水哗哗往下淌，","东流直泻大海洋。","前去求我所要物，","鳣鱼鲤鱼装满筐。"]],[["阴为阳贼，","君不能克。","举动失常，","利无所得。"],["阴阳二气两相对，","官人难治小人罪。","行为举止失常态，","不能得利空手回。"]],[["离床失案，","龟丧其愿。","都市无会，","叔季怀恨。"],["离开床足和几案，","乌龟丧失其心愿。","集市空空不见人，","哥哥弟弟怀恨怨。"]],[["雍遏堤防，","水不得行。","火盛阳光，","隐霓伏藏，","走归其乡。"],["堤防堵塞不畅通，","水流受阻不能行。","大火赛过太阳光，","阳霓伏藏不显形，","返回它的老家中。"]],[["躄屈复伸，","东乘浮云，","贵宠母前。"],["腿病治愈得复伸，","东行自如乘浮云，","慈母面前得爱宠。"]],[["实沈参伐，","以义断割。","次陆服刑，","成我霸功。"],["实沈星儿参伐星，","以义断割不相亲。","管仲脱桎鲍叔迎，","终于成就其霸功。"]],[["金泉黄宝，","宜与我市。","娶嫁有息，","利得过母。"],["金银钱币如宝玉，","适合用它做生意。","获利超过其本钱，","迎娶出嫁都有息。"]],[["禹召诸神，","会稽南山。","执玉万国，","天下康安。"],["大禹召集众诸侯，","聚集会稽南山头。","万国执玉来朝拜，","普天之下安无忧。"]],[["三虫作蛊，","践迹无与。","胜母盗泉，","君子不处。"],["三条害虫来蛊惑，","不见形迹似妖魔。","胜母盗泉坏地方，","有德之人莫前往。"]],[["花叶陨落，","公归妪宅。","夷子失民，","洁己不食。"],["花叶纷纷皆飘落，","老翁回到老妪舍。","伯夷失去国与民，","不食周粟守高节。"]],[["履机惧毁，","身王子废。","终得所欲，","无有凶害。"],["践踏机关畏机毁，","自身为王子辈废。","最终得到其所欲，","没有祸凶不懊悔。"]],[["道理和德，","仁不相贼。","君子攸往，","乐有利福。"],["和睦相处讲道理，","互不残害重仁义。","高尚之人所到地，","利益幸福一并至。"]],[["合匏同牢，","姬姜并居。"],["同饮喜酒共进食，","姬男姜女住一起。"]],[["关雎淑女，","贤妃圣偶。","宜家寿母，","福禄长久。"],["雎鸠和鸣妹俊秀，","贤惠妻子配佳偶。","相爱成婚利家室，","婆母寿考福长久。"]],[["骓骥脱乳，","不知子处。","旋踵悲鸣，","痛伤我心。"],["良马之驹断了乳，","不知其子去何处。","坐卧不宁鸣声悲，","使我心中很痛苦。"]],[["知严绝理，","阴孽谋主。","十日不食，","困于申亥。"],["暴君灵王绝理行，","臣下暗中害主人。","兵溃乾溪无食物，","困于申亥之家中。"]],[["监诸攻玉，","无不穿凿。","龙体具举，","鲁班为辅。","麟凤成形，","德象君子。"],["治玉之石作雕刻，","坚硬之宝皆穿凿。","龙体形象多逼真，","能工巧匠来辅佐。","麒麟凤凰都成形，","象征官人好品德。"]],[["昧暮乘车，","以至伯家。","踰梁渡河，","济脱无他。"],["天黑时分乘上车，","欲去大哥家中坐。","跨过桥梁渡过河，","平安到达无灾祸。"]],[["吾有黍稷，","委积外场。","有角服箱，","运致我藏，","富于嘉粮。"],["我有糜子和谷子，","屋外谷场广堆积。","牛角长长拉车行，","运回家中收藏起，","广积粮食多富裕。"]],[["喜笑且语，","不能掩口。","官爵并至，","庆贺迎户。"],["笑口常开语不断，","喋喋不休口难掩。","官职爵位一齐来，","亲朋庆贺迎门前。"]],[["雾露霜雪，","日暗不明。","阴孽为疾，","年谷大伤。"],["雾气露水加雪霜，","日头阴暗不明亮。","阴气滋生成灾害，","五谷庄稼受大伤。"]],[["伯去我东，","发如飞蓬。","寤寐长叹，","展转空床。","内怀怅恨，","摧我肝肠。"],["丈夫离我去东方，","头发如蓬疯人样。","昼夜不安长声叹，","来回辗转卧空床。","心怀惆怅与悔恨，","悲痛谷绝摧肝肠。"]],[["亡羊补牢，","张氏失牛。","骍驷奔走，","鹄盗我鱼。"],["羊儿丢失把栏修，","张氏人家又失牛。","大红马儿奔离去，","鸿鹄将我鱼盗走。"]],[["贩鼠卖龟，","利少无谋，","难以得家。"],["贩卖老鼠和青蛙，","智谋区区利不大，","难以糊口养自家。"]],[["西戎为疾，","幽君去室。","陈子发难，","项伯成就。"],["西部犬戎来作乱，","幽王因之失政权。","陈胜起义闹造反，","项羽霸业得成全。"]],[["秋风生哀，","花落心悲。","公室多难，","羊舌氏衰。"],["秋风催人生哀愁，","花落令人心中忧。","晋室多灾又多难，","羊舌衰落成罪囚。"]],[["持福厌患，","去除大残。","日长夜尽，","喜世蒙恩。"],["凭借福星镇邪恶，","危害虽凶不临我。","白天漫长夜已尽，","世世代代喜蒙恩。"]],[["新受大喜，","福履重来。","乐且日富，","足用丰财。"],["新近接受大喜讯，","福禄又来登家门。","欢乐而且多富有，","财源滚滚衣食丰。"]],[["前顿后踬，","左跌右逆。","登高安梯，","重反来归。"],["前进踒脚退跌跤，","左行右步都绊倒。","安上长梯去登高，","摔回原地遭人笑。"]],[["梦饭不饱，","酒未入口。","婴女虽好，","媒雁不许。"],["梦中吃饭不得饱，","酒未入口梦未消。","小女漂亮又聪明，","媒人提亲未答应。"]],[["大都王市，","稠人多宝。","公孙宜贾，","资货万倍。"],["大都市中好热闹，","人口稠密多财宝。","王孙公子去经商，","一本万利生意好。"]],[["两人俱醉，","相与背戾。","心乖不同，","争讼匈匈。"],["两人双双都喝醉，","相对咒骂不停嘴。","想法主张各不同，","争辩聚讼势汹汹。"]],[["河伯大呼：","津不可渡！","往复尔故，","乃无大悔。"],["河神隔岸大声呼：","渡口危险不得渡！","重新返回原居处，","悔恨方能得解除。"]],[["身无头足，","超蹠空乖。","不能远之，","中道废休，","失利后时。"],["只见其身无头脚，","欲想疾步难奏效。","不能出门去远行，","半途而废于中道，","错过时辰利失掉。"]],[["三人俱行，","六目光明。","道逢淑女，","与我骥子。"],["三人一齐同路行，","六只眼睛亮晶晶。","途中遇上贤良女，","送我良马任我骑。"]],[["进仁为官，","不若复田，","获寿保年。"],["与其进仕去做官，","不如回家去耕田，","能够益寿又延年。"]],[["先易后否，","失我所市。","骚苏自苦，","思吾故事。"],["先赚钱财后折本，","失去机会利难盈。","骚扰劳苦心悲愤，","沉于绵绵往事中。"]],[["苏秦发言，","韩魏无患。","张子驰说，","燕齐以安。"],["苏秦主张要合纵，","韩魏因之无祸凶。","张仪游说搞连横，","燕齐从此得安宁。"]],[["武库军府，","甲兵所聚。","非里邑居，","不可舍止。"],["武器库和军事府，","盔甲士兵聚集处。","不是普通乡村屋，","千万不可去居住。"]],[["二桃三口，","莫适所与。","为孺子牛，","田氏生咎。"],["景公二桃赐三士，","三士争桃皆自毙。","衔绳装牛为庶子，","齐国祸殃在田氏。"]],[["西山东山，","各自止安。","心虽相望，","竟不同堂。"],["身居东西两山间，","双方各自都平安。","心心相印常思念，","终究未能得团圆。"]],[["不改柯叶，","和气冲适。","君子所在，","安无怵惕。"],["草木枝叶多茂密，","生长冲和又顺适。","好人所处是圣地，","安心居之无恐惧。"]],[["将戌系亥，","阳藏不起。","君子散乱，","太山危殆。"],["从那九月到十月，","阳气隐藏入阴舍。","大人散乱失常态，","泰山崩颠有危殆。"]],[["天官列宿，","五神舍室。","宫阙完坚，","君安其居。"],["天上星官列长空，","五神各守自家门。","宫殿完整又坚固，","圣君居之多安心。"]],[["左手把水，","右手把火。","如光与鬼，","不可得从。"],["左面手中提着水，","右手执火火花飞。","既如凶光又像鬼，","不可与他相跟随。"]],[["逐狐东山，","水遏我前。","深不可涉，","失利后便。"],["追逐狐狸到东山，","大水阻隔不能前。","水深流急难涉过，","先失利益后得便。"]],[["水渎鱼室，","来灌吾邑。","冲没我家，","与狗俱游。"],["洪水淹没鱼家室，","波涛汹涌灌城邑。","冲毁破坏我家园，","主人与狗漂流去。"]],[["山险难登，","涧中多石。","车驰击，","重载伤轴。","担负善踬，","跌踒右足。"],["山路艰险难攀登，","沟中多石碍交通。","大车奔驰轴撞击，","重载颠簸轴受损。","肩挑重担易摔跤，","跌伤右脚难行进。"]],[["槽空无实，","豚彘不食。","庶民屈竭，","离其居室。"],["槽中空空没有食，","大猪小猪腹中饥。","穷苦百姓财屈竭，","弃家外逃谋生计。"]],[["执热烂手，","火为灾咎。","公孙无赖，","败我王室。"],["手执火把烫伤手，","火儿成为其祸首。","王孙公子耍无赖，","使我国破江山丢。"]],[["三虎上山，","更相噬啮。","心志不亲，","如仇与怨。"],["三只老虎同上山，","互相撕咬和纠缠。","心志各自不相同，","争利结下仇和冤。"]],[["西家嫁子，","借邻送女。","嘉我淑姬，","宾主俱喜。"],["西家女儿将出嫁，","请来邻居陪送她。","夸我姑娘多贤淑，","宾主双双乐开花。"]],[["克身洁己，","逢禹巡狩。","锡我玄圭，","拜受福祉。"],["严格律己洁自身，","时逢大禹来巡行。","赐我黑色之美玉，","拜受福禄享荣崇。"]]],[[["硕鼠四足，","飞不上屋。","颜氏渊德，","未有爵禄。"],["大老鼠有四只足，","无翅不能飞上屋。","颜渊德高学问深，","没有官爵和俸禄。"]],[["新受大喜，","福履重职，","乐且日富。"],["新近接受大喜事，","担任高官任要职，","日子欢乐多富福。"]],[["克身洁己，","逢禹巡狩。","锡我玄圭，","拜受福祉。"],["严格律己洁自身，","时逢大禹来巡行。","赐我黑色之美玉，","拜受福禄享荣崇。"]],[["置筐失筥，","轮破无辅。","家伯为政，","病我下土。"],["得了竹筐丢了筥，","轮子损坏车倒地。","小人家伯掌政权，","百姓受苦又忍饥。"]],[["机言不发，","顽不能达。","齐鲁为仇，","亡我葵丘。"],["机密之言不可发，","愚顽之人不通达。","齐鲁两国结为仇，","葵丘盟好竟弃丢。"]],[["亡锥失斧，","公输无辅。","抱其彝器，","适君子处。"],["丢了锥子和斧头，","如同鲁班失助手。","抱起青铜祭祖器，","向君居处而奔投。"]],[["家在海隅，","桡短深流。","伯氏难行，","无木以趋。"],["我家住在大海边，","水深流急船桨短。","大哥难以向前行，","无法到达河对岸。"]],[["德施流行，","利之四乡。","雨师洒道，","风伯逐殃。","巡狩封禅，","以告成功。"],["恩德行施传八方，","大利普及至四乡。","雨神洒水清道路，","风神驱走其灾殃。","巡行祭祀天和地，","祷告成功事业昌。"]],[["筐倾筥覆，","丧我公粒。","简伯无礼，","太师正食。"],["筐儿倾倒篮子翻，","将那公粮全洒完。","简家大哥失礼仪，","太师正坐而用餐。"]],[["泥滓污辱，","弃捐沟渎。","为众所笑，","终不显禄。"],["污泥浊水脏又臭，","将他抛进深水沟。","遭到众人所耻笑，","高官厚禄难享受。"]],[["猕猴兔足，","腥臊少肉。","漏卮盛酒，","利无所有。"],["兔子之足瘦猕猴，","腥臊难闻又少肉。","破漏酒杯去盛酒，","一点利益也没有。"]],[["鹿畏人藏，","俱人深谷。","命短不长，","为虎所得，","死于牙腹。"],["鹿儿害怕人追捕，","纷纷躲入深山谷。","命中注定不久长，","为虎所缚难逃出，","死于恶虎之牙腹。"]],[["南山芝兰，","君子所有。","东家淑女，","生我玉宝。"],["南山香草和灵草，","象征小伙品德好。","东邻姑娘多贤惠，","娶到我家生玉宝。"]],[["左指右挥，","邪佞侈靡。","执节无良，","灵君以亡。"],["左手晃动右手挥，","邪恶奸佞装神鬼。","手执节具心不良，","灵君身名皆败亡。"]],[["郁怏不明，","为阴所伤。","众雾群聚，","共夺日光。"],["天色昏暗不明亮，","是那阴气所残伤。","烟雾濛濛聚一处，","夺去明媚太阳光。"]],[["穿鼻系株，","为虎所拘。","王母祝祷，","祸不成灾，","突然脱来。"],["穿了鼻子系于树，","君被老虎所禁拘。","幸亏王母来祷告，","祸患终于未成灾，","转危为安脱身来。"]],[["贫鬼守门，","日破我盆。","毁罂伤缸，","空虚无子。"],["穷鬼守在我家门，","天天打破瓢和盆。","毁坏我家瓶和缸，","没有儿子室中空。"]],[["襄王叔带，","郑人是赖。","庄公卿士，","王母忧苦。"],["襄王受困于叔带，","郑人为他所依赖。","庄公成为平王臣，","惠后忧愁也无奈。"]],[["昭君守国，","诸夏蒙德。","异类既同，","宗我王室。"],["昭君出塞为祖国，","神州承蒙其恩德。","异族都来同归顺，","大汉王室受尊崇。"]],[["冬薮枯腐，","常风于道。","蒙被尘埃，","左右劳苦。"],["寒冬沼泽草枯腐，","被风吹得满道路。","草叶之上落满尘，","左摇右摆甚劳苦。"]],[["六爻既立，","神明喜告。","文定吉祥，","康叔受福。"],["六个爻位已确立，","神明欣喜来告知。","文王制定吉祥事，","康叔受福获要职。"]],[["泣涕长诀，","我心不悦。","远送卫野，","归宁无子。"],["痛哭流涕来诀别，","使我心中难快乐。","远送卫地郊野外，","失去爱子回陈国。"]],[["三宿无主，","南行劳苦。","东里失利，","丧其珍宝。"],["停留三日不见主，","往南旅行甚劳苦。","东邻被盗失大利，","丧我财宝难久处。"]],[["大斧砍木，","谗佞败国。","东关梁五，","祸及三子。","晋人乱危，","怀公出走。"],["大斧破断那树木，","奸臣败坏我国度。","东关嬖五和梁五，","陷害重耳和夷吾。","晋国内部朝政乱，","怀公出走而隐伏。"]],[["乘风上天，","为时服轩。","周旋万里，","无有患难。"],["乘着风儿飞上天，","驾起龙车追时间。","周游行施千万里，","所到之处皆平安。"]],[["大树百根，","北与山连。","文君作人，","受福万年。"],["参天大树百条根，","向北延伸至山中。","文王鼓舞振作人，","人民江山万年青。"]],[["阳伏在下，","阴制佑福。","生不逢时，","潜龙隐处。"],["阳气隐伏在下面，","阴气控制福难见。","诞生未逢好时辰，","黄龙潜隐不出现。"]],[["乱头多忧，","搔虱生愁。","膳夫仲允，","使我无聊。"],["头发散乱心多忧，","双手搔虱生悲愁。","御厨归那仲允管，","使我无聊蒙耻羞。"]],[["江河淮海，","天之都市。","商人受福，","国家福有。"],["江河淮河流不息，","乃是天赐大都市。","商人靠它受福利，","国家因之得富裕。"]],[["泰山幽谷，","凤凰游宿。","礼义有序，","可以求富。"],["泰山幽静谷深深，","凤凰游居其山中。","礼义道德有顺序，","可以使那福盈门。"]],[["山水暴怒，","坏梁折柱。","稽难行旅，","留连愁苦。"],["山洪奔流齐暴怒，","毁坏桥梁冲折柱。","行旅之人受困扰，","流连难返甚愁苦。"]],[["阿衡服箱，","大一载行。","巡时历舍，","所之吉昌。"],["阿衡驾起那车厢，","太一乘坐行天上。","顺着天体轨道走，","所到之处都吉祥。"]],[["三宿无主，","南行劳苦。","东里失利，","丧其珍宝。"],["停留三日不见主，","向南行走更劳苦。","东邻被盗失大利，","丧我财宝难久居。"]],[["生无父母，","出门不喜。","买菽失粟，","亡我大利。"],["孤独生活无父母，","出门忧愁满心腹。","买了菽豆丢了谷，","失去大利空悲苦。"]],[["安坐玉堂，","听乐行觞。","饮福万岁，","曰寿无疆！"],["安然高坐玉堂上，","手捧美酒把乐赏。","饮酒祝福喊万岁，","高呼君王寿无疆！"]],[["登危入厄，","四时变易。","春霜夏雪，","物皆凋落。"],["步入危难坏地方，","四时气候皆反常。","春天降霜夏降雪，","万物凋零难生长。"]],[["衣穴履穿，","无以御寒。","细小贫窭，","不能自存。"],["衣服鞋子都破烂，","没有东西来御寒。","生活艰辛甚贫困，","不能自己得保全。"]],[["目不可合，","忧来搔足。","怵惕恐惧，","去其邦域。"],["两眼圆睁难闭合，","忧搔我脚烦恼多。","战战兢兢心恐惧，","搬迁远离自家国。"]],[["赍贝赎狸，","不听我词。","系于虎须，","牵不得来。"],["手执钱币去赎狐，","不听我言相劝阻。","狐狸系在虎须上，","纵使牵拽难回步。"]],[["伯夷叔齐，","贞廉之师。","以德防患，","忧祸不存，","声芳后时。"],["商君伯夷和叔齐，","高尚守节之大师。","以其仁德防祸患，","忧愁灾祸不临至，","名声流芳于后世。"]],[["张王子季，","争财相制。","商君顽嚣，","不知所由？"],["张王李赵诸公子，","争财抢物相挟制。","商人愚昧又奸诈，","不晓要达何目的？"]],[["长城既立，","四夷宾服。","交和结好，","昭君受福。"],["万里长城已筑起，","四夷前来朝天子。","各族人民多和睦，","昭君蒙受大福气。"]],[["千欢万悦，","举事为决。","获受嘉庆，","动作有得。"],["万民欢呼多喜悦，","办事果断又坚决。","获受嘉庆好气氛，","行动即有大收获。"]],[["种一得十，","日益有息。","仁政获民，","四国睦亲。"],["种植虽少收获丰，","日复一日把利赢。","仁义德政得民心，","四国睦邻亲又亲。"]],[["蒙庆受福，","有所获得。","不利出域，","病人困棘。"],["承蒙恩泽受福庆，","获取多多喜于心。","时辰不利莫出行，","谨防病人遭囚禁。"]],[["安子富有，","东国不殃。","齐郑和亲，","显比以喜。"],["安定富有好生活，","东方各国无灾祸。","齐国郑国来和亲，","互得好处很高兴。"]],[["九里十山，","道仰峻难。","牛马不前，","复反来还。"],["九里路翻十座山，","路途陡峭行走难。","好牛骏马不向前，","中途折回又复返。"]],[["鸠杖扶老，","衣食百口。","曾孙寿考，","凶恶不起。"],["鸠形拐杖扶老人，","百口之家衣食丰。","五世同堂皆长寿，","凶事恶事不入门。"]],[["雾露雪霜，","日暗不明。","阴孽为疾，","年谷大伤。"],["雾气露水加雪霜，","天色昏暗不明亮。","阴气作孽造病疾，","当年谷物大损伤。"]],[["迷行数却，","不知东西。","阴强暴逆，","道里不通。"],["多次迷路又回还，","不知西东和北南。","阴气强盛又暴戾，","道路受阻难向前。"]],[["登高上山，","见王自言。","信理我冤，","得职蒙恩。"],["一路攀登上高山，","拜见帝王自陈言。","请求受理我冤案，","得职蒙恩心中欢。"]],[["三世为德，","天祚以国。","封建少昊，","鲁侯之福。"],["三代行善积恩德，","上天保佑其家国。","少昊封疆建新都，","鲁国诸侯福气多。"]],[["乔木无息，","汉女难得。","橘柚请佩，","反手难悔。"],["大树下面难休息，","汉水女子难求娶。","橘柚之佩求不得，","反使交甫恨不已。"]],[["东邻西家，","来即我谋。","中告吉诚，","使君安宁。"],["左邻右舍诸老乡，","前来邀我同商量。","告我以诚召吉祥，","永世安宁无凶殃。"]],[["褰衣出户，","心欲北走。","王孙母惊，","使我长生。"],["提着衣服走出门，","打算向北而行进。","王孙勿怕莫受惊，","使我不老永长生。"]],[["三日不饮，","远水无酒。","昼夜焦喉，","使我为咎。"],["三天不喝干了口，","远离水乡又无酒。","白天黑夜喉焦枯，","使我患病成灾咎。"]],[["众口销金，","愆言不验。","腐臭败兔，","入市不售。"],["人多口杂能毁金，","言而不实失信用。","兔肉腐烂散臭气，","拿到集市利难赢。"]],[["姬冠应门，","与伯争言：东家失狗，","意我不存。","争乱忘因，","绝其所欢。"],["那位女子立门前，","与其大哥相争言：东家丢了一条狗，","认为命丧我之手。","争论纷纷无实据，","断绝友情生忧愁。"]],[["祚加明德，","与我周国。","公刘文母，","福流子孙。"],["上天圣明高尚德，","赐给我们周朝国。","公刘和那文王母，","子子孙孙多福泽。"]],[["针头刺手，","百病瘳愈。","抑按扪灸，","死人复起。"],["银色针头刺入手，","身上百病化乌有。","号脉按摩加针灸，","死人复活起来走。"]],[["元龟象齿，","在赂为宝。","稽疑当否，","衰微复起。"],["元龟和那大象牙，","以宝行贿送人家。","判断所疑妥不妥，","衰微之人又振作。"]],[["故室旧庐，","消散无馀。","不如新创，","可以乐居。"],["老房陈旧破室屋，","荡然毁之已无余。","不如重新盖新房，","可以欢乐得安居。"]],[["老狐多态，","行为蛊怪。","惊我王母，","终无咎悔。"],["狐狸狡猾多变态，","行为古怪把人害。","祖母担惊又受怕，","最终无悔亦无灾。"]],[["爱子多材，","起迹空虚。","避害如神，","水不能濡。"],["爱子多才又多艺，","行迹使我难猜疑。","避害除祸如神灵，","洪水难湿其身体。"]]],[[["白鹿鸣呦，","呼其老少。","喜彼茂草，","乐我君子。"],["白鹿原上呦呦叫，","呼唤同类老与小。","那边草儿多丰茂，","使我伙伴兴致高。"]],[["百里南行，","虽微复明。","去虞适秦，","为穆国卿。"],["百里向南去出行，","卑微之人得提升。","离开虞国到秦国，","穆公任他为相卿。"]],[["王孙宜家，","张名益有。","龙子善行，","西得大寿。"],["王孙善于理家政，","家中显赫好名声。","真龙天子善行走，","西去学仙把寿增。"]],[["画龙头颈，","文章不成。","甘言善语，","谲词无名。"],["画龙只画头与颈，","龙的花纹绘不成。","甜言蜜语虽好听，","欺诈诡辩终无名。"]],[["商子无良，","相怨一方。","引斗交争，","咎以自当。"],["商鞅其人心不良，","招来冤家一大帮。","引起格斗和争讼，","灾咎由他自担当。"]],[["衰老困极，","无齿不食。","痔病痏瘵，","就长夜室。"],["形体衰老困已极，","牙齿脱落难进食。","痔疮肺病同发作，","命丧黄泉进阴室。"]],[["鸢生会稽，","稍巨能飞。","翱翔桂林，","为众鸟雄。"],["鸢鸟出生在会稽，","稍稍长大远飞去。","桂林上空高翱翔，","雄居鸟首谁能比？"]],[["安平不倾，","载福长生，","君子以宁。"],["平平安安不覆倾，","享受幸福得长生，","好人因之得安宁。"]],[["牛骥同槽，","郭氏以亡。","国破为墟，","君奔走逃。"],["疲牛骏马同槽养，","郭氏因之而败亡。","国都破坏成废墟，","君主奔逃去他乡。"]],[["日中明德，","盛兴两国。","仁圣会遇，","君受其福，","臣多荣禄。"],["如日中天德光明，","两国兴旺又强盛。","仁人贤士相遇会，","国君蒙受大福庆，","忠臣禄位多耀荣。"]],[["公刘之居，","太王所业。","可以长生，","拜受福爵。"],["公刘所居好地方，","基业太王来开创。","可以长生不衰老，","福禄爵位永世享。"]],[["时凋岁霜，","君子疾病。","宋女无辜，","郑受其殃。"],["时序凋零降寒霜，","大人患病卧床上。","宋女没有罪与过，","郑人反而受祸殃。"]],[["济河逾厄，","脱母怵惕。","四叔为卫，","使惠不废。"],["渡河越过险要地，","解脱母亲之恐惧。","四叔来做保护神，","惠帝未能被废弃。"]],[["缺破不完，","残瘵侧偏。","公孙幽遏，","跛倚后门。"],["残缺破损不齐全，","疾病缠身患偏瘫。","王孙公子遭囚禁，","跛脚倚立于后门。"]],[["延颈远望，","眯为目病。","不见叔姬，","使伯心忧。"],["伸长脖子望远方，","望眼欲穿成目伤。","不见小妹之身影，","哥哥心中生悲伤。"]],[["上无飞鸟，","下无走兽。","扰乱未清，","民劳于事。"],["长空不见飞鸟行，","陆地没有走兽踪。","社会动乱不安宁，","百姓劳苦役事重。"]],[["久阴霖雨，","涂行泥潦。","商人休止，","市空无宝。"],["天气久阴雨连绵，","道路泥泞行走难。","商人买卖皆终止，","市场空空无东西。"]],[["盲者目张，","跛倚起行。","瞻望日月，","与主相迎。"],["瞎子张开其眼睛，","跛子起身将路行。","瞻望太阳和月亮，","又与君主喜相逢。"]],[["据斗运枢，","高步六虚。","权既在手，","寰宇可驱。","国大无忧，","与乐并居。"],["北斗围绕天枢行，","阔步上下四方中。","大权既已握在手，","寰宇任你去驰骋。","国家没有大忧患，","与乐并居多安宁。"]],[["稼穑不偏，","重适不倾；","巧言贼忠，","伤我申生。"],["耕种庄稼不偏颇，","重量适度不倾斜；","花言巧语害忠良，","长子申生遭灾祸。"]],[["金城铁郭，","上下国力。","政平民亲，","寇不敢贼。"],["铁壁铜墙严守备，","上下齐心同协力。","政通百姓来亲附，","敌寇岂敢把我欺？"]],[["日镜不明，","冬灾大伤。","盗华失实，","十年消亡。"],["天上太阳不明亮，","寒冬遭逢大灾殃。","花开不时难结果，","十年之内必消亡。"]],[["鳏寡孤独，","命禄苦薄。","入室无妻，","武子悲哀。"],["鳏寡孤独一个人，","命苦福薄无好运。","回到家中不见妻，","武子心中生悲愤。"]],[["饮酒醉酗，","跳起争斗。","伯丧叔僵，","东家治丧。"],["酒儿喝得醉醺醺，","二人跳起相争讼。","哥丧其命弟发僵，","东门邻家来治丧。"]],[["介绍微子，","使君不殆。","二国合欢，","燕齐以安。"],["举荐微子之贤才，","使君没有凶与灾。","两国合好多欢乐，","燕齐因之得安泰。"]],[["牵牛系尾，","诎折几死。","彫世无仁，","不知所比？"],["牵牛不去牵牛鼻，","牛被折腾将要死。","世道衰落无仁义，","不知如何去相比？"]],[["东龙冤毒，","不知所触。","南北困穷，","王子危急。"],["东方巨龙太冤枉，","不知得罪哪尊长。","南北山穷水又尽，","王子遇难心惶惶。"]],[["疾病王孙，","北陆无辉。","禄命苦薄，","两守孤门。"],["王孙病弱又贫穷，","北无阳光天寒冷。","福禄命运很苦薄，","刘立刘音守孤门。"]],[["公孙驾骊，","载游东齐。","延陵说产，","遗季麻衣。"],["公孙驾起大黑马，","乘车东游齐国地。","延陵季子一席话，","子产赠他麻衣衣。"]],[["王良善御，","伯乐知马。","文王东猎，","获嘉贤士。","天福佑周，","发旦兴起。"],["王良善行驾驭车，","相马之人属伯乐。","文王东行去打猎，","喜把贤士姜尚获。","天赐福运佑周朝，","武王周公兴大业。"]],[["日月不居，","重耳趋舍。","游齐入秦，","晋国是霸。"],["太阳月亮不停留，","重耳逃亡各国游。","说服齐国去破秦，","返回晋国任国君。"]],[["假文翰翼，","随风偕北。","至虞夏国，","与舜相得。","年岁大乐，","邑无盗贼。"],["但愿插上文翰翅，","随风飞到北方去。","到那虞夏国度里，","幸与大舜相团聚。","年岁丰收多欢乐，","城邑没有盗贼起。"]],[["南行北走，","延颈望食。","举止失利，","累为子孙。"],["走南闯北甚劳疲，","伸长脖子望着食。","行为举止不恰当，","累及儿子和孙子。"]],[["开市作喜，","建造利事。","平准货宝，","海内殷富。"],["开放市场迎来喜，","大兴大办利民事。","公平交易货与宝，","海内殷实又富裕。"]],[["三犬俱走，","斗于谷口。","白者不胜，","死于阪下。"],["三条猎狗一道走，","撕咬争斗于谷口。","白色狗儿吃败仗，","山坡之下把命丢。"]],[["骄胡犬形，","造恶作凶。","无所能成，","还自灭身。"],["胡人骄横如狗形，","作恶多端是元凶。","最终一事无所成，","反而落得灭自身。"]],[["拜跪赞辞，","无益于尤。","大夫顽嚣，","使我生忧。"],["磕头作揖说好语，","无益真正改过失。","官人愚蠢又顽固，","使我替他担忧虑。"]],[["辰次降娄，","王驾巡狩。","广佑施惠，","万国咸喜。"],["日入娄宿值金秋，","君王驾车来巡狩。","广施恩惠和福佑，","各国臣民乐悠悠。"]],[["牵羭上楼，","与福俱游。","躬劳治国，","安乐无忧。"],["牵着黑羊走上楼，","与福一起来漫游。","鞠躬尽瘁图治国，","百姓安乐永无忧。"]],[["白鸟衔饵，","鸣呼其子。","旋枝张翅，","来从其母。"],["白色鸟儿衔着食，","呼唤小鸟前来吃。","小鸟飞旋树枝上，","接受妈妈之哺育。"]],[["盲瞽独宿，","莫与共食。","老穷于人，","病在心腹。"],["瞎子独居度日难，","没人与其共进餐。","老来贫穷不如人，","病在内心深腹中。"]],[["登木出渊，","稍上升天。","明德孔圣，","白日载荣。"],["攀上大树走出渊，","再上一步可升天。","道德彰明大圣人，","堂堂正正享耀荣。"]],[["彭离济东，","迁废上庸。","狠戾无节，","失其宠功。"],["济东之王彭离君，","废为庶人迁上庸。","为人狠毒无节制，","失其功绩和荣宠。"]],[["赞扬上舞，","神明正气。","禹拜受福，","君施我德。"],["载歌载舞齐声颂，","君上刚正甚英明。","大禹跪拜受福祉，","明君赐我好德行。"]],[["从首至足，","部分为六。","室家离散，","逐南乞食。"],["从头一直到脚跟，","可怜分为六部分。","全家骨肉远离散，","向南讨饭去谋生。"]],[["禹凿龙门，","通利水源。","东注沧海，","人民得安。"],["大禹治水凿龙门，","上游洪水得畅通。","东流千里入大海，","天下百姓得安宁。"]],[["民迷失道，","乱我统纪。","空使乾华，","实无所有。"],["百姓迷途不识路，","乱了准则和法度。","空中花儿没有根，","果实终究结不成。"]],[["刻画为饰，","嫫母无盐；","毛嫱西施，","求事必得。"],["刻画修饰重打扮，","嫫母无盐丑容显；","毛嫱西施两美女，","愿望终于得实现。"]],[["日居月诸，","遇暗不明。","长夜丧中，","绝其纪纲。"],["日月高悬于天上，","转入地下失明亮。","黑夜长啊夜长长，","天地乱了其纪纲。"]],[["衣裳颠倒，","为王来呼。","成就东周，","封受大侯。"],["半夜衣裳穿颠倒，","君王有事急征召。","成就大业为东周，","受职封爵成大侯。"]],[["当变立权，","擿解患难。","涣然冰释，","六国以宁。"],["善于随机而应变，","排解重重患与难。","使之如冰皆消散，","六国因之得平安。"]],[["西戎獯鬻，","病于我国。","杖策之岐，","以保乾德。"],["西方戎族獯鬻族，","凶猛强悍害我邑。","扬鞭催马到岐山，","保我上天之德义。"]],[["南行逐羊，","予利喜亡。","阴孽为病，","复返其邦。"],["追逐羊儿至南方，","利益喜事皆消亡。","阴气滋生成病疾，","重新返回其故乡。"]],[["游戏仁德，","日益有福。","凶言不至，","妖孽灭息。"],["仁德之中任遨游，","年年岁岁都富有。","凶言不到此处来，","妖孽自然皆逃走。"]],[["春日新婚，","就阳日温。","嘉乐万岁，","获福大椿。"],["春光融融宜成婚，","阴阳协调日升温。","喜悦欢乐享万年，","福寿康乐如大椿。"]],[["阴升阳伏，","鬼哭其室。","相饰不食，","安巢如棘。"],["阴气上升阳气藏，","鬼哭屋内人受殃。","面无人色食不进，","房子盖在荆棘中。"]],[["臣尊主卑，","威权日衰。","侵夺无光，","三家逐公。"],["大臣尊贵君卑贱，","威严权势日削弱。","阴气侵夺太阳光，","三家逐昭奔齐国。"]],[["反言为残，","戎女生患。","乱吾家国，","父子相贼。"],["挑拨离间造灾难，","戎女带来大祸患。","搞乱我们家和国，","父亲儿子相伤残。"]],[["迎福开门，","喜随我后。","康伯恺悌，","治民以礼。"],["迎来福气打开门，","喜事与我紧相从。","康伯和乐好德行，","以礼统治老百姓。"]],[["日就月将，","昭明有功。","灵台观赏，","胶鼓作人。"],["太阳月亮天上行，","圣人文王功彰明。","灵台之上观天象，","培育人才安生灵。"]],[["百草嘉卉，","萌芽将出。","昆虫扶户，","阳明所得。"],["百种草木和好花，","萌芽出土将长大。","昆虫爬到门窗下，","太阳光芒普照它。"]],[["天所佑助，","万国日有。","福至祸去，","寿命长久。"],["上天辅助和保佑，","万国人民多富有。","幸福来到祸离去，","保君寿命得长久。"]],[["穷夫失居，","惟守弊庐。","初忧中惧，","终日兢兢，","无悔无虞。"],["穷汉失去其居处，","困守破旧茅草屋。","开始忧虑心中惧，","整天谨慎把事处，","悔恨忧虑得消除。"]],[["买玉得石，","失其所欲。"],["想要买玉却得石，","未能实现其所欲。"]]],[[["鸟鹊食谷，","张口受哺。","蒙被恩德，","长大成就。","柔顺利贞，","君臣合好。"],["母鸟衔食回巢中，","幼鸟求哺上前迎。","蒙受养育之恩德，","长大体羽多丰盈。","性情柔顺又守正，","君臣关系乐融融。"]],[["六鹢退飞，","为襄败祥。","陈师合战，","左股夷伤。","遂以薨崩，","霸功不成。"],["六鹢退飞过宋都，","襄公争霸败于楚。","陈师进军战于泓，","左股负伤不能行。","宋军战败全覆灭，","没有成就其霸功。"]],[["匍匐出走，","惊惶悼恐。","白虎生孙，","蓐收在后，","居中无咎。"],["卧地爬行逃出门，","心情惶惑又惊恐。","西方白虎生其孙，","后有蓐收司秋神，","居中没有灾与凶。"]],[["庇庐不明，","使孔德妨。","女孽乱国，","虐政伤仁。"],["身居深宫不见明，","影响孔子行德政。","女孽搅乱朝政事，","政治残暴伤害仁。"]],[["鼫鼠四足，","不能上屋。","颜氏淑德，","未有爵禄。"],["大老鼠有四只足，","无翅难能飞上屋。","颜渊德高学问深，","爵位俸禄都落空。"]],[["襄送季女，","至于荡道。","齐子旦夕，","留连久处。"],["齐国襄公送小妹，","送至鲁国大道上。","齐姜早晚思念他，","恋恋不舍久彷徨。"]],[["獐鹿逐牧，","饱归其居。","还反次舍，","乐得自如。"],["獐鹿野外相追逐，","吃饱之后归其居。","返回原来住宿处，","欢乐悠闲多自如。"]],[["望尚阿衡，","太宰周公。","藩屏辅弼，","福禄来同。"],["太公吕尚和伊尹，","官至太宰属周公。","捍卫王室辅圣君，","幸福利禄来会同。"]],[["开廓宏绪，","王迹所基。","报以八子，","功得俟时。"],["开辟宏伟大事业，","奠定君王之根基。","告诫八个好儿子，","立功应待好时机。"]],[["入会大都，","饶富有余。","安民利国，","可以长居。"],["进入繁华大都市，","财物富饶多充裕。","安定民心利国家，","可以长久居此地。"]],[["阴云四方，","日在中央。","人虽昏雾，","我独昭明。"],["阴云密布遍四方，","太阳高悬天中央。","众人被雾所迷惑，","我心惟独最明亮。"]],[["魃为灾虐，","风吹云却。","欲上不得，","复归其宅。"],["旱神无情造灾虐，","风吹浮云都退却。","云雨欲来又不能，","返回它那原室舍。"]],[["昭昭略略，","非忠信客。","言语反复，","以黑为白。"],["事理大致辨明确，","此君并非忠信客。","言语反复无常态，","能把黑色说为白。"]],[["三女为奸，","俱游高园。","背室夜行，","与伯笑言。","祸反及身，","冤无所祷。"],["三女狼狈结为奸，","一同游戏于高园。","背着丈夫夜出行，","与哥谈笑乱调情，","灾祸降临其自身，","冤死无人去同情。"]],[["涉尸留鬼，","大斧所视。","文昌司过，","简公乱死。"],["尸体堆里留鬼魂，","大斧砍向君子身。","文昌是颗司灾星，","简公因祸丧了命。"]],[["大足长股，","利出行道。","囷仓充盈。","疏齿善市，","宜钱富家，","事得万倍。"],["脚板大大腿长长，","利于出门走四方。","谷仓里面装满粮，","孩童善于去经商。","有钱家中便富有，","获利万倍诸事昌。"]],[["筐筥锜釜，","可活百里。","伊氏鼎俎，","大福所起。"],["菜筐饭锅贱人事，","可以养活百里奚。","伊尹背负庖厨具，","大福由此而临至。"]],[["升高登虚，","欲有望候。","驾之北邑，","与喜相扶。"],["步入高高大丘上，","朝那远方而眺望。","驾车到那城北去，","与喜与福两相遇。"]],[["用彼嘉宾，","政平且均。","螟虫不作，","民得安宁。"],["那位好人得重用，","处事和平又公正。","螟虫不来造灾害，","百姓困之得安宁。"]],[["桃夭少华，","婚悦宜家。","君子乐胥，","长利止居。"],["早春时节开桃花，","适合结婚宜嫁聚。","小伙心里多欢乐，","此地利于安新家。"]],[["东行失旅，","不知所处。","西归无配，","莫与笑语。"],["东行中途落了伍，","不知同伴去何处。","西归没有配偶随，","无人说笑无人陪。"]],[["玩好乱目，","巧声迷耳。","贼败贞良，","君受其咎。"],["好玩之物乱眼睛，","淫声迷耳惑好人。","奸贼谗害忠良士，","君主因之遭祸凶。"]],[["明德孔嘉，","万岁无亏。","驾龙巡狩，","王得安所。"],["光明正大德高尚，","天子美名万年扬。","驾起龙车巡四方，","君王在上多安详。"]],[["同本异叶，","安仁尚德。","东邻慕义，","来兴古国。"],["叶儿虽异根相同，","崇尚道德施仁政。","东方邻邦慕礼义，","向我周国来投奔。"]],[["戴山崔嵬，","日高无颓。","君王我德，","赐以嘉国。"],["山峰高耸不低陷，","太阳高悬不崩颠。","君王看中我品德，","赐以嘉国保平安。"]],[["筑室合欢，","千里无患。","周公万年，","佑我二人，","寿以高远。"],["建起新房合家欢，","四方安定无动乱。","周公之德万万年，","保我家人都平安，","健康长寿比南山。"]],[["养鸡生雏，","畜马得驹。","明堂太学，","君子所居。"],["畜养母鸡孵小鸡，","伺养母马得小驹。","明堂学校育人地，","贤士在此好定居。"]],[["雷行相逐，","无有休息。","战于平陆，","为夷所覆。"],["雷声滚滚相追逐，","没有片刻能歇步。","双方激战于平陆，","终被东夷所降服。"]],[["委蛇循河，","至北海涯。","涉历要荒，","君世无他。"],["沿着河道走向前，","顺流来到北海边。","跋涉经历荒漠地，","谁能与君同日言？"]],[["鸿声大视，","高举神化。","背昧向明，","以通福功。"],["鸿雁长鸣望远方，","高高飞翔蓝天上。","弃暗投向光明来，","顺利通达幸福乡。"]],[["比目四翼，","来安吾国。","福喜上堂，","与我同床。"],["比翼鸟儿高飞翔，","来到我国好地方。","幸福欢乐齐上堂，","和我同卧一张床。"]],[["先穀彘季，","反谋桓子。","不从元帅，","遂行挑战，","为荆所败。"],["先穀彘季太自信，","桓子与他谋不同。","不从元帅之命令，","自行出兵把敌攻，","最终败给楚国军。"]],[["三头六足，","欲盗东国。","颜子在庭，","祸灭不成。"],["妖怪三头六只脚，","图谋盗窃去东国。","德高之人颜渊在，","欲想行凶未能得。"]],[["缘山升木，","中堕于谷。","子车失劳，","黄鸟哀作。"],["登上高山爬上树，","中途坠入深山谷。","子车成为殉葬人，","黄鸟为他悲声哭。"]],[["南有嘉鱼，","驾黄取鱏。","鲂鲤泏泏，","利来无忧。"],["南方水乡多好鱼，","驾起黄牛去拉取。","鲂鱼鲤鱼聚满池，","欢欢喜喜获大利。"]],[["邃气作云，","蒙覆大君。","塞聪闭明，","殷人贾伤。"],["天高雾重化乌池，","阴霓笼罩我大君。","堵塞耳朵蒙上眼，","殷人经商利难盈。"]],[["举翅摅翼，","跂望南国。","延颈却缩，","未有所得。"],["展开翅膀鼓双翼，","翘起脚跟望南国。","伸长脖子又缩回，","双手空空无所得。"]],[["坎中蝦蟆，","乍盈乍虚。","三夕二朝，","形消无余。"],["月宫之中有虾蟆，","忽盈忽虚难见它。","三天两日多变幻，","虾蟆形影渐消散。"]],[["重弋射隼，","不知所定。","质疑耆龟，","孰可避之？","国安上乐，","宜利止居。","兵寇不至，","民无骚扰。"],["系绳之箭射猛禽，","不知方位如何定。","释我疑惑求占卜，","怎样才能避祸凶？","国民平安君上乐，","在此居住很顺心。","兵匪不会来临至，","人民无忧亦无惊。"]],[["阴淫寒疾，","水流其室。","舟楫大作，","伤害黍稷。","民饥于食，","不无病厄。"],["阴气过盛寒生疾，","洪水乱流冲入室。","出门要坐大船行，","谷物遭灾无收益。","百姓饥饿无粮食，","造成饥荒和瘟疫。"]],[["离友绝朋，","巧言谗匿。","覆白污玉，","颜叔哀哭。"],["朋友关系相绝断，","全怪巧语和谗言。","颠倒黑白污美玉，","颜叔因之空悲叹。"]],[["童女无媒，","不宜动摇。","安期室庐，","傅母何忧。"],["少女年幼未婚配，","不应动摇其心扉。","安守在家莫胡思，","保姆无忧少破费。"]],[["作凶造患，","北檄困贫。","东与祸连，","伤我左跟。"],["恶人作凶造灾患，","北方边境有危难。","东去灾祸不间断，","我的左脚受伤残。"]],[["东南其户，","风雨不处。","睆仁人，","父子相保。"],["门窗朝那东南开，","风儿雨儿进不来。","眼明目亮之仁人，","父子双双相关怀。"]],[["被发兽心，","难与比邻。","来如飘风，","去似绝弦，","为狼所残。"],["肩披长发野兽心，","很难与之为近邻。","来时匆匆如风吹，","去似箭从弦上奔，","最终被狼所残吞。"]],[["天覆地载，","日月运照。","阴阳允作，","方内四富。"],["皇天覆盖地承载，","日月运行照人间。","阴阳变化有规律，","国内四方富且安。"]],[["席多针刺，","不可以卧。","却则有悔，","言行惧过。"],["铺席之上针刺多，","使君无法坐与卧。","区区动作即生悔，","言语行动皆出错。"]],[["桀乱无道，","民散不聚。","背室弃家，","君孤出走。"],["夏桀荒淫又无知，","百姓纷纷离他去。","背井离乡弃家室，","孤君出走逃异域。"]],[["申酉稷射，","阴慝荫作。","柯葭载牧，","泥途不白。"],["申酉时辰日西斜，","阴气转盛又萌作。","肩挑苇草行路上，","泥路昏暗莫走错。"]],[["踝踵足伤，","右指病疡。","失旅后时，","利走不来。"],["脚踝后跟受了伤，","右手指上生毒疮。","错过机会误了时，","利益逃奔到他乡。"]],[["四足俱走，","驽疲在后。","俱战不胜，","败于东野。"],["战马奋蹄急奔走，","劣马疲劳跟在后。","屡次作战未获胜，","最终败于郊野中。"]],[["涂行破车，","丑女无媒。","莫适为偶，","孤困独居。"],["车儿残破难行路，","丑女无媒难嫁出。","没有谁人愿娶她，","孤单困苦独自居。"]],[["拊髀大笑，","不知忧惧。","开立大路，","为王所召。"],["拍着大腿开怀笑，","忧愁恐惧全抛掉。","光明大道得开辟，","君王传令把我召。"]],[["伯圭东行，","与利相逢。","出既遭时，","孰不相知？"],["商人伯圭向东行，","与那大利喜相逢。","出门遇到好时运，","谁人不知君大名！"]],[["东行贼家，","郑伯失辞。","国无贞良，","君受其殃。"],["东行害了自己家，","郑伯失口说错话。","国家没有忠良将，","好人无辜遭灾殃。"]],[["前屈后曲，","形体饬急。","绞黑大索，","困于请室。"],["前面弯弯后边曲，","身体紧紧被捆起。","又粗又黑大绞索，","困于大臣待罪室。"]],[["鼓翼大喜，","行婚饮酒。","嘉彼诸姜，","乐我皇考。"],["欢天喜地舞又歌，","结婚饮酒同庆贺。","美女贤惠又漂亮，","皇祖在上乐呵呵。"]],[["狐嘈向城，","三旦悲鸣，","邑主大惊。"],["狐狸向着城悲鸣，","接连三天叫不停，","守城官儿受大惊。"]],[["明德克敏，","重华贡举。","放勋征用，","濬哲蒙佑。"],["道德彰明又聪敏，","帝舜荐举得贤臣。","唐尧前来被征用，","哲人得佑蒙恩宠。"]],[["秋隼冬翔，","数被严霜。","甲兵充庭，","万物不生。","鸡犬夜鸣，","民人扰惊。"],["深秋初冬鸟飞翔，","频频受袭于寒霜。","铠甲兵器充满庭，","万物难以再生长。","夜半狗叫鸡长鸣，","百姓受惊难安详。"]],[["丝布帛，","人所衣服。","掺掺女手，","纺绩善织。","南国饶足，","取之有息。"],["丝麻原料织布帛，","人们用它将衣做。","那双纤细巧女手，","纺纱织布多又多。","南方富饶又丰足，","取之不尽用不绝。"]],[["凤有十子，","同巢其母。","仁圣在位，","欢以相保，","兴彼周鲁。"],["凤凰拥有十个子，","母子同巢居一起。","仁人智士居高位，","相互保护相扶持，","周鲁两国得兴起。"]],[["雄鸡不晨，","雌鸣且呻。","志庇心离，","三旅生哀。"],["公鸡早上不司晨，","母鸡鸣叫且呻吟。","壮志未酬心不宁，","三闾大夫生悲愤。"]],[["光祀春城，","陈宝鸡鸣。","阳明失道，","不能自守，","消亡为咎。"],["夜来光辉祀春城，","陈仓神鸡高叫鸣。","阳光灿灿离道行，","不能自守其本分，","最终消亡成灾凶。"]]],[[["左辅右弼，","金玉满堂。","常盈不亡，","富如敖仓。"],["左右辅助有智囊，","金银宝玉满庭堂。","长久盈余不亏损，","财富多多如敖仓。"]],[["雨师娶妇，","黄岩季女。","成礼既婚，","相呼南去。","膏泽田里，","年岁大喜。"],["雨师娶来新媳妇，","她是黄岩小女子。","举行仪礼既成婚，","夫妇相呼朝南去。","普降甘霖润田地，","年年岁岁有大喜。"]],[["螟虫为贼，","害我嘉谷。","尽禾殚麦，","秋无所得。"],["田间螟虫造灾殃，","庄稼全都受残伤。","毁坏谷子和小麦，","秋无收成闹饥荒。"]],[["跛躄难步，","迟不及舍。","露宿泽陂，","亡其襦袴。"],["两腿跛瘸难走行，","迟迟不能回家中。","露宿山坡湖泽旁，","衣裤丢失无处寻。"]],[["大夫祈父，","无地不涉。","为吾相土，","莫如韩乐。","可能居止，","长安富有。"],["大夫司马去巡行，","没有地方不光临。","为我选择好居处，","惟独韩国最适应。","可以长期来定居，","能保平安福恒通。"]],[["少孤无父，","长失慈母。","悖悖茕茕，","莫与为耦。"],["少年孤独没有父，","长大失去慈祥母。","孤苦伶仃独自过，","生活与谁来共度？"]],[["侧弁醉客，","长舌作凶。","披发夜行，","迷乱相误，","亡失居止。"],["歪戴帽子醉醺醺，","多嘴长舌惹祸凶。","肩披乱发黑夜行，","精神迷乱甚昏庸，","难能找到自家门。"]],[["马惊车破，","王坠深津。","身死魂去，","离其室庐。"],["车子摔破马儿惊，","王孙掉入深谷中。","身体死亡魂离去，","可怜永别自家门。"]],[["东行述职，","征讨不服，","侵齐伐陈。","衔璧为臣，","大得意还。"],["向东行驶去求职，","前往征讨不服人，","入侵齐国又伐陈。","口衔玉璧为大臣，","得意洋洋回朝中。"]],[["百足俱行，","相辅为强。","三圣翼事，","王室宠光。"],["一群马蚣行路上，","相互辅助力盛强。","三位圣人来辅佐，","君王庭室显宠光。"]],[["本根不固，","花叶落去，","更为孤妪。"],["树根无扶不牢固，","花儿叶子皆飘浮，","树干光秃如孤妇。"]],[["牧羊稻园，","闻虎喧欢。","畏惧怵惕，","终无祸患。"],["放牧羊儿于稻园，","骤然听到虎声喧。","担惊受怕而警惕，","终于未能成祸患。"]],[["履位乘势，","靡有绝弊。","为隶所图，","与从庶位。"],["登上高位凭权势，","不思退路不讳避。","受到部下所暗算，","贬为庶民冠落地。"]],[["大舆多尘，","小人伤贤。","皇甫司徒，","使君失家。"],["大车滚滚扬起尘，","小人卑鄙伤贤能。","皇甫卿士与司徒，","使君失去其家庭。"]],[["安如泰山，","福禄屡臻。","虽有狼虎，","不能危身。"],["身心安定如泰山，","福禄接连不间断。","虽有狼虎来逞凶，","我独不会受伤残。"]],[["同气异门，","各别西东。","南与凶遇，","北伤其孙。"],["气质相同门户异，","分别居住东和西。","往南和那凶相遇，","往北伤害其孙子。"]],[["蚬见不祥，","祸起我乡。","行人畏惧，","邑客逃藏。"],["见到蚬虫不吉祥，","预兆灾祸起我乡。","行人畏惧皆逃亡，","城里客人都躲藏。"]],[["养虎畜狼，","必见贼伤。","无事招祸，","自取灾殃。"],["饲养恶虎和豺狼，","必然受到其残伤。","无事生非招来祸，","自吃苦头造灾殃。"]],[["顺风吹火，","牵骑骥尾。","易为功力，","因权受福。"],["顺着风儿吹大火，","牵着尾巴骑马骡。","轻而易举见功力，","依赖权势享福泽。"]],[["五岳四渎，","润洽为德。","行不失理，","民赖恩福。"],["五座大山四条河，","浸润恩泽为仁德。","行为不失其常理，","人民赖此享福泽。"]],[["延陵聪敏，","乐听太史。","鸡鸣大国，","姜氏受福。"],["延陵季子甚聪明，","太史陪他听齐风。","雄鸡司晨大国中，","姜氏受福蒙大恩。"]],[["神鸟五色，","凤凰为主。","集于王国，","使君得所。"],["天上神鸟五种色，","瑞鸟凤凰做主客。","飞来集于我王国，","使君得到好处所。"]],[["媒妁无明，","虽期不行。","齐女长子，","乱其纪纲。"],["媒人没有先见明，","约定婚期未出行。","齐女伙同襄公子，","挑拨是非乱朝政。"]],[["明月作昼，","大人失居。","众星宵乱，","不知所据。"],["月儿灿灿如白天，","大人失居心不安。","群星零乱满夜空，","没有依托甚艰难。"]],[["少康兴起，","诛浇复祖。","微灭复明，","享祀大禹。"],["帝王少康振作起，","诛杀奸浇复其祖。","夏朝衰而得复兴，","大禹重新享祭祀。"]],[["千门万户，","大福所处。","黄屋左纛，","龙德独有。"],["千家万户集一堂，","大福所聚好地方。","皇车左面立大旗，","惟我天子所独享。"]],[["乾作圣男，","坤为智女。","配合成就，","长生得所。"],["乾天象征男子汉，","坤地象征女智贤。","男欢女爱成一家，","幸福长生永世安。"]],[["羿张乌号，","彀射天狼。","钟鼓夜鸣，","将军壮心。","柱国雄勇，","斗死荥阳。"],["后羿张开乌号弓，","欲射长空天狼星。","钟鼓深夜齐鸣响，","将军立志树雄心。","柱国纪信真英勇，","拼搏斗死荥阳城。"]],[["炙鱼棝斗，","张伺夜鼠。","不忍香味，","机发为祟，","笮不得去。"],["棝斗之中置烤鱼，","引诱老鼠夜来食。","不忍香味之诱惑，","触动机关受束缚，","困于绳索难逃脱。"]],[["高飞不视，","贪饕所在。","臭腐为患，","自害其身。"],["飞鸟不来此光顾，","因是老饕之居处。","贪食腥臭腐烂物，","自作自受招灾祸。"]],[["铅刀攻玉，","坚不可得。","单尽我力，","胝胼为疾。"],["铅刀刻玉不锋利，","难以雕刻我美玉。","消耗竭尽全身力，","手上结茧成病疾。"]],[["方喙宣口，","圣智仁厚。","解释倒悬，","家国大安。"],["生得方唇又阔口，","仁智贤明很敦厚。","能为民众解忧难，","家事国事皆大安。"]],[["蜘蛛南北，","巡行网罟。","杜季利兵，","伤我心旅。"],["蜘蛛往来而穿行，","结网待敌来入侵。","杜伯红弓作利器，","射至宣王心脊中。"]],[["公孙之政，","惠而不烦。","乔子相国，","终身无患。"],["公孙子产理朝政，","惠政得以广施行。","子产担任郑国相，","终身没有祸与凶。"]],[["弧矢大张，","道绝不通。","小人寇贼，","君子壅塞。"],["暴客张开弧形弓，","使得道路不畅通。","坏人当道来作乱，","好人欲前不能成。"]],[["藏戟之室，","封豕受福。","充泽肥腯，","子孙蕃息。"],["原本是个兵器室，","大猪承蒙好福气。","长得润泽又肥壮，","子孙繁殖得生息。"]],[["八子同巢，","心劳相思，","虽苦无忧。"],["八子住宿同一室，","劳累操心常相思，","虽然辛苦无忧虑。"]],[["循理举手，","举求取予。","六体相摩，","终无咎殃。"],["遵循常理重道德，","行为举止有准则。","勤劳致富生活好，","终究不会招灾祸。"]],[["公子王孙，","把弹摄丸，","发辄有获，","家室饶足。"],["贵族公子和王孙，","擅长拉弦射弹弓。","弹丸发出即有获，","家中猎物饶又丰。"]],[["井渚有悔，","渴蜺为怪。","不亟徙乡，","家受其殃。"],["井水枯竭有凶灾，","干渴之蝉在作怪。","倘若不快迁别地，","家中将要受其害。"]],[["郑会细声，","国乱失倾。","弘明早见，","止乐不听。"],["郑风郐风诲淫声，","国家动乱将覆倾。","远见卓识早预知，","废止此乐不去听。"]],[["穿室凿墙，","不直生讼。","褰衣涉露，","虽劳无功。"],["穿屋凿墙入我门，","愤愤不平起争讼。","提起衣裳涉晨露，","虽然劳苦却无功。"]],[["脱卵免乳，","长大成就。","君子万年，","动有利得。"],["卵生动物断了奶，","已经长大成了才。","君子仁德传万年，","行动即有利益来。"]],[["五心乖离，","各引是非。","莫适为主，","道路塞壅。"],["五个人儿五条心，","是是非非由此生。","前进后退难确定，","途中受阻不得行。"]],[["百柱载梁，","千岁不僵。","大愿辅福，","文武以昌。"],["百根柱子载大梁，","永世千年不倾僵。","胸怀大志来辅佐，","文王武王事业昌。"]],[["营城洛邑，","周公所作。","世逮三十，","年历七百。","福佑丰实，","坚固不落。"],["洛邑之地造城池，","周公为此来奠基。","传世及达三十代，","前后经历七百载。","幸福得佑多丰实，","坚强牢固不衰败。"]],[["从叔旅行，","食于东昌。","嘉伯悦喜，","与我芝香。"],["跟随叔叔去他乡，","下榻就餐于东昌。","表哥见了很高兴，","送我一朵大芝香。"]],[["踬跛未起，","失利后市，","不得鹿子。"],["跌倒未能再爬起，","失去机会后到市，","不得鹿子未获利。"]],[["失耳聋蔽，","不晓声味。","委以鼎俎，","方始乱溃。"],["耳朵失去其功能，","声音味道分不清。","倘若委其以重任，","必将搞乱我朝政。"]],[["訾陬开门，","鹤鸣弹冠。","章甫进用，","舞韶和鸾。","三仁翼政，","国无灾殃。"],["訾陬氏女打开门，","鹤声嘹亮弹冠庆。","贤士加冕得重用，","舞乐伴随銮铃声。","三位仁人辅政事，","国家永世享太平。"]],[["游魂六子，","百木所起。","三男从父，","三女随母。","至巳而反，","各得其所。"],["魂气游散生六子，","树木万物滋生起。","三个男儿从其父，","三女随母不分离。","运行巳位又返回，","各有位置和顺序。"]],[["南山兰茞，","使君媚好。","皇女长妇，","多孙众子。"],["南山兰花白芷草，","使君娇媚更美好。","皇家女儿成长妇，","子孙众多真热闹。"]],[["黄虹之野，","贤君在位。","管叔为相，","国无灾殃。"],["黄虹抱日之郊野，","清官在位来掌舵。","管叔辅佐齐桓公，","国家没有灾与祸。"]],[["穿凿道路，","为君除舍。","开辟福门，","喜在我邻。"],["条条道路得开通，","来为君王清宫廷。","开辟幸福利禄门，","喜事就在我东邻。"]],[["商风数起，","天下昏晦，","旱魃为虐，","九土兵作。"],["秋风阵阵吹不停，","天地阴暗昏沉沉。","旱魃在上造灾虐，","八方兵起战事凶。"]],[["自卫反鲁，","时不我与。","冰炭异室，","仁道隔塞。"],["孔子自卫返鲁国，","自叹时运不利我。","冰炭难能置一室，","仁义之道被隔绝。"]],[["春阳生草，","夏长条肄。","万物蕃滋，","充实益有。"],["春风习习催青草，","夏日烈烈长枝条。","万物繁衍又滋生，","果实饱满真富饶。"]],[["大蛇奔走，","俱入茂草。","惊于长注，","畏惧啄口。"],["大蛇飞速向前行，","钻进茂密草丛中。","频繁受惊防侵害，","惧怕猛禽啄其身。"]],[["明月照夜，","使暗为昼。","国有仁贤，","君尊如故。"],["明月空中高高悬，","黑夜变成大白天。","国有仁人和贤士，","君受尊宠如当年。"]],[["避蛇东走，","反入虎口。","制于爪牙，","骨为灰土。"],["为避毒蛇朝东走，","反而又入恶虎口。","被其爪牙所制服，","可怜骨肉成灰土。"]],[["倾迭不行，","弱走善僵。","孟絷无良，","失其宠光。"],["走起路来跌又撞，","软弱无力易倾僵。","孟絷其人心不良，","失去尊宠和荣光。"]],[["十羊俱见，","黄头为首。","岁美民安，","国乐无咎。"],["十只羊儿同出现，","领头黄羊走在前。","年岁美好人民安，","国家欢乐无灾难。"]],[["望风入门，","来到我邻，","吾养均。"],["闻到风声来登门，","大步流星入东邻，","食物正好有我份。"]],[["登高车返，","视天弥远。","虎口不张，","害贼消亡。"],["登高入座驱车返，","遥望天际路漫漫。","恶虎不再张凶口，","害贼远离我身边。"]]],[[["高原峻山，","陆土少泉。","草木林麓，","喜得所蓄。"],["高高原野和大山，","陆地之上少水泉。","山下草木多茂密，","牧牛蓄马笑开颜。"]],[["一门二关，","结缉不便。","峻道异路，","日暮不到。"],["一扇门上两道闩，","出入开关不方便。","路途险峻岔道多，","日落西山未回还。"]],[["忧患解除，","喜至庆来。","坐立欢门，","与乐为邻。"],["忧愁患难远离身，","福喜吉庆都降临。","坐立欢乐之门庭，","与欢与乐成近邻。"]],[["殊类异路，","心不相慕。","牝牛牡猳，","鳏无室家。"],["不同动物不同路，","两条心儿不相慕。","母牛和那大公猪，","鳏寡自居甚孤独。"]],[["太王为父，","季历孝友。","文武圣明，","仁政兴起。","旦隆四国，","载福绥厚。"],["古公亶父为父亲，","儿子季历很孝顺。","文王武王都圣明，","仁厚德政广施行。","周公勤劳国兴盛，","福气利禄厚又丰。"]],[["临河求鲤，","燕婉失饵。","屏气摄息，","不得鲤子。"],["垂钩钓鱼河岸旁，","放置诱饵待上当。","屏住呼吸静下心，","小小鲤鱼游远方。"]],[["买利求福，","莫如南国。","仁德所在，","金玉为质。"],["获取利益求幸福，","无地能比南国土。","仁义道德由此生，","金玉作礼送亲人。"]],[["白虎赤愤，","窥观王庭。","宫阙被甲，","大小出征。","天地烦溃，","育不能婴。"],["白虎发怒势汹汹，","张牙舞爪入朝廷。","宫中兵士齐武装，","个个迎头去出征。","天地之间乱纷纷，","初生婴儿不得宁。"]],[["子车针虎，","善人危殆。","黄鸟悲鸣，","伤国无辅。"],["子车针虎将灭身，","贤士没有好处境。","黄鸟悲痛苦哀鸣，","国家受难无辅臣。"]],[["两目失明，","日暮无光。","胫足跛曳，","不可以行，","顿于丘旁。"],["两只眼睛全失明，","日落西山近黄昏。","腿儿脚儿不灵便，","没有办法将路行，","大丘旁边受困顿。"]],[["罗网四张，","鸟无所翔。","征伐困极，","饥寒不食。"],["撒下天罗和地网，","鸟儿无法高飞翔。","出征之人多困顿，","忍饥受寒无食粮。"]],[["伯夷叔齐，","贞廉之师。","以德防患，","忧祸不存。"],["贤臣伯夷和叔齐，","贞洁清廉之大师。","仁德用以防忧患，","灾祸荡然皆消失。"]],[["疾贫望幸，","贾贩市井。","开牢择羊，","多得大牂。"],["贫穷盼望福上堂，","贾人出门去经商。","打开圈门挑选羊，","得到许多大母羊。"]],[["南山之杨，","其叶牂牂。","嘉乐君子，","为国宠光。"],["南山之上大白杨，","枝叶茂密长势旺。","谦谦君子有声望，","他为国家争荣光。"]],[["东壁余光，","数暗不明。","主母嫉妒，","乱我事业。"],["东壁二星透余光，","屡屡昏暗不明亮。","主母嫉妒又猖狂，","使我事业乱了章。"]],[["迷行晨夜，","道多湛露。","瀸我襦袴，","重难以步。"],["拂晓时分迷了路，","道上露水湿漉漉。","浸湿我的衣和裤，","腿儿沉沉难行步。"]],[["目足动，","嘉喜有顷，","举家蒙宠。"],["眼跳脚动是吉兆，","喜事顷刻即来到，","全家蒙宠得荣耀。"]],[["鹰鹞欲食，","雉兔困急。","逃头见尾，","为害所贼。"],["老鹰鸽子来寻食，","野鸡小兔甚危急。","头部伏藏尾部露，","终被猛禽残害死。"]],[["鼻移在顶，","枯叶伤生，","下朽上荣。","家扰不宁，","失其金城。"],["鼻子移到后脖颈，","枯叶伤损难再生，","树枝虽嫩朽了根。","家受骚扰不安宁，","可怜失去我金城。"]],[["飞不远去，","法为网待，","禄养未富。"],["本领不大难飞远，","法网恢恢在眼前，","不能发财难升官。"]],[["倒基败宫，","重舌作凶。","被发夜行，","迷乱相误，","亡失居止。"],["基础倾倒毁殿堂，","长舌作恶逞凶狂。","黑夜肩披长发行，","身心迷乱误事情，","失掉居所难安身。"]],[["亥午相错，","败乱绪业，","民不得作。"],["白天黑夜两相错，","败坏头绪乱事业，","百姓无法去劳作。"]],[["野麋畏人，","俱入山谷。","命短不长，","为虎所得，","死于牙腹。"],["长尾鹿儿惧怕人，","纷纷射入山谷中。","命运注定寿不长，","终被恶虎所残伤，","不幸死于虎口腔。"]],[["冬秋探巢，","不得鹊雏。","衔指北去，","愧我少姬。"],["秋冬季节掏鸟巢，","幼雀一只未得到。","口噙指头向北去，","面对少妻真害臊。"]],[["双凫俱飞，","欲归稻池。","经涉萑泽，","为矢所射，","伤我胸臆。"],["两只野鸭一起飞，","欲回稻田食粒穗。","经过芦苇沼泽地，","暗箭射中我心扉，","伤身失意事不遂。"]],[["天门开辟，","牢户廖廓。","桎梏解脱，","拘囚纵释。"],["上天之门已开辟，","牢狱之户得开启。","身上枷锁得解脱，","囚禁之人得获释。"]],[["尼父孔丘，","善钓鲤鱼。","罗纲一举，","得获万头，","富我家居。"],["尼父其名曰孔子，","喜欢前去钓鲤鱼。","大绳一举网眼张，","获得万条鲜美鱼，","我家日子多富裕。"]],[["彭生为豕，","暴龙作贼。","盗尧衣裳，","桀跖荷兵。","青禽照夜，","三旦夷亡。"],["公子彭生变为猪，","暴龙前来造灾殃。","夏桀盗跖扛着枪，","窃走圣人尧衣裳。","青鸟放光照黑夜，","三日之后便夭亡。"]],[["华言风雨，","乱相诳误。","终无凶事，","安宁如故。"],["流言蜚语纵生处，","相互欺诈多谬误。","终究未出凶险事，","平安宁静如当初。"]],[["逃颈见足，","身困名辱。","欲隐避仇，","为害所贼。"],["缩起脖子露着足，","身受困扰名受辱。","想要隐伏避仇人，","却被仇人伤其身。"]],[["无足断跟，","居处不安，","凶恶为残。"],["断了脚跟无足人，","所居之地不安宁，","凶恶残暴皆降临。"]],[["三人俱行，","北求大牂。","长孟病足，","倩季负粮。","柳下之宝，","不失我邦。"],["兄弟三人同北上，","前去寻求大母羊。","孟皮脚上患了病，","请求季路来扛粮，","柳下维护其宝鼎，","安然不失我国邦。"]],[["退飞见祥，","伤败毁坠。","守小失大，","功名不遂。"],["鹢鸟退飞兆有凶，","襄公战败伤于泓。","为守小利失大业，","功名不成意灰冷。"]],[["持心瞿目，","善摇数动，","不安其处。","散涣府藏，","利得无有。"],["心存不良目惊视，","善于钻营搞投机，","不能安守自家室。","府库宝藏皆涣散，","最终未能获大利。"]],[["牵尾不前，","逆理失臣，","惠朔以奔。"],["尾巴受制难行进，","违背公理失众臣，","惠公因之向齐奔。"]],[["禄如周公，","建国洛东，","父子俱封。"],["幸福利禄如周公，","营建国都于洛东，","父子双双俱受封。"]],[["君有八人，","信允笃诚，","为尧所举。"],["君子幸有八贤人，","忠信诚实又公允，","唐尧荐举得重用。"]],[["久阴霖雨，","泥涂行潦。","商人休止，","市空无宝。"],["细雨绵绵天不晴，","路上泥泞难出行。","商人在家闲休止，","集市空空无营生。"]],[["无足断跟，","居处不安，","凶恶为残。"],["断了脚跟无足人，","所居之处不安宁，","遭受凶恶和酷刑。"]],[["马蹄踬车，","妇恶破家。","青蝇污白，","恭子离居。"],["马蹄绊倒翻了车，","主妇凶恶家败破。","青色苍蝇污白色，","恭子被害离其舍。"]],[["噂噂所言，","莫如我垣。","欢喜坚固，","可以长安。"],["你言我语乱纷纷，","没谁能如我坚定。","防守坚固君欢乐，","可以长治久安宁。"]],[["懿公浅愚，","不受深谋。","无援失国，","为狄所贼。"],["懿公浅薄又愚蠢，","深谋远虑他不听。","没有后援亡了国，","狄人入侵君北奔。"]],[["骐骥绿耳，","章明造父。","伯夙奏献，","衰续厥绪。","佐文成霸，","为晋元辅。"],["穆王出行乘良马，","造父为其来驭驾。","伯夙进事晋献公，","赵衰承祖业发达。","辅助文公成霸业，","成为晋国大管家。"]],[["驾车入里，","求鲜鲂鲤。","非其肆居，","自令后市。"],["驾车行至居住地，","想买鲂鱼和鲤鱼。","居处并非鲜鱼市，","自己误了好时机。"]],[["求獐嘉乡，","恶地不行。","道止中返，","复还其床。"],["前去圣地买香獐，","罪恶之地不寻访。","行至中途又返回，","复归原来旧地方。"]],[["杖鸠负装，","醉卧道旁。","不知何公，","窃我锦囊。"],["扶着拐杖背行装，","醉后卧于大路旁。","不知何公来身边，","盗走我的钱财囊。"]],[["登昆仑，","入天门，","过糟丘，","宿玉泉。","同惠欢，","见仁君。"],["登入高高昆仑山，","步入天宫之门槛，","经过那个糟丘地，","住宿就在玉泉边。","同享恩惠与欢乐，","见到仁爱圣君面。"]],[["水为火牡，","患厌不起。","季伯夜行，","与喜相逢。"],["水被大火严锁封，","受其控制难流动。","季家大哥夜出行，","与那喜事恰相逢。"]],[["马服长股，","宜行善市。","蒙佑谐偶，","获金五倍。"],["驾车马儿腿长长，","利于市场去经商。","承蒙保佑得配偶，","获得大利乐悠悠。"]],[["乌孙氏女，","深目黑丑。","嗜欲不同，","过时无耦。"],["乌孙家的大姑娘，","眼深脸黑不漂亮。","习惯爱好不相同，","超过年龄没对象。"]],[["子鉏执麟，","春秋作经。","元圣将终，","尼父悲心。"],["子鉏打猎获麒麟，","孔子写作春秋经。","元圣即将离人世，","尼父悲哀又伤心。"]],[["灼火泉源，","钓鲂山巅。","鱼不可得，","火不可燃。"],["燃火去那水泉间，","钓鱼到那高山巅。","鱼儿一条得不到，","水中点火不能燃。"]],[["天马五道，","炎火久处。","往来上下，","作文约已。","衣枲丝麻，","相随笑歌，","凶恶如何。"],["纸作神马置路口，","大火熊熊不熄灭。","火焰上下齐飞蹿，","祭文诵后方停歇。","披麻戴孝尽子道，","相随默哀又哭歌，","凶恶临头无奈何。"]],[["鸱鸮破斧，","冲入危殆。","赖旦忠福，","转祸为福，","危倾复立。"],["鸱鸮破斧幽风歌，","年轻人儿危难多。","幸赖周公有忠德，","除去祸害招福泽，","危难之人得欢乐。"]],[["牡飞关启，","忧患大解，","不为身祸。"],["大锁落地关门开，","忧患解除不再来，","自身不会受祸灾。"]],[["石门晨门，","荷蒉食贫。","遁世隐居，","竟不逢时。"],["鲁都外城守门人，","挑筐之士受贫穷。","逃离尘世去隐居，","未能逢时得重用。"]],[["兔聚东郭，","众犬俱猎。","围缺不成，","无所能获。"],["狡兔聚集于东郭，","一群猎狗去捕捉。","围攻不成有缺口，","终究没有能捕获。"]],[["三羊群走，","雉兔惊骇。","非所畏惧，","自令劳苦。"],["三只羊儿朝前行，","野鸡兔子俱受惊。","羊儿并非是敌人，","鸡兔劳苦枉费心。"]],[["羽翮病伤，","无以为强。","宋公德薄，","败于水泓。"],["鸟儿翅膀受创伤，","没有能力去逞强。","襄公德性很浅薄，","战败在那泓水旁。"]],[["姬姜稚叔，","三人偶食。","论仁义福，","以安王室。"],["周公姜尚和稚叔，","三人同坐共进食。","讨论仁义和福祉，","寻求良策安王室。"]],[["精诚所在，","神人为辅。","德教之中，","弥世长久。","三圣乃兴，","多受福祉。"],["内心宽广又真诚，","天神下凡辅圣君。","道德教化在其中，","世代长久享安宁。","三位圣人兴邦国，","福及平民老百姓。"]],[["岐周海隅，","独乐不忧。","可以避难，","全身保才。"],["岐山之下北海隅，","独有欢乐无忧虑。","可以前往避患难，","保全人财得平安。"]],[["孤独特处，","莫依为辅，","心劳志苦。"],["一人孤独而居住，","没有谁来帮与扶，","心志劳累甚悲苦。"]],[["顾望登台，","意常欲逃。","贾辛丑恶，","妻不安夫。"],["登上高台回头望，","心中常想要逃亡。","贾辛长相太丑恶，","妻难专心伴君郎。"]]],[[["顷筐卷耳，","忧不能伤。","心思古人，","悲慕失母。"],["采来卷耳一浅筐，","不让心里老悲伤。","长相思念我亲人，","悲恋慈母离身旁。"]],[["郤叔贾贷，","行禄多悔，","利无所得。"],["郤氏是位生意人，","贪财求禄多悔恨，","最终使得利难赢。"]],[["蹶足狂跛，","怪碎不行。","弃捐乎人，","名字无申。"],["跛脚颠跌狂妄人，","奇异古怪难走行。","抛弃他那无用者，","永世千年不彰明。"]],[["文王四乳，","仁爱笃厚。","子畜十男，","夭折无有。"],["文王身有四乳头，","仁慈博爱且笃厚。","精心抚育十男儿，","个个健康又长寿。"]],[["容民畜众，","不离其居。"],["容留畜养众百姓，","使其安居愿遂心。"]],[["三雏相逐，","蝇坠釜中。","灌沸淹殆，","与母长决。"],["三只小鸡追苍蝇，","苍蝇坠入热锅中。","沸水滚汤毙其命，","与母辞别永离分。"]],[["所望在外，","鼎令方来。","拭爵涤罍，","炊食待之，","不为季忧。"],["企盼希望皆在外，","大令今日方传来。","洗好酒杯备好菜，","做好美食安心待，","不愁小弟回不来。"]],[["陆居少泉，","高山无云。","车行千里，","涂污尔轮，","亦为我患。"],["陆地少泉无水井，","高山之上没有云。","车子一日行千里，","路途污泥沾满轮，","事事都与我作梗。"]],[["东家杀牛，","闻臭腥臊。","神背西顾，","命衰绝周。","亳社灾烧，","宋人夷诛。"],["东家杀牛祭神灵，","脏臭腥臊太难闻。","神背东邻向西望，","殷命已衰周朝兴。","亳社遇灾被火烧，","宋国之人招杀身。"]],[["长子入狱，","妇馈母哭。","霜降旬日，","向晦伏法。"],["长子被捕入监狱，","儿媳送饭母哭泣。","霜降之后第十日，","处以死刑入地狱。"]],[["温山松柏，","常茂不落。","凤凰以庇，","得其欢乐。"],["温山之上有松柏，","常年茂盛不落叶。","凤凰以此作庇护，","尽情享受其欢乐。"]],[["大屋之下，","朝多君子。","德施溥育，","宋受其福。"],["房屋宽敞又明亮，","朝中君子聚一堂。","广施德政育人民，","宋国受福多安详。"]],[["罗张目抉，","围合耦缺，","鱼鸟生脱。"],["罗网张开网眼破，","围合捕射则耦缺，","鱼儿鸟儿皆逃脱。"]],[["羔裘豹祛，","高易我宇。","君子维好，","至老无忧。"],["羊羔皮袄豹皮袖，","房屋高大我享受。","君子生活多美好，","到老欢乐无忧愁。"]],[["大头明目，","载受嘉福。","三雀飞来，","与禄相得。"],["额宽头大眼睛亮，","吉庆幸福来身旁。","三只鸟雀齐飞来，","福禄一起登上堂。"]],[["销锋铸耜，","休放牛马。","甲兵解散，","夫妇相保。"],["销熔刀锋铸犁耙，","放牧牛儿和战马。","解甲归田军队散，","夫妻双双得团圆。"]],[["吉日车攻，","田弋猎禽。","反行饮至，","以告嘉功。"],["吉日车儿修工整，","野外打猎射鸟禽。","归来之后饮美酒，","举杯庆贺告成功。"]],[["商人行旅，","资无所有。","贪贝逐利，","留连王市。","辕内安，","公子何咎？"],["商人在那旅途中，","两手空空无资金。","贪求钱财逐利润，","整日流连集市中。","道路曲折内心安，","公子能有何祸凶？"]],[["火入井口，","阳芒生角。","犯历天门，","窥见太微。","登上玉床，","家易其公。"],["火星进入井宿中，","星光灿烂阳气升。","侵犯登规游天门，","看见天宫太微神。","登上玉制华贵床，","家中换了新主人。"]],[["秋隼冬翔，","数被严霜。","甲兵充庭，","万物不生。","鸡釜夜鸣，","民扰大惊。"],["隼鸟严冬高飞翔，","屡屡遭受其严霜。","铠甲兵器满庭院，","万物不能再生长。","夜半鸡叫鼎釜鸣，","百姓受扰心惊慌。"]],[["东行西步，","失其次舍。","乾侯野井，","昭君丧居。"],["东行西走乱奔波，","不幸失去其居所。","乾侯野井逢灾祸，","昭公失去其室舍。"]],[["肿胫病腹，","陷厕污辱。","命短时极，","孤子哀哭。"],["脚胫浮肿腹内病，","陷入厕所污泥中。","命不久长无好运，","孤子哀哭空悲痛。"]],[["切肤近火，","虎绝我须。","小人横暴，","君复何之。"],["火势汹汹触皮肤，","恶虎抓断我胡须。","小人骄横又残暴，","不知好人在何处。"]],[["女室作毒，","为我心疾。","和不能治，","晋人赴告。"],["贪恋女色受侵害，","长期抱病起不来。","请来名医不能治，","晋人前来报丧事。"]],[["兵征大宛，","北出玉门，","与胡寇战。","平城道西，","七日绝粮，","身几不全。"],["领兵前去征大宛，","向北出了玉门关，","与那胡人相激战。","平城路西受围困，","七天无粮忍饥寒，","生命几乎难保全。"]],[["九子十夫，","莫适与居。","贞心不一，","自令老孤。"],["九个女子十个夫，","不知谁和谁同住。","贞节爱心不专一，","自招年老受孤苦。"]],[["东行稻麦，","遂至家国。","乐土无灾，","君子何忧？"],["车子东行运稻麦，","平安到达我家国。","生在欢乐土地上，","好人何必忧灾祸？"]],[["作室山根，","所以为安。","一夕崩巅，","破我饔飧。"],["房屋建在山下边，","幻想以此保平安。","一旦山体遭崩裂，","使我无饮亦无餐。"]],[["六人俱行，","各遗其囊。","黄鹄失珠，","无以为明。"],["六人一同向前行，","钱袋财囊皆丢尽。","天鹅失去夜明珠，","没有东西来照明。"]],[["伯蹇叔盲，","莫为守囊。","失我衣裘，","不离其乡。"],["哥哥腿瘸弟弟盲，","不能自己守行囊。","皮衣丢失难寻找，","不离家乡不招殃。"]],[["褒宠洒尤，","败政倾家。","覆我宗国，","秦灭周室。"],["宠爱褒姒犯罪过，","败坏政事毁家舍。","祖宗大业被覆灭，","暴秦灭了我周国。"]],[["诡言译语，","仇祸相得。","冰入炭室，","消灭不息。"],["伪言妄语得翻译，","仇恨灾祸聚一起。","冰块放入炭火室，","溶化消灭难生息。"]],[["彭生为豕，","暴龙作灾。","盗尧作裳，","聚跖荷兵。","青禽照夜，","三日夷亡。"],["公子彭生变为猪，","暴龙前来造灾殃。","桀跖聚众执凶器，","盗走唐尧衣和裳。","青鸟衔珠照黑夜，","三天之后即夭亡。"]],[["朝露白日，","四马过隙。","岁短期促，","时难再得。"],["晨辉照露即消失，","四马越隙一瞬逝。","时间岁月太短促，","失去不会再临至。"]],[["耳阙道丧，","所为不成，","求事匪得。"],["缺耳难闻正义声，","所行之事不能成，","犹如幻想皆落空。"]],[["申公患楚，","危不自安。","重耳出奔，","侧丧其魂。"],["申公巫臣楚患难，","危害临头不得安。","重耳出逃于国外，","失魂落魄而奔窜。"]],[["南上太山，","困于空桑。","左沙右石，","牛马无食。"],["一路南行上泰山，","困于空桑难向前。","左右都是乱石滩，","牛马草料亦食完。"]],[["海隅辽右，","福禄所在。","柔嘉蒙礼，","九夷何咎。"],["大海之滨辽河右，","物产丰饶样样有。","民情柔顺讲礼貌，","九夷居之乐悠悠。"]],[["阳春生长，","万物茂壮。","垂枝布叶，","君子比德。"],["阳春时节宜生长，","万物茂盛又茁壮。","根固枝垂布满叶，","犹如好人德高尚。"]],[["低头窃视，","有所畏避。","行作不利，","酒酸鱼败，","众莫贪嗜。"],["低头缩颈偷视人，","心中自有畏避情。","出行动作不顺利，","酒酸鱼臭难食用，","众人不要太贪心。"]],[["左辅右弼，","金玉满堂。","常盈不亡，","富于敖仓。"],["左边辅助右边帮，","金银宝玉满庭堂。","经常丰足不缺少，","财富犹如大粮仓。"]],[["坐朝垂轩，","据德宰民。","虞舜受苦，","六合和亲。"],["稳坐殿堂朝廷中，","依靠德政治万民。","虞舜受命为天子，","上下四方多和顺。"]],[["东行西走，","丧其犬马。","南求骅骝，","失车林下。"],["匆匆东行又西走，","不慎丢失马和狗。","往南寻求我骏马，","又失车子树林下。"]],[["砥德砺材，","果当成周。","拜受大命，","封为齐侯。"],["磨炼成才德敦厚，","英明果断为成周。","居功拜受朝廷命，","太公被封为齐侯。"]],[["西逢王母，","慈我九子，","相对欢喜。","王孙万户，","家蒙福祉。"],["西行路上遇王母，","疼爱我的九个子，","相见之时很欢喜。","王孙封得万户邑，","全家蒙佑受福祉。"]],[["安坐玉床，","听韶行觞。","饮福万岁，","曰寿无疆。"],["安然稳坐在玉床，","欣赏韶乐饮酒浆。","万岁声儿满厅堂，","高呼祝福寿无疆。"]],[["登高望家，","役事未休。","王事靡盬，","不得逍遥。"],["登高眺望家乡，","无休无止役事忙。","朝廷公差没个完，","不得逍遥难安闲。"]],[["击鼓蹈陔，","不得相逾。","章甫文德，","福厌祸消。"],["敲着大鼓至阶下，","不得随便逾越它。","头戴高冠文德人，","福患消去受福大。"]],[["追亡逐北，","呼还幼叔。","至山而复，","得反其室。"],["追赶逃者至北方，","呼唤小弟回家乡。","一直追到山脚下，","得以回归母身旁。"]],[["积德之君，","仁政且温。","伊吕股肱，","国富民安。"],["积德行善贤明君，","广施仁政多温顺。","伊尹吕望来辅佐，","国家富强民安宁。"]],[["老猾大，","东行盗珠。","困于噬敖，","几不得去。"],["老猾大似强盗，","流窜东方偷珠宝。","猎犬围攻受困厄，","数次未能得脱逃。"]],[["禹召诸神，","会稽南山。","执玉万国，","天下康安。"],["大禹召集诸君王，","在那会稽南山上。","各国执玉来朝拜，","天下和平又安康。"]],[["忉忉怛怛，","如将不活。","黍稷之恩，","灵辄以存，","获生保年。"],["极度忧愁甚悲痛，","如同行将要灭身。","糜子谷子施大恩，","灵辄赖以得生存，","重获新生保性命。"]],[["侯叔兴起，","季子富有。","照临楚国，","蛮荆是安。"],["侯叔逢时而兴起，","大夫季子多富裕。","昭公光辉照楚国，","荆蛮百姓得安逸。"]],[["白马骏骝，","更生不休。","富我商人，","利得如丘。"],["白马和那枣红马，","繁衍生殖数量大。","富了我这经商人，","获得利益如丘陵。"]],[["灼火泉源，","钓鲂山巅。","鱼不可得，","炭不肯燃。"],["燃火去那水泉间，","钓鱼到那高山巅。","鱼儿无法能得到，","炭火逢水亦不燃。"]],[["避患东西，","反入祸门。","糟糠不足，","忧动我心。"],["东奔西走避祸凶，","反而进入祸患门。","糠菜剩饭难充饥，","使我忧愁好伤心。"]],[["成王多宠，","商臣惶恐。","生其祸心，","使君危殆。"],["成王身边多内宠，","世子商臣心惶恐。","蒙生杀戮之祸心，","使君命丧于王宫。"]],[["虎饥欲食，","见蝟而伏。","禹通龙门，","避咎除患，","元丑以安。"],["饿虎起身去寻食，","见到刺猬忙躲避。","大禹治水凿龙门，","消灾除患祸离去，","首恶被镇不复起。"]],[["按民呼池，","玉杯文案。","鱼如白云，","一邑获愿。"],["呼沱河畔访民间，","父老长辈礼在先。","水中鱼儿如白云，","城邑百姓获其愿。"]],[["双凫鸳鸯，","相随群行。","南至饶泽，","食鱼与梁。","君子乐长。"],["野鸭成对似鸳鸯，","相随群行去南方。","到了丰饶沼泽地，","啄食鱼儿和稻粱。","小伙心里多欢畅。"]],[["蔡侯相楚，","留连江渚。","逾时历月，","思其君后。"],["蔡侯朝见楚昭王，","受辱徘徊江边上。","历时前后逾数月，","思念君后谁称王。"]],[["胶车驾东，","与雨相逢。","五楘解堕，","顿辀独坐，","忧为身祸。"],["马驾胶车向东去，","不料出门碰上雨。","五根皮条皆坠地，","辕坏车主独愁思，","身遭祸殃忧临至。"]],[["螟虫为贼，","害我嫁穑。","尽禾殚麦，","利无所得。"],["螟虫造灾遍田野，","残害我的好嫁禾。","禾苗麦穗皆吃尽，","待到秋天无所得。"]]],[[["陷涂溺水，","火烧我履，","忧患重累。"],["陷入泥泞逢水祸，","火又烧坏我的鞋，","忧患一个接一个。"]],[["旦生夕死，","名曰婴鬼，","不可得祀。"],["早上出生晚上死，","呼其婴鬼作名字，","不可为其作祭祀。"]],[["扬水潜凿，","使石洁白。","裹素表朱，","游戏皋沃。","得其所愿，","心志娱乐。"],["河水悠悠暗流行，","使得白石多鲜明。","身穿白衫红外套，","游览来到曲沃城。","君子心愿得满足，","欢娱快乐真高兴。"]],[["众鸟所翔，","中有大怪。","九身无头，","魂惊魄去，","不可以居。"],["一群鸟儿高飞翔，","中有妖怪逞凶狂。","九个身子没有头，","使人看了甚惊荒，","不是安居好地方。"]],[["刖根枯株，","不生肌肤。","病在於心，","日以焦枯。"],["树根砍断变枯珠，","枝芽不生叶不出。","疾病生在心腹中，","日复一日渐焦枯。"]],[["府藏之富，","王以振贷。","捕鱼河海，","笱网多得。"],["府库收藏很丰富，","君王救济多借出。","大河大海去捕鱼，","设下竹网获无数。"]],[["一茎九缠，","更相牵挛。","宿明俯仰，","不得东西。","请谳当决，","日午被刑。"],["一茎草木九藤缠，","藤条蔓延相牵连。","白天黑夜神不定，","不知向东或向南。","请求议罪当即决，","正午时分受审判。"]],[["耋老鲐背，","齿牙动摇。","近地远天，","下入黄泉。"],["八旬高龄背弯曲，","牙齿松动脱落去。","靠近地狱远离天，","不久将要入黄泉。"]],[["羊舌叔虎，","野心善怒。","黩货无厌，","以灭其身。"],["叔向之弟羊舌虎，","野心勃勃易发怒。","贪污受贿无满足，","自灭其身难受福。"]],[["疑八子，","更相欺绐。","管叔善政，","不见邪期。"],["八子诡讹相怀疑，","互相欺骗生猜忌。","管仲善于理朝政，","不见邪恶动乱起。"]],[["绊跳不远，","心与言反。","尼丘顾家，","茅簟朱华。"],["脚儿受绊跳不远，","心中所想与言反。","尼丘山上眺望家，","茅草粗席胜豪华。"]],[["蚍蜉戴盆，","不能上山。","摇推跌跋，","顿伤其颜。"],["小小蚂蚁顶大盆，","不能沿着山路行。","跋前踬后难向前，","受挫将那颜面损。"]],[["朝露不久，","为恩惠少。","膏泽欲尽，","咎在枯槁。"],["早晨露水即消退，","禾苗受旱少恩惠。","才蒙润泽却将尽，","灾害使其变枯萎。"]],[["河伯之功，","九州攸同。","载祀六百，","光烈无穷。"],["河神治水立大功，","天下九州得滋润。","享受祭祀六百年，","流芳光照无穷尽。"]],[["三人北行，","大见光明。","道逢淑女，","与我骥子。"],["三人一起往北行，","眼前一片大光明。","路上遇见好女子，","赐予良马供我骑。"]],[["金精耀怒，","带剑过午。","徘徊高库，","宿于木下。","两虎相距，","弓弩满野。"],["太白金星放怒光，","身佩利剑居西方。","往来徘徊于天库，","住宿在那木星旁。","虎视眈眈相抵御，","弓箭遍野满山冈。"]],[["江河淮海，","天之奥府。","众利所聚，","可以富有，","好乐喜友。"],["长江黄河淮海旁，","上天赐予好地方。","巨大财富蕴藏处，","富禄如同大粮仓，","快乐与友相交往。"]],[["不虞之患，","祸至无门。","奄忽暴卒，","病伤我心。"],["出人预料祸降临，","灾难无门却发生。","忽然无端离人世，","疾病伤透我的心。"]],[["画龙头颈，","文章未成。","甘言美语，","说辞无名。"],["画龙只画头和颈，","身上花纹未绘成。","甜言蜜语虽动听，","浮华没有真内容。"]],[["缺破不成，","胎卵不生，","不见兆形。"],["残缺破败有坏损，","胎卵不能得萌生，","无法见到其雏形。"]],[["旁行不远，","三里复反。","心多畏恶，","日中止舍。"],["出门赶路不太远，","三里之地又回返。","心中畏惧遭厄运，","正午留宿不再前。"]],[["四不安，","兵革为患。","掠我妻子，","家复饥寒。"],["四方动乱不得安，","到处兵灾成祸患。","我的妻儿被夺走，","家中忍饥又受寒。"]],[["喜来如云，","嘉福盈门。","众才君子，","举家蒙欢。"],["喜事重重来如云，","大福吉祥喜盈门。","众多才郎大贤人，","全家蒙恩多欢欣。"]],[["载金贩狗，","利弃我走。","藏匿渊底，","折毁为咎。"],["带着金钱去赎狗，","大利弃我而逃走。","跳进深谷去躲藏，","折本毁财成凶忧。"]],[["日中为市，","各抱所有，","交易赀贿。","函珠怀宝，","心悦欢喜。"],["中午市场正热闹，","商人携物行动早，","赶往集市去成交。","含着珍珠揣着宝，","高兴喜悦开怀笑。"]],[["日趋月步，","周遍次舍。","经历致远，","无有难处。"],["太阳月亮各自行，","游遍周天十二宫。","经历路途甚遥远，","所到之处无危难。"]],[["阳明失时，","阴凝为忧。","主君哀泣，","丧其元侯。"],["光明照耀不及时，","寒风冽冽阴气聚。","君长悲哀又哭泣，","元侯之位丧失去。"]],[["年衰岁暮，","精魂游去。","形容消枯，","丧子相呼。"],["年老体衰寿不长，","精魂离体游他方。","形体容貌甚憔悴，","丧失儿子添悲伤。"]],[["少无功绩，","老困失福。","跌行跛踦，","不知所立。"],["少年不去建功绩，","晚年陷入困境里。","人生路上成瘸子，","欲行不能难站立。"]],[["持心瞿目，","善数摇动。","自东徂西，","不安其处。","散涣府藏，","无有利得。"],["费尽心机睁大眼，","三番五次到处看。","从东到西无定点，","不安其处心贪婪。","官府库存皆分散，","无利可得空喜欢。"]],[["赍贝赎狸，","不听我辞。","系于虎须，","牵不得来。"],["带着金钱去赎狐，","对方不听我劝阻。","将狐系于虎须上，","牵之不来白受苦。"]],[["老狼白驴，","长尾大胡。","前颠后踬，","无有利得。"],["一条白狗山道走，","老狼长尾领悬肉。","白狗前颠又后跌，","无利可得生悲愁。"]],[["背地相憎，","心志不同，","如火与金。","君猛臣慢，","虎行兔伏。"],["兴趣志向各不同，","背地相仇相憎恨，","如同烈火逢真金。","君主凶猛臣怠慢，","虎行之处兔伏隐。"]],[["夏台羑里，","汤文厄处。","鬼侯歠醢，","岐人悦喜。"],["夏台羑里两地方，","受困商汤周文王。","鬼侯被剁成肉酱，","西岐欢庆纣灭亡。"]],[["牙蘖生达，","螳螂启户。","幽人利贞，","鼓翼起舞。"],["幼芽出土得萌生，","螳螂启蛰爬门庭，","囚禁犯人获自由，","手舞足蹈多欢欣。"]],[["烈女无夫，","闵思苦忧。","齐子无良，","使我心愁。"],["贞女没有心上人，","忧思苦恼使人怜。","齐国文姜德不良，","使我心中生惆怅。"]],[["践履危难，","脱厄去患。","入福喜门，","见我大君。"],["历经困苦和艰难，","幸得摆脱灾与患。","进入喜庆幸福门，","上堂拜见我父亲。"]],[["折臂接手，","不能进酒。","祈祀闲旷，","神怒不喜。"],["折臂又遭反绑手，","不能上前去敬酒。","荒废祭祀不祷告，","神灵发怒令人忧。"]],[["蚁封户穴，","大雨将集。","鹊起数鸣，","牝鸡叹室。","相梦雄父，","未到在道。"],["蚂蚁筑巢封洞门，","预示大雨将来临。","鸟鹊飞起叫不停，","窝中母鸡长叹鸣。","梦见父亲将来到，","尚未到达在半道。"]],[["胡俗戎狄，","太阴所积。","固冰沍寒，","君子不存。"],["胡狄居住在北极，","太阴之气所积聚。","冰天雪地甚寒冷，","大人不到那里去。"]],[["翕翕軥軥，","稍颓崩颠。","减其令名，","身不得全。"],["车声轰轰向前行，","转而败落遭颠颠。","高贵之人灭美名，","难能保全他自身。"]],[["螟虫为贼，","害我稼穑。","尽禾殚麦，","秋无所得。"],["螟虫田野造灾祸，","损害庄稼伤我禾。","食尽稻谷和麦苗，","秋收时节无所获。"]],[["三鸟飞来，","自我逢时。","俱行先至，","多得大利。"],["三只鸟儿高飞起，","使我碰到好时机。","同时行动先到达，","幸运多得获大利。"]],[["罢马上山，","焦无水泉。","喉焦唇干，","渴不能言。"],["骑乘疲马上高山，","一路不见有水泉。","喉咙焦渴嘴唇干，","舌难动作口难言。"]],[["春生孳乳，","万物蕃炽。","君子所集，","祸灾不至。"],["春催万物得滋生，","茁壮成长叶茂盛。","好人居处是圣地，","祸患灾难不临至。"]],[["王孙季子，","相与为友。","明允笃诚，","升擢荐举。"],["宫中王孙和少子，","相与为友多孝悌。","公允忠实又诚恳，","荐举提拔得重用。"]],[["六明并照，","政纪有统。","秦楚战国，","民受其咎。"],["六大光明照四方，","政令法纪有规章。","秦楚两国起战事，","人民百姓受灾殃。"]],[["蝃蝀充侧，","佞人倾惑。","女谒横行，","正道壅塞。"],["天地霪气化霓虹，","佞人得逞君昏庸。","女谒横行乱朝政，","正道堵塞不畅通。"]],[["登昆仑，","入天门，","过糟邱，","宿玉泉。","同惠欢，","见仁君。"],["登上高高昆仑山，","步入天宫之门槛，","经过那个糟丘地，","住宿就在玉泉边。","同享恩惠与欢乐，","见到慈爱仁君面。"]],[["体重飞难，","未能越关，","不离空垣。"],["身体沉重奋飞难，","未能顺利越山关，","难以远离空墙垣。"]],[["枯瓠不朽，","利以济舟。","渡逾河海，","无有溺忧。"],["葫芦干枯不腐朽，","可以用来做行舟。","乘它渡河又过海，","不会受淹无担忧。"]],[["玄黄虺隤，","行者劳疲。","役夫憔悴，","逾时不归。"],["腿软多病眼发黄，","行者疲劳奔波忙。","服役之人心憔悴，","过了时间难返回。"]],[["孔德如玉，","出于幽谷，","飞上乔木，","鼓其羽翼，","辉光照国。"],["孔雀之德如碧玉，","深山幽谷奋飞起，","跃上高树展开翅，","鼓其羽翼游环宇，","辉光照临国度里。"]],[["火虽炽，","在吾后。","寇虽众，","在吾右。","身安吉，","不危殆。"],["大火虽猛烈，","但却在我后。","贼寇虽众多，","然则在我右。","我身安又吉，","没有灾与忧。"]],[["旃裘膻国，","文礼不饰。","跨马控弦，","伐我都邑。"],["衣裘裹毡腥膻国，","不讲文明无礼乐。","跨马张弓逞凶狂，","频频侵犯我城郭。"]],[["被发八十，","慕德献服。","边鄙不耸，","以安王国。"],["八十高龄披长发，","献出诚意来慕德。","边疆从此无警报，","大国由此得安乐。"]],[["心得所好，","口常欲笑。","公孙蛾眉，","鸡鸣乐夜。"],["所得正是心所好，","情人相见开口笑。","公子王孙与美人，","直至鸡鸣乐通宵。"]],[["马能负乘，","见邑之野。","并获粱稻，","喜悦无咎。"],["马能载物亦能骑，","乘它郊外驮粮食。","既获谷来又获稻，","喜悦于心乐滋滋。"]],[["高飞视下，","贪饕所在。","腐臭为患，","害我躬身。"],["饥鹰高飞往下看，","搜寻食物心贪婪。","暴食腐物成灾患，","胀破肚皮归西天。"]],[["东行西步，","失其次舍。","乾侯野井，","昭公丧居。"],["东来西往心彷徨，","失去居所无住房。","昭公被逐去齐国，","命丧乾侯野井旁。"]],[["神鸟五彩，","凤凰为主。","集于王谷，","使年岁有。"],["五彩缤纷大神鸟，","凤凰在前做主导。","飞来会集大山谷，","使得今年收成好。"]],[["石门晨门，","荷蒉食贫。","遁世隐居，","竟不逢时。"],["鲁都外城守门人，","挑筐之士受贫穷。","逃离尘世去隐居，","未能逢时得重用。"]],[["啮啮，","贫鬼相责。","无有欢怡，","一日九结。"],["争争吵吵相责骂，","一伙穷鬼欲打架。","从早到晚没欢乐，","一天能结九怨家。"]],[["白日扬光，","雷车避藏。","云雨不行，","各止其乡。"],["白日皎皎放光芒，","雷神之车远避藏。","阴云风雨不见来，","各自待在它家乡。"]]],[[["忧惊已除，","祸不为灾，","安全以来。"],["忧虑抛至九霄外，","祸害远匿未成灾，","平平安安回家来。"]],[["穿匏挹水，","篝铁燃火。","劳疲力竭，","饮渴为祸。"],["手执破瓢去舀水，","堆起铁条来燃火。","筋疲力尽劳无功，","饥渴交加成灾祸。"]],[["蹇牛折角，","不能载粟。","灾害不避，","年岁无谷。"],["跛脚之牛断了角，","不能负载我谷物。","灾害如若不避免，","年终将会无收获。"]],[["邑将为虚，","居之忧危。"],["城为废墟坏墙垣，","担惊受怕居住难。"]],[["根刖树残，","花叶落去。","卒逢火炎，","随风僵仆。"],["树根砍断枝条残，","花叶落去剩枯干。","突然碰上大火燃，","随风刮倒在一边。"]],[["元后贪欲，","穷极民力。","执政乖互，","为夷所履。"],["元帝皇后太贪婪，","极尽民力遂心愿。","朝廷政治相抵触，","终遭狄夷所侵犯。"]],[["北山有枣，","使叔寿考。","东岭多栗，","宜行贾市。","陆梁雌雉，","所至利喜。"],["北山之上产枣子，","大哥食其强身体。","东岭上面多栗子，","利于集市做生意。","陆梁山上有雌鸟，","前去有利又有喜。"]],[["高原峻山，","陆土少泉。","草木林麓，","嘉禾所炎。"],["崇山峻岭耸高原，","黄土坡上少水泉。","山脚树木和杂草，","连同稻苗皆受旱。"]],[["辰次降娄，","王驾巡狩。","广施德惠，","国安无忧。"],["北极斗柄指娄宿，","君王出巡好时节。","广施仁德和恩惠，","国家太平民安乐。"]],[["岁暮偏弊。","宠名损弃，","君衰於位。"],["人到暮年性固执。","宠名受损遭抛弃，","君位衰落降了职。"]],[["放衔委辔，","奔乱不制。","法度无恒，","君失其位。"],["丢开嚼子和缰绳，","惊马狂奔难制衡。","国家没有法约束，","官居高位遭颠崩。"]],[["独坐西垣，","莫与笑言。","秋风多哀，","使我心悲。"],["独自坐在西墙垣，","无人与君共笑言。","秋风萧瑟送哀音，","孤独寂寞真可怜。"]],[["胫急股挛，","不可出门。","暮速群旅，","必为身患。"],["小腿大腿都痉挛，","不可出门而走远。","天黑结伴去旅行，","其身注定受祸患。"]],[["情伪难知，","使我偏颇。","小人在位，","虽圣何咎。"],["人情虚伪难预测，","不免使我有偏颇。","小人得志居高位，","圣人也难过快活。"]],[["黍稷醇醲，","敬奉山宗。","神嗜饮食，","甘雨嘉降。","庶物蕃茂，","时无灾咎。"],["糜子谷子味醇浓，","用来敬奉祭山神。","神灵喜食又喜饮，","吉庆祥瑞降甘霖。","万物生长都茂盛，","四时和顺无灾凶。"]],[["公子王孙，","把弹摄丸。","发辄有获，","室家饶足。"],["皇室公子和王孙，","善用弹丸和弹弓。","发射顷刻即有得，","家中财富饶又丰。"]],[["阴升阳伏，","舜失其室。","慈母赤子，","相餧不食。"],["阴气上升阳气隐，","虞舜失去其家庭。","慈祥母亲和婴孩，","对坐相喂不思饮。"]],[["七窍龙身，","造易八元。","法天则地，","顺时施恩，","富贵长存。"],["高辛氏七窍龙身，","造化出才子八人。","效法那天地规则，","顺时序行惠施恩，","富贵得永世长存。"]],[["逐狐东山，","水遏我前。","深不可涉，","失利后便。"],["追赶狐狸至东山，","河水阻我不能前。","水深流急不可涉，","失去利益另行便。"]],[["衔命辱使，","不堪其事。","中坠落去，","更为负载。"],["奉命出使受辱回，","不能胜任又复归。","中途官场跌落去，","肩挑背驮做人鬼。"]],[["温仁君子，","忠孝所在。","入闺为仪，","祸灾不起。"],["君子温和又仁厚，","忠孝礼义皆具有。","仪态威严入闺房，","灾祸永远不临头。"]],[["春多膏泽，","夏润优渥。","稼穑成熟，","亩获百斛；","师行失律，","霸功不遂。"],["春有祥云多雨露，","夏天雨水更充足。","庄稼成熟获丰收，","一亩能产一百斛；","军队出发失纪律，","霸功大业难成就。"]],[["二女同室，","心不聊食。","首发如蓬，","忧常在中。"],["两位女性居一室，","心中愁思不饮食。","头发纷乱如蓬草，","忧虑常存内心里。"]],[["筑阙石巅，","立基泉源。","疾病不安，","老孤为邻。"],["宫殿修筑石山巅，","根基扎在水泉边。","疾病缠身难安宁，","孤苦无邻亦无伴。"]],[["欲避凶门，","反与祸邻。","颠覆不制，","痛薰我心。"],["欲想避开凶祸门，","反而与祸成近邻。","颠覆倾倒失控制，","悲痛熏烤我的心。"]],[["踧行窃视，","有所畏避。","狸首伏藏，","以夜为利。"],["惊异行走又窃视，","内心畏惧欲躲避。","狐狸伏地藏起身，","以夜作为好时机。"]],[["人面鬼口，","长舌为斧。","斫破瑚琏，","殷商绝后。"],["人面鬼口长舌头，","颠倒是非似斧头。","谗毁忠良害贤臣，","殷商政权因之丢。"]],[["和气相薄，","膏泽津液，","生我嘉谷。"],["祥和之气相交融，","雨露滋润万物生，","使我庄稼很茂盛。"]],[["销金厌兵，","雷车不行，","民安其乡。"],["销毁武器兵回营，","战车从此不再行，","民居家乡多安宁。"]],[["秦仪机言，","解其国患。","说燕下齐，","作相以权。"],["苏秦张仪善辞言，","合纵连横解国患。","说服燕王伐齐国，","襄王复齐掌政权。"]],[["旦奭辅王，","周德孔明。","越裳越雉，","万国咸康。"],["周公召公辅成王，","周德昌明似骄阳。","南国越裳献白雉，","万国诚服呈吉祥。"]],[["弱足刖跟，","不利出门。","贾市无盈，","折亡为患。"],["脚力软弱断脚跟，","不利出门去远行。","集市买卖未盈利，","折了本钱成祸凶。"]],[["坚冰黄鸟，","常哀悲愁。","不见白粒，","但睹藜蒿。","数惊鸷鸟，","为我心忧。"],["坚冰之上黄鸟栖，","常常悲愁又哀泣。","不见米粒无食粮，","但见野草蒿与藜。","屡遭猛禽所惊吓，","使我心中多忧虑。"]],[["魂微惙惙，","属纩听绝。","旷然大通，","复更生活。"],["一丝幽魂甚微弱，","丝棉置口气将绝。","豁然气息又大通，","苏醒过来再生活。"]],[["阴生獐鹿，","鼠舞鬼谷，","灵龟陆处。"],["大山阴边生獐鹿，","老鼠起舞于鬼谷，","灵龟离水陆地处。"]],[["诸石攻玉，","无不穿凿。","龙体具举，","鲁班为辅。","麟凤成形，","德象君子。"],["治玉之石作雕刻，","坚硬之玉皆穿凿。","龙体形象多逼真，","能工巧匠来辅佐。","麒麟凤凰都成形，","象征君子好品德。"]],[["山作天时，","陆为海口，","民不安处。"],["高山作祟变气候，","陆地成为大海口，","民无居处生悲愁。"]],[["东风启户，","隐伏欢喜。","氓庶蒙恩，","复得我子。"],["东风启户春来临，","万物潜伏又苏醒。","平民百姓蒙恩惠，","重新得到我儿孙。"]],[["华灯百枝，","消暗衰微。","精光欲尽，","奄如灰靡。"],["华灯高悬一百盏，","燃油耗尽渐微暗。","光亮即将要熄灭，","但见灰尘浮上面。"]],[["三十无室，","寄宿桑中。","上宫长女，","不得乐同，","使我失期。"],["年已三十未娶妻，","寄居桑中多苦凄。","上宫那个大女孩，","与我同乐不愿意，","使我机会都失去。"]],[["卵与石斗，","糜碎无疑。","动而有悔，","出不得时。"],["鸡蛋与那石相碰，","糜烂破碎四离分。","盲目行动有悔恨，","出生未逢好时辰。"]],[["秦兵争强，","失其贞良，","败於殽乡。"],["秦兵郑军齐争强，","反而失其精良将，","异乡殽山吃败仗。"]],[["豦除善疑，","难为攻医。","骥穷盐车，","困於衔箠。"],["察言观色奸诈客，","恶习难改不认错。","良马上坡拉盐车，","口噙嚼子遭鞭策。"]],[["操笱搏狸，","荷弓射鱼。","非其器用，","自令心劳。"],["手执竹笼去捕狸，","肩扛弓箭去射鱼。","器非其用与愿违，","徒劳无功费心机。"]],[["葵丘之盟，","晋献会行。","见太宰辞，","复为还舆。"],["桓公葵丘会诸侯，","献公迟迟行在后。","中途遇见周太宰，","一番机言掉车头。"]],[["膑诈庞子，","夷灶书木。","兵伏卒发，","矢至如雨。","魏师惊乱，","将获为虏，","涓死树下。"],["孙膑妙计诈庞子，","递减军灶树刻字。","马陵伏兵突然起，","万箭齐发矢如雨。","魏军惊乱成一团，","将军被擒成俘虏，","庞子树下命归西。"]],[["南行出城，","世得天福。","王姬归齐，","赖其所欲。"],["向南行走出城域，","世世得福天恩赐。","周王女儿嫁齐国，","赖其达到其目的。"]],[["冬采薇兰，","地冻坚难。","利走室北，","暮无所得。"],["冬季采薇又采兰，","大地结冻甚艰难。","利向北去不顾我，","直到傍晚空手还。"]],[["王乔无病，","狗头不痛。","亡屐失履，","乏我送从。"],["神仙王乔没有病，","狗的头儿亦不痛。","遗失木屐丢了鞋，","途中缺乏护送人。"]],[["宛马疾步，","盲师坐御。","目不见路，","中宵不到。"],["大宛骏马奔跑疾，","赶车之人是瞎子。","双目失明不见路，","半夜未达目的地。"]],[["求利难国，","亡去我北。","忧归其城，","反为吾贼。"],["敌对国家去求利，","失败北去囊中虚。","满怀忧虑回故里，","反而使我受损失。"]],[["君孤独处，","单弱无辅，","名曰困苦。"],["男儿孤立独自处，","势单力薄无人辅，","冠以其名曰困苦。"]],[["比目四翼，","安我邦国。","上下无患，","为我嘉福。"],["君臣配合甚亲密，","共同安邦议国事。","上下没有祸与患，","成为我的大福气。"]],[["八材既登，","以成股肱。","尨降庭坚，","国无灾凶。"],["八个才子得荣升，","辅佐君王立嘉功。","尨降庭坚来治理，","国家从此无灾凶。"]],[["消弊穿空，","家莫为宗。","奴婢逃走，","子西父东，","为身作凶。"],["逐渐衰败变虚空，","家业不能承祖宗。","奴仆婢女皆逃走，","儿子向西父往东，","孤身受苦逢灾凶。"]],[["鸟舞国城，","邑惧卒惊。","仁德不修，","为下所倾。"],["凶鸟乱舞于都城，","全城恐惧市民惊。","在上不修仁与德，","百姓造反王朝倾。"]],[["五谷不熟，","民苦困急。","驾之南国，","嘉乐有得。"],["稻黍高粱未成熟，","人民生活太困苦。","驾起车儿去南方，","获得利益乐心上。"]],[["黄裳建元，","福德在身。","福祐洋溢，","封为齐君，","富贵多孙。"],["中和之色集君身，","福禄德泽都降临。","上帝保佑享俸禄，","天子封他为齐君，","富贵荣华多子孙。"]],[["齐东郭庐，","嫁于洛都。","俊良美好，","利得过倍。"],["齐城东郊郭家庄，","有位姑娘嫁洛阳。","姑娘俊美又善良，","媒人获得利成双。"]],[["安床厚褥，","不得久宿。","弃我嘉宴，","困于南国，","投杼之忧，","不成祸灾。"],["高床厚褥安乐窝，","不能长久居其舍。","放弃幸福好生活，","卧薪尝胆于南国。","曾参之母投杼忧，","最终未能成灾祸。"]],[["内崩身伤，","中乱无常。","虽有美粟，","不我得食。"],["体内患病身受伤，","家中混乱不正常。","纵有美味佳肴在，","我却因病难品尝。"]],[["出门逢患，","与祸为怨。","更相击刺，","伤我手端。"],["出行途中逢祸患，","与那灾祸成仇怨。","更相动武用利器，","不幸伤了我手端。"]],[["出入节时，","南北无忧。","行者即至，","在外归来。"],["出门办事有规律，","南去北往无忧虑。","有利时机莫错过，","尔后返回原住地。"]],[["公孙驾骊，","载游东齐。","延陵说产，","遗季紵衣。"],["吴国公子架骏骊，","乘车前往游东齐。","延陵季子一席话，","大夫子产赠紵衣。"]]],[[["旦种谷豆，","暮成藿羹。","心之所愿，","志快意惬。"],["早晨种下谷和豆，","晚饮羹汤乐悠悠。","心中愿望得实现，","欢快满意永无休。"]],[["牡飞门启，","忧患大解，","不为身祸。"],["锁闩落地门开启，","忧愁祸患皆消去，","灾凶不再来临至。"]],[["东山西山，","各自止安。","虽相登望，","竟未同堂。"],["居之东山与西山，","双方各自都平安。","虽能登高相遥望，","竟然未能得团圆。"]],[["众鸟所翔，","中有大怪。","九身无头，","魂惊魄去，","不可以居。"],["众鸟长空高飞翔，","中有妖怪逞凶狂。","九条身躯没有头，","使人魂惊心惶惶，","此地难能居长久。"]],[["交侵如乱，","民无聊赖。","追戎济西，","敌人破阵。"],["齐相侵略乱纷纷，","民无依靠难生存。","追击戎兵济水西，","攻破敌人大本营。"]],[["麟凤所翔，","国无咎殃。","贾市十倍，","复归惠乡。"],["麒麟凤凰同飞翔，","预示国家无祸殃。","外出经商获大利，","重返美丽之故乡。"]],[["凿井求玉，","非卞氏宝。","身困名辱，","劳无所得。"],["欲想掘井寻宝玉，","所得并非卞和璧。","身受困厄名受辱，","徒劳无益向北去。"]],[["文山鸿豹，","肥腯多脂。","王孙获愿，","载福巍巍。"],["文山之上有鸿豹，","肉肥脂厚亦多膘。","王孙猎获称心愿，","满载福禄如山高。"]],[["周成之隆，","刑措除凶。","太宰费石，","君子作人。"],["成康之际世太平，","刑罚不用乱不生。","太宰周公费与石，","成为国家梁与栋。"]],[["珪璧琮璋，","执贽见王。","百里宁戚，","应聘齐秦。"],["珪璧琮璋是瑞玉，","拜见君王见面礼。","宁戚和那百里奚，","应聘任职秦与齐。"]],[["穿空漏彻，","破坏残缺。","陶弗能治，","瓦甓不凿。"],["穿透空洞水漏渗，","破烂残缺不能用。","陶制器皿难冶炼，","瓦砖难凿难补洞。"]],[["鸿飞循陆，","公出不复，","伯氏客宿。"],["大雁循着陆地飞，","您若离去不再回，","请哥在此住一会。"]],[["虾蟆群聚，","从天请雨。","云雷运集，","应时辄下，","得其所愿。"],["一群蛤蟆聚一起，","跪拜请求天降雨。","雷声轰轰云会集，","瞬间下起倾盆雨，","得其所愿心欢喜。"]],[["老弱无子，","不能自理。","为民所忧，","终不离咎。","管子治国，","侯伯宾服。","乘舆八百，","尊我桓德。"],["年老体弱无子女，","生活不能自料理。","虽然为民而担忧，","始终未能离灾异。","管仲为相治齐国，","诸侯进贡拜天子。","会盟车子八百辆，","赞我桓公德高尚。"]],[["播梅折枝，","与母别离，","绝不相知。"],["种下梅树一折枝，","与其母体远分离，","从此无法再团聚。"]],[["盛中不绝，","衰老复拙。","盈满减亏，","瘯蠡腯肥。","郑昭失国，","重耳兴立。"],["强盛适中不断绝，","衰老之后又坚强。","盈满过盛要亏损，","瘦弱转而又肥壮。","昭公被害失了国，","文公重耳得兴旺。"]],[["闻虎入邑，","心欲逃匿，","走据阳德。","不见霍叔，","终无忧慝。"],["听说恶虎进城邑，","欲想迅速去逃匿，","依靠明德把祸避。","不必前去求霍叔，","终究不会有忧虑。"]],[["随时逐便，","不失利门。","多获得福，","富于封君。"],["紧随时运乘方便，","勿失良机在眼前。","多获利益多得福，","财富胜过地方官。"]],[["禹作神鼎，","伯益衔指。","斧斤即折，","憧立独坐。","卖市不讎，","枯槁为祸。"],["夏王大禹铸九鼎，","伯益避居箕山中。","斧子断折不能用，","独坐心中忧忡忡。","受雇于人无酬偿，","困苦艰难成祸凶。"]],[["春鸿飞东，","以马货金。","利得十倍，","重载归乡。"],["春天鸿雁飞向东，","牵着良马去换金。","居然获得十倍利，","满车重载回乡中。"]],[["金齿铁牙，","寿考宜家。","年岁有余，","贪利者得，","虽忧无咎。"],["金齿铁牙体健康，","家庭和睦寿长长。","年年岁岁有余粮，","却被贪官剥夺光，","虽有忧虑无灾殃。"]],[["膏泽沐浴，","洗去污辱。","振除灾咎，","更与福处。"],["沐浴皇天之雨露，","彻底洗去我耻辱。","振作起来除灾祸，","重新与福聚一处。"]],[["履阶登墀，","高升峻巍。","福禄洋溢，","依天之威。"],["沿着台阶而登攀，","直达崔巍之山巅。","福禄爵位都得到，","依赖上天之威严。"]],[["坤厚地德，","庶物蕃息。","平康正直，","以绥大福。"],["大地厚德载万物，","繁衍生息永不绝。","和平安乐又正直，","蒙受大吉多福泽。"]],[["绝域异路，","多所畏避。","使我惊惶，","思吾故处。"],["步入绝境和异路，","心中不免生畏惧。","使我惊恐又害怕，","不由想起我故居。"]],[["襁褓孩幼，","冠带成家。","出门如宾，","父母何忧。"],["婴儿生在襁褓中，","不知不觉长成人。","出门以礼待宾客，","父母不用多操心。"]],[["一寻百节，","绸缪相结。","其指诘屈，","不能解脱。"],["八尺长有一百节，","互相缠绕又盘结。","指头弯曲伸不直，","使其不能得解脱。"]],[["鹰鹯猎食，","雉兔困极。","逃头见尾，","为人所贼。"],["鹞鹰猛禽来捕食，","野鸡兔子受困极。","藏头露尾难逃脱，","终被猎人所获得。"]],[["危坐至暮，","请求不得。","膏泽不降，","政戾民忒。"],["端端正正坐到黑，","诚心请求却不得。","雨露未能从天降，","政治残暴民困惑。"]],[["刚柔相呼，","二姓为家。","霜降即同，","惠我以仁。"],["阳刚阴柔相呼应，","二姓和合结成亲。","霜降时节即会同，","上天赐我惠与仁。"]],[["慈母念子，","飨赐得士。","蛮夷来服，","国人欢喜。"],["慈母惦念亲生子，","施饭赐教成为仕。","南蛮边夷来臣服，","举国上下欢声起。"]],[["良夫孔姬，","胁悝登台。","柴季不扶，","卫辄走逃。"],["浑良夫和孔伯姬，","为登家台胁孔悝。","高柴子路不扶持，","卫辄乱中忙逃离。"]],[["子长忠直，","李陵为贼。","祸及无嗣，","司马失福。"],["司马迁忠诚正直，","替李陵辩解入狱。","被处以宫刑无后，","可怜他清贫度日。"]],[["节度之德，","不涉乱国。","虽昧无光，","后大受庆。"],["有节有度好品德，","不会轻易去乱国。","开始成绩不明显，","后来政通受庆贺。"]],[["驱羊南行，","与祸相逢。","狼惊我马，","虎盗我子，","悲恨自咎。"],["驱赶羊群向南行，","不料竟与祸相逢。","豺狼惊吓我的马，","老虎盗走我儿子，","咎由自取生悲恨。"]],[["尼父孔丘，","善钓鲤鱼。","罗网一举，","得获万头，","富我家居。"],["圣人孔丘名仲尼，","善于垂钓大鲤鱼。","捕鱼之网一举起，","万尾鲤鱼入网里，","我家居此多福利。"]],[["本根不固，","华叶落去，","更为孤妪。"],["大树根基不牢固，","花儿叶子皆飘浮，","犹如孤妪失丈夫。"]],[["设罟捕鱼，","反得詹诸。","员困谒忠，","伍氏夷诛。"],["撒开罗网去捕鱼，","不料虾蟆入网里。","伍员尽忠又竭力，","反被吴王剑赐死。"]],[["敏捷亟疾，","如猿集木。","彤弓虽调，","终不能获。"],["动作敏捷又迅疾，","犹如飞猿树上集。","红弓虽然调试好，","始终不能获大利。"]],[["冠带南游，","与福相期。","邀於嘉国，","拜位逢时。"],["衣冠楚楚南游去，","期望得到福和利。","美好国家邀请我，","封官碰上好时机。"]],[["年丰岁熟，","政仁民乐，","禄入获福。"],["年岁丰收五谷熟，","广施仁政民安乐，","俸禄入门把福获。"]],[["筑阙石巅，","立基泉源。","疾病不安，","老孤无邻。"],["宫殿建筑在石巅，","房基立在水源边。","身患疾病心不安，","老人无邻太孤单。"]],[["逐狐东山，","水遏我前。","深不可涉，","失利后还。"],["追赶狐狸至东山，","河水阻我不能前。","水深流急不可涉，","失利之后又回返。"]],[["麟子凤雏，","生长嘉国。","和气所居，","康乐温仁，","邦多圣人。"],["麒麟小儿凤凰子，","生在美好国家里。","温顺和睦居一起，","康乐平和有仁义，","国中圣人多无此。"]],[["西行求玉，","冀得瑜璞。","反得凶恶，","使我惊惑。"],["西行前去求宝石，","希望能够获美玉。","不料反而遭凶恶，","使我惊叹又疑惑。"]],[["心狂老悖，","视听聋盲。","正命无常，","下民多孽。"],["在上糊涂又昏庸，","双目失明耳朵聋。","大政命令不正常，","百姓无辜遭灾凶。"]],[["南国少子，","材略美好。","求我长女，","贱薄不与。","反得丑恶，","后乃大悔。"],["南方有位小伙子，","相貌堂堂才略奇。","前来追求我长女，","嫌他贫穷未允许。","长女反而嫁丑夫，","事后悔恨来不及。"]],[["逶迤高原，","家伯妄施，","乱其五官。"],["高原弯曲又连绵，","小人家伯妄专权，","政治秩序多混乱。"]],[["谢恩拜德，","东归吾国，","欢乐有福。"],["感谢恩泽拜受德，","向东回到我家国，","生活幸福多欢乐。"]],[["鸡鸣同兴，","思配无家。","执佩持凫，","无所致之。"],["雄鸡鸣时同起身，","思念配偶却不能。","手持相亲好礼品，","不知将其送谁人。"]],[["凶恶忧累，","身受诛罪，","神不能解。"],["灾祸相连忧重重，","自身受罚判死刑，","天神也难除厄运。"]],[["虎豹熊罴，","游戏山谷。","仁贤君子，","得其所欲。"],["老虎豹子和熊罴，","自由出入山谷里。","仁爱贤明高尚人，","各自得到其所欲。"]],[["别离分散，","长子从军，","稚叔就贼，","寡老独居，","莫为种瓜。"],["别离分散难团圆，","长子从军上前线，","小儿无教成窃贼，","老人寡居守家园，","依靠种瓜度晚年。"]],[["海隅辽右，","福禄所至。","柔嘉蒙佑，","九夷何咎？"],["渤海之滨辽河右，","住在那里多福寿。","温柔和善得福佑，","东夷不侵有何咎？"]],[["华首之山，","仙道所游。","利以居止，","长无咎忧。"],["华山和那首阳山，","神仙道士游其间。","适合在此长居住，","长年无忧享平安。"]],[["甲乙戊庚，","随时转行，","不失常节。","萌芽律屈，","咸达出生，","各乐其类。"],["甲乙丙丁和戊庚，","随着时间而运行，","顺应时令有规循。","萌芽初始虽弯曲，","全能畅达而出生，","各得其所万物兴。"]],[["跛踬未起，","失利后市，","不得鹿子。"],["瘸子跌倒未爬起，","失去大利后到市，","不得鹿子未赢利。"]],[["怙恃自负，","不去于下。","血从地出，","诛罚失理。"],["凭借后台自逞强，","不甘寂寞居下方。","酷刑虐民血满地，","诛杀处罚失纲常。"]],[["江河淮海，","天下都市。","商人受福，","国家饶有。"],["长江黄河淮海地，","上天所赐大都市。","商人赖此受福气，","国家人民都富裕。"]],[["节情省欲，","赋敛有度。","家给人足，","且贵且富。"],["节制情欲少奢望，","征收赋税有度量。","家家户户衣食足，","荣华富贵享世长。"]],[["蛙池鸣响，","呼求水潦。","云雨大会，","流成河海。"],["虾蟆池中呼又唤，","请求雨水降田间。","乌云会集雨倾盆，","陆地流水如涌泉。"]],[["日月之途，","所行必到，","无有患故。"],["日月运行有规律，","所行必达目的地，","没有患难无过失。"]],[["乘风而举，","与飞鸟俱。","一举千里，","见吾爱母。"],["乘着风儿升天上，","与那鸟儿同飞翔。","一直飞到千里外，","见我慈母很安详。"]],[["阴配阳争，","卧木反立。","君子攸行，","丧其官职。"],["阴阳相当两相争，","树木枯僵又起生。","大人离道而行事，","失掉官职遭跌倾。"]]],[[["荆木冬生，","司寇缓刑。","威权在下，","国乱且倾。"],["荆木生长在寒冬，","司寇随意乱缓刑。","臣下威权越君王，","国家混乱王朝倾。"]],[["喘牛伤暑，","不能成亩。","草莱不辟，","年岁无有。"],["吴牛喘月畏酷暑，","不能下地耕田亩。","土地荒芜不开垦，","到了秋后无收成。"]],[["鱼欲负流，","众不同心，","至德潜伏。"],["鱼儿想要逆水行，","众多之人心不同，","致使美德全伏隐。"]],[["春耕有息，","秋入利福。","献豜私豵，","以乐成功。"],["春天耕作有收成，","秋收时节喜临门。","献上大猪和小猪，","九州同乐庆成功。"]],[["生有圣德，","上配太极。","皇灵建中，","授我以福。"],["君王生来有德义，","功高上能配太极。","先王为民立中道，","给我带来大福气。"]],[["右抚琴头，","左手援带。","凶讼不已，","相与争戾，","失利而归。"],["右手扶摩那琴头，","左手整理衣和袖。","争讼汹汹不停止，","相互逞强起斗殴，","各自失利朝北走。"]],[["炙鱼棝斗，","张伺夜鼠。","舌不忍味，","机发为罪，","笮不得去。"],["烤鱼放在棝斗里，","等待老鼠夜来食。","舌头难忍美味惑，","机关一发即捕获，","受制绳索逃不脱。"]],[["申酉脱服，","牛马休息。","君子以安，","劳者得欢。"],["夕阳西斜解劳役，","牛儿马儿得休息。","农夫回家享安逸，","劳作之人多欢娱。"]],[["尧问尹寿，","圣德增益。","使民不疲，","安无怵惕。"],["唐尧求学于尹寿，","圣明美德皆具有。","使民安居又乐业，","不用惊恐不用愁。"]],[["孤公寡妇，","独宿悲苦。","目张耳鸣，","莫与笑语。"],["孤寡老人和老妇，","各自独宿心悲苦。","人老眼花耳朵聋，","无人陪伴无笑声。"]],[["外得好畜，","相与嫁娶。","仁贤集聚，","咨询厥事。","倾夺我城，","使家不宁。"],["收养人家好儿女，","长大互相来嫁娶。","仁人贤士聚一起，","商量如何办喜事，","女儿美貌倾我城，","使得家庭不安宁。"]],[["煎砂盛暑，","鲜有不朽。","去河千里，","败我利市。","老牛盲马，","去之何悔？！"],["盛夏酷暑似炒沙，","鲜鱼难能不腐化。","离河千里无水源，","鱼市生意不方便。","老牛盲马行路难，","弃之又有何凶险？！"]],[["甲乙戊庚，","随时转行，","不失常节。","萌芽律屈，","咸达出生，","各乐其类。"],["甲乙丙丁和戊庚，","随着时间而运行，","不失常节有规循。","萌芽初始虽弯曲，","却能畅达而生出，","各得其所万物兴。"]],[["衣宵夜游，","与君相遭。","解除烦惑，","使心不忧。"],["身穿锦绡去夜游，","与君相逢意相投。","消除烦恼和疑惑，","使我心里少忧愁。"]],[["死友绝朋，","巧言为谗。","覆白污玉，","颜叔哀喑。"],["亲友远离又绝朋，","谗言诋毁害好人。","洁白美玉被玷污，","颜叔沉溺悲哀中。"]],[["逐利三年，","利走如神。","辗转东西，","如鸟避丸。"],["经商求利已三年，","利益逃走如神仙。","辗转东西相追逐，","犹如鸟儿避弹丸。"]],[["堤防坏决，","河水泛溢。","伤害稼穑，","民流去室。","君孤独宿，","没溺我邑。"],["堤防崩塌成决口，","河水泛滥狂奔流。","庄稼全都被毁坏，","流离失所民出走。","男士孤单独自居，","河水淹没我城邑。"]],[["阴阳隔塞，","许嫁不答。","旌丘新台，","悔往叹息。"],["阴阳堵塞不畅通，","许诺出嫁未回音。","《旌兵》《新台》两首诗，","追悔住昔叹不已。"]],[["伯夷叔齐，","贞廉之师。","以德防患，","忧祸不存。"],["大臣伯夷和叔齐，","正直廉洁之大师。","依靠美德防隐患，","忧患灾祸远离去。"]],[["阳为狂悖，","拔剑自伤，","为身生殃。"],["阳气亢盛逞凶狂，","持刀拔剑自砍伤，","自作自身受灾殃。"]],[["进士为官，","不若服田，","获寿保年。"],["步入仕途去做官，","不如回家去种田，","保你长寿享天年。"]],[["耕石不生，","弃礼无名。","缝衣失针，","襦袴不成。"],["石滩耕种禾不生，","抛弃礼义失圣名。","缝衣丢了针和线，","衣服裤子做不成。"]],[["灵龟陆处，","一旦失所。","伊子复耕，","桀乱无辅。"],["灵龟处在陆地中，","失其居所受苦困。","伊尹弃官去种地，","夏桀暴乱无辅臣。"]],[["室当源口，","漂溺为海。","财产殚尽，","衣食无有。"],["房屋建在水源口，","洪水如海乱奔流。","财产全都被淹没，","衣服食粮无所有。"]],[["鸡方啄粟，","为狐所逐。","走不得食，","惶惧喘息。"],["群鸡欲要食小米，","狐狸上前追赶急。","奔波逃命不得食，","惊慌恐惧又喘息。"]],[["家在海隅，","绕旋深流。","岂敢惮行，","无木以趋。"],["家住海边那一头，","河水深深有涡流。","并非畏惧不敢去，","无船涉渡空犯愁。"]],[["他山之错，","与璆为仇。","来攻吾城，","伤我肌肤，","国家骚忧。"],["他山之上磨刀石，","与我美玉成仇敌。","坏人来攻我城池，","伤我肌肤残我体，","国家动乱难治理。"]],[["弊镜无光，","不见文章。","少女不嫁，","弃于其公。"],["镜子破敝无光亮，","用它难能照模样。","少女长大不出嫁，","寄生赖其爹和娘。"]],[["大蛇巨鱼，","相搏于郊。","君臣隔塞，","戴公庐漕。"],["大蛇大鱼相拒格，","双方争斗于郊野。","君臣离心又离德，","卫侯寄居于漕国。"]],[["绝世无嗣，","福禄不存。","精神涣散，","离其躬身。"],["继绝后代无子孙，","福禄爵位都不存。","魂不附体神涣散，","远远离开自己身。"]],[["文君之德，","养仁致福。","年无胎夭，","国富民实。","忧者之望，","曾参盗息。"],["明君文王有美德，","修身养性招福泽。","年岁丰收无灾荒，","国家富有民安乐。","忧苦人盼圣贤来，","曾参使盗远离我。"]],[["合欢之国，","喜为我福。","东岳南山，","朝跻成恩。"],["和合欢乐美好国，","喜事福禄来随我。","东岳南岳两座山，","早晨彩虹成恩泽。"]],[["忧人之患，","履悖易颜，","为身祸残。","率身自守，","与喜相抱。","长子成长，","封受福祉。"],["为替别人解忧患，","落得贬民罢了官，","反使自身受伤残。","坚守崇高好节操，","常与喜伯相团圆。","儿子长大我已老，","拜受封赏福寿全。"]],[["太公避纣，","七十隐处。","卒逢圣人，","为王室辅。"],["太公为避殷纣王，","七十隐居渭河旁。","终于见到周文王，","成为辅周忠诚将。"]],[["江汉上流，","政逆民忧。","阴代其阳，","雌为雄公。"],["长江汉水逆向流，
