<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>易林占断</title>
<style>
:root{
  --paper:#f2ecdf; --paper2:#ebe3d0;
  --ink:#27221a; --ink-soft:#5f5748; --ink-faint:#8a8172;
  --cinnabar:#a6362a; --cinnabar-dark:#7f2a20;
  --gold:#b6a06c; --gold-soft:#d6c9a8;
  --water:#45605f; --muted:#a99f8d;
  --shadow:0 2px 14px rgba(60,45,25,.12);
  --bg-img:url("https://aka.doubaocdn.com/s/8V9XiXbm7V");
}
@media (prefers-color-scheme: dark){body{
  --paper:#1a1612; --paper2:#221d17;
  --ink:#e8dfd0; --ink-soft:#c0b6a4; --ink-faint:#8a8172;
  --cinnabar:#d4554a; --cinnabar-dark:#a6362a;
  --gold:#d4c08a; --gold-soft:#8a7d5c;
  --water:#7a9a99; --muted:#7a7264;
  --shadow:0 2px 14px rgba(0,0,0,.4);
  --bg-img:url("https://aka.doubaocdn.com/s/uW74wiDldQ");}}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
  background:var(--paper); color:var(--ink);
  line-height:1.7; -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:var(--bg-img);background-size:cover;background-position:center;opacity:.31;
  transition:opacity .3s;}
body.dark::before{opacity:.22}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* 顶栏 */
.head{display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px 5px;border-bottom:1px solid var(--gold-soft);min-height:0;gap:10px}
.head .head .sub{font-size:9px;color:var(--ink-faint);letter-spacing:1px;flex:1;opacity:.7;line-height:1.3}
.head .back{font-size:13px;color:var(--ink-soft);background:none;border:1px solid var(--gold-soft);
  border-radius:4px;padding:5px 14px;cursor:pointer;font-family:inherit;display:none}
.head .back.show{display:block}

/* 视图 */
.view{display:none;padding:20px 18px 40px;flex:1;animation:fadeOut .25s ease}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeOut{from{opacity:1}to{opacity:0;transform:translateY(-8px)}}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tab-pane.in{animation:paneIn .2s ease}
/* 主标题 */
.hero{text-align:center;padding:6px 0 18px}
.hero .t1{font-size:34px;letter-spacing:8px;font-weight:700;color:var(--ink)}
.hero .t1 em{font-style:normal;color:var(--cinnabar)}
.hero .t2{font-size:12px;color:var(--ink-faint);letter-spacing:4px;margin-top:6px;opacity:.8}
.hero .rule{width:88px;height:2px;background:linear-gradient(90deg,transparent,var(--cinnabar),transparent);
  margin:14px auto 0}
/* Tab */
.tabs{display:flex;border-bottom:1px solid var(--gold-soft);margin-bottom:18px}
.tab{flex:1;text-align:center;padding:10px 0;font-size:15px;letter-spacing:3px;color:var(--ink-faint);
  cursor:pointer;position:relative;transition:color .2s}
.tab.active{color:var(--cinnabar);font-weight:700}
.tab.active::after{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:2px;background:var(--cinnabar)}
/* 面板 */
.panel{background:rgba(255,253,247,.6);border:1px solid var(--gold-soft);border-radius:8px;
  padding:18px 16px;margin-bottom:16px;box-shadow:var(--shadow);backdrop-filter:blur(4px)}
body.dark .panel{background:rgba(30,26,22,.6)}
.panel h3{font-size:14px;letter-spacing:3px;color:var(--water);margin-bottom:12px;
  border-left:3px solid var(--cinnabar);padding-left:8px}
/* 摇卦 */
.yao-line{width:150px;height:26px;display:flex;justify-content:space-between;position:relative}
.yao-line .seg{height:4px;background:var(--ink);border-radius:2px;position:absolute;top:11px;transition:background .2s}
.yao-line .seg.l{left:0;width:66px}.yao-line .seg.r{right:0;width:66px}
.yao-line.yang .seg{left:0;width:150px}
.yao-line .moving{color:var(--cinnabar);font-size:12px;position:absolute;right:-20px;top:6px;letter-spacing:0}
.yao-line .pos{color:var(--ink-faint);font-size:12px;position:absolute;left:-36px;top:6px;letter-spacing:0;font-weight:600}
/* 按钮 */
.btn{display:block;width:100%;padding:13px 0;border:none;border-radius:6px;cursor:pointer;
  font-family:inherit;font-size:17px;letter-spacing:6px;text-align:center;transition:all .2s ease}
.btn.primary{background:var(--cinnabar);color:#f7efe0;box-shadow:0 3px 10px rgba(166,54,42,.35)}
.btn.primary:active{background:var(--cinnabar-dark);transform:scale(.98)}
.btn:active{transform:scale(.97)}
.btn.gold{background:transparent;color:var(--cinnabar);border:1px solid var(--cinnabar)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{flex:1}
/* 结果 */
.result{margin-top:6px}
.dui{display:flex;gap:14px;justify-content:center;align-items:stretch;margin:8px 0 4px}
.dui .gua{flex:1;text-align:center;padding:12px 6px;background:rgba(255,253,247,.75);
  border:1px solid var(--gold-soft);border-radius:6px}
body.dark .dui .gua{background:rgba(30,26,22,.75)}
.dui .gua .gname{font-size:24px;letter-spacing:4px;margin-top:8px;color:var(--ink);font-weight:700}
.dui .gua .glabel{font-size:11px;color:var(--ink-faint);letter-spacing:2px;margin-bottom:6px}
.dui .arrow{display:flex;align-items:center;color:var(--cinnabar);font-size:22px}
.yao-slot{width:100%;max-width:280px;display:flex;flex-direction:column;align-items:center;gap:4px}
.gua-cols{display:flex;flex-direction:column;gap:3px;align-items:center}
.gua-cols .yao-line{width:76px;height:18px}
.gua-cols .yao-line .seg{height:3px;top:7px}
.gua-cols .yao-line.yang .seg{left:0;width:76px}
.gua-cols .yao-line .seg.l{width:32px}.gua-cols .yao-line .seg.r{width:32px}
/* 手动选择 */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--ink-soft);letter-spacing:2px;margin-bottom:6px}
.field select{width:100%;padding:11px 10px;border:1px solid var(--gold);border-radius:6px;
  background:#fdfaf2;font-family:inherit;font-size:15px;color:var(--ink);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.hint{font-size:12px;color:var(--ink-faint);line-height:1.8;margin-top:10px;text-align:center}
/* 手动爻象输入 */
.manual-yao{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0 10px;padding:10px 0}
.my-row{display:flex;align-items:center;gap:10px;width:100%;max-width:300px;justify-content:center}
.my-pos{width:32px;text-align:right;font-size:13px;color:var(--ink-faint);letter-spacing:0;flex-shrink:0;font-weight:600;line-height:28px;align-self:center}
.my-line{width:150px;height:28px;cursor:pointer;position:relative;flex-shrink:0;display:flex;align-items:center}
.my-line .seg{height:5px;background:var(--ink);border-radius:2px;transition:background .15s}
.my-line .seg.l{width:66px;margin-right:auto}
.my-line .seg.r{width:66px;margin-left:auto}
.my-line.yang .seg{width:150px}
.my-line:active .seg{background:var(--cinnabar)}
.my-line.moving .seg{background:var(--cinnabar)}
.my-mv{width:32px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-faint);border:1px solid var(--gold-soft);border-radius:4px;cursor:pointer;flex-shrink:0;transition:.15s;user-select:none}
.my-mv.on{color:var(--cinnabar);border-color:var(--cinnabar);background:rgba(166,54,42,.08);font-weight:700}
/* 实时卦象 */
.yao-live{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 12px;margin:2px 0 12px;
  background:rgba(182,160,108,.12);border:1px solid var(--gold-soft);border-radius:8px}
body.dark .yao-live{background:rgba(212,192,138,.08)}
.yl-label{font-size:12px;color:var(--ink-faint);letter-spacing:2px}
.yl-val{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:2px;min-width:32px;text-align:center}
.yl-arrow{font-size:14px;color:var(--cinnabar)}
/* 输入框 */
.field input{width:100%;padding:12px 14px;border:1px solid var(--gold-soft);border-radius:4px;background:rgba(255,253,247,.7);font-family:inherit;font-size:15px;color:var(--ink);outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;box-sizing:border-box}
.field input:focus{border-color:var(--cinnabar)}
.field input::placeholder{color:var(--ink-faint)}
body.dark .field input,body.dark .field select,body.dark .field textarea{background:rgba(30,26,22,.7)!important;color:var(--ink)!important;border-color:var(--gold-soft)!important}
@media (prefers-color-scheme:dark){.ci-wi{border-top-color:rgba(212,192,138,.45)}}
body.dark .ci-wi{border-top-color:rgba(212,192,138,.45)}
/* 水印 */
.watermark{text-align:center;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:14px;line-height:1.8;opacity:.8}
.watermark .wm-main{color:var(--ink-faint);font-weight:600;letter-spacing:2px;font-size:10px}
.watermark .wm-sub{color:var(--muted);font-size:8px;margin-top:2px}
/* 赠言 */
.zhiyan{margin-top:18px;padding:13px 12px;border-top:1px solid var(--gold-soft);border-bottom:1px solid var(--gold-soft);text-align:center}
.zhiyan .zy-title{font-size:13px;color:var(--cinnabar);letter-spacing:4px;margin-bottom:10px;font-weight:700}
.zhiyan .zy-text{font-size:13px;color:var(--ink-soft);line-height:2.05;letter-spacing:1px;text-align:justify;text-indent:2em}
/* 林辞页 */
.ci-head{text-align:center;padding:8px 0 4px}
.seal{font-size:21px;font-weight:700;letter-spacing:3px;color:var(--cinnabar)}
.ci-seal{display:inline-block;border:3px solid var(--cinnabar);color:var(--cinnabar);
  padding:10px 28px;font-size:36px;letter-spacing:6px;font-weight:700;
  box-shadow:inset 0 0 0 1px var(--cinnabar);position:relative;line-height:1.2}
.ci-seal::after{content:"";position:absolute;top:4px;left:4px;right:4px;bottom:4px;
  border:1px solid rgba(166,54,42,.4)}
.ci-sub{font-size:11px;color:var(--ink-faint);letter-spacing:2px;margin-top:10px;opacity:.8}
.ci-tags{display:flex;gap:12px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.ci-hex{display:flex;gap:18px;justify-content:center;align-items:flex-end;margin-top:14px}
.cih-item{display:flex;flex-direction:column;align-items:center;gap:3px}
.cih-lab{font-size:10px;color:var(--ink-faint);letter-spacing:2px}
.cih-nm{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:2px;margin-top:2px}
.cih-arrow{display:flex;align-items:center;color:var(--cinnabar);font-size:16px;padding-bottom:16px}
.tag{font-size:12px;color:var(--water);border:1px solid var(--gold-soft);border-radius:20px;padding:3px 12px;letter-spacing:1px}
.tag.mv-tag{background:rgba(166,54,42,.1);border-color:var(--cinnabar);color:var(--cinnabar);font-weight:700}
.ci-panel{margin-top:16px}
/* 原文译文切换 */
.ci-toggle{display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px}
.ci-toggle button{font-size:12px;padding:5px 14px;border:1px solid var(--gold-soft);border-radius:20px;
  background:transparent;color:var(--ink-faint);cursor:pointer;font-family:inherit;letter-spacing:2px;transition:.2s}
.ci-toggle button.copy-btn{border-color:var(--water);color:var(--water)}
.ci-toggle button.copy-btn:hover{background:rgba(69,96,95,.08)}
/* 句数标签 */
/* 原文译文布局 */
.ci-yw{font-size:20px;line-height:2.2;letter-spacing:2px;color:var(--ink);text-align:center}
.ci-yw .s{display:block}
.ci-wi{margin-top:18px;padding-top:14px;border-top:1px dashed var(--gold-soft)}
.ci-wi .lbl{font-size:12px;color:var(--cinnabar);letter-spacing:4px;text-align:center;margin-bottom:10px}
.ci-wi .s{display:block;text-align:center;font-size:15px;color:var(--ink-soft);line-height:2.1}
.foot{margin-top:22px}
/* 摇卦动画过程中的爻位 */
.anim-line{opacity:.15;transition:opacity .4s}
.anim-line.on{opacity:1}
.yao-line.moving .seg{background:var(--cinnabar)}
.mv-mark{position:absolute;right:-22px;top:4px;font-size:11px;color:var(--cinnabar);letter-spacing:0;font-weight:700}
.gua-cols .mv-mark{right:-16px;top:1px;font-size:9px}
/* 空态/提示 */
.empty{text-align:center;color:var(--ink-faint);padding:30px 0;font-size:14px;letter-spacing:2px}

/* 响应式 */
@media (max-width:380px){
  .hero .t1{font-size:28px;letter-spacing:6px}
  .ci-yw{font-size:17px}
  .ci-seal{font-size:28px;padding:8px 20px}
}
/* 桌面端 */
@media (min-width:768px){
  }
@media (min-width:1024px){
  }
@media (min-width:768px){
  .app{max-width:900px}
  .ci-layout{display:flex;gap:30px;align-items:flex-start}
  .ci-left{flex:0 0 35%;position:sticky;top:20px}
  .ci-right{flex:1;min-width:0}
  .ci-yw{font-size:22px;line-height:2.3}
  .ci-wi .s{font-size:16px;line-height:2.2}
  .my-line{width:180px}
  .my-line .seg.l{width:80px}
  .my-line .seg.r{width:80px}
  .my-line.yang .seg{width:180px}
  .yao-line{width:180px}
  .yao-line .seg.l{width:80px}
  .yao-line .seg.r{width:80px}
  .yao-line.yang .seg{width:180px}
  .my-row{max-width:340px}
  .ci-right{max-width:680px;margin:0 auto}
}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="sub" id="topSub">易无思也，无为也，寂然不动，感而遂通天下之故</div>
    <button class="back" id="btnBack">返回</button>
  </div>

  <!-- 起卦视图 -->
  <div class="view active" id="view-home">
    <div class="hero">
      <div class="t1">易林占断</div>
      <div class="t2">观 象 玩 辞 · 体 用 一 源</div>
      <div class="rule"></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="yao">爻象</div>
      <div class="tab" data-tab="sel">卦名</div>
    </div>

    <!-- 手动爻象输入 -->
    <div class="panel tab-pane" id="tab-yao">
      <h3>六爻自定</h3>
      <div class="manual-yao" id="manualYao"></div>
      <div class="yao-live">
        <span class="yl-label">当前卦象</span>
        <span class="yl-val" id="liveBen">—</span>
        <span class="yl-arrow">之</span>
        <span class="yl-val" id="liveZhi">—</span>
      </div>
      <div class="btn-row">
        <button class="btn gold" id="btnResetYao">重 置</button>
        <button class="btn primary" id="btnYao">查 此 辞</button>
      </div>
      
      <div class="result" id="result"></div>
    </div>

    <!-- 卦名输入 -->
    <div class="panel tab-pane" id="tab-sel" style="display:none">
      <h3>卦名直查</h3>
      <div class="field">
        <label>本卦（原卦）</label>
        <input type="text" id="inpBen" list="guaList" placeholder="输入卦名，如：乾、坤、屯…" autocomplete="off">
      </div>
      <div class="field">
        <label>之卦（变卦）</label>
        <input type="text" id="inpZhi" list="guaList" placeholder="输入卦名，如：乾、坤、屯…" autocomplete="off">
      </div>
      <datalist id="guaList"></datalist>
      <button class="btn primary" id="btnSel">查 此 辞</button>
      <div class="hint">直接输入六十四卦卦名即可查询；本卦即所占之卦，之卦即动爻所变之卦。无动爻时之卦同本卦。</div>
      <div class="result" id="resultSel"></div>
    </div>

    <div class="zhiyan">
      <div class="zy-title">赠 言</div>
      <div class="zy-text">学者诚能观象玩辞，身体力行，则平时有养，占必有验，而圣人与我之心，庶乎其可通矣。此借《易》说理之微，有志者其勉诸！</div>
    </div>
    <div class="watermark">
      <div class="wm-main">随安制作</div>
      <div class="wm-sub">学习经占知识请关注白渊国学社公众号</div>
    </div>
  </div>

  <!-- 林辞视图 -->
  <div class="view" id="view-ci">
    <div class="panel ci-panel">
      <div class="ci-toggle">
        <button class="copy-btn" id="btnCopy">复制卦辞</button>
      </div>
            <div class="ci-layout">
        <div class="ci-left">
          <div class="ci-head">
            <div class="ci-seal" id="ciSeal">乾之乾</div>
            <div class="ci-sub" id="ciSub"></div>
            <div class="ci-tags" id="ciTags"></div>
            <div class="ci-hex" id="ciHex"></div>
          </div>
        </div>
        <div class="ci-right">
          <div class="ci-yw" id="ciYw"></div>
          <div class="ci-wi">
            <div class="lbl">白 话 译 文</div>
            <div id="ciWi"></div>
          </div>
          <div class="watermark">
            <div class="wm-main">随安制作</div>
            <div class="wm-sub">学习经占知识请关注白渊国学社公众号</div>
          </div>
        </div>
      </div>
    </div>
    <div class="foot">
      <button class="btn gold" id="btnAgain">再 起 一 卦</button>
    </div>
  </div>

  

  

</div>

<script>
const n=["乾","坤","屯","蒙","需","讼","师","比","小畜","履","泰","否","同人","大有","谦","豫","随","蛊","临","观","噬嗑","贲","剥","复","无妄","大畜","颐","大过","坎","离","咸","恒","遁","大壮","晋","明夷","家人","睽","蹇","解","损","益","夬","姤","萃","升","困","井","革","鼎","震","艮","渐","归妹","丰","旅","巽","兑","涣","节","中孚","小过","既济","未济"];const t=["乾为天","坤为地","水雷屯","山水蒙","水天需","天水讼","地水师","水地比","风天小畜","天泽履","地天泰","天地否","天火同人","火天大有","地山谦","雷地豫","泽雷随","山风蛊","地泽临","风地观","火雷噬嗑","山火贲","山地剥","地雷复","天雷无妄","山天大畜","山雷颐","泽风大过","坎为水","离为火","泽山咸","雷风恒","天山遁","雷天大壮","火地晋","地火明夷","风火家人","火泽睽","水山蹇","雷水解","山泽损","风雷益","泽天夬","天风姤","泽地萃","地风升","泽水困","水风井","泽火革","火风鼎","震为雷","艮为山","风山渐","雷泽归妹","雷火丰","火山旅","巽为风","兑为泽","风水涣","水泽节","风泽中孚","雷山小过","水火既济","火水未济"];const i={"訟":"讼","師":"师","謙":"谦","隨":"随","蠱":"蛊","臨":"临","觀":"观","賁":"贲","剝":"剥","復":"复","無":"无","頤":"颐","過":"过","離":"离","鹹":"咸","恆":"恒","遯":"遁","壯":"壮","晉":"晋","損":"损","漸":"渐","歸":"归","豐":"丰","兌":"兑","渙":"涣","節":"节","濟":"济"};const s={};n.forEach((n,i)=>{s[n]=n;s[t[i]]=n});function e(t){if(!t)return null;let e=t.trim().replace(/卦$/,"").replace(/\s+/g,"");if(s[e])return s[e];let o=e.split("").map(n=>i[n]||n).join("");if(s[o])return s[o];let a=n.filter(n=>n.includes(e)||e.includes(n));if(a.length===1)return a[0];let c=n.filter(n=>n.includes(o)||o.includes(n));if(c.length===1)return c[0];return null}const o={"乾":{y:"111111"},"坤":{y:"000000"},"屯":{y:"100010"},"蒙":{y:"010001"},"需":{y:"111010"},"讼":{y:"010111"},"师":{y:"010000"},"比":{y:"000010"},"小畜":{y:"111011"},"履":{y:"110111"},"泰":{y:"111000"},"否":{y:"000111"},"同人":{y:"101111"},"大有":{y:"111101"},"谦":{y:"001000"},"豫":{y:"000100"},"随":{y:"100110"},"蛊":{y:"011001"},"临":{y:"110000"},"观":{y:"000011"},"噬嗑":{y:"100101"},"贲":{y:"101001"},"剥":{y:"000001"},"复":{y:"100000"},"无妄":{y:"100111"},"大畜":{y:"111001"},"颐":{y:"100001"},"大过":{y:"011110"},"坎":{y:"010010"},"离":{y:"101101"},"咸":{y:"001110"},"恒":{y:"011100"},"遁":{y:"001111"},"大壮":{y:"111100"},"晋":{y:"000101"},"明夷":{y:"101000"},"家人":{y:"101011"},"睽":{y:"110101"},"蹇":{y:"001010"},"解":{y:"010100"},"损":{y:"110001"},"益":{y:"100011"},"夬":{y:"111110"},"姤":{y:"011111"},"萃":{y:"000110"},"升":{y:"011000"},"困":{y:"010110"},"井":{y:"011010"},"革":{y:"101110"},"鼎":{y:"011101"},"震":{y:"100100"},"艮":{y:"001001"},"渐":{y:"001011"},"归妹":{y:"110100"},"丰":{y:"101100"},"旅":{y:"001101"},"巽":{y:"011011"},"兑":{y:"110110"},"涣":{y:"010011"},"节":{y:"110010"},"中孚":{y:"110011"},"小过":{y:"001100"},"既济":{y:"101010"},"未济":{y:"010101"}};const a=[[[["道陟石阪，","胡言连謇。","译瘖且聋，","莫使道通。","请谒不行，","求事无功。"],["山路崎岖难攀登，","胡人话儿语不清。","心意难表耳又聋，","人际之道不畅通。","晋见上司未能成，","求谋百事皆无功。"]],[["招殃来螫，","害我邦国。","病伤手足，","不得安息。"],["招来蜂蝎而遭殃，","使我国家受损伤。","手儿脚儿都是病，","内忧外患不安详。"]],[["阳孤亢极，","多所恨惑。","车倾盖亡，","身常忧惶；","乃得其愿，","雌雄相从。"],["阳气孤独极亢盛，","多有迷惑多悔恨。","车儿倾倒毁车篷，","乘者胆战又心惊；","终于实现其愿望，","夫妻双双相随从。"]],[["鸤鸠鸣鸠，","专一无尤。","君子是则，","长受嘉福。"],["布谷鸟儿名鸤鸠，","慈爱专一无过失。","贤士信守此法则，","长久享得大福气。"]],[["目瞤足动，","喜如其愿，","举家蒙宠。"],["手舞足蹈眼跳动，","预兆喜事将来临，","全家上下蒙恩宠。"]],[["龙马上山，","绝无水泉。","喉焦唇乾，","舌不能言。"],["骑乘骏马上高山，","一路不见有水泉。","喉咙焦渴嘴唇干，","舌难动作口难言。"]],[["仓盈庾仇，","宜稼黍稷。","年丰岁熟，","民人安息。"],["仓库积粮逾千亿，","装满糜子和谷子。","年成获得大丰收，","人民休养得安息。"]],[["中夜犬吠，","盗在墙外。","神明佑助，","消散皆去。"],["半夜三更狗狂叫，","墙外隐藏有贼盗。","神灵保佑扶助我，","灾难祸患皆散消。"]],[["据斗运枢，","顺天无忧，","与乐并居。"],["斗柄围绕天枢行，","顺应天道无忧凶，","与欢与乐同相存。"]],[["空拳握手，","倒地更起。","富饶丰衍，","快乐无已。"],["手儿紧握拳头空，","跌倒地上又起身。","丰富饶有多繁盛，","愉快欢乐无止境。"]],[["不风不雨，","白日皎皎。","宜出驱驰，","通利大道。"],["风儿不吹雨不下，","晴空万里无云霞。","利于出门走四方，","康庄大道通天下。"]],[["载日晶光，","骖驾六龙。","禄命彻天，","封为燕王。"],["乘着灿烂太阳光，","六龙驾车行天上。","福禄命运如天高，","君子被封为燕王。"]],[["子号索哺，","母行求食。","反见空巢，","訾我长息。"],["幼鸟鸣叫求哺育，","雌鸟外出去寻食。","返回巢空不见子，","自责自怨长叹息。"]],[["上帝之生，","福佑日成。","修德行惠，","乐安且宁。"],["上帝恩赐君诞生，","保佑幸福长成人。","修养明德行恩惠，","快乐安详永康宁。"]],[["山险难登，","涧中多石。","车驰击，","载重伤轴。","担负差踬，","跌踒右足。"],["山路艰险难攀登，","沟中多石路难行。","车子奔驰撞轴头，","重载颠簸轴受损。","肩挑重担被绊倒，","跌跤踒伤右脚根。"]],[["禹凿龙门，","通利水源。","东注沧海，","民得安存。"],["大禹治水凿龙门，","水源顺利得畅通。","向东奔流入大海，","人民因之得安生。"]],[["乘龙上天，","两蛇为辅。","踊跃云中，","游观沧海，","民乐安处。"],["骑乘苍龙升天宫，","两蛇在旁辅圣君。","遨游飞翔彩云中，","俯视遥观大海景，","人民安居乐无穷。"]],[["彭祖九子，","据德不殆。","南山松柏，","长受嘉福。"],["仙人彭祖九个子，","常修德行不止息。","寿比南山松与柏，","长久享得好福气。"]],[["南山昊天，","刺政闵身。","疾悲无辜，","背憎为仇。"],["南山高峻天不公，","讽刺朝政怜自身。","悲哀同情无辜者，","反目相憎成仇人。"]],[["江河淮海，","天之奥府。","众利所聚，","可以饶有。","乐我君子，","百福是受。"],["长江黄河淮海域，","上天所赐之宝地。","众多利益都集聚，","生活富饶又丰足。","贤士心中多快乐，","长享幸福永安逸。"]],[["坚冰黄鸟，","常哀悲号。","不见白粒，","但睹藜蒿。","数惊鸷鸟，","为我心忧。"],["坚冰之上黄鸟栖，","常常悲愁而哀泣。","没有米粒无食物，","只见野草蒿与藜。","屡遭猛禽所恫吓，","使我心中多忧虑。"]],[["室如悬磬，","既危且殆。","早见之士，","依山谷处。"],["屋内空若挂石磬，","家境危难甚贫穷。","先见之明的君子，","迁居安全山谷中。"]],[["大禹戒路，","蚩尤除道。","周匝万里，","不危不殆。","见其所使，","无所不在。"],["大禹先行管戒严，","蚩尤前来清路面。","天子出巡万里外，","所到之处皆平安。","派遣使者如林立，","到处都能看得见。"]],[["三人为旅，","俱归北海。","入门上堂，","拜谒王母，","饮劳我酒。"],["兄弟三人结成伴，","一同回到北海边。","步入门庭登上堂，","把我祖母来拜见，","慰劳美酒心中欢。"]],[["传言相误，","非干径路。","鸣鼓逐狐，","不知迹处。"],["辗转传话有失误，","不是求进之路途。","敲着响鼓追狐狸，","谁知踪迹在何处？"]],[["三羊争雌，","相逐奔驰。","终日不食，","精气劳疲。"],["三只公羊争一雌，","追赶奔跑如飞矢。","从早到晚未进食，","耗尽精力甚劳疲。"]],[["纯服素裳，","载主以兴。","德义茂生，","天下归仁。"],["身穿庄重黑衣裳，","车载神主以兴邦。","仁义道德大彰明，","天下百姓来归降。"]],[["桀跖并处，","人民愁苦。","拥兵荷粮，","战于齐鲁。"],["暴君强盗同世处，","百姓忧愁又困苦。","集结兵力扛上粮，","鏖战在那齐与鲁。"]],[["黄鸟采绿，","既嫁不答。","念我父兄，","思复邦国。"],["黄鸟外出采荩草，","已经出嫁不应答。","思念我的父和兄，","一心想回国与家。"]],[["胎生孚乳，","长息成就。","充满帝室，","家国昌富。"],["胎生受到母哺育，","长大成就为君子。","圣人充满帝王室，","家国昌盛又富裕。"]],[["三人求橘，","反得丹穴。","女清以富，","黄金百镒。"],["三人前去寻橘子，","不料进入朱砂地。","巴蜀寡妇成富商，","获得黄金千万两。"]],[["东山西岳，","会合俱食。","百家送从，","以成恩福。"],["来自东山西岳人，","一起同食又共饮。","千家万户来随从，","恩福宜来事宜成。"]],[["眵鸡无距，","与鹊交斗。","翅折目盲，","为鸠所伤。"],["鸡患眼病无后爪，","却与喜鹊去斗打。","折了翅膀瞎了眼，","斑鸠飞来啄伤它。"]],[["隙大墙坏，","蛀众木折。","狼虎为政，","天降罪罚。","高弑望夷，","胡亥以毙。"],["缝隙裂大坏墙垣，","蛀虫众多木折断。","为政之人如虎狼，","上天问罪罚人间。","赵高行凶在望夷，","胡亥一命丧黄泉。"]],[["三痴俱走，","迷路失道。","惑不知归，","反入患口。"],["三个白痴一道行，","不辨南北和西东。","迷路不能回家中，","自投罗网遭祸凶。"]],[["弓矢俱张，","把弹折弦。","丸发不至，","道遇害患。"],["张开良弓和利箭，","弹丸在手弦儿断。","未能发射达目标，","路上遇到灾与患。"]],[["三女求夫，","伺候山隅。","不见复关，","长思忧叹。"],["三女外出寻丈夫，","等待盼望在山隅。","不见丈夫入关来，","长久思念叹命苦。"]],[["阳旱炎炎，","伤害禾谷。","穑人无食，","耕夫叹息。"],["赤日炎炎不下雨，","田里禾苗多枯死。","种田之人没饭吃，","农夫长叹又短息。"]],[["骑豚逐羊，","不见所望。","径涉虎庐，","亡羝失羔。"],["骑上小猪去追羊，","未能实现其愿望。","径直走近老虎洞，","羊儿被虎全吃光。"]],[["暗昧冥语，","转相诖误。","鬼魅所舍，","谁知卧处。"],["愚昧无知之鬼话，","辗转相传失误大。","妖魅鬼怪居何处，","谁也没有见过它。"]],[["姬姜祥淑，","二人偶食。","论仁议福，","以安王室。"],["周公和那姜太公，","两人共同辅朝政。","相聚议论仁和福，","以此安定王朝廷。"]],[["公孙驾骊，","载聘东齐。","延陵说产，","遗季衣。"],["黑马驾车公孙坐，","向东出游访齐国。","延陵季子一席话，","子产赠他贵重物。"]],[["孤竹之墟，","老妇亡夫。","伤于蒺藜，","不见少齐。","东郭棠姜，","武子以亡。"],["孤竹国的旧址上，","老妇独居丈夫亡。","蒺藜之刺伤皮肉，","不见爱妻心惶惶。","迷恋棠姜之美色，","使得武子家败亡。"]],[["仁政不暴，","凤凰来舍。","四时顺节，","民安其处。"],["仁德之政不暴戾，","神鸟凤凰来栖息。","春夏秋冬顺时节，","人民欢乐得安居。"]],[["仁劣力薄，","孱驽恐怯。","如猬见鹊，","不敢拒格。"],["才能低下力单薄，","胆战心惊甚懦弱。","如同刺猬见乌鹊，","不敢抵抗任其啄。"]],[["卫侯东游，","惑于少姬。","亡我考妣，","久迷不来。"],["卫侯出游至东国，","却被少姬所迷惑。","忘了先祖和父母，","久不归来沉女色。"]],[["噂噂所言，","莫如我垣。","欢喜坚固，","可以长安。"],["你言我语乱纷纷，","信念莫如我坚定。","防守牢固人欢乐，","可以长治久安宁。"]],[["鸣岐山，","龟应幽渊。","男女媾精，","万物化生。","文王以成，","为开周庭。"],["凤凰和鸣于岐山，","灵龟呼应在深渊。","男女适时得婚配，","万物生长得繁衍。","文王大功已告成，","开创周朝新纪元。"]],[["玄黄虺隤，","行者劳疲。","役夫憔悴，","踰时不归。"],["两腿软弱成病疾，","行路之人甚劳疲。","兵役士卒多憔悴，","超过期限难返回。"]],[["弱足刖跟，","不利出门。","市贾无利，","折亡为患。"],["已是跛脚又断跟，","不宜出门去远行。","前往经商难盈利，","夭折败亡成祸凶。"]],[["悬貆素餐，","居非其安。","失舆剥庐，","休坐徙居。"],["悬挂猪獾白吃饭，","居处虽好心不安。","丢了车子毁了房，","迁离此地莫等闲。"]],[["民怯城恶，","奸人所伏。","寇贼大至，","入我邦郭，","妻子俘获。"],["人民怯懦城垝垣，","奸人伏藏在里边。","外部贼寇齐拥来，","攻进城中造祸端，","妻儿受擒难生还。"]],[["阳低头，","阴仰首。","水为灾，","伤我宝。","进不利，","难生子。"],["阳刚之气垂下头，","阴气逞凶昂起首。","恶水漫漫成灾患，","我的宝物全部丢。","欲想前进不顺利，","难生儿子空悲愁。"]],[["背北相憎，","心意不同，","如火与金。"],["互相仇视生憎恨，","两人心志各不同，","犹如烈火逢真金。"]],[["太微帝室，","黄帝所值。","藩屏周卫，","不可得入，","常安无患。"],["太微星座帝王庭，","轩辕黄帝居其中。","四周防卫甚严密，","没有谁人敢入侵，","常享平安无祸凶。"]],[["茧栗牺牲，","敬享鬼神。","神嗜饮食，","受福多孙。"],["初生之犊作祭品，","用来敬献鬼和神。","神灵爱吃又爱饮，","赐我多福多子孙。"]],[["出门逢恶，","为患为怨。","更相击刺，","伤我手端。"],["出行遇恶又逢患，","酿成灾祸结下怨。","争论不休相搏击，","我的手指遭伤残。"]],[["鹢飞中退，","举事不遂，","宋人乱溃。"],["鹢鸟高飞中途退，","行动有难事不遂，","宋国政权遭崩溃。"]],[["跛踦相随，","日暮牛罢。","陵迟后旅，","失利亡雌。"],["跛脚赶路相随从，","黄昏牛疲难行进。","斜坡之上落伍后，","利益女友皆无踪。"]],[["龙角博颡，","位至公卿。","世禄长久，","起动安宁。"],["天庭饱满是贵相，","荣升官位不用忙。","世代食禄能长久，","进退行止都安详。"]],[["舜升大禹，","石夷之野。","征诣王庭，","拜理水土。"],["在那石夷之野中，","大禹得到舜提升。","征召他到京都来，","让他治水凿龙门。"]],[["从风放火，","荻芝俱死。","三害集房，","叔子中伤。"],["顺风放火火势旺，","莠草香草皆烧光。","三害同聚于一堂，","叔向之子受残伤。"]],[["楩生荆山，","命制输班。","袍衣剥脱，","夏热冬寒。","饥饿枯槁，","众人莫怜。"],["楩树生长在荆山，","命运受制于鲁班。","去掉枝叶剥掉皮，","遭受酷暑与严寒。","忍饥挨饿变枯萎，","众人不要去哀怜。"]],[["长面大鼻，","来解己忧。","遗吾福子，","惠我嘉喜。"],["天官福神降门庭，","来解我的忧与凶。","赐我大福赐我子，","饱受恩惠多欢欣。"]]],[[["谷风布气，","万物出生。","萌庶长养，","花叶茂盛。"],["东风吹来送喜讯，","大地复苏万物生。","萌芽出土得滋养，","红花绿叶多茂盛。"]],[["不风不雨，","白日皎皎。","宜出驱驰，","通利大道。"],["风儿不吹雨不下，","晴空万里无云霞。","利于出门走四方，","康庄大道通天下。"]],[["苍龙单独，","与石相触。","摧折两角，","室家不足。"],["苍龙独自去出行，","却与石头相触碰。","两角双双受折损，","家中事事不遂心。"]],[["城上有乌，","自名破家。","招呼鸩毒，","为国患灾。"],["城头上面落乌鸦，","自取恶名曰破家。","招惹呼唤毒鸟来，","致使国家多灾煞。"]],[["霜降闭户，","蛰虫隐处。","不见日月，","与死为伍。"],["霜降时节闭门户，","蛰虫隐藏不复出。","不见太阳和月亮，","均与死亡长相处。"]],[["天之德室，","温仁受福。","衣裳所在，","凶恶不起。"],["皇天之室德高尚，","温顺仁慈把福享。","尊卑有序多和睦，","没有凶恶来中伤。"]],[["皇陛九重，","绝不可登。","为天盖高，","未见王公。"],["宫殿台阶高又深，","绝对不能去攀登。","如同上天盖高冥，","难见达官显贵人。"]],[["孔德如玉，","出於幽谷。","升高鼓翼，","辉光照国。"],["大德君子如玉鸟，","深山幽谷飞升高。","展翅凌云生辉光，","举国上下得普照。"]],[["五轭四轨，","优得饶有。","陈力就列，","驺虞悦喜。"],["五根曲木四楔钉，","车上猎物饶又丰。","车儿列阵齐行进，","驺虞心中很高兴。"]],[["敞笱在梁，","鲂逸不禁。","渔夫劳苦，","连室乾口。"],["破篓搁在水堰上，","鲂鱼逃逸难捕上。","渔夫劳苦无所得，","家中缺水又断粮。"]],[["雷行相逐，","无有攸息。","战于平陆，","为夷所覆。"],["雷声轰轰相追逐，","没有片刻能歇步。","双方交战于平陆，","终被东夷所降服。"]],[["六龙争极，","服在下饰。","谨慎管钥，","结禁无出。"],["六条巨龙齐争雄，","苦了下属和百姓。","管好钥匙守好门，","谨慎在家莫出行。"]],[["长男少女，","相向共语，","福禄欢喜。"],["大龄男子和少女，","相互对坐说不毕，","福禄绵绵心欢喜。"]],[["奸延恶人，","使德不通。","炎火为殃，","禾稼大伤。"],["恶人作奸来行凶，","使那仁德不畅通。","赤日炎炎成旱灾，","庄稼受损难长生。"]],[["修其翰翼，","随风向北。","至虞夏国，","与舜相得。","年岁大乐，","邑无盗贼。"],["鸟儿修饰其翅膀，","顺风高飞至北方。","来到虞夏国度里，","幸与大舜聚一堂。","五谷丰登民安乐，","贼寇不侵我城邦。"]],[["铅刀攻玉，","坚不可得。","尽我筋力，","胝茧为疾。"],["铅刀刻玉不锋利，","难以雕刻我美玉。","消耗竭尽全身力，","手脚结茧成病疾。"]],[["举袂覆目，","不见日月。","衣衾簠簋，","就长夜室。"],["举起袖子遮住眼，","太阳月亮都不见。","衣被放在祭器里，","将要进入冥国间。"]],[["贼仁伤德，","天怒不福。","斩刈宗社，","失其邦国。"],["破坏仁义伤道德，","天怒不予赐福泽。","铲除宗族祭祀地，","可怜失掉其家国。"]],[["白龙赤虎，","战斗俱怒。","蚩尤败走，","死于鱼口。"],["白色巨龙赤色虎，","相互争斗俱暴怒。","蚩尤战败急逃走，","最终命丧在鱼口。"]],[["北辰紫宫，","衣冠中立。","含和建德，","常受天福。"],["北极星座紫微宫，","上皇大帝居其中。","品德高尚多和顺，","享受福禄永无穷。"]],[["稷为尧使，","西见王母。","拜请百福，","赐我喜子。"],["后稷作为尧使臣，","前去西方见王母。","拜请天地赐百福，","王母送我以喜蛛。"]],[["三人异趣，","反复迷惑。","一身五心，","乱无所得。"],["三人志向各不同，","做事犹豫难确定。","一人身上五条心，","纷扰乱溃事无成。"]],[["南山大玃，","盗我媚妾。","怯不敢逐，","退而独宿。"],["南山大猿爱美色，","窃走我的小老婆。","胆怯不敢去追逐，","返回家中守空舍。"]],[["众鬼所逐，","反作光怪。","九身无头，","魂惊魄去，","不可以居。"],["破神乱鬼都出现，","反而装得很坦然。","九条身躯没有头，","使我魂惊魄离散，","此地居住有危难。"]],[["延颈远望，","眯为目病。","不见叔姬，","使伯心忧。"],["伸长脖子向远望，","尘入眼中成目伤。","不见心爱小妹来，","哥哥心中生忧伤。"]],[["典册法书，","藏在兰台。","虽遭乱溃，","独不遇灾。"],["典籍文献法律书，","存于宫廷藏书处。","纵使遭逢大动乱，","惟有灾祸不得入。"]],[["自卫反鲁，","时不我与。","冰炭异室，","仁道隔塞。"],["从那卫国返鲁国，","好运远去不近我。","冰水炭火难同处，","仁义之道被堵塞。"]],[["瘤瘿秃疥，","为身疮害。","疾病癃残，","常不远逮。"],["脖子生瘤肤生疮，","浑身上下是病伤。","年老体弱多疾病，","不能经常去远方。"]],[["东齐郭庐，","嫁于洛都。","俊良美好，","媒利过倍。"],["东边齐国郭家庄，","有位姑娘嫁洛阳。","姑娘善良又俊美，","媒人获得利成双。"]],[["齐鲁争言，","战于龙门。","构怨结祸，","三世不安。"],["齐国鲁国起争端，","龙门之地相激战。","结下深仇和大怨，","后世子孙不得安。"]],[["膏泽肥壤，","农人丰敞。","利居长安，","历世无患。"],["土地润泽沃无比，","农夫丰衣又足食。","安居此地很适宜，","世世代代无忧虑。"]],[["仓盈庾亿，","宜种黍稷。","年丰岁熟，","民得安息。"],["仓库积粮逾千亿，","此地适合种谷糜。","庄稼获得好收成，","劳作之人得安息。"]],[["鸱鸮破斧，","邦人危殆。","赖旦忠德，","转祸为福，","倾危复立。"],["鸱鸮破斧幽风歌，","国家人民危难多。","幸赖周公有忠德，","摆脱逆境招福泽，","危难之人获安乐。"]],[["岁饥无年，","虐政害民。","乾溪骊山，","秦楚结冤。"],["贫饥之年无收成，","政治暴虐害人民。","乾溪骊山两地间，","秦楚两国结仇冤。"]],[["挒絜堁堁，","缔结难解。","嫫母衒嫁，","媒不得坐，","自为身祸。"],["结扣一结又一结，","想尽法儿难解脱。","丑女求嫁自炫耀，","媒人奔忙不得歇，","都是自身酿灾祸。"]],[["訾娵开门，","鹤鸣弹冠。","章甫进用，","舞韶和鸾。","三仁翼事，","国无灾患。"],["訾娵氏女打开门，","鹤声嘹亮弹冠庆。","贤士加冕得重用，","舞乐伴随銮铃声。","三位仁人辅政事，","国家永世享太平。"]],[["弟姊合居，","与类相扶。","愿慕群丑，","不离其友。"],["姐弟二人居一处，","双双相帮又相扶。","甘愿长聚同友好，","相依为命多和睦。"]],[["邯郸反言，","父兄生患。","涉叔忧恨，","卒死不还。"],["邯郸传来造反言，","父老兄弟受灾难。","陈胜吴广怀忧恨，","卒然阵亡不回还。"]],[["二人逐兔，","各争有得。","爱亡善走，","多获鹿子。"],["两人追兔欲捕捉，","争相前往有所得。","乐于外出善奔走，","获得小鹿多又多。"]],[["北辰紫宫，","衣冠立中。","含和建德，","常受天福。"],["北极星座紫微宫，","天上帝王居其中。","品德高尚又和顺，","长享福禄无穷尽。"]],[["拜跪请免，","不得其哺。","俯首衔枚，","低头北去。"],["跪地磕头求赦免，","终究未能获其愿。","低着头儿口衔枚，","默默无语去北边。"]],[["鹤盗我珠，","逃于东隅。","求之郭墟，","不见所居。"],["野鹤盗走我宝珠，","逃到东边阴暗处。","追至郊外去寻找，","不见野鹤在何处。"]],[["一簧两舌，","妄言谬诀。","三奸成虎，","曾母投杼。"],["两条舌头似弹簧，","胡言乱语巧中伤。","三位奸人言有虎，","曾参之母丢机杼。"]],[["伯虎仲熊，","德义洵美。","使布五教，","阴阳顺序。"],["伯虎仲熊两弟兄，","道德高尚又贤明。","使其布施传五教，","阴阳二气都协调。"]],[["褰衣涉河，","涧流浚多。","赖遇舟子，","济脱无它。"],["提起衣服欲过河，","山大沟深急流多。","幸亏船夫来帮忙，","脱险未逢灾与祸。"]],[["凭河登山，","道路阻难，","求事少便。"],["沿着河岸登高山，","道路受阻甚艰难，","出门办事不方便。"]],[["兔罝之客，","不失其恭。","和谦致乐，","君子攸同。"],["猛虎成为网中客，","却未惊慌与失措。","和气谦虚享安乐，","武士从容又沉着。"]],[["三女求夫，","伺候山隅。","不见复关，","泣涕涟如。"],["三位女子寻丈夫，","等候在那山角处。","久等不见夫归来，","泪流满面失声哭。"]],[["螟虫为贼，","害我五谷。","箪笥空虚，","家无所食。"],["田间螟虫造灾殃，","庄稼全都受残伤。","碗中空空无食物，","家人挨饿度饥荒。"]],[["望尚阿衡，","太宰周公。","藩屏辅弼，","福禄来同。"],["姜尚吕望和阿衡，","宰相姬旦称周公。","辅佐商周成大业，","幸福利禄都降临。"]],[["三牛生狗，","以戌为母。","荆夷上侵，","姬伯出走。"],["天降灾异牛生狗，","预兆戌年有祸咎。","荆地之夷来入侵，","姬伯逢此也逃走。"]],[["途遏道塞，","求事不得。"],["行路途中道阻塞，","所求之事不能得。"]],[["探怀得蚤，","所愿失道。","无有凶忧，","善居渐好。"],["伸手摸怀得跳蚤，","心想之物未得到。","没有凶险与忧虑，","安心居之会变好。"]],[["飞蚁属道，","趾多扰垣。","居之不安，","覆压为患。"],["飞蚁云集于大道，","众多行人受干扰。","所居之地不安宁，","祸患逼近难逍遥。"]],[["义不胜情，","以欲自倾。","几利危宠，","折角摧颈。"],["见利忘义太无情，","利欲熏心必自倾。","不顾危险去追求，","折角伤颈利难赢。"]],[["潼滃蔚荟，","扶首来会。","津液下降，","流潦滂霈。"],["云雾弥漫布长空，","云头会聚于津门。","顿时降下倾盆雨，","陆地波涛多汹涌。"]],[["白驹生刍，","猗猗盛姝。","赫喧君子，","乐以忘忧。"],["白马生了小马驹，","小驹健壮又美丽。","威仪显赫的武士，","乐而将那忧忘记。"]],[["车驰人趋，","卷甲相仇。","齐鲁寇战，","败于犬丘。"],["战车飞驰兵急趋，","轻装开赴前线去。","齐鲁两国相争斗，","大军败于犬丘地。"]],[["举首望城，","不见子贞，","使我悔生。"],["抬头遥望那城门，","不见丈夫我子贞，","悔恨之心由衷生。"]],[["龙斗时门，","失理伤贤。","内畔外贼，","则生祸难。"],["两龙争斗于时门，","丧失天理伤贤人。","内出叛徒生贼臣，","造成祸患灾重重。"]],[["安如泰山，","福喜屡臻。","虽有豺虎，","不致危身。"],["犹如泰山很安稳，","福喜常常降门庭。","虽有豺狼和猛虎，","不能危及我的身。"]],[["初忧后喜，","与福为市。","八佾列陈，","饮御嘉友。"],["开始忧愁后逢喜，","市场经商获大利。","应邀观赏宫廷舞，","宾客好友宴上聚。"]],[["持刀操肉，","对酒不食。","夫行从军，","少子入狱，","抱膝独宿。"],["手持利刀拿起肉，","面对酒肴不想食。","丈夫从军去打仗，","儿子被捕入牢狱，","抱着膝盖独自宿。"]],[["阴衰老极，","阳建其德。","履离戴光，","天下昭明。","功业不长，","虾蟆大王。"],["阴气微弱渐衰亡，","阳建功德呈吉祥。","踩着火苗带着光，","天下昭明又盛昌。","可惜功业不长久，","虾蟆临时称大王。"]]],[[["泛泛柏舟，","流行不休。","耿耿寤寐，","心怀大忧。","仁不逢时，","复隐穷居。"],["浮荡着的柏木舟，","随着河水任漂流。","焦虑不安难成眠，","痛苦忧伤涌心头。","仁人未逢好时机，","重又隐居把穷受。"]],[["采薪得麟，","大命陨颠。","豪雄争名，","天下四分。"],["哀公西狩获麒麟，","圣人孔丘命颠崩。","豪杰处处争名利，","天下五裂又四分。"]],[["兵征大宛，","北出玉关，","与胡寇战。","平城道西，","七日绝粮，","身几不全。"],["帅军前去征大宛，","向北出了玉门关，","与那胡人相激战。","平城路西受围困，","七天绝粮忍饥寒，","生命几乎难保全。"]],[["山崩谷绝，","大福既竭。","泾渭失纪，","玉历尽已。"],["高山崩塌峡谷裂，","大福即将要终结。","泾渭洪流失常态，","国运气数将尽绝。"]],[["夏台羑里，","汤文所厄。","鬼侯输贿，","商王解舍。"],["夏台和那羑里狱，","商汤文王受困地。","鬼侯前来行贿赂，","文王获赦免灾异。"]],[["泥滓污辱，","弃捐沟渎。","所共笑哭，","终不显禄。"],["泥泞途中受污辱，","将其弃之水沟处。","来往行人讥讽他，","终未升高享清福。"]],[["李梅冬实，","国多盗贼。","扰乱并作，","君不得息。"],["李树梅树冬结实，","国内盗贼四处起。","扰乱治安坏政事，","朝中君王难平息。"]],[["獐鹿逐牧，","饱归其居。","反还次舍，","无有疾故。"],["前去放牧獐和鹿，","吃饱之后回居处。","返还自己原室舍，","没有疾病无事故。"]],[["夹河为婚，","期至无船。","摇心失望，","不见所欢。"],["隔条大河结姻缘，","到了婚期没有船。","忐忑不安多失望，","不见哥哥心不欢。"]],[["百足俱行，","相辅为强。","三圣翼事，","王室宠光。"],["一群马蚿行路上，","相互协助力量强。","三位圣人辅朝政，","君王之室显宠光。"]],[["坐位失处，","不能自居。","调摄违和，","阴阳颠倒。"],["坐错位置失其处，","自己不能得安居。","配合失当不谐调，","阴阳双双被颠倒。"]],[["登几上舆，","驾驷南激。","合纵散横，","燕齐以强。"],["踩着小凳上了车，","四马驾行游南国。","合纵抗秦不连横，","燕齐两国得强盛。"]],[["三系维弩，","无益於辅。","城弱不守，","郭君受讨。"],["三系之丝连上弓，","同样无益守城门。","城防薄弱难护卫，","邦中好人受罚惩。"]],[["河伯大呼：","津不得渡！","船空无人，","往来亦难。"],["河神隔岸大声呼：","渡口危险不得渡！","船上空空无一人，","前往返回有险阻。"]],[["甘露醴泉，","太平机关。","仁德咸应，","岁乐民安。"],["好雨降临成醴泉，","太平盛世至人间。","君主仁德感动天，","年岁丰收民得安。"]],[["重茵厚席，","循皋采霍。","虽踬不惧，","复反其宅。"],["乘坐舒适褥席车，","沿着山脚去采藿。","虽有颠簸不畏惧，","平安顺利返其舍。"]],[["太乙驾骝，","从天上来。","征我叔季，","封为鲁侯，","无有凶忧。"],["天神太乙驾红马，","从那皇天而降下。","征召我们亲兄弟，","封为鲁国大管家，","无凶无忧真潇洒。"]],[["南巴六安，","石斛戟天。","所指不已，","耋老复丁；","敝室旧墟，","更为新家。"],["南巴之地和六安，","盛产石斛巴戟天。","叶儿长长生长快，","冬眠春生多壮健；","破旧之室成废墟，","变为新家换新颜。"]],[["家给人足，","颂声并作。","四夷宾服，","干戈韬阁。"],["家家户户都富裕，","颂扬之声四处起。","周边邻国来臣服，","刀枪干戈入了库。"]],[["东邻嫁女，","为王妃后。","庄公筑馆，","以尊王母。","归于京师，","季姜悦喜。"],["东边邻国出嫁女，","做了桓王之正室。","庄公城外建新馆，","以示尊崇周王姬。","嫁至周都洛邑城，","季姜心中很欢喜。"]],[["陈妫敬仲，","兆兴齐姜。","营丘是适，","八世大昌。"],["陈国敬仲娶新娘，","卜卦预兆兴齐姜。","迁往齐国营丘地，","子孙八代大顺昌。"]],[["路多枳棘，","步刺我足。","不利旅客，","为心作毒。"],["途中灌木荆棘多，","我的双脚被刺破。","不利出门去远行，","心烦意乱悔恨生。"]],[["天宫列宿，","五神共舍。","宫阙光坚，","君安其居。"],["星辰列为集合体，","五神拱卫太一室。","宫殿明亮又坚固，","君王在此得安居。"]],[["牧羊稻园，","闻虎呻喧。","惧畏息惕，","终无祸患。"],["放牧羊儿于稻田，","忽然听见虎声喧。","畏恐惧怕而警惕，","终于免遭祸与患。"]],[["鸣条之灾，","北奔犬胡。","左衽为长，","国号匈奴。","主君旄头，","立尊单于。"],["鸣条逢灾受劳苦，","向北奔跑逃往胡。","身上穿着大襟服，","国家号称为匈奴。","主君旗帜旄尾饰，","高举飘扬称单于。"]],[["克身洁己，","逢禹巡狩。","锡我玄圭，","拜受福佑。"],["严格律己洁自身，","时逢大禹来巡行。","赐我黑色之美玉，","拜受福禄享荣崇。"]],[["冬华不实，","国多盗贼；","疾病难医，","鬼哭其室。"],["寒冬开花不结果，","国不兴盛盗贼多；","体内有病难医治，","恶鬼入室唱悲歌。"]],[["襄送季女，","至于荡道。","齐子旦夕，","留连共处。"],["齐国襄公送小妹，","送至鲁国大道上。","齐姜早晚思念他，","恋恋不舍久彷徨。"]],[["朽根倒树，","花叶落去。","卒逢火焱，","随风偃仆。"],["根部腐朽树倒地，","花儿叶子都落去。","突然碰上大火烧，","顺风倾侧难立起。"]],[["阴变为阳，","女化为男；","治道得通，","君臣相承。"],["阴柔之气化阳刚，","女子变为男儿郎；","治国之道得通畅，","君有贤臣作辅相。"]],[["炎绝续光，","火灭复明。","简易理得，","以成乾功。"],["烈炎渐绝光又升，","大火熄灭又复明。","坤简乾易理尽在，","天道之功即告成。"]],[["多载重负，","捐弃于野。","予母谁子，","但自劳苦。"],["超载负荷太沉重，","终被弃于荒野中。","不知他是谁家子，","自作自受妄劳神。"]],[["江河海泽，","众利安宅。","可以富有，","饮御嘉客。"],["长江黄河海之泽，","适宜百姓安室舍。","能够发家和致富，","美酒宴请我宾客。"]],[["冬采薇兰，","地冻坚坼。","利走东北，","暮无所得。"],["冬天出门采薇兰，","天寒地冻甚艰难。","大利逃隐于东北，","到了天黑空手还。"]],[["乌鸣嘻嘻，","天火将起。","燔我室屋，","灾及妃后。"],["凶鸟嘻嘻在鸣叫，","预兆天火将来到。","大火毁了我室屋，","妃后宫舍遭焚烧。"]],[["虿室蜂户，","螫我手足。","不可进取，","为身害速。"],["步入蝎室和蜂窝，","我的手脚遭其蜇。","不得轻易朝前行，","以免自身逢灾祸。"]],[["崔嵬北岳，","天神贵客。","温仁正直，","主布恩德。","闵哀不已，","蒙受大福。"],["北岳恒山高又大，","天上神仙来下榻。","温和仁义又正直，","布恩施德遍天下。","同情呵护万万年，","百姓蒙恩福气大。"]],[["伯蹇叔盲，","莫与守牧。","失我衣裘，","代己除服。"],["哥哥跛脚弟弟盲，","不能任职管地方。","失了我的为官服，","盗贼代我当州长。"]],[["为季求妇，","家在东海。","水长无船，","不见所欢。"],["想给小弟寻媳妇，","她家远在东海住。","大水漫漫无渡船，","前往相亲有难处。"]],[["山陵丘墓，","魂魄失舍。","精神尽竭，","长寝不觉。"],["山间丘陵墓穴地，","魂魄失散离人体。","精灵神气丧失尽，","长眠地下不复苏。"]],[["踦牛失角，","下山伤轴，","失其利禄。"],["跛脚之牛失了角，","拉车下山轴断折，","求利机会全错过。"]],[["水载船舟，","无根以浮。","往来溶溶，","心劳且忧。"],["船儿顺流漂又荡，","犹如萍草浮水上。","河水汹涌宽又广，","使我劳神心发慌。"]],[["有鸟飞来，","集于宫树。","鸣声可恶，","主将出去。"],["凶鸟飞来自远方，","落在王宫古树上，","叫声嘻嘻讨人嫌，","主人将要入冥乡。"]],[["东徒不时，","触患离忧。","井泥无濡，","思叔旧居。"],["徒步东行不多时，","离开忧愁患又至。","井中有泥不见水，","思念小弟原居室。"]],[["黄帝所生，","伏羲之宇。","兵刃不至，","利在居止。"],["黄帝诞生之宝地，","伏羲所居之屋宇。","刀枪干戈不临至，","利于在此久安居。"]],[["东山拯乱，","处妇思夫。","劳我君子，","役无休止。"],["丈夫东山去平乱，","妻在家中独思念。","辛苦劳累我老公，","怨恨兵役没个完。"]],[["跛踬未起，","失利后市，","不得鹿子。"],["瘸子摔倒爬不起，","误了赶集好时光，","不得鹿子未盈利。"]],[["大蛇当路，","使季畏惧。","汤火之灾，","切近我肤。","赖其天幸，","趋於王庐。"],["大蛇挡在路中央，","刘邦见了心中慌。","热水烈火灾齐降，","一同逼近我身旁。","幸亏赖有天相助，","跑进王屋得躲藏。"]],[["从容长闲，","游戏南山。","拜祠祷神，","神使无患。"],["从从容容多清闲，","游戏玩乐在南山。","前往祠庙去祷告，","神灵使我免灾患。"]],[["区脱康居，","慕仁入朝。","湛露之欢，","三爵毕恩。","复归旧庐，","与母相扶。"],["土堡哨所康居民，","仰慕仁义入朝廷。","晨露浓浓心中欢，","三杯御酒谢皇恩。","重返边疆回故里，","扶持侍奉老母亲。"]],[["鱼鳖列市，","河海饶有。","长财善贾，","商季悦喜。"],["活鱼鲜鳖满集市，","河海之中多富足。","聚财多多善经营，","商人心中多欢喜。"]],[["年常蒙庆，","今岁受福。","三夫采芑，","出必有得。"],["年年常有吉庆事，","今朝更得大福利。","三人前去采苦菜，","出门劳作获收益。"]],[["二人俱东，","道怒争讼。","意乖不同，","使君忷忷。"],["两人同往东方行，","路上不幸起争讼。","意见各自不相同，","使君畏惧又惶恐。"]],[["树我藿豆，","为鹿兔食。","君不慎护，","秋无收入。"],["我种豆苗长田里，","鹿和兔子都来吃。","如若不去保护它，","秋天难以收豆子。"]],[["黄鸟悲鸣，","愁不见星。","困於鸷鸟，","鹯使我惊。"],["黄鸟悲愁又哀鸣，","惆怅不见有救星。","凶鸟前来残害它，","屡屡受惊于猛禽。"]],[["双凫俱飞，","欲归稻池。","经涉萑泽，","为失所射，","伤我胸臆。"],["一对野鸭空中飞，","想回稻田食粒穗。","经过芦苇沼泽地，","暗箭射中其心扉，","伤身失意事不遂。"]],[["久客无依，","思归故乡。","霖雨盛溢，","道未得通。"],["久居在外无人帮，","一心想回我故乡。","阴雨绵绵水横流，","路途泥泞不通畅。"]],[["道路辟除，","南至东辽。","卫子善辞，","使国无忧。"],["道路遥远又偏僻，","往南到那东辽地。","卫子能说又会道，","使我国家无忧虑。"]],[["同枕共袍，","中年分去；","价少无利，","独居愁思。"],["同床共枕同家室，","到了中年却分离；","价钱低微无利图，","独居家中空愁思。"]],[["众神集聚，","相与议语：南国虐乱，","百姓愁苦。","兴师征讨，","更立贤主。"],["众多智士聚一起，","相互讨论和商议：南方发生大动乱，","黎民百姓生忧虑。","带领军队去征讨，","重立贤君整秩序。"]],[["北陆闭蛰，","隐伏不出。","目盲耳聋，","道路不通。"],["寒冬腊月百虫蛰，","动物隐伏不出穴。","眼盲耳聋情难明，","道路受阻不畅通。"]],[["痴狂妄作，","心诳善惑。","迷行失路，","不知南北。"],["有位白痴走出门，","骗子谎言信为真。","迷失方向和道路，","不辨南北与西东。"]],[["栋隆辅强，","宠贵日光。","福善并作，","乐以高明。"],["担当重任辅强将，","尊宠荣贵如日光。","为人多行积善事，","甘献谋略为臣上。"]],[["爱我婴女，","牵衣不与。","冀幸高贵，","反曰贱下。"],["有人喜欢我小女，","前来求亲未允许。","企盼荣华富贵人，","反而嫁给卑贱婿。"]]],[[["海为水王，","聪圣且明。","百流归德，","无有叛逆，","常饶优足。"],["茫茫大海水之王，","聪慧神圣又明亮。","万水朝宗她之德，","百川归流不逆淌，","长久富饶又丰畅。"]],[["左辅右弼，","金玉满堂。","常盈不亡，","富如敖仓。"],["左行右往有人帮，","金银财宝满庭堂。","经常丰盈不缺少，","财富堆积如敖仓。"]],[["安息康居，","异国穹庐。","非吾习俗，","使我心忧。"],["安息和那康居人，","住在圆顶毡帐篷。","习俗与我不相同，","不免使我生忧心。"]],[["何草不黄？","至未尽玄。","室家分离，","悲愁于心。"],["什么草儿不枯黄？","秋风肃杀难生长。","家人背井又离乡，","悲哀忧愁涌心上。"]],[["范公鸱夷，","善贾饰资。","东之营丘，","易字子皮。","把珠载金，","多得利归。"],["楚人范蠡号鸱夷，","善于经商获大利。","向东来到营丘地，","更改其名曰子皮。","载着金玉和宝珠，","获利多多归故里。"]],[["老杨日衰，","条多枯枝；","爵级不进，","日下摧𬯎。"],["老杨树枝渐衰亡，","树梢上面叶枯黄；","为官之人难晋级，","久不得志甚迷惘。"]],[["小狐渡水，","污濡其尾；","利得无几，","与道合契。"],["小狐过河无经验，","蘸湿尾巴涉渡难；","得到利益不太多，","顺势行事无凶险。"]],[["豕生鱼鲂，","鼠舞庭堂。","奸佞施毒，","上下昏荒，","君失其邦。"],["天降灾祸猪生鲂，","黄鼠起舞于庭堂。","奸佞小人施毒计，","上下昏庸又恐慌，","君丧政权失其邦。"]],[["天地配享，","六位光明。","阴阳顺序，","以成厥功。"],["天地二气相融通，","上下四方都光明。","阴阳平衡甚协调，","以使大功得告成。"]],[["踝踵足伤，","右指病痈。","失旅后时，","利走不归。"],["踝骨脚跟都受伤，","右手指头长毒疮。","旅途耽误迟到市，","赢利机会全丢光。"]],[["异体殊患，","各有所属。","西邻孤媪，","欲寄我室。","主母骂詈，","求不可得。"],["不同体肌不同患，","各有所属各有难。","西面邻里孤老媪，","要来我家避灾患。","主母骂声不间断，","愿望落空难兑现。"]],[["操秬乡亩，","祈贷稷黍。","饮食充口，","安和无咎。"],["耕种黑黍于田间，","依靠借贷度日年。","饮食充饥填饱腹，","平安顺利无凶险。"]],[["新受大宠，","福禄重来。","乐且日富，","蒙庆得财。"],["新近拜受大恩宠，","幸福利禄又来临。","欢欣鼓舞庆富裕，","庆贺发财走好运。"]],[["举杯饮酒，","无益温寒。","指直失取，","亡利不欢。"],["举杯饮酒欲驱寒，","身无温暖寒不散。","手指发僵难获取，","利益逃亡心不欢。"]],[["日月相望，","光明盛昌。","三圣茂承，","功德大隆。"],["太阳月亮相遥望，","天下光明又盛昌。","三位圣人为辅臣，","功德美名传四方。"]],[["猾夫争强，","民去其乡。","公孙叔子，","战於城南。"],["狡诈之人逞凶狂，","百姓逃离其家乡。","叔段之子公孙滑，","战于城南郊野上。"]],[["猿堕高木，","不踒手足。","还归其室，","保我金玉。"],["猿从大树坠落地，","没有摔伤手和足。","返回它的原居处，","保全我的金和玉。"]],[["逐狐东山，","水遏我前。","深不可涉，","失利后便。"],["追赶狐狸至东山，","河水阻隔难向前。","水深流急难涉过，","起初失利后得便。"]],[["凿井求玉，","非卞氏宝；","名困身辱，","劳无所得。"],["凿地打井求宝玉，","所得并非和氏璧；","名声受困身受辱，","辛苦劳作无收益。"]],[["黄玉温德，","君子所服。","甘露溽暑，","万物生茂。"],["黄玉厚实又温润，","官人佩戴行德仁。","甘露滋润解酷暑，","万物生长多茂盛。"]],[["画龙头颈，","文章不成。","甘言善语，","说辞无名。"],["画出龙头和龙颈，","色彩花纹未绘成。","甜言蜜语纵好听，","空话连篇无实名。"]],[["招祸致凶，","来弊我邦。","病在手足，","不得安息。"],["招来灾祸造成凶，","使我国破家受损。","手上脚上都是病，","终日慌慌难安宁。"]],[["履位乘势，","靡有绝毙。","皆为隶圉，","与众庶位。"],["在位乘势行坏事，","没有一个不倒毙。","罢官离朝做隶卒，","贬为黎民遭嫌弃。"]],[["獐鹿雉兔，","群聚东圃。","卢黄白脊，","俱往趋逐。","九十得，","君子有喜。"],["獐鹿野鸡和小兔，","成群聚集东苑圃。","黄毛白脊好猎犬，","一同前往去追逐。","十拿九稳都抓获，","主人心中多欢娱。"]],[["织锦未成，","纬尽无名。","长子逐兔，","鹿起失路。","见利不得，","因无所据。"],["纺线针织未成锦，","纬线全部都用尽。","老大出门去追兔，","所捕鹿子又逃隐。","眼见利益未到手，","无水只缘渠未成。"]],[["天厌周德，","命与仁国。","以礼靖民，","兵革休息。"],["上天厌恶周之德，","大命受于仁政国。","以礼安抚老百姓，","休旗偃鼓止干戈。"]],[["重译贡芝，","来除我忧。","善说遂良，","与喜相求。"],["辗转翻译献灵芝，","解除我的忧与虑。","善于陈辞献良言，","为我求得吉庆事。"]],[["膏壤肥泽，","人民孔乐。","宜利居止，","长安富有。"],["雨水充足田肥沃，","农夫狂欢甚逍遥。","利于在此建家宅，","长久安乐享富饶。"]],[["白龙黑虎，","起伏暴怒。","战于涿鹿，","蚩尤败走；","居止不殆，","君安其所。"],["白色巨龙黑色虎，","起伏不定俱暴怒。","黄帝征战于涿鹿，","蚩尤失败急逃出；","居住之地无危险，","好人可以安其居。"]],[["抱关传言，","聋跛摧筋。","众贱无下，","灾殃所在。"],["守门之人传来言，","聋子跛子受摧残。","低微卑贱众百姓，","通通遭殃受灾难。"]],[["忧祸解除，","喜至庆来。","坐立欢门，","与乐为邻。"],["忧愁祸患去无踪，","吉祥喜事随我身。","坐立欢乐之门庭，","与乐与福成新邻。"]],[["折锋载殳，","舆马放休。","行军依营，","天下安宁。"],["刀锋兵器全封存，","战车战马都不用。","军队收兵回营来，","天下太平又安宁。"]],[["至德之君，","仁政且温。","伊吕股肱，","国富民安。"],["德高望重圣贤君，","行施温和之仁政。","伊尹吕尚来辅佐，","国家富强民安宁。"]],[["千里望城，","不见山青。","老兔虾蟆，","远绝无家。"],["千里之外遥望城，","不见水秀和山明。","月中玉兔和虾蟆，","居之遥远没有家。"]],[["有莘季女，","为夏妃后。","贵夫寿子，","母字四海。"],["有莘氏的小女儿，","成为夏王之后妃。","丈夫高贵子长寿，","母名四海显神威。"]],[["不虞之患，","祸至无门。","奄忽暴卒，","痛伤我心。"],["天生意外之祸患，","降临来到我身边。","亲人突然暴病亡，","悲痛伤透我心肝。"]],[["飞鹰退去，","不食雉鸡；","忧患解除，","君主安居。"],["雄鹰高飞远离去，","没有伤害我小鸡；","忧愁祸患得解除，","君主可以安其居。"]],[["跮蹉侧跌，","申酉为祟。","戌亥灭明，","颜子隐藏。"],["忽进忽退行走难，","申时酉时祟为患。","戌时亥时瞎了眼，","颜子隐藏躲难关。"]],[["司禄凭怒，","谋议无道。","商氏失政，","殷人乏嗣。"],["天神司禄发大怒，","谋议惩罚无道主。","商朝失去其政权，","殷人从此断香烟。"]],[["望鸡得雏，","冀马获驹。","大德生少，","有廖从居。"],["希望得鸡获小鸡，","企盼良马获小驹。","仁德虽大获惠少，","只求安居病痊愈。"]],[["忉忉怛怛，","如将不活。","黍稷之恩，","灵辄以存。"],["忧思劳苦甚悲伤，","忍饥受寒饿断肠。","赵盾恩赐糜与谷，","灵辄脱难免身亡。"]],[["噂噂嗫嗫，","夜作昼匿。","谋议我资，","来攻我室。","空尽我财，","几无以食。"],["躲躲闪闪心不良，","晚上行事白天藏。","鬼鬼祟祟谋我财，","野心勃勃攻我房。","家中钱物被抢光，","使我几乎绝食粮。"]],[["天之所坏，","不可强支。","众口指笑，","虽贵必危。"],["天不作美坏我事，","不得免强硬撑支。","众人指责又讥笑，","虽然显贵祸必至。"]],[["目动睫睏，","喜来加身。","举家蒙欢，","吉利无殃。"],["眼睛睫毛齐跳动，","预兆喜事将来临。","全家老少蒙恩宠，","吉利平安无忧凶。"]],[["鼋羹芬香，","染指弗尝。","口饥於手，","子公恨谗。"],["鼋的羹汤带芬香，","劝君莫去染指尝。","腹饥口馋去动手，","子公大怒君遭殃。"]],[["天福所丰，","兆如飞龙。","成子得志，","六二以兴。"],["皇天恩赐福禄丰，","兆兴犹如乘飞龙。","成子得政展大志，","时逢六二以起兴。"]],[["氓伯易丝，","抱布自媒。","弃礼急情，","卒罹悔忧。"],["莽撞小伙找对象，","抱布贸丝缠姑娘。","抛弃礼节心太急，","终于后悔自忧伤。"]],[["夏姬亲附，","心听悦喜。","利以博取，","无言不许。"],["夏姬亲近求依附，","公子王侯被迷住。","言听计从获大利，","要求愿望皆允许。"]],[["南山昊天，","刺政闵身。","疾悲无辜，","背憎为仇。"],["悠悠昊天不公平，","讥讽朝政忧自身。","悲哀同情无辜者，","谏臣反而成仇人。"]],[["三人为旅，","俱归北海。","入门上堂，","拜谒王母。","劳赐我酒，","欢乐无疆。"],["三人结伴去旅行，","一起到达北海郡。","跨入门庭走上堂，","王母见了很高兴。","恩赐美酒慰劳我，","欢乐无比好开心。"]],[["愆淫旱疾，","伤害稼穑。","丧制病来，","农人无食。"],["赤日炎炎旱情重，","伤害禾苗无收成。","失去控制疫病至，","可怜挨饿种田人。"]],[["攫饭把肉，","以就口食。","所往必得，","无有虚乏。"],["手中拿着饭与肉，","一并送进自己口。","所到之处必有获，","事遂人愿不用愁。"]],[["鸟飞无翼，","兔走折足。","虽欲会同，","未得所欲。"],["鸟无翅膀难奋飞，","兔子奔跑折了腿。","双双虽然想见面，","目的未达事不遂。"]],[["体重飞难，","不得逾关。","行坐忧愁，","不离室垣。"],["身体沉重飞行难，","不能顺利越山关。","起居行动生悲愁，","不宜远离自家园。"]],[["四雄并处，","人民愁苦。","拥兵西东，","不得安所。"],["四位枭雄并世处，","人民忧虑多愁苦。","东西南北起战火，","百姓不得安其居。"]],[["译重关牢，","求解己忧。","心感乃成，","与喜俱居。"],["旅途关口甚牢固，","翻译使我忧解除。","相互坦诚来交心，","喜事伴我常相处。"]],[["患解忧除，","王母相於。","与喜俱来，","使我安居。"],["忧患解脱祸消除，","承蒙祖母来辅助。","喜事降临我身旁，","使我得以安其居。"]],[["冬生不华，","老女无家。","霜冷蓬室，","更为枯株。"],["冬日生长不开花，","老女未嫁没有家。","茅草屋里遭霜打，","变成枯株不生芽。"]],[["震栗恐惧，","多所畏恶。","行道留难，","不可以步。"],["胆战心惊甚惶恐，","多有畏惧怕恶棍。","行路途中障碍多，","不可轻意出远门。"]],[["三人共妻，","莫适为雌。","子无名氏，","翁不可知。"],["三个男人共一妻，","不晓她是准之媳。","生儿不知父亲姓，","究为谁子有谁知？"]],[["草凋被霜，","花叶不长。","非时为灾，","家受其殃。"],["草木凋零逢严霜，","花儿不开叶不长。","四时不顺成灾害，","家中受难遭祸殃。"]],[["雉兔之东，","狼虎所从。","贪饕凶恶，","不可止息。"],["野鸡兔子之东边，","常有虎狼来窥探。","老饕贪婪甚凶恶，","使我难能得休闲。"]],[["马惊破车，","主堕深沟。","身死魂去，","离其室庐。"],["马儿受惊弄破车，","主人不幸坠沟壑。","身受劫难魂离去，","离别家室去冥国。"]],[["山林麓薮，","非人所处。","鸟兽无礼，","使我心苦。"],["山脚林旁草湖边，","人们居之不得安。","鸟兽无礼来侵扰，","使我心苦身受寒。"]]],[[["火灭复息，","君明其德。","仁人可遇，","身受利福。"],["大火熄灭又复燃，","贤士明德又重显。","仁义之人能遇到，","身受其福大无边。"]],[["温山松柏，","常茂不落。","鸾凤所庇，","得其欢乐。"],["温山之上有松柏，","常年茂盛不落叶。","鸾凤庇栖林荫中，","繁衍生息得欢乐。"]],[["西诛不服，","恃强负力。","倍道趋敌，","师徒败覆。"],["领兵西去伐匈奴，","倚仗兵强而自负。","日夜兼程趋敌人，","最终落得军败覆。"]],[["三涂五岳，","阳城太室。","神明所伏，","独无兵革。"],["巍巍三涂五岳山，","阳城太室入云间。","天神地神会集地，","没有兵燹来作乱。"]],[["久旱三年，","草木不生。","粢盛空乏，","无以供灵。"],["久旱不雨整三年，","草木不生地皮干。","祭品空乏无糜谷，","没有东西敬神仙。"]],[["三牛生狗，","以戌为母。","荆夷上侵，","姬伯出走。"],["天降灾异牛生狗，","预兆戌年有祸咎。","荆地之夷来侵犯，","姬伯逢此也逃走。"]],[["凫游江海，","没行千里，","以为死亡。","复见空桑，","长生乐乡。"],["野鸭游在江海上，","潜行千里把身藏，","有人认为它死亡。","重新出现于空桑，","住进长生快乐乡。"]],[["太乙驾骝，","从天上来。","征君叔季，","封为鲁侯，","无有凶忧。"],["天神太乙驾红马，","从那上天而降下。","征召我们亲兄弟，","封为鲁国大管家，","无凶无忧多潇洒。"]],[["纴绩独处，","寡处无夫。","阴阳失志，","为人仆使。"],["纺线织布独自处，","女子守寡无丈夫。","阴阳二气不协调，","为人所使做人仆。"]],[["兵征大宛，","北出玉门，","与胡寇战。","平城道西，","七日绝粮，","身几不全。"],["领兵讨伐大宛国，","向北出了玉门关，","与那胡人相激战。","平城路西受围困，","七天绝粮忍饥寒，","生命几乎难保全。"]],[["楚灵暴虐，","罢极民力。","祸起乾溪，","弃疾作毒。","扶伏奔逃，","死申亥室。"],["灵王暴虐甚凶残，","百姓疲弊受熬煎。","乾溪之地起祸患，","公子弃疾造灾难。","君为性命伏地逃，","申亥家中丧黄泉。"]],[["雌单独居，","归其本巢。","毛羽憔悴，","志如死灰。"],["雌性鸟儿独生活，","回到它的原巢穴。","羽毛失去其光泽，","意志消沉如灰灭。"]],[["两矛相刺，","勇力钧敌。","交绥结和，","不破不缺。"],["两人挥矛相搏击，","双方势力相匹敌。","中途退却又和好，","兵器完美无缺失。"]],[["乘船济渡，","载人逢火。","赖幸免祸，","蒙我生全。"],["搭乘船儿去渡河，","有水哪怕遇到火。","消除灾祸有依托，","承蒙老天保佑我。"]],[["丧宠溢尤，","政倾家覆。","我宗失国，","秦灭周室。"],["失去尊宠过错多，","政权倾覆家败破。","我的宗族失了国，","周朝王室被秦灭。"]],[["冬无藏冰，","春阳不通。","阴流为贼，","国被其殃。"],["暖冬反常不结冰，","春季阳气又不通。","阴气横行成祸害，","国受其殃灾无穷。"]],[["田鼠野鸡，","意常欲逃。","拘制笼槛，","不得动摇。"],["田间老鼠和野鸡，","心中常想逃离去。","将它圈在笼子里，","失去自由难逃匿。"]],[["佩玉繠兮，","无所系之。","皆酒一盛，","莫与笑语。","孤寡独特，","常愁忧苦。"],["佩玉下垂啊，","无法系着它。","美酒一杯啊，","难诉知心话。","孤独之人啊，","忧苦缠着他。"]],[["没游源口，","求鲛为宝。","家危自惧，","复出生道。"],["潜游直达水源口，","宝物鲨鱼获到手。","家逢危难心恐惧，","一条生路在前头。"]],[["河水孔穴，","败坏我室。","水源无岸，","鱼鳖倾倒。"],["河水冲坏堤坝岸，","横流毁了我家园。","大水茫茫无边际，","水中鱼儿乱滚翻。"]],[["教羊牧兔，","使鱼捕鼠；","任非其人，","费日无功。"],["委派羊儿去牧兔，","指使鱼儿捉老鼠；","选用之人难胜任，","耽误时间枉劳苦。"]],[["升户入室，","就温燠食。","冰冻北陆，","不能相贼。"],["住在套间温室中，","享受热暖食与饮。","纵使北陆藏寒冰，","阴气也难来入侵。"]],[["孤竹之墟，","老妇亡夫。","伤於蒺藜，","不见少妻。","东郭棠姜，","武氏破亡。"],["孤竹国的旧址上，","老妇独居丈夫亡。","遭受蒺藜所伤害，","不见少妻心惶惶。","东郭棠姜武子娶，","困惑凶险家败亡。"]],[["凶祸灾殃，","日益明彰。","福不可釐，","三郤夷伤。"],["凶祸和灾殃，","一天天明彰。","幸福不可赐，","三郤遭杀伤。"]],[["载璧秉珪，","请命于河。","周公作誓，","冲人瘳愈。"],["手持元圭和玉璧，","请求河神把恩赐。","周公愿替成王死，","年轻人儿病痊愈。"]],[["鸟飞鹊举，","照临东海。","尨降庭坚，","为陶叔后。","封圻英六，","履禄绥厚。"],["鸟儿高飞升起来，","一路顺风到东海。","尨降庭坚两兄弟，","同是陶叔的后代。","封于英地和六地，","安享福禄多资财。"]],[["危坐至暮，","请求不得。","膏泽不降，","政戾民忒。"],["正身而跪至天黑，","请求之事不能得。","君王不把恩泽施，","政治暴虐民困惑。"]],[["宜昌娶妇，","东家歌舞。","晏乐有绪，","长安嘉喜。"],["宜昌娶来新媳妇，","东家载歌又载舞。","欢宴庆贺有秩序，","长享安乐和嘉福。"]],[["凿井求玉，","非卞氏宝。","名困身辱，","劳无所得。"],["凿地打井求宝玉，","所得并非和氏璧。","名声受困身受辱，","辛苦劳作无收益。"]],[["鹄思其雄，","欲随凤东。","顺理羽翼，","出次须日。","中留北邑，","复反其室。"],["雌性天鹅思其雄，","随着凤凰飞向东。","修饰理顺其羽翼，","迎着太阳升高空，","中途停留在北邑，","终又返回自家室。"]],[["早霜晚雪，","伤害禾麦。","损功弃力，","饥无所食。"],["傍晚降雪晨降霜，","麦苗受害不生长。","劳苦无功白费力，","饥肠辘辘饿难当。"]],[["蝙生子，","深目黑丑。","虽饰相就，","众人莫取。"],["蝙蝠所生之子女，","眼睛深凹丑无比。","乔装打扮找婆家，","没有谁人愿娶它。"]],[["去如飞鸿，","避凶直东。","遂得全脱，","与福相逢。"],["出走如同那飞鸿，","为避凶险直向东。","欣然脱离灾与祸，","与福与禄喜相逢。"]],[["婚姻合配，","同枕共牢。","以降休嘉，","子孙封侯。"],["男才女貌两相配，","一齐用餐同枕睡。","老天赐福降嘉喜，","子孙封爵得晋级。"]],[["咸阳辰巳，","长安戌亥。","丘陵生止，","非鱼鳅市。","不可避阻，","终无悔咎。"],["迎着朝霞出咸阳，","披着晚风抵西安。","丘陵之上宜行走，","并非鲜鱼泥鳅贩。","纵使难避其险阻，","终究不会有灾患。"]],[["螟虫为贼，","害我五谷。","箪笥空虚，","家无所食。"],["螟虫造灾于田间，","五谷庄稼受摧残。","碗中空空无食物，","家中无粮度日难。"]],[["蒙恩拜德，","东归吾国。","慷慨宴笑，","欢乐有福。"],["承蒙大恩与大德，","东归来到我家国。","情怀慷慨宴上笑，","得到幸福多欢乐。"]],[["赍贝赎狐，","不听我辞。","系于虎须，","牵不得来。"],["怀揣金钱去赎狐，","朋友不听我劝阻。","将狐系于虎须上，","牵之不来白受苦。"]],[["比目附翼，","欢乐相得。","行止集同，","终不离忒。"],["比目鱼儿比翼鸟，","雌雄相爱甚逍遥。","起居行动不分离，","差错过失皆隐消。"]],[["一指食肉，","口无所得。","染其鼎鼐，","舌馋于腹。"],["一个指头去食肉，","口中空空无所有。","手指染了鼎中汤，","舌馋腹中甚饥荒。"]],[["曳纶汀洲，","钓挂鲂鲤。","王孙得利，","以享仲友。"],["垂纶水上那小洲，","鲂鱼鲤鱼来上钩。","贵族子孙获大利，","用以招待好朋友。"]],[["商纣牧野，","颠败所在。","赋敛重数，","黎元愁苦。"],["商代纣王在牧野，","失利战败罪应得。","苛捐杂税如牛毛，","百姓愁苦难生活。"]],[["北辰紫宫，","衣冠立中。","含和建德，","常受天福。"],["北辰星座紫微宫，","上皇大帝居其中。","品德高尚又和顺，","享受福禄永无穷。"]],[["轻战尚勇，","不知兵权。","为敌所制，","从师北奔。"],["恃勇轻战逞英豪，","不懂三略和六韬。","受敌所困胸无策，","跟上队伍向北逃。"]],[["大口宣唇，","神使伸言。","黄龙景星，","出应德门。","兴福上堂，","天下安昌。"],["张口鼓舌似弹簧，","神仙派他道吉祥。","黄色之龙与瑞星，","将应仁德见东方。","福气降临至殿堂，","天下百姓都安昌。"]],[["凶子祸孙，","仗剑出门。","凶讼喧嚣，","惊骇我家。"],["我家凶子与祸孙，","动刀舞剑出门庭。","争讼喧嚣吵又闹，","全家上下受惊动。"]],[["祝伯善言，","能事鬼神。","辞祈万岁，","使君延年。"],["男性巫士善言辞，","能讨鬼神所欢喜。","口中祈祷喊万岁，","使君寿考又安逸。"]],[["珪璧琮璋，","执贽见王。","百里宁戚，","应聘齐秦。"],["手持珪璧和琮璋，","作为礼品朝见王。","百里宁戚同前往，","应聘齐秦官场上。"]],[["昧旦乘车，","履危蹈沟。","亡失裙襦，","摧折两轴。"],["黎明乘车去出行，","不幸掉进水沟中。","衣服裤子全丢失，","折了车轴坏车轮。"]],[["胶著木连，","不出牛栏。","斯飨羔羊，","家室相安。"],["邻里团结多友善，","如同胶粘木头连。","煮好羔羊摆好宴，","千家万户庆平安。"]],[["卷领遁世，","仁德不舍。","三圣攸同，","周国茂兴。"],["卷起衣领做隐士，","不将仁德轻舍弃。","三位圣人齐尽力，","周国因之兴盛起。"]],[["黍稷苗稻，","垂秀方造。","中旱不雨，","伤风枯槁。"],["糜子谷子和稻苗，","含苞待放长势好。","中期干旱不下雨，","热风吹伤自枯槁。"]],[["冠带南游，","与福喜逢。","期于嘉贞，","拜为公卿。"],["衣冠楚楚去南行，","与福与喜而相逢。","为人正直品德好，","晋职封官做公卿。"]],[["一巢九子，","同公共母。","柔顺利贞，","出入不殆，","福禄所在。"],["一窝之中九个子，","都是同一父母生。","温柔利贞又顺从，","出入往来无忧凶，","幸福利禄随其身。"]],[["韩氏长女，","嫁于东海。","多貌美好，","宜家富寿，","利得十倍。"],["韩家有个大女孩，","长大出嫁到东海。","如花似玉好容貌，","持家引得福寿来，","大利成倍多安泰。"]],[["因祸受福，","喜盈我室，","所愿必得。"],["因遭灾祸而得福，","喜气充满我家屋，","心想事成皆满足。"]],[["晋平有疾，","迎医秦国。","病乃大患，","分为两竖。","逃匿膏肓，","和不能愈。"],["晋国平公患重病，","前去秦国请医生。","平公病情甚严重，","疼痛难忍入心胸。","藏匿膏下与肓上，","名医医和也无能。"]],[["牡飞门启，","患忧大解。","修福行善，","不为身祸。"],["锁闩落地门开启，","患难忧虑皆离去。","修福行善多积德，","只为自身无灾异。"]],[["追亡逐北，","至山而得。","稚叔相呼，","反其室庐。"],["小弟走失去北边，","一直追到山根前。","高声呼唤来相会，","重新返回自家园。"]],[["鸟鸣葭端，","一呼三颠。","动摇东西，","危慄不安；","疾病无患。"],["鸟儿鸣叫芦苇端，","呼一声来颠三颠。","东摇西摆不稳定，","畏惧恐惶不得安；","虽有疾病无大患。"]],[["龙化为虎，","泰山之阳。","众多从者，","莫敢敉藏。"],["在那泰山之阳面，","巨龙把那猛虎变。","众多随从的人们，","未敢安抚此局面。"]],[["猋风阻越，","车驰揭揭。","弃古追思，","失其和节，","忧心惙惙。"],["大风呼呼扬起尘，","大车滚滚向前行。","平坦大道看不见，","和谐节奏丧失尽，","行旅之人忧忡忡。"]],[["游居石门，","禄安身全。","受福西邻，","归饮玉泉。"],["旅游居住石门间，","禄位安在体康健。","受福西方好邻居，","归饮美酒暖心田。"]],[["登高上山，","见王自言。","申理我冤，","得职蒙恩。"],["向南登高上了山，","得到君王之恩典。","倾诉我的屈和冤，","得职蒙恩心中欢。"]]],[[["文王四乳，","仁爱笃厚。","子畜十男，","夭折无有。"],["文王身有四乳头，","仁慈博爱且笃厚。","精心抚育十男儿，","个个健康又长寿。"]],[["日入望车，","不见子家。","长女无夫，","左手搔头。"],["日落西山盼车还，","不见我郎回家园。","长女无夫未出嫁，","左手搔头心不安。"]],[["东上泰山，","见尧自言。","申理我冤，","以解忧患。"],["登上东岳泰山巅，","见到唐尧自陈言。","诉说我的屈和冤，","盼望解除忧与患。"]],[["奎轸汤汤，","过角宿房。","宣时布和，","无所不通。"],["奎星轸星行天上，","经过角星止于房。","宣传公布好时节，","世间无所不通畅。"]],[["引髯牵须，","虽惧无忧。","王母善祷，","祸不成灾。"],["被人揪须又牵头，","虽遇麻烦勿担忧。","祖母善向神祷告，","无有大灾莫发愁。"]],[["文巧俗弊，","将反大质。","僵死如麻，","流血漂橹。","皆知其母，","不识其父，","干戈乃止。"],["文过饰非人心诈，","世道应回大同家。","僵尸扁野如乱麻，","流血沾染盾和甲。","都知各自亲生母，","不识他的慈祥父，","战争方止戟入库。"]],[["凫得水没，","喜笑自啄。","毛羽悦泽，","利以攻玉。","公出不复，","伯氏客宿。"],["野鸭潜游于江河，","玩得痛快又活泼。","毛羽润泽多可爱，","磨玉以增其光泽。","父亲卖鸭未回还，","老大独自居寓所。"]],[["水流趋下，","欲至东海。","求我所有，","买鲂与鲤。"],["江河奔腾向下流，","汇集注入向东海。","前去求我之所需，","鲂鱼鲤鱼都买来。"]],[["獐鹿逐兔，","安饱其居。","反还次舍，","无有疾故。"],["獐子小鹿追逐兔，","吃饱之后归其居。","返回原来居住地，","无有病疾无事故。"]],[["树植藿豆，","不得芸锄。","王事靡盬，","秋无所收。"],["田间种了藿与豆，","没有时间去中耕。","王事无休又无止，","到了秋天无收成。"]],[["弱水之西，","有西王母。","生不知老，","与天相保。"],["在那潺潺弱水西，","女神王母居住地。","千年长生永不老，","与天同寿享安逸。"]],[["数穷廓落，","困于历室。","幸登玉堂，","与尧侑食。"],["宽宏旷达而受穷，","舜被困于历室中。","终于幸运登玉堂，","陪尧进餐受重用。"]],[["子鉏执麟，","春秋作经。","元圣将终，","尼父悲心。"],["子鉏打猎获麒麟，","孔子写作春秋经。","元圣即将离人世，","尼父悲哀又伤心。"]],[["尹氏伯奇，","父子生离。","无罪被辜，","长舌所为。"],["尹氏之子名伯奇，","父亲与儿生别离。","伯奇无罪受迫害，","后母长舌造灾异。"]],[["播木折枝，","与母别离。","九皋难和，","绝不相知。"],["折下树枝种幼树，","幼树与母远离居。","深居遥远沼泽地，","关系断绝不相知。"]],[["眵鸡无距，","与鹊格斗。","翅折目盲，","为鸠所伤。"],["患病之鸡无后爪，","却与鸟鹊相斗打。","折了翅膀瞎了眼，","斑鸠飞来啄害它。"]],[["甲乙丙丁，","俱归我庭。","三丑六子，","入门见母。"],["甲乙丙丁众弟兄，","一齐回到我家中。","三个丑儿六个子，","入门见母问康宁。"]],[["桑叶螟蠹，","衣敝如络。","女工不成，","丝布为玉。"],["桑叶生芽被虫吃，","衣服破烂如乱丝。","织布女工无原料，","丝布奇缺贵如玉。"]],[["开牢辟门，","巡狩释冤。","夏台羑里，","汤文悦喜。"],["打开牢门笑开颜，","巡守释放冤屈犯。","走出夏台和羑里，","商汤文王多欣欢。"]],[["钦明之德，","坐前玉食。","必保嘉善，","长受安福。"],["钦敬贤明德高尚，","安享玉食坐高堂。","美好品德长久在，","保受福禄永安康。"]],[["武夫司空，","多口争讼。","金火当户，","民不安处，","年饥无有。"],["武夫前去当司空，","众口议论语纷纷。","金星火星当户照，","百姓失居不安心，","年岁贫饥无收成。"]],[["紫阁九重，","尊严在中。","黄帝尧舜，","履行至公。","冠带垂裳，","天下康宁。"],["华丽楼阁有九重，","尊贵威严在其中。","黄帝唐尧和虞舜，","身体力行主公正。","整冠垂衣治天下，","国家太平民安宁。"]],[["负牛上山，","力劣行难。","烈风雨雪，","遮遏我前，","中道复还。"],["老牛负重上高山，","精疲力竭行路难。","寒风冽冽大雪飘，","遮挡阻碍我向前，","中途止步复回还。"]],[["蹇兔缺唇，","行难齿寒。","口病不言，","为身生患。"],["跛脚之兔又缺唇，","齿寒外露难行动。","口腔患病不能言，","成为自身大忧患。"]],[["合体比翼，","嘉耦相得。","与君同好，","使我有福。"],["合体相亲比翼飞，","婚配成双多完美。","与你永结同心好，","使我幸福暖心扉。"]],[["口啄卒卒，","忧从中出。","丧我宝贝，","无妄失位。"],["两人剧烈相斗口，","由此产生凶与忧。","争讼丧失我钱财，","不料又将权位丢。"]],[["两心不同，","或从西东。","明论终日，","莫适我从。"],["两人心思各不同，","何去何从无定论。","从早争执到傍晚，","使我难以去适从。"]],[["哑哑笑言，","与喜饮食。","长乐行觞，","千秋起舞，","拜受大福。"],["哑哑笑语又欢言，","亲友相聚共用餐。","举杯开怀而痛饮，","载歌载舞千万年，","跪拜受福于皇天。"]],[["初忧后喜，","与福为市。","八佾列陈，","饮御嘉友。"],["开始忧愁后来喜，","经商迎来好生意。","宫廷舞乐助我兴，","盛筵款待众嘉宾。"]],[["西徙无家，","破其新车。","王孙失利，","不如止居。"],["向西搬迁无家园，","新车颠簸受伤残。","贵族子孙失了利，","不如居此享安闲。"]],[["凤凰在左，","麒麟处右。","仁圣相遇，","伊吕集聚。","时无殃咎，","福为我母。"],["凤凰在我身左侧，","麒麟处于我右翼。","仁智圣贤喜相遇，","伊尹吕望聚一起。","时逢好运无灾殃，","使我过上好日子。"]],[["区脱康居，","慕仁入朝。","湛露之欢，","三爵毕恩。","复归旧庐，","与母相扶。"],["土堡哨所康居民，","仰慕仁义入朝廷。","晨露浓浓心中欢，","三杯御酒谢皇恩。","重返边疆回故里，","扶持侍奉老母亲。"]],[["疾贫望幸，","贾贩市井。","开牢择羊，","多得大牂。"],["疾寒贫困盼幸运，","欲想经商市场中。","打开圈门挑选羊，","多得母羊很称心。"]],[["处高不伤，","虽危不亡。","握珠怀玉，","还归其乡。"],["安居高处不受伤，","虽有危难不会亡。","手握宝珠怀揣玉，","平安返回其故乡。"]],[["右手弃酒，","左手收盘。","行逢礼御，","饵得玉杯。"],["挥起右手祭奠酒，","左手把那盘儿收。","出行途中逢礼遇，","喜得玉杯在我手。"]],[["养虎牧狼，","还自贼伤。","大勇小捷，","虽危不亡。"],["畜养猛虎和恶狼，","反被虎狼所残伤。","主人勇敢又敏捷，","纵遇危难无大殃。"]],[["戴尧扶禹，","松乔彭祖。","西遇王母，","道路夷易，","无敢难者。"],["拥戴唐尧扶大禹，","寿如松乔和彭祖。","来到西方见王母，","道路平坦又顺利，","没有谁人敢拦阻。"]],[["秋冬探巢，","不得鹊雏。","衔指北去，","愧我少姬。"],["秋冬季节掏鸟窝，","未能得到小喜鹊。","口衔指头向北去，","惭愧难见我少妻。"]],[["两羝三牂，","俱之我乡。","留连多难，","损其食粮。"],["两只公羊三母羊，","一起跑到我家乡。","留连多日无水草，","多灾多难损食粮。"]],[["南徙无庐，","鸟破其巢。","伐木思初，","不利动摇。"],["向南迁移无室舍，","如同鸟鹊破巢穴。","伐木之时想当初，","不宜搬迁徒奔波。"]],[["争讼不已，","更相牵击。","张季弱口，","被发北走。"],["双方争讼不停止，","进而拳打又脚踢。","小张口弱难辩解，","狼狈不堪北逃去。"]],[["延颈望酒，","不入我口。","初喜后否，","得利无有。"],["伸长脖子望着酒，","美酒不入我的口。","开始高兴后来忧，","欲想求利却无有。"]],[["被发倾走，","寇逐我后。","亡失刀兵，","身全不伤。"],["披头散发急奔走，","敌寇追逐我身后。","随身兵器都丢失，","侥幸未把伤害受。"]],[["麟凤所游，","安乐无忧。","君子抚民，","世代千秋。"],["麒麟凤凰遨游地，","安乐不会生忧愁。","天子安抚老百姓，","江山万代又千秋。"]],[["褰衣涉河，","水深渍罢。","赖幸舟子，","济脱无他。"],["提起衣服欲过河，","水深流急难以涉。","幸得依赖小渡船，","使我平安得渡过。"]],[["愦愦不悦，","忧从中出。","丧我金罂，","无妄失位。"],["混乱糊涂心不悦，","由此发生忧与祸。","失我金瓶和财宝，","官至高位遭跌落。"]],[["绊跳不远，","心与言反。","尼父望家，","菡萏未华。"],["绳子绊脚跳不远，","心想之事与言反。","孔子出游望着家，","池塘菡萏未开花。"]],[["大牡肥牸，","惠我诸舅。","内外和睦，","不忧饥渴。"],["大公牛和肥母牛，","送给尊长和舅舅。","家庭内外都和睦，","生活美满不用愁。"]],[["黄帝建元，","文德在身。","禄若阳春，","封为鲁君。"],["黄帝开创新纪元，","文明之德集于身。","周公禄位如阳春，","封为鲁国开国君。"]],[["虎聚磨牙，","以待豚猪。","往必伤亡，","宜利止居。"],["老虎相聚同磨牙，","以待残食我猪娃。","出行必定有伤亡，","适宜安居待在家。"]],[["天地配享，","六位光明。","阴阳顺序，","以成厥功，","天下和平。"],["天地二气相融通，","上下四方都光明。","阴阳平衡甚协调，","以使大功得告成，","天下因之都和平。"]],[["猿堕高木，","不踒手足。","保我金玉，","还归其室。"],["猿从高树坠于地，","没有折伤手和足。","金银财物得保全，","返回它的旧居室。"]],[["营室紫宫，","坚不可攻。","明神建德，","君受大福。"],["天上营室紫微宫，","坚强牢固不可攻。","君主圣明建功德，","获受大福住皇城。"]],[["孤翁寡妇，","独宿悲苦。","目张耳鸣，","无与笑语。"],["孤单老头和老妇，","生活孤独心悲苦。","耳聋眼花年纪大，","没有欢声和笑语。"]],[["低头窃视，","有所畏避。","行者不利，","酒酸鱼败，","众莫贪嗜。"],["主人低头偷偷视，","心怀鬼胎甚畏避。","出行之人不顺利，","酒肉发酸鱼味异，","众人不要太贪吃。"]],[["载金贩狗，","利弃我走。","藏匿渊底，","悔折为咎。"],["带着金子去贩狗，","大利弃我而逃走。","藏进深沟躲盗贼，","后悔折本又逢忧。"]],[["行触大忌，","与司命牾。","执囚束系，","拘制于吏。"],["行为越轨犯大忌，","事与司命相违逆。","沦为囚犯受束缚，","君子受制于小吏。"]],[["执玉欢喜，","佩之解挛。","危详反安，","使我无患。"],["手执宝玉心中欢，","佩带于身解痉挛。","遇事逢凶化大吉，","使我永远无灾患。"]],[["机杼纷扰，","女功不成。","长女许嫁，","衣无襦袴。","闻祸不成，","凶恶消去。"],["织布机杼乱纷纷，","女工欲织又不能。","大女即将要出嫁，","新衣新裤未做成。","听说有祸未成凶，","祸患悄然去无踪。"]],[["金人铁距，","火烧左右。","虽惧不恐，","独得全处。"],["金铸之人铁制脚，","任凭左右大火烧。","虽有畏惧不恐慌，","我独不伤一汗毛。"]],[["谢恩拜德，","东归吾国。","舞蹈欣跃，","欢乐受福。"],["感谢大恩拜大德，","向东回到我家国。","载歌载舞多高兴，","欢天喜地享福泽。"]],[["青牛白咽，","呼我俱田。","历山之下，","可以多耕。","岁乐时节，","民人安宁。"],["青牛喉部长白咽，","呼唤它到田野间。","来到历山山脚下，","可以为我多耕田。","年岁恰逢好时节，","人民百姓得平安。"]],[["白雉群鸲，","慕德朝贡。","湛露之恩，","使我得欢。"],["献上白雉和群鸲，","慕德朝贡周天子。","君王盛宴待贵客，","宾主心中都欢喜。"]],[["避患东西，","反入祸门。","糟糠不足，","忧思我心。"],["为避祸患奔西东，","反而步入祸患门。","糟糠剩饭难充饥，","忧愁常存我心中。"]]],[[["一簧两舌，","传言谄语。","三奸成虎，","曾母投杼。"],["两个舌头似弹簧，","谣言误语传四方。","三位奸人言有虎，","曾子之母丢机杼。"]],[["春桃生花，","季女宜家，","受福且多。","在师中吉，","男为邦君。"],["阳春三月开桃花，","小女长大要出嫁，","享受福禄有造化。","率军出征呈吉祥，","婿为州官治一方。"]],[["殊类异路，","心不相慕。","牝牛牡豭，","独无室家。"],["不是同类不同路，","两心相互不仰慕。","如同母牛和公猪，","不能相配共相处。"]],[["折若蔽日，","不见稚叔。","三足孤乌，","远其元夫。"],["折下树叶遮太阳，","不见小弟在何方。","如同三足之孤乌，","难与原夫聚一堂。"]],[["雀东求粒，","误入罔域。","赖仁君子，","脱服归息。"],["鸟雀向东去求食，","误入猎人罗网里。","幸赖遇上好心人，","脱险归巢得安息。"]],[["王孙季子，","相与孝友。","明允笃诚，","升擢荐举，","为国干辅。"],["贵族公孙好品行，","相互友爱很孝忠。","贤明笃信又实诚，","推选荐举得提升，","成为国家梁与栋。"]],[["鸟鸣呼子，","哺以酒脯。","高棲之处，","子来归母；","啬人成功，","年岁大有；","妬妇无子。"],["鸟儿呼叫唤其子，","欲喂美酒与美食。","在那高高树枝头，","小鸟投入母怀里；","种田之人得成功，","年岁丰收粮有余；","嫉妒之妇无儿子。"]],[["刖树无枝，","与子分离。","饥寒莫食，","独泣哀悲。"],["将树砍得无分枝，","如同母子相别离。","饥寒交迫不得食，","独自悲伤而哭泣。"]],[["舜升大禹，","石夷之野。","征诣玉阙，","拜治水土。"],["在那石夷野外地，","虞舜重用提升禹。","征召他到京都来，","水土由他去治理。"]],[["义不胜情，","以欲自营。","见利危宠，","灭君令名。"],["道义不能胜私情，","随心所欲去经营。","见利忘义害亲友，","毁掉君子好名声。"]],[["三人北行，","六位光明。","道逢淑女，","与我骥子。"],["三人一同向北行，","上下四方都光明。","路上碰见一美女，","送我良马供我骑。"]],[["羿张乌号，","彀射天狼。","柱国雄勇，","斗死荥阳。"],["后羿拉开乌号弓，","一箭射向天狼星。","将军纪信雄又勇，","无畏斗死荥阳城。"]],[["季姬踟蹰，","结衿待时。","终日至暮，","百两不来。"],["新娘穿好婚礼服，","在家徘徊闲踱步。","从早一直等到晚，","不见彩车来迎娶。"]],[["鸿雁翩翩，","始怨劳苦。","灾疫病民，","鳏寡愁忧。"],["看那鸿雁翩翩舞，","埋怨人比鸟儿苦。","灾疫使民不聊生，","鳏寡孤独忧藏腹。"]],[["穿胸狗邦，","僵离旁舂。","天地易纪，","日月更始。"],["穿胸之国狗邦人，","强迫远离去谋生。","天地变化换纪元，","日月更替万象新。"]],[["北山有枣，","使叔寿考。","东岭多栗，","宜行贾市。","陆梁雄雉，","所至利喜。"],["北山之上盛产枣，","叔叔吃了能寿考。","东面岭上多栗子，","适合上市做生意。","陆梁之地雄野鸡，","给我带来利与喜。"]],[["干旄旌旗，","执帜在郊。","虽有宝珠，","无路致之。"],["牛尾鸟羽饰旗杆，","高高飘扬在郊原。","虽说前方有宝珠，","无路到达获取难。"]],[["精洁渊塞，","为谗所言。","证讯诘问，","系於枳温。","甘棠听断，","怡然蒙恩。"],["品德诚实又纯洁，","却遭谗言所诬蔑。","一番审问和听证，","成为狱中不速客。","清官明察断案情，","欣然蒙恩得昭雪。"]],[["玄黄虺隤，","行者劳罢。","役夫憔悴，","踰时不归。"],["满面病容神不振，","行者劳累甚艰辛。","服役之人多瘦弱，","逾期不能回家中。"]],[["肤敏之德，","发愤晨食。","虏豹禽说，","为王求福。"],["言行敏捷好品德，","发愤忘食为家国。","破魏虏豹擒夏说，","为王求福兴邦业。"]],[["采唐沫乡，","要我桑中。","失信不会，","忧思约带。"],["前往沫乡摘蒙菜，","邀请我到桑中来。","姑娘失约未会面，","使我相思束腰带。"]],[["伯宁子福，","惠我邦国。","蠲除苛残，","使季无患。"],["老子安宁子福多，","施行恩惠于邦国。","消除苛政和残暴，","使我小儿无忧祸。"]],[["谗父佞雄，","贼乱邦国。","生离忠孝，","败困不福。"],["奸佞之辈行当道，","国家遭灾受侵扰。","生活背弃忠与孝，","衰败穷困福远逃。"]],[["渊泉堤防，","水道利通。","顺注湖海，","邦国富有。"],["渊泉加固其堤防，","渠道水流得通畅。","注入湖泊与海洋，","使我国家多富强。"]],[["江南多蝮，","螫我手足。","冤繁诘屈，","痛彻心腹。"],["江南水乡多毒蛇，","我的手脚遭其蜇。","冤屈无法去申辩，","痛疼穿彻我胸廓。"]],[["三人俱行，","别离独宿。","一身五心，","反复迷惑，","乱无所得。"],["三人一同路上行，","途中各自睡西东。","一人身上五条心，","颠三倒四甚昏庸，","乱无头绪事不成。"]],[["鸦鸣庭中，","以戒灾凶。","重门击柝，","备不速客。"],["乌鸦在那庭院叫，","告诫灾凶要来到。","重门层层设警哨，","防止家中出强暴。"]],[["功成事就，","拱手安居。","立德有言，","坐饬贡赋。"],["大功已经得告成，","拱手安然修身心。","言行品德多美好，","稳坐受贡享其成。"]],[["国乱不安，","兵革为患。","掠我妻子，","家中饥寒。"],["国家混乱不得安，","战争造成灾与难。","抢走我的妻与子，","家中忍受饥与寒。"]],[["戴尧扶禹，","松乔彭祖。","西遇王母，","道路夷易，","无敢难者。"],["拥戴唐尧扶大禹，","适逢松乔与彭祖。","一同西去见王母，","旅途坦荡很顺利，","没有谁来敢拦阻。"]],[["长尾蜲蛇，","画地成河。","深不可涉，","绝无以北，","惆怅息。"],["弯曲行进大尾蛇，","地上画出一条河。","水流深深不可涉，","无法到达岸之北，","惆怅叹息心悲彻。"]],[["乘龙从蜺，","征诣北阙。","乃见宣室，","拜守东域。","镇慰黎元，","举家蒙福。"],["骑乘飞龙驾霓虹，","应征来到宫北门。","天子召见在宣室，","任命他去守东城。","管理安抚老百姓，","全家上下蒙福恩。"]],[["土与山连，","终身无患。","天地高明，","万岁长安。"],["土丘山陵紧相连，","终生不会生忧患。","地阔天高甚明亮，","保君寿考长平安。"]],[["久旱水涸，","枯槁无泽。","虚修其德，","未有所获。"],["久旱无雨水尽竭，","草木干枯无润泽。","吃苦费力枉修德，","两手空空无所获。"]],[["依天倚地，","凶危不至。","上清下净，","君受其利。"],["依靠皇天和大地，","凶恶危难不临至。","朝廷上下多清官，","君主安然受利益。"]],[["火烈不去，","必殪僵仆。","燔我衣裾，","祸不可悔。"],["火势熊熊不离去，","必然焚毁倒在地。","烧了我的衣和裤，","纵使后悔来不及。"]],[["配合相迎，","利之四乡。","欣喜兴怿，","所言得当。"],["两心默契去行商，","利益通达至四方。","欣慰喜悦多快乐，","说话句句都得当。"]],[["清人高子，","久屯外野。","逍遥不归，","思我慈母。"],["高克带领清邑兵，","长驻城外荒野中。","久戍外地不能回，","思我慈祥老母亲。"]],[["武库军府，","甲兵所聚。","非里邑居，","不可舍止。"],["武器仓库和军府，","乃是兵器聚藏处。","并非百姓居住地，","不能在此久居住。"]],[["三德五材，","和合四时。","阴阳顺序，","国无咎灾。"],["三德五才都具备，","春夏秋冬合四时。","阴阳交替有顺序，","国家不会有灾异。"]],[["解衣毛羽，","飞入大都。","晨门戒守，","郑忽失家。"],["乔装打扮鼓其羽，","展翅飞回大都市。","城门戒备防守严，","郑忽离家脱危难。"]],[["刖根烧株，","不生肌肤。","病在心腹，","日以焦枯。"],["削掉树根烧掉枝，","肌肤不生难复苏。","疾病患入心腹中，","日复一日渐枯死。"]],[["文山紫芝，","雍梁朱草。","生长和气，","王以为宝。","公尸侑食，","福禄来处。"],["文山之上灵芝好，","雍梁出产赤心草。","瑞草生长多茂盛，","君王将其视为宝。","采来瑞草作祭品，","幸福利禄都得到。"]],[["多载重负，","捐弃于野。","予母谁子，","但自劳苦。"],["超载负荷太沉重，","终被弃于原野中。","不知他是谁家子，","自作自受枉劳神。"]],[["凫雁哑哑，","以水为家。","雌雄相和，","心志娱乐，","得其欢欲。"],["野鸭浮游叫哑哑，","以水作为它的家。","雌雄双双多和睦，","欢娱快乐心头挂，","欲望都能满足它。"]],[["耳目盲聋，","所言不通。","伫立以泣，","事无成功。"],["眼成瞎子耳朵聋，","所出之言听不清。","站在一旁流泪哭，","终究一事都不成。"]],[["天宫列宿，","五神所舍。","宫阙坚固，","君安其居。"],["星辰列为集合体，","五神拱卫太一室。","宫殿明亮又坚固，","君王在此得安居。"]],[["范子妙材，","戮辱伤肤。","后相秦国，","封为应侯。"],["魏人范雎有才能，","出使受辱遭酷刑。","随去秦国任丞相，","爵封应侯耀祖宗。"]],[["秋冬探巢，","不得鹊雏。","衔指北去，","惭我少夫。"],["深秋初冬掏鸟窝，","未能得到小喜鹊。","口衔指头向北去，","愧对少夫难快乐。"]],[["子畏于匡，","厄困陈蔡。","德行不危，","竟脱厄害。"],["孔子遇难于匡地，","又在东蔡受困厄。","赖其品优德高尚，","终于摆脱灾与祸。"]],[["鸿飞在陆，","公出不复。","仲氏任只，","伯氏客宿。"],["大雁沿着陆地飞，","客人去了不再回。","弟弟为人真可信，","哥哥行旅客店睡。"]],[["鹤鸣九皋，","避世隐居。","抱朴守贞，","竟不随时。"],["大泽深处鹤声鸣，","仁人志士避世隐。","勿失本真守贞节，","不随时势违其心。"]],[["舜升大禹，","石夷之野。","征诣王庭，","拜治水土。"],["在那石夷郊野地，","虞舜重用提升禹。","征召他到京都来，","水土由他去治理。"]],[["左辅右弼，","金玉满堂。","常盈不亡，","富如敖仓。"],["左右相辅又相帮，","金银玉帛满庭堂。","长久盈余不缺少，","财富堆积如敖仓。"]],[["崔嵬北岳，","天神贵客。","衣冠不已，","蒙被恩德。"],["在那巍巍北岳上，","天神所居好地方。","朝拜之人不间断，","蒙受恩德禄长长。"]],[["空槽注器，","彘不至。","张弓祝鸡，","雄父飞去。"],["空槽敲击唤猪器，","大猪小猪不临至。","张弓拔箭而呼鸡，","公鸡受惊远飞离。"]],[["胡蛮戎狄，","太阴所积。","涸冰沍寒，","君子不存。"],["匈奴之人居住地，","阴气聚积在那里。","天寒地冻如冰室，","好人不宜久留居。"]],[["甘露醴泉，","太平机关。","仁德感应，","岁乐民安。"],["甘雨降临成醴泉，","太平盛世至人间。","君主仁德感动天，","年丰岁乐民得安。"]],[["恶来呼伯，","慎惊外客。","甲守闭宅，","以备凶急。","临折之忧，","虽灭无灾。"],["恶人前来唤大哥，","谨慎防备惊外客。","武装守卫关好门，","以免天灾光顾我。","折毁之忧虽临头，","终将消失无灾祸。"]],[["日月相望，","光明盛昌。","三圣茂功，","仁德大隆。"],["太阳月亮遥相望，","天下光明又盛昌。","三位圣人建奇功，","仁德敦厚美名扬。"]],[["葛藟蒙棘，","华不得实。","谗佞乱政，","使恩壅塞。"],["葛藤处在荆棘中，","纵使花开果不生。","谗佞之人乱朝政，","恩德之路不畅通。"]],[["邻不我顾，","而望玉女。","身多癞疾，","谁肯媚者。"],["邻里小伙不爱我，","只去欣赏美女色。","身上长满疤和疮，","谁肯前来追求我。"]],[["精诚所在，","神为之辅。","德教尚忠，","弥世长久。","三圣茂功，","多受福祉。"],["真心诚意集一身，","天神也来辅忠臣。","德教首崇忠与信，","治世长久又安宁。","三位圣人建奇功，","幸福利禄无穷尽。"]],[["钻木取火，","掘地索水。","主母饥渴，","子为心祸。"],["钻穿木头欲取火，","掘地寻水水奇缺。","母亲腹中饥又渴，","儿子成为心头祸。"]]],[[["继祖复宗，","追明成康。","光照万国，","享世久长。"],["继承祖宗大事业，","追明成王和康王。","光辉照耀普天下，","永久安宁享世长。"]],[["麟子凤雏，","生长嘉国。","和气所居，","康乐温仁，","邦多哲人。"],["麒麟之子小凤凰，","美好国度同生长。","睦邻友善同相处，","温良仁慈多安康，","圣人辈出我国邦。"]],[["灼火泉源，","钓鲤山巅。","鱼不可得，","火不肯燃。"],["燃火去那水之源，","钓鱼到那高山巅。","鱼儿无法能钓到，","泉水之中火难燃。"]],[["彭生为豕，","白龙作灾。","盗尧衣裳，","桀跖荷兵。","青禽照夜，","三日夷伤。"],["公子彭生变为猪，","白龙行凶造灾殃。","桀跖领兵扛着枪，","盗走唐尧衣和裳。","青鸟飞临照黑夜，","三天之内遭残伤。"]],[["黍稷醇醴，","敬奉山宗。","神嗜饮食，","甘雨嘉降。","蔗物蕃殖，","独蒙福祉，","时灾不至。"],["糜子谷子味甘浓，","用来敬奉大山神。","神灵爱好吃与喝，","吉庆祥瑞降甘霖。","万物生长多茂盛，","我独承蒙福与恩，","四时和顺无灾凶。"]],[["李华再实，","鸿卵降集。","仁哲权舆，","荫国受福。"],["李树开花又结实，","鸿雁产蛋集于地。","智慧贤君兴仁政，","国人受庇受福祉。"]],[["千岁之墟，","大兵所屠。","不见子都，","城空无家。"],["千年古城变废墟，","大兵屠后剩遗迹。","英俊小伙不见来，","城内空空鬼哭泣。"]],[["鹿得美草，","鸣呼其友。","九族和睦，","不忧饥乏。"],["鹿儿寻得美草坪，","呼唤同伴叫不停。","群体上下多和睦，","不愁饥饿很开心。"]],[["公子王孙，","把弹摄丸。","发辄有得，","室家饶足。"],["皇室公子和王孙，","善用弹丸和弹弓。","发射顷刻即有得，","家中丰饶富盈门。"]],[["骊姬谗喜，","与二嬖谋。","谮杀其子，","贼害忠孝。","申生以缢，","重耳奔逃。"],["长舌之妇骊戎女，","与那二嬖合谋议。","诬蔑中伤献公子，","陷害忠良除异己。","申生自缢亡了命，","重耳乱中急逃离。"]],[["长生无极，","子孙千亿。","柏柱载梁，","坚固不倾。"],["长生不老无尽极，","子子孙孙逾千亿。","柏木柱子载大梁，","永世牢固不倾基。"]],[["失意怀忧，","如幽狴牢。","亡子丧夫，","附托寄居。"],["失意之时心忧虑，","如同幽禁在牢狱。","儿子丈夫双亡失，","寄人篱下空悲泣。"]],[["仁智隐伏，","麟不可得。","龙蛇潜藏，","虚居堂室。"],["仁人智者隐伏起，","麒麟也不来此地。","巨龙长蛇都潜藏，","庭堂室内皆空虚。"]],[["挒絜堁堁，","缔结难解。","嫫母衒嫁，","媒不得坐，","自为身祸。"],["重重叠叠打了结，","结扣牢固难解脱。","丑女炫耀想出嫁，","媒人忙碌不得坐，","都是自身惹的祸。"]],[["蜩飞堕木，","不毁头足。","保我羽翼，","复归其室。"],["蜩蝉飞鸣坠下树，","没有伤着头和足。","羽翼完好未损坏，","返回它的原住处。"]],[["陈妫敬仲，","兆兴齐姜。","乃适营丘，","八世大昌。"],["陈国敬仲娶新娘，","卜卦预兆兴齐姜。","迁往齐国营丘地，","子孙八代大盛昌。"]],[["过时不归，","雌雄苦悲。","徘徊外国，","与母分离。"],["过了时辰不回归，","夫妻分离多苦悲。","男儿流浪在外地，","与母远离难相会。"]],[["齐鲁争言，","战于龙门。","构怨结祸，","三世不安。"],["齐国鲁国起争端，","龙门之地相激战。","结下深仇和大怨，","后世子孙不得安。"]],[["府藏之富，","王以赈贷。","捕鱼河海，","笱网多得。"],["府库储藏很丰富，","君王救济多借出。","大河大海去捕鱼，","渔网之中多获取。"]],[["鸣鹤北飞，","下就稻池。","鳣鲔鲤，","众多饶有。","一笱获两，","利得过倍。"],["野鹤鸣叫北飞去，","落在农家稻田里。","鳣鲔鲤各种鱼，","丰饶富有多无比。","一笱入水获两条，","使我得到成倍利。"]],[["苍梧郁林，","道易利通。","元龟象齿，","宝贝南金，","为吾福功。"],["苍梧和那郁林郡，","道路平坦很畅通。","盛产元龟和象牙，","宝物精美赛南金，","为我增福助我兴。"]],[["两火争明，","虽斗不伤。","分离且忍，","全我弟兄。"],["两火燃烧齐争明，","虽然相斗未受损。","分离之后且忍耐，","保全我家弟和兄。"]],[["伯夷叔齐，","贞廉之师。","以德防患，","忧祸不存。"],["贤人伯夷和叔齐，","忠贞廉洁之大师。","凭借美德防祸患，","忧愁祸患皆消去。"]],[["伯去我东，","发栉如蓬。","展转空床，","内怀忧伤。"],["哥哥离我去向东，","头发纷乱如飞蓬。","使我独卧于空床，","辗转忧愁好伤心。"]],[["百足俱行，","相辅为强。","三圣翼事，","王室宠光。"],["一群马蚿行路上，","相互协助力量强。","三位圣人辅朝政，","君王之室显宠光。"]],[["壅遏堤防，","水不得行。","火盛阳光，","阴霓伏藏，","退还其乡。"],["堤防稳固甚坚强，","洪水不能造灾殃。","火势旺盛赛阳光，","阴霓伏地而潜藏，","最终退居其故乡。"]],[["螣蛇乘龙，","年岁饥凶，","民食草蓬。"],["天上螣蛇压青龙，","年景不好有饥凶，","民间百姓食草蓬。"]],[["铅刀攻玉，","坚不可得。","尽我筋力，","胝茧为疾。"],["迟钝之刀不锋利，","难以雕刻我美玉。","消耗竭尽凭身力，","手上结茧成病疾。"]],[["恒山浦泛，","高邑具在。","阴气下淋，","洪水不处；","牢人开户。"],["恒山脚下水泛滥，","高处居住很安全。","阴气凝聚而下降，","洪水不来我身边；","狱门开启释囚犯。"]],[["比目四翼，","来安我国。","福善上堂，","与我同床。"],["比目鱼儿比翼鸟，","一同来安我国邦。","幸福吉善满厅堂，","与我一齐登龙床。"]],[["杜口结舌，","心中怫郁。","去灾生患，","莫所告冤！"],["闭起嘴巴不说话，","心中忧郁结疙瘩。","去了灾害又生患，","叫我何处去申冤！？"]],[["牵尾不前，","逆理失臣。","忠莫往来，","惠朔以奔。"],["尾巴受制难行进，","违背事理臣不近。","忠臣良将不往来，","迫使惠公向北奔。"]],[["早霜晚雪，","伤害禾麦。","损功弃力，","饥无所食。"],["傍晚降雪晨降霜，","伤害麦苗难生长。","事半功倍枉费力，","百姓饥饿无食粮。"]],[["适戍失期，","患生无知。","惧以怀扰，","发藏闭塞。","邦国穷愁。"],["戍守误了好日期，","公孙无知遭贬弃。","诚惶诚恐生忧愁，","伏藏窥探寻时机。","国家穷困遇危急。"]],[["昊天白日，","照临我国。","万民康乐，","咸赖嘉福。"],["晴空太阳红似火，","光辉照耀我中国。","天下万民都安康，","全赖天赐大福泽。"]],[["元吉无咎，","安宁不殆。","时行则行，","勿之有悔。"],["大吉大利无灾凶，","平安宁静祸不临。","要想行动即可行，","否则将有后悔生。"]],[["懿公浅愚，","不受深谋。","无援失国，","为狄所贼。"],["懿公浅薄又愚蠢，","深谋远虑不忠听。","孤立无援失了国，","终遭狄人所入侵。"]],[["城上有乌，","自名破家。","呼唤鸩毒，","为国患灾。"],["城头上面有乌鸦，","自取恶名曰破家。","呼唤毒鸟来此地，","国家因之降灾煞。"]],[["长股喜走，","趋步千里。","王良善驭，","伯乐在道，","早见王母。"],["长腿马儿善行路，","日行千里不歇步。","驭手王良善赶车，","途中又把伯乐遇，","快行早至见王母。"]],[["耕石山巅，","费种家贫。","无聊虚作，","苗发不生。"],["山顶石缝去耕种，","枉费气力家贫穷。","劳而无获成虚作，","一根苗儿也不生。"]],[["二人异路，","东趋西步。","千里之行，","不相知处。"],["两条汉子不同路，","你朝东行我西步。","各自行至千里外，","双双互不知其处。"]],[["纯服素裳，","载主以兴。","德义茂生，","天下归仁。"],["身着黑色衣和裳，","车载神主兴国邦。","仁德礼义得彰明，","天下人民来归降。"]],[["玉铣铁颐，","仓库空虚。","贾市无盈，","与利为仇。"],["玉角镶在铁钟口，","仓库空虚货无有。","生意场上难盈利，","我独与利结怨仇。"]],[["登昆仑，","入天门。","过糟丘，","宿玉泉。","同惠欢，","见仁君。"],["登上高高昆仑山，","步入天宫之门槛。","经过那个糟丘地，","住宿就在玉泉边。","同享恩惠与欢乐，","见到仁爱圣君面。"]],[["团团白日，","为月所食。","损上毁下，","郑昭出走。"],["晴空太阳放光芒，","却被月亮所残伤。","损害上面又毁下，","郑国昭公逃他乡。"]],[["仓盈庾亿，","宜稼黍稷。","年岁有息，","国家富有。"],["仓库积粮千百亿，","装满糜子和谷子。","年成获得大丰收，","国家人民都富裕。"]],[["虎狼结谋，","相聚为保。","伺啮牛羊，","道绝不通，","伤我商人。"],["猛虎恶狼结成群，","相聚一处保自身。","伺机残食牛和羊，","道路阻断不畅通，","伤害经商行旅人。"]],[["中年摧折，","常恐不活。","老赖福庆，","光荣相辅。"],["人到中年受挫折，","经常畏恐不能活。","到了老年受福庆，","辉光荣耀照家门。"]],[["同载共车，","中道分去。","丧我元夫，","独与孤居。"],["两人同乘一辆车，","中途分手相离别。","丧失我的原配夫，","一人孤独苦生活。"]],[["饮酒醉酗，","距跳争讼。","伯伤叔僵，","东家治丧。"],["兄弟二人醉醺醺，","跳跃斗殴起争讼。","哥哥受伤弟弟亡，","东边邻家来治丧。"]],[["出值凶灾，","逢五赤头，","跳言死格。","扶伏听命，","不敢动摇。"],["出门遇到凶与灾，","碰上五个红头怪，","无理纠缠难离开。","伏身低头听其命，","不敢动摇怕伤害。"]],[["狼虎争强，","礼义不行。","兼吞其国，","齐鲁无王。"],["恶狼猛虎齐争凶，","礼义不能广推行。","列国争雄相吞并，","齐国鲁国无国君。"]],[["南国少子，","才略美好。","求我长女，","贱薄不与。","反得丑恶，","后方大悔。"],["南方有位小伙子，","相貌堂堂才略奇。","前来追求我长女，","嫌他贫穷未允许。","长女反而嫁丑夫，","使我后悔来不及。"]],[["一身两头，","莫适其躯。","无见我心，","乱不可治。"],["两头生在一躯体，","不知该听谁所使。","我的心愿难实现，","混乱如麻难治理。"]],[["李耳猥鹊，","更相恐怯。","偃尔以腹，","不能距格。"],["老虎刺猬和喜鹊，","狭路相逢甚胆怯。","刺猬仰卧露其腹，","老虎无法来拒格。"]],[["松柏栋梁，","相辅为强；","入敷五教，","王室宁康。"],["松柏用来做栋梁，","互相支撑甚坚强；","善用五教来治理，","王室宁静又安康。"]],[["雀行求食，","暮归孚乳。","反其屋舍，","安宁如故。"],["鸟雀外出寻食物，","晚归巢穴来哺乳。","返回巢中见其子，","平安宁静如当初。"]],[["四尾六头，","为凶作妖。","阴不奉阳，","上失其明。"],["四只尾巴六头颈，","逞凶作怪似妖精。","阴若不把阳尊奉，","在上倾权失英明。"]],[["一旅三关，","结缉不便。","歧道异路，","日暮不到。"],["一日旅程过三关，","行氅缉拿不方便。","岔道异路难行进，","太阳落山未到店。"]],[["牙孽生齿，","室堂启户。","幽人利贞，","鼓翼起舞。"],["牙床生出新牙齿，","屋室门户得开启。","隐士诸事都顺利，","高兴舞手又蹈足。"]],[["春鸿飞东，","以马货金。","利得十倍，","重载归乡。"],["春天大雁飞向东，","商人用马换黄金。","获得利益过十倍，","满载返回其家中。"]],[["欢悦以喜，","子孙俱在。","守发能忍，","不见殃咎。"],["和颜悦色心中喜，","子孙满堂得团聚。","起居行动皆能忍，","灾殃躲在一边去。"]],[["精神消落，","形骸丑恶。","龃龉顿挫，","枯槁腐蠹。"],["精神已经变颓废，","形体丑陋如恶鬼。","行事屡屡受挫折，","如同朽木甚憔悴。"]],[["登高上山，","见王自言。","申理我冤，","得职蒙恩。"],["登高上到山之巅，","见到君王自陈言。","申诉我的屈与冤，","承蒙恩赐升了官。"]]],[[["东遇虎蛇，","牛马惊奔。","道绝不通，","商困无功。"],["东遇虎蛇逞狂凶，","牛马惊恐四处奔。","路途受阻不通畅，","经商困顿利难盈。"]],[["子鉏执麟，","春秋作经。","元圣将终，","尼父悲心。"],["子鉏打猎获麒麟，","春秋作经至此终。","圣人即将离人世，","孔子悲哀又伤心。"]],[["灼火泉源，","钓鱼山巅。","鱼不可得，","火不肯燃。"],["燃火于那水泉间，","钓鱼行至山顶端。","鱼儿无法能得到，","大火逢水亦难燃。"]],[["机关不便，","不能出言。","精诚不通，","为人所冤。"],["机智谋略不周全，","不能轻易妄出言。","两条心儿不相通，","遭人诬蔑被人冤。"]],[["故室旧庐，","稍弊且除。","不如新巢，","可以乐居。"],["原先故居旧房屋，","破敝穿漏待拆除。","不如新建卧室好，","暂且使君得安居。"]],[["蜲蛇循流，","东求大鱼。","预且举网，","庖人歌讴。"],["回旋曲折顺流去，","向东寻找捕大鱼。","渔夫预且举起网，","多得乐坏我厨师。"]],[["凿山通道，","南至嘉国。","周公祝祖，","襄适荆楚。"],["凿穿大山开通路，","往南直至嘉国度。","周公祷告拜路神，","襄公平安抵达楚。"]],[["鹊近却缩，","不见头目。","日以困急，","不能自复。"],["喜鹊靠近又退缩，","头部眼睛皆掩遮。","日益危急又困顿，","不能恢复其本色。"]],[["白鸟衔饵，","鸣呼其子。","斡枝张翅，","来从其母。","伯仲叔季，","元贺举手。"],["白色鸟儿口衔食，","呼唤其子前来吃。","幼鸟展翅枝头上，","跟随母亲不分离。","兄弟欢乐聚一堂，","向母庆贺表心意。"]],[["五舌啄难，","各自有言。","异国殊俗，","使心迷惑，","所求不得。"],["人多嘴杂统一难，","各人都有自家言。","异国风俗不相同，","心受迷惑脑昏庸，","所求之事难成全。"]],[["天门开辟，","牢户寥廓。","桎梏解脱，","拘囚纵释。"],["上天之门广开辟，","狱中空空无人迹。","镣铐已经被解脱，","拘禁囚犯得获释。"]],[["坚冰黄鸟，","常哀悲愁。","数惊鸷鸟，","雏为我忧。"],["坚冰之上黄鸟栖，","常常悲愁而哭泣。","屡遭猛禽所惊吓，","黄鸟妈妈忧其子。"]],[["日走月步，","趋不同舍。","夫妻反目，","主君失居。"],["太阳月亮各自行，","出发归宿不相同。","夫妻反目成仇人，","丈夫失去其家庭。"]],[["金牙铁齿，","西王母子，","无有祸殃。","候舍陟道，","别来不久。"],["口中长满铁牙齿，","他是西方王母子，","没有祸患无灾异。","守在家中待启程，","分别不久又团聚。"]],[["式微式微，","忧祸相绊。","隔以岩山，","室家分散。"],["天快黑啦日昏暗，","忧祸接连不间断。","高山阻隔难见面，","一家老小都分散。"]],[["众神集聚，","相与议语：南国虐乱，","百姓劳苦。","兴师征伐，","更立贤主。"],["众多智士聚一起，","共同商量和谋议：南国暴虐起动乱，","百姓劳苦不堪提。","带领军队去征讨，","重立贤君整秩序。"]],[["虎狼争食，","礼义不行。","兼吞其国，","齐鲁无王。"],["恶狼猛虎同争食，","礼义全都被抛弃。","列国争雄相吞并，","齐国鲁国无国君。"]],[["寄生无根，","如过浮去。","本立不固，","斯须落去，","更为枯树。"],["寄生异地没有根，","如同长空过浮云。","根基不固易倾覆，","红花绿叶皆飘零，","变成枯树材难成。"]],[["子啼索哺，","母行求食。","反见空巢，","訾我长息。"],["幼鸟哭啼欲求食，","母鸟出门去寻觅。","归来巢空不见子，","悲愤忧伤长叹息。"]],[["驾驷逐狐，","轮挂荆棘。","车不结辙，","公子无得。"],["驾着马车追狐狸，","车轮陷入荆棘里。","前进后退都不能，","公子未达目的地。"]],[["方喙广口，","仁智圣厚。","释解倒悬，","家国大安。"],["生得方唇又阔口，","仁智圣明又敦厚。","善解百姓危与难，","国家长治永平安。"]],[["驾福乘喜，","东至嘉国。","戴庆南行，","移居安宅。"],["驾着福瑞乘着喜，","向东来到吉祥地。","戴着喜庆向南去，","快快乐乐迁新居。"]],[["孔鲤伯鱼，","北至高奴。","木马金车，","驾游大都。","王母送我，","牝字驹。"],["孔丘之子字伯鱼，","向北行至高奴地。","木马驾着金车行，","乘坐游览大都市。","王母送我骏母马，","母马生了一小驹。"]],[["三足无头，","不知所之。","心狂精伤，","莫使为明，","不见日光。"],["横生三脚没有头，","不知该往何处走。","心狂患了精神病，","无法使其再清醒，","有眼难见太阳明。"]],[["牝龙身，","日驭三千。","南止苍梧，","与福为婚。","道里夷易，","安全无忌。"],["骏马高大似龙体，","骑乘日行三千里。","南行来到苍梧山，","与福成婚作伴侣。","道路坦荡易行走，","平安到达无顾忌。"]],[["辰次降娄，","王驾巡狩。","广佑施惠，","安国无忧。"],["金秋骄阳至娄宿，","帝王驾车去巡行。","广施恩惠抚人民，","国家安定无忧凶。"]],[["望幸不到，","文章未就。","王子逐走，","马骑衔伤。","佚迹不得，","曷其有常？"],["盼望好运不来临，","道德文章未做成。","王子外出去打猎，","乘骑之马带伤痛。","走兽失踪未捉获，","何事能有其常性？"]],[["中原有菽，","以待饔食。","饮御诸友，","所求大得。"],["中原之地产豆子，","用它即可做熟食。","鲜豆美酒待好友，","事事满足君所求。"]],[["乱茅缩酒，","灵巫拜祷。","神怒不许，","瘁愁忧苦。"],["祭酒浇灌于乱茅，","巫师向神去祷告。","神灵发怒不应许，","降下愁苦甚难熬。"]],[["李华再实，","鸿卵降集。","仁哲以兴，","荫国受福。"],["李树开花又结果，","大雁飞来做卵窝。","仁人哲士俱出现，","保佑国泰民欢乐。"]],[["源出陵足，","行于山趾。","不为暴害，","民得安处。"],["清泉发源于丘陵，","蜿蜒山脚绕流行。","暴虐不能侵害我，","人民百姓得安宁。"]],[["客入其门，","奔走东西。","童女不织，","士弃耕亩。","暴骨千里，","岁饥民苦。"],["不速之客入我门，","全家东走又西奔。","少女不能去纺织，","家夫弃田不能耕。","千里尸骨暴荒野，","民苦岁寒无收成。"]],[["天之所予，","福禄常在。","以永康宁，","不忧危殆。"],["天发慈悲降皇恩，","福禄常伴我的身。","长享康乐永安宁，","不再担忧灾与凶。"]],[["蝗食我稻，","驱不可去。","实穗无有，","但见空藁。"],["蝗虫残食我稻谷，","驱赶不尽难根除。","花穗果实遭踏光，","只剩遍地枯枝秧。"]],[["牛骥同槽，","郭氏以亡。","国破空虚，","君奔走逃。"],["弱牛骏马同争强，","郭氏因而受伤亡。","国破家碎成废墟，","君主狼狈奔他乡。"]],[["狗无前足，","阴谋叛北；","为身害贼，","何以安息？"],["猎狗失去其前脚，","阴谋叛主向北逃；","身心遭到奸贼害，","岂能安居享逍遥？"]],[["两轮自转，","南上大阪。","四马共辕，","无有屯难，","与禹言笑。"],["两个车轮齐旋转，","向南行驶上高山。","四马同拉一辆车，","时运顺利无危难，","我与大禹笑开颜。"]],[["牙蘖生达，","阳昌於外。","左手执籥，","公言锡爵。"],["幼苗出土得萌生，","阳气在外多昌盛。","左手拿着管儿吹，","公爷将酒酌满杯。"]],[["秋花冬萼，","数被严霜。","甲兵当庭，","万物不生。","雄犬夜鸣，","民忧大惊。"],["深秋初冬花虽红，","数次遭受严霜侵。","盔甲兵器满庭院，","草木万物皆不生。","雄狗深夜叫不停，","百姓纷纷受大惊。"]],[["霜降闭户，","蛰虫隐处。","不见日月，","与死为伍。"],["深秋霜降闭门户，","越冬之虫土中伏。","不见太阳和月亮，","君与死神行一路。"]],[["身载百里，","功加四海。","为文开基，","武立天柱。"],["车载君子行百里，","四海之内建功绩。","辅佐武王得天下，","护佑文王立业基。"]],[["禹作神鼎，","伯益衔指。","斧斤高阁，","憧立独坐。","卖庸不雠，","苦困为祸。"],["夏王大禹铸九鼎，","伯益避居箕山中。","斧子高阁而不用，","独坐心中忧忡忡。","受雇于人无酬偿，","困苦艰难成祸凶。"]],[["福祚之聚，","喜至忧除。","如鱼逢水，","长乐受喜。"],["福气重重来相聚，","喜事临门忧愁除。","如同鱼儿得到水，","与乐与喜长相处。"]],[["苍龙隐伏，","麟凤远匿。","寇贼同处，","未得安息。"],["天上苍龙去隐伏，","麒麟凤凰匿远处。","贼寇与我居一处，","没有安宁和幸福。"]],[["白鹤衔珠，","夜食为明。","怀安德音，","身受光荣。"],["白鹤衔来夜明珠，","茫茫黑夜得照明。","怀念君子恩与德，","自身长久享崇荣。"]],[["旦生夕死，","名曰婴鬼，","不可得祀。"],["早晨出生晚上死，","呼它婴鬼为名字，","不可为其作祭祀。"]],[["行役未已，","新事复起。","姬姜劳苦，","不得休息。"],["丈夫服役未到期，","新的役事又临至。","家中主妇甚劳苦，","忙碌不堪难歇息。"]],[["忧患解除，","喜至庆来。","坐立欢忻，","与乐为邻。"],["忧患全部得解除，","喜庆和我同相处。","行止坐卧多欢欣，","常与快乐成近邻。"]],[["晨风文翰，","大举就温。","昧过我邑，","羿无所得。"],["鹯鸟皋鸡鼓其翼，","高飞去寻温和地。","黎明之前过城邑，","射手后羿未得利。"]],[["下田种黍，","方华生齿。","大雨淋集，","纷涝满瓮。"],["低洼田里种糜子，","含苞吐芳开花时。","瓢泼大雨齐降临，","瓮满四溢涝纷纷。"]],[["鸟庇茂林，","心乐愿得。","君子碌碌，","见者有谷。"],["鸟儿林中寻庇护，","内心愿望得满足。","农夫整天忙碌碌，","终于见到田中谷。"]],[["折臂踒足，","不能进酒。","祠祀阔旷，","神怒不喜。"],["伤了脚部折胳膊，","不能前去把酒酌。","祠堂空旷太冷落，","神灵发怒不喜悦。"]],[["学灵三年，","仁圣且神。","明见善祥，","吉喜福庆。","鹄飞来，","告我无忧。"],["学仙修道整三年，","仁慈聪圣似神仙。","先知先觉明善祥，","好事自来入门槛。","喜鹊飞来报喜讯，","告我不会有灾难。"]],[["三妇同夫，","志不相思。","心怀不平，","至常愁悲。"],["三个女人嫁一男，","志趣不同不思恋。","各自心中怀不平，","经常发愁生悲叹。"]],[["中田膏黍，","以享王母。","受福千亿，","所求大得。"],["田间地头产美黍，","用来敬献老祖母。","福禄多多逾千亿，","所求事儿都满足。"]],[["阳火不灾，","二耕庆来。","降福送喜，","鼓瑟歌讴。"],["阳光明媚无旱灾，","春耕秋耕吉庆来。","天降福瑞送来喜，","弹琴唱歌乐滋滋。"]],[["阳明不息，","君无恩德。","伯氏失利，","农丧其力。"],["日光亢盛酷似火，","君主无恩又缺德。","大哥事事不顺利，","穑人无力干农活。"]],[["燕雀衔茅，","以生孚乳。","兄弟六人，","姣好孝悌。","各得其愿，","和悦相乐。"],["燕子鸟雀衔茅草，","筑起窝巢育小鸟。","兄弟一共六个人，","和睦相处多亲近。","各自得到其所愿，","和气喜悦真高兴。"]],[["鹑尾贲贲，","火中成军。","虢叔出奔，","下失其君。"],["鹑火星儿像鹌鹑，","星下有兵在行动。","虢公仓皇而出奔，","臣民失去其国君。"]],[["两人相距，","止不同舍。","夫妻离散，","卫侯失居。"],["两人心中有隔阂，","住宿不能同一舍。","夫妻双双离散去，","卫侯失去其居所。"]],[["魃为旱虐，","风吹云却。","欲止不得，","反归其宅。"],["旱魑逞凶施暴虐，","风吹乌云急退却。","欲想停止又不能，","返回它的原处所。"]],[["关雎淑女，","配我君子。","少姜在门，","君子嘉喜。"],["雎鸠和鸣姑娘靓，","适配我那君子郎。","少妻倚立家门口，","小伙心中多欢畅。"]],[["慈母赤子，","飨赐得士。","夷狄服除，","以安王家。"],["慈母之爱赤子心，","犒劳奖赏我功臣。","四方夷狄被降服，","帝王家室得安宁。"]],[["三足孤乌，","灵明督邮。","司过罚恶，","自贼其家。"],["王母信使三足乌，","机灵英明任监督。","司过纠错罚罪恶，","反使自家招凶祸。"]]],[[["东乡藩垣，","相与笑言。","子般执鞭，","圉人作患。"],["向着东边篱笆垣，","一对情人相笑言。","子般手执一条鞭，","牧马之官在作乱。"]],[["循河榜舟，","旁淮东游。","鱼父举网，","先得大鳅。"],["顺水前行划小舟，","沿着淮河去东游。","渔夫举起捕鱼网，","撒网捕劳得大鳅。"]],[["辕折轮破，","马倚仆卧。","后旅先宿，","右足跌踒。"],["车辕断折车轮破，","马立道旁车夫卧。","旅行推后先留宿，","主人右脚遭跌踒。"]],[["两人相绊，","相与悖戾。","心乖不同，","讼争忷忷。"],["两人纠缠又阻拦，","相互抵触不得前。","心志各自不相同，","终日不停起争端。"]],[["北辰紫宫，","衣冠立中。","含和建德，","常受天福。"],["天上北辰紫微宫，","上苍帝王居其中。","品德高尚又和顺，","常享洪福无穷尽。"]],[["游居石门，","禄安身全。","受福西邻，","归饮玉泉。"],["出游住在石门山，","官位稳固身安全。","孔子故里受教诲，","纳福犹如饮玉泉。"]],[["羊肠九萦，","相推稍前。","此须王孙，","乃能上天。"],["羊肠小道九个弯，","相推才能稍向前。","须向王乔来学步，","方能登天成神仙。"]],[["争讼相倍，","和气不处。","阴阳俱否，","谷风毋子。"],["两心相背起争讼，","互相拆台事难成。","阴阳双双俱否定，","为夫所弃子难生。"]],[["郭叔矩颐，","为棘所拘。","龙额重颡，","祸不成殃，","复归其乡。"],["郭氏地廓方又圆，","却被拘捕入牢监。","天庭饱满富贵相，","有祸不会成灾患，","脱险又回自家园。"]],[["十乌俱飞，","异射九雌。","雄得独全，","虽惊不危。"],["十只乌鸦齐飞起，","后羿张弓射九雌。","雄乌独自得保全，","虚惊一场无灾异。"]],[["虿室蜂户，","螫我手足。","不得进止，","为吾害咎。"],["步入蝎室和蜂窝，","我的手脚遭其蜇。","前进后退都不能，","灾凶祸害临自身。"]],[["怒非其怨，","因物有迁。","贪妬腐鼠，","而呼鸮鸢。","自令失饵，","倒被困患。"],["发怒并非有仇怨，","事物互相有变迁。","贪婪抢占腐烂鼠，","唤来猛禽遭伤残。","自作自受失诱饵，","反倒招来祸与患。"]],[["婴孩求乳，","母归其子。","黄麑悦喜，","自乐甘饵。"],["婴儿哭啼要奶吃，","母亲归来探其子。","黄色小鹿多喜悦，","乐得慈母甘甜汁。"]],[["针缕徒劳，","锦绣不成。","鹰逐雉兔，","爪折不得。"],["穿针引线白劳动，","锦上绣花弄不成。","如同老鹰捉小兔，","折了利爪枉费功。"]],[["雨潦集降，","河渠不通。","齐鲁闭塞，","破费市空。"],["天上大雨如倾盆，","河渠受阻不畅通。","齐鲁交通都闭塞，","市场空空不见人。"]],[["封豕沟渎，","水潦空谷。","客止舍宿，","泥涂至腹；","处无黍稷。"],["凶星封豕似沟渠，","放出洪水漫山谷。","旅人困于客店中，","路上污泥至腰腹；","居处无谷亦无黍。"]],[["三奸相扰，","桀跖为友。","上下骚离，","隔绝天道。"],["三位奸人来打扰，","桀跖与其有私交。","从中挑拨搞离间，","逆理行事绝天道。"]],[["齐景惑疑，","为孺子牛。","嫡庶不明，","贼孽为患。"],["景公糊涂又昏惑，","少子骑牛行快乐。","嫡庶贵贱不分明，","孽子酿成大灾祸。"]],[["三羊俱亡，","走奔南行。","会暮失迹，","不知所藏。"],["三只羊儿都走失，","一同向南而奔驰。","太阳落山失踪迹，","不知羊儿藏何地。"]],[["请伯行贾，","岱山之野。","夜历险阻，","不逢危殆，","利如浇酒。"],["请求哥哥去经商，","泰山脚下大市场。","披星戴月历险阻，","未逢危难和灾殃，","获利如酒浇茅上。"]],[["桑之将落，","陨其黄叶。","失势倾侧，","而无所立。"],["桑树行将变枯竭，","黄叶纷纷都飘落。","失去依靠倾一侧，","难能立起再生活。"]],[["上山求鱼，","入水捕狸。","市非其归，","自令久留。"],["爬上高山去捕鱼，","游入水中捉狐狸。","所达不是目的地，","自吃苦头枉留止。"]],[["名成德就，","项领不试。","景公耋老，","尼父逝去。"],["道德名声都已成，","贤人未能受重用。","景公年迈又昏庸，","孔子离齐而远行。"]],[["天之奥隅，","尧舜之居。","可以存身，","保我国家。"],["天下西南角落里，","唐尧虞舜居住地。","安享天年养身体，","保我家国永安逸。"]],[["涉伯殉名，","弃礼诛身。","不得其道，","成子奔燕。"],["涉伯以命去求名，","抛弃礼仪招诛身。","不依规律去行事，","成子向那燕国奔。"]],[["两人俱争，","莫能有定。","心乖不同，","讼言起凶。"],["两人争吵不歇停，","谁是谁非难定论。","各人心思不相同，","辩论引起灾与凶。"]],[["雎鸠淑女，","贤圣配耦。","宜家受福，","吉庆长久。"],["雎鸠和鸣妹俊秀，","圣哲贤人好配偶。","宜成新家受大福，","吉祥好运真长久。"]],[["逾江求橘，","并得大栗。","烹羊食肉，","饮酒歌笑。"],["渡过江水去寻橘，","同时获得大板栗。","烹熟享用鲜羊肉，","痛饮美酒乐滋滋。"]],[["山险难行，","中多石。","车驰击，","载重伤轴。","担负差踬，","跌踒右足。"],["山路艰险难攀登，","涧中多石车难行。","车子奔驰撞轴头，","重载颠簸轴受损。","肩挑重担被摔倒，","跌跤摔伤右脚根。"]],[["允利孔福，","神所子畜。","般乐无苦，","得其欢欲。"],["大吉大利生大福，","神灵恩赐来养育。","万般欢乐无痛苦，","所求欲望得满足。"]],[["鸟雀食谷，","张口受哺。","蒙被恩福，","长大成就。","柔顺利贞，","君臣合德。"],["鸟鹊衔来稻和谷，","幼鸟张口受其哺。","承蒙养育德与恩，","长大体羽多丰盈。","温顺吉利又真诚，","君上臣下乐融融。"]],[["潼滃蔚荟，","膚寸来会。","津液下降，","流潦滂沛。"],["阴云弥漫齐翻滚，","密密层层聚长空。","大雨倾盆而降下，","陆地波涛甚汹涌。"]],[["路多枳棘，","步刺我足。","不利旅客，","为心作毒。"],["路上枳木棘木多，","我的双脚被刺破。","不利出门去远行，","心烦意乱悔恨生。"]],[["虺蝮所聚，","难以居处。","毒螯痛甚，","疮不可愈。"],["毒蛇聚集同一处，","此地实在难居住。","蜇伤我身痛彻骨，","疮痕累累难治愈。"]],[["麟凤相随，","观察安危：东国圣人，","后稷周公。","共和政令，","君子攸同。","利以居止，","长无忧凶。"],["麒麟凤凰俱出行，","前往观察世间情：东方国中居圣人，","乃是后稷和周公。","共和年代发政令，","君子同乐亦同仁。","吉利祥和宜居住，","永远无忧无灾凶。"]],[["桀乱不时，","使民恨忧。","六趾为笑，","君危臣羞。"],["夏桀暴虐失常道，","百姓痛苦甚难熬。","多生歧指为人笑，","君危臣下难逍遥。"]],[["黄帝所生，","伏羲之宇。","兵刃不至，","利以居止。"],["黄帝诞生之圣地，","贤人伏羲住这里。","刀兵战燹不临至，","在此居住最适宜。"]],[["雀行求粒，","暮归屋宿。","反其室舍，","安宁如故。"],["鸟雀外出去觅食，","傍晚回巢来住宿。","返还自己原居室，","天天平安又顺利。"]],[["太仓积谷，","天下饶食。","阴阳调和，","年岁时熟。"],["京城粮仓积满谷，","天下百姓都富裕。","阴阳二气甚调和，","年丰岁熟衣食足。"]],[["干旄旌旗，","执帜在郊。","虽有宝玉，","无路致之。"],["牛尾鸟羽饰旗杆，","高高飘扬在郊原。","纵使前方有宝珠，","无路到达获取难。"]],[["履危蹈颠，","坠入寒渊。","行不能前，","足踒不便。"],["踏上危险山顶端，","坠入寒冷之深渊。","脚伤行动不便利，","难能继续再向前。"]],[["衔命上车，","合和两家。","蛾眉皓齿，","二国不殆。"],["奉命上车欲出嫁，","夫妇合和双方家。","姑娘年轻又美丽，","两国关系多融洽。"]],[["吉日车攻，","田弋获禽。","宣王饮酒，","以告嘉功。"],["吉日车儿修工整，","野外打猎射鸟禽。","宣王痛快饮美酒，","举杯庆贺功告成。"]],[["金帛贵宝，","宜与我市。","嫁聚有息，","利得过母。"],["黄金丝帛贵如玉，","适合用之做生意。","出嫁迎娶有利筷，","得利过本生福气。"]],[["延颈望酒，","不入我口。","深以自喜，","得利无有。"],["伸长脖子望着酒，","美酒不入我的口。","内心深处暗自喜，","得利一点也没有。"]],[["牧为代守，","飨食甘赐。","得吏士意，","战大破胡，","长安国家。"],["李牧代地来驻守，","甘与下属同乐忧。","士卒诚心来归服，","战胜骄胡和贼寇，","解除赵国之大忧。"]],[["日出温谷，","临照万国。","高明淑仁，","虞夏配合。"],["日出东山之温谷，","照临四方万国土。","高尚圣明贤淑人，","虞舜夏禹相帮辅。"]],[["逐兔索乌，","破我弓车。","日暮不及，","失利后时。"],["欲想追兔又射乌，","坏了弓和车轮轱。","直到天黑无所得，","利益时间白耽误。"]],[["讹言妄语，","传相诖误。","道左失迹，","不知所处？"],["虚伪之言荒诞语，","流传害人误正事。","足迹消失于路旁，","不知去向在何地？"]],[["履虎蹑蛇，","贬损我威。","君子失车，","去其国家。"],["脚踩恶虎与毒蛇，","损我威信贬低我。","大人丢官又失车，","另谋出路去别国。"]],[["本根不固，","花叶落去；","更为孤妪，","不得相视。"],["根基不深不牢固，","花叶凋零渐干枯；","孤苦伶仃一老妇，","没有谁人去照顾。"]],[["五轭四轨，","优得饶有。","陈力就列，","驺虞悦喜。"],["五根曲木四楔钉，","车上猎物饶又丰。","车子列阵齐行进，","驺虞心中很高兴。"]],[["黄帝紫云，","圣哲且神。","光明见祥，","告我无殃。"],["黄帝身上着紫云，","圣哲贤明如神灵。","光明出现呈吉祥，","告我没有灾与殃。"]],[["五利四福，","俱田高邑。","黍稷盛茂，","多获藁稻。"],["五利将军佩金印，","食邑两千武帝封。","糜子谷子都茂盛，","多获稻粮好收成。"]],[["群虎入邑，","求索肉食。","大人卫守，","君不失国。"],["一群老虎跑进城，","四处寻食甚狂疯。","忠臣良将齐卫守，","君王不失国与民。"]],[["乌子鹊雏，","常与母居。","愿慕群侣，","不离其巢。"],["乌鸦之子喜鹊雏，","常与母亲聚枝头。","羡慕众鸟翱长空，","不离其巢无忧愁。"]],[["蹇驴不材，","骏骥失时。","筋劳力尽，","疲于沙丘。"],["跛脚之驴不成材，","骏马背时运不来。","伤筋劳骨力用尽，","疲弊倒在沙丘中。"]],[["元鬣黑颡，","东归高乡。","朱鸟道引，","灵龟载庄。","遂抵天门，","见我贞君。"],["青鬃黑额马儿壮，","骑乘向东回高乡。","朱雀在前指道路，","灵龟引我上康庄。","平安抵达天门关，","拜见贞君于明堂。"]],[["探巢得雏，","鸠鹊来俱，","使我欣娱。"],["去掏鸟窝获小鸟，","斑鸠喜鹊都来到，","使我欢欣情绪高。"]],[["安上宜官，","一日九迁。","升擢超等，","牧养常山，","君臣得安。"],["安抚上司好做官，","一日能有九升迁。","提拔升擢超众人，","如同田氏居常山，","君上臣下皆平安。"]],[["大头明日，","载受嘉福。","三雀飞来，","与禄相得。"],["头大双眼明又亮，","上天赐予大福相。","三只鸟雀齐飞来，","爵位临身禄长长。"]],[["远视千里，","不见黑子。","离娄之明，","无益于光。"],["遥望千里看太阳，","不见黑子日中藏。","离娄眼睛虽明亮，","同样无法见真相。"]],[["三女为奸，","俱遊高园，","背夫夜行，","与伯笑言。","不忍主母，","为失醴酒，","冤尤谁告？"],["三位女子有奸情，","一同遊至原野中，","背着丈夫夜出行，","与人谈笑乱调情。","不忍主母来非难，","泼掉毒酒假跌身，","冤屈谁人能说清？"]],[["日辰不和，","强弱相振。","一雌两雄，","客胜主人。"],["日子时辰不和顺，","刚强柔弱同相振。","一雌遇到两个雄，","客人反而胜主人。"]]],[[["伯夷叔齐，","贞廉之师。","以德防患，","忧祸不存。"],["贤臣伯夷和叔齐，","忠贞廉洁为人师。","常以美德防祸患，","忧愁祸患不临至。"]],[["济深难渡，","濡我衣裤。","五子善棹，","脱无他故。"],["水深流急难涉渡，","弄湿我的衣和裤。","同行五人善划船，","脱离危险无事故。"]],[["倚立相望，","适得道通。","驱驾奔驰，","比目同床。"],["站在道旁遥相望，","适逢路途很通畅。","驾起车子驰向前，","婚姻和合同登床。"]],[["葛藟蒙棘，","华不得实。","谗佞为政，","使恩壅塞。"],["葛藤处在荆棘中，","开花无实不中用。","奸佞之人乱朝政，","致使恩德行不通。"]],[["四牡无角，","君子所服。","南征述职，","与福相得。"],["四匹马儿没有角，","贤士用它来驾车。","前往南方去述职，","与福与禄喜相得。"]],[["踝踵足伤，","左指病痈。","失旅后时，","利走不来。"],["脚部受伤甚疼痛，","左手指头害疮痈。","落于众后误时辰，","利益弃我去无踪。"]],[["春城夏国，","生长之域。","可以服食，","保全家国。"],["仲春盛夏好时光，","雨露滋润万物长。","服用饮食补元气，","保家卫国力量强。"]],[["望骥不来，","驹蹇为忧。","雨惊我心，","风撼我肌。"],["盼望骏马却没有，","跛驹驾车甚担忧。","大雨倾盆惊我心，","寒风飕飕令人愁。"]],[["久客无床，","思归我乡。","雷雨满盈，","道不得通。"],["久居他乡没有床，","一心思念回故乡。","雷雨滂沛水遍地，","道路泥泞不通畅。"]],[["方船备水，","傍河燃火。","积善有征，","终身无祸。"],["两般相关备好水，","燃火到那河岸旁。","修善积德好习性，","终生不会有灾殃。"]],[["求玉陈国，","留连东域。","须我王孙，","四月来复。","主君有德，","蒙恩受福。"],["寻求美玉陈国中，","流连徘徊于城东。","等待公子和王孙，","初夏四月回佳音。","主人品德多高尚，","使我受福蒙大恩。"]],[["陟岵望母，","役事未已。","王政靡盬，","不得相保。"],["登上高山望母亲，","兵役劳役没个终。","朝廷王事无休止，","难为慈母尽孝心。"]],[["多载重负，","捐弃于野。","予母谁子，","但自劳苦。"],["承载多多负荷重，","丢弃野外路途中。","不知他是谁家子，","独自受苦枉劳神。"]],[["生直地乳，","上皇大喜。","赐我福祉，","寿算无极。"],["诞生接受地哺育，","皇天在上乐无比。","赐我洪福好日子，","健康长寿无止极。"]],[["翕翕軥軥，","陨堕山巅。","灭我令名，","长没不全。"],["车声轰轰驰向前，","转而坠落崩山涧。","灭了我的美好名，","长久埋没难保全。"]],[["东邻嫁女，","为王妃后。","庄公筑馆，","以尊王母。","归于京师，","季姜悦喜。"],["东边邻国出嫁女，","做了桓公的正室。","庄公城外建新馆，","以示尊崇周王姬。","嫁至周都洛邑城，","季姜心中很欢喜。"]],[["伯虎仲熊，","德义渊闳。","使布五教，","阴阳顺序。"],["伯虎仲熊两弟兄，","道德仁义广又深。","使其布施传五教，","阴阳二气都和顺。"]],[["敏捷劲疾，","如猿升木。","彤弓虽调，","终不能获。"],["动作敏捷如神速，","如同猴子爬高树。","红色弓儿虽调好，","最终猎物未得到。"]],[["举袂覆目，","不见日月。","衣裘簟席，","就长夜室。"],["举起袖子遮住眼，","太阳月亮都不见。","和衣睡上竹席床，","即将进入冥国间。"]],[["忍丑少羞，","无面有头。","耗减寡虚，","日以削消。"],["强忍丑恶减愧羞，","没脸见人枉有头。","精力全部消耗尽，","日复一日变消瘦。"]],[["涸阴冱寒，","常冰不温。","凌人惰怠，","雹大为灾。"],["阴气凝聚冻又寒，","长年冰封无温暖。","掌冰之官太懒惰，","天降大雹成灾患。"]],[["夏麦麸黄，","霜击其芒。","疾君败国，","使民夭伤。"],["夏麦结粒又灌浆，","严霜袭来击其芒。","君主昏庸败国事，","使得黎民受灾殃。"]],[["渊涸龙忧，","箕子为奴。","干叔殒命，","殷破其家。"],["渊水干涸龙发愁，","箕子为奴装疯癫。","比干进谏剖心肝，","殷商破国毁家园。"]],[["跛骑相随，","日暮牛罢。","陵迟后旅，","失利亡雌。"],["跛脚赶路相随从，","黄昏牛疲难行进。","斜坡之上落伍后，","利益女友皆无踪。"]],[["桑之将落，","陨其黄叶；","失势倾侧，","如无所立。"],["桑树枝枯叶落尽，","黄叶随风乱飘殒；","失去权势颂一侧，","无法站稳其脚跟。"]],[["生长以时，","长育根本。","阴阳和德，","岁乐无忧。"],["顺应时令而生长，","本固枝茂叶儿旺。","阴阳相和德高尚，","年年岁岁都欢畅。"]],[["童女无夫，","未有配合。","阴阳不和，","空坐独宿。"],["少女长大无对象，","暂且尚无匹配郎。","阴柔阳刚不协调，","空坐独宿守空房。"]],[["春令原宥，","仁德不周。","三圣攸同，","周国茂兴。"],["春天政令很宽容，","清除不义和不仁。","三位圣人同协力，","周国因之得昌盛。"]],[["金精耀怒，","带剑过午。","两虎相距，","虽惊无咎。"],["太白金星放怒光，","佩带利剑居西方。","虎视眈眈两相距，","虽然受惊却无殃。"]],[["危坐至暮，","谋求不得。","膏泽不降，","政戾民忒。"],["跪着等待到天黑，","所求事情不能得。","君王不把恩泽施，","政治暴虐民困惑。"]],[["老杨日衰，","条多枯枝；","爵级不进，","日下摧颓。"],["杨树日渐变衰亡，","树梢枝枯叶儿黄；","不能加官难晋升，","久不得志甚迷惘。"]],[["蔡侯适楚，","留连江滨。","逾日历月，","思其后君。"],["葵侯赴楚去进贡，","徘徊江边海之滨。","思念日后岁月里，","君位由谁来继承？"]],[["右抚剑佩，","左援钩带。","凶讼不止，","相与争戾。","失利市肆。"],["右手按着剑把柄，","左手钩带握得紧。","争讼凶凶不停止，","势不两立怒难平。","市场经营利落空。"]],[["水流趋下，","远至东海。","求我所有，","买鲔与鲤。"],["江河奔腾向下流，","直泻千里东海口。","欲求我想所有物，","鲔鱼鲤鱼样样有。"]],[["登几上舆，","驾驷南游。","合纵散横，","燕齐以强。"],["踩着小凳上了车，","四马驾行游南国。","合纵抗秦不连横，","燕国齐国得强盛。"]],[["求兔得獐，","过其所望。","欢以相迎，","高位夷伤。"],["欲求兔子却得獐，","获利超过其所望。","欢天喜地来庆贺，","谨防高位遭跌伤。"]],[["过时不归，","道远且迷。","旅人心悲，","使我徘徊。"],["过了时辰不见归，","中途迷路难返回。","游子心苦志悲哀，","使我踌躇独徘徊。"]],[["魂孤无室，","御宿舍食。","盗张民溃，","见敌失内。"],["魂魄孤苦无家室，","困无居处饥无食。","强盗器张民溃乱，","外敌入家失贤妻。"]],[["居如转丸，","危不得安。","东西不宁，","动生忧患。"],["居住之地如转丸，","动荡危险不安全。","东奔西走难安身，","行动必然生忧患。"]],[["坤厚地德，","庶物蕃息。","平康正直，","以绥大福。"],["厚德载物惟大地，","万物繁衍得生息。","君心平和又正直，","必将招来大福气。"]],[["树蔽牡荆，","生蘙山旁。","仇敌背憎，","孰肯相迎。"],["大树高高遮荆棘，","荆棘蔽生山脚地。","双方憎恨如仇敌，","难能相处居一起。"]],[["凤凰衔书，","赐我玄珪，","封为晋侯。"],["凤凰口衔神图来，","黑色瑞玉赐我怀，","封为晋侯国号改。"]],[["作凶不善，","相牵入井。
