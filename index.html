","溺隐辜罪，","祸至忧有。"],["作恶多端心不善，","拖人下井受灾难。","溺害无辜太残忍，","祸去忧来不间断。"]],[["悲鸣北行，","失其长兄。","伯仲不幸，","骸骨散亡。"],["悲伤嚎叫向北行，","中途失去其长兄。","兄弟二人真不幸，","尸骨散亡无处寻。"]],[["羔衣豹裘，","高易我宇，","君子维新。"],["羊羔皮袄豹子袍，","我家房屋大又高，","辞旧迎新运气好。"]],[["日中为市，","各抱所有，","交易货资。","含珠怀宝，","心悦欢喜。"],["正午市场正活跃，","商人肩扛怀又抱，","买卖频频得成交。","人们含珠怀揣宝，","高兴喜悦心欢笑。"]],[["振急绝理，","恒阳不雨。","物病焦干，","华实无有。"],["振动过急失常理，","骄阳似火不下雨。","万物患病变焦枯，","不开花儿不结实。"]],[["狐貉载剥，","徒温厚蓐。","寒棘为疾，","有所不足。"],["狐狸貉子剥下皮，","制成衣褥暖身体。","寒风刺骨已成疾，","虽有此物不顶事。"]],[["履践危难，","脱执去患。","入福喜门，","见诲大君。"],["路途历经危与难，","幸得摆脱祸与患。","大步走进幸福门，","天子将我来召见。"]],[["四乱不安，","东西为患。","退止我足，","毋出国域。","乃得全完，","赖其生福。"],["四方动乱不得安，","东西都逢祸与患。","不宜轻举而妄动，","出门将会有危难。","最终能够得安全，","幸福来到君身边。"]],[["南国少子，","材略美好。","求我长女，","贱薄不与。","反得丑恶，","后乃大悔。"],["南方有位小伙子，","相貌堂堂才略奇。","前来追求我长女，","嫌他贫贱未允许。","长女反而嫁丑夫，","使我后悔来不及。"]],[["妄怒失理，","阳孤无辅。","物病焦枯，","年饥于黍。"],["轻意发怒输了理，","阳气孤单无辅弼。","万物患病变焦枯，","年岁饥荒无粮食。"]],[["倬然远咎，","辟患害早。","田获三狐，","巨贝为宝。"],["隐居避壤荒野间，","趁早躲开祸与患。","打猎获得三狐狸，","犹如宝贝抵金钱。"]],[["逐鹿山巅，","利去我西。","维邪南北，","无所不得。"],["追鹿追到山顶端，","利于去我身西边。","呼声传遍南与北，","所求之事皆兑现。"]],[["龙蛇所聚，","大水来处。","滑滑沛沛，","使我无赖。"],["巨龙长蛇聚集地，","水势汹汹来这里。","汹涌澎湃狂奔流，","使我无靠无所依。"]],[["从风吹火，","牵骐骥尾。","易为功力，","因摧受福。"],["顺风吹火大火起，","牵着马尾疾行驰。","事情易成费力少，","受挫尔后来福气。"]],[["泽狗水凫，","难畜少雏。","不为家饶，","心其亟逋。"],["泽中之狗水中鸭，","难以饲养繁殖它。","不为家中增收入，","心中只想逃离家。"]],[["水坏我里，","东流为海，","龟凫欢嚣，","不见慈母。"],["大水冲坏我家乡，","东流汇成大海洋。","海龟野鸭到处叫，","儿子不见其亲娘。"]],[["褰衣涉河，","水深渍罢。","赖幸舟子，","济脱无他。"],["撩起衣裤欲过河，","水深衣湿难涉过。","幸亏船夫来帮助，","平安渡过得解脱。"]],[["龟厌河海，","陆行不止。","自令枯槁，","失其都市。","忧悔为咎，","亦无及己。"],["乌龟厌恶海与河，","陆地爬行不停歇。","自食恶果变枯槁，","失其都市无欢乐。","忧愁悔恨铸成错，","终究未晓是自过。"]],[["同本异叶，","乐仁政德。","东邻慕义，","来兴我国。"],["同根长出不同叶，","崇尚仁义和美德。","东邻友邦慕礼义，","前来振兴我中国。"]],[["桃李花实，","累累日息。","长大成熟，","甘美可食，","为我利福。"],["桃李开花又结实，","果实累累压弯枝。","渐渐长大得成熟，","味美甘甜供我食，","给我带来福和利。"]],[["重瞳四乳，","聪明顺理。","无隐不形，","微视千里。","灾害不作，","君子集聚。"],["虞舜文王并处世，","耳聪目明顺天理。","光明磊落不隐形，","明察秋毫达千里。","灾难祸害不临至，","高尚之人来聚集。"]],[["实沈参墟，","以义讨尤。","次止结盟，","以成霸功。"],["实沈属于参宿地，","大义凛然伐过失。","中途和好结同盟，","成就霸业立功绩。"]]],[[["江河淮济，","天之奥府。","众利所聚，","可以饶有，","乐我君子。"],["长江黄河淮海旁，","上天所赐好地方。","大利多多聚一起，","丰饶富足鱼米乡，","乐坏我这君子郎。"]],[["天之所灾，","凶不可居。","转徙获福，","留止忧危。"],["苍天降临灾难处，","凶恶危险不可居。","迁移他乡能获福，","留此忧愁祸害出。"]],[["名成德就，","项领不试。","景公耋老，","尼父逝去。"],["道德名声虽已成，","贤人未能受重用。","景公年迈又昏庸，","孔子离齐而远行。"]],[["持善避恶，","福禄常存。","虽有豺虎，","不能危患。"],["坚持行善不作恶，","幸福利禄常随我。","虽有豺狼和恶虎，","不能行凶造灾祸。"]],[["避患东西，","反入祸门。","糠糟不足，","忧动我心。"],["避患东逃又西奔，","反而进入祸患门。","吃粮咽菜不饱腹，","忧愁常困我心中。"]],[["珪璧琮璋，","执贽见王。","百里宁戚，","应聘齐秦。"],["手执珪璧和琮璋，","前来拜见我君王。","百里宁戚任宰相，","齐桓秦穆得盛强。"]],[["扬水潜凿，","使石洁白。","裹素表朱，","游戏皋沃。","得君所愿，","心志娱乐。"],["河水悠悠暗流行，","使得白石多鲜明。","身穿白衫红外套，","游戏来到曲沃城。","好人愿望得实现，","欢娱快乐真高兴。"]],[["官爵相保，","居之无咎。","求免不得，","使伯恨悔。"],["身居官位相保护，","忧祸不入其门户。","请求赦免未允许，","使我大哥空悲苦。"]],[["载车无裈，","裸裎出门。","小儿作笑，","君为忧患。"],["乘车出门无衣裤，","赤身裸体去赶路。","小孩看见作笑品，","大人见了有忧心。"]],[["把珠入口，","为我利宝。","得吾所有，","欣然嘉喜。"],["手执玉珠放入口，","保我吉利又长寿。","得到我所想有物，","内心喜悦乐悠悠。"]],[["行不如还，","直不如屈，","进不如退，","可以安吉。"],["出行不如复回还，","刚直不如变屈弯，","前进不如向后退，","可以吉利保平安。"]],[["秦为虎狼，","与晋争强。","并吞其国，","号曰始皇。"],["秦国残暴似虎狼，","欲与晋国争高强。","兼并吞食弱小国，","嬴政号称秦始皇。"]],[["众鬼瓦聚，","中有大怪，","九身无头。","魂惊魄去，","不可以居。"],["众鬼如瓦层叠聚，","中间有一大怪出，","无头却有九身躯。","丧魂落魄受惊扰，","此地不可久留居。"]],[["家给人足，","颂声并作。","四夷宾服，","干戈橐阁。"],["家家丰衣又足食，","赞颂之声到处起。","四方边民来臣服，","刀枪入库息战事。"]],[["人面鬼口，","长舌如斧。","斫破瑚琏，","殷商绝祀。"],["长着人面和鬼口，","长舌犹如破斧头。","砍破瑚琏祭祀器，","殷商绝祀无后裔。"]],[["南山之峻，","真人所在。","德配唐虞，","天命为子。","保佑歆享，","身受大庆。"],["南山险峻又幽静，","顶端住着道家人。","德行堪配尧和舜，","上天命其为人君。","保佑祭品常享受，","身受大吉大喜庆。"]],[["春桃生花，","季女宜家。","受福多年，","男为邦君。"],["春天桃树开了花，","少女长大要出嫁。","荣华富贵享多年，","丈夫是位地方官。"]],[["鸱鸮破斧，","冲人危殆。","赖其忠德，","转祸为福，","倾危复立。"],["恶鸟飞来斧难砍，","年轻人儿有危难。","幸赖忠诚德高尚，","祸去福禄临身边，","脱离险境获平安。"]],[["猿堕高木，","不踒手足。","保我金玉，","还归其室。"],["猿从高树坠于地，","没有跌伤手和足。","我的财物得保全，","返回自己原居室。"]],[["天之奥隅，","尧舜所居。","可以存身，","保我邦家。"],["天之西南角落里，","唐尧虞舜居住地。","适宜安居养身体，","可以保全我家室。"]],[["伯蹇叔盲，","足病难行。","终日至暮，","不离其乡。"],["兄跛小弟目失明，","脚部患病难出行。","从早一直到傍晚，","不能离开其家中。"]],[["日月相望，","光明盛昌。","三圣茂功，","仁德大隆。"],["太阳月亮遥相望，","世道光明又盛昌。","三位圣人建奇功，","仁义道德很隆盛。"]],[["桃李花实，","累累日息。","长大成就，","甘美可食。"],["桃李开花又结实，","硕果累累多茂密。","果实长大得成熟，","甘甜爽口成美食。"]],[["入和出明，","动作有光。","动转休息，","所为允康。"],["落山和暖出山亮，","运行动作放光芒。","太阳运行又休息，","一举一动都安康。"]],[["阴衰老极，","阳建其德。","履离戴光，","天下昭明。","功业不长，","虾蟆大王。"],["阴气微弱渐衰亡，","阳建功德呈盛强。","踩着火苗带着光，","天下昭明又盛昌。","可惜功业不长久，","蛤蟆临时称大王。"]],[["行役未已，","新事复起。","姬姜为苦，","不得休止。"],["边疆服役未结束，","新的劳役又开始，","夫妻劳累难忍受，","兵役劳役无休止。"]],[["狐鸣室北，","饥无所食。","困于空邱，","莫与同力。"],["孤狐哀鸣室北地，","饥肠辘辘未得食。","困于空丘无伴侣，","没有同类相协力。"]],[["雄圣伏名，","人匿麟远。","走凤飞北，","扰乱未息。"],["圣人隐姓埋真名，","人匿麒麟也远行。","凤凰向北飞离去，","天下动乱不安宁。"]],[["疾贫望幸，","使伯行贩。","开牢择羊，","多得大牂。"],["疾贫盼望幸福来，","使哥经商做买卖。","打开圈门选择羊，","得到很多大母羊。"]],[["翕翕軥軥，","陨坠颠崩。","灭其令名，","长没不存。"],["车声轰轰齐向前，","转而坠落遭崩巅。","毁灭我的好名声，","长久埋没不复显。"]],[["华落实槁，","衣敝如络。","女功不成，","丝布如玉。"],["桑麻枯槁无收成，","衣服破烂多补丁。","女工不能把布织，","集市丝布贵如玉。"]],[["温山松柏，","常茂不落。","鸾凤所止，","得其欢乐。"],["温山之上有松柏，","四季常青不凋落。","鸾鸟凤凰来栖息，","长享吉祥和欢乐。"]],[["失恃毋友，","嘉偶出走。","攫如失兔，","累如丧狗。"],["失去慈母无朋友，","心爱妻子又出走。","犹如失兔被人捉，","活像一条丧家狗。"]],[["太乙驾骝，","从天上来。","征我季叔，","封为鲁侯。"],["太乙驾上枣红马，","从那上天而降下。","征召我家小兄弟，","封为鲁国大管家。"]],[["双凫俱飞，","欲归稻池。","径涉萑泽，","为矢所射。"],["两只野鸭一齐飞，","往那稻池而回归。","经过芦苇池塘地，","暗箭伤身事不遂。"]],[["深坑复平，","天下安宁。","意娱心乐，","赖福长生。"],["深坑陷阱已填平，","天下从此享安宁。","心意欢娱多快乐，","依靠幸福得长生。"]],[["俱为天民，","云过吾西。","风伯雨师，","与我无恩。"],["都是天下老百姓，","我的西边飘着云。","风伯伙同那雨师，","偏偏不给我降恩。"]],[["野鸟山鹊，","来集六博。","三枭四散，","主人胜客。"],["野外鸟儿约山鹊，","相聚一同玩六博。","三次获枭四得散，","主人反而胜过客。"]],[["北阴司寒，","坚冰不温。","凌人惰怠，","大雹为灾。"],["北方阴气主寒冷，","坚冰聚积不见温。","天官凌人太懒怠，","老天降雹造灾凶。"]],[["伊尹致仕，","去桀耕野。","执顺以待，","反和无咎。"],["伊尹辞官做黎民，","弃桀还乡去从耕。","待到新的贤君出，","复得平和无忧凶。"]],[["秋风牵手，","相从笑语。","伯歌季舞，","燕乐以喜。"],["顺着秋风手拉手，","欢言笑语向前走。","哥哥唱歌弟跳舞，","兄弟二人乐悠悠。"]],[["徙巢去家，","南过白马。","东西受福，","与母相得。"],["搬迁离开自己家，","向南迁移至白马。","东往西来皆受福，","我与慈母获利大。"]],[["鸟飞跌跛，","两两相和。","不病四支，","但去莫疑。"],["一对飞鸟跌坏爪，","两两相和伤不大。","四肢完好未受损，","比翼双飞多融洽。"]],[["三牛生狗，","以戌为母。","荆夷上侵，","姬伯出走。"],["天降灾异牛生狗，","预兆戌年有祸咎。","荆地之夷来侵犯，","姬伯逢此也逃走。"]],[["破框敝筥，","弃捐于道。","坏落穿败，","不复为宝。"],["破竹筐和旧篮子，","扔在路上无人拾。","大小东西不能盛，","当作废物将它弃。"]],[["结纽得解，","忧不为祸。","食利供家，","受福安坐。"],["重重结扣得解开，","忧祸不再随身来。","获取利益供养家，","坐受幸福享安泰。"]],[["白日扬光，","雷车避藏。","云雨不行，","各自还乡。"],["白天太阳放光芒，","雷神之车去隐藏。","祥云吉雨都不来，","各自回归其故乡。"]],[["杜口结舌，","心中怫郁。","去灾生患，","无所告冤？"],["闭起嘴巴不说话，","心中忧郁结疙瘩。","去了灾祸又生患，","叫我何处去申冤！？"]],[["赍贝赎狸，","不听我辞。","系于虎须，","牵不得来。"],["带着金钱去赎狸，","朋友不听我劝阻。","将狐系于虎面上，","牵之不来白受苦。"]],[["鸣鹤抱子，","见蛇何咎。","室家俱在，","不失其所。"],["仙鹤鸣叫抱小鹤，","毒蛇见之无奈何。","举家大小都健在，","不会流离失居所。"]],[["逐兔山西，","利走入门。","赖我仁德，","获为我福。"],["追逐野兔山西边，","吉利自来入门槛。","全赖我修仁与德，","获得福禄如神仙。"]],[["兴役不休，","与民争时。","牛生五趾，","行危为忧。"],["差役叠起无休止，","朝廷与民争分时。","一牛生出五脚趾，","出行有危成忧虑。"]],[["春栗夏梨，","山鲜希有。","斗千石万，","贵不可贩。"],["春天毛栗夏天梨，","山鲜稀少贵如玉。","斗值千文石值万，","价钱太高不可贩。"]],[["悲号北行，","失其长兄。","伯仲不幸，","骸骨散亡。"],["悲哭号叫向北行，","失去我的亲长兄。","兄弟二人真不幸，","尸骨散亡难找寻。"]],[["赋敛重数，","政为民贼。","杼柚空虚，","家去其室。"],["赋税既频又繁重，","官府如贼害百姓。","织机空飞无布织，","全家背乡又离井。"]],[["履服白缟，","殃咎并到，","忧不能笑。"],["鞋帽衣服皆白色，","祸殃灾患来找我，","家遇丧事笑不得。"]],[["杜口结舌，","言为祸母。","代伯受患，","无所祷冤。"],["闭口沉默少出言，","舌为招祸之根源。","代替大哥去受难，","无处祷告屈和冤。"]],[["免冠进贤，","步出朝门。","仪礼不正，","贼孽为患。"],["免冠谢罪荐贤能，","随即走出朝廷门。","是非赏罚不分明，","乱贼孽子造灾凶。"]],[["娶于姜女，","驾迎新妇。","少齐在门，","夫子悦喜。"],["欲娶姜家那女郎，","驾车前去迎新娘。","年轻妻子立在门，","新郎喜悦心欢畅。"]],[["牧羊稻园，","闻虎喧欢。","畏恐悚息，","终于祸患。"],["放牧羊儿在稻田，","忽然听见虎声喧。","畏惧恐惑不敢动，","终于无灾无祸患。"]],[["老妾据机，","纬绝不知。","女功不成，","冬寒无衣。"],["老妇坐上织布机，","纬线断绝未觉知。","女工织布难织出，","冬天没有御寒衣。"]],[["黑龙吐光，","使阴复阳。","燎猎载圣，","六师以昌。"],["黑色神龙口吐光，","使得阴气又转阳。","猎得熊罴载圣人，","六师将卒大盛昌。"]],[["东邻嫁女，","为王妃后。","庄公筑馆，","以尊王母。","归于京师，","季姜悦喜。"],["东边邻国出嫁女，","做了桓王的正室。","庄公城外建新馆，","以示尊敬周王姬。","嫁至周都洛邑城，","季姜心中很欢喜。"]],[["灌颉东从，","道顿跌踦。","日辰不良，","病为身祸。"],["重耳颠颉逃向东，","途中受阻不能行。","时辰不良无吉日，","疾病灾祸缠自身。"]]],[[["一臂六手，","不便于口。","莫肯与用，","利弃我走。"],["一条胳膊六只手，","指多碍事难开口。","谁也不肯听我使，","利益全都弃我走。"]],[["獐鹿逐牧，","饱归其居，","安宁无悔。"],["獐子鹿儿寻水草，","吃饱回归原住处，","平安宁静无愁苦。"]],[["鸿鱼逆流，","主人潜处。","蓬蒿代柱，","大屋颠仆。"],["大鱼逆流向上游，","主人隐居于山丘。","草秆代柱做栋梁，","高大室屋遭倾僵。"]],[["三羖五牂，","相遇俱行，","迷入空泽。","经涉六驳，","为所贼伤。"],["三公五母八只羊，","结伴同行在路上，","沼泽地里迷方向。","经涉途中遇猛兽，","羊儿全遭其残伤。"]],[["黄帝出游，","驾龙乘马。","东上泰山，","南过齐鲁，","邦国咸喜。"],["黄帝巡视江南北，","乘龙驾马去游说。","向东登上泰山顶，","南下齐国和鲁国，","各国人民都欢乐。"]],[["履危不安，","心欲东西。","步走逐鹿，","空无所得。"],["走入险境心不安，","忽东忽西意慌乱。","步行追鹿难如愿，","一无所得空喜欢。"]],[["望尚阿衡，","太宰周公。","藩屏汤武，","立为侯王。"],["姜尚吕望和阿衡，","宰相姬旦称周公。","辅佐商周成大业，","封为诸侯建功勋。"]],[["白龙黑虎，","起伏俱怒。","战于阪泉，","蚩尤败走，","死于鱼首。"],["白龙黑虎相争斗，","起伏不定怒声吼。","黄帝征战于阪泉，","蚩尤失败急逃走，","最终命丧于鱼首。"]],[["载石上山，","步跌不前。","眉之忧，","不得所欢，","长思忧叹。"],["扛着石头上高山，","摔倒不能再向前。","皱起眉头生忧愁，","步履艰难心不欢，","长久忧思空悲叹。"]],[["周德既成，","行轴不倾。","申酉昳暮，","耋老衰去，","箴石不佑。"],["周朝德业已形成，","行车之轴不覆倾。","申酉时辰日西斜，","八旬老人寿已终，","石针也难救其命。"]],[["乘云带雨，","与飞鸟俱。","动举千里，","见我慈母。"],["乘着云气带着雨，","插翅与鸟俱飞起。","一举越过千里外，","投入慈母怀抱里。"]],[["赍贝赎狸，","不听我辞。","系于虎须，","牵不得来。"],["带着金钱去赎狸，","朋友不听我劝阻。","将狐系于虎须上，","牵之不来白受苦。"]],[["橐置山巅，","销锋铸刀。","示不复用，","天下大欢。"],["武器收藏置山巅，","销毁钢刀和宝剑。","以之示人不再用，","天下百姓皆大欢。"]],[["三翼飞来，","是我逢时。","俱行先至，","多得大利。"],["三只鸟儿同飞起，","使我碰到好时机。","一路同行先到达，","多得大福获大利。"]],[["两足四翼，","飞入我国。","宁我伯姊，","与母相得。"],["两足添上四翅膀，","快快飞回我国邦。","平息兄姐之争讼，","一同欢聚母身旁。"]],[["按民呼池，","玉杖文案。","鱼如白云，","一国获愿。"],["呼沱河畔访民间，","父老长辈礼在先。","水中鱼儿如白云，","举国上下皆获愿。"]],[["季姬踟蹰，","望我城隅。","终日至暮，","不见齐侯。"],["齐国少妇独徘徊，","城角眺望久等待。","从早一直到天黑，","不见哥哥襄公来。"]],[["龙渴求饮，","黑云影从。","河伯捧觞，","跪进酒浆，","流潦滂滂。"],["神龙口渴求水饮，","黑云如影相随从。","河神手捧美酒杯，","跪拜行进把酒敬，","大雨滂沱水汹涌。"]],[["出门逢患，","与怒为怨。","更相击刺，","伤我手端。"],["出门途中逢祸患，","双方发怒成仇怨。","拔刀击剑相格斗，","不幸伤了我手端。"]],[["播天舞，","光地乳。","神所守，","乐无咎。"],["传布天之舞，","恩赐至地乳。","神仙所守卫，","安乐长相处。"]],[["两金相击，","勇气均敌。","终日大战，","不破不缺。"],["两支兵器相搏击，","势均力敌勇相匹。","终日大战无休止，","兵器完好无破敝。"]],[["车虽驾，","两靷绝。","马奔出，","双轮脱。","行不至，","道遇害。"],["驾车想要出门行，","不料却又断引绳。","马儿刚刚迈开步，","车子突然脱双轮。","没有到达目的地，","中途碰到祸与凶。"]],[["文山紫芝，","雍梁朱草。","长生和气，","王以为宝。","公尸侑食，","福禄来处。"],["文山之上紫芝好，","雍梁出产赤心草。","瑞草生长很茂盛，","君王将其视为宝。","采来瑞草作祭品，","幸福利禄都来到。"]],[["把珠入口，","为我畜宝。","得吾所有，","欣然嘉喜。"],["手执宝珠放入口，","安全储存不会丢。","得到我所欲求物，","兴高采烈乐悠悠。"]],[["负牛上山，","力尽行难。","烈风雨雪，","遮遏我前。","中道复还，","忧者得欢。"],["牛拉重车爬高山，","精疲力竭行路难。","寒风冽冽大雪降，","老天阻拦难向前。","中途反回自家室，","忧虑之心又得欢。"]],[["陶朱白圭，","善贾息资。","三致千金，","德施上人。"],["商人陶朱和白圭，","善于经营利过倍。","三次投资获千金，","行善积德好品性。"]],[["子鉏执麟，","春秋作经。","元圣将终，","尼父悲心。"],["子鉏打猎获麒麟，","孔子写作春秋经。","元圣即将离人世，","尼父悲哀伤透心。"]],[["春日载阳，","福履齐长。","四时不忒，","与乐为昌！"],["春天啊多么明朗，","幸福啊路儿长长。","看四季有序不紊，","长安乐兴盛荣昌！"]],[["孔德如玉，","出于幽谷。","飞上乔木，","鼓其羽翼，","辉光照国。"],["大德君子如玉鸟，","出于深谷飞升高。","飞来落到高树上，","鼓动羽毛展翅膀，","举国上下临辉光。"]],[["区脱康居，","慕仁入朝。","湛露之欢，","三爵毕恩。","复归穹庐，","以安其居。"],["土堡哨所康居民，","仰慕仁义入朝廷。","晨露浓浓心中欢，","三杯御酒谢皇恩。","重新回到茅草屋，","长住故居享安宁。"]],[["秋冬夜行，","遍览星辰。","道理利通，","终生无患。"],["秋冬之夜出门行，","遍览长空众星辰。","道理顺达很畅通，","终身无祸亦无凶。"]],[["鸣鹄抱子，","见蛇何咎。","室家俱在，","不失其所。"],["天鹅鸣叫抱幼鹅，","逢蛇不会招灾祸。","家室平安人健在，","不会失去其居所。"]],[["安如泰山，","福寿屡臻。","虽有豺虎，","不能危身。"],["犹如泰山久安稳，","福寿频频入我门。","虽有豺狼和恶虎，","不会危及我的身。"]],[["耆蒙睡眠，","不知东西。","岁君失理，","命直为曲。","王称为宝。"],["老少酣睡昏沉沉，","不辨南北与西东。","岁君在上失正理，","令黑为白淆视听。","王称为宝实昏庸。"]],[["植璧秉珪，","请命于河。","周公克敏，","冲人瘳愈。"],["手执元圭和玉璧，","请求河神把恩赐。","周公愿替成王死，","年轻人儿病痊愈。"]],[["太王执政，","岁熟民富。","国家丰有，","王者有喜。"],["太王垂衣执朝政，","五谷丰登好年景。","国家资财多丰厚，","君王将有大喜讯。"]],[["争讼相背，","和气不处。","阴阳俱否，","谷风无子。"],["两心相背起争讼，","难能相处不同心。","阴阳二气不协调，","为夫所弃子难生。"]],[["齐鲁争言，","战于龙门。","构怨结祸，","三世不安。"],["齐鲁两国起衅端，","龙门之地相激战。","结下深仇和大怨，","后世三代不得安。"]],[["鹿得美草，","鸣呼其友。","九族和睦，","不离邦域。"],["鹿儿寻得鲜美草，","呦呦鸣呼把友叫。","群体上下多和睦，","我邦我域离不了。"]],[["百里南行，","虽微复明。","去虞适秦，","为穆国卿。"],["虞人百里往南行，","虽然衰微又彰明。","离开虞国去秦国，","穆公任他为国卿。"]],[["梅李冬实，","国多寇贼。","乱扰并作，","王不能制。"],["梅李冬天结果实，","国家多寇多灾异。","四处动乱不安定，","君王无法去制止。"]],[["府藏之富，","王以赈贷。","捕鱼河海，","笱网多得。"],["府库储藏很丰富，","君王救济多借出。","河海之中去捕鱼，","撒下渔网多获取。"]],[["牡飞门启，","忧患大解。","修福行善，","不为身祸。"],["锁闩落地门开启，","祸患解除忧离去。","修福行善多积德，","自身不会受灾异。"]],[["宜昌娶妇，","东家歌舞，","长乐欢喜。"],["宜昌之地娶媳妇，","东家载歌又载舞，","长享欢乐和幸福。"]],[["正阳之央，","甲氏以亡。","祸及留吁，","烟灭为墟。"],["正月之中为正阳，","赤狄甲氏被灭亡。","灾祸殃及到留吁，","国破为墟甚荒凉。"]],[["凫过稻庐，","甘乐鳅。","虽驱不走，","田畯怀忧。"],["野鸭飞进田里头，","残食大麦和泥鳅。","纵使驱赶不离去，","农官心中怀忧愁。"]],[["跛踦俱行，","日暮车伤，","失旅乏粮。"],["两个瘸子同出行，","天黑车坏走不成，","失去伴侣食难寻。"]],[["龙门水穴，","流行不害。","民安其土，","君臣相保。"],["凿开龙门水路通，","奔流直下祸不生。","民众安止于本土，","君上臣下都安宁。"]],[["山陵四塞，","遏我径路。","欲前不得，","复还故处。"],["高山丘陵阻挡路，","使我不得有通途。","想要前进不能成，","返回原来旧住处。"]],[["两虎争斗，","血流漂杵。","城郭空虚，","蒿藜塞道。"],["两只恶虎相争斗，","血流成河漂木杵。","城郭空虚无人烟，","荒草丛生塞道路。"]],[["依东墙隅，","志下心劳。","楚亭晨食，","韩子低头。"],["饥饿贫困依墙隅，","意志薄弱心劳愁。","楚亭早饭难享用，","韩信低头向北走。"]],[["龙生无常，","或託空桑。","凭乘风云，","为尧立功。"],["神龙生活不正常，","时而暂居于空桑。","乘着风儿驾着云，","为那唐尧立功勋。"]],[["魁星摇尾，","逐云吹水。","污泥为陆，","下田为稷。"],["魁星运行摇杓尾，","驱散雾云驱走水。","污泥之地变平陆，","涝洼田里生良穗。"]],[["跛踦相随，","日暮牛罢。","陵迟后旅，","失利亡雌。"],["跛牛瘸夫同向前，","天黑牛儿也疲倦。","旅途累倒在野外，","伴侣出走利逃窜。"]],[["三人俱行，","北求大牂。","长孟病足，","倩季负粮。","柳下之宝，","不失国邦。"],["兄弟三人同北上，","前去寻找大母羊。","孟皮脚踝受了伤，","请求季路来扛粮。","柳下维护其宝鼎，","安然不失我国邦。"]],[["凤凰在左，","麒麟处右。","仁圣相遇，","伊吕集聚。","伤害不至，","时无殃咎，","福为我母。"],["凤凰降至我左侧，","麒麟处在身右翼。","仁智圣贤喜相遇，","伊尹吕望聚一起。","危害不会伤我身，","时逢好运无忧虑，","福如慈母自临至。"]],[["乘筏渡海，","虽深不殆。","曾孙皇祖，","累累俱在。"],["乘着木筏去渡海，","水深流急却无灾。","重孙祖爷都健在，","济济一堂真欢快。"]],[["比目四翼，","来安吾国。","齐福上堂，","与我同床。"],["比目鱼儿比翼鸟，","一同来安我国邦。","幸福利禄齐上堂，","与我一齐登龙床。"]],[["娶于姜女，","驾迎新妇。","少齐在门，","夫子悦喜。"],["驾车出门迎新娘，","她是姜家小姑娘。","新娘来到家门口，","新郎心中喜洋洋。"]],[["螟虫为贼，","害我稼穑。","尽禾殚麦，","秋无所得。"],["螟虫为贼把麦伤，","庄稼被它残食光。","禾苗全都被吃尽，","秋后收成无希望。"]],[["衣裳颠倒，","为王来呼。","成就东周，","邦国大休。"],["夜半衣裤穿颠倒，","君王有事急征召。","抵御犬戎来入侵，","东周大业告成功。"]],[["王孙季子，","相与为友。","明允笃诚，","升擢荐举。"],["朝中公子和王孙，","相互交友结亲朋。","贤明公允又忠诚，","荐举提拔得重用。"]],[["涌泉滑滑，","流行不绝。","汙为江海，","败毁邑里，","家无所处。","闻虎不惧，","向我笑喜。"],["平地泉水喷又涌，","不息不绝长流行。","泛滥汇成江和海，","冲毁城市和乡村，","家人无处能安身。","听见虎声不畏惧，","向我哑哑笑出声。"]],[["桑扈窃脂，","啄粟不宜；","乱政无常，","使心孔明。"],["桑扈鸟儿名窃脂，","不该来啄我小米；","暴虐之政失纲常，","使我明白此道理。"]]],[[["南山太行，","困于空桑。","老沙为石，","牛马无粮。"],["攀登南山上太行，","不幸受困于空桑。","老沙结成硬石头，","牛马缺水又断粮。"]],[["播木折枝，","与母别离，","绝不相知。"],["播种之木为折枝，","它与母树相别离，","音信断绝不相知。"]],[["噂噂所言，","莫如我垣。","欢乐坚固，","可以长安。"],["你言我语乱纷纷，","没人能如我坚定。","防守牢固人欢乐，","可以长治久安宁。"]],[["雹老零坠，","心思愤愤。","怀忧少愧，","乱我魂气。"],["雹打梅花皆凋零，","愁思烦闷不清醒。","忧心忡忡甚羞愧，","搅乱我的魄与魂。"]],[["火虽炽，","在吾后。","寇虽多，","在吾右。","身安吉，","不危殆。"],["火势纵然很凶猛，","但它却在我身后。","强盗贼寇固然多，","然而都在我之右。","我身平安又吉利，","危害灾难不临头。"]],[["虎卧山隅，","鹿过后朐。","弓矢设张，","猥为功曹。","伏不敢起，","遂全其躯，","得我美草。"],["老虎卧在山角落，","待鹿为食而捕捉。","张开穹弓搭上箭，","刺猬来把功曹做。","老虎伏地不敢起，","得以保全其躯体，","鹿得美草乐滋滋。"]],[["三火起明，","雨灭其光。","高位疾颠，","骄恣诛伤。"],["三火燃烧放光芒，","大雨倾盆灭其光。","身居高位跌下来，","骄傲放纵受诛伤。"]],[["疋居楚鸟，","遇谗无辜，","久旅离忧。"],["黄鸟相配结为伴，","无辜受害遇谗言，","出门远行离忧患。"]],[["一室百子，","同公异母。","以义防患，","祸灾不起。"],["一家生有百个子，","父亲相同母亲异。","礼义为重来防患，","灾难祸患不会起。"]],[["商人行旅，","资无所有。","贪贝利珠，","流连王市。","还家内顾，","公子何咎。"],["商人出门做营生，","经商手头无资金。","贪图金钱与珠宝，","整日流连王市中。","外做生意内顾家，","小伙逍遥又开心。"]],[["禹将为君，","北入昆仑。","稍进阳光，","登入温汤。","代舜为治，","功德昭明。"],["大禹将被任为君，","向北登山入昆仑。","前行接近太阳光，","登高步入温泉中。","代替虞舜治天下，","功德昭著很圣明。"]],[["乾行天德，","履帱无及。","呕呼烹熟，","使各有得。"],["上天布施恩与德，","覆盖疆土和山河。","饮食全都准备好，","使我君子皆有得。"]],[["南国盛茂，","黍稷醴酒。","可以享老，","乐我嘉友。"],["南方温暖草木盛，","糜谷美酒已酿成。","老人饮之增福寿，","用来款待我亲朋。"]],[["白虎张牙，","征伐东莱。","朱雀前驱，","赞道说辞。","敌人请服，","衔璧而趋。"],["白虎张牙怒声起，","前往东方伐莱子。","朱雀在前把路指，","先来赞颂陈美辞。","敌人请求要降服，","口衔璧玉向北去。"]],[["方船备水，","傍河然火，","终身无祸。"],["两船相并备好水，","燃火去那河岸边，","终身无祸无灾患。"]],[["雷行相逐，","无有休息。","战于平陆，","为夷所覆。"],["雷车滚滚相追逐，","没有片刻能歇步。","两军交战于平陆，","终被东夷所败覆。"]],[["踯躅踟蹰，","拊心搔头。","五昼四夜，","睹我齐侯。"],["犹豫不决独徘徊，","捶胸搔头急等待。","过了五天又四夜，","终于盼到齐侯来。"]],[["大口宣唇，","神使伸言。","黄龙景星，","出应德门。","与福上堂，","天下安昌。"],["张口鼓舌似弹簧，","神仙派他道吉祥。","黄色巨龙与瑞星，","将应仁德见东方。","我与幸福聚一堂，","天下百姓都安昌。"]],[["阴衰老极，","阳建其德。","履阳戴光，","天下昭明。"],["阴气微弱渐衰亡，","阳建功德呈盛强。","踩着火苗带着光，","普照天下都明亮。"]],[["三涂五岳，","阳城太室。","神明所伏，","独无兵革。"],["巍巍三涂五岳山，","阳城太室入云间。","神明贤人会集地，","没有战事来作难。"]],[["年丰岁熟，","政仁民乐。","利以居止，","旅人获福。"],["五谷丰登好收成，","广施仁政民欢欣。","适宜在家长居住，","出门旅行获福运。"]],[["楚鸟逢矢，","不可久放。","离居无群，","意味精丧。","作此哀诗，","以告孔忧。"],["黄鸟遇到利箭伤，","不能远走高飞翔。","离群独居无伴侣，","意志消沉精气丧。","作此一首悲哀诗，","倾诉我的大忧伤。"]],[["出门大步，","与凶恶忤。","骂公詈母，","为我忧耻。"],["大步流星跨出门，","与那凶手相抗衡。","责骂父亲和母亲，","使我羞耻生悲愤。"]],[["火至井谷，","阳芒生角。","犯历天市，","窥观太微。","登上玉床，","家易六公。"],["火星行至井宿中，","辉光洒满角宿身。","侵犯行入天市旁，","暗中察看太微星。","随即登上玉制床，","家里变更换主人。"]],[["牧羊逢狼，","虽忧不伤。","畏怖惕息，","终无祸殃。"],["放牧羊儿遇见狼，","虽有忧心却未伤。","畏惧恐怖而警惕，","终于没有招祸殃。"]],[["茧栗牺牲，","敬事鬼神。","神嗜饮食，","受福多孙；","望季不来，","孔圣厄陈。"],["牛犊做的祭祀品，","用来侍奉鬼和神。","神灵爱好吃与喝，","赐福多子又多孙；","盼望弟子不见来，","圣人孔丘困于陈。"]],[["大泽治妆，","南归牧羊。","长伯为我，","多得牛马。","利于徙居。"],["双泽之地办行装，","返回南边来牧羊。","大哥尽力辅助我，","牛马成群肥又壮。","大吉大利迁新房。"]],[["枯树无枝，","与子分离。","饥寒莫养，","独立哀悲。"],["树木干枯没有枝，","母亲儿子远分离。","饥寒交迫无人养，","独自生活空悲泣。"]],[["天地九重，","尧舜履中。","正冠垂裳，","宇宙平康。"],["乾天坤地有九重，","唐尧虞舜居正中。","衣冠楚楚治天下，","世界平安永康宁。"]],[["凫鹥游泾，","君子以宁。","履德不衍，","福禄来成。"],["野鸭鸥鸟游泾河，","好人从容享安乐。","履行仁德不延误，","福禄一起来伴我。"]],[["裸裎逐狐，","为人观笑。","牝鸡雄晨，","主作乱根。"],["赤身裸体追狐狸，","被人讥笑无羞耻。","母鸡称雄报时辰，","征兆反常是祸根。"]],[["典册法书，","藏在兰台。","虽遭乱溃。","独不遇灾。"],["经典宝籍和法书，","存在宫廷藏书处。","纵使遭逢其动乱，","灾祸独独不得入。"]],[["三痴且狂，","欲之平乡。","迷惑失道，","不知昏明。"],["三个呆子都发狂，","欲想到达太平乡。","糊里糊涂迷了路，","不辨白天和晚上。"]],[["瘿瘤疡疥，","为身疮害。","疾病癃疴，","常不危殆。"],["脖子生瘤肤生疮，","浑身上下是病伤。","年老体弱多疾病，","常保平安无危亡。"]],[["三豕俱走，","斗于谷口。","白豕不胜，","死于坂下。"],["三猪一同向前走，","途中斗殴山谷口。","白猪未能获胜利，","死于北面山坡头。"]],[["赖主之光，","受德之佑。","虽遭颠沛，","独不凶咎。"],["承蒙主人来光临，","接受恩德保我身。","虽遭颠沛流离苦，","我独没有遇祸凶。"]],[["上义崇德，","以建大福。","明哲且聪，","周武立功。"],["崇尚仁义和道德，","以其建立大福泽。","聪明圣哲又贤达，","武王兴周立功业。"]],[["四乱不安，","东西为患。","身止无功，","不出国城。","乃得全完，","赖其生福。"],["四方动乱不安宁，","东西皆有祸与凶。","深居家中勿贪功，","不得轻易出城门。","我身赖此得保全，","得以幸福和长生。"]],[["金牙铁齿，","西王母子。","无有患殆，","涉道大利。"],["满口金牙和铁齿，","神仙王母之爱子。","没有祸患与灾难，","远路跋涉道吉利。"]],[["贺喜以福，","日利蕃息，","欢乐有得。"],["庆贺喜事随福来，","日子吉利繁育快，","乐得利福笑开怀。"]],[["昊天白日，","照临我国。","万民康宁，","咸赖嘉福。"],["晴空万里红太阳，","普照我国大地上。","亿万人民都康宁，","全靠上帝赐福祥。"]],[["左眇右盲，","视暗不明。","下民多孽，","君失其常。"],["左右两眼都成盲，","视力昏暗不明亮。","贫苦百姓多灾孽，","君主统治失常纲。"]],[["吾家黍梁，","季积道傍。","有囊服箱，","运到我乡，","藏于嘉仓。"],["我家糜子和高粱，","收割堆积在道旁。","驾起马车装上箱，","把它运回我家乡，","装入仓库得储藏。"]],[["殊类异路，","心不相慕。","牝豕无猳，","鳏无室家。"],["不是同类不同路，","两心相互不仰慕。","母猪离开其公猪，","没有家室独自处。"]],[["雀行求食，","出门见鹞。","颠蹶上下，","几无所处。"],["鸟儿外出把食寻，","飞行途中逢鹞鹰。","上下跌摔乱飞逃，","几乎无处能藏身。"]],[["野有积庾，","穑人驾取。","不逢狼虎，","暮归其宇。"],["田野之中有谷仓，","农夫驾车搬运忙。","没有碰到虎与狼，","天黑回到其住房。"]],[["肤敏之德，","发愤晨食。","虏豹禽说，","为王求福。"],["言行机敏好品德，","发愤忘食为家国。","破魏虏豹擒夏说，","为王求福兴邦业。"]],[["光祀春成，","陈宝鸡鸣。","阳明失道，","不能自守，","消亡为咎。"],["宝物放光如春临，","陈仓深夜雄鸡鸣。","阳明失去其常道，","不能自守其本性，","消亡之错在自身。"]],[["左抱金玉，","右得熊足。","常盈不亡，","获心所欲。"],["左手抱着金和玉，","右手拿着熊之掌。","常年盈余不亏损，","心中所想如愿偿。"]],[["履泥污足，","名困身辱。","两仇相得，","身为痛虐。"],["踏入烂泥污我脚，","名身受困遭污蔑。","仇人相斗不调和，","身受疾苦和折磨。"]],[["安居重迁，","不去其廛。","禾米相闻，","乐得常产。"],["安于故居不搬迁，","不愿离开自家院。","新米香味常闻到，","快乐常得好物产。"]],[["天灾所游，","凶不可居。","转徙获福，","留止忧危。"],["天灾游荡降祸处，","凶事多多不能住。","留居会有危与忧，","搬迁能够得福禄。"]],[["昧昧墨墨，","不知白黑。","景云乱扰，","光明隐伏。","犬戎来攻，","幽王失国。"],["昏沉阴暗如墨色，","青红皂白难分别。","祥云遭到风搅扰，","太阳光明被盖遮。","犬戎之敌来入侵，","周朝幽王失掉国。"]],[["凫雁哑哑，","以水为宅。","雌雄相知，","心志娱乐，","得其所欲。"],["野鸭大雁叫哑哑，","以水作为自己家。","雌雄相随多和睦，","心志常悦乐哈哈，","所想都能得到它。"]],[["长生无极，","子孙千亿。","柏柱载梁，","坚固不倾。"],["长生不老无极止，","子子孙孙逾千亿。","柏木柱子载大梁，","千年牢固不倾僵。"]],[["麒麟凤凰，","善政得祥。","阴阳和调，","国无灾殃。"],["麒麟凤凰呈吉祥，","政通人民得安康。","阴阳二气多和顺，","国家没有灾和殃。"]],[["天之奥隅，","尧舜所居。","可以存身，","保我室家。"],["天之西南角落里，","乃是尧舜居住地。","可以安居养身体，","能够保全我家室。"]],[["配合相迎。","利之四邻。","昏以为期，","与福笑喜。"],["男娶女嫁喜相迎，","利及四周远近邻。","婚姻如此得举行，","望着幸福笑盈盈。"]],[["砥德砺材，","果当成周。","拜受大命，","封为齐侯。"],["吕望磨炼其才德，","成就周朝大事业。","拜受君主之大命，","封为诸侯治齐国。"]],[["与福俱坐，","蓄水备火。","思患豫防，","终无殃祸。"],["我与幸福并排坐，","积存河水防备火。","居安思危早预防，","最终无殃无灾祸。"]],[["晨昏潜处，","候时煦煦。","卒逢白日，","为世荣主。"],["从早到晚不出门，","等待和暖好时辰。","终于盼到大晴天，","世人面前显尊荣。"]],[["视日再光，","与天相望。","长生欢悦，","以福为多。"],["看那太阳重放光，","君与皇天遥相望。","欢悦之事常临至，","福如江水长流淌。"]],[["大头明目，","载受嘉福。","三雀飞来，","与禄相触。"],["额宽头大眼睛亮，","长得一脸好福相。","三只鸟雀俱飞来，","幸福利禄齐上堂。"]],[["楩生荆山，","命属输班。","袍衣剥脱，","夏日冬寒。","立成枯槁，","众人莫怜。"],["楩木生长在荆山，","命运操于公输班。","去掉枝叶剥掉皮，","忍受夏热和冬寒。","即刻变成为枯株，","众人不要去可怜。"]]],[[["喋嗫噱嚾，","昧冥相搏。","多言少实，","语无成事。"],["私语夹杂喧嚣声，","暗中相互而斗争。","空话连篇难兑现，","只说不做事不成。"]],[["北辰紫宫，","衣冠立中。","含和建德，","常受大福。"],["北辰星座紫微宫，","上皇大帝居其中。","品德高尚多和顺，","长久享受大福庆。"]],[["东壁余光，","数暗不明。","主母嫉妒，","乱我事业。"],["东壁二星透余光，","屡屡昏暗不明亮。","主母怀有嫉妒心，","使我事业乱了章。"]],[["苍龙单独，","与石相触。","摧折两角。"],["青色巨龙独来往，","竟与大石相碰撞，","两只龙角遭折伤。"]],[["凤生会稽，","稍巨能飞。","翱翔桂林，","为众鸟雄。"],["凤凰出生于会稽，","长大便能高飞起。","桂林上空自翱翔，","成为百鸟当中王。"]],[["凿井求玉，","非和氏宝。","名困身辱，","劳无所得。"],["凿地打井求宝玉，","所得并非和氏璧。","名声受困身受辱，","没有所获枉劳苦。"]],[["邦杰载殳，","道至东莱。","百僚俱举，","君王嘉喜。"],["国中俊杰持殳杖，","行至东边莱子邦。","文武百官得重用，","君王心里很欢畅。"]],[["安息康居，","异国穹庐。","非吾邦域，","使伯忧戚。"],["安息和那康居人，","住在圆顶毡帐篷。","不是我们同族人，","使我大哥生忧心。"]],[["江河淮海，","天之都市。","商人受福，","国家富有。"],["长江黄河淮海地，","乃是天赐大都市。","商人在此获厚利，","国家人民都富裕。"]],[["同本异叶，","乐仁尚德。","东邻慕义，","来兴吾国。"],["树木同根不同叶，","崇尚仁义和道德。","东方友邻慕礼义，","主动前来兴我国。"]],[["白鹤衔珠，","夜室为明。","怀我德音，","身受光荣。"],["白色仙鹤衔宝珠，","黑夜暗室放光明。","胸中自有美德在，","享得荣光和尊宠。"]],[["践履危难，","脱厄去患。","入福喜门，","见吾邦君。"],["大步走出危难境，","摆脱困厄免灾凶。","进入幸福欢乐门，","前来拜见我国君。"]],[["宫商既和，","声音相随。","骊驹在门，","主君以欢。"],["曲调和悦多优美，","声音相伴歌相随。","黑色马驹在门口，","主人脸上笑微微。"]],[["天地配享，","六位光明。","阴阳顺叙，","以成厥功。"],["天地二气相交通，","上下四方都光明。","阴阳平衡甚协调，","以使大功得告成。"]],[["王乔无病，","狗头不痛。","亡跛失履，","乏我徒从。"],["仙人子乔没有病，","狗的头儿也不痛。","迷路跛子丢了鞋，","途中苦了我随从。"]],[["江河淮海，","天之奥府。","众利所聚，","可以饶有，","乐我君子。"],["长江黄河淮海地，","乃是天赐大都市。","众多利益矛一起，","物产丰饶又富裕，","使我纵情乐无比。"]],[["双鸟俱飞，","欲归稻池。","经涉萑泽，","为矢所射，","伤和胸臆。"],["一对鸟儿齐飞翔，","欲归稻田和池塘。","中途经过芦苇地，","不幸被箭所击伤，","疼痛触及我胸膛。"]],[["伯仲叔季，","日暮寝寐。","裸卧失明，","丧我贝囊，","衔却道旁。"],["兄弟四人出了门，","夜晚露宿路途中。","赤身卧眠黑暗地，","钱囊被贼盗一空，","退却路边难行进。"]],[["受终文祖，","承衰复起。","以义自闲，","虽苦无咎。"],["受禅太祖宗庙中，","国运衰败又复兴。","以义规范言和行，","虽苦不会有祸凶。"]],[["据斗运枢，","顺天无忧，","与乐并居。"],["斗柄围绕天枢行，","顺从天道无忧凶，","与欢与乐共相存。"]],[["同师伐纣，","战于牧野。","甲子平旦，","天下悦喜。"],["武王率兵伐暴纣，","开赴牧野去战斗。","甲子清晨获胜利，","天下百姓乐悠悠。"]],[["十雌百雏，","常于母俱。","抱鸡搏虎，","谁敢害诸？"],["十只母鸡百只雏，","常与母亲同出游。","抱鸡与虎去搏斗，","谁敢伤害我朋友？"]],[["桀跖并处，","人民愁苦。","拥兵荷粮，","战于齐鲁。"],["暴桀盗跖并相处，","百姓受穷又受苦。","扛着兵器挑着粮，","开赴齐鲁去打仗。"]],[["南山昊天，","刺政闵身。","疾悲无辜，","背憎为仇。"],["南山高峻天不公，","讥讽朝政怜自身。","悲哀同情无辜者，","反目相憎成仇人。"]],[["百川朝海，","流行不止。","道虽辽远，","无不到者。"],["百川朝那大海流，","汹涌澎湃永不休。","道路虽然很遥远，","顺利到达无危难。"]],[["目不可合，","忧来摇足。","悚惕危惧，","去其邦域。"],["忧来摇晃我的脚，","眼难休闲难闭合。","白天黑夜心惶惶，","速即迁离其家国。"]],[["鸟升鹊举，","照临东海。","尨降庭坚，","为陶叔后。","封于英六，","履禄绥厚。"],["鸟鹊高飞升起来，","一路顺风到东海。","尨降庭坚两兄弟，","同是陶叔的后代。","封于英地和六地，","安享福禄多资财。"]],[["北山多枣，","橘柚所聚。","荷囊载黍，","盈我筐筥。"],["北山之上多枣树，","橘树柚树长一处。","口袋满载味飘香，","装满篮子和大筐。"]],[["悬貆素餐，","食非其仁。","失望远民，","实劳我心。"],["不去打猎家有貆，","不去种田食有餐。","百姓失望疏远他，","自找苦头受熬煎。"]],[["羔羊皮革，","君子朝服。","辅政扶德，","以合万国。"],["羔羊皮儿多润泽，","官人朝服用它做。","辅佐朝政正民德，","各国往来多和合。"]],[["齐鲁争言，","战于龙门。","构怨致祸，","三世不安。"],["齐鲁两国起争讼，","双方酣战于龙门。","结下怨仇留祸根，","后世三代不安宁。"]],[["久阴霖雨，","涂行泥潦。","商人休止，","市无所有。"],["天气久阴雨不停，","道路泥泞难行进。","商人休止在家中，","市场空空无营生。"]],[["桃雀窃脂，","巢于小枝。","摇动不安，","为风所吹。","寒心慄慄，","常忧殆危。"],["桃雀和那窃脂鸟，","小树枝头筑起巢。","树枝摇晃不安静，","是那风儿太糟糕。","内心寒冷又畏惧，","经常担忧受困扰。"]],[["防患备灾，","凶祸不来，","虽困无灾。"],["时时防患备灾害，","凶事祸患不会来，","虽有困难没有灾。"]],[["引颈绝粮，","与母异门。","不见所欢，","孰与共言？"],["伸长脖子断绝食，","我与慈母相分居。","心爱之人不见来，","与谁同言和共语？"]],[["鳅虾去海，","藏于枯里。","街巷偏隘，","不得自在。","南北极远，","渴馁成疾。"],["泥鳅大虾离其居，","藏在干涸枯竭地。","街巷偏僻又狭隘，","不能自由来与去。","南北相距极遥远，","饥寒交加成病疾。"]],[["恭宽信敏，","功加四海。","辟去不详，","喜来从母。"],["恭敬信实又聪敏，","四海远扬其功名。","驱避灾祸迎吉祥，","喜来伴随我母亲。"]],[["岁饥无年，","虐政害民。","乾溪骊山，","秦楚结怨。"],["贫饥之年无收成，","政治暴虐害人民。","乾溪骊山两地间，","秦楚两国结仇怨。"]],[["右目无瞳，","偏视寡明。","十步之外，","不知何公。"],["右边眼睛无瞳仁，","因此偏视看不真。","十步以外来客人，","难以分清是何公。"]],[["蜩螗欢喜，","草木嘉茂。","百果蕃炽，","日益庶有。"],["蝉声叫得好欢欣，","草木长得多茂盛。","果实累累繁又密，","财富日益得添增。"]],[["常德自如，","安坐无尤。","幸入贵乡，","到老安荣。"],["常修德行如意君，","安详端坐事遂心。","庆幸来到富贵地，","一生到老享安荣。"]],[["狡兔趯趯，","狼犬逐咋。","雌雄爰爰，","为鹰所获。"],["狡兔跳跃又蹦跑，","凶猛猎狗追上咬。","雌鸟雄雀玩又闹，","惨遭老鹰擒和叨。"]],[["春桃生花，","季女宜家。","受福多年，","男为邦君。"],["春天桃树开了花，","小女长大要出嫁。","从此享福许多年，","丈夫是位地方官。"]],[["山石朽弊，","消崩坠落；","上下离心，","君受其祟。"],["山石腐朽被风化，","坠落崩塌山谷下；","朝廷上下不团结，","君主必然遭灾祸。"]],[["水坏我里，","东流为海。","龟凫欢哗，","不睹我家。"],["大水冲坏我村庄，","向东汇流成海洋。","乌龟野鸭在喧嚣，","放眼难见我家乡。"]],[["七窍龙身，","造化八元。","法天则地，","顺时施恩，","富贵长存。"],["高辛氏七窍龙身，","造化出才子八人。","效法那天地规则，","顺时序行惠施恩，","富贵得永世长存。"]],[["四夷慕德，","来兴我国。","文君陟降，","同受福德。"],["四夷友邻慕仁德，","纷纷前来兴我国。","文王在上多安详，","子孙同享福与乐。"]],[["华首山头，","仙道所游。","利以君止，","长无咎忧。"],["华山首阳之山头，","神仙道士来遨游。","圣地利于君居住，","没有烦恼和忧愁。"]],[["鹯鸠徙巢，","西至平州。","遭逢雷雹，","损我苇芦。","家室饥寒，","思我故初。"],["鹯鸠鸟儿把家搬，","向西来到平州原。","遇上雷雨和冰雹，","芦苇鸟巢被掀翻。","全家忍受饥与寒，","思念我那旧家园。"]],[["狗无前足，","阴谋叛北，","为身害贼。"],["恶狗没有长前足，","阴谋背叛其君主，","自身遭灾受痛苦。"]],[["阳孤亢极，","多所恨惑。","车倾盖亡，","身常惊惶。","乃得其愿，","雌雄相从。"],["阳气孤独极亢盛，","多有迷惑与悔恨。","车子倾倒毁车篷，","乘车胆战又心惊。","终于实现其愿望，","夫妻双双紧相从。"]],[["空槽注器，","豚彘不至。","张弓祝鸡，","雄父飞去。"],["空槽敲击唤猪器，","大猪小猪不临至。","张弓拔箭去呼鸡，","公鸡匆匆飞离去。"]],[["长夜短日，","阴为阳贼。","万物空枯，","藏于北陆。"],["白天日短夜长长，","阴气必然残害阳。","万物枯朽难生长，","北陆之地藏日光。"]],[["爪牙之士，","怨毒祈父。","转忧与己，","伤不及母。"],["守卫王家的爪牙，","怨恨领兵的司马。","将我置于忧愁中，","思念慈母难见她。"]],[["拜跪请兔，","不得臭腐。","俯眉衔指，","低头北去。"],["跪着磕头要肉吃，","死兔腐肉难充饥。","皱起眉头衔着指，","低声无语朝北去。"]],[["有莘季女，","为夏妃后。","贵夫寿子，","母字四海。"],["有莘氏的小女儿，","成为夏王之后妃。","丈夫高贵子长寿，","母名四海显神威。"]],[["季姬踌躇，","待孟城隅。","终日至暮，","不见齐侯。"],["小妹犹豫独徘徊，","城角眺望久等待。","从早一直到天黑，","不见哥哥襄公来。"]],[["邯郸反言，","父兄生患。","涉叔忧恨，","卒死不还。"],["邯郸传来造反言，","父老兄弟受灾难。","陈胜吴广怀忧恨，","卒然阵亡不回还。"]],[["逐鹿山巅，","利去我西。","维邪南北，","利无不得。"],["追鹿追到山之巅，","利于去我身西边。","呼声传遍南与北，","所求之事皆兑现。"]],[["穿鼻系株，","为虎所拘。","王母祝福，","祸不成灾，","突然自来。"],["穿了鼻孔系于树，","君被恶人所拘捕。","王母为他来祝福，","灾祸终于被消除，","突然回到自家屋。"]],[["虎豹熊罴，","游戏山谷。","君子仁贤，","皆得所欲。"],["老虎豹子和熊罴，","群居游戏山谷里。","大人仁慈又贤明，","实现愿望很满意。"]],[["梅李冬实，","国多盗贼。","扰乱并作，","王不能制。"],["梅李冬天结果实，","国内盗贼四处起。","动乱接连不间断，","君王无力能制止。"]],[["望幸不到，","文章未就。","王子逐兔，","犬踦不得。"],["盼望幸福不来到，","道德文章未做好。","王子打猎去逐兔，","猎犬脚跛追不着。"]],[["千柱百梁，","终不倾僵。","仁智辅圣，","周宗宁康。"],["千根柱子百条梁，","建筑牢固不倾僵。","仁人智士辅圣人，","西周王朝永世昌。"]]],[[["罢马上山，","绝无水泉。","喉焦唇乾，","口不能言。"],["骑乘疲马上高山，","一路不见有水泉。","喉咙焦渴嘴唇干，","舌头难转口难言。"]],[["蔡侯朝楚，","留连江滨。","逾时历月，","思其后君。"],["蔡侯前去拜楚王，","留连江边独彷徨。","思念日后岁月里，","谁人继承我君王。"]],[["文厄羑里，","汤囚夏台。","仁圣不害，","数困何忧。","免于缧绁，","为世雄侯。"],["文王囚禁于羑里，","商汤关押在夏台。","圣人不会受伤害，","历经困苦没有灾。","终于摆脱其枷锁，","成为王侯民爱戴。"]],[["典册法书，","藏在兰台。","虽遭乱溃，","独不遇灾。"],["典册宝籍和法书，","存在宫廷藏书处。","纵然遭受大动乱，","灾祸独独不得入。"]],[["毡裘膻国，","文礼不饬。","跨马控弦，","伐我都邑。"],["毛制衣服带膻腥，","不懂礼貌欠文明。","骑着马儿张着弓，","前来侵犯我城镇。"]],[["星陨如雨，","力弱无辅。","强阴制阳，","不得安土。"],["陨石如雨齐坠落，","力弱无人来辅佐。","阴气强盛控制阳，","没有安身好地方。"]],[["蝗啮我稻，","驱不可走。","实穗无有，","但见空藁。"],["蝗虫残食我稻谷，","奋力驱赶不离去。","禾穗果实被吃尽，","只有藁草留田中。"]],[["虎饥欲食，","为蝟所伏。","禹导龙门，","避咎除患，","元丑以安。"],["老虎饥饿去寻食，","见到刺猬急伏地。","大禹治水凿龙门，","排除水患消灾异，","黎民因之得安逸。"]],[["蝙蝠夜藏，","不敢昼行。","酒为酸浆，","鲂臭鲍羹。"],["蝙蝠夜间藏起身，","白天不敢去行动。","美酒变成酸浆液，","鱼羹味儿臭烘烘。"]],[["精华坠落，","形体丑恶。","龃龉挫顿，","枯槁腐蠹。"],["花朵纷纷都坠落，","形体变得很丑恶。","枝条受损变腐朽，","任凭虫蛀鸟儿啄。"]],[["两足不获，","难以远行。","疾步不能，","后旅失时。"],["两脚受伤难行动，","不能出门去远行。","欲想快行却不能，","失去伙伴误时辰。"]],[["令妻寿母，","宜家无咎。","君子之欢，","得以长久。"],["妻子贤惠母长寿，","家中安宁无忧愁。","婆媳和睦老公乐，","有德之人福长久。"]],[["饥蚕作室，","缗多乱缠，","绪不可得。"],["饥饿之蚕来吐丝，","蚕丝零乱不能理，","难以找到其头绪。"]],[["子鉏执麟，","春秋作经。","元圣将终，","尼父悲心。"],["子鉏打猎获麒麟，","孔子写作春秋经。","元圣即将离人世，","尼父悲哀又伤心。"]],[["螟虫为贼，","害我稼穑。","禾殚麦尽，","秋无所得。"],["螟虫泛滥成灾祸，","前来伤害我稼禾。","稻秧麦苗残食尽，","到了秋后无收获。"]],[["冰将泮散，","鸣雁噰噰。","丁男长女，","可以会同，","生育圣人。"],["寒冰缓缓得消融，","大雁声声叫不停。","少男少女长成人，","双双可以得会同，","婚配生育圣贤人。"]],[["忧在腹内，","山崩为疾。","祸起萧墙，","竟制其国。"],["忧患藏在心腹中，","疾病到来如山崩。","祸从内部而引起，","危及国家和人民。"]],[["茹芝饵黄，","饮食玉瑛。","神与流通，","长无忧凶。"],["常吃灵芝与黄精，","美玉花朵做食用。","神仙与我常来往，","健康长寿无忧凶。"]],[["一夫两心，","歧刺不深。","所为无功，","求事不成。"],["一个男人两条心，","叉开之刺扎不深。","所作所为皆无功，","求谋事儿不得成。"]],[["十里望烟，","散涣四分。","形容灭亡，","终无见君。"],["十里之外望烟煴，","四处分散看不清。","形体容貌全毁灭，","最终未能见圣君。"]],[["张弓控弩，","经涉山道。","虽有伏虎，","谁敢害诸？"],["张开强弓扳开弩，","径直走过山中路。","虽然途中有伏虎，","岂敢把我来光顾？"]],[["泉闭泽竭，","主母饥渴。","君子困穷，","乃徐有说。"],["山泉湖泽水枯竭，","主母忍饥又挨渴。","好人身处穷困地，","终能逐渐得摆脱。"]],[["野鸢山鹊，","弈棋六博。","三枭四散，","主人胜客。"],["野外老鹰约山鹊，","一同弈棋玩六博。","三次获枭四得散，","主人反而胜过客。"]],[["羊惊马走，","上下挥扰。","鼓音不绝，","顷公奔败。"],["羊儿受惊马奔跑，","全军上下乱了套。","鼓声咚咚响不绝，","顷公慌忙向北逃。"]],[["黄帝神明，","八子圣聪。","俱受大福，","天下康平。"],["黄帝神圣又英明，","八个儿子都圣聪。","一同享受大福利，","天下永远得康平。"]],[["轻车醊祖，","猋风暴起。","泛乱祭器，","飞扬鼓舞。","明神降佑，","道无害寇。"],["出行之前祭路神，","不料突然起暴风。","吹坏我的祭祀器，","飞沙走石扬不停。","承蒙神灵来保佑，","一路平安无灾凶。"]],[["螣蛇乘龙，","宋郑饥凶，","民食草蓬。"],["螣蛇在上压青龙，","宋郑两国有饥凶，","黎民百姓食草蓬。"]],[["扬水潜凿，","使石洁白。","裹素表朱，","游戏皋沃。","得君所欲，","心志娱乐。"],["河水悠悠暗流行，","使得白石多鲜明。","身穿白衫红外套，","游览来到曲沃城。","贤士愿望得实现，","心中欢乐多高兴。"]],[["西过虎庐，","惊我前驱，","虽忧不危。"],["向西走过老虎洞，","惊了我的前行人，","虽然有忧未逢凶。"]],[["衣成无袖，","不知所穿。","客指东西，","未得便安。"],["衣服做成无衣袖，","欲穿不得无袖口。","客人问路指东西，","使他不能解疑虑。"]],[["晨风文翰，","随时就温。","雄雌相和，","不忧殆危。"],["鹯鸟皋鸣鼓其翼，","高飞去寻温暖地。","雄雌双双相呼应，","无忧无虑很顺利。"]],[["心多恨悔，","出言为怪。","枭鸣室北，","声丑可恶。","请谒不得。"],["内心装满悔与恨，","说话怪语怪声音。","鸱鸺鸣叫于室北，","使人听了生恶心。","请求见面未能成。"]],[["离女去夫，","闵思苦忧。","齐子无良，","使我心愁。"],["离开女儿和丈夫，","心中忧愁又悲苦。","齐子淫乱无良心，","使我心中生愤怒。"]],[["过时不归，","雌雄苦悲。","徘徊外国，","与叔分离。"],["过了时辰未返回，","男女双方都苦悲。","哥嫂徘徊在国外，","与弟分离难相会。"]],[["鹊巢柳树，","鸠夺其处。","任力薄德，","天命不佑。"],["喜鹊筑巢柳枝头，","却被秃鸠所占有。","暴力强占真缺德，","老天不会去保佑。"]],[["鹤盗我珠，","逃於东都。","鹄怒追求，","郭氏之墟。","不见踪迹，","使我心忧。"],["野鹤盗走我宝珠，","逃之夭夭至东都。","天鹅愤怒去追逐，","径直追到郭氏墟，","最终未见其踪迹，","使我心中生忧虑。"]],[["夫妇相背，","和气弗处。","阴阳俱否，","庄姜无子。"],["夫妻志趣各不同，","和气相处不能成。","阴阳二气不调顺，","贤妻庄姜子难生。"]],[["日走月步，","趣不同舍。","夫妻反目，","主君失居。"],["太阳月亮独自行，","各归其舍路不同。","夫妻二人反目争，","男子失掉其家庭。"]],[["洛阳嫁女，","善逐人走。","三寡失夫，","妇妒无子。"],["洛阳女子嫁给人，","不守本分善私奔。","三次失夫独守寡，","妒恨之妇子难生。"]],[["周德既成，","杼轴不倾。","太宰东西，","夏国康宁。"],["周朝德业已形成，","权位牢固不覆倾。","宰相统管四方民，","全国强盛又康宁。"]],[["日中为市，","交易资宝。","各利所有，","心悦以喜。"],["正午市场甚繁荣，","资货交易换物品。","各取所需获大利，","内心喜悦多高兴。"]],[["童妾独宿，","长女未室，","利无所得。"],["小妾独宿受煎熬，","姑娘貌丑没人要，","婚嫁好处未得到。"]],[["忠言辅成，","王政不倾。","公刘兆基，","文武绥之。"],["周公忠言辅成王，","王室政权不倒倾。","祖先公刘打基础，","文王武王事业兴。"]],[["牛骥同槽，","郭氏以亡。","国破为墟，","主君奔逃。"],["牛马同槽相争强，","郭氏因之遭败亡。","国破变成为废墟，","君主奔逃去他乡。"]],[["中原有菽，","以待饔食。","饮御诸友，","所求大得。"],["中原地区产豆子，","用它可以做熟食。","鲜豆美酒待好友，","所求必得不用愁。"]],[["多虚少实，","语不可知。","尊空无酒，","飞言如雨。"],["所言华丽不真实，","语句纷乱不可知。","杯中空空没有酒，","流言如雨而临至。"]],[["青蝇集蕃，","君子信谗。","害贤伤忠，","患生妇人。"],["苍蝇聚集篱笆垣，","好人轻易信谗言。","贤良忠臣受伤害，","祸从妇人口中来。"]],[["履株覆舆，","马惊伤车，","步为我忧。"],["脚受木绊轿子翻，","马儿受惊车伤残，","心惊胆战难走远。"]],[["商风召寇，","来呼外盗。","间谍内应，","与我争斗。","殚已宝藏，","主人不胜。"],["西风呼啸招贼寇，","唤来强盗和小偷。","内部间谍从中应，","前来与我相争斗。","宝藏全部被抢走，","主人失利心怀忧。"]],[["逸豫好游，","不安其家。","惑於少姬，","久迷不来。"],["贪图安逸爱游玩，","独居家中心不安。","君被少妇所迷惑，","长期在外不回还。"]],[["吾有骅骝，","畜之以时。","东家翁孺，","来请我驹。","价极可与，","后无贱悔。"],["我有一匹千里马，","随时按节伺养它。","东边邻居父子俩，","前来请求卖给他。","价钱看涨即可卖，","没有悔恨获利大。"]],[["厄穷上通，","与尧相逢。","登升大麓，","国无凶人。"],["困厄贫穷到极点，","幸遇圣人尧恩典。","荐举提拔为大臣，","国家平安无恶人。"]],[["众兔俱走，","熊罴在后。","踦不能进，","失信寡处。"],["一群兔子全跑散，","熊罴在后紧追赶。","瘸腿跛脚行走慢，","落伍独处甚孤单。"]],[["旁行不远，","三思复反。","心多畏恶，","日中止舍。"],["走入岔道不太远，","三思尔后又复返。","心中畏惧逢祸患，","中午回到自家园。"]],[["仓唐奉使，","中山以孝。","文侯悦喜，","子击征召。"],["赵仓唐奉命出使，","到中山辅佐子击。","魏文侯心中悦喜，","征召他回归故地。"]],[["入天门，","守地户。","居安乐，","不劳苦。"],["登高步入皇天门，","安坐守好我地户。","居住长我得安乐，","不受劳累和辛苦。"]],[["登陛上堂，","见吾父兄。","左酒右浆，","与福相迎。"],["登上台阶跨进门，","见到哥哥和父亲。","左右都是酒和肉，","阖家欢乐福相迎。"]],[["秋蛇向穴，","不失其节。","夫人姜氏，","自齐复入。"],["秋蛇蛰伏于洞穴，","出入动作按时节。","桓公夫人齐文姜，","屡屡返回那齐国。"]],[["忍丑少羞，","无面有头。","耗减寡虚，","日以削消。"],["面带污垢蓬着头，","忍着耻辱含着羞。","精神耗减体虚弱，","日复一日变消瘦。"]],[["景星照堂，","麟凤游翔。","仁施大行，","颂声大兴。"],["瑞星高悬照明堂，","麒麟凤凰来呈祥。","仁义之政施四方，","歌颂之声到处扬。"]],[["干旄旌旗，","执帜在郊。","虽有宝珠，","无路致之。"],["牛尾鸟羽饰旗杆，","高高飘扬在郊原。","虽说前方有宝珠，","无路到达获取难。"]],[["李华再实，","鸿卵降集。","仁德以兴，","荫国受福。"],["李树开花又结果，","大雁飞来做巢穴。","行施仁德兴邦国，","人民常有好生活。"]],[["白马赤乌，","战於东都。","天辅有德，","败悔为忧。"],["白色之马和红乌，","双方交战于东都。","上天辅助有德人，","殷商败亡怀忧恨。"]],[["采薪得麟，","大命陨颠。","豪雄争名，","天下四分。"],["哀公西狩获麒麟，","圣人孔丘命颠崩。","豪杰争利又争名，","天下五裂又四分。"]]],[[["鼻目异处，","不知香臭。","君迷于事，","失其宠位。"],["鼻子眼睛换地方，","不辨腐臭和清香。","男士沉迷酒色中，","失掉尊崇和荣光。"]],[["唐虞相辅，","鸟兽喜舞。","安乐无事，","国家富有。"],["唐尧虞舜相帮辅，","慈鸟仁兽皆起舞。","人民安乐无凶事，","国家繁荣又富足。"]],[["左辅右弼，","金玉满堂。","常盈不亡，","富如敖仓。"],["臣下辅弼助君王，","金银财宝满庭堂。","经常增加不减少，","富如敖山大粮仓。"]],[["苍龙单独，","与石相触，","摧折两角。"],["青色巨龙独来往，","竟与大石相碰撞，","两只龙角遭折伤。"]],[["钓目厌部，","善逐人走。","来嫁无夫，","不安其庐。"],["目送秋波淫荡妇，","善诱男子去追逐。","欲嫁丈夫无人娶，","毛病难改不安庐。"]],[["逐虎驱狼，","避去不祥。","凶恶北行，","与喜相逢。"],["驱逐猛虎与恶狼，","避开不祥之灾殃。","凶险罪恶向北去，","君与喜庆聚一堂。"]],[["赍贝赎狸，","不听我辞。","系于虎须，","牵不得来。"],["带着宝贝去赎狐，","对方不听我劝阻。","将狐系于虎须上，","牵之不来白受苦。"]],[["同载共舆，","中道别去。","丧我元夫，","独为孤居。"],["夫妻同乘一辆车，","丈夫中途丢下我。","原配夫人远离去，","独自孤居苦生活。"]],[["奋翅鼓翼，","将之嘉国。","愆期失时，","乃得所欲。"],["鸟雀展翅鼓其翼，","向着嘉国高飞去。","延期动身误时辰，","终究到达目的地。"]],[["目倾心惑，","夏姬在侧。","申公颠倒，","巫臣乱国。"],["两眼相倾心迷惑，","荡妇夏姬在身侧。","申公巫臣魂颠倒，","迷恋女色乱了国。"]],[["搏鸠弹鹊，","逐兔山北。","丸尽日暮，","失获无得。"],["捕捉斑鸠又射鹊，","追兔追到山之朔。","弹丸用尽天色黑，","两手空空无所得。"]],[["鹿求其子，","虎庐之里。","唐伯李耳，","贪不我许。"],["母鹿寻找其孩子，","不幸找到虎窝里。","恶虎之心太贪婪，","拒不交还我鹿子。"]],[["败鱼鲍室，","臭不可息。","上山履涂，","归伤我足。"],["家中鱼儿变腐烂，","臭气熏天四处散。","上山途中履艰险，","返回又伤我脚端。"]],[["华灯百枝，","消暗衰微。","精光讫尽，","奄有灰靡。"],["明灯煌煌一百盏，","光亮逐渐变暗淡。","灯油燃尽捻子干，","只有灰尘盖上面。"]],[["颜叔子夏，","游遨仁宇。","温良受福，","不失其所。"],["弟子颜渊和子夏，","频频往来仁德家。","温顺善良受大福，","美好声誉满天下。"]],[["梁柱坚固，","子孙蕃盛。","福喜盈积，","终无祸悔。"],["婚姻坚固如梁柱，","子孙繁衍逾百户。","福气喜事常盈门，","祸患始终不进屋。"]],[["鸟鸣东西，","迎其群侣。","似有所属，","不得自专，","空返独还。"],["鸟儿鸣叫于东西，","高飞迎接众伴侣。","群鸟仿佛有组织，","不能单独自行事，","随意返回自家室。"]],[["边鄙不耸，","民狎于野。","穑人成功，","年岁大有。"],["边境没有报敌情，","百姓居之多安心。","农人耕种得成功，","庄稼成熟有收成。"]],[["蛙池鸣呴，","呼求水潦。","云雨大会，","流成河海。"],["蝦蟆池中呼又唤，","请求大雨降田间。","乌云顷刻相聚会，","陆地水流如涌泉。"]],[["志合意同，","姬姜相从。","嘉耦在门，","夫子悦喜。"],["志趣相合意相同，","姬姜和睦紧相从。","漂亮妻子主家政，","丈夫心里真高兴。"]],[["白马驳骝，","更生不休。","富有商人，","利得如丘。"],["白马和那杂毛驹，","世代繁衍无休止。","经商之人多富有，","财富堆积如山丘。"]],[["太姒夏禹，","经启九道。","各有攸处，","民得安所。"],["夏禹姓姒称太姒，","开凿九州把水治。","滔滔洪水有去处，","人民乐业得安居。"]],[["甲戌己庚，","随时运行，","不失其心。","唐季发愤，","擒灭子婴。"],["甲乙丙丁戊己庚，","随着时间而运行，","周而复始不失中。","刘邦发愤闹起义，","破秦入关灭子婴。"]],[["穆违百里，","使孟厉武。","将帅袭战，","败于崤右。"],["穆公违逆百里言，","命令孟明去作战。","将帅带兵袭郑国，","败于崤山难回还。"]],[["茅茹本居，","与类相扶。","愿慕群旅，","不离其巢。"],["茅茹横根连一处，","同类相帮又相扶。","一起生活多美好，","鸟雀群居不离巢。"]],[["伯仲叔季，","日暮寝寐。","坐卧失明，","丧其贝囊。"],["长兄小弟共四人，","夜间同在一室寝。","起立坐卧看不清，","丢失钱袋难谋生。"]],[["亡羊补牢，","张氏失牛。","骍驷奔走，","鹄盗我鱼。"],["羊儿丢失再补圈，","张家老牛跑出栏。","各马奔走不回还，","天鹅叨鱼飞上天。"]],[["雀目燕颡，","畏昏无光。","思我狡童，","不见子充。"],["燕子额头麻雀眼，","畏惧昏暗看不远。","思我调皮美少年，","不见子充心不甘。"]],[["入暗出明，","动作有光。","运转休息，","常乐允康。"],["进山昏暗出山亮，","运行动作放光芒。","太阳运转又休息，","常享快乐与安康。"]],[["不胜私情，","以利自婴。","北室出孤，","毁其良家。"],["利令智昏私心重，","自得利益常缠身。","孤独一人朝北去，","毁了美好之家庭。"]],[["称幸上灵，","媚悦于神。","受福重重，","子孙蕃功。"],["虔诚祷告天之灵。","献媚讨好于天神。","荣华富贵常享受，","子孙后代建功勋。"]],[["齐姜叔子，","天文在手。","实沈参墟，","封为康侯。"],["皇后邑姜生叔虞，","天赐字文在手里。","实沈星宿分野地，","康侯分给虞之子。"]],[["遨游无患，","出入安全。","长受其欢，","君子万年。"],["外出旅游无祸患，","出入来往都安全。","身心长久享欢乐，","好人长寿万万年。"]],[["被服文德，","升入大麓。","四门雍肃，","登受大福。"],["美好德性集于身，","大舜职位得荣升。","四方之门多庄严，","荣登高位福禄丰。"]],[["负金怀玉，","南归嘉国。","蜂趸不螫，","利入我室。"],["带上金钱和宝玉，","南回美好国度里。","蜂蝎不会来伤害，","财源滚滚入我室。"]],[["日在阜颠，","向昧为昏。","小人成群，","君子伤伦。"],["太阳将要落西山，","天色渐渐变昏暗。","小人成群结队来，","好人受到其伤残。"]],[["水父火母，","先为鸣呴。","泽泉之士，","从高而处。"],["水母浮游海面上，","鸣叫之声传四方。","水边山脚的人儿，","移居高处安无恙。"]],[["东邻少女，","为王长妇。","柔顺利贞，","宜夫寿子。"],["东邻家有一少女，","成了君王大儿媳。","性情柔顺有节操，","夫妻和睦生贵子。"]],[["戴瓶望天，","不见星辰。","顾小失大，","福逃于外。"],["头戴瓦瓶去观天，","日月星辰都不见。","贪图小利失大利，","幸福逃到门外边。"]],[["王乔无病，","狗头不疼。","亡跛失履，","乏我徒从。"],["仙人子乔没有病，","狗的头儿也不痛。","迷路跛子丢了鞋，","途中苦了我随从。"]],[["使燕筑室，","身无庇宿。","家不容车，","后我衣服。"],["想让燕子来筑巢，","可怜房破身难保。","陋室窄小难容车，","衣难更新穷潦倒。"]],[["威权分离，","乌夜徘徊，","群蔽月光，","大人诛伤。"],["威望权力分离开，","乌鸦长空夜徘徊。","成群高飞遮月光，","正人君子受诛伤。"]],[["辩变白黑，","巧言乱国。","大人失福，","君子迷惑。"],["诡辩颠倒黑与白，","花言巧语扰乱国。","大人失去其幸福，","贤士受到他迷惑。"]],[["衣踞甲铠，","敝筐受贝。","大人不顾，","少妇不取，","弃损于道。"],["护身甲铠难为衣，","敝筐不能盛东西。","没人能去光顾它，","年轻媳妇不拎取，","弃之路边无人拾。"]],[["燕雀衔茅，","以生孚乳。","兄弟六人，","姣好孝悌。","得心欢欣，","和悦相乐。"],["燕雀高飞衔茅草，","筑起巢穴育小鸟。","兄弟一共六个人，","和睦相处甚友好。","全家上下多欢欣，","和气喜悦乐陶陶。"]],[["登几上舆，","驾驷南游。","合纵散横，","燕齐以强。"],["踩着小凳上了车，","四马驾行游南国。","合纵抗秦不连横，","燕齐两国得强盛。"]],[["黩黩许许，","仇偶相得。","冰入炭室，","消亡不息。"],["轻慢相待欠礼仪，","仇人冤家遇一起。","如同寒冰入炭室，","败亡消失无声息。"]],[["鸱鸮破斧，","邦人危殆。","赖其忠德，","转祸为福，","倾亡复立。"],["恶鸟飞来破斧砍，","国家人民受危难。","幸赖周公有忠德，","祸去福禄临身边，","脱离险境得平安。"]],[["载金贩狗，","利弃我走。","藏匿渊底，","悔折为咎。"],["怀揣黄金去贩狗，","大利弃我而逃走。","藏进深水污渠中，","担忧损失躲贼寇。"]],[["渊坑复平，","宇室安宁。","忧患解除，","赖福长生。"],["水沟土坑都填平，","房前屋后得安宁。","忧患全部得解除，","承天赐福得长生。"]],[["骊姬谗喜，","与二嬖谋。","我恭子，","贼害忠孝。","申生以缢，","重耳奔逃。"],["长舌妇人骊戎女，","与那二嬖合谋议。","诬蔑中伤我恭子，","陷害忠良除异己。","申生自缢亡了命，","重耳乱中急逃离。"]],[["刲羊不当，","血少无羹。","女执空筐，","不得采桑。"],["杀羊方法不妥当，","血少难以做羹汤。","女子手中执空筐，","不能前去采摘桑。"]],[["牧羊稻园，","闻虎喧欢。","畏惧悚息，","终无祸患。"],["放牧羊儿于稻田，","忽然听见虎声喧。","畏惧警惕不敢动，","终于摆脱祸与患。"]],[["明德隐伏，","麟凤远匿。","周室倾侧，","不知所息？"],["明德君子不露面，","麒麟凤凰也走远。","周朝政权遭倾覆，","灭亡不知是何缘？"]],[["邻不我顾，","而求玉女。","身多秃癞，","请肯媚者？"],["邻里小伙不爱我，","而去追求靓姑娘。","秃斑疮疤长满身，","谁肯喜欢丑模样？"]],[["初虽无舆，","后得战车。","赖幸逢福，","得离兵革。"],["开始徒步而跋涉，","后来荣幸得战车。","多亏逢上好时运，","避开兵革之灾祸。"]],[["水坏我里，","东流为海。","龟凫欢嚣，","不睹王母。"],["洪水冲毁我家乡，","东流汇成大海洋。","乌龟野鸭齐喧闹，","不见祖母在何方。"]],[["两心不同，","或欲西东。","明论终始，","莫适所从。"],["两条心儿不相同，","一要往西一向东。","双方争论无休止，","最终令人难适从。"]],[["天帝悬车，","废礼不朝。","攘福不制，","失宠其家。"],["帝王悬车回家中，","不问礼仪和朝政。","祈福之事无人管，","终使其家失荣宠。"]],[["交川合浦，","远湿难处。","水土不同，","思吾皇祖。"],["交川合浦太遥远，","潮湿之地安居难。","水土不服难居住，","思念故土想祖先。"]],[["勾践之危，","栖于会稽。","太宰机言，","越国复存。"],["越王勾践遇危难，","栖息都城会稽山。","太宰道出机密言，","越国转危得平安。"]],[["慈鸟鸤鸠，","执一无尤；","寝门内治，","君子悦喜。"],["布谷鸟儿多仁慈，","爱心专一无过失；","贤妻治家有良方，","丈夫在侧心中喜。"]],[["富年早寡，","独立孤居。","鸡鸣犬吠，","无敢问诸。","我生不遇，","独罹寒苦。"],["壮年守寡失丈夫，","形单影孑甚孤独。","深夜鸡鸣狗又叫，","无人敢将她照顾。","生来未逢好时运，","独遭煎熬受寒苦。"]],[["江河变服，","淫湎无侧。","高位颠崩，","宠禄反覆。"],["江河涨落难捉摸，","杯中吉凶难预测。","身居高位遭颠崩，","丧失福禄和荣宠。"]]],[[["首泽与目，","载受福庆。","我有好爵，","与汝相迎。"],["容光焕发眼有神，","载受大福和吉庆。","我有酒器多精美，","与你同坐开怀饮。"]],[["岁暮偏蔽。","宠名捐弃，","君衰在位。"],["冬日黄昏暗天地。","君主丧权失王位，","英名失宠被抛弃。"]],[["折若蔽日，","屏遮王目。","司马无良，","平子没伤。"],["折下若叶挡太阳，","君眼被遮不见光。","司马为人心不良，","平子遇难没受伤。"]],[["家在海隅，","绕旋深流。","王孙单行，","无妄以趋？"],["家住海边之角落，","水深绕流漩涡多。","王孙一人单独行，","不知途中可平顺？"]],[["执义秉德，","不危不殆。","廷颈盘桓，","安其室垣。","屯耗未得，","终无大恤。"],["坚守正义德为先，","没有灾殃与危难。","健身运动常开展，","安居乐业身心安。","消耗虽多无积蓄，","终于未逢大忧患。"]],[["长舌乱家，","大斧破车。","阴阳不得，","姬姜衰忧。"],["长舌扰乱家与国，","挥舞大斧砍破车。","阴阳二气不和顺，","夫妇之间生忧祸。"]],[["二人共路，","东趋西步。","千里之外，","不相知处。"],["两人一同出门行，","一人向西一向东。","双方行至千里外，","相互不知其音讯。"]],[["视暗不明，","云蔽日光。","不见子都，","郑人心伤。"],["视线昏暗不明亮，","阴云遮挡太阳光。","不见大夫子都来，","郑国人民心悲伤。"]],[["初忧后喜，","与福为市。","八佾列阵，","饮御嘉友。"],["起初怀忧后逢喜，","君与洪福齐天地。","宫廷观舞又赏乐，","美酒招待我嘉客。"]],[["童妾独宿，","长女未室，","利无所得。"],["小妾在家独自睡，","长女到时未婚配，","没有伴侣心苦悲。"]],[["玄黄四塞，","阴雌伏谋。","呼我墙屋，","为巫所识。"],["天地四方全堵塞，","女鬼伏谋伤害我。","冲着我家高声喊，","神巫将其计识破。"]],[["中岁摧颓，","常恐衰微。","老复赖庆，","五羖为相。"],["百里壮年不得志，","家境贫困常恐惧。","老年奔逃到南阳，","羊皮赎他任国相。"]],[["伯氏杀牛，","行悖天时。","亳社夷烧，","朝歌丘墟。"],["大哥将那牛杀死，","行为动作违天时。","殷商亳社被焚烧，","都城朝歌成废墟。"]],[["日短夜长，","禄命不光。","早离父兄，","免见忧伤。"],["日短夜长冬阳弱，","自知命苦福气薄。","早日离开父与兄，","以免父兄太伤心。"]],[["采唐沫乡，","徼期桑中。","失期不会，","忧思忡忡。"],["前往沫乡摘蒙菜，","邀请我到桑中来。","姑娘失约未会面，","使我心中好悲哀。"]],[["昧视无光，","夜不见明。","冥抵空床，","季叶逃亡。"],["视线昏暗不见光，","黑夜茫茫无明亮。","晦冥之中摸空床，","发现小叶已逃亡。"]],[["举趾振翼，","南至嘉国。","见我伯姊，","与惠相得。"],["举趾展翅高飞翔，","来到南国好地方。","与我大姐喜相逢，","得到恩惠心欢畅。"]],[["鲂生江淮，","一转为百。","周流四海，","无有难恶。"],["江淮水域鲂鱼多，","繁殖旺盛一变百。","顺水漂流游四海，","没有难关和险恶。"]],[["则天顺时，","周流其墟。","与乐并居，","无有咎忧。"],["顺应天时去行事，","周流动作不停止。","我与快乐同相处，","没有灾祸与忧虑。"]],[["趸室蜂户，","螫我手足。","不可进取，","为我害咎。"],["步入蝎洞和蜂窝，","我的手脚遭其蜇。","不能继续再向前，","我身逢凶招灾祸。"]],[["公孙驾骊，","载游东齐。","延陵悦产，","遗季衣。"],["黑马驾车公孙坐，","向东出行游齐国。","延陵季子一席话，","子产赠他贵重物。"]],[["转作骊山，","大失人心。","刘季发怒，","禽灭子婴。"],["转而修建骊山陵，","秦王嬴政失民心。","刘邦发怒行起义，","推翻二世擒子婴。"]],[["羊肠九萦，","相推稍前。","止须王孙，","乃能升天。"],["羊肠小路九道弯，","相推方能稍向前。","仙人王乔是好汉，","一路顺风登上天。"]],[["充侧，","佞人倾惑。","女谒横行，","正道壅塞。"],["阴霓围绕于身旁，","佞臣迷惑我君王。","女谒横行宫廷内，","正道堵塞不通畅。"]],[["福禄不遂，","家多怪祟。","麋鹿悲鸣，","思其大雄。"],["福禄不遂我的心，","家中怪事接连生。","麋鹿悲啼又哀鸣，","思念鹿群之首领。"]],[["云雷因积，","大雨重叠。","久不见日，","使我心悒。"],["云腾雷鸣电光闪，","大雨连绵不间断。","长久不见太阳光，","使我愁闷心不安。"]],[["三河俱合，","水怒踊跃。","坏我王屋，","民困于食。"],["三条河水汇巨流，","波涛汹涌怒声吼。","毁坏王室酿成灾，","黎民饥饿心忧愁。"]],[["冒雨夜行，","早遍都城。","更相覆倾，","终无所成。"],["深夜冒雨而出行，","趁早前去赴京城。","经商之人相倾轧，","终于一事未办成。"]],[["褒后生蛇，","垂老皆微。","倒跌衰耄，","酉灭黄离。"],["褒后生于龙涎沫，","周朝国运将终结。","倾跌衰微气数尽，","西周江山褒姒灭。"]],[["鸿雁南飞，","随阳休息。","转逐天和，","千里不衰。"],["大雁和鸣南飞去，","随时迁居而休息。","追寻天下温和地，","虽行千里不嫌疲。"]],[["后时失利，","不得所欲。","莫享偕结，","自逐自逐。"],["时机错过未盈利，","所想不能随心意。","好友未能结伉俪，","等于自己逐自己。"]],[["心多恨悔，","出言为怪。","枭鸣室北，","声丑可恶；","请谒不得。"],["心中积恨深又深，","开口说话太难听。","枭鸟鸣叫于室北，","声音令人生恶心；","请求见面未能成。"]],[["驷马过隙，","时难再得。","尼父孔圣，","系而不食。"],["四马跨过裂缝前，","时光一去不复返。","尼父孔子大圣人，","未被任用空悲叹。"]],[["阴变为阳，","女化为男。","治道得通，","君臣相承。"],["阴柔之气变阳刚，","女子成为男儿郎。","治国之道得畅通，","君臣相辅国运昌。"]],[["昆仑源口，","流行不止。","龙门砥柱，","民不安处。","母归扶子，","黄麑悦喜。"],["昆仑山上有源头，","滔滔不绝往下流。","龙门中流有砥柱，","洪水泛滥民担忧。","母鹿回到子身边，","小鹿见了乐悠悠。"]],[["葛藟蒙棘，","华不得实；","谗佞乱政，","使恩壅塞。"],["葛藤处在荆棘中，","纵使开花果不生；","谗佞坏人乱朝政，","恩德之路不畅通。"]],[["公无长驱，","大王骏马。","非其所当，","伤折为患。"],["纵使太王有骏马，","公子不能骑乘它。","使用如若不妥当，","摔伤跌撞祸患大。"]],[["大仓充盈，","万物蕃盛，","年岁熟荣。"],["国库粮食很充盈，","万物生长多茂盛，","年年都有好收成。"]],[["执照牺，","为风所吹。","火灭无光，","不见玄黄。"],["手执火把放光芒，","整理祭祀之牛羊。","大风吹灭火把光，","天地一片黑茫茫。"]],[["鸟反故巢，","归其室家。","心平意正，","与叔相和；","登高陨坠，","失其宠贵。"],["鸟返旧巢来下榻，","大哥回到自己家。","心意平和又正直，","与弟和睦又融洽；","登高转而遭陨坠，","失去富贵和荣华。"]],[["弩弛弓藏，","良犬不行。","内无怨女，","征夫在堂。"],["弓弩松弦收藏好，","猎狗不再出门跑。","妻子不必怨孤单，","心爱丈夫在身边。"]],[["牡牺孔博，","日新其德。","文君燎猎，","姜氏受福。"],["祭祀之牛大又多，","日日自修其品德。","文王烧山而行猎，","太公因之受福泽。"]],[["季秋孟冬，","寒露霜降。","大阴在庭，","品物不生。","鸡犬夜鸣，","家扰数惊。"],["从那秋末到初冬，","寒露霜降节气临。","阴气充塞满庭院，","万物无法再长生。","半夜鸡叫狗又咬，","全家多次受凉恐。"]],[["心多恨悔，","出门见怪。","有蛇三足，","丑声可恶；","嫫母为媒，","请求不得。"],["内心悔恨多又多，","出行途中逢怪物。","一蛇长有三只脚，","叫声令人生厌恶；","丑妇前来做媒人，","婚姻大事难成功。"]],[["虎豹争强，","道闭不通。","小人欢讼，","贪天之功。"],["恶虎猛豹争强胜，","道路堵塞不畅通。","小人喜欢起争讼，","为着攫取贪天功。"]],[["鸡方啄粟，","为狐所逐。","走不得食，","惶怖惕息。"],["鸡儿正要啄谷粒，","狐狸将它驱逐去。","受惊远飞未得食，","惊恐害怕又警惕。"]],[["陈妫敬仲，","兆兴齐姜。","乃适营丘，","八世大昌。"],["陈妫敬仲娶新娘，","卜卦预兆兴齐姜。","迁往齐国营丘地，","子孙八代大盛昌。"]],[["昊天白日，","照临我国。","万民康宁，","咸赖嘉福。"],["晴空骄阳当头过，","光辉照耀我中国。","亿万人民多康宁，","赖此享受大福泽。"]],[["云梦大薮，","嘉有所在。","虞人共职，","骊驹悦喜。"],["云梦大泽水草旺，","是个美丽好地方。","虞官到此来管理，","黑色马驹也欢畅。"]],[["獐鹿雉兔，","群聚东国。","卢黄白脊，","俱往逐追。","九十得，","主君有喜。"],["獐鹿野鸡兔子多，","成群聚集于东国。","黄毛白脊好猎犬，","一同前往去追捉。","十拿九稳捕获多，","猎人心中真快活。"]],[["德惠孔明，","主君复章，","保其室堂。"],["美德恩惠多显明，","主人定能享荣宠，","保其家室永安宁。"]],[["天之所坏，","不可强支。","众口嘈嘈，","虽贵必危。"],["天意要将他摧残，","勉强支撑难上难。","众人齐声都反对，","虽然尊贵必有险。"]],[["天之奥隅，","尧舜所居。","可以全身，","保我邦家。"],["天之西南角落里，","乃是尧舜居住地。","可保平安养身体，","国家人民都安逸。"]],[["下泉苞狼，","十年无王。","荀伯遇时，","忧念周京。"],["泉水淹得草难长，","国中十年没有王。","荀伯逢时来治理，","周朝兴衰挂心上。"]],[["江河海隅，","众利聚居。","可以遨游，","卒岁无忧。"],["长江黄河大海边，","富饶美丽多物产。","任凭君子逍遥游，","安度岁月无忧患。"]],[["南山黄竹，","三身六目。","出入制命，","东里宣政。","主尊君安，","郑国无患。"],["南山之上产黄竹，","三个竿儿六个孔。","用它书写王之命，","东里之地宣政令。","主上尊荣君平安，","郑国没有患与凶。"]],[["重译贡芝，","来除我忧。","与喜俱居，","同其福休。"],["辗转翻译献灵芝，","解除我的忧和虑。","欢欣与喜来相逢，","同享幸福和安逸。"]],[["南山高冈，","麟凤室堂。","含和履中，","国无灾祸。"],["在那南山高冈上，","麟凤栖息呈吉祥。","身体履行中和道，","国家安宁无灾殃。"]],[["紫芝朱草，","生长和气。","公尸侑食，","福禄来下。"],["紫芝朱草处一地，","茁壮成长多和气。","神主光临来赴宴，","天降福禄保平安。"]],[["宫成室就，","进乐相舞。","英俊在堂，","福禄光明。"],["修好宫殿和住房，","音乐歌舞进明堂。","英雄豪杰聚一处，","共享福禄与荣光。"]],[["商人子孙，","资无所有。","贪狼逐狐，","流连都市。","还辕内乡，","嘉喜何咎。"],["商人子孙缺经验，","生意亏损无本钱。","贪婪成性如盗贼，","待在城里空流连。","不如驱车返故乡，","回心向善无咎殃。"]],[["执贽入朝，","献其狐裘。","元戎燮安，","沙漠以欢。"],["手执礼品步入朝，","献给君王狐皮袄。","将帅和谐保平安，","匈奴大汉两国欢。"]],[["涌泉汩汩，","南流不绝。","洿为淮海，","坏败邑里，","家无所处。"],["泉水澎湃甚汹涌，","向南奔流不歇停。","浊水汇集成淮海，","冲毁城邑和乡村，","失家无处去安身。"]],[["固阴冱寒，","常冰不温。","凌人惰怠，","大雹为灾。"],["阴气凝聚冷又寒，","常常冰封无温暖。","掌冰之官太懒惰，","天降大雹成灾患。"]]],[[["黄卢生子，","以戌为母。","晋师在郊，","虞公出走。"],["黄色母狗生小狗，","它的职责是卫守。","晋国军队到城郊，","虞国之君出逃走。"]],[["仓唐奉使，","中山以孝。","文侯悦喜，","子陆征召。"],["赵仓唐奉命出使，","到中山辅佐子击。","魏文侯心中悦喜，","征召他回归故地。"]],[["机关不便，","不能出言。","精诚不通，","为人所冤。"],["话语如若无关键，","不能轻易乱发言。","两人心志不相通，","真心反而蒙屈冤。"]],[["白茅醴酒，","灵巫拜祷。","神嗜饮食，","使君寿考。"],["甘甜美酒浇白茅，","巫师向着神祈祷。","神灵爱吃又喜饮，","使您生长永不老。"]],[["重瞳四乳，","耳聪目明。","普仁表圣，","为作元辅。"],["文王四乳舜重瞳，","眼睛明亮耳又聪。","普天之下为师表，","德高望重做辅臣。"]],[["水涨无船，","破城坏堤。","大夫从役，","一朝亡殒，","不见少妻。"],["洪水漫涨无渡船，","冲毁堤坝淹城垣。","大夫服役去防涝，","一朝送命丧黄泉，","至死难见少妻面。"]],[["二人俱行，","各遗其囊。","鸿鹄失珠，","无以为明。"],["两人一同向前行，","钱囊丢失难找寻。","天鹅失去夜明珠，","没有东西来照明。"]],[["随时志行，","不失其常。","咸乐厥类，","身无咎殃。"],["随着时令而转动，","不失常规而运行。","乐与同类常友好，","没有祸患与灾凶。"]],[["蔡女荡舟，","为国患忧。","褒后在侧，","屏蔽王目，","骚扰六国。"],["蔡姬湖中荡游船，","国家因之生忧患。","宠姬褒后在身边，","欺骗蒙蔽君王眼，","六国受扰不得安。"]],[["驾龙骑虎，","周遍天下。","为神人使，","西见王母，","不忧不殆。"],["驾着巨龙骑着虎，","周游遍及四方土。","君受神仙所派遣，","前往西方见王母，","没有忧愁无险阻。"]],[["员怨之吴，","划策阖闾。","鞭平服荆，","除大咎殃。","威震敌国，","还受上卿。"],["伍员含恨奔吴国，","策划吴王攻楚国。","掘墓鞭打平王尸，","报仇雪恨除灾祸。","英勇威武震敌国，","归来荣登上卿坐。"]],[["唐邑之墟，","晋人以居。","虞叔受福，","实沈是国，","世载其乐。"],["后人唐邑之故里，","本是晋人居住地。","虞叔封此受福泽，","实沈乃是晋分野，","世世代代享欢乐。"]],[["管鲍相知，","至德不离。","三言相桓，","齐国之安。"],["鲍叔管仲心相印，","品德高尚情谊深。","三次荐为桓公相，","齐国强盛又安宁。"]],[["三十无室，","长女独宿。","长劳未得，","忧在胸臆。"],["年方三十无室家，","长女独居未出嫁。","身心劳苦事不成，","烦恼忧愁胸中挂。"]],[["散涣水长，","风吹我乡。","火灭无光，","隳败桓公。"],["洪水滔滔乱流淌，","恶风吹至我家乡。","火灭没有其光亮，","桓公坠落身败亡。"]],[["蜎飞蠕动，","各有配偶。","大小相保，","咸得其所。"],["区区蚊虫飞或走，","个人都有其配偶。","大小共同相保护，","各自得到其所求。"]],[["安乐几筵，","未出王门。"],["沉醉欢乐宴会中，","始终未出王宫门。"]],[["火生月窟，","下土恩塞，","抵乱我国。"],["大火生于月宫中，","上下堵塞不畅通，","奸臣扰乱我朝政。"]],[["弱水之西，","有西王母。","生不知老，","与天相保。","行者危殆，","利居善喜。"],["在那弱水之西面，","住有王母活神仙。","长生不知何为老，","与天同龄寿无边。","行人前往有危险，","居之可以享平安。"]],[["长生无极，","子孙千亿。","柏柱载梁，","坚固不倾。"],["长生不老无尽极，","子孙繁衍逾千亿。","柏木柱子载大梁，","房屋坚固不倾疆。"]],[["钦敬昊天，","历象星辰。","宣授民时，","阴阳和调。"],["敬佩上方之苍穹，","观测历象望星辰。","节令宣告于百姓，","阴阳协调多和顺。"]],[["三河俱合，","水怒踊跃。","坏我王屋，","民困於食。"],["三条河水汇巨流，","波涛汹涌怒声吼。","冲毁王室之庭院，","黎民困苦生忧愁。"]],[["寿如松乔，","与日月俱。","常安康乐，","不离祸忧。"],["赤松子和王子乔，","寿比日月永不老。","常享安乐体康健，","没有忧愁与烦恼。"]],[["天之所予，","福禄常在，","不忧危殆。"],["皇天上上所赐予，","幸福利禄长久在，","忧愁祸患永不来。"]],[["受谶六符，","招摇室虚。","虽跌无忧，","保我命财。"],["三阶平平兆头吉，","贱人之牢室空虚。","虽然跌倒再爬起，","保我身财两安逸。"]],[["赍金买车，","失道后时。","劳罢为忧，","我心则休。"],["带着金钱去买车，","迷路错过好时节。","疲惫不堪心忧虑，","徒劳往返无所得。"]],[["华首山头，","仙道所游。","利以居止，","长无咎忧。"],["华山首阳之山头，","神仙道士在此游。","利于长久去居住，","没有祸患与忧愁。"]],[["采唐沫乡，","徼其桑中。","失信不会，","忧思约带。"],["前往沫乡摘蒙菜，","邀请她到桑中来。","姑娘失约未会面，","使我相思束腰带。"]],[["人面鬼口，","长舌为斧。","斫破瑚琏，","殷商绝后。"],["人面长着恶鬼口，","长舌犹如那斧头。","砍破宗庙祭祀器，","殷商无子绝了后。"]],[["临溪桥疚，","虽恐不危，","乐以笑歌。"],["行至溪边桥倾斜，","虽恐危险不及我，","欢声笑语又高歌。"]],[["洋洋沸溢，","水泉为害，","使我无赖。"],["沸沸扬扬泉喷涌，","洪水成灾流不停，","使我无处去安身。"]],[["蝗螟为贼，","害我稼穑。","秋饥於年，","农夫鲜食。"],["蝗虫造成大灾患，","庄稼受到它摧残。","秋天贫饥无收成，","农人缺吃又少穿。"]],[["八百诸侯，","不期同时。","慕西文德，","兴我宗族；","家门雍睦。"],["八百诸侯会孟津，","不约而同伐纣王。","倾慕西伯文王德，","兴我宗族兴我邦；","家庭和睦福长长。"]],[["长男少女，","相向笑语。","来欢致福，","和悦乐喜。"],["年轻小伙和少女，","双双相言又笑语。","祝福欢乐福气来，","欢天喜地乐滋滋。"]],[["平国不君，","夏氏作乱。","乌号窃发，","灵公殒命。"],["陈灵公不配为君，","夏征舒发泄私愤。","阴暗处强弓射箭，","灵公他命丧黄泉。"]],[["春多膏泽，","夏润优渥。","稼穑成熟，","亩获百斛。"],["春雨如油润大地，","夏天好雨多及时。","田间庄稼都成熟，","亩产千斗谷和糜。"]],[["客宿卧寒，","席蓐不安。","行危为害，","留止得欢。"],["住宿客店受风寒，","睡在床上难入眠。","马上出行有危险，","留止此地乐且欢。"]],[["乘桴於海，","虽惧不殆。","母载其子，","终焉何咎。"],["乘着木筏去渡海，","虽有恐惧却无险。","母亲携儿同前往，","自始至终无忧患。"]],[["手拙不便，","不能伐檀。","车无轴辕，","行者苦难。"],["双手笨拙不灵便，","不能将那檀木砍。","大车缺轴又无辕，","行旅之人苦作难。"]],[["唐虞相辅，","鸟兽率舞。","民安无事，","国家富有。"],["唐尧虞舜相辅助，","鸟兽翩跹而起舞。","人民平安无事故，","国家兴旺又富足。"]],[["秋蛇向穴，","不失其节。","夫人姜氏，","自齐复入。"],["秋蛇蛰伏于洞穴，","出入动作随时节。","桓公夫人齐文姜，","自鲁返回那齐国。"]],[["病笃难医，","和不能治。","命终永讫，","下即蒿庐。"],["病情危重难痊愈，","神医医和不能治。","生命至此要完结，","即将进入冥国里。"]],[["青蛉如云，","城邑闭门。","国君卫守，","民困于患。"],["蜻蜓密集如乌云，","全城闭户关紧门。","国君警惕严防守，","灾难困住老百姓。"]],[["牙蘖生达，","室堂启户。","出入利贞，","鼓翼起舞。"],["萌芽生长出新枝，","室堂屋门得开启。","出入来往都顺利，","手舞足蹈多欢喜。"]],[["凫游江海，","没行千里。","以为死亡，","复见空桑，","长生乐乡。"],["野鸭戏游江与海，","潜没行至千里外。","人们认为它死亡，","重新出现于空桑，","长久生活安乐乡。"]],[["黄帝出游，","驾龙乘马。","东上泰山，","南游齐鲁，","邦国咸喜。"],["黄帝巡视江南北，","乘龙驾马去游说。","向东登上泰山顶，","南下齐国和鲁国，","举国上下都欢乐。"]],[["履危不止，","与鬼相视。","惊恐失气，","如骑虎尾。"],["脚踩危途向前行，","与鬼对面而相逢。","惊恐不安又气馁，","如同骑在老虎尾。"]],[["秋南春北，","不失消息。","涉和履中，","时无隐匿。"],["秋天南飞春向朔，","大雁来回按季节。","追求冷暖适中地，","信守时令安室舍。"]],[["龙门砥柱，","通利水道。","百川顺流，","民安其居。"],["龙门砥柱被凿通，","大河之水得流行。","百川水流归大海，","人民得以安其身。"]],[["千岁庙堂，","栋桡倾僵。","天厌周德，","失其宠光。"],["历时千年旧庙堂，","栋梁弯曲屋倾僵。","上天厌恶周之德，","失其尊宠和荣光。"]],[["折若蔽目，","不见稚叔。","三足孤乌，","远离室家。"],["折下树叶挡住眼，","不见小弟在哪边。","三足之乌太孤单，","远离家室心不安。"]],[["望叔山北，","陵隔我目。","不见所得，","使我心惑。"],["姑娘登高望山北，","情郎被那丘陵隔。","不见恋人来相会，","使我心中生疑惑。"]],[["匏瓠之息，","一亩千室。","万国都邑，","北门有福。"],["葫芦生息又繁衍，","一亩果实能过千。","万国都城君民安，","北门福与喜相连。"]],[["域域牧牧，","忧祸相伴。","隔以岩山，","室家分散。"],["道路狭窄又遥远，","忧患与君紧相伴。","隔山难见妻子面，","最终室家皆分散。"]],[["骐骥耳，","游食苹草。","逍遥石门，","循山上下，","不失其所。"],["良马健壮骏又好，","游闲自得食萍草。","驰骋在那石门山，","依山上下甚逍遥，","不离居所多美好。"]],[["天所祚昌，","文以为良。","笃生武王，","姬受其福。"],["上天保佑周文王，","文王聪敏又贤良。","德性笃厚生武王，","姬氏后代福久长。"]],[["羊肠九萦，","相推稍前。","止须王孙，","乃能上天。"],["羊肠小道九个弯，","行人相推稍向前。","须有王乔来登攀，","方能上天成神仙。"]],[["贫鬼守门，","日破我盆。","孤牝不驹，","鸡不成雏。"],["穷鬼守在我家门，","天天打破我的盆。","母马孤单不产驹，","独养母鸡无小鸡。"]],[["饱食从容，","入门上堂。","不失其常，","家无咎殃。"],["手中有粮心不慌，","大步入门走上堂。","行为处事有规律，","家中不会有灾殃。"]],[["阴淫不止，","白马为海。","皋泽之子，","就高而处。"],["霪雨霏霏天上来，","白马津口变为海。","水边山脚的人儿，","居高而处没有灾。"]],[["执戈俱立，","以备暴急。","千人守门，","因以益卑，","终安何畏？"],["手执长戈立两侧，","以防盗贼和暴客。","千军万马守城郭，","赖此受益除凶祸，","成竹在胸怕什么？"]],[["夹河为婚，","水涨无船。","遥心失望，","不见所欢。"],["情人隔河结姻缘，","河水上涨无渡船。","忐忑不安很失望，","不见哥哥心不欢。"]],[["阴阳变化，","各得其宜。","上下顺通，","奏为肤功。"],["阴柔阳刚相更替，","各得其所多适宜。","上下关系都顺通，","赫赫大功得告成。"]],[["任劣德薄，","失其臣妾。","田不见禽，","犬无所得。"],["才能低劣德浅薄，","失去亲信小老婆。","出门打猎无禽兽，","猎狗搜寻无猎物。"]]],[[["蜎飞蠕动，","各有所配。","欢悦相迎，","咸得其处。"],["区区蚊虫飞或走，","个个都有其配偶。","欢乐喜悦相恭迎，","各自得到其所求。"]],[["继祀宗邑，","追明成康。","光照万国，","享世长存。"],["继承宗庙之祭祀，","追忧成康之盛世。","光辉普照万国土，","长久享受乐与福。"]],[["秋冬探巢，","不得鹊雏。","衔指北去，","愧我少姬。"],["秋冬季节掏鸟巢，","幼鹊一只未得到。","口噙指头向北去，","愧对家中我少妻。"]],[["僮妄独宿，","长女未室，","利无所得。"],["小妾独宿受煎熬，","长女未把婆家找，","婚嫁好处未得到。"]],[["洪波逆流，","至人潜处。","蓬蒿代柱，","大屋颠仆。"],["洪水滚滚逆向流，","圣人隐身远出走。","蓬草蒿秆替栋梁，","高大屋宇遭倾僵。"]],[["日暗不明，","谗夫在堂。","右臂疾痹，","君失其光。"],["太阳昏暗不明亮，","奸臣坐在朝堂上。","左右忠臣受伤害，","君主失去其宠光。"]],[["王孙季子，","相与孝龙。","明允笃诚，","升擢荐举，","为国干辅。"],["王孙公子好品行，","相互友爱讲忠信。","贤明诚实重修养，","推选荐举得提升，","成为国家梁与栋。"]],[["麟趾龙身，","日驭三千。","南上苍梧，","为福为婚。","道里夷易，","安全无患。"],["脚如麒麟身如龙，","日行千里似马奔。","向南登上苍梧山，","喜与福禄结良姻。","道路平坦又顺利，","安全无患无灾凶。"]],[["三子成驹，","破其坚车。","轮载空舆，","后时失期。"],["三驹合拉一辆车，","各行其是车儿破。","两轮载着空车行，","失期误时利未得。"]],[["逐祸除患，","道德神仙。","遏恶万里，","常欢以安。"],["避祸驱除灾与患，","德高犹如活神仙。","邪恶遏于万里外，","常享欢乐和平安。"]],[["黄池之盟，","吴晋争强。","勾践为患，","夷国不安。"],["夫差黄池会诸侯，","吴晋两国争霸权。","越王勾践造祸患，","比邻之国不得安。"]],[["青牛白咽，","招我于田。","历山之下，","可以多耕。","岁藏时节，","人保安宁。"],["青色牛儿长白咽，","同我一齐去田间。","历山脚下宽又广，","可以多耕好良田。","秋收冬藏好季节，","能保人口都平安。"]],[["有头无目，","不见菽粟。","消耗为疾，","三年不复。"],["虽有脑袋无眼睛，","豆子稻谷分不清。","身体劳累生了病，","三年病情未减轻。"]],[["山没丘浮，","陆为水鱼。","燕雀无巢，","民无室庐。"],["大水淹没高山冈，","陆地成为鱼儿乡。","燕雀失去其巢穴，","百姓没有避雨房。"]],[["高冈凤凰，","朝阳梧桐。","雍雍喈喈，","菶菶萋萋。","陈辞不多，","以告孔嘉。"],["凤凰栖于高山冈，","梧桐树上迎朝阳。","鸣声和谐又嘹亮，","枝叶茂盛多茁壮。","陈述之言虽不多，","告我美丽好风光。"]],[["鳏寡独宿，","忧动胸臆，","莫与宿食。"],["孤男寡女独身宿，","心绪波动生愁苦，","没人与其同吃住。"]],[["马蹄踬车，","恶妇破家。","青蝇污白，","恭子离居。"],["行马之蹄绊住车，","恶妇谗言使家破。","苍蝇玷污其洁白，","申生被害逃出国。"]],[["长女三嫁，","进退无羞。","逐狐作妖，","行者离忧。"],["长女三次嫁男人，","朝三暮四无羞心。","妖里妖气狐狸精，","路人见了都恶心。"]],[["人无定法，","缓行长奸。","地雄走归，","阳不制阴，","男失其家。"],["做人办事无水准，","姑息养奸害自身。","地上雄性皆潜伏，","阳气不能控制阴，","男子失去其家庭。"]],[["历山之下，","虞舜所处。","躬耕致孝，","名闻四海。","为尧所荐，","缵位天子。"],["在那历山之下边，","圣人虞舜居其间。","孝敬父母勤耕作，","美名四海之内传。","唐尧举荐得重用，","继承王位掌大权。"]],[["菇芝饵黄，","饮食玉英。","与神流通，","长无忧凶。"],["常吃灵芝与黄精，","美玉花朵做食用。","我与神仙常来往，","健康长寿无忧凶。"]],[["东行无门，","西出华山。","道塞畏难，","游子为患。"],["向东出行没有门，","西出华山又不成。","道路堵塞难通行，","游人不敢向前进。"]],[["寿如松乔，","与日月俱。","常安康乐，","不罹祸忧。"],["赤松子与王子乔，","寿比日月永不老。","常享幸福和快乐，","没有忧愁与烦恼。"]],[["探彀得螽，","所愿不喜。","道宜小人，","君子咎蹇。"],["想掏幼鸟反得虫，","本非所愿难高兴。","小人当道交好运，","贤士逢凶路不通。"]],[["蜾蠃生子，","深目黑丑。","虽饰相就，","众人莫取。"],["土蜂生子丑小丫，","眼睛深陷黑面颊。","精心打扮要出嫁，","无人愿意来娶她。"]],[["喜怒不时，","雪霜为灾。","稼穑无功，","后稷饥忧。"],["天公喜怒不正常，","大雪纷飞降寒霜。","庄稼受损无收获，","农夫饥饿无食粮。"]],[["鸟升鹊举，","照临东海。","尨降庭坚，","为陶叔后。","封于蓼六，","履禄绥厚。"],["鸟儿高飞升起来，","一路顺风到东海。","尨降庭坚两兄弟，","都是陶叔的后代。","封于蓼地和六地，","安享福禄多资财。"]],[["黄离白日，","照我四国。","元首昭明，","民赖其福。"],["天空灿烂太阳光，","照耀四面和八方。","君主英明真伟大，","百姓赖其福长长。"]],[["黍稷醇醴，","敬奉山宗。","神嗜饮食，","甘雨嘉降。","独蒙福力，","时灾不至。"],["糜子谷子味甘浓，","用来敬奉大山神。","神灵爱好吃与喝，","吉庆祥瑞降甘霖。","我独承蒙福与恩，","四时和顺无灾凶。"]],[["祸不更生，","福过我里。","入门笑喜，","与吾利市。"],["灾祸不会再产生，","幸福来入我家门。","欢天喜地走进屋，","带来发财大喜讯。"]],[["昼卧里门，","悚惕不安。","目不得阖，","鬼搔我足。"],["白天躺在门里边，","提心吊胆心不安。","想要睡觉眼难合，","如同鬼搔我脚端。"]],[["春草荣华，","长女宜夫。","受福多年，","世为封禄。"],["春暖草木都开花，","姑娘长大要出嫁。","能够一生享清福，","世代为官有俸禄。"]],[["雍门内崩，","贼贤伤仁。","暴乱狂悖，","简公失位。"],["齐国城门遭溃崩，","奸贼伤害贤良人。","暴乱违背苍天意，","简公失位王权倾。"]],[["心志无良，","昌披妄行。","触壁抵墙，","不见户房。"],["内心阴险不善良，","放纵横行太猖狂。","到处碰壁触墙角，","不能走出自家房。"]],[["胶车木马，","不利远贾。","出门为患，","安止得全。"],["胶粘车子木做马，","不利经商财难发。","外出谨防生灾患，","安心居之得平安。"]],[["家在海隅，","桡短流深。","企立望宋，","无木以趋。"],["家住天涯海角边，","水深浆短济渡难。","翘起脚跟望家园，","没有船儿空悲叹。"]],[["冬叶枯槁，","当风失道。","蒙被尘埃，","左右劳苦。"],["寒冬树叶皆枯干，","被风吹至马路边。","灰尘积满黄叶上，","左右劳苦真可怜。"]],[["过时不行，","妄逐王公。","老女无夫，","不安其居。"],["错过时机未成行，","枉然追求那王公。","老女孤独无丈夫，","待在家中不安身。"]],[["履泥污足，","名困身辱。","两仇相当，","身为痛疾。"],["踏上污泥弄脏足，","名声受困身受辱。","两个仇人力相当，","各自都受痛和伤。"]],[["精华堕落，","形体丑恶。","龃龉挫顿，","枯槁腐蠹。"],["花朵纷纷而堕落，","形体变得很丑恶。","枝条摇晃遭折撞，","干枯虫蛀鸟儿啄。"]],[["长生无极，","子孙千亿。","松柏为梁，","坚固不倾。"],["长生不老无尽极，","子子孙孙逾千亿。","柏木柱子载大梁，","永世坚固不倾僵。"]],[["去辛就蓼，","毒愈酷甚。","避井入坑，","忧患日生。"],["欲避辛辣反食蓼，","苦辣令人更难熬。","避开陷阱掉入坑，","忧患天天缠住身。"]],[["行尧钦德，","养贤致福。","众英积聚，","国无寇贼。"],["行施唐尧之美德，","贤士招来大福泽。","众多英才聚一起，","国无贼寇无灾祸。"]],[["狗逐兔走，","俱入谷口。","与虎逢晤，","迫不得去。"],["猎狗追着兔子走，","一同进入山谷口。","途中不幸遇上虎，","被迫受困难逃走。"]],[["望尚阿衡，","太宰周公。","藩屏汤武，","立为侯王。"],["姜尚吕望和阿衡，","宰相姬旦称周公。","辅佐武王成大业，","封为侯王建奇功。"]],[["清人高子，","久屯外野。","逍遥不归，","思我慈母。"],["高克率领清邑兵，","御敌长居郊野中。","久戍欲归又不能，","思念慈祥老母亲。"]],[["三虫作蛊，","削迹无与。","胜母盗泉，","君不安处。"],["三条害虫同作怪，","不见形迹暗伤害。","住在胜母盗泉地，","好人始终不安逸。"]],[["作龙身，","进无所前。","三日五夜，","得其所欢。"],["良犬化作苍龙身，","欲向前进不能成。","经过三天又五夜，","终得所欢愿遂心。"]],[["黄裹绿衣，","君服不宜。","淫湎毁常，","失其宠光。"],["黄色衬里绿衣裳，","官人穿上不妥当。","沉溺酒色失常态，","失其尊宠和荣光。"]],[["无所顾佑，","祸灾不到，","安吉无惧。"],["上天照顾又保佑，","祸患灾难不临头，","平安吉利无惧忧。"]],[["盘纡九回，","行道留难。","止须于丘，","乃睹所欢。"],["盘旋曲折九道弯，","行进受阻甚艰难。","只有留在原居处，","方能逢喜得欣欢。"]],[["暴虐失国，","为下所逐。","北奔阴胡，","主君旄头。"],["君主暴虐招来祸，","臣下将其逐出国。","向北投奔匈奴人，","牛尾饰旗做首领。"]],[["御骍从龙，","至霍华东。","与禹相逢，","送致于邦。"],["架着红马随从龙，","来到霍山华山东。","幸与大禹喜相逢，","送我回到故乡中。"]],[["铜人铁距，","雨露劳苦。","终日卒岁，","无有休息。"],["铜身铁脚奔向前，","风霜雨露不畏难。","日复一日齐奋进，","年年岁岁不休闲。"]],[["大人失宜，","盈满复亏。","长成之木，","盛者灭衰。"],["大人行动失常规，","盈满转而又损亏。","树木长成叶儿盛，","转眼变得又衰微。"]],[["梅李冬实，","国多盗贼。","乱扰并作，","王不能制。"],["梅李冬天结果实，","国内盗贼四处起。","到处动乱不停息，","君王无力去制止。"]],[["泽枯无鱼，","山童无株。","长女嫉妒，","使身空虚。"],["池水干涸没有鱼，","山上光秃无树木。","长女疑心犯嫉妒，","无人接近身空虚。"]],[["天门冬虚，","既尽为灾。","膉黯苍，","秦伯受殃。"],["上天之门观虚星，","即刻消亡成灾凶。","宇宙昏暗茫苍苍，","秦国君主遭了殃。"]],[["褰衣涉河，","水深渍罢。","幸赖舟子，","济脱无他。"],["提起衣裳欲过河，","水深流急难渡涉。","幸有船夫来搭救，","脱离危险得渡过。"]],[["推车上山，","高仰重难。","终日至暮，","不见阜颠。"],["手推车子上高山，","路途险峻行走难。","从早一直到天黑，","始终未见山之巅。"]],[["鼎炀其耳，","热不可举。","大路壅塞，","旅人心苦。"],["鼎下火烧鼎耳烫，","炽热不能举手上。","行旅之人心劳苦，","路途受阻不通畅。"]],[["四乱不安，","东西为患。","退身止足，","无出邦域。","乃得完全，","赖其生福。"],["四方动乱不安宁，","东西皆有祸与凶。","退身止步勿行进，","不得枉然出城门。","赖此保全无伤损，","得以幸福和长生。"]],[["班马还师，","以息劳疲。","役夫嘉喜，","入户见妻。"],["士兵战马撤回朝，","调养休息解疲劳。","服役之人心中喜，","回家与妻得团聚。"]],[["积德不怠，","遇主逢时。","载喜渭阳，","身受荣光。"],["坚持不懈修德性，","姜尚碰上好时运。","渭水河畔逢文王，","身载喜事受荣光。"]]],[[["北风相牵，","提笑语言。","伯歌叔舞，","燕乐以喜。"],["北风之中手儿牵，","握手笑语又欢言。","兄长唱歌弟跳舞，","安详快乐喜相连。"]],[["甲戌己庚，","随时运行。","不失常节，","咸逢出生。","各乐其类，","达性任情。"],["甲乙丙丁戊己庚，","伴随季节而运行。","不离常规和节奏，","全都逢时而出生。","物以类聚自相乐，","行事任凭其个性。"]],[["破亡之虚，","神祇哀忧。","进往无光，","留止有庆。"],["破国亡家废墟上，","天神地神都哀伤。","迈步前行路昏暗，","留止长住则吉祥。"]],[["注斯膏泽，","捍卫百毒。","防以江南，","虺不能螫。"],["身涂此种特效药，","以防百毒侵害我。","带它前往江南去，","不怕毒蛇把我蜇。"]],[["日月相望，","光明盛昌。","三圣茂功，","仁德大隆。"],["太阳月亮遥相望，","光明普照多盛昌。","三位圣人建奇功，","仁义道德大兴隆。"]],[["大蛇巨鱼，","战于国郊。","上下隔塞，","卫侯庐漕。"],["大蛇大鱼相拒格，","双方争斗于郊野。","君臣离心又离德，","卫侯寄居于漕国。"]],[["龙入天关，","经历九山。","登高上下，","道里险难。","日晏不食，","绝无甘酸。"],["神龙腾飞入天关，","途中历经九座山。","登高上下而盘旋，","道路遥远甚艰难。","白天到晚未得食，","困苦绝望无甘甜。"]],[["沙漠北塞，","绝无水泉。","君子征凶，","役夫力殚。"],["塞北荒漠大无边，","一路不见有水泉。","统帅出征有凶险，","士卒力尽多苦难。"]],[["关折门启，","衿带解堕。","福与善生，","忧不为祸。"],["门闩断折门开启，","衣襟解开带坠地。","福禄与善双双来，","虽逢小忧无灾异。"]],[["狼虎所嗥，","患害必遭。","不利有为，","宜以遁逃。"],["恶狼猛虎在嗥叫，","祸患灾害必来到。","行为举止不顺利，","劝君遁居远离逃。"]],[["金精耀怒，","带剑过午。","两虎相距，","弓弩满野。","虽忧无咎。"],["太白金星放怒光，","佩带利剑居西方。","虎视眈眈两相距，","弓箭遍野满山冈。","虽然有忧终无殃。"]],[["朽根枯树，","花叶落去。","卒逢火焱，","相随偃仆。"],["大树干枯根腐烂，","花儿坠落叶儿残。","突然遭逢大火烧，","随之倒地独自燃。"]],[["入暗出明，","动作有光。","运转休息，","常乐永康。"],["落山昏暗出山亮，","运行动作放光芒。","太阳运转又休息，","常享欢乐永安康。"]],[["国多忌讳，","大人恒畏。","结口无患，","可以长存。"],["国家之中忌讳多，","贤臣良将畏灾祸。","缄口不言勿招患，","保君长久享安乐。"]],[["天地淳厚，","六合光明。","阴阳顺序，","厥功以成。"],["天地朴实又厚淳，","上下四方都光明。","阴阳变化有顺序，","以使大功得告成。"]],[["裸裎逐狐，","为人观笑。","牝鸡雄晨，","主作乱妖。"],["赤身裸体追狐狸，","被人讥笑无羞耻。","母鸡打鸣报时辰，","预示凶祸将来临。"]],[["阴升阳伏，","桀失其室，","相不食。"],["阴气上升阳潜伏，","夏桀失位遭驱逐，","忍饥挨饿受劳苦。"]],[["蜎飞蠕动，","各有配偶。","大小相保，","咸得其所。"],["区区蚊虫飞或走，","个个都有其配偶。","大小相互得保全，","各自得到其所求。"]],[["鬼守我庐，","欲呼伯去。","曾孙寿考，","司命不许，","与生相保。"],["恶鬼守在我家中，","要唤大哥去归阴。","曾孙健康寿命长，","司命之神不应允，","保全生命得长生。"]],[["祸走患伏，","喜为我福。","凶恶消亡，","灾害不作。"],["祸患隐伏逃离远，","福喜来到我身边。","凶事恶事全消除，","灾害不再来作乱。"]],[["麒麟凤凰，","善政德祥。","阴阳和调，","国无灾殃。"],["出麒麟啊现凤凰，","仁政德政呈吉祥。","阳刚阴柔相调和，","国家安宁无灾殃。"]],[["智不别扬，","张狂妄行。","蹈渊仆颠，","伤杀伯身。"],["才智不得乱张扬，","劝哥不要太猖狂。","一旦陷入深渊中，","你身受伤自灭亡。"]],[["凶忧灾殃，","日益明章。","祸不可救，","三郤夷伤。"],["凶患忧愁生灾殃，","日复一日得明彰。","大祸临头难挽救，","三郤大夫遭杀伤。"]],[["长尾蜲蛇，","画地为河。","深不可涉，","无绝以北，","怅然息。"],["一头两身长尾蛇，","地上画出一条河。","河水深深不能涉，","欲达对岸路隔绝，","惆怅叹息难渡过。"]],[["爱我婴女，","牵引不与。","冀幸高贵，","反得贱下。"],["爱我小女来求婚，","三推四拖未答应。","本想觅一高贵婿，","反而嫁给卑贱人。"]],[["凫游江湖，","甘乐其饵。","既不近人，","虽惊不骇。"],["野鸭浮游江与河，","前往寻找好食物。","不去接近观光人，","纵使受惊不困惑。"]],[["明灭光息，","不能复食。","精魄既丧，","以夜为室。"],["身亡如同灯熄灭，","不能使他再复活。","精神灵魂丧失尽，","只有迁居到冥国。"]],[["奇适无偶，","习静独处。","所愿不从，","心思劳苦。"],["单身一人无配偶，","清静孤独把家守。","愿望不遂主人意，","白受劳苦费心思。"]],[["葛藟蒙棘，","华不得实。","谗佞乱政，","使忠雍塞。"],["葛藤处在荆棘中，","纵使开花果不生。","谗佞坏人乱朝政，","忠臣之路不畅通。"]],[["鹊笑鸠舞，","来遗我酒。","大喜在后，","授我龟纽。","龙喜张口，","起拜福祉。"],["喜鹊欢笑斑鸠舞，","送来美酒助我兴。","更有大喜在后头，","得到提升授龟印。","巨龙张开大口笑，","翩翩起舞拜福神。"]],[["摇尾逐灾，","云沉孽除。","洿泥生梁，","下为田主。"],["神龙摇尾逐水害，","驱走雨师未成灾。","低洼地里禾苗旺，","下田主人乐开怀。"]],[["白鹤衔珠，","夜食为明。","膏润优渥，","国岁年丰。"],["仙鹤衔来夜明珠，","吉祥之夜见光明。","甘霖普降润沃土，","全国都有好收成。"]],[["内执柔德，","止讼以默。","宗邑赖德，","祸灾不作。"],["心怀柔德礼义人，","保持沉默止争讼。","宗室依赖其德性，","灾祸不会来逞凶。"]],[["犬吠惊骇，","公拔戈起。","玄冥厌火，","消散瓦解。"],["家狗狂叫人受惊，","主人持戈走出门。","冬月水神讨厌火，","大火被扑熄灭尽。"]],[["公悦妪喜，","子孙俱在。","荣誉日登，","福禄来处。"],["子孙满堂人丁盛，","爷爷奶奶都高兴。","荣誉日日往上升，","福禄天天来家中。"]],[["鸟鸣哺彀，","长欲飞去。","循枝上下，","适与风遇。","颠陨树根，","命不可救。"],["小鸟受哺叫呱呱，","展翅欲飞离开家。","沿着树枝上又下，","不幸遇上狂风刮。","颠崩坠落大树下，","没有谁能挽救它。"]],[["析薪炽酒，","使媒求妇。","和合齐宋，","姜子悦喜。"],["劈柴温酒待媒人，","使她为我去提亲。","齐宋两国得联姻，","男女双方都高兴。"]],[["邻不我顾，","而求玉女。","身多疣癞，","谁当媚者？"],["邻里小伙不爱我，","而向美女去求婚。","身上患有皮肤病，","那位君郎肯接近？"]],[["远视无光，","不知青黄。","黈纩塞耳，","使君暗聋。"],["放眼远望不见明，","青红皂白分不清。","黄色绵球塞耳中，","使君眼瞎耳聩聋。"]],[["克身整己，","逢禹巡狩。","赐我玄圭，","蒙受福祐。"],["克制自我修身心，","时逢大禹来巡行。","送我玉制好礼器，","蒙受大福获大利。"]],[["远望千里，","不见黑子。","离娄之明，","无益于光。"],["遥望千里天外天，","太阳黑子看不见。","离娄眼睛虽明亮，","难以看清其真相。"]],[["斧斤所斫，","疮痏不息。","针石不施，","下即空室。"],["利斧砍过留伤痕，","疮疤疼痛难以忍。","石针医治不顶用，","即将下地入坟茔。"]],[["南田少子，","才略美好。","求我长女，","贱薄不与。","反得丑陋，","后乃大悔。"],["南方有位小伙子，","仪表堂堂有才气。","前来求娶我长女，","歉他贪贱未允许。","弄巧成拙嫁丑夫，","使我后悔来不及。"]],[["失俪后旅，","天门地户。","不知所在，","安止无咎。"],["行进途中失伙伴，","天上地下找不见。","不知伴侣在何方，","安止勿觅无凶险。"]],[["乌孙氏女，","深目黑丑。","嗜欲不同，","过时无偶。"],["乌孙家的大姑娘，","深目黑脸丑模样。","嗜好不同无人求，","超过婚龄没对象。"]],[["伯驾纯骝，","南至东莱。","求索车马，","道阙中止。"],["老大驾起红马车，","南行要去东莱国。","不料交通受阻隔，","行至中途又停歇。"]],[["二女宝珠，","误郑大夫。","交父无礼，","自为作笑。"],["江汉二女佩宝珠，","大夫逢此而失误。","轻薄无礼贪财色，","仙人嘲笑郑交甫。"]],[["阳城太室，","神明所息。","仁居之居，","独无兵革。"],["阳城太室好地方，","神灵安息得修养。","仁人智士居住地，","刀枪兵革永不起。"]],[["大蛇为殃，","使道不通。","岁收鲜少，","年谷败伤。"],["大蛇逞凶造灾殃，","使得道路不通畅。","年成歉收获利少，","谷类作物都败伤。"]],[["三足孤乌，","灵明为御，","司过罚恶。","自残其家，","毁败为忧。"],["王母信使三足乌，","灵验神明任监督，","惩罚过失当先驱。","自害其家自受苦，","毁坏败亡身受辱。"]],[["车虽驾，","两靷绝。","马欲步，","双轮脱。","行不至，","道遇害。"],["驾车欲出行，","断了其靷绳。","马儿欲跨步，","车子脱双轮。","前进不能成，","路上有祸凶。"]],[["郁映不明，","为阴所伤。","众雾集聚，","共夺日光。"],["天色昏暗不明亮，","阳被阴气所贼伤。","层层云雾齐聚集，","夺走明媚太阳光。"]],[["鸱枭，","治成遇灾。","周公勤劳，","绥德安家。"],["奸佞之人来入侵，","扶助成王遇灾凶。","周公勤劳辅朝政，","以德治国家安宁。"]],[["名城德就，","项领不试。","景公耄老，","尼父逝去。"],["名声德行都已成，","颈项肥大不恭听。","景公年迈又昏庸，","孔子离齐而远行。"]],[["一夫两心，","歧刺不深。","所为无功，","求事不成。"],["男子做事不专心，","如同叉刺扎不深。","枉费气力白费功，","求谋百事不能成。"]],[["羿张乌号，","彀射天狼。","柱国雄勇，","败于荥阳。"],["后羿拉开乌号弓，","一箭射向天狼星。","将军纪信雄又勇，","无畏战败荥阳城。"]],[["东家杀牛，","污臭腥臊。","神背西顾，","命衰绝周。"],["东家杀牛欲祭神，","脏臭腥臊味难闻。","神灵皆都向西顾，","殷命已衰周朝兴。"]],[["火起吾后，","喜炙我庑。","苍龙衔水，","泉噀屋柱，","虽忧无咎。"],["大火燃于我身后，","火光直冲屋里头。","青色巨龙口噙水，","清泉喷屋把火救，","虽有小忧无大咎。"]],[["桃雀窃脂，","巢於小枝。","摇动不安，","为风所吹。","寒心慄慄，","常忧危殆。"],["桃雀和那窃脂鸟，","小树枝头筑起巢。","摇晃动荡不安静，","是那风儿太糟糕。","内心寒冷又畏惧，","经常担忧受困扰。"]],[["徒足去域，","飞入东国。","有所畏避，","深藏远匿。"],["徒步出行去远方，","高飞直达那东乡。","心有畏惧远离去，","为避灾祸把身藏。"]],[["琼英朱草，","仁政得道。","凫鹥在渚，","福禄来下。"],["赤玉朱草红艳艳，","仁政大道广又宽。","野鸭鸥鸟在沙滩，","天降福禄保平安。"]],[["陈蔡之危，","从者饥罢。","明德上通，","忧不为凶。"],["陈蔡两地受困厄，","随从弟子饥又饿。","孔子美德通皇天，","纵使有忧也无险。"]],[["春桃生花，","季女宜家。","受福多年，","男为封君。"],["春天桃树欲开花，","小女长大要出嫁。","在家受福已我年，","丈夫是位地方官。"]],[["径邪贼田，","政恶伤民。","夫妇咒诅，","泰山覆颠。"],["小路歪斜伤田埂，","政治暴虐害人民。","夫妻不和相咒骂，","巍巍泰山遭覆倾。"]]],[[["八口九头，","长舌破家。","帝辛沉湎，","商灭其墟。"],["妖怪九头八张口，","破家皆因长舌头。","纣王好酒又好色，","商朝灭亡失掉国。"]],[["鬼守我门，","呼伯入山。","去其室家，","舍其兆墓。"],["恶鬼守在家门前，","呼唤大哥去阴山。","离开自家之门庭，","将要住进坟墓间。"]],[["日出阜东，","山蔽其明。","章甫荐屦，","箕子佯狂。"],["太阳初升于东面，","大山遮住其光线。","帽子当做鞋儿穿，","殷臣箕子装疯癫。"]],[["戴盆望天，","不见星辰。","顾小失大，","福逃墙外。"],["头顶瓦盆去观天，","日月星辰看不见。","只顾小节失大利，","幸福逃到墙外边。"]],[["两轮并转，","南上大阪。","四马共辕，","无有重难，","与语笑言。"],["两只车轮一并转，","向南爬坡上高山。","四马拉套齐努力，","不怕车重行路难，","一路笑语又欢言。"]],[["羊惊狼虎，","耸耳群聚。","行旅稽难，","流连愁苦。"],["羊儿害怕狼与虎，","竖耳恐惧聚一处。","出门旅游遇麻烦，","流连愁苦心不安。"]],[["楩生荆山，","命制输班。","袍衣剥脱，","夏热冬寒。","饥饿枯槁，","众人莫怜。"],["楩树生长在荆山，","命运却在公输班。","去掉枝叶剥掉皮，","熬过夏热和冬寒。","忍饥受饿渐干枯，","众人不用去可怜。"]],[["鸟飞无翼，","兔走折足；","不常其德，","自为羞辱。"],["鸟儿想飞无翅膀，","兔欲逃走脚受伤，","平日不去修德性，","自招羞辱自担当。"]],[["条风制气，","万物出生。","明庶长养，","花叶茂荣。"],["春风把那暖气送，","大地万物得出生。","阳光普照滋养地，","花儿叶子多茂盛。"]],[["坤厚地德，","庶物蕃息。","平康正直，","以缓大福。"],["大地淳厚德高尚，","万物靠她得生长。","平和公正直率人，","世间大福千年享。"]],[["昴毕附耳，","将军乘怒。","经路隔塞，","燕雀惊骇。"],["附耳摇动有奸臣，","将军愤怒斥佞人。","真情难以奏陛下，","谗言只有燕雀怕。"]],[["东风启户，","黔啄翻舞。","各乐其类，","咸得生处。"],["春风吹开我门户，","飞鸟高翔而起舞。","同类相聚多快乐，","得到生息安歇处。"]],[["两足四翼，","飞入家国。","宁我伯姊，","与母相得。"],["两只脚儿四翅膀，","高飞回到我家乡。","安慰我的兄和姐，","一同欢聚母身旁。"]],[["岁暮花落，","阳入阴室。","万物伏匿，","藏不可得。"],["寒冬岁末花叶落，","阳明之气入阴舍。","万物伏藏都隐匿，","身体行迹不可得。"]],[["释然远咎，","避患高阜。","田获三狐，","以贝为宝。","君子所在，","安宁不殆。"],["毅然远离那烦恼，","为避祸患而登高。","打猎获得三只狐，","金钱玉贝是财宝。","德高之人所处地，","平安宁静无忧虑。"]],[["迁延却缩，","不见头目。","日以困急，","不能自复。"],["畏惧退缩不敢前，","藏起头目不露面。","日复一日变危急，","不能自救自复原。"]],[["秋隼冬翔，","数被严霜。","鸡犬夜鸣，","家扰不宁。"],["猛禽深秋高飞翔，","屡屡不幸逢严霜。","鸡狗深夜叫不停，","家受惊扰不安宁。"]],[["班马还师，","以息劳罢。","役夫嘉喜，","户入见妻。"],["士兵战马撤回朝，","调养休息解疲劳。","服役之人有喜讯，","进门见到心上人。"]],[["老杨日衰，","条多枯枝；","爵级不进，","逐下摧𬯎。"],["杨树日渐变衰老，","枝条叶儿皆枯槁；","官位不能得晋升，","日渐困顿失荣耀。"]],[["顺风吹火，","牵骑骥尾。","易为功力，","因惧受福。"],["顺风吹火火势旺，","牵尾乘马向前方。","见机行事事易成，","因祸受福多安详。"]],[["六人俱行，","各遗其囊。","黄鹄失珠，","无以为明。"],["六人一同向前行，","各人行装皆丢尽。","天鹅失去夜明珠，","没有东西来照明。"]],[["仁政不暴，","凤凰来舍。","四时顺节，","民安其居。"],["仁义之政不残暴，","神鸟凤凰来栖息。","春夏秋冬顺时了，","人民欢乐得安居。"]],[["依叔墙隅，","志下心劳。","楚亭晨食，","韩子低头。"],["饥饿穷困依墙隅，","意志低沉心劳愁。","寄食楚亭遭人嫌，","韩信低头向北走。"]],[["三牛生狗，","以戌为母。","荆夷上侵，","姬伯出走。"],["天降灾异牛生狗，","预北戌年有祸咎。","荆地之夷来入侵，","姬伯逢此亦逃走。"]],[["鹤盗我珠，","逃於东都。","鹄怒追求，","郭氏之墟。","不见踪迹，","反为患灾。"],["仙鹤盗走我宝珠，","一路飞逃至东都。","鸿鹄发怒奋起追，","追到郭氏之废墟。","不见鹤鸟之踪影，","反使鸿鹄受累苦。"]],[["南邦大国，","鬼魅满室。","欢声相逐，","为我行贼。"],["南方比邻之国邦，","鬼魅济济聚一堂。","喧嚣狂欢不间断，","为我制造灾和殃。"]],[["鸿鹄高飞，","鸣求其雌。","雄来在户，","雄哺嘻嘻；","甚独劳苦，","炰鳖脍鲤。"],["雄性大雁高飞旋，","一路鸣叫求雌伴。","雌鸟来到雄鸟巢，","雄鸟哺食乐又欢；","孤单独生很劳苦，","庆祝新婚设盛宴。"]],[["褰衣涉河，","水深渍罢。","幸赖舟子，","济脱无他。"],["提起衣裳去过河，","水深湿衣不能涉。","幸亏船夫来搭救，","摆脱危险无灾祸。"]],[["虎啮龙指，","泰山之崖。","天命不佑，","不见其雌。"],["在那泰山悬崖上，","猛虎将那龙指伤。","皇天在上不保佑，","难逢伴侣空悲愁。"]],[["明不处暗，","智不履危。","终日卒岁，","乐以笑歌。"],["明君不去做暗事，","智者不去履险地。","一年到头常欢乐，","兴高采烈多快活。"]],[["三足俱行，","倾危善僵。","六指不便，","慁累弟兄。","树柱阂车，","失其正当。"],["三脚同时迈向前，","顷刻摔倒马路边。","六指做事不方便，","连累兄弟与伙伴。","马路中间立大柱，","车子进退都困难。"]],[["舍车而徒，","亡其驳牛。","虽丧白头，","酒以疗忧。"],["扔掉车子徒步走，","丢了他的大花牛。","虽因丢牛愁白头，","饮酒聊以解忧愁。"]],[["析薪炽酒，","使媒求妇。","和合齐宋，","姜子悦喜。"],["砍柴温酒待媒人，","请求为我去提亲。","齐宋两国得联姻，","男女双方都高兴。"]],[["夜视无明，","不利贾商。","子反笑欢，","与市为仇。"],["黑夜茫茫无亮光，","不利坐贾和行商。","与市为仇真失望，","小人心情却欢畅。"]],[["徒行离车，","冒厌泥途，","利以休居。"],["离开车子徒步行，","冒着险恶走泥泞，","利于安居和休整。"]],[["作室山根，","人以为安。","一夕崩巅，","破我壶飱。"],["房子建在山根前，","人都认为很安全。","一旦山崩泥石落，","使我无饮亦无餐。"]],[["东山西山，","各自言安。","虽相登望，","竟未同堂。"],["山东妹与山西汉，","各自都说自家安。","虽能登山遥相望，","最终双方难团圆。"]],[["君子在朝，","凶言去消。","惊骇逐狼，","不见雄英。"],["忠臣在上理朝政，","凶言灾祸消无影。","提心吊胆追野狼，","不见英雄立新功。"]],[["填填，","火烧山根。","不润我邻，","独不蒙恩。"],["车声轰轰向前行，","大火熊熊烧山根。","天不保佑我近邻，","使其独独不蒙恩。"]],[["南山之蹊，","真人所在。","德配唐虞，","天命为子。","保佑歆享，","身受大庆。"],["南山小道很幽静，","顶端住着道家人。","德行堪配尧和舜，","上天命其为人君。","保佑祭品常享用，","身受大吉大喜庆。"]],[["龙蛇所聚，","大火来处。","泱泱霈霈，","溘溘，","使我无赖。"],["巨龙大蛇所聚处，","乃是大水发源地。","波涛汹涌东流去，","广袤浩瀚无边际，","使我无靠又无依。"]],[["旃裘苫盖，","慕德献服。","边鄙不耸，","以安王国。"],["衣裘裹毡腥膻国，","献出诚意来慕德。","边疆从此无警报，","王室国家都安乐。"]],[["光祀春成，","陈宝鸡鸣。","阳明失道，","不能自守，","消亡为咎。"],["宝物放光如春临，","陈仓深夜雄鸡鸣。","阳明失去其常道，","不能自己守本性，","发散消亡成祸凶。"]],[["下泉苞狼，","十年无王。","荀伯遇时，","忧念周京。"],["泉水冰凉禾不长，","东周十年无君王。","荀伯逢时来治理，","周朝兴衰挂心上。"]],[["任德不暴，","五精就舍。","四序允厘，","民安其居。"],["施行仁德无暴政，","五方星辰列苍穹。","四季顺序而运行，","百姓居之永安宁。"]],[["随和重宝，","众所贪有。","相如睨柱，","赵王危殆。"],["随侯珠与卞和璧，","众人贪婪欲窃取。","相如抱璧立柱旁，","赵王化险获安逸。"]],[["凤生五雏，","长於南郭。","君子康宁，","悦乐身荣。"],["老凤生下五小凤，","南郭五子长成人。","贤士健康又安宁，","心中喜悦身耀荣。"]],[["二人为旅，","俱归北海。","入门上堂，","拜谒王母。","劳赐我酒，","女功悦喜。"],["两人出行结为伴，","一同回到北海边。","步入门庭登上堂，","把我祖母来拜见。","祖母慰劳我美酒，","女功精当心也欢。"]],[["逐忧去殃，","洿泥生梁，","下田为王。"],["逐走忧虑去祸殃，","污泥地中长稻粱，","下等田地变优良。"]],[["东门之墠，","菇藘在孤。","礼仪不行，","与我心反。"],["东门之外场地宽，","坡上茜草多又乱。","男女幽会失礼仪，","与我心意正相反。"]],[["凫遇稻芦，","甘乐鳅，","虽驱不去。"],["野鸭遇上稻谷地，","大麦泥鳅为美食，","虽然驱赶不离去。"]],[["清人高子，","久屯外野。","逍遥不归，","思我慈母。"],["高克率领清邑兵，","御敌长居郊野中。","久戍欲归又不能，","思念慈祥老母亲。"]],[["谗佞所言，","语不成全；","虎狼之患，","不为我残。"],["奸邪小人进谗言，","攻其一点不全面；","猛虎恶狼造祸患，","终未使我受伤残。"]],[["张罗捕鸠，","兔丽其灾。","雌雄俱得，","为网所贼。"],["张开罗网捕斑鸠，","兔子反而成罪囚。","雌雄双双俱得到，","自投罗网失自由。"]],[["安仁尚德，","东邻慕义，","求安吾国。"],["崇尚仁义和道德，","东方邻邦仰慕我，","主动前来安我国。"]],[["猾丑假诚，","前后相违。","言如鳖咳，","语不可知。"],["内心奸诈貌诚实，","前言后语不一致。","说话如同王八咳，","语意含混不可知。"]],[["怀璧越乡，","不可远行。","蔡侯两裘，","久苦流离。"],["怀揣宝玉离家乡，","不可远行去他方。","蔡侯因为两美裘，","流离失所难归邦。"]],[["伯氏归国，","多所恨惑。","车倾盖亡，","身常惊惶。","乃得其愿，","雌雄相从。"],["大哥乘车返回国，","心中悔恨困惑多。","车子翻倒盖毁坏，","身受惊恐畏灾祸。","终究实现其心愿，","夫妻携手同笑歌。"]],[["火石相得，","干无润泽。","利少囊缩，","只益促迫。"],["火势熊熊与石得，","地皮干涸无润泽。","得利太少钱囊瘪，","生活日趋变窘迫。"]],[["君明圣哲，","鸣呼其友。","显德之徒，","可以礼仕。"],["国君贤明又圣哲，","招呼朋友来辅佐。","德高亲信逾千万，","以礼相聘把官做。"]],[["骑豚逐羊，","不见所望。","经涉虎庐，","亡豚失羊。"],["骑上小猪去追羊，","枉费精力难追上。","中途经过老虎洞，","丢了小猪又失羊。"]],[["玄黄虺隤，","行者劳疲。","役夫憔悴，","处子思哀。"],["丈夫脚软肤色黄，","劳累远行累断肠。","服役劳苦面憔悴，","未婚妻子心悲伤。"]],[["右手掩目，","不见长叔。","失其所得，","悔吝相仍。"],["右手遮住自己眼，","大弟在前看不见。","得到东西又失去，","悔恨吝惜实可怜！"]],[["免冠进贤，","步出朝门。","仪体不正，","贼孽为患。"],["脱帽谢罪荐贤能，","随即走出朝廷门。","仪表礼节不周全，","乱贼孽子生灾凶。"]]],[[["穿胸狗邦，","僵离旁舂。","天地易纪，","日月更始。"],["穿胸之国狗邦人，","强迫远离去谋生。","天地变化换纪元，","日月更替万象新。"]],[["从风纵火，","荻芝俱死。","三害集房，","十子中伤。"],["随风放火大火起，","芦狄芝兰都烧死。","三害聚集同一室，","十人全部受灾异。"]],[["北山有枣，","橘柚所聚。","荷囊载担，","香盈筐筥。"],["北山枣树多茁壮，","橘树柚树长一旁。","背负口袋肩挑担，","香味充满篮和筐。"]],[["赍贝赎狸，","不听我辞。","系于虎须，","牵不得来。"],["怀揣金钱去赎狐，","朋友不听我劝阻。","将狐系于虎须上，","牵之不来枉受苦。"]],[["上下惟邪，","寡妇无夫。","欢心隔塞，","君子离居。"],["从上到下风不正，","寡妇无夫闺房空。","欢心之事不见来，","男士离家似浮萍。"]],[["二人辇车，","徙去其家。","井沸釜鸣，","不可安居。"],["夫妻二人拉车行，","远远搬离自家门。","家中井沸锅又鸣，","在此居住不安宁。"]],[["蹇驴不材，","骏骥失时。","筋力劳尽，","疲于沙丘。"],["跛脚毛驴路难行，","好马也将力使尽。","精疲力竭甚劳累，","停留沙丘难前进。"]],[["明夷兆初，","为穆出郊。","以谗复归，","名曰竖牛。","剥乱叔孙，","馁于虚丘。"],["明夷预兆有灾难，","穆子慌忙而逃窜。","返鲁为卿信谗言，","庶子竖牛欲夺权。","乘穆之危造事端，","叔孙一命丧黄泉。"]],[["天火大起，","飞鸟惊骇。","作事不时，","自为身咎。"],["漫天大火迎风烧，","鸟儿受惊皆飞逃。","行事错过好时机，","自找麻烦受煎熬。"]],[["土与山连，","共保岁寒。","终无灾患，","万事长安。"],["黄土与山紧相连，","一起共度冬日寒。","终于没有灾与患，","千事万事都平安。"]],[["日出阜东，","山蔽其明。","章甫荐履，","其子佯狂。"],["太阳初升于东山，","大山遮住其光线。","帽子当做鞋儿穿，","殷臣箕子装疯癫。"]],[["罢马上山，","绝无水泉。","喉焦唇干，","口不能言。"],["骑乘疲马上高山，","一路不见有水泉。","喉咙焦渴嘴唇干，","舌头难转口难言。"]],[["雄处弱水，","雌在海滨。","将别持食，","悲哀于心。"],["小伙在那弱水岸，","少女居之东海边。","离别时刻食难咽，","悲伤哀怜涌心田。"]],[["庭燎夜明，","追古伤今。","阳弱不制，","阴雄坐戾。"],["火炬照庭亮又明，","追怀远古感叹今。","阳气微弱失其制，","阴孽称雄造灾凶。"]],[["三妇同夫，","忽不相思。","志恒悲愁，","颜色不怡。"],["三个女子共一夫，","互相怠慢不关顾。","内心长久怀悲苦，","面色憔悴无欢愉。"]],[["鹤盗我珠，","逃于东都。","鹄怒追求，","郭氏之墟。","不见踪迹，","反为患灾。"],["野鹤盗走我宝珠，","逃之夭夭至东都。","天鹅愤怒去追赶，","径直追到郭氏墟。","最终未见其踪迹，","反而招来大灾异。"]],[["猕猴冠带，","盗载非位。","家犬共吠，","狂走蹶足。"],["高冠博带猕猴辈，","盗窃权柄居高位。","众狗狂吠猴心怯，","仓皇奔逃跌坏腿。"]],[["黍稷禾稻，","垂亩方好。","中旱不雨，","伤风病稿。"],["糜子谷子和水稻，","实饱穗垂长势好。","中期天旱不下雨，","热风吹伤全枯槁。"]],[["雄圣伏名，","人匿麟远。","走凤飞北，","乱祸未息。"],["圣人隐姓埋其名，","人匿麒麟也远遁。","凤凰向北飞离去，","天下动乱不安宁。"]],[["王母多福，","天禄优伏。","居之宠光，","君子有福。"],["年老祖母多福寿，","天赐福禄来保佑。","居住之地显宠光，","好人受福多吉祥。"]],[["被服文德，","升入大麓。","四门雍肃，","登受大福。"],["美好德性集于身，","大舜职位得荣升。","四方之门多庄严，","高官厚禄永无穷。"]],[["褰裳涉河，","水流渍衣。","幸赖舟子，","济脱无他。"],["提起衣服欲过河，","水深湿衣难渡涉。","幸亏遇上小木船，","脱险平安达对岸。"]],[["行触大讳，","与司命忤。","执囚束缚，","拘制于吏；","幽人有喜。"],["行为越轨犯大忌，","事与司命相违逆。","沦为囚犯受束缚，","君子受制于小吏；","隐居之人有喜事。"]],[["班马还师，","以息劳疲。","役夫嘉喜，","入户见妻。"],["士兵战马撤回朝，","调养休息解疲劳。","服役之人心中喜，","入门见到他爱妻。"]],[["东邻嫁女，","为王妃后。","庄公筑馆，","以尊王母。","归于京师，","季姜悦喜。"],["东边邻国出嫁女，","做了桓王的正室。","庄公城外筑新馆，","以示尊崇周王姬。","嫁至周都洛邑城，","季姜心中很欢喜。"]],[["百足俱行，","相辅为强。","三圣翼事，","王室宠光。"],["百足之虫齐行动，","相辅相依力强盛。","三圣共同来辅佐，","王室荣耀显尊宠。"]],[["危坐至暮，","请求不得。","膏泽不降，","政戾民忒。"],["正襟危坐到天黑，","请求之事未能得。","恩泽不及百姓身，","政治暴戾民困惑。"]],[["百川朝海，","泛流不止。","路虽辽远，","无不到者。"],["百川向着大海流，","汹涌澎湃永不休。","道路虽然很遥远，","顺利到达无危难。"]],[["乘骝驾骊，","东至于齐。","遭遇仁友，","送我以资，","厚得利归。"],["骑乘黑马驾着车，","一路东行到齐国。","遇见仁义好朋友，","送我丰厚钱财物，","得利而归多快活。"]],[["礼坏乐崩，","成子傲慢。","欲求致理，","力疲心烂。","阴请不当，","为简生殃。"],["朝中礼乐受摧残，","成子骄傲又怠慢。","欲想治理难实现，","精疲力竭碎心肝。","阴情请托不正当，","齐国简公生灾殃。"]],[["三人辇车，","乘入虎家。","王母贪叼，","盗我犁牛。"],["三人同拉一辆车，","不慎来到老虎窝。","王母如虎甚贪婪，","我的耕牛被盗窃。"]],[["羊头兔足，","少肉不饱。","漏囊败粟，","利无所得。"],["小小羊头和兔脚，","骨多肉少太干瘪。","破漏口袋盛谷子，","大利远去不能得。"]],[["新田宜粟，","上农得谷。","君子唯好，","以干百福。"],["新垦田地宜种谷，","勤劳多获好农夫。","君子是位耿直人，","由此得到福与禄。"]],[["夷羿所射，","发辄有获。","双凫俱得，","利以伐国。"],["夏代夷羿善弓射，","百发百中有收获。","两只野鸭俱得到，","适于前去伐敌国。"]],[["凫舞鼓翼，","喜乐尧德。","虞夏美功，","要荒宾服。"],["野鸭展翅而起舞，","欢天喜地颂尧德。","创建虞夏功绩大，","四方黎民归服我。"]],[["登丘上山，","对酒道欢。","终年卒岁，","优福无患。"],["登上土丘爬上山，","痛饮美酒又欢言。","辞别旧岁迎新年，","优裕幸福无灾患。"]],[["岁暮花落，","阳入阴室。","万物伏匿，","藏不可得。"],["寒冬岁末花叶落，","阳明之气入阴舍。","万物伏藏都隐匿，","身体行迹不可得。"]],[["螟虫为贼，","害我禾谷。","箪瓶空虚，","饥无所食。"],["田间螟虫造灾殃，","我家稻谷遭残伤。","碗中空空无食物，","忍饥挨饿没有粮。"]],[["阳虎胁主，","使德不通。","炎离为殃，","年谷病伤。"],["阳虎威胁鲁国君，","使得仁德不畅通。","烈日炎炎旱灾凶，","谷物病伤无收成。"]],[["四马共辕，","东上泰山。","骍骊同力，","无有重难，","与君笑言。"],["四马驾辕同向前，","一路东行上泰山。","红马黑马齐努力，","没有困苦与艰难，","与君谈笑又欢言。"]],[["牧羊稻园，","闻虎喧欢。","畏惧悚息，","终无祸患。"],["放牧羊儿稻田间，","忽然听见虎声喧。","畏惧害怕而警惕，","终究没有遇灾患。"]],[["扬华不时，","冬实生危。","忧多横贼，","生不能服；","昆仑之玉，","所求必得。"],["花儿不按季节开，","冬日结果生危害。","忧虑重重横祸至，","生活当中少愉快；","昆仑山中有宝物，","前往寻求必能得。"]],[["高阜所在，","阴气不临。","洪水不处，","为家利宝。"],["地势高高丘陵区，","阴气不临不潮湿。","洪水奔流不到此，","风水宝地利安居。"]],[["释然远咎，","避患高阜。","田获三狐，","以贝为宝。","君子所在，","安宁不殆。"],["坦然抛开那灾难，","远离困惑与忧患。","打猎获得三只狐，","换回宝物和金钱。","贤人所处之圣地，","平安宁静无危险。"]],[["两目失明，","日夺无光。","胫足跛曳，","不可以行，","顿于丘旁。","亡妾莫逐，","嵬然独宿。"],["两只眼睛都失明，","如日夺光不照临。","腿伤脚跛拖拉走，","步履艰难不能行，","困顿累倒山丘中。","小妾逃走难追回，","单身独睡心烦闷。"]],[["鸿飞循陆，","公出不复，","伯氏客宿。"],["大雁沿着陆地飞，","老父出走未返回，","大哥独自客店睡。"]],[["佩玉累橤，","无以系之。","孤悲独处，","愁哀相忧。"],["佩玉累累垂下地，","无法把它来串系。","处境孤独甚痛苦，","愁哀使人生忧虑。"]],[["载船渡海，","虽深何咎。","孙子俱在，","不失其所。"],["乘坐船儿渡大海，","海水虽深却无灾。","儿子孙子全都在，","不失居所好欢快。"]],[["鹄求鱼食，","道遇射弋。","缯加我颈，","缴缚两翼。","欲飞不能，","为羿所得。"],["天鹅外出寻食粮，","途中遭逢利箭伤。","短箭扎在脖子上，","丝绳缠住它翅膀。","欲想高飞又不能，","终被后羿获手中。"]],[["泥面乱头，","忍耻少羞，","日以削消。"],["面带污垢蓬着头，","忍着耻辱含着羞，","日复一日渐消瘦。"]],[["桑之将落，","陨其黄叶；","失势倾倒，","如无所立。"],["桑树衰老枝败折，","飘零坠下其黄叶；","官人失势倒一侧，","立足之地不能得。"]],[["巨蛇大鳅，","战于国郊。","上下隔塞，","主君走逃。"],["飞蟒遇到大泥鳅，","国都郊外相搏斗。","上下隔绝不通畅，","君主败北而逃走。"]],[["己动死，","连商子。","扬沙石，","狐貉扰。","军鼓振，","吏士苦。"],["自己妄动送了命，","灾祸连及商鞅身。","飞沙走石北风吹，","狐貉之辈扰我城。","军鼓声声震长空，","官兵受苦又受恐。"]],[["张罗捕鸠，","兔丽其灾。","雌雄俱得，","为网所贼。"],["张开大网捕斑鸠，","兔子反而成罪囚。","雌雄双双全捕获，","自投罗网失自由。"]],[["三圣相辅，","鸟兽喜舞。","安乐富有，","二人偕偶。"],["三位圣人来辅助，","百鸟欢欣又起舞。","安宁快乐且富有，","夫妻双双多和睦。"]],[["三奇六耦，","相随俱市。","王孙善贾，","先得利宝；","居止不安，","大盗为咎。"],["奇数为三偶数六，","相随前往集市游。","王孙善于做生意，","先得好远利丰厚；","居室不能得平安，","盗贼猖獗成凶咎。"]],[["三人俱行，","一人言北，","伯仲欲南，","少叔不得。","中路分道，","争斗相贼。"],["兄弟三人同向前，","老三说要去北面，","老大老二欲往南，","老三不听他们言。","走到半路要分手，","途中打架相伤残。"]],[["播天舞，","光地乳。","神所守，","乐无咎。"],["传播天地宫廷舞，","光及东南之地乳。","神灵在上作守护，","使我欢乐多幸福。"]],[["坐争立讼，","纷纷汹汹。","卒成祸乱，","灾及家公。"],["坐立不安起争讼，","整日匆忙势汹汹。","终于造成大祸乱，","殃及家中老父亲。"]],[["蛇行蜿蜒，","不能上阪。","履节安居，","可以无忧。"],["大蛇爬行曲又弯，","不能上坡越山关。","循规蹈矩不离垣，","可以解忧免灾患。"]],[["隙大墙坏，","蠢众木折。","狼虎为政，","天降罪罚。","高杀望夷，","胡亥以毙。"],["裂缝渐大坏墙壁，","蛀虫众多木受蚀。","虎狼之辈理朝政，","老天降罪罚过失。","赵高行凶在望夷，","胡亥遇难命归西。"]],[["阳不违德，","高山多泽。","颜子逐兔，","未有所得。"],["正大光明不违德，","形如高山多润泽。","圣人颜回追兔子，","最终什么也未得。"]],[["心多畏恶，","时愁日惧。","虽有小咎，","终无大悔。"],["心中频频生畏惧，","经常发愁不安逸。","虽有区区小危难，","终于没有大祸患。"]],[["众神集聚，","相与议语","南国虐乱，","百姓愁苦。","兴师征伐，","更立贤主。"],["仁人智士聚一起，","相互谈论和商议","南方国中起暴乱，","黎民百姓生愁思。","带领军队去征伐，","重立贤君整秩序。"]]],[[["任武负力，","东征不伏。","蹈泥履涂，","雄师败覆。"],["实力不足好逞强，","出兵东征去打仗。","路上陷入泥沼地，","精锐大军吃败仗。"]],[["义不胜情，","以欲自营。","觊利危躬，","折角摧颈。"],["义理不能制情欲，","投机钻营谋私利。","纵欲过度危自身，","断了头脚折脖颈。"]],[["悬貆素餐，","食非其任。","失舆剥庐，","休坐徙居，","室家何忧？"],["不去打猎家有貆，","不去种田食有餐。","丢车弃官去故里，","隐居生活多悠闲，","家中能有何忧患？"]],[["鹠鸱娶妇，","深目窈身。","折腰不媚，","与伯相背。"],["鸱鸺娶得新妇来，","双目深陷小身材。","腰弓面丑无媚态，","夫妻感情合不来。"]],[["东风解冻，","河川流通。","西门子产，","升擢有功。"],["东风劲吹冰解冻，","江河大川水流通。","西门子产立了功，","荐举提拔得重用。"]],[["三足俱行，","倾危善僵。","六指不便，","慁累弟兄。","树柱阂车，","失其正当。"],["三脚行走甚艰难，","前跌后绊有危险。","六指行事不灵便，","累及兄弟姊妹间。","马路中间立大柱，","车子不能驰向前。"]],[["京庾积仓，","黍稷以兴。","极行疾至，","以餍饱食。"],["露天谷仓装满粮，","田里庄稼长势旺。","疾行快走到此地，","衣食丰足赛小康。"]],[["南山之蹊，","真人所在。","德配唐虞，","天命为子。","保佑歆享，","身受大庆。"],["南山小道很幽静，","顶端住着道家人。","德性堪比尧和舜，","上天命其为人君。","保佑祭祀长享用，","身受大吉大喜庆。"]],[["车驰人趋，","卷甲相仇。","齐鲁寇战，","败于犬丘。"],["车儿飞驰人急赶，","轻装疾行去酣战。","齐鲁两国结仇怨，","败于犬丘受伤残。"]],[["十五许室，","柔顺有德。","霜降既嫁，","文以为合。","先王日至，","不利出域。"],["年方十五许给人，","德性温柔又顺从。","霜降时节要过门，","八字合配宜订婚。","先王冬至有其训，","日辰不利莫出行。"]],[["任力劣薄，","远讬邦国；","辅车不强，","为痈所伤。"],["才智能力都薄弱，","受托远行难治国；","颊骨齿床不强壮，","口生毒疮难动作。"]],[["千载旧室，","将有困急。","荷粮负囊，","出门直北。"],["千年旧室太破敝，","将有困难和危急。","背上干粮和行囊，","出门径直逃远方。"]],[["凶忧灾殃，","日益明章。","祸不可救，","三郤夷伤。"],["凶患忧愁生灾殃，","日复一日得明彰。","大祸临头难挽救，","三郤大夫遭杀伤。"]],[["冠危戴患，","身惊不安。","与祸驰逐，","凶来入门。"],["高官倾危招祸患，","自身受惊心不安。","才将灾祸驱逐走，","又有凶来踏门槛。"]],[["虎狼并处，","不可以仕。","忠谋辅政，","祸必及己。","退隐深山，","身及不殆。"],["君与虎狼并排坐，","不可出仕把官做。","忠心谋划辅朝政，","自己反而招大祸。","退隐深山老林中，","能保身心不受挫。"]],[["卵与石斗，","糜碎无处。","挈瓶之使，","不为忧惧。"],["手执鸡蛋碰石头，","糜碎破烂把它丢。","垂瓶打水一小智，","不用为之而担忧。"]],[["五心六意，","歧道多怪。","非君本志，","生我恨悔。"],["三心二意神不定，","岔道争讼各自行。","虽然并非君本意，","却又让我生悔恨。"]],[["雨雪载涂，","东行破车。","旅人无家，","利益咨嗟。"],["大雪纷纷乘着车，","东行途中车儿破。","流浪汉子无室舍，","利益不见徒奔波。"]],[["尚利坏义，","月出平地。","国乱天常，","咎征灭亡。"],["追名逐利毁坏义，","如同晨月出平地。","国家动乱不可治，","天灾人祸都临至。"]],[["东行破车，","步入危家。","衡门穿射，","无以为主。","卖袍续食，","糟糠不饱。"],["向东逃荒车儿破，","走进一家破室舍。","陋屋木门墙穿洞，","不见主人无食物。","卖掉袍子换饭吃，","糟糠充饥难解饿。"]],[["逐禽出门，","并失玉丸。","往来井上，","破甑缺盆。"],["出门追鸟又猎禽，","佳好弹丸全用尽。","往来井上去取水，","打破罐子和瓦盆。"]],[["孟春醴酒，","使君寿考。","南山多福，","宜行贾市。","稻粱雌雉，","所至利喜。"],["孟春三月品美酒，","使君健康又长寿。","南山之上多福利，","适合集市做生意。","稻粱引得野鸡来，","所到之处有利喜。"]],[["持刃操肉，","对酒不食。","夫亡从军，","少子入狱，","抱膝独宿。"],["利刀切肉心不宁，","不思饮食悲愁生。","丈夫出门去当兵，","儿子因祸入狱中，","抱膝独宿很伤心。"]],[["周师伐纣，","克于牧野。","甲子平旦，","天下悦喜。"],["周军起兵伐暴纣，","开赴牧野去战斗。","甲子清晨获胜利，","天下百姓乐悠悠。"]],[["踦牛伤暑，","不能成亩。","草莱不辟，","年岁无有。"],["跛脚耕牛又中暑，","不能下地犁田亩。","草坡荒滩难开垦，","一年到头无收成。"]],[["南邦大国，","鬼魅满室。","欢声相逐，","为我行贼。"],["南方比邻之国邦，","鬼魅济济聚一堂。","喧嚣狂欢不间断，","为我制造灾和殃。"]],[["噂噂所言，","莫如我垣。","欢乐坚固，","可以长安。"],["你言我语乱纷纷，","信念不如我坚定。","防守牢固人欢乐，","身心长乐久安宁。"]],[["尧舜禹汤，","四圣敦仁。","允施德音，","民安无穷；","旅人相望，","未同朝乡。"],["唐尧虞舜和禹汤，","四圣仁德美名扬。","德政遍施普天下，","人民欢乐又安康；","行人隔山相遥望，","未能一同朝故乡。"]],[["桎梏拘获，","身入牢狱。","髡刑受法，","终不得释。","耳闭道塞，","求事不得。"],["脚镣手铐遭囚禁，","身受其殃入狱中。","剃去头发受髡刑，","最终不得出牢门。","耳目闭塞冤难申，","所求之事都不成。"]],[["桀跖并处，","民困愁苦。","行旅迟迟，","流连齐鲁。"],["夏桀盗跖聚一处，","百姓穷困又愁苦。","道路处处不畅通，","行人无法离齐鲁。"]],[["求鸡获雉，","买鳖失鱼。","出入均敌，","利得无余。","齐姜宋子，","婚姻孔喜。"],["前往求鸡获野鸡，","买到大鳖失了鱼。","收支平衡两相抵，","获得利益剩无几。","齐宋两国女孩子，","婚姻美满大吉利。"]],[["雨师驾驷，","风伯吹云；","秦楚争强，","施不得行。"],["雨神驾起车儿行，","风神吹走降雨云；","秦楚两国争强盛，","实施之事行不通。"]],[["仲冬无秋，","鸟鹊饥忧。","困于米食，","数惊鹯雕。"],["寒冬季节无秋草，","鸟鹊忍饥受煎熬。","困于米粒无食物，","屡屡受惊于鹰雕。"]],[["三羝上山，","俱至阴安。","遂到南阳，","见其芝香。","两崖相望，","未同枕床。"],["三只公羊上山冈，","行至山北不见阳。","随即转道去南坡，","逢那芝兰飘清香。","隔着悬崖遥相望，","无法相聚同枕床。"]],[["飞至日南，","还归辽东。","雌雄相从，","和鸣雍雍，","解我胸舂。"],["候鸟深秋南飞行，","春暖花开归辽东。","雌雄相随不分离，","鸣声和谐又动听，","解我忧愁与烦闷。"]],[["尧饮舜舞，","禹拜上酒。","礼乐所丰，","可以安处，","保我淑女。"],["尧舜欢舞又痛饮，","大禹跪拜把酒敬。","礼乐之邦年岁丰，","可以安居修身心，","保我淑女纯洁名。"]],[["大一置酒，","乐正起舞。","万福攸同，","可以安处，","绥我齿。"],["太一设宴来欢庆，","鼓乐起舞助我兴。","万民共享人间福，","可以平安久相处，","使我老人得安抚。"]],[["白马骝，","生乳不休。","富我商人，","得利饶优。"],["白马红马黄毛马，","生殖繁衍数量大。","富了我这经商人，","得到利益饶又丰。"]],[["宛马疾步，","盲师坐御。","目不见路，","中止不到。"],["大宛骏马行走疾，","盲眼车夫在驾驭。","双目失明不见路，","最终未达目的地。"]],[["春桃萌生，","万物华荣。","邦君所居，","国乐无忧。"],["春天桃树发了芽，","万物复苏尽开花。","君王居住好地方，","国家安乐无凶煞。"]],[["把珠入口，","蓄为玉宝。","得吾所用，","欣然嘉喜。"],["手执宝珠放入口，","保君康宁又长寿。","得到我所企求物，","兴高采烈乐悠悠。"]],[["襦烧袴燔，","臝剥饥寒，","病疟冻挛。"],["短袄长裤全烧完，","赤身裸体受饥寒，","身患疟疾冻痉挛。"]],[["水沫沉浮，","沮湿不居，","为心疾忧。"],["水沫上下沉又浮，","屋子潮湿不能住，","心情忧愁又痛苦。"]],[["行如桀纣，","虽祷不佑。","命绝衰周，","文君乏祀。"],["行事如同桀和纣，","纵使求神亦不佑。","大命衰微周绝祀，","文王孤身没有后。"]],[["蜱蜉戴盆，","不能上山。","脚摧跛蹶，","损伤其颜。"],["蚂蚁头上顶瓦盆，","不自量力爬山行。","腿脚折断又伤腰，","头破血流事不成。"]],[["长子入狱，","妇馈母哭。","霜降愈甚，","向晦伏法。"],["长子犯罪坐监狱，","儿媳送饭母哭泣。","霜降以后祸更凶，","月底之前命归西。"]],[["求犬得兔，","请新遇故。","虽不当路，","逾吾旧舍。"],["欲想得狗却获兔，","去会新友喜逢故。","虽然没有走正路，","越过我的原住处。"]],[["鸟鸣葭端，","一呼三颠。","动摇东西，","危而不安。","灵祝祷祉，","疾病无患。"],["鸟雀鸣叫芦苇端，","呼一声来颠三颠。","东倒西歪乱摇摆，","岌岌可危不安全。","祈求神主来保佑，","虽得疾病无后患。"]],[["天厌禹德，","命兴汤国。","祓社衅鼓，","以除民疾。"],["皇天厌恶禹之德，","降命商汤兴邦国。","祭天立誓伐暴君，","解民倒悬除凶祸。"]],[["阴雾作匿，","不见白日。","邪径迷道，","使君乱惑。"],["阴云浓雾皆遮蔽，","白昼不见好天日。","羊肠小道迷正路，","使君困惑生忧思。"]],[["猿堕高木，","不踒手足。","握珠怀玉，","还归我室。"],["猴从树上坠下地，","没有跌伤手和足。","手执宝珠怀揣玉，","返回我的旧居室。"]],[["三骊负衡，","南取芝香。","秋兰芬馥，","盈满箧筐，","利我少姜。"],["三匹黑马拉车忙，","前去南国采芝香。","秋兰芬芳味浓郁，","盛满木匣装满筐，","利我姜家小姑娘。"]],[["春生夏乳，","羽毛成就。","举不失宜，","君臣相好。","盗走奔北，","终无有悔。"],["春天出生夏受哺，","长大就成丰毛羽。","举止得当没失误，","君臣相处很和睦。","盗贼纷纷逃向北，","终于无悔无事故。"]],[["东行破车，","远反失家。","天命讫终，","无所祷凶。"],["东去车破路难行，","返眺远方无亲人。","苍天不再保佑我，","怎么祷告也是凶。"]],[["九雁列阵，","雌独不群。","为罾所牵，","死于庖人。"],["九只大雁齐飞行，","一只雌雁离其群。","终于落入猎人网，","死于厨师之手中。"]],[["二人辇车，","徙去其家。","井沸釜鸣，","不可以居。"],["夫妻二人拉车行，","远远搬离自家门。","井水沸腾锅又鸣，","在此居住不安宁。"]],[["闭塞复通，","与善相逢。","甘棠之人，","解我忧凶。"],["闭塞之路得畅通，","君子遇到善良人。","召公断案最公正，","解除我的忧和凶。"]],[["赋敛重数，","政为民贼。","杼轴空虚，","去其家室。"],["聚敛无度赋税重，","暴政残酷害人民。","织机空空无布织，","背井离乡难生存。"]],[["怒非其愿，","贪妨腐鼠。","而呼鹊鸱，","自令失饵，","致被殃患。"],["怒气并非随愿出，","只为贪得一腐鼠。","呼叫喜鹊鹞鹰来，","自失食物无觅处，","受尽灾殃吃尽苦。"]],[["簪短带长，","幽思穷苦。","瘠貌小瘦，","以病疾降。"],["发簪短而衣带长，","幽思穷苦心悲伤。","身体越来越虚弱，","疾病如魔从天降。"]],[["三人俱行，","各别采桑，","蕴其筐筥。","留我嘉旅，","得归无咎，","四月来处。"],["三人一同向前方，","各持筐篮去采桑，","装满方筐和圆筐。","主人留我长居住，","回来探家无事故，","到了四月又相处。"]],[["逐鸠南飞，","与喜相随。","并获鹿子，","多得利归，","虽忧不危。"],["追赶鸠鸟向南飞，","君与喜事紧相随。","额外又获一小鹿，","得到厚利而回归，","虽有小忧却无危。"]],[["驱羊南行，","与祸相逢。","狼惊吾马，","虎盗我子，","悲恨自咎。"],["赶着羊群向南去，","不料与祸而相遇。","恶狼惊了我的马，","老虎盗走我儿子，","满腔悲愤怨自己。"]],[["东邻西国，","福喜同乐。","出得随珠，","留获和玉，","俱利有息。"],["东方西方两邻国，","同庆福喜齐欢乐。","出门获得随侯珠，","居之又得和氏璧，","好事成双有利息。"]]],[[["儋耳穿胸，","僵离旁舂。","天地易纪，","日月更纪；","蝮螯我手，","痛为吾毒。"],["儋耳族和穿胸族，","强迫与我远分离。","天地变换更世纪，","日月交替从头始；","蝮蛇咬伤我的手，","中毒痛彻我肢体。"]],[["慈母之恩，","长大无孙。","消息襁褓，","害不入门。"],["慈母养育有厚恩，","儿子长大尚无孙。","襁褓婴儿早护理，","无后之害不入门。"]],[["伪言妄语，","转相诖误。","道左失迹，","不知狼处。"],["胡言乱语无根据，","辗转相传误大事。","岔道旁边失踪迹，","不知恶狼去何地。"]],[["郁不明，","阴积无光。","日在北陆，","万物凋藏。"],["天气阴沉不明亮，","阴云积聚无日光。","寒冬太阳匿北陆，","植物凋零动物藏。"]],[["王母多福，","天禄所伏。","居之宠光，","君子有昌。"],["年老祖母多福寿，","全靠上天来保佑。","居住之地有宠光，","好人事业得盛昌。"]],[["不耕而获，","家食不给。","中女无良，","长子跛足。","疏齿善市，","商人有喜。"],["没有耕作无收获，","家中存粮不太多。","女儿懒惰不干活，","长子腿瘸脚又跛。","年老疏齿做生意，","善于经营获大利。"]],[["火起上门，","不为我残。","跳脱东西，","独得生完；","不利出邻，","病疾忧患。"],["大火熊熊扑上门，","殃祸未及我的身。","东奔西走急躲藏，","独得保全我性命；","不利出门去求人，","邻家疾患更严重。"]],[["持刀操肉，","对酒不食。","夫亡从军，","长子入狱，","抱膝独宿。"],["持刀切肉心不静，","面对佳肴悲愁生。","丈夫离家去当兵，","长子因祸入狱中，","抱膝独宿很伤心。"]],[["鳅虾去海，","游于枯里。","街巷迫狭，","不得自在。","南北四极，","渴馁成疾。"],["泥鳅大虾离大海，","游到乡村枯里来。","大街小巷狭又窄，","东游西荡不自在。","四处碰壁无处逃，","饥渴交加成病灾。"]],[["哑哑笑语，","与欢饮酒。","长乐行觞，","千秋起舞，","拜受大福。"],["咿咿哑哑笑又语，","同来饮酒同欢聚。","举杯痛饮长快乐，","岁岁载歌又载舞，","拜谢接受神赐福。"]],[["登高上山，","宾于四门，","吾士得欢，","福为我根。"],["登高上山进了城，","明堂四门迎贵宾。","我和随从都高兴，","在此所下幸福根。"]],[["天厌周德，","命我南国。","以礼静民，","兵革休息。"],["上天厌恶周之德，","命我前往治南国。","以礼安抚老百姓，","不起动乱无战祸。"]],[["壅遏堤防，","水不得行。","火光盛阳，","阴霓伏藏，","走归其乡。"],["河道之中筑堤防，","水路壅塞不畅通。","骄阳似火大旱临，","彩虹不见都潜藏，","奔走返回其故乡。"]],[["河海都市，","国之奥府。","商人受福，","少子玉食。"],["河海流域大都市，","乃是邦国之宝地。","商人买卖盈大利，","孩童锦衣又玉食。"]],[["东行避兵，","南去不祥，","西逐凶恶，","北迎福生，","与喜相逢。"],["向东逃避躲兵荒，","向南行事不吉祥，","向西驱逐凶恶去，","向北迎接我福王，","恰与喜庆逢路上。"]],[["东家有女，","嫫母最丑。","三十无室，","媒伯劳苦。"],["东邻家中二姑娘，","容貌丑陋不漂亮。","年过三十未出嫁，","媒人劳苦也白忙。"]],[["破亡之国，","无所不福，","难以止息。"],["破败灭亡之国家，","上天也不保佑它，","难以在此安置家。"]],[["骖驾蹇驴，","日暮失时。","居者无忧，","保我乐娱。"],["驾车用了跛脚驴，","天黑未达目的地。","安居家中无忧虑，","保我快乐又欢娱。"]],[["充侧，","佞幸倾惑。","女谒横行，","正道雍塞。"],["阴霓充斥天边上，","佞臣迷惑我君王。","女谒横行宫廷中，","正道堵塞不畅通。"]],[["三羖五牂，","相随俱行，","迷入空泽，","循谷直北。","经涉六驳，","经涉六为伤所贼。"],["三公五母八只羊，","结伴同行在路上。","进入大泽迷方向，","循谷往北上山冈。","路途经过六地，","都被猛兽所贼伤。"]],[["戴喜抱子，","与利为友。","天之所命，","不忧危殆。","荀伯劳苦，","西来王母。"],["满怀喜悦得贵子，","与利为友招福气。","上天赐予好命运，","没有危险和灾异。","荀伯收养多辛苦，","王母自西来辅助。"]],[["织缕未就，","针折不复。","女工多能，","乱我政事。"],["机上织布尚未成，","针折线断难为功。","女子干预邦国事，","结果搞乱我朝政。"]],[["行露之讼，","贞女不行。","君子无食，","使道雍塞。"],["《召南·行露》之诉讼，","贞洁少女遇佞人。","好人常被坏人欺，","正道受阻不畅通。"]],[["羿张乌号，","彀射天狼。","钟鼓不鸣，","将军振旅。","柱国雄勇，","斗死荥阳。"],["后羿拉开乌号弓，","一箭射向天狼星。","钟声鼓声皆不鸣，","将军悄悄去出征。","纪信英勇多顽强，","无畏战死荥阳城。"]],[["夏台羑里，","汤文厄处。","皋陶听理，","岐人悦喜。","西望华首，","东归无咎。"],["夏台之地和羑里，","商汤文王坐牢狱。","皋陶前来断官司，","岐地人民心悦喜。","西望华山首阳山，","返回东营无灾异。"]],[["延颈望酒，","不入我口。","商人劳苦，","利得无有。","夏台羑里，","虽危复喜。"],["伸长脖子望着酒，","美酒不入我的口。","行商之人虽劳苦，","一分薄利都没有。","商汤文王坐牢狱，","虽有危险终来喜。"]],[["冠带南游，","与喜相期。","邀于嘉国，","拜位逢时。"],["衣冠楚楚南国去，","恰好遇上大喜事。","礼仪之邦来邀请，","走运封予我官职。"]],[["东西触垣，","不利出门。","鱼藏深水，","无以乐宾。","爵级摧颓，","光威减衰。"],["东奔西走碰墙壁，","出门远行不吉利。","鱼儿潜藏在水底，","招待宾客无鲜鱼。","贬了官职降了级，","荣耀威风尽扫地。"]],[["两母十子，","转息无已。","五乳百雏，","骍驳骊驹。"],["两匹母马产十驹，","繁衍生育无止息。","到了五代成百匹，","赤马花马小黑驹。"]],[["重黎祖后，","司马太史。","阳氏之灾，","雕宫悲苦。"],["重黎祖先的后人，","乃是司马太史公。","遭受绝育之宫刑，","身居宫廷生悲愤。"]],[["内执柔德，","止讼以默。","宗邑赖福，","祸灾不作。"],["善用柔德感化人，","保持沉默息争讼。","家族乡亲受福佑，","没有祸患与灾凶。"]],[["采唐沫乡，","要期桑中。","失信不会，","忧思约带。"],["前往沫乡摘蒙菜，","邀请我到桑中来。","姑娘失信未会面，","使我相思束腰带。"]],[["官成立政，","衣就缺袂。","恭谦为卫，","终无祸尤。"],["晋职升官理政事，","家贫官服做不起。","恭敬谦虚对待人，","终于无祸无过失。"]],[["麒麟凤凰，","子孙盛昌。","少齐在门，","利以合婚。","振衣弹冠，","贵人大欢。"],["麒麟凤凰来呈祥，","子孙兴旺又盛昌。","年轻少女等在门，","利于成就好婚姻。","振衣弹冠喜相庆，","高贵之人大欢欣。"]],[["乱危之国，","不可涉域。","机民身顿，","逐至僵覆。"],["动乱危难衰败国，","不可轻易去徒涉。","一旦弩机发射出，","会有杀身之灾祸。"]],[["千雀万鸠，","与鹞为仇。","威势不敌，","虽从无益，","为鹰所击。"],["千只鸟儿万只鸠，","与那鹞鹰结怨仇。","终因势弱不能敌，","众心虽同也难斗，","遭逢鹰击一旦休。"]],[["从神集聚，","相与议语：南国虐乱，","百姓愁苦。","兴师征讨，","更立贤主。"],["仁人智士聚一起，","相互谈论和商议：南方国中生暴乱，","百姓愁苦不堪提。","率领神兵去讨伐，","重立贤君掌国事。"]],[["颜渊闵骞，","以礼自闲。","君子所在，","祸灾不存。"],["圣徒颜渊闵子骞，","行为以礼来规范。","君子居处是圣地，","没有祸患与灾难。"]],[["三桓子孙，","世秉国权。","爵节上卿，","富于周公。"],["鲁国三桓之子孙，","世世代代掌朝政。","世袭爵位至上卿，","宝贵荣华赛周公。"]],[["鹤鸣九皋，","处子失时。","载土贩盐，","难为功巧。"],["泽中仙鹤鸣声疾，","少女生来不逢时。","载土贩盐来糊口，","在家立业无能力。"]],[["方轴圆轮，","车行不前。","组囊以锥，","失其事便。","还师振旅，","兵革休止。"],["车轴方正轮子圆，","轴轮不合难运转。","缝织口袋用大锥，","违背常规不方便。","帅军还师振军威，","刀枪入库兵休闲。"]],[["鱼忧水浊，","桀乱我国。","驾龙出游，","东之乐土。","天赐我禄，","与生为福。"],["鱼儿游扰水混浊，","夏桀暴乱我中国。","乘上飞龙去出游，","来到东方安乐窝。","上天赐给我禄位，","一生幸福好生活。"]],[["白虎黑狼，","伏伺山阳。","遮遏牛羊，","病我商人。"],["白色老虎黑色狼，","伏身等候南山旁。","拦截捕食牛和羊，","使我商人受灾殃。"]],[["履危不安，","跌顿我颜，","伤肿为瘢。"],["踏入险地不安全，","跌倒摔伤我颜面，","鼻青脸肿留痕瘢。"]],[["三人辇车，","东入旁家。","王母贪叨，","盗我资财；","亡失犁牛。"],["三人一道拉车行，","途中住宿人家中。","王母似虎甚贪婪，","我的资财被盗空；","耕牛走失踪难寻。"]],[["三雁南飞，","俱就塘池。","虾鳅饶有，","利得过倍。"],["三只大雁飞向南，","一同来到池塘边。","虾鱼泥鳅多饶有，","获得厚利翻几番。"]],[["鹰栖茂树，","候雀往来。","一击获两，","利在枝柯。"],["老鹰藏身大树上，","专等麻雀来上当。","一次搏击抓两只，","获利就在树枝上。"]],[["尧舜钦明，","禹稷股肱。","伊尹往来，","进履登堂。","显德之徒，","可以辅王。"],["唐尧虞舜真圣明，","夏禹后稷股肱臣。","请来伊尹委重任，","迈步入室登堂中。","德性昭明臣贤能，","辅佐君王理朝政。"]],[["枯旱三年，","草莱不生。","粢盛空乏，","无以供灵。"],["枯旱无雨三年整，","地皮干裂草不生。","向天祷告缺祭品，","没有东西供神灵。"]],[["方口缓唇，","为知枢门。","解释钩带，","商旅以欢。"],["说话真诚又和缓，","嘴巴舌头是关键。","店主直爽待客商，","解开行装好住店。"]],[["袅池水溢，","高陆为海。","江河横流，","鱼鳖成市。","千里无墙，","鸳凤游行。"],["野鸭戏水溢池塘，","高陆变成大海洋。","江河之水遍地流，","鱼鳖成群四处荡。","放眼千里皆汪洋，","鸳鸯凤凰来又往。"]],[["烹鱼失刀，","驾车马亡。","锡刃不入，","鲸鲤腥臊。"],["剖鱼烹调丢了刀，","牵马驾车马逃跑。","铅刀太钝切不动，","鲸鱼鲤鱼太腥臊。"]],[["戎狄蹲踞，","无礼贪叨。","非吾族类，","君子攸去。"],["西戎北狄盘踞地，","贪婪成性不讲礼。","并非我们同族类，","好人因之远离去。"]],[["渡河逾水，","狐濡其尾，","不为祸忧。","捕鱼遇蟹，","利得无几。"],["欲想渡河涉过水，","小狐弄湿自己尾，","终于渡过无险危。","前去捕鱼获螃蟹，","所得利益不太多。"]],[["河出小鱼，","不宜劳烦。","苛政害民，","君受其患。"],["一条小河出小鱼，","官府禁捞订规矩。","残暴政治害百姓，","致使好人受灾异。"]],[["偃武修文，","兵革休安。","清人逍遥，","未归空闲。"],["停息武备修文德，","战争不起民安乐。","清兵逍遥戍野外，","未能返回家中来。"]],[["九疑郁林，","沮湿不中。","鸾鸟易去，","君子不安。"],["九嶷山和郁林郡，","潮湿无法居其中。","鸾鸟展翅飞离去，","大人心中不安宁。"]],[["持猬逢虎，","患厌不起。","逐至欢国，","与福笑语，","君子乐喜。"],["手执刺猬与虎逢，","祸患终究未发生。","平安到达欢乐国，","笑语迎接福临门，","贤士心中多欢欣。"]],[["狗生龙马，","公劳妪苦。","家无善驹，","折悔为吝。"],["期盼母狗生骏马，","老公老妪忙不休。","家中没有好马驹，","愁苦懊恼把罪受。"]],[["婴孩求乳，","慈母归子。","黄麑悦喜，","得其甘饵。"],["婴儿呱呱要奶吃，","慈母回家来喂食。","黄色小鹿真欢喜，","乳汁甘甜很满意。"]],[["有两赤鹞，","从五隼噪。","操矢无筈，","趣释尔射。","扶伏听命，","不敢动摇。"],["遥望长空两赤鹞，","随从五隼乱鸣叫。","张弓欲射箭无尾，","停止射击去寻找。","俯首帖耳来听命，","丝毫不敢有动摇。"]],[["伊尹智士，","去桀耕野。","执顺以强，"
