","政治悖逆民担忧。","阴气居然替代阳，","雌为雄父乱了章。"]],[["缩绪乱丝，","举手为灾。","越亩逐兔，","丧其衣袴。"],["头绪难寻丝难理，","枉然举动成灾异。","越过田埂去追兔，","结果丢失裤和衣。"]],[["臭彘腐水，","与狼相辅。","亡夫失子，","忧及父母。"],["臭猪卧在臭水沟，","与那恶狼成朋友。","丈夫出走又失子，","老父老母心中忧。"]],[["刲羊不当，","女执空筐。","兔跛鹿踦，","缘山坠堕；","谗佞乱作。"],["男子杀羊欠妥当，","女子手中执空筐。","跛脚兔子瘸腿鹿，","沿山坠落于高冈；","谗佞小人乱纲常。"]],[["拔剑伤手，","见敌不喜。","良臣无佐，","困忧为咎。"],["抽出利剑伤手端，","面对敌人心不欢。","忠臣良将无辅佐，","困苦忧愁成灾患。"]],[["三羖五牂，","相随俱行。","迷入空泽，","循谷直北。","经涉六驳，","为所伤贼。"],["三公五母八只羊，","结伴同行山道上。","中途迷路入空泽，","沿着峡谷奔北方。","岂料碰到六猛兽，","群羊全都遭残伤。"]],[["争鸡失羊，","亡其金囊，","利得不长。","陈蔡之患，","赖楚以安。"],["双方争鸣反失羊，","且又丢失金钱囊，","虽然得利却不长。","陈蔡二国有忧患，","依赖楚国得平安。"]],[["三骊负衡，","南取芷香。","秋兰芬馥，","盈满神匮，","利我仲季。"],["三匹黑马拉车行，","取来芳草鲜又嫩。","秋天兰花飘清香，","装满神匮去贩运，","我们兄弟得利丰。"]],[["孟夏己丑，","哀呼尼父。","明德讫终，","乱虐滋起。"],["农历四月己丑日，","悲哀孔子离人世。","圣人明德至此终，","暴乱肆虐皆滋生。"]],[["履不容足，","南山多叶。","家有芝兰，","乃无病疾。"],["鞋难容足不适合，","南山采草重新做。","家中种有香芝兰，","没有疾病来缠我。"]],[["三足无头，","不知所之。","心狂睛伤，","莫使为明，","不见日光。"],["三只脚儿无头颈，","不知要往哪里行。","心绪狂乱伤眼睛，","不能使其见光明，","白日皎皎难看清。"]],[["戴尧扶禹，","松乔彭祖，","西遇王母。","道路夷易，","无敢难者。"],["拥戴唐尧扶夏禹，","赤松子乔和彭祖，","西行一起见王母。","一路平安又顺利，","没有谁人敢拦阻。"]],[["式微式微，","忧祸相绊。","隔以岩山，","室家分散。"],["阳光越来越微暗，","忧愁祸患不间断。","高山阻隔难见面，","一家老小都分散。"]],[["灵龟陆处，","一旦失所。","伊子复耕，","桀乱无辅。"],["灵龟寄居陆地中，","失其居所处困境。","伊尹弃官去种地，","夏桀暴乱无辅臣。"]],[["仁德覆洽，","恩及异域。","泽被殊方，","祸灾隐伏，","蚕不作室，","寒无所得。"],["仁义道德广累积，","恩惠普及邻国域。","甘露润泽八方地，","灾祸隐伏不再起。","养蚕倘若不作茧，","严冬没有御寒衣。"]],[["夏麦麸黄，","霜击其芒。","疾君败国，","使年大伤。"],["夏麦结粒又灌浆，","严霜打坏其麦芒。","嫉恨君王败家国，","致使庄稼遭残伤。"]],[["火虽炽，","在吾后。","寇虽多，","在吾右。","身安吉，","不危殆。"],["大火虽猛烈，","但却在我后。","敌人虽众多，","然而在我右。","我身多平安，","没有危与难。"]],[["辽远绝路，","客宿多悔。","顽嚣相聚，","生我畏恶。"],["路途漫漫甚遥远，","住宿此地有凶患。","坏人顽固又嚣张，","使我畏惧担风险。"]],[["悬悬南海，","去家万里。","飞兔腰褭，","一日见母，","除我忧悔。"],["南海之地远又远，","离家万里盼回还。","归心似箭跨骏马，","一日即到母身边，","解除忧伤心中欢。"]],[["坚冰黄鸟，","常哀悲愁。","不见白粒，","但睹藜蒿。","数惊鸷鸟，","为我心忧。"],["坚冰之上黄鸟栖，","常常悲愁又哀泣。","忍饥难见白米粒，","但见蓬蒿长满地。","屡屡受惊于猛禽，","使我心中多忧虑。"]],[["困而后通，","虽危不穷。","终得其愿，","姬姜相从。"],["历经艰难后顺通，","身处危地志不穷。","终于实现其愿望，","姬旦姜尚辅朝政。"]],[["西贾巴蜀，","寒雪至毂。","欲前不得，","还反空屋。"],["西去巴蜀做买卖，","天寒雪厚车轮埋。","欲想前进又不能，","中途返回空室中。"]],[["新作初陵，","烂陷难登。","三驹摧车，","踬顿伤颐。"],["新丰高地建初陵，","高大艰险难攀登。","三匹骡子拉重车，","车翻伤畜又伤人。"]],[["延颈望酒，","不入我口。","深目自苦，","利得无有。","幽人悦喜。"],["伸长脖子望着酒，","可惜不能到我口。","瞪大眼睛盼利来，","自找苦吃利没有。","隐居之人乐悠悠。"]],[["仲春孟夏，","和气所舍。","生我嘉福，","国无残贼。"],["阳春二月至初夏，","祥和之气遍天下。","使我欢乐受大福，","阴阳协调国运佳。"]],[["张罗捕鸠，","兔罹其灾。","雌雄俱得，","为罝所贼。"],["张开罗网捕斑鸠，","兔子跑到网里头。","公兔母兔皆捕获，","罗网使其遭罪咎。"]],[["三人俱行，","一人言北。","伯仲欲南，","少叔不得。","中路分争，","道斗相贼。"],["兄弟三人出了门，","小三说要往北行。","老大老二欲向南，","小三固执不顺从。","半路相互起争讼，","打架斗殴造祸凶。"]],[["然诺不行，","欺绐误人。","使我露宿，","夜归温室。","神怒不直，","鬼击其目。","欲求福利，","适反自贼。"],["许下诺言不行动，","欺骗他人误事情。","使我露宿于野外，","夜晚方才归室中。","神灵怒其不正直，","恶鬼敲击他眼睛。","本来希望求福利，","适得其反害自身。"]],[["陈辞达诚，","使安不倾。","增禄益寿，","以成功名。"],["说词陈言表真诚，","使得权位不倒倾。","多增俸禄延寿命，","以便成就我功名。"]],[["火烧公床，","破家灭亡。","然得安昌，","先忧重丧。"],["大火烧了老父床，","家庭破败遭灭亡。","初生忧患受重伤，","后得平安和顺昌。"]]],[[["鼎足承德，","嘉谋生福。","为王开庭，","得心所欲。"],["贤士德高受重用，","智多谋广使福生。","建国创业为帝王，","欲望满足事遂心。"]],[["曳纶江海，","钓鲂与鲤。","王孙列俎，","以飨仲友。"],["丝绳垂于江海里，","钓得鲂鱼和鲤鱼。","王孙陈列肉和酒，","以此招待诸朋友。"]],[["东山皋落，","叛逆不服。","兴师征讨，","恭子败覆。"],["东山赤狄皋落氏，","背径叛逆不服气。","兴师出兵去征伐，","恭子失败向北去。"]],[["千里骍驹，","为王服车。","嘉其丽荣，","君子有成。"],["红色骏良千里马，","君王出行把车驾。","风姿华丽多美好，","有德之人成就大。"]],[["二龙北行，","道逢六狼。","莫宿中泽，","为祸所伤。"],["二龙一起向北行，","道与六狼而相逢。","夜晚住宿沼泽地，","致使蒙祸招灾凶。"]],[["天灾所游，","凶不可居。","转徙获福，","留止危忧。"],["上天灾害游荡处，","凶事多多不可居。","迁徙异处能获福，","留住此地有危惧。"]],[["狐狸雉兔，","畏人逃去。","分走窜匿，","不知所处。"],["狐狸野鸡和兔子，","畏惧猎人远逃离。","四散分走躲藏起，","莫谁能知其踪迹。"]],[["雨师娶妇，","黄岩季女。","成礼既婚，","相呼南去。","膏润田里，","年岁大喜。"],["天上雨师娶新媳，","她是黄岩小女子。","婚礼举行成夫妻，","相偕同往南方去。","降下雨露润田地，","年岁大有多富裕。"]],[["外栖野鼠，","与雉为伍。","疮痍不息，","即去其室。"],["老鼠栖身田野里，","常和小鸡在一起。","野鼠频繁伤小鸡，","尽快使它分家室。"]],[["天命绝后，","孤阳无主。","彷徨两社，","独不得酒。"],["天命注定要绝后，","孤单未把子嗣留。","游移不定两社间，","不能享受祭祀酒。"]],[["鹄思其雄，","欲随凤东。","顺理羽翼，","出次须日。","中留北邑，","复反其室。"],["天鹅思念其配偶，","欲随凤凰去东游。","梳好羽毛理好翼，","迎着太阳高飞起。","中途停留在北邑，","复归原来栖息地。"]],[["蜲蛇九子，","长尾不殆。","均明光泽，","燕自受福。"],["回旋曲折九个子，","尾巴长长多安逸。","颗颗光泽甚明亮，","安乐自享大福喜。"]],[["日走月步，","趋不同舍。","夫妻反目，","君主失国。"],["太阳月亮天上行，","轨道速度各不同。","夫妻反目两相争，","君主不能理朝政。"]],[["定房户室，","枯薪除毒。","文德渊府，","害不能贼。"],["定星出现宜建房，","枯枝燃火除灾殃。","文明德性集聚地，","祸害不会把我伤。"]],[["齐东郭庐，","嫁于洛都。","俊良美好，","媒利过倍。"],["齐城东郊郭家庄，","有位姑娘嫁洛阳。","姑娘善良又漂亮，","媒人获得利成双。"]],[["病笃难医，","和不能治。","命终期讫，","下即蒿里。"],["病入膏肓难就医，","秦国名医不能治。","生命终结寿期至，","将下黄泉入蒿里。"]],[["开郭绪业，","王迹所起。","姬德七百，","报以八子。"],["开创先祖大业基，","武王伟绩建立起。","周朝延续七百年，","上帝赐予八个子。"]],[["丰年多储，","江海饶鱼。","商客善贾，","大国富有。"],["丰收之年多储蓄，","大江大海饶有鱼。","商人善于做生意，","泱泱大国多富裕。"]],[["鹄求鱼食，","过彼射邑。","缯加我颈，","缴挂羽翼。","欲飞不能，","为羿所得。"],["天鹅外出寻鱼食，","飞越善射之城邑。","利箭射中其头颅，","丝绳挂在它羽翼。","欲飞无法再挣脱，","终被射手所捕获。"]],[["望城抱子，","见邑不殆。","公孙上堂，","文君悦喜。"],["怀抱孩子去逃难，","走近城邑脱危险。","公孙快步登上堂，","其父心里很喜欢。"]],[["左指右麾，","邪淫侈靡。","执节无良，","灵君以亡。"],["前后左右乱指挥，","荒淫无度又靡费。","灵公昏庸无良德，","奸淫夏姬身遭祸。"]],[["日中为市，","各持所有，","交易资贿。","函珠怀宝，","心悦欢喜。"],["正午市场正活跃，","商人手拎怀中抱，","买卖频频皆成交。","含着珍珠揣着宝，","高兴喜悦开怀笑。"]],[["山没丘浮，","陆为水鱼，","燕雀无庐。"],["大水淹没那山冈，","陆地成为鱼儿乡，","燕雀失去其住房。"]],[["马服长股，","宜行善市。","蒙佑谐偶，","获利五倍。"],["驾车马儿腿长长，","利于出门去经商。","承蒙保佑得配偶，","获得大利乐悠悠。"]],[["三狸捕鼠，","遮遏前后。","死于环城，","不得脱走。"],["三只狐狸捉老鼠，","后面围追前面堵。","老鼠困于环城中，","不得逃走死为伍。"]],[["鬼舞国社，","岁乐民喜。","臣忠于君，","子孝于父。"],["鬼神起舞社庙中，","年岁丰收乐百姓。","臣下忠于其君主，","儿子孝顺他父亲。"]],[["慈母望子，","遥思不已。","久客外野，","我心悲苦。"],["慈祥母亲盼儿子，","常常思念无休止。","长期寄居于他乡，","使我心中很悲伤。"]],[["雨师娶妇，","黄岩季女。","成礼既婚，","相呼南去。","膏润田里，","年岁大有。"],["天上雨师娶新媳，","她是黄岩小女子。","婚礼举行成夫妻，","相偕同往南方去。","降下甘露润田地，","年年岁岁多富裕。"]],[["两狗同室，","相啮争食。","枉矢西流，","射我暴国。","高宗鬼方，","三年乃服。"],["两狗同处一窝室，","互相噬咬争夺食。","流星如箭西飞去，","射向暴虐国家里。","高宗出征伐鬼方，","三年征服其投降。"]],[["早霜晚雪，","伤禾害麦。","损功弃力，","饥无可食。"],["早晨降霜晚下雪，","伤我小麦害我禾。","前功尽弃白费力，","食不饱腹受饥饿。"]],[["腐臭所在，","青蝇集聚。","变白为黑，","败乱邦国。","君为臣逐，","失其宠禄。"],["腐烂发臭坏食物，","苍蝇欢聚寻其乐。","颠倒是非与黑白，","奸邪小人乱邦国。","君主被臣所驱逐，","失宠权力被剥夺。"]],[["牵羊不前，","与心戾旋。","闻言不信，","误绐丈人。"],["用力牵羊不向前，","与我心愿正相反。","耳听为虚不可信，","年老之人受欺骗。"]],[["甘忍利害，","还相克贼。","商子酷刑，","鞅丧厥身。"],["甘愿荣辱共相存，","终于克敌而取胜。","商鞅用刑太残酷，","自食恶果丧性命。"]],[["刲羊不当，","女执空筐。","兔跛鹿踦，","缘山坠堕。"],["男子杀羊欠妥当，","女子手中拎空筐。","兔子脚跛鹿腿瘸，","爬山途中齐坠落。"]],[["啮啮，","贫鬼相责。","无有欢怡，","一日九结。"],["争吵不休相责骂，","一伙穷鬼欲打架。","从早到晚无欢乐，","一天能结九怨家。"]],[["两足四翼，","飞入嘉国。","宁我伯姊，","与母相得。"],["两脚插上四翅膀，","远走高飞回家乡。","使我大姐得安慰，","一同欢聚母身旁。"]],[["文山紫芝，","雍梁朱草。","长生和气，","王以为宝。","公尸侑食，","福禄来处。"],["文山之上灵芝好，","雍梁出产赤心草。","瑞草生长多茂盛，","君王视它如珍宝。","先祖陪我同享食，","幸福利禄都来到。"]],[["绝世游魂，","福禄不存。","精神涣散，","离其躬身。"],["诀别人世之游魂，","幸福利禄都不存。","精神涣散游四方，","离开人体之本身。"]],[["北辰紫宫，","衣冠立中。","含和建德，","常受大福。"],["北辰星座紫微宫，","天上帝王居其中。","含和温顺建美德，","大福天天随其身。"]],[["伯蹇叔盲，","莫为守装。","失我衣裘，","代尔阴乡。"],["哥哥跛脚弟弟盲，","难以自己守行装。","丢了皮袄和衣裳，","速离这个鬼地方。"]],[["两女共室，","心不聊食。","首发如蓬，","忧常在中。"],["两女同处一居室，","心烦意乱不思食。","头发纷乱如蓬草，","忧虑常常挂心里。"]],[["去辛就蓼，","毒愈苦甚。","避井遇坑，","忧患日生。"],["欲避苦难入困境，","困苦艰难愈加深。","避开陷阱遇到坑，","忧患日复一日生。"]],[["初病终凶，","季为死丧，","不见光明。"],["起初生病又加重，","小弟终将把命送，","难能再见他复生。"]],[["三鸟飞来，","是我逢时。","俱行先至，","多得大利。"],["三只鸟儿齐飞来，","我逢喜事笑颜开。","一同前往先到达，","多得大利好痛快。"]],[["鹿食山草，","不思邑里，","虽久无咎。"],["鹿食青草山坡上，","不想城邑和故乡，","久处外地无咎殃。"]],[["羊肠九萦，","相推稍前。","止须王孙，","乃能上天。"],["羊肠小道九个弯，","互相推拉渐向前。","停步等待王孙来，","方能登天成神仙。"]],[["管仲遇桓，","得其愿欢。","胶目启牢，","振冠无忧。","笑戏不庄，","空言妄行。"],["管仲遇到齐桓公，","满足心愿得重用。","胶粘双眼出狱门，","着衣整冠重做人。","戏谑言笑不庄重，","空言妄行国不宁。"]],[["桀跖并处，","民困愁苦。","行旅迟迟，","留连齐鲁。"],["夏桀盗跖聚一起，","百姓困苦生忧虑。","处处道路不畅通，","旅人被困齐鲁地。"]],[["魂孤无室，","衔指不食。","盗张民馈，","见敌失肉。"],["灵魂孤单无家室，","口衔指头不得食。","强盗猖狂夺民羹，","遇上敌人失掉利。"]],[["谗言乱国，","覆是为非。","伯奇乖离，","恭子忧哀。"],["谗言扰乱我国家，","颠倒是非和真假。","伯奇蒙难受迫害，","恭子忧愁生悲哀。"]],[["卫侯东游，","惑于少姬。","忘我考妣，","久迷不来。"],["卫侯出行游东国，","却被少姬所迷惑。","忘了祖先和父母，","长久迷恋不回国。"]],[["鸡鸣同兴，","思配无家。","执佩持凫，","莫使致之？"],["夜半鸡鸣同起身，","思念配偶却不能。","手持订婚好礼品，","不知把它送谁人？"]],[["义不胜情，","以欲自萦。","觊利危躬，","摧角折颈。"],["见利忘义太无情，","欲望常常挂心中。","贪财谋利害自身，","折断犄角伤脖颈。"]],[["臣尊主卑，","权力日衰。","侵夺无光，","三家逐公。"],["臣子尊贵主无能，","权力如日近黄昏。","臣下侵夺主威风，","三桓驱逐鲁昭公。"]],[["诸孺行贾，","经涉山阻。","与狄为市，","不忧危殆，","利得十倍。"],["孩童外出做生意，","跋山涉水受隔阻。","敢与狄人做交易，","不怕那里有危殆，","居然获得十倍利。"]],[["叔仲善贾，","与喜为市。","不忧危殆，","利得十倍。"],["哥弟善于做生意，","欢乐之中成交易。","不用担心有危险，","经商获得十倍利。"]],[["六蛇奔走，","俱入茂草。","惊于长路，","畏惧啄口。"],["六条长蛇齐奔走，","全都钻进草里头。","担惊受怕于长道，","畏惧敌手长颈鸟。"]],[["水坏我里，","东流为海。","凫鳖喧嚣，","不得安居。"],["大水冲坏我家乡，","东游汇成大海洋。","野鸭乌龟齐喧闹，","此地难以住久长。"]],[["飞不远去，","卑斯内侍，","禄养未富。"],["不能高飞难远行，","卑视内侍太平庸，","俸禄食养不够用。"]],[["阴变为阳，","女化为男。","治道大通，","君臣相承。"],["阴柔转化成阳健，","女子转生为儿男。","治国之道得通畅，","君臣相依皆平安。"]],[["践履危难，","脱厄去患。","入福喜门，","见悔大君。"],["行路途中遇危难，","摆脱困境避过患。","步入幸福欢乐门，","接受慈父之教训。"]],[["罟密纲缩，","动益蹶急，","困不得息。"],["捕兽之网紧收缩，","猛兽被缚动不得，","陷入困境难逃脱。"]],[["负牛上山，","力劣行难。","烈风雨雪，","遮遏我前，","中道复还。"],["老牛负重上高山，","精疲力竭行路难。","寒风冽冽大雪飘，","遮挡阻碍我向前，","中途掉头复回还。"]],[["喁喁嘉草，","思降甘雨。","景风升上，","沾洽时澍，","生我庄稼。"],["草叶飘动响喁喁，","盼望老天降甘霖。","和风吹拂过长空，","阴云密布雨来临，","滋润大地禾苗生。"]]],[[["寄生无根，","如过浮云。","立本不固，","斯须落去，","更为枯树。"],["寄生之物没有根，","如同过往之浮云。","树根动摇不牢固，","枝条叶子皆凋零，","变为枯树朽了根。"]],[["人无定法，","缓行长奸。","地雄走归，","阳不制阴，","男失其家。"],["不按常法办事情，","正事迟迟不能成。","地上雄性皆隐伏，","阳气不能控制阴，","男子失去其家庭。"]],[["众鸟所翔，","中有大怪。","九身无头，","魂惊魄去，","不可以居。"],["群鸟飞翔于长空，","中间有个大妖精。","九个身子没有头，","使我胆战又心惊，","此地居之不安宁。"]],[["封豕沟渎，","灌溃国邑。","火宿口中，","民多病疾。"],["奎宿在天主沟渠，","洪水冲毁我城邑。","火星靠近封豕星，","人民受灾多疾病。"]],[["奋翅鼓翼，","翱翔外国。","逍遥徒倚，","来归温室。"],["张开翅膀鼓其翼，","高高飞向远方去。","一路逍遥多自在，","来到温暖国度里。"]],[["秋蚕不成，","冬种不生。","殷王逆理，","弃其宠荣。"],["深秋之蚕长不成，","冬天播种难萌生。","纣王暴虐逆理行，","失去荣耀和尊宠。"]],[["卫侯东游，","惑于少姬。","忘我考妣，","久迷不来。"],["卫侯前往游东国，","被那少姬所迷惑。","忘了先祖和爹娘，","长久徘徊不回国。"]],[["乌合卒会，","与恶相得。","鸱鸮相酬，","为心所贼。"],["一群乌鸦来会合，","聚集一堂逞凶恶。","鸱鸮鸟儿上了当，","自作自受食恶果。"]],[["眵鸡无距，","与鹊格斗。","翅折目盲，","为鸠所伤。"],["鸡患眼病无后爪，","却与喜鹊去斗打。","翅膀折断眼睛瞎，","鸠鸟飞来啄伤它。"]],[["木内生蠹，","上下相贼，","祸乱我国。"],["树木内部生蛀虫，","上下动乱不安宁，","使我国家受伤损。"]],[["延陵适鲁，","观乐太史。","车邻白颠，","知秦兴起。","卒兼其国，","一统为主。"],["延陵季子去鲁国，","太史陪他观周乐。","听了车邻白颠诗，","预知秦国将兴起。","终于兼并其六国，","统一天下成皇帝。"]],[["辅相之好，","无有休息。","时行云集，","所在遇福。"],["辅臣鞠躬任丞相，","不顾劳疲奔波忙。","行事犹如云集散，","幸福利禄在此间。"]],[["订倾箦折，","屋漏垣缺，","季姬不惬。"],["席子折断床倾斜，","屋里漏水墙残缺，","少妇心中不快乐。"]],[["东入海口，","循流北走。","一高一下，","五色无主。","七日六夜，","死于水浦。"],["向东进入渤海口，","沿着水流往北走。","漂泊颠簸不稳定，","脸变颜色面无神。","经过七天又六夜，","可怜葬身鱼腹中。"]],[["群虎入邑，","求索肉食。","大人守御，","君不失国。"],["一群饿虎进城郭，","到处寻肉找食物。","大臣带兵去防守，","君主最终未失国。"]],[["四乱不安，","东西为患。","退身止足，","无出邦域。","乃得全完，","赖其生福。"],["四方动乱不安宁，","到处祸患皆滋生。","退身隐居不出行，","安心滞留国家中。","我身赖此得保全，","安享幸福和长生。"]],[["叔肸抱冤，","祁子自邑。","乘遽解患，","羊舌以免，","赖其生全。"],["叔向囚禁含屈冤，","祁奚自邑来解患。","乘坐驿车来劝说，","羊舌终于得赦免，","赖此得以保平安。"]],[["延颈望酒，","不入我口。","深目自苦，","利得无有。"],["伸长脖子望着酒，","美酒不能入我口。","睁大眼睛盼利来，","自找苦头利没有。"]],[["仁政之德，","参参日息。","成都就邑，","人受厥福。"],["仁政德政广施行，","威望日复一日升。","城市乡村都繁荣，","人民生活乐融融。"]],[["牵头系尾，","屈折几死。","周世无人，","不知所归。"],["牵制头颈缚住脚，","身体几经受折磨。","周朝王室无遗民，","何处去寻安乐窝。"]],[["教羊逐兔，","使鱼捕鼠。","任其非人，","费日无功。"],["教那羊儿去追兔，","使那鱼儿捉老鼠。","所任不是称职人，","浪费时光又无功。"]],[["生角有尾，","张孽制家，","排羊逐狐。","张氏易公，","忧祸重凶。"],["恶徒生角长尾巴，","张氏孽子控制家，","排斥异己独逞霸。","张姓门庭换主人，","忧患灾祸都降临。"]],[["去安就危，","坠陷井池，","破我玉螭。"],["离开安宅入危地，","掉进陷阱深水池，","摔破我的精美玉。"]],[["菇芝饵黄，","涂饮玉英。","与神流通，","长无忧凶。"],["常吃灵芝与黄精，","玉花为食我饮用。","精神饱满通经络，","健康长寿无忧凶。"]],[["体重飞难，","未能越关，","不离室垣。"],["身体沉重起飞难，","未能顺利越山关，","不能离开自家园。"]],[["巢成树折，","伤我彝器。","伯踒叔跌，","亡羊乃追。"],["巢穴垒成树枝折，","我的祭器被弄破。","老大老三都跌伤，","祭羊逃跑急追捉。"]],[["六人俱行，","各遗其囊。","黄鹤失珠，","无以为明。"],["六人一起向前行，","各人行囊遗无存。","天鹅失去夜明珠，","没有东西来照明。"]],[["蟠梅折枝，","与母分离，","绝不相知。"],["梅树弯曲折断枝，","儿子与母两分离，","从此双双不相知。"]],[["迎福开户，","喜随我后。","曹伯恺悌，","为宋国主。"],["迎接幸福打开门，","喜事紧随我的身。","曹伯慷慨援宋国，","桓公立为新国君。"]],[["既痴且狂，","两目又盲。","箕距喑哑，","名为无中。"],["既痴呆而又疯狂，","两只眼睛全都盲。","手脚弯曲又哑巴，","全然一个废人样。"]],[["金梁铁柱，","千年牢固。","完全不腐，","圣人安处。"],["金筑大梁铁为柱，","千年万年都牢固。","完好无损不腐朽，","圣人安身好居处。"]],[["裹糗荷粮，","与跖相逢。","欲飞不得，","为网所获。"],["携带烧饼扛着粮，","却与强盗碰路上。","欲要逃脱又不能，","犹如鸟雀入罗网。"]],[["彭生为豕，","暴龙作灾。","盗尧衣裳，","桀跖荷兵。","青禽照夜，","三旦夷亡。"],["彭生变为一头猪，","暴龙横行造灾殃。","盗走唐尧衣和裳，","桀跖荷枪聚一堂。","青鸟飞临照黑夜，","三日之内有伤亡。"]],[["独夫老妇，","不能生子，","鳏寡居处。"],["孤独老头和老妇，","不能生子享清福，","鳏寡各自居一处。"]],[["鹪鹩窃脂，","巢于小枝。","摇动不安，","为风所吹。","心寒慄慄，","常忧殆危。"],["桃雀和那窃脂鸟，","小树枝头筑起巢。","树枝摇晃不安全，","是那风儿太糟糕。","内心战栗甚恐惧，","经常担心受困扰。"]],[["素车木马，","不任负重。","王子出征，","忧危为咎。"],["木马驾车欲出行，","不能肩负其重任。","王子年幼欲出征，","担心有危有灾凶。"]],[["土陷四维，","安平不危。","利以居止，","保有玉女。"],["周围低凹居处高，","如同住在平安堡。","利于长久居此地，","保君有女美如玉。"]],[["负牛上山，","力劣行难。","烈风雨雪，","遮遏我前，","中道复还。"],["老牛负重爬高山，","筋疲力竭行路难。","寒风冽冽大雪飘，","遮挡阻碍我向前，","中途掉头复回还。"]],[["金城铁郭，","上下同力。","政平民亲，","寇不敢贼。"],["坚固犹如那铜墙，","上下同力严守防。","政治稳定民亲近，","敌寇不敢逞凶狂。"]],[["清洁渊塞，","为谗所言。","证讯诘问，","系于枳温。","甘棠听断，","昭然蒙恩。"],["品德诚实又纯洁，","遭遇谗言受诬蔑。","一番审问听证后，","成为狱中不速客。","甘棠树下来断案，","欣然蒙恩得昭雪。"]],[["皋陶听理，","岐伯悦喜。","西登华首，","东归无咎。"],["清官皋陶来断案，","文王心中真喜欢。","向西登上华山顶，","返回东方无危难。"]],[["低头窃视，","有所畏避，","行作不利。","酒酸鱼败，","众莫贪嗜。"],["弯腰低头去偷视，","内心之中有畏惧，","行为动作不顺利。","酒肉酸臭鱼味异，","众人不要太贪食。"]],[["十鸡百雏，","常与母俱。","抱鸡搏虎，","谁肯为侣？"],["十鸡哺育百小鸡，","常随其母不分离。","抱鸡与虎去搏斗，","谁敢与他为伴侣？"]],[["高阜山陵，","陂陁颠崩。","为国妖祥，","元后以薨。"],["高大山阜和丘陵，","倾斜崩塌有灾凶。","预兆国家不吉祥，","天子在世难长存。"]],[["六鹢退飞，","为襄败祥。","陈师合战，","左股疾伤。","遂以薨崩，","霸功不成。"],["六鹢退飞过宋都，","襄公衰败无人辅。","陈师与楚相激战，","利箭射伤左腿股。","随之一命丧黄泉，","霸功最终难实现。"]],[["异国殊俗，","情不相得。","金木为仇，","百贼擅杀。"],["两国风俗各不同，","思想感情不相通。","金木为仇相克制，","贼寇擅自杀黎民。"]],[["鸦噪庭中，","以戒灾凶。","重门击柝，","备忧暴客。"],["庭中乌鸦叫嘻嘻，","告诫主人有灾异。","紧闭门户击更梆，","以备盗贼入我室。"]],[["慈母念子，","享赐得士。","蛮夷来服，","以安王室，","侧陋逢时。"],["慈母思念其儿子，","封官加爵受恩赐。","东方蛮夷来归服，","以此安定我王室，","贫困之人逢吉时。"]],[["迁延恶人，","使德不通。","炎旱为殃，","年谷大伤。"],["恶人肆意逞狂凶，","使得仁道不畅通。","夏日炎炎造灾殃，","庄稼受旱难生长。"]],[["躬履孔德，","以待束帛。","文君獠猎，","吕尚获福。","号称太师，","封建齐国。"],["自我修养其德行，","以待加冕受重用。","文王烧山去打猎，","太公吕尚福临门。","担任要职称太师，","受封成为齐国君。"]],[["征将止恶，","鼓鞞除贼。","庆仲奔莒，","子般获福。"],["即将出征伐邪恶，","击鼓挥刀除殃祸。","庆仲出逃奔莒国，","子般获福受恩泽。"]],[["良夫淑女，","配合相保。","多孙众子，","欢乐长久。"],["一对美满好夫妻，","幸福结合在一起。","子孙昌盛事如意，","过上欢乐好日子。"]],[["踒蛇四牡，","思念父母。","王事靡盬，","不我安处。"],["四马驾车缓缓行，","心中思念父母亲。","王事整天没个完，","到处奔波难安身。"]],[["水坏我里，","东流为海。","凫龟欢嚣，","不得安居。"],["大水冲坏我家乡，","东流汇成大海洋。","野鸭乌龟齐喧嚣，","此地难以住久长。"]],[["束帛戋戋，","赙我孟宣。","征召送君，","变号易字。"],["束束布帛作礼品，","我为孟宣来送行。","征召前去见君王，","祝他换个好处境。"]],[["罗网四张，","鸟无所翔。","征伐穷极，","饥渴不食。"],["布下天罗和地网，","鸟儿无法高飞翔。","征战之人多疲倦，","忍饥挨饿无食粮。"]],[["乾行天德，","覆赡六合。","呕煦成熟，","使我福德。"],["皇天在上施大恩，","覆盖南北和西东。","生养抚育长成人，","使我幸福常随身。"]],[["秦晋大国，","更相克贼。","获惠质圉，","郑被其咎。"],["秦晋两国结仇怨，","互相残伤争霸权。","圉为人质释惠公，","大夫庆郑遭杀斩。"]],[["晦昧昏冥，","君无纪纲。","甲午成乱，","简公丧亡。"],["苍天昏暗不明亮，","君无法纪和纲常。","陈恒作乱甲午日，","简公舒州把命丧。"]],[["三足无头，","莫知所之。","心狂睛伤，","莫使为明，","不见日光。"],["横生三脚无头颈，","不知该往何处行。","心狂患了精神病，","无法使他再清醒，","终日不得见光明。"]],[["长夜短日，","阴为阳贼。","万物空枯，","藏于北陆。"],["冬至日短夜长长，","阳气反被阴气伤。","万物枯竭难成活，","北陆星宿藏寒光。"]],[["衣宵夜游，","与君相遭。","除烦解惑，","使我无忧。"],["身穿锦绡去夜游，","与君相逢意相投。","消除烦恼与疑惑，","使我心里无忧愁。"]],[["逐鹿南山，","利入我门。","阴阳和调，","国无灾残。","长子出游，","须其仁君。"],["追逐鹿儿南山上，","大利入门呈吉祥。","阴阳平衡又和谐，","国家不会受灾殃。","长子出门去游览，","与那好人逢路上。"]],[["请骥聘耳，","啬不我与，","驱我父母。"],["欲牵骏马要外出，","吝啬之人不允许，","驱走我的父与母。"]]],[[["采唐沫乡，","要期桑中。","失信不会，","忧思约带。"],["前往沫乡摘蒙菜，","邀请我到桑中来。","姑娘失信未会面，","使我相思束腰带。"]],[["有鸟飞来，","集于宫树。","鸣声可恶，","主将出去。"],["一群凶鸟飞过来，","落在宫中大树上。","叫声使人生厌恶，","君主将被逐他乡。"]],[["仁政之德，","参参日息。","成都就邑，","日受厥福。"],["仁德之政广施行，","威望日复一日升。","城市乡村都繁荣，","日子幸福乐融融。"]],[["他山之错，","与璆为仇。","来攻吾城，","伤我肌肤，","邦家搔忧。"],["他山之上磨刀石，","与我美玉成仇敌。","坏人围攻我城池，","身体受伤成残疾，","国受搔扰民忧虑。"]],[["赍贝赎狸，","不听我辞。","系于虎须，","牵不得来。"],["怀揣金钱去赎狐，","朋友不听我劝阻。","将狐系于虎须上，","牵之不来枉受苦。"]],[["一簧两舌，","妄言陷语。","三奸成虎，","曾母投杼。"],["两个舌头似弹簧，","妄言恶语来中伤。","三人造谣说有虎，","曾参母亲丢机杼。"]],[["魁行摇尾，","逐云吹水。","污泥为陆，","下田宜稷。"],["魁星运行摇杓尾，","追逐云雾驱走水。","污泥之地变平陆，","涝洼田里宜种谷。"]],[["天门九重，","深内难通。","明登至莫，","不见神公。"],["上天之门有九重，","里面空邃难通行。","从早攀登到天黑，","始终未见神仙公。"]],[["且失明，","耳阏不聪。","陷入深渊，","灭顶忧凶。"],["口哑难语眼失明，","耳受阻塞听不清。","陷入深水泥潭中，","遭到灭顶大灾凶。"]],[["雾露早霜，","日暗不明。","阴阳孽疾，","年谷大伤。"],["晨雾露水和早霜，","太阳昏暗不明亮。","阴阳失调降灾害，","五谷遭到大损伤。"]],[["三阶土廊，","德义明堂。","交让往来，","享燕相承。","箕伯朝王，","锡我玄黄。"],["三层台阶土走廊，","论德明义好地方。","大家一起来交往，","美味佳肴共同享。","箕子朝见周武王，","武王赐给他玄黄。"]],[["争鸡失羊，","利得不长。","陈蔡之患，","赖楚以安。"],["互相争鸡反失羊，","虽然得利却不长。","孔子陈蔡受患难，","依赖楚国得平安。"]],[["天旱水涸，","枯槁无泽，","未有所获。"],["天气久旱水涸竭，","庄稼枯槁无润泽，","到了年终无收获。"]],[["陶朱白圭，","善贾息赀。","公子王孙，","富利不贫。"],["陶朱白圭有财资，","善于经商做生意。","公子王孙学习他，","财运亨通获大利。"]],[["龟厌江海，","陆行不止。","自令枯槁，","失其都市，","忧悔为咎。"],["乌龟讨厌海中居，","陆地爬行不停止。","自作自受变憔悴，","失去生存大都市，","忧愁悔恨成灾异。"]],[["黄鸟採蓄，","既嫁不答。","念吾父兄，","思复邦国。"],["黄鸟啄食并贮存，","良妇远嫁不顺心。","想念我的父和兄，","思归我国回家中。"]],[["田鼠野鸡，","意常欲逃。","拘制笼槛，","不得动摇。"],["田间老鼠和野鸡，","心里常想逃离去。","把它关进笼子里，","失去自由难逃匿。"]],[["平国不君，","夏氏作乱。","乌号窃发，","灵公殒命。"],["治理国家君不贤，","陈国夏氏来作乱。","良弓利箭暗中射，","灵公丧命入黄泉。"]],[["巨蛇大鳅，","战于国郊。","上下闭塞，","君主走逃。"],["长长蟒蛇大泥鳅，","在那郊外相争斗。","上下闭塞不畅通，","君主出逃向北奔。"]],[["谗言乱国，","覆是为非。","伯奇流离，","恭子忧哀。"],["佞人谗言把国害，","颠倒是非和黑白。","伯奇被逐遭流放，","恭子忧伤甚悲哀。"]],[["郁怏不明，","为阴所伤。","众雾聚集，","共夺日光。"],["日头昏暗不明亮，","是那阴气所贼伤。","层层浓雾集一处，","夺去明媚太阳光。"]],[["望城抱子，","见邑不殆。","公孙上堂，","大君欢喜。"],["抱着孩子望城关，","见那城中无危难。","公子快步走上堂，","慈祥父亲心中欢。"]],[["三虫为蛊，","划迹无与。","胜母盗泉，","君子弗处。"],["三条害虫造祸灾，","不见踪迹行破坏。","胜母之地盗泉水，","好人不到此处来。"]],[["车驰人趋，","卷甲相仇。","齐鲁寇战，","败于犬丘。"],["战车飞驰兵急趋，","轻装开赴前线去。","齐鲁两国相交战，","大军败于犬丘地。"]],[["欲访子车，","善相欺绐。","桓叔相迎，","不见所期。"],["打算前去访子车，","好言当成欺辱语。","桓子游服来迎接，","不知何时能准许？"]],[["争鸡失羊，","亡其金囊，","利得不长。","陈楚之患，","赖楚以安。"],["互相争鸡反失羊，","且又丢失钱财囊，","虽然得利却不长。","陈蔡二国有祸患，","依赖楚国得平安。"]],[["岁暮花落，","阳入阴宅。","万物伏匿，","利不可得。"],["寒冬岁末花自落，","阳明之气入阴舍。","万物凋谢皆伏藏，","外出谋利不能得。"]],[["晨风文翰，","大举就温。","昧过我邑，","羿无所得。"],["鹯鸟皋鸡鼓其翼，","高飞去寻温和地。","黎明之前过城邑，","射手后羿未得利。"]],[["持鹄抱子，","见蛇何咎。","室家俱在，","不失其所。"],["手持天鹅抱孩子，","见到毒蛇不畏惧。","家中妻儿都健在，","安然不失居住地。"]],[["隐隐大雷，","霶霈为雨。","有女痴狂，","惊骇邻里。"],["雷声隐隐不间断，","大雨滂沛降田间。","有女痴狂且疯癫，","邻里受惊不得安。"]],[["无足断跟，","居处不安，","凶恶为患。"],["无脚又断脚后跟，","所居之处不安宁，","祸患造成灾与凶。"]],[["破筐敝筥，","弃损于道，","不复为宝。"],["破敝不堪圆竹筐，","将它扔在大路旁，","不再作为宝贝藏。"]],[["三鸡啄粟，","十雏从食。","饥鸢卒击，","亡其两叔。"],["三只母鸡啄米粒，","十只小鸡前来吃。","老鹰突然来袭击，","两只小鸡被衔去。"]],[["乘车七百，","以明文德。","践土葵丘，","齐晋受福。"],["诸侯车辆逾七百，","前去盟会明文德。","践土葵丘订盟约，","齐晋两国受福泽。"]],[["百足俱行，","相辅为强。","三圣翼事，","王室宠光。"],["百足之虫齐行动，","互相配合力强盛。","三圣共同来辅佐，","王室荣耀得恩宠。"]],[["典册法书，","藏在兰台。","虫遭溃乱，","独不遇灾。"],["典籍文献法律书，","存在宫廷藏书处。","纵使遭逢大动乱，","灾祸独独不得入。"]],[["西诛不服，","恃强负力。","倍道趋敌，","师徒败覆。"],["领兵西去伐匈奴，","倚仗兵强而自负。","日夜兼程趋敌人，","最终落得全军覆。"]],[["春阳生草，","夏长条肄。","万物蕃滋，","充实益有。"],["阳春三月生青草，","夏日又生嫩枝条。","万物繁衍多茂盛，","果实饱满真富饶。"]],[["磝硗秃白，","不生黍稷。","无以供祭，","祇灵乏祀。"],["土地坚硬又贫瘠，","不能生长谷和糜。","没有粮食作祭品，","地神因之少祭祀。"]],[["褰衣涉河，","水深渍罢。","幸赖舟子，","济脱无他。"],["提起衣裳去过河，","水深流急不可涉。","幸赖船家来帮助，","平安渡过无灾祸。"]],[["宜行贾市，","所求必倍。","载喜抱子，","与利为友。"],["宜于出门做生意，","能获成倍好利息。","满怀喜悦抱儿子，","利益为友好福气。"]],[["兄征东夷，","弟伐辽西。","大克胜还，","封居河间。"],["哥哥前往征东夷，","弟弟又去伐辽西。","大获全胜返故里，","河间得到所封地。"]],[["初虽惊惶，","后乃无伤。","受其福庆，","相孝为王。"],["起初虽然很惊惶，","所幸后来未受伤。","得到福庆心中欢，","辅相孝顺为君王。"]],[["随风乘龙，","与利相逢。","田获三倍，","商旅有功。","憧憧之邑，","长安无他。"],["随着风儿乘飞龙，","与那大利喜相逢。","打猎获得三倍利，","经商之人得成功。","来往穿行都市中，","长享平安无忧凶。"]],[["鱼扰水浊，","寇围吾邑。","城危不安，","惊恐狂惑。"],["鱼受惊扰水浑浊，","敌寇包围我城郭。","内部危急人不安，","惊恐狂乱又昏惑。"]],[["虽塞复通，","履危不凶。","保其明公，","以道立宗。"],["虽然堵塞又畅通，","踩着危险无祸凶。","保其圣明和功德，","以此之道为正宗。"]],[["坤厚地德，","庶物蕃息。","平康正直，","以绥大福。"],["大地厚德载万物，","万物繁茂果实多。","和平康乐正直人，","蒙受大福和大德。"]],[["山水暴怒，","坏梁折柱。","稽难行旅，","留连愁苦。"],["山洪奔流齐暴怒，","冲坏桥梁毁坏柱。","出门人儿入困境，","徘徊流连甚愁苦。"]],[["使燕筑室，","身不庇宿。","家无聊赖，","瀸我衣服。"],["燕子巢穴太破敝，","不能遮挡风和雨。","家中贫困无依赖，","风吹雨打湿我衣。"]],[["矢石所射，","襄公痢剧。","吴子巢门，","伤病不治。"],["遭逢利箭所射中，","襄公伤股病转重。","吴子伐楚攻巢门，","牛臣一箭丧其命。"]],[["日月运行，","一寒一暑。","荣宠赫赫，","不可得保。","颠陨坠堕，","更为士伍。"],["太阳月亮行不止，","一寒一暑相交替。","尊宠荣耀多显赫，","岌岌可危难保持。","待到垮台坠落时，","重新成为小士卒。"]],[["宫门悲鸣，","臣围其君，","不得东西。"],["悲愤之声鸣宫门，","臣下包围其国君，","东难退步西难进。"]],[["戴盆望天，","不见星辰。","顾小失大，","福逃墙外。"],["头顶瓦盆去观天，","日月星辰都不见。","顾彼小节失大利，","幸福逃到墙外边。"]],[["天之所明，","祸不遇家。","反目相逐，","终得和美。"],["皇天明确告知君，","祸患不会进家门。","失妻反目相争吵，","终于重新又亲近。"]],[["天阴霖雨，","涂行泥潦。","商人休止，","市无所有。"],["天气久阴雨连绵，","道路泥泞行进难。","商人买卖皆终止，","市场空空无人烟。"]],[["嘉门福喜，","增累盛炽。","日就有德，","宜民宜国。"],["美好家庭多喜庆，","增长积累更兴盛。","天天接近有德人，","宜于国家和人民。"]],[["温山松柏，","常茂不落。","鸾凤以庇，","得其欢乐。"],["温山之上有松柏，","长年茂盛不落叶。","凤凰作为栖息地，","赖其长久享欢乐。"]],[["南山之阳，","华叶锵锵。","嘉乐君子，","为国宠光。"],["在那南山阳坡上，","花草树叶多茁壮。","官人幸福又快乐，","为国争荣增辉光。"]],[["画龙头颈，","文章未成。","甘言美语，","诡辞无名。"],["描画龙头与龙颈，","色彩花纹尚未成。","只凭甜言和蜜语，","空话连篇无实名。"]],[["婴儿孩子，","未有知识。","彼童而角，","敌我政事。"],["小小婴儿毛孩子，","没有见识不懂事。","童羊无角装有角，","前来扰乱我政事。"]],[["阴作大奸，","欲君勿言。","鸿鹄利口，","发其祸端。","荆季怀忧，","张伯被患。"],["施展阴谋作大奸，","不许好人去揭穿。","鸿鹄大志利君口，","无畏揭发起祸端。","小荆满腹藏忧虑，","老张无辜受牵连。"]],[["德之流行，","利之四乡。","雨师洒道，","风伯逐殃。","巡守封禅，","以告成功。"],["恩德行施传八方，","大利普及至四乡。","雨师洒水清道路，","风神驱走灾与殃。","巡行祭祀天和地，","祷告成功事业昌。"]],[["禹将为君，","装入昆仑。","稍进阳光，","登见温汤，","功德昭明。"],["夏禹即将为君王，","欲登昆仑整衣装。","阳光普照前进路，","登上山巅见温泉，","功德昭明天下扬。"]],[["五岳四渎，","含润为德。"],["五座大山四条河，","饱含雨露为仁德。"]]],[[["践履危难，","脱厄去患。","入福喜门，","见诲大君。"],["历经困苦与艰难，","摆脱困厄除隐患。","步入幸福欢乐门，","拜见诲我老父亲。"]],[["子鉏执麟，","春秋作经。","元圣将终，","尼父悲心。"],["子鉏打猎获麒麟，","孔子写作春秋经。","元圣即将离人世，","尼父悲哀又伤心。"]],[["夹河为婚，","期至无船。","摇心失望，","不见所欢。"],["隔条大河结姻缘，","到了婚期无渡船。","忐忑不安又失望，","不见哥哥心不欢。"]],[["天孙帝子，","与日月处。","光荣于世，","福禄繁祉。"],["天之皇孙帝之子，","与那日月居一起。","荣光显耀人世间，","幸福利禄都临至。"]],[["三羊争雌，","相随奔驰。","终日不食，","精气劳疲。"],["三只公羊争一雌，","相互追逐而奔驰。","从早到晚不进食，","精神受损甚劳疲。"]],[["禹召诸侯，","会稽南山。","执玉万国，","天下康安。"],["大禹召集诸侯王，","聚集会稽南山上。","万国执玉来朝拜，","天下宁静多安康。"]],[["早霜晚雪，","伤我禾麦。","损功弃力，","饥无所食。"],["晚上降雪晨降霜，","伤害麦苗不生长。","损功费力难成事，","百姓饥饿无食粮。"]],[["嵩融持戟，","杜伯荷弩。","降观下国，","诛逐无道。","夏商之季，","失福逃走。"],["祝融手持长戟行，","杜伯肩负大弩弓。","从天而降观下国，","诛伐无道之暴君。","夏商末日已来临，","失去大福远逃遁。"]],[["生有圣德，","上配太极。","皇灵建中，","受我以福。"],["君王生来有德义，","功高上能配太极。","先王为民立中道，","给我带来大福气。"]],[["下田陆黍，","万华生齿。","大雨霖集，","波病溃腐。"],["下等田里种糜子，","花叶茂盛将结实。","大雨倾盆齐降下，","使其溃烂受腐蚀。"]],[["子畏于匡，","困厄陈蔡。","明德不危，","竟得免害。"],["孔子被围在匡地，","又于陈蔡受困厄。","德性光明无危险，","终将灾难躲避过。"]],[["有两赤鹞，","从五隼噪。","操失无筈，","趋释尔射。","扶伏听命，","不敢动摇。"],["遥望长空两赤鹞，","随从五隼乱鸣叫。","张弓欲射箭无尾，","停止射击去寻找。","俯首帖耳来听命，","丝毫不敢有动摇。"]],[["当得自知，","不逢凶灾。","衰者复兴，","终无祸来。"],["自知之明待自我，","永远不会逢灾祸。","衰者重新得兴旺，","祸患永不来找我。"]],[["朽根刖树，","华叶落去。","卒逢火焱，","随风僵仆。"],["树根腐朽又断枝，","花儿叶子都落去。","突然遇上大火烧，","狂风吹来倒在地。"]],[["葛生衍蔓，","绤为愿。","家道笃厚，","父兄悦喜。"],["葛藤生长得蔓延，","织成葛布了心愿。","家中生活多富裕，","父亲兄弟皆大欢。"]],[["东行求玉，","反得弊石。","名曰无直，","字曰丑恶，","众所贱薄。"],["前去东方求美玉，","反而得到破弊石。","冠其名曰无价值，","形状丑恶不堪提，","众人轻视瞧不起。"]],[["瞻白用弦，","驽孱恐怯。","任力堕劣，","如猬见鹊。","偃视恐伏，","不敢拒格。"],["白刀闪光弦声响，","懦弱之马心恐慌。","势劣力薄难胜任，","如猬见鹊急躲藏。","仰卧偷视伏于地，","不敢上前去抵挡。"]],[["疮痍多病，","宋公危殆。","吴子巢门，","殒命失所。"],["满身疮痍体多病，","襄公伤股病转重。","吴子伐楚攻巢门，","失去住所丧其命。"]],[["东山西岳，","会合俱食。","百喜送从，","以成恩福。"],["遥居东山西山间，","双双会合同聚餐。","喜事接连来随从，","恩惠幸福得成全。"]],[["舞非其处，","失节多悔，","不合我意。"],["跳舞不分其场合，","丧失气节悔恨多，","与我心愿不相合。"]],[["南循汝水，","伐树斩枝。","过时不遇，","惄如周饥。"],["沿着汝堤朝前去，","砍下树干又砍枝。","丈夫过时未返回，","忧思如同腹受饥。"]],[["公孙驾骊，","载游东齐。","延陵说产，","遗季紵衣。"],["吴国公子驾骏骊，","乘车前往游东齐。","延陵季子一席话，","大夫子产赠紵衣。"]],[["乘舆八百，","以明文德，","践土葵丘，","齐晋受福。"],["诸侯车辆逾八百，","前去盟会明文德。","践土葵丘订盟约，","齐晋两国受福泽。"]],[["雄处弱水，","雌在海滨。","别离将食，","悲哀于心。"],["男子居住在弱水，","女子住在海之滨。","即将分手同进食，","悲痛哀愁涌上心。"]],[["结网得鲜，","受福安坐，","终无患祸。"],["收网获得新鲜鱼，","受福安坐来大利，","没有祸患无忧虑。"]],[["秋南春北，","随时休息；","处和履中，","安无忧凶。"],["秋天南飞春向朔，","随时就温而生活；","为人处世讲中和，","安乐没有凶与祸。"]],[["启户开门，","巡狩释冤。","夏台羑里，","汤文悦喜。"],["打开牢狱之大门，","帝王巡狩施大恩。","夏台羑里昭雪地，","商汤文王多欢欣。"]],[["符左契右，","相与合齿。","乾坤利贞，","乳生六子。","长大成就，","风言如母。"],["左边之符右边契，","双双相对合一起。","善男信女多和顺，","生育哺乳六个子。","平平安安长成人，","言谈举止似母亲。"]],[["饥蚕作室，","丝多乱绪，","端不可得。"],["饥蚕吐丝而作室，","蚕丝零乱不能理，","难以找到其头绪。"]],[["东壁余光，","数暗不明；","主母嫉妒，","乱我事业。"],["东方壁宿两小星，","屡屡昏暗不亮明；","主母嫉妒怀仇恨，","使我事业难成功。"]],[["白茅缩酒，","灵巫拜祷。","神嗜饮食，","使君寿考。"],["祭酒浇灌于白茅，","巫师向神而拜祷。","神灵爱吃又爱喝，","保君健康又寿考。"]],[["范公陶朱，","巧贾货资。","东之营丘，","易字子皮。","抱珠载金，","多得利归。"],["范蠡居陶称朱公，","会做买卖善经营。","离开越国去营丘，","鸱夷子皮是新名。","怀抱金银和财宝，","获得厚利回家中。"]],[["三羖五牂，","相随俱行。","迷入空泽，","循谷直北。","经涉六驳，","为所伤贼。"],["三公五母八只羊，","一路结伴向前方。","中途迷入沼泽地，","沿着山谷直北上。","跋涉途中遇猛兽，","羊儿全都遭残伤。"]],[["雄鹄延颈，","欲飞入关。","雨师洒道，","瀸我袍裘。","重车难前，","侍者稽首。"],["雄性天鹅高飞旋，","展翅鼓翼入山关。","雨师洒水清道路，","浸润我的衣和冠。","重车上坡难行走，","侍者跪地求平安。"]],[["中年蒙庆，","今岁受福。","必有所得，","荣宠受禄。"],["人到中年蒙喜庆，","今年大福又登门。","心想事成收获大，","拜受禄位享荣宠。"]],[["禄如周公，","建国洛东，","父子俱封。"],["官职俸禄如周公，","建国立都于洛东，","父亲儿子皆受封。"]],[["安床厚褥，","不得久宿。","弃我嘉燕，","困于东国。","投杼之忧，","不成祸灾。"],["床褥舒适又暖和，","不得长久当居所。","放弃安逸好生活，","甘愿受贫去东国。","曾母纵有投杼忧，","终究未能成灾祸。"]],[["蓄积有余，","粪土不居，","利有所得。"],["注重积蓄财有余，","破房旧屋不再居，","能够获得福与利。"]],[["心愿所喜，","乃今逢时。","得我利福，","不离兵革。"],["内心盼望来喜事，","今日碰到好时机。","得到利益和幸福，","刀枪兵祸不临至。"]],[["目不可合，","忧来搔足。","怵惕危惧，","去其邦族。"],["两眼睁睁难闭合，","忧搔我脚纠缠我。","战战兢兢心惶恐，","无奈远离其家国。"]],[["福德之士，","欢悦日喜。","夷吾相桓，","三归为臣，","赏流子孙。"],["有福有德大贤人，","天天欢乐笑盈盈。","管仲辅佐齐桓公，","市租三成归朝廷，","业绩流芳至子孙。"]],[["夏姬附耳，","心听悦喜，","利以博取。"],["夏姬贴耳献密计，","申公听得心中喜，","利以双方多获取。"]],[["叔迎伯兄，","遇巷在阳。","君子季姬，","并坐鼓簧。"],["弟弟前往迎兄长，","相遇在那巷之阳。","小伙和那小姑娘，","并排坐着吹笙簧。"]],[["徙巢去家，","南遇白乌。","东西受福，","与喜相得。"],["迁移巢穴离开家，","南行遇上白乌鸦。","东来西往皆受福，","常与欢乐结为伍。"]],[["舜升大禹，","石夷之野。","征诣王阙，","拜治水土。"],["在那石夷之野中，","大禹得到舜提升。","征召他到京都来，","让他治水凿龙门。"]],[["江河淮海，","天之都市。","商人受福，","国家富有。"],["长江黄河淮海地，","上天所赐大都市。","商人赖此享福泽，","国家人民都富裕。"]],[["隐隐填填，","火烧山根。","不润我邻，","独不蒙恩。"],["大火熊熊来势猛，","一直烧到山脚根。","老天不润我近邻，","独独不得蒙恩宠。"]],[["暗昧不明，","耳聋不聪。","陷入深渊，","灭顶忧凶。"],["眼瞎不能见光明，","耳聋声音听不清。","陷入深水泥潭中，","遭逢灭顶之灾凶。"]],[["鸟鸣喈喈，","天火将下。","燔我馆舍，","灾及妃后。"],["凶鸟声声在鸣叫，","预兆天火将来到。","大火毁了我房舍，","妃后宫馆遭焚烧。"]],[["十雉百雏，","常与母俱。","抱鸡搏虎，","谁敢为侣？"],["十鸡哺育百小鸡，","常随其母不分离。","抱鸡与虎去搏斗，","谁敢同他为伴侣？"]],[["营城洛邑，","周公所作。","世建三十，","年历八百，","福佑盘结，","坚固不落。"],["洛邑之地造城池，","周公为此来奠基。","传世达及三十代，","前后经历八百载。","幸福得佑多丰实，","坚强牢固不衰败。"]],[["三人俱行，","别离将食。","一身五心，","反复迷惑。"],["三人一同出门行，","共餐之后将离分。","一人身上五条心，","纷乱迷惑事无成。"]],[["三虎搏狼，","力不相当。","如鹰格雉，","一击破亡。"],["三虎搏击一只狼，","力量强弱不相当。","如鹰与鸡相格斗，","不值一击即败亡。"]],[["养虎畜狼，","还自贼伤。","无事招祸，","自取灾殃。"],["家养猛虎又养狼，","主人反被虎狼伤。","无事生非招祸患，","自作自受惹灾殃。"]],[["后时失利，","不得所欲。"],["时机错过利失去，","不能得到心所欲。"]],[["雉兔之东，","以野为场。","见鹰惊走，","死于谷口。"],["野鸡兔子居东方，","田野作为生活场。","老鹰飞来受惊惶，","死于山前空地上。"]],[["秋蛇向穴，","不失其节。","夫人姜氏，","自齐复入。"],["秋后天寒蛇入穴，","不会错过其时节。","桓公夫人齐文姜，","屡屡返回那齐国。"]],[["班马还师，","以息劳疲。","役夫嘉喜，","入户见妻。"],["士兵战马回营地，","调养休息解劳疲。","服役之人心中喜，","进门见到我爱妻。"]],[["鸟鸣葭端，","一呼三颠。","摇动东西，","危魂不安。"],["鸟儿鸣于芦苇端，","呼一声来颠三颠。","东摇西摆不停止，","岌岌可危魂不安。"]],[["命夭不遂，","死多鬼祟。","妻子啼喑，","早失其雄。"],["命短长寿难如愿，","死后化为鬼魂散。","妻子哭声变沙哑，","丈夫早逝于英年。"]],[["茆屋结席，","崇我文德。","三辰旂旗，","家受其福。"],["茅棚草席简陋舍，","崇尚自己之文德。","三辰旌旗高飘扬，","全家享受大福泽。"]],[["罗网四张，","鸟无所翔。","征伐困极，","饥穷不食。"],["天罗地网布四方，","鸟雀无处去飞翔。","征战讨伐甚疲劳，","饥饿贫穷无食粮。"]],[["天成地安，","积石为山。","润洽万里，","人赖其欢。"],["天长地久得平安，","积土堆石成高山。","云雨滋润万里田，","人民赖其多欣欢。"]],[["铜人铁柱，","暴露劳苦。","终月卒岁，","无有休止。"],["铜人铁柱难替换，","长期暴露受苦难。","风餐露宿戍役士，","终年在外难休闲。"]]],[[["猋风阻越，","车驰揭揭。","弃古追思，","失其和节，","忧心惙惙。"],["狂风肆虐扬起尘，","车儿飞速向前奔。","舍弃大道逐虚无，","和谐节奏丧失尽，","行旅之人忧忡忡。"]],[["蛇得泽草，","不忧危殆。"],["蛇居沼泽草地中，","不必忧虑祸与凶。"]],[["三牛生狗，","以戌为母。","荆夷上侵，","姬伯出走。"],["天降灾异牛生狗，","预兆戌年有祸咎。","荆地之夷来入侵，","姬伯逢此也逃走。"]],[["因祸受福，","喜盈其室，","求事皆得。"],["因为灾祸而得福，","喜气洋洋满室屋，","心想事成多自如。"]],[["江有宝珠，","海多大鱼。","亟行疾去，","可以得财。"],["长江之中有宝珠，","大海里面多大鱼。","疾行快走到那里，","可以得财获大利。"]],[["三牛生狗，","以戌为母。","荆夷上侵，","姬伯出走。"],["天降灾异牛生狗，","预兆戌年有祸咎。","荆地之夷来入侵，","姬伯逢此也逃走。"]],[["安息康居，","异国穹庐。","非吾习俗，","使伯忧惑。"],["安息和那康居人，","住在圆顶毡帐篷。","习俗与我不相同，","使我大哥生忧心。"]],[["行触天罡，","马死车伤。","身无聊赖，","困穷乏粮。"],["出行触犯那天罡，","马儿死亡车损伤。","孤苦伶仃无依靠，","困苦贫穷少食粮。"]],[["裸逞逐狐，","为人观笑。","牝鸡司晨，","主母乱门。"],["赤身裸体追狐狸，","被人讥笑无羞耻。","母鸡称雄报时辰，","家庭主妇坏门风。"]],[["为季求妇，","家在东海。","水长无船。","不见所欢。"],["为我小儿寻媳妇，","女家远在东海住。","大水漫漫无渡船，","双双不见其所欢。"]],[["男女合室，","二姓同食。","婚姻孔云，","宜我多孙。"],["男欢女爱合一户，","两姓人儿同吃住。","结婚联姻很美满，","多子多孙又多福。"]],[["太微帝室，","黄帝所直。","藩屏周卫，","不可得入。","常安长在，","终无祸患。"],["太微星宿之位置，","黄帝天神之居室。","四周防卫甚严密，","不得随意入此地。","平安康宁长健在，","始终不会有祸事。"]],[["赍金观市，","欲买骝子。","猾偷窃发，","盗我黄宝。"],["怀揣黄金游集市，","想买红色小马驹。","不料遇上窃贼来，","偷走我的金和玉。"]],[["三人俱行，","欲归故乡。","望邑入门，","拜见家亲。"],["三人结伴一路行，","想要返回故乡中。","走近城邑入家门，","拜见我的父母亲。"]],[["娶女姜吕，","驾迎新妇。","少齐在门，","夫子悦喜。"],["欲娶姜家那女郎，","驾车前往迎新娘。","新娘等待在门口，","新郎心中多欢畅。"]],[["伯仲旅行，","北求大牂。","长孟病足，","倩季负粮。","柳下之宝，","不失我邦。"],["老大老二同北上，","前去寻找大母羊。","孟皮脚上患了病，","请求季路来扛粮。","柳下维护其宝鼎，","安然不失我国邦。"]],[["洁自白齿，","衰老复起。","多孙众子，","宜利姑舅。"],["身体洁净牙齿白，","返老还童好容色。","多子多孙多福气，","公公婆婆有依托。"]],[["独宿憎夜，","嫫母畏昼。","平王逐建，","荆子忧惧。"],["独宿之人厌黑夜，","嫫母貌丑盼日落。","平王赶走儿子建，","楚子忧惧生灾祸。"]],[["追亡逐北，","呼还幼叔。","至山而得，","复归其室。"],["出门走失踪不见，","呼喊小弟到北边。","追至山前而相会，","重新回到自家园。"]],[["鸟飞无翼，","兔走折足。","虽欲会同，","未见其功。"],["鸟儿欲飞无翅膀，","兔欲奔走脚受伤。","双方虽然想会同，","最终未能得成功。"]],[["抱空握虚，","鸮惊我雏，","利去不来。"],["怀中手里皆空虚，","鸱鸮吓跑我小鸡，","利益弃我远离去。"]],[["山作天池，","陆地为海，","各得其所。"],["山顶积水成天池，","陆地变为大海洋，","各自实现其愿望。"]],[["为虎所啮，","泰山之阳。","众多从者，","莫敢救藏。"],["出游登上泰山阳，","上司遭到虎残伤。","纵有众多随从者，","胆怯不敢去救亡。"]],[["逶迤四牡，","思归念母。","王事靡盬，","不得安处。"],["四马驾车慢行步，","心中思念父和母，","王事整天没个完，","到处奔波太忙碌。"]],[["猕猴所言，","语无成全。","误我白马，","使干口来。"],["猕猴之辈所出言，","语无伦次难成全。","使其呼唤我白马，","口干舌燥甚艰难。"]],[["飞不远去，","卑斯内侍，","禄养未富。"],["不能高飞远离去，","只有为人当服侍，","俸禄区区不富裕。"]],[["大尾细腰，","重不可摇。","阴权制国，","平子逐昭。"],["大大尾巴细细腰，","沉重不能把它摇。","小人掌权管国政，","平子驱逐鲁昭公。"]],[["旦生夕死，","名曰婴鬼，","不可得祀。"],["早晨诞生晚上死，","赐它婴鬼为名字，","不得为其作祭祀。"]],[["子畏于匡，","困于陈蔡。","明德不危，","竟免厄害。"],["孔子被围在匡地，","又于陈蔡受困厄。","德性光明无危险，","终将灾难躲避过。"]],[["畏昏潜处，","候时昭朗。","卒逢白日，","显世荣主。"],["畏惧黑暗而潜藏，","盼望早日见阳光。","终于等到太阳出，","荣耀显赫似君王。"]],[["白鸟衔饵，","鸣呼其子。","施枝张翅，","来从其母。"],["白色鸟儿衔来食，","鸣叫呼唤子来吃。","小鸟枝头展开翅，","投入慈母怀抱里。"]],[["宫商角徵，","五音和起。","君臣父子，","弟顺有序。","唐虞龙德，","国无灾咎。"],["宫商角徵悦耳曲，","五音齐全乐声起。","君臣父子都和顺，","兄弟尊卑有秩序。","唐尧虞舜德高尚，","国家不会有灾异。"]],[["季姬踟蹰，","望子城隅。","终日至暮，","不见齐侯。"],["齐国少妇独徘徊，","城角眺望久等待。","从早一直到天黑，","不见哥哥襄公来。"]],[["鬼哭于社，","悲商无后。","甲子昧爽，","殷人绝祀。"],["鬼魂哭泣社庙中，","悲伤商朝无子孙。","甲子清晨伐纣王，","殷商绝代无后人。"]],[["天之所予，","福禄常在，","不忧危殆。"],["皇天在上所赐予，","幸福利禄常随你，","无忧无虑无灾异。"]],[["比目四翼，","相恃为福。","姜氏季女，","与君合德。"],["比翼鸳鸯比目鱼，","相依相随好福气。","季姜嫁到京师来，","与君同德不分离。"]],[["翕翕軥軥，","稍崩坠颠。","灭其令名，","长没不全。"],["车声轰轰驰向前，","转而陨坠遭崩颠。","美好名声被毁灭，","长久埋没不成全。"]],[["折若蔽目，","不见稚叔。","三足狐乌，","远去家室。"],["折下树叶挡住眼，","不见稚叔在哪边。","如同三足之孤乌，","它与元夫离得远。"]],[["羊肠九萦，","相推稍前。","止须王孙，","乃能上天。"],["羊肠小道九个弯，","互相扶助渐向前。","必须等待王孙来，","方能登天成神仙。"]],[["坤厚地道，","庶物蕃息。","平康正直，","以绥大福。"],["大地厚德载万物，","万物生长得繁衍。","君心平康又正直，","大福大利得成全。"]],[["有莘外野，","不逢尧主。","复归穷处，","心志劳苦。"],["伊尹耕于有莘野，","未逢尧舜遇夏桀。","重新回到贫困地，","甘愿去过穷生活。"]],[["邑长景行，","来观柘桑。","土伯有喜，","都叔允藏。"],["市长走在大道上，","巡视乡村观拓桑。","农官看了很高兴，","都士称赞又夸奖。"]],[["周师伐纣，","战于牧野。","甲子平旦，","天下大喜。"],["武王兴师伐暴纣，","开赴牧野去战斗。","甲子清晨获大胜，","天下人民都高兴。"]],[["逾江求橘，","并得大栗。","烹羊食豕，","饮酒歌笑。"],["越过江水寻橘子，","同时走运获大栗。","烹熟猪肉和羊肉，","载歌载舞饮美酒。"]],[["敝笱在梁，","鲂逸不禁。","渔父劳苦，","焦喉乾口，","空虚无有。"],["破笼撂在鱼梁上，","鲂鱼悠然逃它方。","渔夫身心多劳苦，","口干舌燥可怜样，","两手空空回家乡。"]],[["生有阴孽，","制家非阳，","排羊逐狐。","张氏易公，","忧祸重凶。"],["家由恶妇来执掌，","阴气强盛控制阳，","排斥异己逞凶狂。","张家换了掌门人，","忧患祸殃凶重重。"]],[["绝域异路，","多有畏恶。","使我惊惧，","思我故处。"],["边远地区路生疏，","多有妖魔恶人出。","使我心中很恐惧，","想念原来旧居处。"]],[["迷行失道，","不得牛马。","百贾逃亡，","市空无有。"],["出行途中迷方向，","好牛骏马未买上。","商人纷纷皆逃亡，","市场之内空荡荡。"]],[["雌生雏，","神异兴起。","乘云龙腾，","民戴为父。"],["雌性凤凰生儿子，","神异之事得兴起。","乘着浮云驾飞龙，","人民尊他为父亲。"]],[["叠叠累累，","如岐之室。","畜一息十，","古公治邑。"],["重重叠叠丘陵密，","岐山脚下修屋宇。","一人生育十个子，","古公亶父治城邑。"]],[["疮疡疥瘙，","孝妇不省。","君多疣赘，","四时作灾。"],["遍身疮疤痛又痒，","贤惠妻子不探望。","老公染上皮肤病，","一年四季受痛伤。"]],[["羊头兔足，","羸瘦少肉。","漏囊败粟，","利无所得。"],["小小羊头和兔脚，","肉儿少少太干瘪。","口袋破漏谷霉烂，","大利远去不能得。"]],[["薛蔑从靡，","空无谁是？","言季不明，","乐减少解。"],["薛地无人当随从，","谁来拥戴孟尝君？","岂言季札不明理，","观乐难解其中情。"]],[["妹为貌悫，","败君正色。","做事不成，","自为心贼。"],["小妹面色很惶恐，","败坏贤士好品性。","所行事儿不能成，","愧在自己内心中。"]],[["四马共辕，","东上太山。","骍骊同力，","无有重难，","与君笑言。"],["四马驾车齐向前，","往东登上泰山巅。","众马昂首同奔驰，","平安到达无危难，","与君笑语又欢言。"]],[["阴变为阳，","女化作男。","治道得通，","君臣相承。"],["阴柔转变为阳刚，","少女变性成儿郎。","治理之道得畅通，","君上臣下相依存。"]],[["南国少子，","材略美好。","求我长女，","贱薄不与。","反得丑恶，","后乃大悔。"],["南方有位小伙子，","相貌堂堂才略奇。","前来追求我长女，","嫌他贫穷未允许。","长女反而嫁丑夫，","使我后悔来不及。"]],[["昭公失常，","季氏悖狂。","逊齐处野，","丧其宠光。"],["昭公统治失常纲，","季氏势力呈凶狂。","被迫逃往齐国地，","丧失权位和宠光。"]],[["望幸不到，","文章未就。","王子逐兔，","犬踦不得。"],["盼望幸福不来到，","道德文章未作好。","王子打猎去逐兔，","猎犬脚跛追不着。"]],[["文山紫芝，","雍梁朱草。","长生和气，","王以为宝。","公尸侑食，","福禄来处。"],["文山之上紫芝好，","雍梁出产赤心草。","瑞草生长多茂盛，","君王将其视为宝。","采来瑞草作祭品，","幸福利禄都来到。"]],[["牵羊不前，","与心戾旋。","闻言不信，","误绐丈人。"],["用力牵羊不向前，","使我心烦又难堪。","听了不实之谎言，","重要人物受欺骗。"]],[["东山西山，","各自止安。","心虽相望，","竟未同堂。"],["相距东山和西山，","一对情人都平安。","心中虽然盼会同，","终究未能得团圆。"]],[["鹿求其子，","虎庐之里。","唐伯李耳，","贪不我许。"],["母鹿寻找其幼子，","小鹿已入虎穴里。","请求老虎发慈悲，","贪婪成性未允许。"]],[["三虎上山，","更相喧唤。","心志不亲，","如仇与怨。"],["三只老虎同上山，","更相吼叫狂奔窜。","心志各自不相同，","结下深仇和大怨。"]]],[[["虎豹怒咆，","慎戒外忧。","上下俱搔，","士民无聊。"],["老虎豹子齐咆哮，","慎防外界患来到。","上下惊慌皆失措，","士卒民众无依靠。"]],[["探巢得雏，","鸠鹊俱来，","使我心忧。"],["去探巢穴得小鸟，","斑鸠喜鹊来骚扰，","使我心中很烦恼。"]],[["日望一食，","常恐不足，","禄命寡薄。"],["天天盼望能吃好，","经常担心吃不饱，","全怪禄薄命不好。"]],[["良马疾走，","千里一宿。","逃难他乡，","谁能追复。"],["骏马快行去远方，","奋蹄千里歇一趟。","逃离危难奔他乡，","没有谁人能追上。"]],[["鹊巢鸠成，","上下不亲。","内外乖畔，","子走失愿。"],["喜鹊巢中鸠逞凶，","上下争斗不相亲。","众叛亲离各走散，","美好愿望皆落空。"]],[["云龙集会，","征讨西戎。","招边定众，","谁敢当锋？"],["精兵强将同会聚，","西去讨伐那匈奴。","安抚边疆老百姓，","谁敢与王来交锋？"]],[["春多膏泽，","夏润优渥。","稼穑成熟，","亩获百斛。"],["春雨如油润大地，","夏天好雨很及时。","田间庄稼都成熟，","亩产百斛谷与糜。"]],[["童妾独宿，","长女未室，","利无所得。"],["小妾独宿受煎熬，","长女未把婆家找，","婚嫁好处未得到。"]],[["四野不安，","东西为患。","退身止足，","无出邦域，","乃得全完。","赖其生福。"],["四方动乱不得安，","东西又生祸与患。","退身止步勿向前，","不要走出国门边，","能保人身都安全，","赖其使君福绵绵。"]],[["长宁履福，","安我百国。","嘉宾上堂，","与季同床。"],["长久安宁福盈门，","为我各国老百姓。","喜客贵宾请上堂，","与弟一同登龙床。"]],[["骐骥绿耳，","章明造父。","伯夙奏献，","衰续厥绪。","佐文成霸，","为晋元辅。"],["穆王八骏绿耳马，","善御能手造父驾。","伯夙进事晋献公，","赵衰承祖业发达。","辅助文公成霸业，","荣升晋国大管家。"]],[["张陈嘉谟，","赞成汉都。","主欢民喜，","其乐休休。"],["张良陈平是高参，","汉朝定都于长安。","君主欢乐人民喜，","安闲如意悠悠然。"]],[["大面长头，","来解君忧。","遗吾福善，","与我嘉惠。"],["额宽面大长长头，","前来为君解忧愁。","赐我幸福与友善，","美好胜地任我游。"]],[["畏昏不行，","待旦昭明。","燎猎受福，","老赖其庆。"],["夜色昏暗难出行，","停留原地待天明。","烧山打猎姜太公，","碰到文王得重用。"]],[["伯去我东，","首发如蓬。","长夜不寐，","辗转空床。","内怀惆怅，","忧摧肝肠。"],["丈夫离我去东方，","发如蓬草疯人样。","昼夜不安长声叹，","来回辗转卧空床。","内心悔恨又惆怅，","忧虑摧心剖肝肠。"]],[["朽条腐索，","不堪施用。","安静候时，","以待亲如。"],["朽敝木条和腐绳，","滥竽充数不顶用。","安心等待时机来，","选用亲信可靠人。"]],[["比目四翼，","相倚为福。","姜氏季女，","与君合德。"],["鸳鸯鸟儿比目鱼，","相依为命好福气。","季姜嫁到京师来，","与君同德不分离。"]],[["履阶登墀，","升高崔嵬。","福禄洋溢，","依天之威。"],["沿着台阶而登攀，","直达崔巍山之巅。","幸福利禄皆来到，","依赖上天之威严。"]],[["奢淫吝啬，","神所不福。","灵祇凭怒，","鬼瞰其室。"],["奢侈淫荡又吝啬，","神灵不赐福与乐。","司地之神被激怒，","鬼入其室遭凶祸。"]],[["大步上车，","南到喜家。","送我狐裘，","与福载来。"],["大步流星登上车，","南到吉祥人家坐。","送我一件狐皮袍，","载福回到我城郭。"]],[["东行西步，","先次后舍。","乾侯野井，","昭公失居。","与彼作期，","不觉至夜。"],["东奔西走到处撞，","失去处所心彷徨。","乾侯野井荒芜地，","昭公被逐逃他乡。","漂泊流浪无居处，","不知不觉夜茫茫。"]],[["喜乐踊跃，","来迎名家。","鹊巢百两，","以成嘉福。"],["欢天喜地迎新妻，","她是名家大闺女。","百辆彩车迎接她，","给我带来福和利。"]],[["非理所求，","谁敢相与？","往来不获，","徒劳道路。"],["无理要求口气大，","谁敢随意答应他？","往来频频无所获，","路上徒劳无所得。"]],[["北虏匈奴，","数侵边境。","左衽为长，","国犹未庆。"],["北方强悍匈奴人，","屡屡侵入我边境。","妄想逞凶作君长，","使我国家不安宁。"]],[["征不以理，","辞乃无名。","纵获臣子，","伯功不成。"],["征伐诸侯理不通，","师出无名难服人。","纵然俘获敌臣子，","霸业仍然难成功。"]],[["景星照堂，","麟游凤翔。","仁施大行，","颂声作兴。"],["吉星高悬照明堂，","麒麟凤凰来呈祥。","仁政得以广施行，","歌颂之声到处扬。"]],[["文明之世，","销锋铸耜。","以道顺民，","百王不易。"],["太平盛世无战争，","销熔兵器助农耕。","引导百姓走正路，","百朝君王难变更。"]],[["鸟无飞羽，","鸡斗折距。","徒自长嗟，","谁肯为侣？"],["鸟儿欲飞无翅膀，","两鸡争斗爪折伤。","枉然长悲又短叹，","谁肯同他结侣伴？"]],[["群队虎狼，","啮彼牛羊。","道路不通，","妨农害商。"],["成群结队虎与狼，","残食我的牛和羊。","道路阻隔不通畅，","妨碍务农和经商。"]],[["商伯沉酒，","庶兄奔走。","淫女荡夫，","仁德并孤。"],["纣王沉迷酒与色，","微子投奔西周国。","一对淫女和荡夫，","亡国灭身丢仁德。"]],[["三狸捕鼠，","遮遏前后。","当此之时，","不能脱走。"],["三只野猫捕老鼠，","前面截挡后面堵。","此时此地受围困，","绞尽脑汁难逃出。"]],[["陶叔孔圉，","不处乱国。","初虽未萌，","后受福庆。"],["陶叔孔圉善经商，","离开乱国去他乡。","初始纵然未得利，","后受福庆不用忙。"]],[["奋翅鼓翼，","翱翔外国。","逍遥北域，","不入温室。"],["雄鹰展开其翅膀，","长空自由高翱翔。","逍遥飞至北方地，","不恋温室暖住房。"]],[["德音孔博，","升在王室。","八极蒙佑，","受其福禄。"],["美好声誉广传扬，","荐举提升辅君王。","四面八方蒙佑助，","尽享幸福和利禄。"]],[["当变立权，","摘解患难。","涣然冰释，","大国以安。"],["变动当中立政权，","排除解脱患与难。","使之如冰速消融，","大国因之得平安。"]],[["羽动角，","甘雨续。","草木茂，","年岁熟。"],["羽音动而角音出，","春天甘雨得连续。","花草树木都茂盛，","年岁丰收五谷熟。"]],[["天所佑助，","福来祸去，","君王何忧？"],["皇天在上做保佑，","幸福追逐祸患走，","君王还有何忧愁？"]],[["方喙宣口，","圣智仁厚。","释解倒悬，","唐国大安。"],["生得方唇又阔口，","仁智圣明且敦厚。","善解百姓危与难，","国家长治得久安。"]],[["葛藟蒙棘，","华不得实。","谗佞乱政，","使恩雍塞。"],["葛藤处在荆棘中，","虽然开花果不生。","谗佞之人乱朝政，","恩德之路不畅通。"]],[["皇母多恩，","字养孝孙。","脱于襁褓，","成就为君。"],["祖母仁慈又多恩，","抚养孝子和贤孙。","离开襁褓长成人，","继承皇位成国君。"]],[["积冰不温，","北陆苦寒。","露宿多风，","君子伤心。"],["积雪不化结成冰，","北方原野寒又冷。","野外露宿风刺骨，","辗转难眠人伤心。"]],[["伯夷叔齐，","贞兼之师。","以德防患，","忧祸不存。"],["贤臣伯夷和叔齐，","贞洁清廉之大师。","仁德用以防祸患，","忧虑祸患远离去。"]],[["一雌三雄，","子不知公。","乱我族类，","使吾心愤。"],["一位妻子三个夫，","儿子不晓谁是父。","乱了我家伦理德，","使我心中生怨怒。"]],[["主安多福，","天禄所伏。","居之宠昌，","君子有光。"],["主人安坐享大福，","上天赐予我利禄。","居之家业多昌盛，","君有光明好前途。"]],[["千里槐根，","利多斧瘢。","树维枯屈，","枝叶不出。"],["千年槐树根腐烂，","身上几多斧痕瘢。","树体弯曲变干枯，","枝儿不存叶儿残。"]],[["周师伐纣，","胜殷牧野。","甲子平旦，","天下大喜。"],["周军前往伐暴纣，","开赴牧野去战斗。","甲子清晨获全胜，","天下人民乐悠悠。"]],[["日走月步，","趋不同舍。","夫妻反目，","主君失居。"],["太阳月亮天上行，","轨道速度各不同。","夫妻反目两相争，","堂堂男子失家庭。"]],[["宣发龙叔，","为王主国。","安土成稷，","天下蒙福。"],["斑白头发老龙叔，","他为帝王管国土。","安定社稷筑土坛，","天下人民都受福。"]],[["讽德诵功，","美周盛隆。","奭旦辅成，","光济冲人。"],["歌颂文王德与功，","赞扬周朝世兴隆。","周公召公来辅佐，","成王蒙受大恩宠。"]],[["三夜不寝，","忧来益甚。","戒以危惧，","弃其安居。"],["三夜不能得安寝，","忧愁天天在加重。","预知将有大危难，","放弃安乐逃出门。"]],[["思愿所之，","乃今逢时。","洗濯故忧，","拜其欢来。"],["想去美丽好地方，","今日实现其愿望。","洗去往日旧忧愁，","共度欢乐好时光。"]],[["噂噂嗫嗫，","夜作昼匿。","谋议我资，","来窃吾室。","空尽己财，","几无所食。"],["几个小偷窃窃语，","夜行昼伏窥时机。","行迹隐藏很周密，","深夜悄悄入我室。","将我钱财盗一空，","使我数日饥无食。"]],[["骍牛亡子，","鸣于大野。","申复阴征，","还归其母，","说以除悔。"],["母牛丢失其小牛，","野外吼叫不停休。","直到午后日偏西，","返回母旁乐悠悠，","欢快高兴莫悔愁。"]],[["王良善御，","伯乐知马。","周旋步骤，","行中规矩。","止息有节，","延命寿考。"],["王良善于驾驭车，","相马之人属伯乐。","精通御马之步骤，","使其安分守规则。","劳逸结合相调节，","益寿延年常快乐。"]],[["释然远咎，","避患害早。","田获三狐，","以贝为宝。"],["毅然远离那烦恼，","为避患害行动早。","打猎获得三只狐，","金钱玉贝为财宝。"]],[["仁兽所处，","国无凶咎。","市贾十倍，","复归惠里。"],["麒麟凤凰所处地，","国家不会有凶事。","经商能获十倍利，","返回仁爱故乡里。"]],[["六目俱视，","各欲有志。","一言不同，","乖戾生讼。"],["六只眼睛盯着看，","各人自有各打算。","没有一言能相同，","矛盾激化起争讼。"]],[["傅说王良，","骖御四龙。","周径万里，","无有危凶。"],["天神傅说和王良，","驾驭骏马走四方。","往来周行千万里，","一路顺风无凶殃。"]],[["伯仲叔季，","日暮寝寐。","醉醒失明，","丧其贝囊，","卧拜道旁。"],["兄弟四人出了门，","夜晚露宿旅途中。","醉醒之后又糊涂，","钱袋被贼盗一空，","卧倒路旁难行进。"]],[["海为水王，","聪圣且明。","百流归德，","无有叛逆，","常饶优足。"],["海为万水之王君，","聪慧而且又圣明。","百流朝宗她之德，","不会倒流或逆行，","长久富饶多丰盈。"]],[["江有宝珠，","海多大鱼。","亟行疾至，","可以得财。"],["长江之中有宝珠，","大海里面多大鱼。","急行快走到那里，","可以得财获大利。"]],[["远视千里，","不见所持。","离娄之明，","无益于耳。"],["远视千里之广域，","难辨所拿之东西。","离娄眼睛虽明亮，","耳朵听音却无益。"]],[["弱足刖跟，","不利出门。","市贾无赢，","折亡为患。"],["跛脚又断脚后跟，","不利出门去远行。","前往经商难赢利，","折脚伤跟有厄运。"]],[["利尽得媒，","时不我来。","鸣雌深涉，","寡宿独居。"],["经商得到好信息，","时机失去不再至。","夜半鸡鸣出门去，","妻留家中独叹息。"]]],[[["黄虹之野，","贤君所在。","管叔为相，","国无灾咎。"],["黄虹出现呈吉祥，","贤明国君在朝上。","任用管仲为宰相，","国家平安无灾殃。"]],[["符左契右，","相与合齿。","乾坤利贞，","乳生六子。","长大成就，","风言如母。"],["玉符在左契在右，","左右吻合好兆头。","乾男坤女多温顺，","哺育六子长成人。","自立成就大事业，","风度言语似母亲。"]],[["蝗啮我稻，","驱不可去。","实穗无有，","但见空蒿。"],["蝗虫残食我稻谷，","费力驱赶不离去。","禾穗果实被吃尽，","只剩蒿草留田中。"]],[["婴孩求乳，","母归其子，","黄麑悦喜。"],["鹿子鸣呼求哺乳，","终于盼来它慈母，","小鹿欢欣受其哺。"]],[["折若蔽目，","不见稚叔。","失旅亡民，","远去室家。"],["折下树叶挡住眼，","不见丈夫在哪边。","远离民人失伴侣，","君与家室远又远。"]],[["牂羊首，","君子不饱。","年饥孔荒，","士民危殆。"],["头大身瘦之母羊，","食不饱腹饿断肠。","年岁无收闹饥荒，","大夫庶民心惶惶。"]],[["灵龟陆处，","盘桓失所。","伊子退耕，","桀乱无辅。"],["灵龟爬行陆地上，","失去大海好地方。","伊尹弃官去种地，","夏桀无道逞凶狂。"]],[["威约拘囚，","为人所诬。","皋陶平理，","几得脱免。"],["遭人诬陷成囚犯，","使我身心受熬煎。","清官皋陶来断案，","几经周折得平反。"]],[["鸟升鹊举，","照临东海。","尨降庭坚，","为陶叔后。","封于英六，","福履绥厚。"],["鸟儿高飞升起来，","一路顺风到东海。","尨降庭坚两兄弟，","同为陶叔之后代。","封于英地和六地，","过上幸福好日子。"]],[["四目相视，","稍近同轨。","日昳之后，","见吾伯姊。"],["两对眼睛传神情，","终于同道一路行。","太阳偏西近黄昏，","与姐对面来谈心。"]],[["大步上车，","南至喜家。","送我狐裘，","与福载来。"],["大步流星登上车，","南去朋友家中坐。","送我一件狐皮袍，","携福回到我城郭。"]],[["卒都和合，","未敢面见。","媒妁无良，","使我不乡。"],["男女婚姻将成全，","双双不敢去会面。","请求媒人无良策，","使我美梦难兑现。"]],[["鸿飞遵陆，","公出不复，","伯氏客居。"],["鸿雁顺着陆地飞，","父亲出走未返回，","大哥一人客店睡。"]],[["代戍失期，","患生无知。","惧以发难，","为我开基。","邦国忧愁。"],["士卒服役误期限，","祸患发生未预见。","死里求生闹造反，","为我汉朝把基奠。","国家人民有危难。"]],[["齐鲁争言，","战于龙门。","构怨结祸，","三世不安。"],["齐鲁两国相争执，","龙门之地起战事。","双方结下怨和仇，","殃及子孙和后世。"]],[["周政养贼，","背生人足。","陆行不安，","国危为患。"],["周末暴政养佞人，","背生人足兆有凶。","百姓不敢出门行，","国家危难不安宁。"]],[["蜩螗欢喜，","草木嘉茂。","百果蕃生，","日益富有。"],["知了叫得很响亮，","花草树木长势旺。","百果繁茂实累累，","日复一日好景象。"]],[["魃为灾虐，","风吹云却。","欲上不得，","复归其宅。"],["旱神暴虐似虎狼，","热风吹云退北方。","欲要降雨又不能，","默然返回它故乡。"]],[["乘骝驾骊，","游至东齐。","遭遇行旅，","逆我以资，","厚得利归。"],["红马黑马同拉车，","东游到达那齐国。","碰到行商好朋友，","送我资金和钱物，","得利回到我城郭。"]],[["凤生七子，","同巢共乳，","欢悦相保。"],["凤凰生下七个子，","同居一巢受哺育，","欢乐相保多安逸。"]],[["桃雀窃脂，","巢于小枝。","摇动不安，","为风所吹。","心寒漂摇，","常忧殆危。"],["桃雀和那窃脂鸟，","小树枝头筑起巢。","树枝摇晃不安静，","是那风儿太糟糕。","内心畏惧神不定，","经常担忧受困扰。"]],[["东山西山，","各自止安。","虽相登望，","竟未同堂。"],["相处东西两山间，","各自双双都平安。","虽然希望能会同，","终究未能得团圆。"]],[["匍匐出走，","惊惧惶恐。","白虎生孙，","蓐收在后。"],["胆战心惊甚惶恐，","伏地爬行而逃生。","蓐收之神降罪恶，","白虎子孙来逞凶。"]],[["重戈射隼，","不知所定。","质疑蓍龟，","告以肥牡。","明神答报，","宜利止居。"],["弓箭重重射鹞鹰，","不知何时利于行。","蓍草龟甲来占卜，","肥牲祭礼求神灵。","神明显灵告知我，","不要轻举妄行动。"]],[["开门内福，","喜至我侧。","嘉门善祥，","为我室宅。","宫城洛邑，","以昭文德。"],["打开宅门迎福庆，","喜事频频都来临。","美好家庭呈吉祥，","使我居之很顺心。","洛邑之地建城池，","昭示文王之大恩。"]],[["鸟飞狐鸣，","国乱不宁。","下强上弱，","为阴所刑。"],["鸟儿乱飞狐衰鸣，","国家动乱不安宁。","奸臣在下逞强盛，","执政君王遭苦刑。"]],[["三鸡啄粟，","八雏从食。","饥鹰卒击，","失亡两叔。"],["三只老鸡在啄食，","八只小鸡跟着吃。","饥饿之鹰来袭击，","两只小鸡被抓去。"]],[["叹息不悦，","忧从中出。","丧我金罂，","无妄失位。"],["悲哀叹息不高兴，","内心深处忧患生。","失去我的金贮器，","无故丧权真伤心。"]],[["刚柔相呼，","二姓为家。","霜降既同，","惠我以仁。"],["男刚女柔相呼应，","两姓组成一家庭。","霜降之日即会同，","上天赐我义与仁。"]],[["襄送季女，","至于荡道。","齐子旦夕，","留连久处。"],["哥哥襄公送文姜，","送至鲁国大道上。","文姜早晚思念他，","恋恋不舍久彷徨。"]],[["低头窃视，","有所畏避。","行作不利，","酒酸鱼馁，","众莫贪嗜。"],["低头缩颈偷视人，","心中自有畏避情。","出行动作不顺利，","酒酸鱼臭难食用，","众人不要太贪心。"]],[["典策法书，","藏在兰台。","虽遭乱溃，","独不遇灾。"],["典籍文献法律书，","存在宫廷藏书处。","纵使遭逢大动乱，","独有灾祸不得入。"]],[["旦醉病酒，","暮即瘳愈，","不及为咎。"],["早上酒醉成病疾，","到了傍晚即痊愈，","灾咎危难未临至。"]],[["画龙头颈，","文章未成。","甘言美语，","说辞无名。"],["画龙只画头与颈，","色彩花纹未绘成。","只凭甜言和蜜语，","空话连篇无实名。"]],[["日月运行，","一寒一暑。","荣宠赫赫，","不可得保。","颠踬殒坠，","更为士伍。"],["太阳月亮天上行，","寒暑自然而形成。","赫赫有名多荣宠，","可惜不能久留存。","一旦垮台坠落下，","变成普通老百姓。"]],[["争利王市，","朝多君子。","苏氏六国，","获其荣宠。"],["争名夺利于王市，","朝廷之内多贤士。","六国相印苏秦佩，","得到信任获荣誉。"]],[["六蛇奔走，","俱入茂草。","惊于长途，","畏惧啄口。"],["六条水蛇齐奔走，","全都潜伏草里头。","爬行途中受惊吓，","畏惧长嘴和利口。"]],[["悬貆素餐，","食非其任。","失舆剥庐，","休坐徙居。"],["不去打猎家有貆，","不去种田食有餐。","失掉车子毁了房，","迁离此地莫等闲。"]],[["欢欣九子，","俱见大喜。","携提福至，","王孙是富。"],["天上尾宿九颗星，","凡人看见有好运。","帝王龙子和龙孙，","长保富贵久安宁。"]],[["伯夷叔齐，","贞廉之师。","以德防患，","忧祸不存。"],["贤臣伯夷和叔齐，","廉洁奉公之先师。","美德用以防祸患，","忧祸灾患远离去。"]],[["雄圣伏名，","人匿麟惊。","走凤飞北，","乱溃未息。"],["英雄圣贤隐大名，","人民藏匿麟受惊。","凤凰高飞向北去，","动乱不停祸频频。"]],[["久鳏无偶，","思配织女。","求其非望，","自令寡处。"],["长久独居无对象，","盼会织女天河上。","所求愿望难实现，","自找霉头守空房。"]],[["破亡之国，","无所不福，","难以止息。"],["破败灭亡没落国，","苍天不降其福泽，","居之难有好生活。"]],[["老慵多欲，","弊政为贼。","阿房骊山，","子婴失国。"],["年老懒惰性贪婪，","政治多弊国受残。","修筑阿房骊山陵，","后代子婴皇权倾。"]],[["三羖五牂，","相随俱行。","迷入空泽，","经涉虎庐。","为所伤贼，","死于牙腹。"],["三公五母八只羊，","结伴同行在路上。","沼泽地里迷方向，","途中误入老虎乡。","遭受猛兽所残伤，","虎口之中把命丧。"]],[["喋嗫噱嚾，","昧冥相搏。","多言少实，","语无成事。"],["私语又加喧嚣声，","暗中相斗又相争。","空话连篇难兑现，","只说不做事不成。"]],[["舞阳渐离，","击筑善歌。","慕丹之义，","为燕助轲。","阴谋不遂，","矐目死亡，","功名何施。"],["秦舞阳和高渐离，","击筑善歌是勇士。","协助荆轲刺秦王，","敬慕丹之仁和义。","预定目的未达到，","壮士咸阳被处死，","未能救燕立功绩。"]],[["尹氏伯奇，","父子分离。","无罪被辜，","长舌为灾。"],["吉甫儿子名伯奇，","他与父亲远分离。","儿子无罪受迫害，","长舌之人是后妻。"]],[["五精乱行，","政逆皇恩。","汤武赫怒，","共伐我域。"],["五方行星乱顺序，","暴政违背皇天意。","商汤武王被激怒，","共同讨伐我城池。"]],[["西历玉山，","东入玉门。","登上福堂，","饮万岁浆。"],["西去经过那玉山，","向东进入玉门关。","登上福瑞之殿堂，","喜饮长生不老浆。"]],[["行触大忌，","与司命忤。","执囚束缚，","拘制于吏。","幽人有喜。"],["行事不慎犯禁忌，","司命之神不乐意。","如同囚犯受束缚，","行动受制于官吏。","终获自由逢大喜。"]],[["机父不贤，","朝多谗臣。","君失其政，","使家久贫。"],["主政之人不贤明，","朝廷之内多谗臣。","君王受骗失政权，","我家长期受贫穷。"]],[["三人俱行，","北求大牂。","长孟病足，","倩季负粮。","柳下之宝，","不失我邦。"],["兄弟三人行路上，","向北去寻大母羊。","孟皮脚上患了病，","请求季路来扛粮。","柳下维护其宝鼎，","安然不失我国邦。"]],[["鹄思其雄，","欲随凤东。","顺理羽翼，","出次须日。","中留北邑，","复返其室。"],["雌性天鹅思其雄，","随着凤凰飞向东。","梳顺羽毛理好翼，","迎着太阳升高空。","中途停留北方镇，","终无返回自家中。"]],[["常德自如，","不逢祸灾。"],["恪守美德常欢乐，","永远不会逢灾祸。"]],[["白鹄游望，","君子以宁。","履德不愆。","福禄未成。"],["天鹅长空高飞翔，","为官之人多吉祥。","坚持履行仁与德，","福禄频频来身旁。"]],[["肤敏之德，","发愤晨食。","虏豹擒说，","为王得福。"],["言行机敏好品德，","发愤忘食为家国。","破魏虏豹擒夏说，","为王求福兴邦业。"]],[["百足俱行，","相辅为强；","三圣翼事，","国富民康。"],["一群马骇行路上，","相互协助力量强；","三位圣人辅朝政，","国家富强民安康。"]],[["生不逢时，","困且多忧。","年老衰极，","中心悲愁。"],["出生未逢好时机，","贫困而且多忧虑。","年纪衰老力不及，","悲愁常存在心里。"]],[["出门蹉跌，","看道后旅。","买羊逸亡，","取物逃走。","空手握拳，","坐恨为咎。"],["走出家门即失足，","跌倒复起追行旅。","买得羊儿又丢失，","财物全被贼窃去。","两手空空握拳头，","独坐生悔自叹息。"]],[["鸟鸣嘻嘻，","天火将下。","燔我屋室，","灾及妃后。"],["凶鸟声声在鸣叫，","预兆天火将来到。","大火毁了我房舍，","妃后宫馆遭焚烧。"]],[["牧羊稻田，","闻虎喧欢。","畏惧惕息，","终无祸患。"],["放牧羊儿于稻田，","忽然听到虎喧唤。","畏惧警惕不敢动，","终于摆脱祸与患。"]],[["龙潜凤北，","箕子变服，","阴孽萌作。"],["神龙潜藏凤北去，","箕子佯装成奴隶，","一场阴孽将兴起。"]],[["国无比邻，","相与争强。","纷纷凶凶，","天下扰攘。"],["两国比邻不亲近，","相互逞霸争强胜。","局面纷乱气势凶，","天下骚扰不安宁。"]]],[[["积德累仁，","灵佑顺信，","福祉日增。"],["善于积累仁与德，","神灵使君顺心乐，","福利天天得增多。"]],[["谨慎重言，","不幸遭患。","周召述职，","脱免牢门。"],["执掌朝政谨慎言，","不幸遭到祸与患。","周召二臣去述职，","成王得救脱危难。"]],[["鸟飞鼓翼，","喜乐尧德。","虞夏美功，","要荒宾服。"],["鸟儿展翅鼓其翼，","歌颂唐尧德与绩。","虞夏功勋万世扬，","四方归服我君王。"]],[["牙孽生齿，","室堂启户。","幽人利贞，","鼓翼起舞。"],["牙床长出新牙齿，","室堂门户得开启。","隐居之人守节操，","翩翩起舞庆吉利。"]],[["使伯采桑，","拒不肯行。","与叔争讼，","更相毁伤。"],["使哥出门去采桑，","哥哥固执不前往。","兄弟二人起争讼，","互相攻击伤感情。"]],[["手足易处，","头尾颠倒。","公为雌妪，","乱其蚕织。"],["手脚位置都更换，","头脑尾巴顺序颠。","老翁变为老太婆，","养蚕织布皆搞乱。"]],[["匠卿操斧，","豫章危殆。","袍衣脱剥，","禄命讫已。"],["木匠师傅举起斧，","前来砍伐枕樟树。","官袍官衣被脱剥，","俸禄性命都终结。"]],[["天女踞床，","不成文章。","南箕无舌，","饭多沙糠。","虐众盗名，","雌雄折颈。"],["织女蹲于机床旁，","不能织出文锦样。","南方箕星没有舌，","饭中多沙多秕糠。","人间佞贼盗功名，","善男信女遭残伤。"]],[["大椎破毂，","长舌乱国。","墙茨之言，","三世不安。"],["大椎颠破车轮毂，","国乱源于长舌妇。","阴暗角落吹阴风，","后世三代不安宁。"]],[["衔命辱使，","不堪厥事。","中坠落去，","更为斯吏。"],["奉命出使受辱回，","不能胜任又复归。","中途官场跌落去，","肩挑背驮做人鬼。"]],[["三蛇共食，","同类相得。","甘露时降，","生我百谷。"],["三蛇共同居一室，","同类聚集在一起。","甘甜雨露随时降，","看我庄稼好长势。"]],[["衣宵夜游，","与君相逢。","除患解惑，","使我不忧。"],["夜穿绡服去出游，","与君相逢意相投。","解除祸患消疑惑，","使我不再生忧愁。"]],[["被发兽心，","难与为邻。","来如风云，","去如绝弦，","为狼所残。"],["肩佩长发野兽心，","不可与之为近邻。","来如风卷雾云涌，","去如利箭离弦弓，","终被恶狼伤其身。"]],[["刚柔相呼，","二姓为家。","霜降既同，","惠我以仁。"],["男刚女柔相呼应，","两姓组成一家庭。","霜降之日将会同，","上天赐我义与仁。"]],[["牛马聋聩，","不晓声味；","委以鼎俎，","治乱愦愦。"],["牛马眼瞎耳亦聋，","声音味道辨不清；","无能之辈委重任，","乱作一团事不成。"]],[["低头窃视，","有所畏避。","行作不利，","酒酸鱼馁，","众莫贪嗜。"],["低头缩颈偷视人，","心中自有畏避情。","出行动作不顺利，","酒酸鱼臭难食用，","众人莫要太贪心。"]],[["雨师娶妇，","黄岩季子。","成礼既婚，","相呼南去，","膏泽下土，","年岁大有。"],["雨师娶来新媳妇，","她是黄岩小女子。","举行仪礼即成婚，","夫妇相呼向南去。","普降甘霖润田地，","年岁丰收有大喜。"]],[["戴盆望天，","不见星辰。","顾小失大，","遁逃墙外。"],["头戴大盆去观天，","日月星辰都不见。","顾及小而失其大，","福庆逃到墙外边。"]],[["二人辇车，","徙去其家。","井沸釜鸣，","不可以居。"],["夫妻二人拉车行，","远远搬离自家门。","居处井沸锅又鸣，","住在此地不安宁。"]],[["攘臂反肘，","怒不可止。","狠戾腹心，","无以为市。"],["抬起胳膊反转肘，","怒气冲冲相争斗。","行为粗暴心毒狠，","无人与他谈营生。"]],[["汤火之忧，","转解喜来。"],["赴汤蹈火之忧愁，","转而喜来跟我走。"]],[["忠信辅成，","王政不倾。","公刘肇基，","文武绥之。"],["周公忠信辅成王，","王室政权不倾僵。","公刘奠定好基础，","文王武王业盛昌。"]],[["登高斩木，","顿踬蹈险。","车倾马罢，","伯叔吁嗟。"],["登上高处去伐木，","踩空坠地有险阻。","车翻马伤出事故，","哥哥弟弟大声呼。"]],[["桑之将落，","陨其黄叶。","失势倾侧，","如无所立。"],["桑树叶儿将要落，","颜色枯黄往下脱。","官人失势倒一侧，","立足之地不能得。"]],[["鸾凤翱翔，","集于家国。","念我伯姊，","与母相得。"],["鸾鸟凤凰俱翱翔，","飞来集于国土上。","思念我那好大姐，","双双欢聚母身旁。"]],[["阴淫所居，","盈溢过度，","伤害禾稼。"],["阴气凝结大雨降，","洪水泛滥逞凶狂，","庄稼禾苗受损伤。"]],[["霄冥高山，","道险峻难。","王孙罢极，","困于阪间。"],["高山插入雾云端，","道路危险甚艰难。","王孙疲劳到极点，","终被困于山坡间。"]],[["和璧随珠，","为火所烧。","冥昧失明，","夺精无光，","弃于道旁。"],["卞和璧和随侯珠，","遭火焚烧无用处。","昏暗失去其亮明，","珠宝之光难发出，","扔在道旁无人顾。"]],[["虞君好神，","惠我老亲。","恭承宗庙，","虽愠不去，","复我内室。"],["虞国君主爱敬神，","使我祖宗逢好运。","恭敬承办宗庙事，","纵不顺心不离去，","尔后复返归皇室。"]],[["爪牙之夫，","怨毒祈父。","转忧与己，","伤不及母。"],["守卫王室之爪牙，","怨恨领兵的司马。","将我置于忧愁中，","痛心难把母侍奉。"]],[["仓盈庾亿，","宜稼黍稷，","年岁有息。"],["仓库积粮千百亿，","装满糜子和谷子，","年年粮食都充裕。"]],[["窗牖户房，","道利明光；","贤智辅圣，","仁德大行。","家给人足，","海内殷昌。"],["房中自有门和窗，","室内利于采阳光；","国有贤人来辅佐，","仁德得以大发扬。","百姓丰衣又足食，","四海之内都盛昌。"]],[["切切之患，","凶重忧荐，","为虎所吞。"],["灾患接连不间断，","凶恶频繁难避免，","终遭恶虎所伤残。"]],[["水无鱼滋，","陆为海涯。","君子失居，","小人相携。"],["鱼儿无水难存活，","陆为海滩无收获。","好人失去居住地，","邪恶小人手相携。"]],[["九疑郁林，","沮湿不中。","鸾凤所恶，","君子攸去。"],["九嶷山和郁林郡，","潮湿无法居其中。","吉祥鸟儿讨厌它，","有德之人远离行。"]],[["六翮泛飞，","走归不及。","脱归王室，","亡其骍特。"],["鸟儿展翅乱飞翔，","不能返回它故乡。","主人脱险归王室，","红马公牛全丢光。"]],[["不直庄公，","与我争讼。","媒伯无礼，","自令壅塞。"],["蛮不讲理那庄公，","强行与我起争讼。","媒人做事无礼貌，","自己钻进死胡同。"]],[["疮痍多病，","宋公危殆。","吴子巢门，","殒命失所。"],["遍身疮痍体多病，","宋公负伤病危重。","吴子进军攻巢门，","牛臣暗箭丧其命。"]],[["失羊捕牛，","无损无忧。"],["丢失羊儿捕到牛，","没有损失无忧愁。"]],[["夏麦麸黄，","霜击其芒。","疾君败国，","使我诛伤。"],["夏麦结粒又灌浆，","严霜打坏其麦芒。","君主昏愦乱国事，","使我受害遭诛伤。"]],[["昧昧暗暗，","不知白黑。","风雨乱忧，","光明伏匿，","幽王失国。"],["黑暗笼罩失光泽，","不知白天和黑夜。","狂风暴雨来侵扰，","太阳西斜渐没落，","幽王淫乱失了国。"]],[["执斧破薪，","使媒求妇。","和合二姓，","亲御饮酒。","色比毛嫱，","姑翁悦喜。"],["手执斧子去劈薪，","托个媒人好提亲。","两姓合为一家人，","同饮喜酒贺新婚。","儿媳漂亮赛毛嫱，","公公婆婆很高兴。"]],[["六疾失狂，","痴走妄行。","北入患门，","与祸为邻。"],["六疾交加成癫狂，","四处胡行乱碰撞。","向北步入祸患门，","君与大祸成近邻。"]],[["驱羊就群，","佷不肯前。","庆季愎谏，","子之被患。"],["驱赶羊儿回群中，","羊儿刚愎不前行。","庆封专权又任性，","庆舍屡谏受围攻。"]],[["二人共路，","东趋西步。","十里之外，","不相知处。"],["两人一同出门行，","一人向西一向东。","走出十里之外地，","相互不见其踪影。"]],[["义不胜情，","以欲自营。","几利危躬，","折角摧颈。"],["见利忘义太无情，","利欲熏心谋营生。","区区小利危性命，","折角伤颈利难盈。"]],[["骚骚扰扰，","不安其类。","疾在颈项，","凶危为忧。"],["内部混乱不堪言，","同类群体不得安。","疾病生在脖子上，","凶祸危难成忧患。"]],[["三河俱合，","水怒涌跃。","坏我王室，","民困于食。"],["三条大河汇一起，","波涛光涌奔流急。","浊浪冲击我王室，","百姓饥饿不得食。"]],[["阳曜早疾，","伤病稼穑，","农人无食。"],["阳气太盛旱情重，","庄稼受害无收成，","农人无食枉劳神。"]],[["流浮出食，","载豢入屋。","释辔系马，","西南庑下。"],["煮好液体精饲料，","将其送至饲养槽。","西南墙下走廊上，","是我养马好地方。"]],[["门户之居，","可以止舍。","进仕不殆，","安乐相保。"],["寻得一个居住地，","可以安家长留宿。","出门做官无危险，","能保快乐永安逸。"]],[["过时不归，","雌雄苦悲。","徘徊外国，","与母分离。"],["过了时辰不回归，","夫妻远离心苦悲。","流浪异乡他国地，","儿子与母两分离。"]],[["中田有庐，","疆场有瓜。","献进皇祖，","曾孙寿考。"],["田中萝卜个头大，","田边种着青翠瓜。","献给祖先请收下，","曾孙寿考天佑他。"]],[["失时无友，","覆家出走，","累如丧狗。"],["失去时机无朋友，","妻离子散都出走，","活像一条丧家狗。"]],[["反鼻歧头，","二寡独居。"],["鼻孔朝天头压眼，","两女寡居受熬煎。"]],[["衣裳颠倒，","为王来呼。","成就东周，","封受大福。"],["上衣下裳穿颠倒，","君王有事急征召。","成就东周大事业，","封赏得福多荣耀。"]],[["飞不远去，","还归故处，","兴事多悔。"],["不能远走和高飞，","行至中途又返回，","凡事心中多恨悔。"]],[["含血走禽，","不晓五音。","瓠巴鼓瑟，","不悦于心。"],["纵有气血兽与禽，","玄妙五音它不懂。","琴师奏乐虽动听，","心中照样不高兴。"]],[["求玉获石，","非心所欲，","祝愿不得。"],["去求美玉反得石，","并非内心之所欲，","愿望落空独叹息。"]],[["山崩谷绝，","大福尽歇。","泾渭失纪，","玉历既已。"],["高山崩塌大地裂，","福庆吉利都尽歇。","泾渭清浊难分辨，","国运气数将尽绝。"]],[["瞋目惧怒，","不安其居。","散涣府藏，","无有利得。"],["怒气冲冲睁大眼，","居住之地不得安。","府库存物瓜分光，","一点利益未得上。"]],[["初虽惊惶，","后乃无伤。","受其福庆，","永永其祥。"],["起初虽然受惊惶，","终于没有遭残伤。","福庆喜事牵手来，","永世平安享吉祥。"]],[["众邪充侧，","凤凰折翼。","微子复北，","去其邦国。"],["众多恶人随君旁，","正直之士受挫伤。","微子受难奔周国，","离开庶兄殷纣王。"]],[["六月采芑，","征伐无道。","张仲方叔，","克敌饮酒。"],["六月采芑而充饥，","南征北战伐叛逆。","张仲方叔为统帅，","克敌制胜创奇迹。"]]],[[["游驹石门，","碌耳安全。","受福西邻，","归隐玉泉。"],["跨马西行出石门，","碌耳良马保安稳。","西部邻邦赐福庆，","来到玉泉隐其身。"]],[["阳春生草，","万物盛兴。","君子所居，","灾祸不到。"],["阳春三月草木生，","万物生长都旺盛。","德高之人居住地，","灾祸不会来横行。"]],[["人无足法，","缓除才出。","雄走羊惊，","不失其家。"],["起初行事无方法，","慢慢实践完善它。","公羊走失群羊惊，","终究未失它的家。"]],[["泰山上奔，","变见太微。","陈吴废忽，","作为祸患。"],["泰山上升欲比天，","变换多端太徽垣。","陈胜吴广闹起义，","主有凶事起祸患。"]],[["乘龙吐光，","先暗后明。","燎猎大得，","六师以昌。"],["骑乘神龙口吐光，","早年危难晚年昌。","烧山行猎访吕望，","统帅六师伐纣王。"]],[["羊头兔足，","羸瘦少肉。","漏囊贮粟，","利无所得。"],["小小羊头和兔脚，","瘦弱肉少太干瘪。","破漏口袋盛谷子，","大利远去不能得。"]],[["因祸受福，","喜盈其室。","螟虫不作，","君无苟忒。"],["因为祸患而得福，","喜气盈门满室屋。","螟虫不来造灾害，","保你无殃无事故。"]],[["舜升大禹，","石夷之野。","征诣玉阙，","拜治水土。"],["在那石夷之野中，","大禹得到舜提升。","征召他到京都来，","让他治水凿龙门。"]],[["乌子鹊雏，","常与母俱。","顾类群聚，","不离其巢。"],["小小乌鸦和鸟鹊，","常与其母同巢穴。","同类相聚相照顾，","不离本土多安乐。"]],[["夷异所射，","发辄有获。","矰加鹊鹰，","双鸟俱得。"],["后羿箭法甚高明，","能够百发而百中。","丝绳带箭射鹊鹰，","喜鹊老鹰难逃遁。"]],[["晨风文翰，","大举就温。","昧过我邑，","羿无所得。"],["鹯鸟皋鸡鼓其翼，","高飞到那暖和地。","黎明之前过城邑，","射手后羿未得利。"]],[["六喜三福，","南至欢国。","与喜同乐，","嘉我洁德。"],["向南行至欢乐国，","得到幸福喜事多。","载歌载舞同庆贺，","赞美我的纯洁德。"]],[["斗龙股折，","日遂不明。","自外为主，","弟伐其兄。"],["龙子龙孙起争讼，","乌烟瘴气日不明。","亲弟凭借外来人，","武力讨伐其亲兄。"]],[["蒙庆受福，","有所获得，","不利出域。"],["喜庆福惠都降临，","所求皆得心安宁，","不利远行出家门。"]],[["蛮夷戎狄，","太阴所积，","涸冰沍寒，","君子不存。"],["蛮夷戎狄所处地，","阴气太盛难留居。","天寒地冻水结冰，","好人在此难生存。"]],[["畏昏潜处，","候旦昭明。","卒逢白日，","为荣禄主。"],["畏惧黑暗暂潜伏，","待到天亮再复出。","当那太阳升起时，","给我带来荣与禄。"]],[["水流趋下，","欲至东海。","求我所有，","买鲂与鲤。"],["水从高处往下流，","向东注入大海口。","出门贩鱼做生意，","如愿以偿获所有。"]],[["冠带南行，","与福喜期。","徼于嘉国，","拜位逢时。"],["衣冠楚楚向南游，","与福相会乐悠悠。","应邀前往嘉国去，","走运封予我官职。"]],[["莎鸡振羽，","为季门户。","新沐弹冠。","仲父悦喜。"],["振羽展翅纺织娘，","守在小弟屋门旁。","浴后弹冠来庆贺，","二叔喜悦心欢畅。"]],[["结衿流溺，","遭谗桎梏。","周召述职，","身受大福。"],["遭受谗言吃官司，","衣襟打结着罪衣。","周召二臣来巡视，","查清冤案得获释。"]],[["田鼠野鸡，","意常欲逃。","拘制笼槛，","不得动摇。"],["田间老鼠和野鸡，","心中常想逃离去。","将它圈入笼子里，","失去自由难逃离。"]],[["居华颠，","观浮云。","风不摇，","雨不濡。","心平安，","无咎忧。"],["住在华山之顶峰，","游观太空飘浮云。","狂风不来侵犯我，","阴雨不来湿衣襟。","我心平安多如意，","无忧无虑无灾凶。"]],[["倾倚将颠，","乱不能存。","英雄作业，","家困无年。"],["无依无靠将倒倾，","混乱之中难生存。","英雄本想成事业，","可惜家中太贫穷。"]],[["心愿所喜，","今乃逢时。","保我利福，","不离兵革。"],["心中盼望有喜事，","今日碰到好时机。","为保我的福与利，","兵甲着身不脱离。"]],[["灵龟陆处，","盘桓失所。","阿衡退耕，","夏封于国。"],["灵龟离海陆地处，","到处徘徊无室屋。","阿衡弃官去耕田，","夏王给他封国土。"]],[["弱水之右，","有西王母。","生不知老，","与天相保，","不利行旅。"],["在那弱水之右边，","西方王母居其间。","永世长生不知老，","与天同龄如神仙，","不宜远离自家园。"]],[["抱瑰求金，","日暮坐吟。","终月卒岁，","竟无成功。"],["怀抱玉石去求金，","太阳落山独呻吟。","到了年终和岁末，","竟然一事未成功。"]],[["言笑未毕，","忧来暴卒。","身加槛缆，","囚系缚束。"],["言谈笑语还未毕，","猝然忧事来袭击。","身受束缚不能动，","失去自由进牢狱。"]],[["望幸不到，","文章未成。","王子逐兔，","犬踦不得。"],["盼望幸福不来到，","道德文章未作好。","王子打猎去逐兔，","猎犬脚跛追不着。"]],[["震悚恐惧，","多所畏忌。","行道留难，","不可以步。"],["旅行途中遇危难，","心惊胆战不敢前。","处处设卡被扣留，","畏惧恶人造事端。"]],[["雄狐缓缓，","登山崔嵬。","昭告显功，","大福允兴。"],["巍巍南山高又大，","雄狐步子慢慢跨。","向那皇天表功德，","祷告福庆降临下。"]],[["火起吾后，","喜炙仓庑。","苍龙街水，","泉噀屋柱，","虽忧无咎。"],["身后突然起大火，","仓库厢房吐火舌。","青色巨龙口街水，","清泉喷柱火熄灭，","虽有忧虑未成祸。"]],[["危坐至暮，","请求不得。","膏泽不降，","政戾民忒。"],["正襟危坐到天黑，","请求之事不能得。","恩泽不及百姓身，","政治暴虐民困惑。"]],[["孟春和气，","鹰隼搏鸷，","众雀忧愤。"],["春风吹拂送暖时，","猛禽鹰隼相搏击，","众多鸟雀生忧虑。"]],[["缓法长奸，","不能理冤。","沉湎失节，","君受其患。"],["放松法制国出奸，","正直之人难申冤。","沉溺酒色失节操，","君子因之受灾患。"]],[["鱼鳖贪饵，","死于网钓。","受危因宠，","为身殃咎。"],["鱼鳖闻到诱饵香，","贪食死于捕鱼网。","受尽危难争荣宠，","自身反而遭祸殃。"]],[["金精耀怒，","带剑过午。","徘徊高库，","宿于山谷。","两虎相距，","弓矢满野。"],["太白金星放怒光，","佩带利剑居西方。","来回徘徊于高库，","住宿在那山谷旁。","虎视眈眈相抵御，","弓箭遍野满山冈。"]],[["四目相望，","稍近同光，","并坐鼓簧。"],["两人相对又相望，","随即接近同目光，","并坐一起吹笙簧。"]],[["茹芝饵黄，","涂饮玉英。","与神流通，","长无忧凶。"],["常吃灵芝与黄精，","玉花为食我饮用。","精神饱满经络通，","健康长寿无忧凶。"]],[["求獐嘉乡，","恶蛇不行。","道出歧口，","还复其床。"],["前往圣地买獐子，","毒蛇挡道不能至。","走到岔路道口处，","拿定主意复返室。"]],[["天门地户，","幽冥不睹，","不知所在。"],["高高天门和地户，","幽静黑暗无光束，","放眼远方皆空虚。"]],[["跛足息肩，","有所忌难。","金城铁郭，","以铜为关。","藩屏自卫，","安止无患。"],["跛脚先生歇歇肩，","担子沉重有危难。","铜墙铁壁护金城，","关口牢固难侵犯。","藩篱屏障自守卫，","举国上下得平安。"]],[["三雁俱飞，","欲归稻池。","经涉萑泽，","为矢所射，","伤我胸臆。"],["三只大雁齐飞翔，","欲归稻田和池塘。","经过芦苇沼泽地，","不幸遭逢利箭伤，","暗箭直至我胸膛。"]],[["济深难渡，","濡我衣袴。","五子善棹，","脱无他故。"],["水深流急河难渡，","不慎弄湿我衣服。","五位小伙善划船，","终于渡过无事故。"]],[["饮酒酗醉，","跳起争斗。","伯伤叔僵，","东家治丧。"],["兄弟二人喝醉酒，","争吵不休起斗殴。","哥哥受伤弟弟亡，","东家为此来治丧。"]],[["跌踬未起，","后失利市。","蒙被咎殃，","不得鹿子。"],["瘸子摔倒爬不起，","误了赶集好时机。","蒙受损失遭了殃，","小鹿也难捕捉上。"]],[["辰次降娄，","建星中竖。","子无远行，","处颠霄陷，","遂命讫终。"],["星宿失位乱运行，","建星挂在夜空中。","劝君莫要出远门，","以免颠沛入逆境，","引火烧身送性命。"]],[["商风召寇，","来呼外盗。","间谍内应，","与我争斗。","殚已宝藏，","主人不胜。"],["西风劲吹贼逞凶，","外盗入室杀气盛。","内部间谍相呼应，","使我内外受夹攻。","家中财物遭抢劫，","主人垂首向北奔。"]],[["甘露醴泉，","太平机关。","仁德感应，","岁乐民安。"],["辞美甘泉涓涓流，","天下太平好兆头。","仁义道德相感应，","年年欢乐安无咎。"]],[["祭仲子突，","要盟逐忽。","祸起子商，","弟伐其兄，","郑久不昌。"],["郑国祭仲和子突，","结成同盟逐子忽。","祸患起于宋国人，","弟弟讨伐其亲兄，","郑国长久不安宁。"]],[["反孽难步，","留不及舍。","露宿泽陂，","亡其襦袴。"],["反叛家庭成孽子，","无处可去难返居。","水边土坡夜露宿，","潮水浸湿裤和衣。"]],[["狼虎结谋，","相聚为保。","伺候牛羊，","病我商人。"],["狼虎勾结相合谋，","互相保护聚一处。","伺机捕杀牛和羊，","使我商人受灾殃。"]],[["明德克敏，","重华贡举。","放勋征用，","八哲蒙祐。"],["道德彰明又聪敏，","帝舜荐举得贤臣。","唐尧前来征用他，","高阳八子蒙恩宠。"]],[["贫鬼守门，","日破我盆。","毁罂伤瓶，","空虚无子。"],["穷鬼守在我家门，","天天打破我的盆。","毁了罐子损坏瓶，","使我贫困无子孙。"]],[["天命赤鸟，","与兵徼期。","征伐无道，","箕子游遨。"],["皇天降下赤色鸟，","兴兵伐叛是吉兆。","征讨无道殷纣王，","箕子归周封于朝。"]],[["威约拘囚，","为人所诬。","皋陶平理，","剖械出牢，","脱归家闾。"],["遭受恶人之诬陷，","关入狱中成囚犯。","狱官皋陶来评理，","打开刑具出牢槛，","脱险返回自家园。"]],[["羊惊虎狼，","耸耳群聚。","无益威强，","为齿所伤。"],["羊儿受惊于虎狼，","群聚竖耳甚恐慌。","逞强无益助自威，","终被恶虎所残伤。"]],[["初虽号啼，","后必庆笑。","光明照耀，","百喜如意。"],["起初遇险放声嚎，","后转吉庆捧腹笑。","百事全都能如意，","全托光明来照耀。"]],[["马服长股，","宜行善市。","蒙佑谐耦，","获金五倍。"],["良马善走腿儿长，","宜去市场去经商。","承蒙天佑配佳偶，","获利五倍有希望。"]],[["应门内崩，","诛贤杀暴。","上下咸悖，","景公失位。","长归无恒，","望妻不来。"],["王宫正门内塌崩，","盗寇残暴杀贤能。","上下混乱不堪言，","景公失位向北奔。","欲回家国又不能，","思念爱妻难会同。"]],[["执斧破薪，","使媒求妇。","好合二姓，","亲御饮酒，","色比毛嫱，","姑悦公喜。"],["手执利斧去劈薪，","找个媒人好提亲。","两姓合为一家人，","同饮喜酒贺新婚。","儿媳漂亮赛毛嫱，","公公婆婆都高兴。"]],[["两轮日转，","南上大阪。","四马共辕，","无有险难，","与禹笑言。"],["两只车轮一起转，","向南爬坡上高山。","四马共辕齐奋进，","不怕车重行路难，","与禹同行笑开颜。"]],[["玄兔指掌，","相与相恃。","证讯诘问，","诬情自直。","冤死谁告，","口为身祸。"],["黑兔掌指相支撑，","相扶相帮以维生。","证据确凿加审问，","诬陷情由自然明。","可怜冤死有谁告，","口为祸首殃其身。"]],[["千柱百梁，","终不倾僵，","周宗宁康。"],["百根栋梁千根柱，","永世千年不倾覆，","周朝政权多牢固。"]]],[[["旦生夕死，","名曰婴鬼，","不可得祀。"],["早晨诞生傍晚死，","呼其婴鬼为名字，","不得为它作祭祀。"]],[["大步上车，","南到喜家。","送我狐裘，","与福俱来。"],["大步流星登上车，","向南到那喜家坐。","主人送我狐皮袍，","带上福喜回城郭。"]],[["西多小星，","三五在东。","早夜晨兴，","劳苦无功。"],["西天挂满小星星，","心宿柳宿嵌在东。","从早起身至天黑，","辛苦操劳皆无功。"]],[["北陆藏冰，","君子心悲。","困于粒食，","鬼惊我门。"],["北国严冬藏寒冰，","智士心中甚悲痛。","困于饥饿无食粮，","穷鬼前来敲我门。"]],[["山水暴怒，","坏梁折柱。","稽难行旅，","留连愁苦。"],["山洪奔流齐暴发，","客店全被水冲塌。","出门人儿遇危难，","流连愁苦不堪言。"]],[["比目四翼，","来安吾国。","福喜上堂，","与我同床。"],["比翼鸟儿比目鱼，","来到我们国度里。","幸福吉祥登上堂，","与我共同卧龙床。"]],[["狡兔趯趯，","良犬逐咋。","雌雄爰爰，","为鹰所获。"],["兔子奔跑又跳跃，","猎狗追逐将它咬。","雌鸟雄雀玩又闹，","却被老鹰猎获到。"]],[["增禄益福，","喜来入室，","解除忧惑。"],["福禄日益而增多，","喜事入室随着我，","解除我的忧与惑。"]],[["骑龙乘风，","上见神公。","彭祖受刺，","王乔赞通。","巫咸就位，","拜福无穷。"],["骑着飞龙乘着风，","上天去见神仙公。","彭祖接受我求见，","王乔把我来赞颂。","卜卦巫咸就位坐，","求得福寿得长生。"]],[["天火卒起，","烧我旁里。","延及吾家，","空尽己财。"],["天火突然而降临，","烧到左舍和右邻。","灾祸殃及我家中，","财产全都化灰烬。"]],[["金帛黄宝，","宜与我市。","嫁娶有息，","利得过倍。"],["金银玉帛和黄宝，","经商赢利生意好。","男娶女嫁都顺心，","得利数倍兴志高。"]],[["鬼魅之居，","凶不可舍。"],["魅鬼所居坏地方，","凶事多多难建房。"]],[["鸟飞兔走，","各有畏恶。","雕鹰为贼，","乱我室舍。"],["鸟儿高飞兔跳跃，","各有畏惧和厌恶。","老雕恶鹰来袭击，","扰乱败坏我室舍。"]],[["初虽惊惶，","后乃无伤，","受其福庆。"],["起初虽然受惊惶，","转危为安未受伤，","终获福庆呈吉祥。"]],[["两金相击，","勇气均敌。","日月斗战，","不破不缺。"],["两件金器相搏击，","双方势均而无敌。","天天战斗无休止，","兵器完好无破敝。"]],[["曳纶河海，","挂钓鲂鲤。","王孙利得，","以享仲友。"],["河海里面布下网，","鲂鱼鲤鱼皆上当。","王孙从中获大利，","亲朋好友同分享。"]],[["犬畏狼虎，","依人作辅。","三夫执戟，","伏不敢起，","身安无咎。"],["家狗畏惧狼与虎，","依靠主人为辅助。","三条大汉执长戟，","狼虎伏地不敢起，","保身平安无灾异。"]],[["蜘蛛作网，","以伺行旅。","青蝇馋聚，","以求膏腴。","触我罗绊，","为网所得。"],["蜘蛛吐丝结罗网，","等待飞虫来上当。","苍蝇群飞聚一起，","贪馋成性去寻食。","自找雾头入网罗，","成为网中不速客。"]],[["所望在外，","鼎命方来，","拭爵涤罍，","炊食待之，","不为季忧。"],["早就盼望能提拔，","任令刚刚才下达。","洗净酒具摆上桌，","备好佳肴来庆贺，","免得小弟忧虑多。"]],[["日月并居，","常暗匪明。","高山崩颠，","丘陵为谿。"],["太阳月亮同出现，","大地到处皆昏暗。","高山崩塌遭倾覆，","丘陵变化为谷涧。"]],[["春服既成，","载华复生。","茎叶盛茂，","实穗泥泥。"],["春日服装已做成，","万物开花得萌生。","植物枝叶多茂盛，","禾穗光泽又丰润。"]],[["华首山头，","仙道所游。","利以居止，","长无咎忧。"],["华山首阳之山头，","神仙道士在此游。","圣地利于久居住，","没有祸患和忧愁。"]],[["三狐嗥哭，","自悲孤独。","野无所游，","死于丘室。"],["三只狐狸放声哭，","自令悲伤甚孤独。","困于野外无去处，","全都亡命入地府。"]],[["火中暑退，","禾黍其食。","商人不至，","市空无有。"],["自夏至秋天渐凉，","庄稼收获无希望。","商人不来做交易，","市场空空没有粮。"]],[["独立山巅，","求麋耕田。","草木不辟，","秋饥无年。"],["独自一人立山巅，","欲寻麋鹿来耕田。","遍地草木难开垦，","没有收成闹荒年。"]],[["火虽炽，","在吾后。","寇虽众，","在吾右。","身安吉，","不危殆。"],["火势虽然很凶猛，","但它却在我身后。","强盗贼寇固然多，","然则都在我身右。","我身平安又吉利，","危难永远不临头。"]],[["啮啮，","贫鬼相责。","无有欢怡，","一日九结。"],["咬牙切齿相责骂，","贫鬼争吵又打架。","没有欢乐和喜悦，","一天能结九疙瘩。"]],[["追亡逐北，","呼还幼叔。","至山而得，","反归其室。"],["小弟走失不回返，","出门呼喊到北边。","追至山前而相会，","高高兴兴回家园。"]],[["衔命辱使，","不堪厥事。","遂堕落去，","更为斯使。"],["奉命出使受辱回，","不能胜任又复归。","中途官场坠落下，","肩挑背驮做人鬼。"]],[["被珠函玉，","沐浴仁德。","应聘唐国，","四门穆穆。","蟊贼不作，","凶恶伏匿。"],["身佩珍珠口含玉，","沐浴道德和仁义。","接受聘任去唐国，","四方宾服民安逸。","没有盗贼来作恶，","凶事伏地远离去。"]],[["机关不便，","不能出言。","精诚适通，","为人所冤。"],["多方原因受牵连，","不能盲目乱发言。","虽然精明又坦诚，","终受奸佞所诬陷。"]],[["瓮破缶缺，","南行亡失。"],["大瓮破裂缶缺损，","南行失物手空空。"]],[["唇亡齿寒，","积日凌根。","朽不可用，","为身灾患。"],["唇亡齿寒是小病，","积累日久伤根本。","待到全身朽败时，","酿成灾祸送性命。"]],[["蒙惑憧憧，","不知西东。","魁罡指南，","告我失中，","利以宜止，","去国忧患。"],["迷迷糊糊路不明，","东西南北分不清。","北斗七星指南方，","告我判断有疑问。","利于平安居家中，","出门远行忧患生。"]],[["鸟鸱搏翼，","以避阴贼。","盗伺二女，","赖厥生福。","旱灾为疾，","君无黍稷。"],["鸟儿展翅斗猛禽，","以避鸱鸮来伤身。","强盗看见两女子，","伺机要打坏主意。","旱灾伤害糜与谷，","年终无收缺粮食。"]],[["名成德就，","项领不试。","景公耄老，","尼父逝去。"],["名成德就众大臣，","在下骄横不亲君。","景公年迈又昏庸，","孔子离齐而远行。"]],[["言与心诡，","西行东坐。","鲧湮洪水，","佞贼为祸。"],["言语心思甚诡秘，","东来西往很可疑。","鲧治洪水不得法，","佞人借机行坏事。"]],[["猃狁匪度，","治兵焦获。","伐镐及方，","与周争强。","元戎其驾，","以安我王。"],["北方猃狁逞凶狂，","结兵焦获大地上。","侵伐镐地及朔方，","与我周朝争高强。","大型战车去抵抗，","驱走猃狁安我王。"]],[["三火起明，","雨灭其光。","高位疾颠，","骄恣诛伤。"],["三堆大火放光明，","大雨倾盆光不生。","身处高位受颠倾，","骄横放纵灭自身。"]],[["阴涿川决，","水为吾祟，","使我心愦。","母树麻枲，","居止凶殆。"],["暗流冲击河决堤，","大水使我受灾异，","心情不平常忧虑。","母树变成雄麻株，","凶危之地勿长住。"]],[["厌浥晨夜，","道多湛露。","沾我襦袴，","重难以步。"],["清晨时节湿漉漉，","沿着野径踏浓露。","沾湿我的衣和裤，","困厄重重难行步。"]],[["宜行贾市，","所求必倍。","载喜抱子，","与利为友。"],["宜于出门做生意，","能够得到成倍利。","欢欢喜喜抱儿子，","君与大利结友谊。"]],[["阴变为阳，","女化为男。","治道得通，","君臣相承。"],["阴气转化为阳气，","女子变成为男子。","治国之道得通畅，","君上臣下相存依。"]],[["树蔽杜荆，","与蘙山旁。","仇敌背憎，","熟肯相迎。"],["山脚下面树葱茏，","大树灌木争生存。","互为仇敌结怨恨，","各自双双不欢迎。"]],[["坐茵乘轩，","据德宰臣。","虞叔受命，","六合和亲。"],["武王坐茵乘轩行，","辅佐之臣有周公。","仲雍封为虞国君，","天下四方都和亲。"]],[["云兴蔽日，","雨集草木，","年茂岁熟。"],["风送云升遮太阳，","雨润草木长势旺，","年岁丰收多吉昌。"]],[["播梅折枝，","与母别离，","
