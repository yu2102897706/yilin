,"天佑无咎。"],["伊尹多才又聪明，","远离暴君去务农。","顺应天命得强盛，","老天保佑无灾凶。"]],[["逐鹿西山，","利入我门。","阴阳和调，","国无灾殃。"],["追鹿追到西山中，","大利进入我家门。","阴阳二气都协调，","国家安宁无灾凶。"]],[["龙兴之德，","周武受福。","长女宜家，","与君相行。","长股远行，","狸且善藏。"],["真龙天子有德性，","武王伐纣承天命。","长女太姬嫁胡公，","与君相辅又相亲。","殷商顽民如狐狸，","失利远行善藏隐。"]]],[[["金柱铁关，","坚固卫灾。","君子居之，","安无忧危。"],["金柱铁关国门安，","坚实牢固心外患。","高尚之人居住地，","平平安安无危难。"]],[["转祸为福，","喜来入屋。","春城夏国，","可以饮食，","保全家室。"],["祸事转化成为福，","喜事临门进了屋。","春夏气候很适宜，","可以丰衣又足食，","保全君子好家室。"]],[["水暴横行，","浮屋坏墙。","泱泱溢溢，","市师惊惶。","居止不殆，","与母相保。"],["洪水横行四处流，","冲毁房屋过墙头。","浩浩荡荡漫无际，","城内大兵生担忧。","稳居不动无危险，","儿与老母相保全。"]],[["虎豹熊罴，","游戏山隅。","得其所欲，","君子无忧。"],["老虎豹子和熊罴，","游玩戏闹山谷里。","各自实现其愿望，","好人无忧亦无虑。"]],[["躬礼履仁，","尚德止讼。","宗邑以安，","三百无患。"],["属守礼义实践仁，","崇尚道德止争讼。","宗室城邑都平安，","三百封邑无忧患。"]],[["江淮易服，","玄黄朱饰。","灵公夏征，","衷衵无极。","高位崩颠，","失其宠室。"],["长江淮河变了样，","衣饰朱红又黑黄。","陈灵公和夏征舒，","贪恋女色招灾殃。","高位崩颠身败亡，","心爱妻子离身旁。"]],[["不虞之患，","祸至无门。","奄忽暴卒，","痛伤我心。"],["无法预料大灾凶，","祸患无处不降临。","突然暴卒一条命，","令我悲痛甚伤心。"]],[["三涂五岳，","去危入室。","凶祸不作，","桀盗尧服。","失真宠福，","贵人有疾。"],["跋涉三涂五岳山，","平安回家离危险。","凶煞祸首隐藏处，","暴桀更衣把尧扮。","失去宠幸与福禄，","朝中贵人遭大难。"]],[["配合相迎，","利之四乡。","昏以为期，","明星煌煌。","欣喜奭怿，","所言得当。"],["配合默契相送迎，","便于出门去远行。","黄昏时节来约会，","明星煌煌挂长空。","老友相约喜相逢，","双方谈得很开心。"]],[["三手六身，","莫适所闲，","更相摇动，","失事便安。","箕子佯狂，","国乃不昌。"],["三手六身乱体统，","什么事也做不成。","相互干扰动不停，","无所事事方安定。","箕子装疯保性命，","国不盛昌君昏庸。"]],[["虎卧山隅，","鹿过后朐。","弓矢设张，","猬为功曹。","伏不敢起，","逐全其躯，","得我美草。"],["老虎卧在山角落，","待鹿为食而捕捉。","张开弯弓搭上箭，","刺猬来把功曹做。","老虎伏地不敢起，","得以保全其躯体，","鹿得美草乐滋滋。"]],[["麟凤执获，","英雄失职。","自卫反鲁，","猥昧不起，","福寿迄已。"],["捉获麟凤手中执，","英雄圣贤失其职。","孔子自卫返鲁国，","一蹶不振难再起，","福寿利禄都完毕。"]],[["栾子作殃，","伯氏诛伤。","州犁奔楚，","失其宠光。"],["栾子离间造灾殃，","伯氏家族受诛伤。","州犁逃命奔楚国，","失去尊宠和荣光。"]],[["黄帝出游，","驾龙乘马。","东至泰山，","南过齐鲁。","王良御右，","文武何咎；","不利市贾。"],["黄帝出行去游说，","飞龙骏马为驾座。","向东来到泰山脚，","南过齐国和鲁国。","王良驾车行在右，","文臣武将来辅佐；","商人生意受阻隔。"]],[["齐鲁争言，","战于龙门。","构怨致祸，","三世不安。"],["齐鲁两国起争端，","龙门展开大决战。","结下怨仇招祸患，","三世后代不得安。"]],[["道礼和德，","仁不相贼。","君子往之，","乐有其利。"],["注重礼仪和道德，","互相仁爱多和谐。","商人照此去行事，","高高兴兴把利得。"]],[["妪妒公姥，","毁益乱类。","使我家愦，","利得不遂。"],["老妪嫉妒其老公，","好事被她弄落空。","搅得家中乱纷纷，","想要求利不得成。"]],[["一巢九子，","同公共母。","柔顺利贞，","出入不殆，","福禄所在。"],["一巢之中九个子，","同父同母亲兄弟。","温柔顺从有节操，","出门入户都吉利，","常和福禄在一起。"]],[["崔嵬北岳，","天神贵客。","温仁正直，","主布恩德。","闵哀不已，","蒙受大福。"],["在那巍巍之北岳，","天上神仙是贵客。","温和仁厚又正直，","主管布施恩与德。","同情爱护无休止，","人间蒙受大福泽。"]],[["三蛆逐蝇，","陷坠釜中。","灌沸淹殆，","与母长决。"],["三只蛆虫追逐蝇，","陷身坠入热锅中。","沸水滚烫毙其命，","与其生母永离分。"]],[["东山西陵，","高峻难升。","来夷掘垒，","使道不通。","商旅无功，","复反其邦。"],["东边大山西边陵，","高耸险峻难攀登。","丘陵崛起无坦途，","使得道路不畅通。","商人沿途枉劳累，","重新返回邦国中。"]],[["常德自如，","不逢祸灾。","乐只君子，","福禄自来。"],["常修德行多自在，","不会碰到祸与灾。","有德之人多快乐，","福禄不求自己来。"]],[["范子妙材，","戮辱伤肤。","后相秦国，","封为应侯。"],["魏人范雎有才能，","出使受诬遭酷刑。","后去秦国任丞相，","爵封应侯耀祖宗。"]],[["狼虎结集，","相聚为保。","伺啮牛羊，","道绝不通，","病我商人。"],["恶狼猛虎结成伴，","聚集一处相保全。","伺机残食我牛羊，","虽然有路难向前，","商贾之人遭伤残。"]],[["不直杜公，","与我争讼。","媒伯无礼，","自令塞壅。"],["那位杜公心不正，","与我坐争又立讼。","媒人行事太无礼，","致使好事办不成。"]],[["朝鲜之地，","箕伯所保。","宜人宜家，","业处子孙，","求事大吉。"],["朝鲜是个好地方，","箕子封此镇边疆。","适合百姓长居住，","事业发达子孙昌，","心想事成随愿望。"]],[["上天楼台，","登拜受福，","喜庆大来。"],["通往上天之楼台，","循此登高去祷拜，","大喜大庆从天来。"]],[["三羊上山，","东至平原。","黄龙服箱，","南至鲁阳，","完其佩囊。","执绥车中，","行人有庆。"],["三羊一同上山冈，","东行来到平原上。","黄马拉车奔前方，","一路南行到鲁阳，","身上佩囊无损伤。","主人执绥车中央，","旅行之人真吉祥。"]],[["天地闭塞，","仁智隐伏。","商旅不行，","利深难得。"],["天地闭塞不畅通，","仁人智士都伏隐。","经商之人不出门，","利益渺茫看不清。"]],[["延陵适鲁，","观乐太史。","车邻白颠，","知秦兴起。","卒兼其国，","一统为主。"],["延陵前往鲁国地，","陪其观乐有太史。","听了车邻白颠诗，","预知秦国将兴起。","最终兼并其六国，","统一天下成皇帝。"]],[["橐戢甲兵，","归放马牛。","径路开通，","国无凶忧。"],["刀枪入库息战争，","马放南山天下宁。","大路上道都畅通，","国家没有灾与凶。"]],[["牛骥同槽，","郭氏以亡。","国破为墟，","主君走逃。"],["牛马同槽相争强，","郭氏因之而破亡。","国土破败成废墟，","君主奔逃到他乡。"]],[["大尾小腰，","重不可摇。","栋挠榱坏，","臣为君忧。","汤火之言，","消不为患，","使我复安。"],["小小腰身大尾巴，","沉重不能摇动它。","栋梁弯曲椽子坏，","臣忧君王受惊吓。","捕风捉影之语言，","不要轻信和妄传，","使我重新得平安。"]],[["太一置酒，","乐正起舞。","万福攸同，","可以安处，","绥我齿。"],["太一设宴来庆祝，","鼓乐助兴跳起舞。","万民同享人间福，","可以平安久相处，","使我老人得安抚。"]],[["饮酒醉酗，","跳起争斗。","伯伤叔僵，","东家治丧。"],["狂喝滥饮醉酒场，","跳起身来相残伤。","哥哥受伤弟发僵，","东家为其来治丧。"]],[["山险难登，","涧中多石。","车驰击，","重载伤轴。","担负善踬，","跌踒右足。"],["山路艰险难攀登，","涧中多石车难行。","车子奔驰撞轴头，","载重颠沛轴受损。","肩挑重担易摔倒，","跌跤摔伤右脚跟。"]],[["争讼不已，","更相击訽。","张季弱口，","披发北走。"],["争论纷纷无休止，","更相谩骂和攻击。","张家小三输了理，","披头散发向北去。"]],[["心志无良，","伤破妄行。","触墙抵壁，","不见户房。","先王闭关，","商旅委弃。"],["用意存心不善良，","胡作非为遭残伤。","到处碰壁又触墙，","欲归难见自家房。","先王冬至闭城门，","生意之人难行商。"]],[["鸱鸮，","治成遇灾。","绥德安宁，","周公勤劳。"],["奸佞之徒来入侵，","扶助成王遇灾凶。","周公东征除恶人，","以德治国家安宁。"]],[["清人高子，","久屯外野。","逍遥不归，","思我慈母。"],["清邑士兵随高克，","御敌长居于郊野。","久戍欲回又不能，","思念慈祥老母亲。"]],[["两虎争斗，","股创无处。","不成仇雠，","行解却去。"],["争雄斗殴两猛虎，","大腿之上伤无数。","最终没有成仇敌，","双双和解都离去。"]],[["天女推床，","不成文章。","南箕无舌，","饭多沙糠。","虐众盗名，","雄鸡折颈。"],["织女蹲在织床旁，","不能织出文锦样。","南箕无舌不簸粮，","饭中多沙多秕糠。","人间佞贼盗功名，","雄鸡脖颈遭折伤。"]],[["太子扶苏，","走出远郊。","佞幸成邪，","改命生忧。","慈母之恩，","无路致之。"],["秦皇长子名扶苏，","遣之边疆荒僻地。","小人侥幸造邪恶，","篡改诏书赐他死。","慈母之恩似海深，","无法相见空遗恨。"]],[["寒暑相推，","一明一微。","赫赫宗周，","光明灭衰。"],["一寒一暑相推移，","一明一微有荣衰。","赫赫强盛周王朝，","最终光明都衰败。"]],[["鸡狗相望，","仁道笃行。","不吠昏明，","各安其乡。","周鼎和饵，","国富民有，","八极蒙佑。"],["鸡犬相望不受惊，","周朝盛世仁道行。","黄昏黎明无吠声，","百姓家家都安宁。","成王定鼎于洛邑，","国富民安君圣明，","八方蒙佑世太平。"]],[["窗牖户房，","道利明光。","贤智辅圣，","仁施大行。","家给人足，","海内殷昌。"],["房间敝亮窗户明，","新鲜空气得流通。","贤人智者辅圣君，","仁政得以广施行。","家家充足人富有，","海内殷实国昌盛。"]],[["雨雪三日，","鸟兽饥乏。","旅人失宜，","利不可得。","幾言解患，","以疗纷难，","危者复安。"],["大雪三天不见晴，","鸟兽饥饿又困顿。","出行经商不适合，","想要求利不能成。","有言天气将好转，","解除祸患排忧难，","临危之人又得安。"]],[["白鹤衔珠，","夜食为明。","膏润优沃，","国岁年丰。","中子来同，","见恶不凶。"],["白鹤衔珠入我门，","夜食不愁无光明。","雨露滋润很充分，","庄稼获得好收成。","二哥同来心相印，","遇到坏人也无凶。"]],[["从豚牵羊，","与虎相逢，","虽惊不凶。"],["赶猪牵羊出门行，","途中不幸与虎逢，","虽然受惊却无凶。"]],[["凫雁哑哑，","以水为宅。","雌雄相和，","心志娱乐。","得其所欲，","绝其患恶。"],["大雁野鸭叫哑哑，","以水作为自己家。","雌雄结伴多和睦，","心心相印乐开花。","生活幸福事如意，","患恶不来入我家。"]],[["逐狐平原，","水遏我前。","深不可涉，","暮无所得。"],["追逐狐狸至平原，","河水阻隔难向前。","水深流急不可涉，","直到天黑无所得。"]],[["窟室蓬户，","寒贱所处。","千里望烟，","散涣四方。","形体灭亡，","下入深渊，","终不见君。"],["山坡窑洞茅草屋，","贫寒人家所居住。","千里之外望炊烟，","随着风儿皆飘散。","形体灭亡难复活，","离开人间入深渊，","最终不见大人面。"]],[["桀纣之主，","悖不堪辅。","贪荣为人，","必定其咎。","聚敛积实，","野在鄙邑，","未得入室。"],["夏桀殷纣暴君主，","丧尽天良不可辅。","为人贪图荣华富，","必定自作自受苦。","横征暴敛积财富，","僻野作为藏身处，","身家性命难保住。"]],[["仓库盈亿，","年岁有息。","商人流连，","虽久有得。","阴多阳少，","因地就力。"],["仓库满盈逾千亿，","年岁丰收粮充裕。","商人流连好生意，","耐心等待得厚利。","条件恶劣优势少，","因地制宜则成事。"]],[["火山不燃，","钓鲤失纶。","鱼不可得，","利去我北。"],["放火烧山火不燃，","去钓鲤鱼钓绳断。","鱼儿不难得到手，","利逃北去空喜欢。"]],[["童女无媒，","不宜动摇。","安其居庐，","傅母何忧。"],["少女年幼未许人，","不宜招摇出家门。","安心在家当闺秀，","傅母无忧放宽心。"]],[["载风云母，","游观东海。","鼓翼千里，","见吾爱子。"],["云母驾起风儿行，","游览观赏东海景。","展翅鼓翼千里外，","见到爱子喜心中。"]],[["鸿盗我襦，","逃于山隅。","不见其迹，","使伯心忧。"],["鸿雁盗走我衣裳，","逃到山角去躲藏。","四处不见其踪迹，","使得大哥心悲伤。"]],[["视夜无明，","不利远乡。","闭门塞牖，","福为我母。"],["黑夜茫茫无光明，","不利远行出家门。","关闭门户守紧窗，","福如慈母来身旁。"]],[["三狗逐兔，","于东北路。","利以进取，","商人有得。"],["三狗前去追逐兔，","径直追向东北路。","适宜前往多收获，","行商之人有利图。"]],[["武王不豫，","周公祷谢。","载璧秉圭，","安宁如故。"],["武王身体患病疾，","周公祷告拜先祖。","手持璧玉执玄圭，","武王病情获痊愈。"]],[["同载共车，","中道别去。","爵级不进，","君子下舆。"],["两人同将车儿乘，","中途双双把手分。","官职未能得晋升，","君子下轿徒步行。"]],[["六雁俱飞，","游戏稻池。","大饮多食，","食饱无患。"],["六只大雁一同飞，","落入稻池来戏水。","大吃大喝不停歇，","吃饱喝足无忧危。"]],[["符左契右，","相与合齿。","乾坤利贞，","出生六子。","长大成就，","风言如母。"],["左面之符右边契，","相对正好合一起。","善男信女多和顺，","幸运生下六个子。","长大成才受重用，","风范仪表似母亲。"]]],[[["思初道古，","哀吟无辅。","阳阴不制，","上失其所。"],["思念当初又说古，","悲哀呻吟无人助。","权力不能制下属，","在上职位难保住。"]],[["江河淮海，","天之奥府。","众利所聚，","可以饶有，","乐我君子。"],["长江黄河淮海地，","风水宝地皇天赐。","众多利益聚一起，","物产富饶又丰足，","喜事乐坏我君子。"]],[["三雁俱飞，","避暑就凉。","适与矰遇，","为缴所伤。"],["三只大雁高飞翔，","避开暑热去寻凉。","不幸遇到强弓射，","带绳之箭将它伤。"]],[["秋南春北，","随时休息。","处和履中，","安无忧凶。"],["秋日往南春北去，","随着时节而生息。","中和之气常相得，","生活安康无忧虑。"]],[["履危无患，","跳脱独全。","不利出门，","伤我左膝。","疾病不食，","鬼哭其室。"],["身履危地无祸患，","逃脱灾祸独保全。","出门远行不吉祥，","我的左膝遭伤残。","病入膏肓难进食，","恶鬼哭泣入门槛。"]],[["东家凶妇，","怨其公姥。","毁其破盆，","弃其饭飡，","使吾困贫。"],["东邻家中媳妇凶，","怨恨公婆不孝敬。","摔坏盘子砸碎盆，","倒掉饭菜食难用，","使我挨饿又受穷。"]],[["泥滓汙辱，","弃捐沟渎。","众所笑哭，","终不显录。"],["泥土渣滓脏又污，","把它丢弃于沟渠。","众人责骂又嘲笑，","最终无功无利禄。"]],[["旦往暮还，","名与相存，","身无凶患。"],["清晨出门晚回还，","团结互助很友善，","相互信赖无凶险。"]],[["六翮长翼，","夜过射国。","高飞冥冥，","羿氏无得。"],["健羽长翼之鸟雀，","夜间飞越善射国。","高高飞翔无踪影，","射手后羿无所得。"]],[["蜂虿之国，","难以止息。","嘉媚之士，","为王所食，","从去其室。"],["野蜂毒蝎邪恶国，","在此难以安室舍。","奸佞小人善谄媚，","君王豢养有依托，","随从入室同谋略。"]],[["被狐乘龙，","为王道东。","过时不返，","使我忧聋。"],["身穿狐裘乘飞龙，","为王引路行向东。","过了时候不回返，","使我忧愁致耳聋。"]],[["雹梅零坠，","心思愦愦。","怀忧少愧，","乱我魂气。"],["雹打梅花飘坠地。","心思昏乱难平息。","含恨怀忧多惭愧，","乱我魂魄和精气。"]],[["长女三嫁，","进退多态。","牝狐作妖，","夜行离忧。"],["长女出嫁三次整，","结婚离婚几折腾。","雌狐兴妖又作怪，","半夜行路遭忧凶。"]],[["轰轰軥軥，","驰东逐西。","盛盈必毁，","高位崩颠。"],["车声轰轰向前行，","驱车向西又向东。","过盛满盈必损毁，","身居高位将颠崩。"]],[["乘船涉济，","载水逢火。","赖得无患，","蒙我生全。"],["乘着船儿欲过河，","船内突然起大火。","幸赖有水而扑灭，","承蒙老天保全我。"]],[["至德之君，","政仁且温。","伊吕股肱，","国富民安。"],["君王圣明好品行，","善施温和之仁政。","伊尹吕尚为股肱，","国家富足民安宁。"]],[["生不逢时，","困且多忧。","无有冬夏，","心常悲愁。"],["出生未逢好时机，","身受困顿多忧虑。","从那寒冬到盛夏，","心常悲愁无欢娱。"]],[["南历玉山，","东入生门。","登福上堂，","饮万岁浆。"],["向南登上玉山顶，","健步向东入生门。","拜受福佑登上堂，","痛饮长生不老浆。"]],[["大斧斫木，","谗人败国。","东关二五，","祸及三子，","晋人乱危，","怀公出走。"],["大斧砍断那树木，","佞人谗言坏国度。","外嬖东关两恶人，","残害重耳和夷吾。","晋国政局大动乱，","怀公狼狈逃离出。"]],[["一室百孙，","公悦妪欢。","相与笑言，","家乐以安。"],["一家子孙上百个，","爷爷奶奶真喜悦。","相对欢声又笑语，","家中平安多快乐。"]],[["随阳运行，","不失其常。","君安于乡，","国无咎殃。"],["随着太阳而远行，","不失其常依规循。","好人安居在家乡，","国家无祸亦无凶。"]],[["群虎入邑，","求索肉食；","大人御守，","君不失国。"],["一群猛虎进城邑，","寻找索取肉充饥；","大臣亲自去防御，","君主政权未丢失。"]],[["弱足刖跟，","不利出门。","商贾无赢，","折崩为患；","汤火之忧，","转解喜来。"],["脚部患病伤脚跟，","不便出门去远行。","商人经营未获利，","赔本生意成祸凶；","热汤烈火之忧苦，","转而化解喜事临。"]],[["夏台羑里，","文汤厄处。","鬼侯饮食，","岐人悦喜。"],["夏台羑里两牢狱，","商汤文王困厄地。","九侯被剁在肉酱，","周人欢庆商纣亡。"]],[["栋桡榱坏，","廊屋大败。","宫阙空廓，","如冬枯树。"],["房梁弯曲椽子坏，","室屋廊檐尽破败。","豪华宫殿无人住，","犹如寒冬之枯树。"]],[["谗以内安，","不利其国。","室家大惧，","幽囚重闭。","疾病多求，","罪乱愤愦。"],["欲借谗言安内事，","反而害国招灾异。","家家户户很恐惧，","安止屋中门紧闭。","病重多方去求医，","迷离昏愦不能治。"]],[["家给人足，","颂声并作。","四夷宾服，","干戈卷阁。"],["家家户户粮充盈，","处处传来称颂声。","四方夷狄来归顺，","武器入库不动兵。"]],[["六龙俱怒，","战于坂下。","仓黄不胜，","旅人艰苦。"],["六条大龙俱发怒，","坡下混战在一处。","青龙黄龙未获胜，","行人途中备受苦。"]],[["天下雷行，","尘起不明。","市空无羊，","疾人忧凶。","三木不辜，","脱归家邦。"],["天气骤变惊雷响，","狂风扬尘遮太阳。","市场空空无牛羊，","患病之人有灾殃。","无辜被捕押上堂，","终于逃脱回家乡。"]],[["一指食肉，","口无所得。","染其鼎鼐，","舌馋于腹。"],["一个指头去吃肉，","嘴里空空无所有。","手指伸进大鼎中，","口舌贪馋腹中空。"]],[["喜笑不常，","失其福庆。","口辟言疥，","行者畏忌。"],["为人喜笑不正常，","失去大福大吉祥。","满口胡言和乱语，","行路之人有畏忌。"]],[["毛牛豪背，","国乐民富，","侯王有德。"],["毛生豪背呈吉兆，","百姓安乐国富饶，","为官之人德行好。"]],[["豮豕童牛，","害伤不来。","三女同堂，","生我福仁。"],["被阉之猪无角牛，","双双不再相争斗。","三位少女同室处，","为我生福解忧愁。"]],[["江河淮海，","盈溢为害。","邑被其濑，","处困无岁。"],["长江黄河和淮海，","大水四溢成灾害。","城邑尽被水冲坏，","灾年收成从何来？"]],[["两虎争斗，","股疮无处。","不成仇雠，","行解却走。"],["两只猛虎相争斗，","伤痕累累满身留。","终竟未能成仇敌，","斗完双双皆离走。"]],[["五岳四渎，","润洽为德。","行不失理，","民赖恩福。"],["五座大山四条河，","沾蒙恩泽为仁德。","行为不失其常理，","人民赖此享福泽。"]],[["载车乘马，","南逢君子。","与我嘉福，","虽忧无咎。"],["驾车乘马向南去，","路途之中遇贤士。","使我得到大福喜，","虽有忧虑无灾异。"]],[["缺囊破筐，","空无黍梁。","不媚如公，","弃于粪墙。"],["破烂口袋和破筐，","千洞百孔难存粮。","如同小伙无媚色，","被人弃之于粪墙。"]],[["杀行桃园，","见虎东还。","螳螂之敌，","使我无患。"],["杀身之事发桃园，","见虎向东急回还。","螳螂奋臂挡路上，","我终没有受灾殃。"]],[["箕仁入室，","政衰弊极。","抱其彝器，","奔于他国。","因祸受福。"],["仁人箕子入囚室，","殷纣政权将衰敝。","太师少师抱祭器，","逃往异乡他国去。","因祸反而得福喜。"]],[["庭燎夜明，","追古伤今。","阳弱不制，","阴雄坐戾。"],["庭中火炬照夜明，","追怀远古感叹今。","阳气太弱失其制，","阴孽称雄而横行。"]],[["悬貆素餐，","食非其任。","失舆剥庐，","休坐徙居。"],["不去打猎家有貆，","不去种田食有餐。","丢掉车子毁了房，","迁离此地莫等闲。"]],[["嘉门福喜，","缯帛盛织。","日就为得，","财宝敌国。"],["美满家中多福喜，","布帛丝绸色艳丽。","天天都会有所得，","财宝可与国库比。"]],[["执绥登车，","骖乘东游。","说齐解燕，","霸国以安。"],["执缰登车驰向前，","一路行进到东边。","说服齐燕息争端，","成就霸业国平安。"]],[["水深无桴，","蹇难何游。","商伯失利，","庶人愁忧。"],["水深没有筏子渡，","不能出行甚困苦。","商人因之失大利，","黎民百姓忧满腹。"]],[["三鸟鸳鸯，","相随俱行。","南到饶泽，","食鱼与梁。","君子长乐，","见恶不伤。"],["三只水鸟和鸳鸯，","结伴随行至南方。","不到富饶沼泽地，","啄食鱼虾和稻粱。","好人快乐真悠长，","虽逢凶恶不受伤。"]],[["远视目盼，","临深苦眩。","不离越都，","旅人留难。"],["远望美景甚迷恋，","近看使人目昏眩。","越国都城多美丽，","旅行之人留居难。"]],[["终风东西，","涣散四方。","终日至暮，","不见子欢。"],["大风既起刮不停，","吹遍南北和西东。","清晨直到太阳落，","未能见到心上人。"]],[["言无要约，","不成券契。","殷叔季姬，","公孙争之。","强入委禽，","不悦于心。"],["空口无凭不算数，","没有券契做依据。","殷叔小妹很漂亮，","公孙相争不相让。","强行送来订婚礼，","小妹为难装心上。"]],[["牛马聋瞆，","不知声味。","远贤贼仁，","自令乱愦。"],["牛马眼瞎耳又聋，","声音滋味辨不清。","远离好人坏仁德，","自己昏愦胡乱行。"]],[["从商近游，","饱食无忧。","囹圄之困，","中子见囚。"],["弃官经商逍遥游，","酒足饭饱无忧愁。","不料遭受牢狱刑，","老二坐监被拘囚。"]],[["据斗远枢，","顺天无忧，","与乐并居。"],["斗柄围绕天枢行，","顺应上天无忧凶，","常与快乐相随从。"]],[["姬奭姜望，","为武守邦。","藩屏燕齐，","周室以强，","子孙亿昌。"],["召公奭和太公望，","辅佐武王守家邦。","燕国齐国作藩屏，","周朝因之得富强，","子孙众多国盛昌。"]],[["亡羊东泽，","循堤直北。","子思其母，","复返其所。"],["东面泽中丢了羊，","顺堤直寻于北方。","儿子思念老母亲，","重新返回他家乡。"]],[["张目闭口，","舌直距齿。","然诺不行，","政乱无绪。"],["张目闭口不能语，","舌头僵直抵住齿。","许下诺言不履行，","政治混乱无头绪。"]],[["载船逢火，","忧不为祸。","家在山东，","入门见公。"],["探家路上船失火，","及时扑灭无灾祸。","回到山东老家中，","见到父亲和亲人。"]],[["绝国异路，","必不相慕。","蛇子两角，","使我心恶。"],["遥远之国不同路，","心上彼此不相慕。","如同小蛇长犄角，","形象丑陋人厌恶。"]],[["鼻顶移徙，","居不安坐。","枯竹复生，","失其宠荣。"],["鼻子移到头顶上，","坐立不安怪模样。","竹子枯死又复生，","失去尊宠和荣光。"]],[["火息无光，","年岁不长，","殷商以亡。"],["大火熄灭无明亮，","年岁时运不久长，","殷商绝祀遭败亡。"]],[["文王四乳，","仁爱笃厚。","子畜十男，","折夭无有。"],["文王身有四乳头，","仁慈博爱且笃厚。","精心抚育十男儿，","个个健康又长寿。"]],[["熊罴豺狼，","在山阴阳。","伺鹿取獐，","道伏畏难。"],["虎豹熊罴和豺狼，","山南山北来潜藏。","伺机残食鹿和獐，","人行此道心也慌。"]],[["凋叶被霜，","独蔽不伤。","驾入喜门，","与福为婚。"],["枯叶凋零遇寒霜，","独蒙隐蔽未受伤。","驾车直入喜庆门，","与福联姻结成亲。"]],[["黄离白日，","照我四国。","元首昭明，","民赖恩福。"],["天上太阳闪金光，","照亮四面和八方。","君王仁义甚贤明，","百姓靠他受福恩。"]],[["顺风直北，","与欢相得。","岁熟年丰，","邑无寇贼。"],["顺着和风直向北，","与欢与乐喜相得。","庄稼长熟收成好，","城邑无贼无灾祸。"]]],[[["日在北陆，","阴蔽阳目。","万物空虚，","不见长育。"],["寒冬太阳行北方，","云雾遮住日头光。","万物空虚无踪影，","不见它们在生长。"]],[["鬼泣哭社，","悲商无后。","甲子昧爽，","殷人绝祀。"],["鬼魂哭泣社庙中，","悲痛商朝无子孙。","甲子清晨伐纣王，","殷商绝代无后人。"]],[["涉涂履危，","不利有为。","安坐垂裳，","乃无灾殃。","门户自开，","君忧不昌。"],["行路途中履险地，","想有作为大不利。","身穿长衣而安坐，","不会逢凶遭灾祸。","窗户房门自动开，","君怕祸从天上来。"]],[["阳失其纪，","枯木复起。","秋华冬实，","君不得息。"],["阳气失去其规律，","草木枯槁又复起。","秋天开花冬结实，","君王不能得安息。"]],[["大树之子，","百条共母。","当夏六月，","枝叶盛茂。","鸾凤以庇，","召伯避暑。","翩翩偃仰，","各得其所。"],["同为大树之骄子，","百根枝条共母体。","正当盛夏六月时，","枝繁叶子茂又密。","凤凰来此寻庇佑，","召公避暑之圣地。","生活悠闲多自得，","各得其所很欢娱。"]],[["秉钺执殳，","挑战先驱。","不从元帅，","败破为忧。"],["手执长矛和大斧，","前去挑战当先驱。","没有遵从元帅令，","晋军覆灭败于楚。"]],[["启室开关，","巡狩释冤。","夏台羑里，","汤文悦喜。"],["打开幽暗监狱门，","牢中囚犯得放行。","夏台和那羑里地，","成汤文王多欢欣。"]],[["衰灭无成，","渊溺在倾。","狗吠夜惊，","家乃不宁。"],["衰败破灭事无成，","掉进深渊浸水中。","夜半狗叫人受惊，","全家上下不安宁。"]],[["西邻少女，","未有所许。","志如委衣，","不出房户。","心无所处，","傅母何咎。"],["西邻有位小姑娘，","风华正茂无对象。","性情温柔又顺从，","静守家中不出房。","心中单纯少是非，","保姆不用犯愁怅。"]],[["狗吠夜惊，","履鬼头颈。","危者弗倾，","患者不成。"],["夜半狗叫人受惊，","踩着鬼头和脖颈。","危急之中未倾倒，","灾难祸患皆伏隐。"]],[["当年少寡，","独与孤处，","鸡鸣犬吠，","无敢难者。","我生不辰，","独婴寒苦。"],["守寡媳妇年纪轻，","孤单无扶独生存。","夜半鸡叫狗又咬，","无人敢敌行凶人。","我生未逢好时辰，","独有寒苦缠自身。"]],[["无道之君，","鬼哭其门。","命与下国，","绝不得食。"],["残暴无道之昏君，","鬼魂哭泣入家门。","苍天命他远离国，","饥不得食受贫穷。"]],[["乘龙南游，","夜过糟丘，","脱厄无忧。"],["骑乘飞龙向南游，","夜深人静过糟丘，","脱离困厄无凶忧。"]],[["马踬车伤，","长舌破家。","东关二五，","晋君出走。"],["马儿跌倒车损伤，","妇人长舌家败亡。","外嬖东关合二五，","公子重耳现逃忙。"]],[["瓜葩瓠实，","百女同室。","醯苦不熟，","未有妃合。"],["葫芦开花结果实，","成百籽儿里面聚。","又酸又苦不成熟，","未能匹配独自处。"]],[["晨风文翰，","大举就温。","昧过我邑，","羿无所得。"],["鹯鸟皋鸡鼓其翼，","高飞去寻温和地。","黎明之前过城邑，","射手后羿未得利。"]],[["浼浼浞浞，","涂泥至毂。","马泞不进，","虎啮我足。"],["途中积水多又多，","泥将车轴全淹没。","马蹄陷入难行进，","猛虎将我脚咬破。"]],[["胶车驾东，","与雨相逢。","五楘解堕，","顿辀独坐，","忧为身祸。"],["驾着胶车向东行，","路途之中与雨逢。","花纹皮条全脱落，","辕坏车主伏地坐，","忧心忡忡招灾祸。"]],[["六家作权，","公室剖分。","阴制其阳，","唐叔失明。"],["六家大臣握权柄，","公室利益被瓜分。","阴气强盛控制阳，","唐叔失去当年荣。"]],[["去室离家，","来奔大都。","火息复明，","姬伯以昌，","商人失功。"],["离开家室去出行，","朝着大都而投奔。","如同火熄又复明，","文王因此得昌盛，","殷商之人失其功。"]],[["牧羊稻园，","闻虎喧欢。","危惧喘息，","终无祸患。"],["放牧羊儿在稻园，","忽然听见虎声喧。","畏惧害怕隐藏起，","终究没有逢祸患。"]],[["婴儿求乳，","母归其子。","黄麑悦喜，","乃得甘饱。"],["婴儿呱呱要奶吃，","慈母将子抱怀里。","小黄鹿儿多喜悦，","得到慈母甜乳汁。"]],[["廓落失业，","跨祸度福，","利无所得。"],["没有依靠失了业，","虽未遭祸收入簿，","最终利益无所得。"]],[["出入无时，","忧祸为灾。","行人失牛，","利去不来。","老马遗驹，","无与久居。"],["出门回家不守时，","担忧祸患成灾异。","赶路之人失了牛，","所得利益全丢弃。","老马早产遗小驹，","不宜在此久留居。"]],[["风怒漂木，","女惑生疾。","阳失其服，","阴孽为贼。"],["狂风暴怒吹折木，","迷恋女色病肌肤。","阳气衰弱失其职，","阴孽横行成灾异。"]],[["车马病伤，","不利越乡。","幽人元亨，","去晦就明。"],["车子损伤马患病，","不利出门去远行。","囚犯亨通逢大吉，","离开黑暗投光明。"]],[["三奇六耦，","各有所主。","周南召南，","圣人所在。","德义流行，","民悦以喜。"],["三奇六耦乾坤数，","乾男坤女各有主。","周南召南好地方，","乃是圣人居住处。","德性仁义广流行，","民人悦喜乐其居。"]],[["典册法书，","藏在兰台。","虽遭乱溃，","独不遇灾。"],["典册宝籍和法书，","存在宫廷藏书处。","虽然遭逢大动乱，","灾祸独独不得入。"]],[["坐争立讼，","纷纷讻讻。","卒成祸乱，","灾及家公。"],["坐立不安起争讼，","是非曲直难辨清。","终于造成大祸乱，","灾害殃及老父亲。"]],[["凶忧为残，","使我不安。","从之南国，","以除心疾。"],["凶祸忧虑造灾患，","使我心中不得安。","随君同至南国去，","以除心病把心宽。"]],[["爱我婴女，","牵衣下与。","冀幸高贵，","反得贱下。"],["溺爱我家小闺女，","众人求婚未允许。","企盼荣华富贵人，","反而嫁给卑贼婿。"]],[["宜行贾市，","所聚必倍。","载喜抱子，","与利为友。"],["适宜出门做生意，","能够得到成倍利。","欢欢喜喜抱儿子，","我与利益结友谊。"]],[["坐席未温，","忧来扣门。","逾墙北走，","兵交我后。","脱于虎口。"],["刚刚坐下席未温，","即有忧患来敲门。","慌忙越墙向北逃，","追兵就在身后跟。","终脱虎口离险境。"]],[["赤帝悬车，","废职不朝。","叔带之灾，","居于汜庐。"],["赤帝弃官悬起车，","不理朝政废职责。","叔带从中造灾祸，","襄王出奔到郑国。"]],[["子畏于匡，","厄困陈蔡。","明德不危，","竟自免害。"],["孔子被围在匡地，","又于陈蔡受因厄。","德行光明无危险，","终将灾难躲避过。"]],[["逐雁南飞，","马疾牛罢。","不见鱼池，","失利忧危。","牢户之冤，","脱免无患。"],["追逐南飞之大雁，","马儿患病牛疲倦。","一路难见养鱼池，","失掉利益逢忧患。","不幸坐牢蒙屈冤，","终于脱因免灾难。"]],[["推辇上山，","高仰重难。","终日至暮，","不见阜巅。"],["推着车子上高山，","山高路险攀登难。","从早一直到天黑，","仍未见到山顶端。"]],[["忧不危患，","福在堂门，","使吾偃安。"],["虽有忧虑未成患，","福佑就在家门前，","使我坦然获平安。"]],[["春桃生华，","季女宜嫁。","受福多年，","男为邦君。"],["春天桃树盛开花，","小女即将要出嫁。","在家受福已多年，","女婿是位地方官。"]],[["高山之巅，","去地亿千。","虽有兵寇，","足以自守。"],["高高山峰之顶端，","距离平地千里远。","虽有敌寇来侵犯，","足以自守保平安。"]],[["过时历月，","役夫憔悴。","处子叹室，","思我伯叔。"],["超期服役已数月，","士卒劳累瘦又弱。","未婚少女单相思，","盼我大哥返家室。"]],[["太微复明，","说升傅岩，","乃称高宗。"],["太微星座又亮明，","贤人傅说得提升，","高宗武丁很称心。"]],[["旁多小星，","三五在东。","早夜晨行，","劳苦无功。"],["心宿柳宿嵌在东，","旁边众多小星星。","半夜操劳如奴婢，","辛苦劳累没有功。"]],[["东乡烦烦，","相与笑言。","子般鞭荦，","圉人作患。"],["隔壁东望心中烦，","荦与梁女相笑言。","子般鞭打圉人荦，","圉人作患杀子般。"]],[["鼻移在头，","枯苇复生。","下朽上荣，","家乃不宁，","其舍不成。"],["鼻子长在头顶上，","芦苇干枯又生长。","下部朽烂上部荣，","预示家中不安详，","不能奠基建新房。"]],[["虾蟆群聚，","从天请雨。","去雷集聚，","应时辄与，","得其所愿。"],["蛤蟆结队聚成群，","向天祈求雨降临。","乌云集聚雷声鸣，","大雨立时如倾盆，","得其所愿好称心。"]],[["大步上车，","南到喜家。","送我貂裘，","与福载来。"],["大步流星登上车，","南到人家做喜客。","送我一身貂皮衣，","给我带来好福气。"]],[["贼仁伤德，","天怒不福。","斩刈宗社，","失其土宇。"],["伤害仁义与道德，","上天发怒惩罪过。","宗庙社稷被斩绝，","祖业失守又亡国。"]],[["从猬见虎，","虽危不殆，","终已无咎。"],["与猬同行碰到虎，","虽有危险不畏惧，","终保平安无事故。"]],[["履素行德，","卒蒙佑福。","与尧侑食，","君子有息。"],["真诚纯朴行仁德，","天将福佑赐予我。","陪同唐尧共用餐，","君子受益得安乐。"]],[["利在北陆，","寒苦难得。","忧危之患，","福为道门，","商叔生存。"],["北方之地有厚利，","天寒地冻难获取。","担忧危惧祸患生，","最终福禄来临门，","商叔因之得生存。"]],[["四蹇六盲，","足痛难行。","终日到暮，","不离其乡。"],["四跛六盲共十人，","脚上病痛路难行。","从早一直到傍晚，","仍未走出家乡门。"]],[["台骀昧子，","明知地理。","障泽宣流，","封居河涘。"],["小神台骀昧之子，","精通天文和地理。","筑起堤坝疏洪流，","被封居住汾水域。"]],[["蓄水待时，","以备火灾。","柱车绊马，","郊行出旅，","可以无咎。"],["平时蓄水做防备，","遇到火灾不着急。","支车拴马有设备，","放心出门远郊去，","可以无害又无弊。"]],[["岁暮花落，","君衰于德。","荣宠陨坠，","阴夺其室。"],["寒冬岁末花已落，","国君德衰仁义簿。","荣耀宠幸都坠地，","君位也被暗中夺。"]],[["夏贩蔡悲，","千里为市。","黄叶殪郁，","利得无有。"],["夏贩蔬菜心悲伤，","徒行千里去市场。","菜叶枯黄皆凋零，","利益不能到手上。"]],[["仲春巡狩，","东见群后。","昭德允明，","不失其所。"],["仲春二月去巡狩，","东上泰山会诸侯。","圣德昭明施仁政，","基业牢固不失丢。"]],[["裂絜堁堁，","结缔难解。","嫫母炫嫁，","媒不得坐，","自为身祸。"],["结扣一结又一结，","想尽法儿难解脱。","丑女求嫁自炫耀，","媒人奔忙不得坐，","自己貌丑才得祸。"]],[["鸟鸣庭中，","以戒灾凶。","重门击柝，","备忧暴客。"],["鸟儿鸣叫于庭中，","告诫主人防灾凶。","门户紧闭击更梆，","以备盗贼骤降临。"]],[["朝霁幕露，","瀸我衣襦，","道无行牛。"],["早晨天晴晚浓露，","浸湿我的衣和裤，","不见耕牛在何处。"]],[["抱璞怀玉，","与桀相触。","诎坐不申，","道无良人。"],["抱璞怀玉路上行，","碰上夏桀大暴君。","伏坐在地冤难申，","道路当中无好人。"]],[["两心相悦，","共其茅藘。","夙夜在公，","不离房中，","得君子意。"],["两心喜悦真高兴，","如同茜草一处生。","早起晚睡为公忙，","贤妻扶持在家中，","丈夫得意好称心。"]],[["载馈如田，","破失餐。","苗秽不辟，","独饥于年。"],["带着粮饷下田间，","坏了锄头又失餐。","苗草杂生难开垦，","独自忍饥度荒年。"]],[["甘露醴泉，","太平机关。","仁德咸应，","岁乐民安。"],["天降甘露地出泉，","太平盛世临人间。","施行仁德天感应，","年岁丰收百姓安。"]]],[[["太王为父，","季历孝友。","文武圣明，","仁德兴起。","孔张四国，","载福绥厚。"],["古公亶父为父亲，","季历友善又孝顺。","文王武王俱圣明，","仁义道德行兴隆。","弘扬光大于四方，","全家安好福禄丰。"]],[["猿堕高木，","不踒手足。","保我金玉，","还归其室。"],["猿从大树坠于地，","没有摔伤手和足。","保全我的金和玉，","返回它的原居室。"]],[["重耳恭敬，","遇谗出处。","北奔狄戎，","经涉齐楚。","以秦伐怀，","诛殺子圉，","身为伯主。"],["重耳恭顺又聪敏，","遭遇谗言而出奔。","向北逃至戎狄邦，","中途穿越齐楚境。","借秦之力伐怀公，","诛杀子圉使乱平，","成就霸业称豪雄。"]],[["倚锋据戟，","伤我胸臆，","耗折不息。"],["手执短剑和长戟，","与敌拼搏伤胸臆，","剑锋折毁战未息。"]],[["狗冠鸡步，","君失其所。","出门抵山，","行者忧人。","水灌我园，","高陆为泉。"],["狗戴帽子学鸡步，","官人失去其所处。","出门遇山难前进，","行路之人甚劳苦。","大水冲进我家园，","高地汪洋成山泉。"]],[["众鸟所翔，","中有大怪。","丈身长头，","为我惊忧。"],["众鸟长空齐飞翔，","内有怪鸟逞凶狂。","身体高大头长长，","使人看了心惊慌。"]],[["雷行相逐，","未有休息。","战於平陆，","为夷所覆。"],["雷声滚滚相追逐，","没有片刻能休步。","两军激战于平陆，","终被东夷所败覆。"]],[["禹凿龙门，","通利水泉。","同注沧海，","民得安土。"],["大禹治水凿龙门，","泛滥洪水得畅通。","奔流直泻入沧海，","百姓赖此得安身。"]],[["尧舜仁德，","养贤致富。","众英积聚，","国无寇贼。"],["唐尧虞舜有仁德，","培养贤人富民国。","众多英才聚一处，","贼寇不来侵犯我。"]],[["陆居少泉，","山高无云。","车行千里，","涂不污轮，","渴为我怨。"],["住在陆地少水泉，","山峰高耸无云掩。","驾车日行千里路，","途中轮子无泥沾，","饥渴使我生愁怨。"]],[["朝视不明，","夜不见光。","瞑抵空床，","季女奔亡，","怆然心伤。"],["早上太阳不明亮，","夜晚不见月儿光。","黑暗之中摸空床，","媳妇早已逃他乡，","痛恨失意生悲伤。"]],[["齐鲁永国，","仁圣辅德。","进礼雅言，","定公以安。"],["永世长存齐鲁国，","仁人智士来辅佐。","景公赔礼又道歉，","定公因此得平安。"]],[["束帛玄圭，","君以布德。","伊吕百里，","应聘辅国。"],["持帛秉圭携宝物，","君主以此布仁德。","伊尹吕尚百里奚，","应聘前来辅我国。"]],[["棘钩我襦，","为绊所拘。","灵巫拜祝，","祸不成灾。","东山之邑，","中有土服，","可以饶饱。"],["荆棘钩住我短衣，","绊手绊脚受限制。","灵验巫师做祷告，","祸害未能成灾异。","东山城邑之外面，","田野蔓菁多茂盛，","可以充饥供我食。"]],[["门烧屋燔，","为下所残。","西行出户，","顺其道里。","虎卧不起，","牛羊欢喜。"],["门窗屋子全烧光，","身被小人所残伤。","走出家门向西逃，","顺着小路奔他乡。","猛虎静卧没有起，","牛羊欢喜称吉祥。"]],[["墙高蔽目，","昆仑翳日。","远行无明，","不见欢叔。"],["近处高墙遮目光，","远方昆仑挡太阳。","路途漫漫无明亮，","不见欢叔犯惆怅。"]],[["天地际会，","不见内外。","祖辞遣送，","与世长诀。"],["天地会合在一起，","难分内外与表里。","先祖遣送公出门，","与世长辞久别离。"]],[["深水难涉，","泥涂至毂。","牛罢不进，","泞陷为疾。"],["水深流急难渡涉，","路途泥泞难行车。","疲牛拉车不前进，","陷入污潭成灾祸。"]],[["羊惊虎狼，","耸耳群聚。","无益于僵，","为齿所伤。"],["山羊受惊于虎狼，","集聚竖耳甚惊慌。","力弱无法去抵抗，","终被兽齿所残伤。"]],[["履蛇蹑虺，","与鬼相视。","惊恐失气，","如骑虎尾。"],["脚踩毒蛇身躯上，","两眼与鬼相对望。","神色惊恐又慌张，","如同骑在虎尾上。"]],[["车惊人堕，","两轮脱去。","行者不至，","主人忧惧。","缔结复解，","夜明为喜。"],["马惊车翻人坠地，","两个车轮脱落去。","客人没有按时来，","主人心里很着急。","重重思虑得解除，","月明于夜忧成喜。"]],[["南贩北贾，","与怨为市，","利得百倍。"],["走南闯北做生意，","拿出积蓄搞交易，","欣然获得百倍利。"]],[["延陵适鲁，","观乐太史。","车邻白颠，","知秦兴起。","卒兼其国，","一统为主。"],["延陵前往鲁国地，","陪他观乐有太史。","听了车邻白颠诗，","预知秦国将兴起。","最终兼并其六国，","统一天下成皇帝。"]],[["出门逢患，","与福为怨。","更相击刺，","伤我手端。"],["出门不幸逢祸患，","与福结成仇和怨。","更相拼搏相刺击，","最终伤了我手端。"]],[["獐鹿群走，","自然燕喜。","公子好游，","他人多有。"],["獐子鹿儿同出行，","和睦相处很高兴。","小伙喜欢外出游，","善于结交好朋友。"]],[["恭宽信敏，","履福不殆。","从其邦域，","与喜相得。"],["恭敬宽容又敏捷，","步入福宅享福泽。","君若前往他国去，","能与欢乐常相得。"]],[["欲飞无翼，","鼎重折足。","失其福利，","苞羞为贼。"],["想要高飞无翅膀，","鼎重使得腿折伤。","幸福利禄全失去，","忍辱含羞贼模样。"]],[["府藏之富，","王以赈贷。","捕鱼河海，","罟网多得。"],["府库储藏很丰富，","君王救济多借出。","大河大海去捕鱼，","网网获取都充足。"]],[["有鸟黄足，","归呼季玉：从我睢阳，","可避刀兵。","与福俱行，","有命久长。"],["有中鸟儿其脚黄，","呼叫季玉同前往：跟我一起去睢阳，","可避兵祸免灾殃。","同与福祥一路行，","上天保佑命长久。"]],[["阴生麋鹿，","鼠舞鬼哭。","灵龟陆处，","釜甑尘土。","仁智盘桓，","国乱无绪。"],["阴气催生出麋鹿，","老鼠跳舞魔鬼哭。","灵龟潜伏于陆地，","锅底尘土在飘浮。","智士徘徊不得前，","国家混乱无头绪。"]],[["风尘瞑迷，","不见南北。","行人失路，","复反其室。"],["尘土飞扬天昏暗，","不辨西北和东南。","出行之人迷了路，","中途回归自家园。"]],[["金革白黄，","宜利戎市。","嫁娶有息，","商人悦喜。"],["金银皮革色白黄，","武器市场生意忙。","婚姻嫁聚获利息，","经商人儿心欢畅。"]],[["匏瓜之德，","宜系不食。","君子失舆，","官政怀忧。"],["葫芦可以做水瓢，","不应将它白吃掉。","大人从政失了轿，","心怀忧愁官难保。"]],[["乘船渡济，","载水逢火。","赖得免患，","我有所恃。"],["乘坐船儿去渡河，","载着水儿遇上火。","全靠圣水免了患，","我有倚仗未得祸。"]],[["道险多石，","伤车折轴。","与市为仇，","不利客宿。"],["山高路险石头多，","车子受伤车轴折。","集市交易结仇怨，","不利在外当宿客。"]],[["托寄之徒，","不利请求。","结衿无言，","乃有悔患。"],["寄人篱下可怜徒，","无法求人来帮助。","摆弄衣襟不出言，","君有悔恨与患难。"]],[["三羊争雌，","相逐奔驰。","终日不食，","精气竭疲。"],["三只公羊争一雌，","相互追逐而奔驰。","整日不吃又不喝，","耗尽精力甚劳疲。"]],[["退恶防患，","见在心田。","日中之恩，","解释倒悬。"],["驱退凶恶防祸患，","意念浮现于心田。","中午阳盛阴伏藏，","身心安宁解倒悬。"]],[["两足四翼，","飞入嘉国。","宁我伯姊，","与母相得。"],["两脚添上四翅膀，","快快飞回我家乡。","探望兄弟和姐妹，","欢聚慈母之身旁。"]],[["寒露所凌，","渐至坚冰。","草木疮伤，","花落叶亡。"],["寒露来临阴气盛，","滴水结凌成坚冰。","草木结疮受了伤，","花朵凋落叶枯亡。"]],[["后稷农功，","富利我国。","南亩治理，","一室百子。"],["农官后稷有功勋，","人民富遮国安宁。","南边田里勤耕作，","果实累累好收成。"]],[["设网张罗，","捕鱼园池。","网罟自决，","虽得复失。","危诉之患，","受其忻欢。"],["设下捕鱼大罗网，","引诱鱼儿来上当。","捕鱼工具有缺口，","入网之鱼全跑光。","鱼有入网之忧患，","脱险心儿多欢畅。"]],[["路舆县休，","侯伯恣骄。","上失其威，","周室衰微。"],["大车悬置不使用，","诸侯肆意胡乱行。","在上失去其威严，","周室衰微王权倾。"]],[["逐走追亡，","相及扶桑。","复见其乡，","使我悔丧。"],["追赶逃亡兵与将，","一直追到那扶桑。","重新见到故乡景，","使我悔恨又沮丧。"]],[["履禄绥厚，","载福受祉。","衰微复起，","继事长久。","疾病献麦，","晋人赴告。"],["踏进禄门受厚福，","得到很多福与禄。","衰微之后又兴起，","世代相继长安处。","景公得病要尝麦，","晋国由盛变衰落。"]],[["鳏寡孤独，","禄命苦薄。","入宫无妻，","武子衰悲。"],["鳏公寡妇甚孤独，","福禄浅薄命太苦。","进入房中不见妻，","武子悲伤而哭泣。"]],[["山没丘浮，","陆为水鱼。","燕雀无巢，","民无室庐。"],["山丘浮现水面上，","陆地成为鱼儿乡。","燕雀失去其巢穴，","黎民百姓无住房。"]],[["冠带南游，","与福喜期。","徼于嘉国，","拜位逢时。"],["衣冠楚楚向南游，","与福相会乐悠悠。","应邀前往嘉国去，","走运封予我官职。"]],[["东行亡羊，","失其羝牂。","少妇无夫，","独坐空庐。"],["东行途中丢了羊，","失掉公羊和母羊。","少妇失去其丈夫，","独坐家中守空房。"]],[["探雀捕鱼，","耕田捕鳅。","费日无功，","右手虚空。"],["前往鸟巢去捉鱼，","田间捕鳅入误域。","白费时间无成效，","右手空空妄辛苦。"]],[["东行饮酒，","与喜相抱。","福为吾家，","利来从父。","水泽之徒，","望邑而处。"],["前往东家饮美酒，","与喜相逢乐悠悠。","大福步入我家门，","利益跟着父亲走。","水旁泽边之游子，","盼望进城而安居。"]],[["亡怒失精，","自令畏悔。","忪忪之惧，","君子无咎。"],["枉然发怒伤元气，","畏惧懊悔你自己。","诚惶诚恐受虚惊，","德高之人无灾异。"]],[["白云如带，","往往来处。","飞风送迎。","大雹将下。","击我禾稼，","僵死不起。"],["白去飘浮如带形，","缓缓移到我上空。","风儿送去又迎来，","冰雹降到麦田中。","毁了我的好稼禾，","伏地枯死不能生。"]],[["南至之日，","阳消不息。","北风冽寒，","万物藏伏。"],["冬至太阳偏南极，","阳光消弱不停息。","北风凛冽天严寒，","万物藏伏都不起。"]],[["火中季夏，","鸿雁解舍。","体重难移，","未能高举。","君子显名，","不失其誉。"],["盛夏季节天酷热，","鸿雁落地来休歇。","身体沉重难移动，","不能高飞去他国。","天之骄子美名扬，","保其荣誉享欢乐。"]],[["北行出门，","履陷踬颠。","踒足据涂，","污我襦袴。"],["走出家门向北行，","鞋陷受绊路不平。","跌倒在地伤脚筋，","衣服浸入污泥中。"]],[["轻车醊祖，","飙风暴起。","促乱祭器，","飞扬鼓舞。","明神降佑，","道无害寇。"],["战车出行祭路神，","突然刮起大狂风。","吹坏祭器和祭品，","飞沙走石扬不停。","承蒙神明来保佑，","途中无寇无灾凶。"]],[["酒为欢伯，","除忧来乐。","福喜入门，","与君相索，","使我有得。"],["美酒是我欢乐哥，","为我除忧招欢乐。","福喜双双入门槛，","与君共同去求索，","使我获得福禄多。"]],[["三足孤乌，","虚鸣督邮。","司过罚恶，","自贼其家，","毁败为忧。"],["王母信使三足乌，","徒有虚名任监督。","管纠过失罚罪恶，","自害其家自受苦，","毁坏败亡身受辱。"]],[["三河俱合，","水怒踊跃。","坏我王屋，","民饥于食。"],["三河汇到一起来，","波涛汹涌成水害。","冲毁我家居住室，","百姓忍饥受大灾。"]],[["南行枣园，","恶虎畏班。","执火销金，","使我无患。"],["南行来到枣树园，","猛虎受惊急逃窜。","销毁兵器战争止，","使我平安无祸患。"]],[["求鹿过山，","与利为怨。","暗聋不言，","谁知其欢？"],["买鹿跑到山那边，","与利结下仇和怨。","卖主聋哑不出言，","谁知他的悲与欢？"]],[["行旅困蹴，","失明守宿。","囹圄之忧，","启蛰出游。"],["困于旅店难启程，","守留住宿盼天明。","牢中之人耐心等，","春来方能出狱门。"]],[["据棘履杞，","跌刺为忧。","夫妇不和，","乱我良家。"],["两脚踏入棘杞地，","跌倒受刺爬不起。","夫妇二人不和睦，","棒打鸳鸯家分离。"]]],[[["执辔四骊，","王以为师。","阴阳之明，","载受东齐。"],["手执缰绳驾骏马，","文王之师姜子牙。","明晓天意辅佐王，","受封齐国治东方。"]],[["春秋祷祝，","解祸除忧，","君子无咎。"],["春秋祈祷天保佑，","解除祸患与忧愁，","德高之人无罪咎。"]],[["坐朝乘轩，","据国子民。","虞叔受命，","和合六亲。"],["上朝坐殿乘轩车，","以民为子安家国。","虞仲接受天之命，","和睦亲近其六亲。"]],[["开户下堂，","与福相迎。","禄於公室，","曾孙以昌。"],["打开门户走下堂，","与福相迎精神爽。","接受禄位官府中，","富至后代子和孙。"]],[["高木腐巢，","漏湿难居；","不去甘棠，","使我无忧。"],["高树之上鸟巢烂，","阴湿滴漏居住难；","不去甘棠听诉讼，","使我不会逢忧患。"]],[["三女为奸，","俱游高园。","背室夜行，","与伯笑言。","不忍主母，","为失醴酒，","冤尤谁告？"],["三位女子有奸情，","一同游至原野中。","背着丈夫夜出行，","与人谈笑乱调情。","不忍主母来非难，","假借跌身泼掉酒，","冤屈谁人能说清？"]],[["漏卮盛酒，","无以养老。","春贷黍稷，","年岁实有。","履道坦坦，","平安无咎。"],["漏杯盛酒不顶事，","无法养老干着急。","春天借粮来充饥，","秋后岁末衣食足。","走在平坦大道上，","平平安安很顺利。"]],[["松柏枝叶，","常茂不落。","君子惟体，","日富安乐。"],["松树枝条柏树叶，","茁壮成长不凋落。","为官之人重德行，","天天富贵又安乐。"]],[["夫妇不谐，","为燕攻齐。","良弓不张，","骑劫忧亡。"],["文公夫妇不谐和，","苏秦为燕攻齐国。","弓箭虽好难使用，","燕将骑劫遭祸凶。"]],[["出令不胜，","反为大灾。","强不克弱，","君受其忧。"],["下令进攻未取胜，","反而招来大灾凶。","外强中干不制弱，","大人引火烧自身。"]],[["奔牛相错，","败乱绪业，","民不得作。"],["奔牛东撞又西躲，","乱了头绪和事业，","民心无法再振作。"]],[["载璧秉圭，","请命於河。","周公克敏，","冲人瘳愈。"],["手执玉璧和元圭，","情求河神施恩惠。","周公愿替成王死，","年轻人儿病痊愈。"]],[["素车伪马，","不任重负；","王侯出征，","忧危为咎。"],["没有好车无骏马，","不能重载和运拉；","王侯出行去征讨，","忧虑危难临自家。"]],[["大树之子，","百条共母。","比至火中，","枝叶盛茂。"],["大树生出小嫩枝，","枝条同属一母体。","待到盛夏阳光足，","枝叶茂盛又繁密。"]],[["壅遏堤防，","水不得行。","火盛阳光，","阴霓伏藏，","走归其乡。"],["遏止洪流筑堤防，","河水不再乱流淌。","熊熊烈火赛阳光，","阴霓被迫去伏藏，","向北退回它故乡。"]],[["五岳四渎，","润洽为德；","行不失理，","民赖恩福。"],["五座名山四条河，","滋润大地施恩德；","做事不违其常理，","人民赖此享福泽。"]],[["驾骏南游，","虎惊我牛。","阴不奉阳，","其光显扬。","言之谦谦，","奉义解患。"],["驾着骏马去南游，","恶虎惊动我的牛。","阴气逞凶不尊阳，","双目凶光来对抗。","说话谦虚又和蔼，","奉行仁义解悲伤。"]],[["早霜晚雪，","伤害禾麦。","损功弃力，","饥无所食。"],["早晨降霜晚下雪，","伤害谷子和小麦。","前功尽弃白费力，","忍饥挨饿难生活。"]],[["岐周海隅，","有乐无忧。","可以避难，","全身保财。"],["岐山周地与海隅，","居之快乐无忧虑。","可以避免灾与难，","保全身体和财产。"]],[["阴蔽其阳，","日暗不明。","君忧其国，","求骍得黄，","驹犊从行。"],["阴云遮蔽太阳光，","日头昏暗不明亮。","君王忧国又忧民，","求赤反而得到黄，","马驹牛犊一大帮。"]],[["金城铁郭，","上下同力。","政平民欢，","寇不敢贼。"],["铜墙铁壁坚如钢，","上下同力保国防。","政治清明人民乐，","敌寇不民侵国邦。"]],[["平公有疾，","迎医秦国。","和不能愈，","晋人赴告。"],["晋国平公患重病，","前往秦国请医生。","名医医和难治愈，","晋国派人报丧情。"]],[["戴尧扶禹，","松乔彭祖。","西遇王母，","道路夷易，","无敢难者。"],["拥戴唐尧扶大禹，","遇到松乔和彭祖。","西去拜见我王母，","道路平坦又顺利，","没有谁人敢拦阻。"]],[["羔羊皮革，","君子朝服。","辅政扶德，","以合万国。"],["羔此之衣软又轻，","官人穿它上朝廷。","辅佐朝政又扶德，","普天之下都和顺。"]],[["振钟鼓乐，","将军受福。","安帖之家，","虎狼为忧。","履危不殆，","师行何咎！"],["敲起编钟奏起乐，","将军尽情享福泽。","告示传遍千万家，","警惕坏人造灾祸。","临危不惧早防范，","出征伐恶有何险！"]],[["嫡庶不明，","孽乱生殃，","陈失其邦。"],["正妻侍妾分不清，","为孽作乱生祸凶，","陈氏失国妄悲愤。"]],[["鸟惊狐鸣，","国乱不宁。","上弱下强，","为阴所刑。"],["鸟儿惊叫狐悲鸣，","国家骚乱不安宁。","君王软弱臣强盛，","终遭暗算受苦刑。"]],[["被绣夜行，","不见文章。","安坐于堂，","乃无咎殃。","长子帅师，","得其正常。"],["披锦徒行夜路上，","花纹全然难端详。","安安稳稳坐殿堂，","不出过失无祸殃。","长子帅师去出征，","万事顺遂得正常。"]],[["六月采芑，","征伐无道。","张仲方叔，","克胜饮酒。"],["《六月》《采芑》两首诗，","鞭策无道伐叛逆。","张仲方叔同一席，","凯旋痛饮庆胜利。"]],[["时乘六龙，","为帝使东。","达命宣旨，","无所不通。"],["顺应时节乘六龙，","帝王使者向东行。","宣布旨意伟君令，","一路无所不畅通。"]],[["昧暮乘车，","东至伯家。","逾梁越河，","济脱无他。"],["日暮乘车而出发，","向东欲至大哥家。","跨过桥梁越过河，","平安顺利终到达。"]],[["东风解冻，","和气兆升，","年岁丰登。"],["东风吹走寒和冷，","温和之气日渐升，","今年庄稼好收成。"]],[["三狸搏鼠，","遮遏前后。","死于圜城，","不得脱走。"],["三只山猫捕老鼠，","前后围追又截堵。","最终死于围攻地，","不能脱身难逃出。"]],[["绥德孔明，","履禄久长。","贵且有光，","疾病忧伤。"],["美好德行甚昭彰，","得到禄位运久长。","虽然尊贵有荣光，","身患疾病生忧伤。"]],[["三虎搏狼，","力不相当。","如摧腐枯，","一击破亡。"],["三只老虎斗一狼，","相差悬殊力不当。","如同摧毁腐枯树，","不堪一击即败亡。"]],[["使伯采桑，","狠不肯行。","与叔争讼，","更相毁伤。"],["小弟唤哥去采桑，","大哥固执不前往。","兄弟二人起争讼，","互相攻击和诽谤。"]],[["抱空握虚，","鸮惊我雏，","利去不来。"],["怀中空空手中虚，","老鹰吓跑我小鸡，","利益逃至远方去。"]],[["李花再实，","鸿卵降集。","仁哲以兴，","荫国无贼。"],["李树开花再结实，","鸿雁产卵降平地。","仁智贤人得重用，","国受庇护无寇欺。"]],[["东山皋落，","勇悍不服。","金玦玩好，","衣为身贼。"],["东山之上皋落氏，","勇猛强悍不服气。","环形美玉玩物好，","杀身之祸是偏衣。"]],[["飞蚊污身，","为邪所牵。","青蝇分白，","贞孝放逐。"],["嗡嗡飞蚊污已身，","恶人牵着好汉行。","青蝇善变黑与白，","贞孝儿女遭厄运。"]],[["南山黄竹，","三身六目。","出入制命，","东里宣政。","主尊君安，","郑国无患。"],["南山黄竹多茂盛，","三个竿儿六个孔。","用它书写王之命，","东里之地宣政令。","主上尊荣君安宁，","郑国没有祸与凶。"]],[["泉起昆仑，","东出玉门。","流为九河，","无有忧患。"],["泉水起源昆仑山，","向东流出玉门关。","总流分成九条河，","没有忧虑无灾患。"]],[["命短不长，","中年夭伤。","思及哭堂，","哀其子亡。"],["短命鬼儿活不长，","到了中年即夭伤。","常相思念哭屋堂，","悲哀儿子身先亡。"]],[["君臣不和，","上下失宜，","宗子哀歌。"],["君上臣下不和气，","上下失宜乱秩序，","长子悲哀独哭泣。"]],[["苛政日作，","螟食华叶。","割下啖上，","民被其贼，","秋无所得。"],["苛政天天来逼我，","螟虫泛滥食花叶。","咬断根茎噬其秧，","百姓惨遭其害伤，","秋收季节无食粮。"]],[["南行载铠，","登履九魁。","车伤牛罢，","日暮嗟咨。"],["南行运铠到前线，","翻过九座小土山。","人困马乏车损伤，","天黑未能到终点。"]],[["春东夏南，","随阳有力，","与利相逢。"],["春行至东夏至南，","我随骄阳把光沾，","与利相逢不待言。"]],[["头尾颠倒，","不知绪处，","君失其国。"],["本末倒置是非颠，","首尾不分头绪乱，","君主昏庸丧政权。"]],[["言无要约，","不成券契。","殷叔季姬，","公孙争之。","强入委禽，","不悦于心。"],["说话没有定盟约，","事情不成无券契。","殷叔有个漂亮女，","公子王孙争着娶。","强行送来订婚礼，","姑娘心中不愿意。"]],[["缺破不成，","胎卵不生，","不见其形。"],["缺破不全无法用，","胎胞卵子皆不生，","归根结蒂没有形。"]],[["见蛇交悟，","惜蚖畏恶，","心乃无悔。"],["路见两蛇正交配，","同情之余又生畏，","心中坦然无恨悔。"]],[["河水孔穴，","坏败我室。","水深无涯，","鱼鳖倾倒。"],["河水决堤成灾祸，","洪流冲坏我房舍。","水流深深无边际，","龟鳖顺流而倾泻。"]],[["五岳四渎，","地得以安。","高而不危，","恭慎避患。"],["四条大河五座山，","大地无垠得平安。","巍巍高耸无危险，","敬之慎之可避患。"]],[["南至之日，","阳消不息。","北风冽寒，","万物藏伏。"],["冬至太阳到南极，","阳气消弱不停息。","北风凛冽天寒冷，","万物隐伏不出世。"]],[["五利四福，","俱田高邑。","黍稷盛茂，","多获高稻。"],["五利将军佩金印，","食邑两千武帝封。","庄稼长得很茂盛，","喜获丰收多贮存。"]],[["公孙驾车，","载游东齐。","延陵说产，","遗季苎衣。"],["黑马驾车公孙坐，","向东出游访齐国。","延陵季子一席话，","子产赠他贵重物。"]],[["蛟虬当道，","民困愁苦。","望羊置群，","长子在门。"],["凶蛟恶龙当路行，","百姓愁苦受困顿。","盼那羊儿快成群，","盼望长子撑家门。"]],[["金玉满堂，","忠直乘危。","三老冻饿，","鬼夺其室；","求鱼河海，","网举必得。"],["富贵人家金满堂，","忠诚之士却遭殃。","三老受冻又挨饿，","恶鬼夺走其住房；","前往河海去捕鱼，","举起一网得一筐。"]],[["日入明慝，","阳晶隐伏。","小人劳心，","求事不得。"],["太阳落山黑黝黝，","阳光隐伏入山丘。","小人劳心又费力，","求事不得反为忧。"]],[["频逢社饮，","失利后福。","不如子息，","旧居故处。","申请必得，","乃无大悔。"],["频繁碰上社饮节，","失利尔后享福泽。","不如学我子和女，","安居故里守旧舍。","善于助人解危难，","最终无悔也无祸。"]],[["南有嘉鱼，","驾黄取鲂。","鲂鱮诩诩，","利来无忧。"],["南方圣地有好鱼，","乘车去把鳞鱼取。","鱼儿融洽聚一起，","得来利益无忧虑。"]],[["黄裳建元，","文德在身。","禄佑洋溢，","封为齐君。"],["身着黄衣建美德，","自有文韬和武略。","福禄绵绵无穷尽，","天子封他治齐国。"]],[["口不从心，","欲东反西。","与意乖戾，","动举失便。"],["言行不一口违心，","说要东去却西行。","行为思想不相合，","失去信任事难成。"]],[["日争凶讼。","叨尔为长，","不能定从。"],["天天争凶又逞狂。","可怜你那地方官，","不能做主除祸殃。"]]],[[["小窗多明，","道里利通。","仁贤君子，","国安不僵。"],["小小窗户多光明，","道路平坦又畅通。","官人圣贤又仁慈，","国家安宁不覆倾。"]],[["心恶来怪，","冲冲何惧？","颜渊子骞，","尼父圣诲。"],["厌恶妖魔入门槛，","有何惧怕神不安？","学生颜渊闵子骞，","孔子教诲记心间。"]],[["鸟鸣呼子，","哺以酒脯。","高栖水处，","来归其母。"],["雌鸟呼唤其幼子，","喂它酒肉和美食。","栖身高山流水间，","奋飞返回母身边。"]],[["国马生角，","阴孽萌作。","变易常服，","君失于宅。"],["国中有马生出角，","阴孽萌生把怪作。","世态变换多反常，","大人失去其宝座。"]],[["入宇多悔，","耕石不富。","衡门屡空，","使士失意。"],["步入屋宇多悔恨，","石间耕种禾不生。","陋室空空无食物，","堂堂男子意恢冷。"]],[["诸孺行贾，","远涉山阻。","与旅为市，","不危不殆，","利得十倍。"],["孩童外出做生意，","远行涉水山隔阻。","行旅经商奔波忙，","没有危险和灾殃，","获利十倍多欢畅。"]],[["梁破桥坏，","水深多畏。","陈郑之间，","绝不得前。"],["桥梁损坏遭塌陷，","水深流急多畏难。","陈国和那郑国间，","路途断绝难向前。"]],[["双凫俱飞，","以归稻池。","经涉萑泽，","为失所射，","伤我胸臆。"],["一对野鸭高飞旋，","欲回池塘稻田间。","经过芦苇沼泽地，","不幸遇箭射身端，","使我胸膛遭伤残。"]],[["谩诞不诚，","倍梁灭文。","许人卖牛，","三夫争之。","失利后时，","公孙怀忧。"],["狂妄无礼心不诚，","背弃梁国绝文孙。","许国之人去卖牛，","三男争吵无止休。","王孙迟到误时机，","未能得利怀忧愁。"]],[["南国饥凶，","民食糟糠。","少子困捕，","利无所得。"],["南方发生大灾荒，","百姓充饥靠吃糠。","儿子被捕从牢房，","利益福禄全跑光。"]],[["狗吠非主，","狼虎夜扰。","惊我东西，","不为家咎。"],["家狗狂吠咬外人，","狼虎深夜来横行。","惊动左邻和右舍，","我家免灾走好运。"]],[["望龙无目，","不见手足。","入水求玉，","失其所欲。"],["眼瞎难望海底龙，","自己手脚看不清。","进入水中寻宝玉，","愿望落空事不成。"]],[["以鹿为马，","欺误其主。","闻言不信，","三口为咎；","黄龙三子，","中乐不殆。"],["指鹿为马心不诚，","谎言谬语欺主人。","道听途说不可信，","众口妄言造灾凶；","黄龙生育三贵子，","没有悲愁乐无穷。"]],[["养幼新婚，","未能出门。","登宋望齐，","不见太师。"],["养育女儿长成人，","新婚出嫁未能成。","登上宋城望齐国，","不见太师之踪影。"]],[["王孙季子，","相与为友。","明允笃诚，","升擢荐举。"],["豪门公子和王孙，","相遇结为好亲朋。","聪明公允又诚实，","推荐选举得提升。"]],[["山水暴怒，","坏梁折柱。","稽难行旅，","流连愁苦。"],["山洪狂奔大暴怒，","冲破桥梁和屋柱。","出行人儿入困境，","徘徊流连甚愁苦。"]],[["鹯鸠徙巢，","西至平州。","遭逢雷电，","碎我苇芦。","室家饥寒，","思吾故初。"],["鹯鸠鸟儿迁其居，","向西飞到平州府。","不幸逢雷遭袭击，","苇巢损坏无居处。","家中忍饥又受寒，","思念当初之故土。"]],[["登高伤轴，","上坡弃粟。","贩盐不利，","买牛折角。"],["登高爬山伤车轴，","上坡途中失粮谷。","贩盐利益未得到，","买来之牛折了角。"]],[["祝王孙，","能事鬼神。","节用绥民，","卫国以存。","飨我旨酒，","眉寿多年。"],["男巫氏之子孙，","能使鬼神从其命。","节约有度安民心，","保卫国土永安存。","享我美食与美酒，","保我健康寿如松。"]],[["九里十山，","道却峻难。","牛马不前，","复返来还。"],["九里路程十座山，","道路迂回甚艰难。","牛马不能驰向前，","行进途中又返还。"]],[["枯树不花，","空渊无鱼。","旧鸟飞翔，","利弃我去。"],["干枯之树不开花，","池塘空空无鱼虾。","鸟儿高飞远离去，","大利弃我去别家。"]],[["雄狐绥绥，","登山崔嵬。","昭告显功，","大福允兴。"],["巍巍南山高又大，","雄狐步子慢慢跨。","帝王向天报功德，","大福从天而降下。"]],[["哑哑笑喜，","相与饮酒。","长乐行觞，","千秋起舞，","拜受大福。"],["哑哑欢言又笑语，","痛饮欢聚在一起。","快乐举杯相庆贺，","千年欢歌把舞起，","恭敬接受大福利。"]],[["大椎破毂，","长舌乱国。","床笫之言，","三世不安。"],["捶击使那车儿破，","长舌谗言扰乱国。","妇人枕边吹阴风，","子孙三世不安乐。"]],[["男女合室，","二姓同食。","婚姻孔云，","宜我孝孙。"],["男女和合为一户，","两位异姓同吃住。","结婚联姻甚美满，","多子多孙又多福。"]],[["千仞之墙，","祸不入门。","金笼铁疏，","利以辟兵；","欲南上阪，","轴方不转，","还车复反。"],["大墙坚固逾千丈，","灾祸不会入庭堂。","金品铁器做屏障，","居之利以避兵荒；","想要爬坡上南山，","车轴受损难运转，","中途驱车又回还。"]],[["华言风语，","自相诖误。","终无凶事，","安宁如故。"],["流言蜚语若轻信，","连累自己坏事情。","最终平稳又安宁，","凶灾祸患不临门。"]],[["泛泛柏舟，","流行不休。","耿耿寤寐，","心怀大忧。","仁不遇时，","退隐穿居。"],["浮荡着的柏木舟，","随着河水任漂流。","焦虑不安难成眠，","痛苦忧伤涌心头。","仁人未逢好时机，","伏匿隐居把穷受。"]],[["大尾小头，","重不可摇。","上弱下强，","阴制其雄。"],["尾巴大大脑袋小，","沉重异常不可摇。","上面软弱下边强，","阴气强盛控制阳。"]],[["一身三口，","语无所主。","东西南北，","迷惑失道。"],["一个身子三张口，","语无伦次猜不透。","东西南北辨不清，","迷惑失道误旅人。"]],[["雌单独居，","归其本巢。","毛羽憔悴，","志如死灰。"],["雌鸟孤独甚苦悲，","朝着旧室而返回。","羽毛失去其光泽，","心志消沉如死灰。"]],[["南行求福，","与喜相得。","封受上赏，","鼎足辅国。"],["徒步南行去求福，","喜事与我正相遇。","受封得到上等奖，","荣升重臣辅国邦。"]],[["过时不归，","雌雄苦悲。","徘徊外国，","与母分离。"],["过时不见儿回归，","老父老母心苦悲。","长期徘徊在外地，","与我慈母远分离。"]],[["尧舜在国，","阴阳和得。","涿聚衣裳，","晋人无殃。"],["尧舜坐镇治理国，","举国上下都和谐。","衣冠禽兽行坏事，","晋人侥幸免灾祸。"]],[["周成之隆，","越裳夷通。","疾病多祟，","鬼哭其公。","狼子野心，","宿客不同。"],["周公成王世兴隆，","越裳路途甚平通。","疾病作祟困扰人，","魔鬼哭泣呼主公。","恶人如狼而横行，","旅人住宿各不同。"]],[["申酉脱服，","牛马休息。","君子以安，","劳者得欢。"],["申时酉时解劳役，","牛儿马儿得休息。","好人平顺安度日，","劳苦之人得欢娱。"]],[["凯风无母，","何恃何怙！","幼孤弱子，","为人所苦。"],["南风劲吹无母爱，","还有什么可依赖！","孤苦伶仃弱孩童，","替人劳役当苦差。"]],[["出门上堂，","从容牖房，","不失其常；","天牢地户，","劳者忧苦。"],["出了狱门走上堂，","态度从容坐牢房，","君子大度不失常；","天牢地狱穷人室，","劳苦之人有忧伤。"]],[["天厌周德，","命与南国。","以礼静民，","兵革休息。"],["天下饱受周之德，","恩泽施于南方国。","以礼安抚老百姓，","兵器不用无战祸。"]],[["堂桑折冲，","佐斗者伤。","暴臣失国，","良臣被殃。"],["桑树枝折叶儿落，","助战之士受伤挫。","暴臣作乱失了国，","忠谏之臣遭灾祸。"]],[["合欢之国，","嘉喜我福。","东岳西山，","朝齐成恩。"],["和谐欢乐之国度，","使我获得喜和福。","从那东岳到西山，","清晨彩虹化甘露。"]],[["耕石不生，","弃礼无名。","缝衣失针，","襦裤不成。"],["石山耕种禾难生，","抛弃礼仪无功名。","缝衣丢了针和线，","衣服裤子做不成。"]],[["聋瞢暗盲，","跛倚不行，","坐尸争骸。","身被火灾，","困其多忧。"],["耳聋眼瞎理不明，","瘸子靠墙难走行，","犹如坐尸不中用。","遇上火灾焚其身，","处境艰难凶重重。"]],[["生长太平，","仁政流行。","四方归德，","社稷康荣。"],["出生成长都太平，","仁政德政广流行。","四方归顺德之邦，","国家安康又繁荣。"]],[["桀跖并处，","民人愁苦。","拥兵荷粮，","战于齐鲁；","合卺同牢，","姬姜并居。"],["夏桀盗跖聚一处，","人民百姓受饥苦。","带着兵器找着粮，","战于东方齐与鲁；","新婚夫妻同进食，","姬姜两姓合家居。"]],[["南与凶居，","破车失襦。","西行无裤，","亡其宝赂。"],["向南与凶相逢合，","丢了衣服弄破车。","西行没有裤子穿，","宝贝财物远离我。"]],[["空槽注器，","豚彘不至。","张弓祝鸡，","雄父飞去。"],["槽中空空敲击器，","大猪小猪不临至。","张开弓箭呼唤鸡，","公鸡展翅飞离去。"]],[["望尚阿衡，","太宰周公。","藩屏汤武，","立为王侯。"],["姜尚阿衡真贤明，","太宰周公辅朝政。","辅卫商汤周武王，","建功立业把侯封。"]],[["朝鲜之地，","箕子所保。","宜家宜人，","业处子孙。"],["朝鲜是个好地方，","箕子封此镇边疆。","适合安家居住人，","事业发达子孙昌。"]],[["息忧解笑，","故贫今富。","载乐履善，","与福俱遇。"],["去了愁容换笑貌，","贫困日子又转好。","长久欢乐行善事，","幸福生活早来到。"]],[["叔迎伯兄，","遇巷在阳。","君子季姬，","并坐鼓簧。"],["弟弟出门迎兄长，","相遇在那巷之阳。","小伙和那小姑娘，","并排坐着吹笙簧。"]],[["顺风纵火，","芝艾俱死。","三害集房，","十子中伤。"],["顺风放火火势旺，","荻芝艾草都烧光。","三害聚集同一房，","十子全都遭中伤。"]],[["驾车入里，","求鲜鲂鲤。","非其肆居，","自令失市；","君子所在，","安无危殆。"],["驾起车儿回乡里，","去寻鲂鱼和鲤鱼。","并非贩卖鱼儿地，","自认倒霉未得利；","好人居处是圣地，","没有危险和灾异。"]],[["拔剑伤手，","见敌不起。","良臣无佐，","困辱为咎。"],["拔出宝剑划伤手，","面对敌人难搏斗。","忠臣良将无人助，","忍辱受困蒙耻羞。"]],[["乱君之门，","佐斗伤跟。","营私贪禄，","身为悔残。","东下泰山，","见我所欣。"],["作乱于君主之门，","助战者伤了脚跟。","为私利贪禄争讼，","落得个身残悔恨。","向东方走下泰山，","见到了我的亲人。"]],[["慈母望子，","遥思不已。","久客外野，","使我心苦。"],["慈祥母亲盼儿子，","常常思念无休止。","长期在外服劳役，","使我由衷生悲凄。"]],[["鲂生淮郤，","一转为百。","周流四海，","无有患恶。"],["鲂鱼生在淮河里，","转眼繁殖百个子。","周流游荡四海中，","没有祸患无灾异。"]],[["甘露醴泉，","太平机关。","仁德感应，","岁乐民安。"],["甘美泉水涓涓流，","天下太平好兆头。","仁义道德相感应，","百姓安乐无忧愁。"]],[["采薇出车，","鱼丽思初。","上下役急，","君子免忧。"],["艰苦戍役采豆食，","庆功宴上思当时。","上下一心齐协力，","将士欢乐免忧虑。"]],[["豕生鱼鲂，","鼠舞庭堂。","雄佞施毒，","上下昏荒，","君失其邦。"],["小猪生出一条鱼，","老鼠起舞庭堂里。","奸佞之人施毒计，","朝廷上下如暗室，","君主失国丧权力。"]],[["三头六目，","道畏难宿。","寒苦之国，","利不可得。"],["三个脑袋六只眼，","中途住宿有危险。","贫寒困苦之国度，","没有利益可图谋。"]],[["燕雀衔茅，","以生孚乳。","昆弟六人，","姣好孝悌。","各同心愿，","和悦相乐。"],["燕雀衔草来筑室，","准备孵卵生儿子。","兄弟一共六个人，","和睦相处在一起。","群旅心愿都相同，","和谐幸福甚欢娱。"]],[["文君之德，","仁义致福。","年无胎夭，","国富民实。","君子在室，","曾累益息。"],["文王盛积恩与德，","性情和善招福泽。","顺逆如意好年成，","国家富强民康乐。","高尚之人得安居，","子孙繁衍多又多。"]],[["秋梁未成，","无以至陈。","水深难涉，","使我不前。"],["秋天桥梁未建成，","前往陈国路不通。","水深流急难渡涉，","使我不能向前行。"]]],[[["登墀踒足，","南行折角。","长夜之室，","不逢忠直。"],["攀登台阶跌踒脚，","向南进行折了角。","在那黑暗的地方，","正直好人碰不上。"]],[["燕雀衰老，","悲鸣大海。","忧不在饰，","差池其羽。","颉颃上下，","寡位独处。"],["燕雀衰老力不支，","悲哀鸣叫入海域。","心忧不再修其羽，","羽毛参差不整齐。","上上下下飞不停，","孤单行动独自居。"]],[["开门除忧，","伯自外来。","忉忉无患，","我心得欢。"],["打开门儿除忧患，","大哥自外把家还。","焦虑之情得解脱，","使我快乐心中欢。"]],[["郊耕释耜，","有所疑止，","空虚无子。"],["郊外欲耕又止耜，","内心之中有所疑，","担心种子空无籽。"]],[["张牙切齿，","怒相视。","祸起萧墙，","牵引吾子。","患不可解，","忧惊吾母。"],["咬牙切齿恨之极，","四目相对怒相视。","祸乱发生在内部，","牵扯连累我儿子。","互不相让患难解，","母亲受惊生忧虑。"]],[["履不容足，","南山多棘。","毋出房闺，","乃无病疾。"],["小小鞋儿难容足，","南山之上多枳棘。","不要随意出家门，","保君不会招病疾。"]],[["牛骍无子，","鸣于大野。","申后阴微，","还归其母。"],["红牛失犊甚痛心，","成日鸣于荒野中。","午后日头偏西行，","小牛投归母怀中。"]],[["龙生于渊，","因风升天。","章虎炳文，","为禽败轩。","发温谷，","暮宿昆仑。","终身无患，","光精照耀，","不被祸难。"],["巨龙生长在深渊，","乘着风儿飞上天。","大人变革如虎纹，","前往打猎车伤残。","轻装出发于温谷，","晚上住在昆仑山。","一身没有祸临至，","光辉高照甚灿烂，","不会遭逢灾与难。"]],[["既嫁宜吉，","出入无咎。","三圣并居，","国安无灾。"],["嫁女应选好日子，","男娶女嫁无过失。","三位圣人同在堂，","国家安全无灾异。"]],[["北陆阳伏，","不知白黑。","君子伤谗，","正害善人。"],["北陆星寒日潜藏，","难分黑白暗无光。","好人受到谗言害，","仁智贤士被栽赃。"]],[["一身两头，","近适二家，","乱不可治。"],["两头长在同一身，","犹如不同两个人，","混乱不能治根本。"]],[["牝马牡驹，","岁字不休。","君子衣服，","利得有余。"],["母生和育小公驹，","年年繁殖不停息。","男儿着衣修德行，","多得大利有盈余。"]],[["南行怀忧，","破其金舆。","安坐故庐，","乃无灾患。"],["向南出行有忧祸，","中途毁坏其金车。","安然静坐原家宅，","没有灾患来找我。"]],[["忧人之患，","履伤浮愿，","为身祸残。","笃心自守，","与喜相抱。"],["忧虑别人之祸患，","愿望屡屡难实现，","自身反而遭摧残。","诚心诚意自安守，","与喜相迎心常欢。"]],[["咸阳辰巳，","长安戌亥。","丘陵生心，","非鱼鳅市。","可以避水，","终无凶咎。"],["迎着朝霞出咸阳，","披着晚霞抵西安。","丘陵之上生疑心，","并非鱼市鳅难贩。","能够避开水之患，","终归无凶无灾难。"]],[["不知何孙，","夜来扣门。","我慎外寝，","兵戎且来。"],["不知谁家坏儿孙，","夜半前来敲我门。","提心吊胆睡在外，","谨之慎之防刀兵。"]],[["昧旦不明，","日暗无光。","丧灭失常，","使我心伤。"],["清晨出门不见光，","太阳暗淡不明亮。","丧失平常之模样，","使我心中好悲伤。"]],[["江阴水侧，","舟楫破乏。","狐不得南，","豹无以北。","虽欲会盟，","河水绝梁。"],["长江南岸水旁边，","船少桨短又破残。","豹子无法往北行，","狐狸不得去南面。","虽然希望能会同，","桥梁断绝水阻拦。"]],[["神之在丑，","破逆为咎。","不利西南，","商人休止。"],["丑神保佑在东北，","逆道而行生灾祸。","不利西南去求利，","商人留止家中歇。"]],[["然诺不行，","欺天误人。","使我露宿，","夜归温室。","神怒不直，","鬼击其目。","欲求福利，","适反自贼。"],["许下诺言不践行，","欺上瞒下蒙骗人。","使我室外露天住，","深夜才回暖房中。","神灵怒君不正直，","恶鬼敲击其眼睛。","本来希望寻福利，","适得其反害自身。"]],[["攘臂极肘，","怒不可止。","狼戾愎佷，","无与为市。"],["伸出胳膊挽起袖，","憎恨愤怒不可收。","心肠狠毒性残暴，","不要和他打交道。"]],[["贩马卖牛，","会值空虚。","利得鲜少，","流连为忧。"],["贩马卖牛做生意，","恰又正值货空虚。","与利无缘获得少，","徘徊不安心忧虑。"]],[["高楼陆处，","以避风雨。","深室邃宇，","君安其所。","牝鸡之晨，","为我利福，","请求弗得。"],["住在高楼大院中，","利于躲雨又避风。","深居庭堂屋宇内，","君主不理其朝政。","母鸡啼叫报时晨，","使我谋利难成功，","百般请求皆落空。"]],[["阿衡服箱，","太乙载行。","巡时历舍，","所之吉昌。"],["阿衡驾着大车箱，","太乙乘坐行天上。","沿着天体而运行，","所到之处皆吉祥。"]],[["飞来之福，","入我嘉室，","以安吾国。"],["预料之外飞来福，","降临我的华贵屋，","以此来安我国土。"]],[["不孝之患，","子孙为残。","老耄莫养，","独坐空垣。"],["不讲孝道起祸患，","父母被子所伤残。","年老没人去赡养，","孤苦伶仃倚墙垣。"]],[["南过棘门，","钩裂我冠。","断衣伤襦，","使君恨忧。"],["向南走过荆棘门，","挂破帽子路难行。","衣服裤子被损坏，","令人忧恨又痛心。"]],[["重弋射隼，","不知所定。","质疑蓍龟：","孰可避之？","明神答报，","告以牺牲，","宜利止居。"],["带绳之箭射猛禽，","方位始终难确定。","决疑占卜问神灵：","何以能避灾与凶？","圣明之神指教我，","祷告祭祀用大牲，","居之方能得安宁。"]],[["麟麑凤雏，","安乐无忧。","捕鱼河海，","利逾徙居。"],["麒麟小鹿和雏凤，","快乐无忧真安宁。","河海捕鱼盈利多，","胜过颠沛流离人。"]],[["新田宜粟，","上农得谷。","君子怀德，","以干百禄。"],["新田适合种谷子，","农民收获多粮食。","大人修身以怀德，","靠此获得百倍利。"]],[["簪短带长，","幽思苦穷。","瘠蠡小瘦，","以病之癃。"],["簪子短短衣带长，","处境困苦心悲伤。","体弱多病渐消瘦，","身患重疾入膏肓。"]],[["黄帝所生，","伏羲之宇。","兵刀不至，","利以居止。"],["轩辕黄帝子孙们，","住在伏羲的家中。","战事不会来这里，","居之长久享安宁。"]],[["争讼之门，","不可与邻。","出入有为，","忧生我心。"],["争讼不休那有人，","不可与之做近邻。","来去出入有企图，","忧患从我心中生。"]],[["朽根枯株，","不生肌肤。","病在心腹，","日以焦枯。"],["腐朽干枯之树木，","不能生出新皮肤。","疾病患于心腹内，","逐日劳悴渐憔枯。"]],[["雨师娶妇，","黄岩季子。","成礼既婚，","相呼南去。","润泽田野，","年岁大喜。"],["雨师娶来新媳妇，","她是黄岩小女子。","举行礼仪既成婚，","相约到那南方去。","甘露滋润田野里，","年岁丰收有大喜。"]],[["冬采薇兰，","地冻坚难。","利走室北，","暮无所得。"],["寒冬腊月采薇兰，","天寒地冻甚艰难。","利益弃我去家北，","直到天黑无所得。"]],[["昧之东域，","误过虎邑。","失我熊胔，","饥无所食。"],["天黑之时去东域，","误入恶虎潜伏地。","丢失我的熊掌肉，","饥肠辘辘无所食。"]],[["日暮闭目，","随阳休息。","箕子以之，","乃受其福。","举首多言，","必为悔残。"],["夜来闭目养精神，","太阳休息我修身。","贤人箕子照此做，","福喜一起都降临。","遇事昂首多闲言，","身心必将受摧残。"]],[["蓼萧瀼瀼，","君子龙光。","鸣鸾雍雍，","福禄来同。"],["雨露滋润香蒿壮，","天子身上显宠光。","鸾铃声儿叮当响，","幸福利禄同登堂。"]],[["鸟尽无翼，","兔走折足。","虽不会同，","未得医工。"],["鸟儿欲飞无翅膀，","兔行路上脚跌伤。","双双远离难会同，","徒劳求医枉费神。"]],[["五胜相贼，","火得水息。","精光消灭，","绝不能续。"],["五行相克相残杀，","大水送火回老家。","精气光明消耗尽，","灭绝不能照天下。"]],[["东资齐鲁，","得骍大马。","便辟能言，","巧贾善市；","八邻併户，","请火不与。","人道闭塞，","鬼守其宇。"],["持币东至齐鲁国，","买得红色大骏马。","能言巧语善辩解，","生意场上收获佳；","八方街邻紧闭门，","乞求火种不给他。","人际之道不畅通，","犹如恶鬼守其家。"]],[["争鸡失羊，","亡其金囊，","利不得长。","陈蔡之患，","赖楚以安。"],["互相争鸡反失羊，","且又丢失钱财囊，","虽然得利却不长。","孔子陈蔡遇患难，","依赖楚国得平安。"]],[["九登十陟，","马跌不前。","管子佐之，","乃能上山。"],["屡屡攀登上山丘，","疲马跌跤难行走。","贤人管仲来辅佑，","终能登上那山头。"]],[["东邻愁苦，","君乱天纪。","日贪禄宠，","必受其咎。"],["东邻一副愁苦样，","乃是国君乱天常。","贪禄贪宠无节制，","必然自受其灾殃。"]],[["三狸捕鼠，","遮遏前后。","死于环城，","不能脱走。"],["三只野猫捕老鼠，","前面截来后面堵。","死于环形城域内，","终竟不能逃脱出。"]],[["虎狼争强，","礼义不行。","兼吞其国，","齐鲁无王。"],["猛虎恶狼相争强，","礼义不能得推广。","秦国兼并弱小国，","齐国鲁国无君王。"]],[["五岳四渎，","合润为德。","行不失理，","民赖恩福。"],["五座名山四条河，","共同滋润施恩德。","行为不失其常理，","百姓赖此享恩泽。"]],[["六月种黍，","岁晚无雨。","秋不宿酒，","神失其所；","先困后通，","与福相从。"],["农历六月种糜子，","季节太迟不降雨。","秋无收获难酿酒，","神灵在位无祭祀；","初受困窘后亨通，","终与福禄喜相逢。"]],[["牝龙身，","日驭三千。","南上苍梧，","与福为婚。","道里夷易，","身安无患。"],["母马高大如龙体，","一日可行三千里。","南上来到苍梧山，","喜与幸福结良缘。","山道虽远路平坦，","能保人畜都平安。"]],[["出入休居，","安止无忧。","上室之欢，","虎为季残。"],["出入休息居家室，","太平安危无忧虑。","上等室屋得欢乐，","阳虎败于季孙氏。"]],[["南山昊天，","刺政闵身。","疾病无辜，","背憎为仇。"],["南山高峻天不公，","讥讽朝政怜自身。","悲哀同情无辜者，","反目相憎成仇人。"]],[["苍耳东从，","道顿跂踦。","日辰不良，","病为祟祸。"],["骑乘马儿驰向东，","道路崎岖难行进。","没有赶上好时辰，","疾病缠身来作梗。"]],[["兄征东燕，","弟伐辽西。","大克胜还，","封君河间。"],["哥哥前去征东燕，","弟伐辽西已回还。","大胜之后凯旋归，","封为邦君治河间。"]],[["播轮折辐，","马不得行。","竖牛之谗，","贼其父兄。","布衣不伤，","终身无患。"],["车轮离散辐条折，","驾车之马行不得。","僮仆竖牛是谗人，","谋权争嫡害父兄。","竖牛若是布衣民，","穆子终身无灾凶。"]],[["驾之南海，","晨夜不止。","君子劳罢，","仆夫憔苦。"],["驾车向那南海行，","日夜兼程不歇停。","主人劳苦甚疲惫，","仆从满脸憔悴容。"]],[["怨虱烧被，","忿怒生祸。","褊心作难，","意如为乱。"],["讨厌虱子烧被子，","仇恨愤怒生灾异。","心胸狭窄造患难，","季氏逼公出奔齐。"]],[["张狂妄行，","窃食盗粮。","狗吠非主，","啮伤我足。"],["狂妄行事太嚣张，","偷窃食粮又盗粮。","家狗狂叫吠外贼，","我的脚儿被咬伤。"]],[["警跸戒道，","先驱除咎。","王后亲桑，","以率群功，","安我祖宗。"],["君王派兵来戒严，","先驱卫队除隐患。","王后出宫采桑蚕，","带领女工去纺线，","使我祖宗得平安。"]],[["门户乏食，","困死谁告？","对门不通，","安所归急。","积藏五谷，","一花千叶，","市贾有息。"],["家贫如洗无衣食，","困苦向谁去倾诉？","对门街坊不帮助，","纵使焦急无去处。","安下心儿藏五谷，","花叶果实多积蓄，","市场出售有利图。"]],[["破敝复完，","危者得安，","乡善无患。","商人有息，","利来入门。"],["镜子摔破重复圆，","危难之人又得安，","多行善事无忧患。","行商坐贾走正道，","自有利来入门槛。"]],[["叠叠累累，","如岐之室。","一息十子，","古公治邑。"],["重重叠叠丘陵密，","岐山之下修屋宇。","一人生育十个子，","古公亶父治城邑。"]],[["三妪治民，","不胜其任。","两马争车，","败坏家室。"],["三个老妇掌国政，","不胜肩负此重任。","两马争拉一辆车，","败坏室家之门庭。"]],[["蔽镜无光，","不见文章。","少女不市，","弃于相望。"],["锈斑蚀镜失其光，","不见色彩花纹样。","少女不视其为宝，","将它弃之不相望。"]]],[[["软弱无辅，","不能自理。","意在外野，","心怀劳苦；","虽忧无殆。"],["本身软弱无辅弼，","日常生活难自理。","意念经常飞远方，","心思沉重怀顾虑；","虽有忧愁无灾异。"]],[["周成之隆，","刑措无凶。","太宰赞佑，","君子作仁。"],["西周王朝真鼎盛，","刑法废置不使用。","太宰周公来辅佐，","君王兴德又崇仁。"]],[["穴有孤乌，","坎生虾蟆。","象去万里，","不可得捕。"],["穴中孤独一乌鸦，","水坑里面产虾蟆。","大象驰骋万里外，","没有办法捕捉它。"]],[["俱为天民，","云过吾西。","伯氏嫉妒，","与我无恩。"],["同时天下劳苦人，","盼雨不降云西行。","大哥为此生嫉妒，","天神给我不赐恩。"]],[["三首六目，","政多烦惑。","皋陶瘖聋，","乱不可从。"],["三个脑袋六中眼，","政出多门头绪乱。","刑官皋陶哑又聋，","上下混乱不可从。"]],[["德积不轻，","辞王钓耕。","三媒不已，","大福来成。"],["多积恩德威望重，","辞别君王去钓耕。","再三派人去聘请，","福禄终于都来临。"]],[["坚固相亲，","日笃无患。","六体不易，","执以安全。","雨师驾西，","濡我毂轮。","张伯李季，","各坐关门。"],["如漆似胶甚亲近，","情深意笃无祸凶。","六爻不变其位置，","得以安全又平顺。","雨师前来助我兴，","滋润西征之车轮。","张家大哥李家弟，","各自坐镇守关门。"]],[["方内不行，","辐摧轮伤。","马楚踶甚，","受子闵时。"],["轴方车子难转动，","断折辐条坏车轮。","马儿痛楚胡乱踢，","寿子怜悯其长兄。"]],[["畜牝无驹，","养鸡不雏。","群羊三岁，","不生两头。"],["饲养母马不产驹，","母鸡亦不孵小鸡。","群羊放牧已三年，","羊羔没有生两只。"]],[["老耄罢极，","无取中置。","悬舆致仁，","得归乡里。"],["老年为官太疲倦，","放弃正直多坦然。","挂起车子辞掉官，","退休回乡度晚年。"]],[["缩绪乱丝，","手与为灾。","越亩逐兔，","断其裈襦。"],["欲将乱丝理头绪，","手忙脚乱干着急。","跨过田野去追兔，","挂破短袄和裤子。"]],[["海老水干，","鱼鳖萧索。","藁落无润，","独有沙石。"],["大海衰老水枯干，","鱼鳖消失都不见。","草木凋零无润泽，","放眼一片沙石滩。"]],[["入市求鹿，","不见头足。","终日至夜，","竟无所得。"],["进入闹市去捕鹿，","不见鹿头和鹿足。","从早一直到天黑，","竟然空空无收获。"]],[["筑有壅户，","虎卧当道。","惊我骅骝，","不利出处。"],["老虎卧在路中央，","家人出入不通畅。","惊跑我的枣红马，","不利出门去经商。"]],[["陶朱白圭，","善贾息资。","公子王孙，","富贵不贫。"],["商人陶朱与白圭，","善做生意利百倍。","公子王孙学习他，","一生荣华多富贵。"]],[["王良善御，","伯乐知马。","周旋步骤，","行中规矩。","止息有节，","延命寿考。"],["王良善于驾驭车，","相马之人属伯乐。","御马之术甚精通，","使其安分守规则。","劳逸结合相调节，","益寿延年不夭折。"]],[["尧问尹寿，","圣德增益。","使民不惧，","安无悚惕。"],["尧向尹寿去请教，","德行修养日益高。","黎民百姓不畏惧，","安然无恙担忧少。"]],[["昭公失堂，","季氏悖狂。","逊齐处郓，","丧其宠身。"],["昭公统治失其常，","季氏势力很猖狂。","逃往齐军郓城地，","丧失尊宠和荣光。"]],[["昏暮不行，","候旦待明。","复住止后，","未得相从。"],["太阳落山即止行，","留宿等待日复明。","伴侣滞后未来住，","使君没有随从人。"]],[["安上宜官，","一日九迁。","升擢超等，","牧养常山。"],["安慰上司好做官，","一日九次得升迁。","升擢提拔超等级，","犹如田氏治常山。"]],[["去恶就凶，","东西多讼，","行者无功。"],["想避邪恶遇大凶，","东奔西走多诉讼，","行者徒劳白费功。"]],[["老马垂耳，","不见百里。","君子弗恃，","商人莫取，","无与为市。"],["老马垂耳甚疲惫，","行走不过一百里。","大人出行难骑乘，","商人买它不得利，","市场出售难交易。"]],[["蜗螺生子，","深目黑丑，","似类其母。","虽或相就，","众人莫取。"],["细腰土蜂生姑娘，","眼睛深凹丑模样，","犹如它那丑老娘。","纵使主动觅婆家，","没人愿意来娶它。"]],[["百足俱行，","相辅为强。","三圣翼事，","王室宠光。"],["百只脚儿行路忙，","相辅相助力量强。","三位圣人佐朝政，","君王宫廷显荣光。"]],[["容民畜众，","履德有信，","大人受福。","童蒙忧惑，","利无所得。"],["接纳抚育老百姓，","行施仁德守信用，","为官之人福禄丰。","孩童忧虑又困惑，","利益弃我而远行。"]],[["左跌右僵，","前踬触桑，","其指据石，","伤其弟兄。","老蚕不作，","家无织帛。","贵货贱身，","流连久客。"],["东倒西歪身发僵，","前行撞到桑树上，","手指触在乱石中，","五个指头全折伤。","老蚕不能再吐丝，","家无织物难做裳。","重视财物轻视人，","长久流连居他乡。"]],[["昏人旦明，","卖食老昌。","国祚东表，","号称太公。"],["黑夜行人盼光明，","朝歌卖饭谋生存。","坐镇东方治齐国，","后人称他姜太公。"]],[["敞笱在梁，","鲂逸不禁。","渔父劳苦，","焦喉干口，","虚空无有。"],["破笼撂在鱼梁上，","鲂鱼逃离心不慌。","捕鱼人儿多劳苦，","口干舌燥可怜样，","两手空空回家乡。"]],[["盛中后跌，","衰老复掇，","盈满减毁，","疾赢肥腯。","郑昭失国，","重耳兴立。"],["兴盛过度遭跌倾，","衰老转而又回春，","盈满之极变亏损，","染疾瘦弱化强盛。","郑昭公失了国，","公子重耳得复兴。"]],[["折亡破瓮，","使我贫困。","与母生分，","别离异门。"],["瓦瓮破损水难盛，","使我家中很贫穷。","与母分居难见面，","亲人远离处异门。"]],[["野有积庾，","啬人驾取。","不逢虎狼，","暮归其宇。"],["露天谷仓装满粮，","农夫驾车运输忙。","没有遇上贼与寇，","傍晚顺利回家乡。"]],[["襁褓孩呱，","冠带成家。","出门如宾，","父母何忧。"],["襁褓婴儿叫哇哇，","转眼戴冠成了家。","出门如宾懂礼仪，","父母勿忧勿牵挂。"]],[["三涂五岳，","阳城太室。","神明所保。","独无兵革。"],["巍巍三涂五岳山，","阳城太室入云间。","上天神灵所保佑，","没有战事来作难。"]],[["陈力就列，","官职并废。","手不胜盆，","失其宠门。"],["费尽气力争官位，","官职实权一并废。","行贿财物不够多，","失去信任力白费。"]],[["积雪大寒，","万物不生。","阴制庶士，","时本冬贫。"],["积雪冰封天气寒，","万物受冻生长难。","阴冷挟制贫寒士，","犹如草木生冬天。"]],[["龙斗时门，","失理伤贤。","内畔生贼，","自为心疾。"],["两龙争斗于时门，","丧失天理伤贤人。","内出叛徒生贼臣，","使我痛心难容忍。"]],[["犬畏猛虎，","依人为辅。","三夫执戟，","伏不敢起，","身安无咎。"],["猎狗胆怯怕猛虎，","依靠主人来协助。","三位武夫执大戟，","恶虎潜伏难举步，","狗儿安然无事故。"]],[["南山高冈，","回难登。","道路辽远，","行者无功。","忧不成凶，","恶亦消去。"],["南面那座土石山，","起伏连绵难登攀。","所致路途很遥远，","行进之人有危难。","忧虑最终未成灾，","邪恶势力都消散。"]],[["逢时阳遂，","富且尊贵。"],["恰逢时运阳气旺，","升官发财多荣光。"]],[["求我所欲，","得其利福，","终身不辱；","盈盛之门，","高屋先履，","君失邦国。"],["德高之人求所欲，","幸福利益皆获取，","终生不会受屈辱；","倚仗权势得兴盛，","犹如高屋先覆倾，","君失国家失民心。"]],[["安坐至暮，","祸灾不到。","利诘奸妖，","罪人不赦。"],["安然稳坐到傍晚，","没有祸患和灾难。","审问狡诈奸佞人，","罪犯不会得赦免。"]],[["胶车驾东，","与雨相逢。","五柔解堕，","顿辀独坐，","忧为身祸。"],["胶粘之车向东行，","雨儿使其受湿浸。","五束革带全坠落，","车坏主人独自坐，","内心忧伤有身祸。"]],[["择日高飞，","遂至东齐。","见孔圣师，","使我和谐。"],["选择吉日高飞去，","到那东方齐国里。","拜见孔圣为导师，","使我和悦又满意。"]],[["陈妫敬仲，","兆兴齐姜。","乃适营丘，","八世大昌。"],["陈妫敬仲娶新娘，","占卜预兆兴齐姜。","于是到达营丘地，","子孙八代大盛昌。"]],[["缺埒无堳，","难从东西。","毁破我盆，","泛弃酒食。"],["地边矮墙被毁平，","祭祀之地遭水冲。","盆破酒食弃满地，","日子越过越贫穷。"]],[["中夜犬吠，","盗在庐外。","神光佐助，","消散归去。"],["半夜三更狗狂叫，","墙外隐藏有贼盗。","神灵保佑扶助我，","灾难祸患皆散消。"]],[["雷车不藏，","隐隐西行。","霖雨三旬，","流为河江，","使国忧凶。"],["雷神之车不隐藏，","轰轰相逐行西方。","雨降三旬不停止，","洪水流成大海洋，","使我国家遭灾殃。"]],[["老河空虚，","旧井无鱼，","利得不饶。","避患东邻，","祸来入门，","使我悔存。"],["老河空空没有水，","旧井干枯鱼不见，","得利无几是当然。","投奔东邻去避患，","祸患反来入门槛，","使我悔恨度日难。"]],[["福德之士，","欢悦日喜。","夷吾相国，","三归为臣，","贵流子孙。"],["福盛德高大贤人，","终日喜悦又欢欣。","管仲辅佐齐桓公，","市租三分归朝廷，","福禄流传至子孙。"]],[["清人高子，","久屯外野。","逍遥不归，","思我慈母。"],["高克率领清邑兵，","久居野外御敌军。","逍遥河上难返回，","思念我的老母亲。"]],[["骢驘黑鬛，","东归高乡。","白虎推轮，","苍龙把衡，","朱雀导引，","灵鸟载游。","远扣天门，","入见真君，","马全人安。"],["青色骏马长黑鬃，","东往高乡快步行。","白虎为其推车轮，","苍龙替它扶车衡，","朱雀在前作引导，","载着灵鸟同游巡。","远道而至登天门，","进入仙境见真君，","马儿安全人安宁。"]],[["路多枳棘，","前刺我足。","不利旅客，","为心作毒。"],["路途当中枳棘多，","我的双脚被刺破。","不利出门去远行，","乃是内心在作恶。"]],[["端坐生患，","忧来入门，","使我不安。"],["端端正正家中坐，","忧患入门来找我，","使我愁闷难安乐。"]],[["小陬之市，","利不足喜。","二世积仁，","蒙其祖先；","匪躬之言，","狂悖为患。"],["偏僻市场做生意，","获得小利不足喜。","父辈两代积仁德，","承蒙祖先来辅我；","危害身家性命言，","忤逆招来祸与患。"]],[["登高望时，","见乐无忧。","求利南国，","与宝相得。"],["登上高山望远方，","看到欢乐新景象。","前往南国谋福利，","心满意足得宝藏。"]],[["跛足息肩，","有所忌难。","金城铁廓，","以铜为关。","藩屏自卫，","安上无患。"],["跛脚先生歇歇肩，","担子沉重有危难。","铜墙铁壁护金城，","关口牢固难侵犯。","藩篱屏障自守卫，","君主在上很平安。"]],[["江水沱汜，","思附君子。","仲氏爰归，","不我肯顾，","姪娣悔恨。"],["江水分流又汇合，","思念丈夫求依托。","二姐已经嫁出门，","离去不肯照顾我，","陪嫁女子悔恨多。"]],[["芽蘖生达，","阳昌于外。","左手挚龠，","公言锡爵。"],["伐过之树生新芽，","阳气昌盛多通达。","左手握着笛儿吹，","君将美酒赐给他。"]],[["云梦苑囿，","万物繁炽。","犀象玳瑁，","荆人以富。"],["云梦大泽皇家苑，","花草树木多繁衍。","犀角象牙好饰品，","荆人生活多美满。"]],[["渠戎万里，","昼夜愁苦。","甲戎服，","虽荷不贼。","鹰鹯之殃，","害不能伤。"],["万里之外去远征，","昼夜忧愁心苦闷。","身佩盔甲穿戎装，","自身防卫有保障。","鹰鹯之辈来伤残，","灾害不能把君伤。"]],[["镃基逢时，","稷契皋陶。","贞良得愿，","微子解囚。","市恐无虎，","谩言妄语。"],["下锄耕作逢农时，","稷契皋陶同治世。","忠贞贤良获心愿，","微子获释出牢狱。","市人虚惊不见虎，","妄言谬语无实据。"]],[["骑骓与苍，","南贾太行。","逢猛虎，","为所吞殇，","葬于渭阳。"],["青马黑马奔跑忙，","骑它经商至太行。","路逢恶与猛虎，","马遭残伤都夭亡，","将它葬于渭水阳。"]],[["出门东行，","日利辰良。","步骑与驷，","经历宗邦。","暮宿北燕，","与乐相逢。"],["出门一路向东行，","时逢吉日逢良辰。","骑上骏马乘上车，","游历宗族之都城。","夜晚留宿在燕国，","与乐相逢很高兴。"]],[["酒为欢伯，","除忧来乐。","福善入门，","与君相索，","使我有得。"],["美酒是我欢乐哥，","除去忧虑带来乐。","福善双双入门槛，","与君共同去求索，","使我如愿把利得。"]]],[[["金齿铁牙，","寿考宜家。","年岁有储，","贪利者得，","离其咎忧。"],["长着金齿和铁牙，","健康长寿利于家。","年年丰收有储蓄，","善于经营收获大，","远离忧患和凶煞。"]],[["家给人足，","颂声并作。","四夷宾服，","干戈阁。"],["家家丰衣又足食，","到处欢歌颂上帝。","四方诸侯来进贡，","干戈藏至武库里。"]],[["猕猴冠带，","盗载非位。","众犬嘈吠，","狂走蹶足。"],["猴子穿衣又戴帽，","窃据官位被人笑。","一群猎狗冲它叫，","逃之夭夭踒伤脚。"]],[["心患其身，","不念安存。","患臣孝子，","为国除患。"],["甘愿为国献其身，","不顾安危与生存。","忠臣舍身而取义，","为国除患求安宁。"]],[["君不明德，","臣乱为惑。","丞相命马，","胡亥失所。"],["国君不明政与德，","臣下作乱把他惑。","赵高指鹿说是马，","胡亥失去皇帝座。"]],[["东行西穷，","南北无功。","张伯卖鹿，","从者失羊。"],["东来西去都贫穷，","南行北往皆无功。","张家大哥去卖鹿，","随人丢羊无处寻。"]],[["鹿下西山，","欲归其群。","逢羿锋箭，","死于矢端。"],["有只鹿儿跑下山，","朝着鹿群往回返。","碰上后羿张开弓，","无奈死于箭之端。"]],[["明夷兆初，","三日为灾。","以谗复归，","名曰竖牛。","剥乱叔孙，","馁卒虚丘。"],["明夷预兆有灾难，","三日之内入门槛。","穆子回国信谗言，","庶子竖牛欲夺权。","乘穆之危造事端，","叔孙一命丧黄泉。"]],[["秦失嘉居，","河伯为怪。","还其衔璧，","神怒不佑。","织组无文，","烧香不芬。"],["秦王失去好居所，","河神夜半拦使者。","中途退还御府璧，","发怒不再佑秦国。","所织组绶无文采，","香火遇风自然灭。"]],[["至德之君，","祸不过邻。","使我世存，","身无患灾。"],["道德高尚之圣君，","从不嫁祸于别人。","使我世代得保全，","自身没有灾与凶。"]],[["众恶之堂，","相聚为殃。","幽毒良人，","使道不通。"],["众恶所居坏地方，","相聚一堂造灾殃。","暗中毒害善良人，","使得道路不通畅。"]],[["三痴六狂，","欲之平乡。","迷惑失道，","不知昏明。"],["三人痴呆六人狂，","相约一同去平乡。","昏头转向入岔道，","不辨白天和晚上。"]],[["老弱无子，","不能自理。","郭氏虽忧，","终不离咎。"],["老来病弱又无子，","自己生活难料理。","郭氏虽然同情他，","最终难以解祸事。"]],[["褒后生蛇，","经老日微。","追跌衰耄，","酒灭黄离。"],["褒后生出一条蛇，","西周王朝渐衰落。","幽王年迈又昏庸，","中和之道被酒灭。"]],[["骢驘黑鬛，","东归高乡。","白虎推轮，","苍龙把衡。","遂至夷伤，","不离咎殃。"],["青色骏马黑鬃长，","驾它疾行回高乡。","白虎为它推车轮，","苍龙扶衡来相帮。","行进途中受创伤，","终究未能离祸殃。"]],[["信谲龙且，","塞水上流。","半渡决囊，","楚师覆亡。"],["韩信设计战龙且，","河之上游被堵塞。","半渡放水冲楚军，","敌人全都遭淹没。"]],[["有莘季女，","为王妃后。","贵夫寿子，","母字四海。"],["有莘氏的小姑娘，","做了后妃嫁给王。","丈夫尊贵子长寿，","母亲美名四海扬。"]],[["德被八表，","蛮夷率服。","蟊贼不作，","道无苛慝。"],["仁德普及八方民，","四夷纷纷来归顺。","国无坏人来作乱，","途中没有灾与凶。"]],[["载日精光，","骖驾六龙。","禄命彻天，","封为燕王。"],["乘着灿烂太阳光，","六龙驾车行天上。","福寿禄命如天高，","君子被封为燕王。"]],[["缨急缩颈，","行不得前。","五石示象，","襄霸不成。"],["缨带勒住马脖颈，","欲想前去难行进。","天陨五石兆头凶，","襄公霸业不得成。"]],[["蛇失其公，","戴麻当丧。","悲哀哭泣，","送死离乡。"],["蛇的父亲已死亡，","其子披麻来治丧。","悲哀哭泣多痛苦，","送别死者离故乡。"]],[["回不安，","兵革为患。","掠我妻子，","客屡饥寒。"],["疾病缠身心不安，","战争带来大灾难。","掠走我的妻和子，","寄居他乡受饥寒。"]],[["乘风驾雨，","与飞鸟俱。","一举千里，","见吾爱母。"],["乘着风儿驾着雨，","与那飞鸟俱升起。","一举行至千里外，","见到慈母多亲昵。"]],[["雷霆所击，","诛者五逆。","磨灭无迹，","有惧方息。"],["雷神震怒轰又击，","斩杀天下五叛逆。","消灭邪恶不留迹，","使我不再受畏惧。"]],[["张氏揖酒，","请谒左右。","平叔枯槁，","独不蒙所。"],["张负作揖让美酒，","敬请拜见其左右。","陈平一脸憔悴容，","独独不能来接受。"]],[["坐争立讼，","纷纷匈匈。","卒成祸乱，","灾及家公。"],["坐立不安起争讼，","是非曲直难辩清。","终于造成大祸患，","灾祸殃及老父亲。"]],[["霜降闭户，","蛰虫隐处。","不见日月，","与死为伍。"],["霜降时节闭门户，","越冬之虫土中伏。","太阳月亮都不见，","终日与死而为伍。"]],[["鼠聚生怪。","为我患悔。","道绝不通，","商旅失意。"],["老鼠群聚来作怪，","给我造成大祸害。","道路断绝难通行，","商人难以做买卖。"]],[["寒暑不当，","轨度失常。","一前一后，","年岁鲜有。"],["寒冷炎热不相当，","失了轨度不正常。","气候前后不一致，","年终收成很渺茫。"]],[["筑室水上，","危於一齿。","丑寅不徙，","辰巳有咎。"],["房屋建筑在水上，","情势危急很紧张。","凌晨若是不搬家，","上午就会有灾殃。"]],[["畜鸡养狗，","长息有储。","耕田得黍，","主母喜舞。"],["家中养狗又养鸡，","不断繁殖有储蓄。","田间耕作获糜子，","母亲起舞很欢喜。"]],[["东壁馀光，","数暗不明。","主母嫉妒，","乱我业事。"],["东壁二星透余光，","频频昏暗不明亮。","主母嫉妒又猖狂，","使我事业乱了章。"]],[["刚柔相伤，","火烂销金。","雕鹰制兔，","伐楚有功。"],["刚强柔弱两相争，","犹如烈火熔化金。","猛禽凶鹰捕小兔，","讨伐楚国立战功。"]],[["左有噬熊，","右有啮虎，","前触铁矛，","后踬强驽，","无可抵者。"],["向左行驰有恶熊，","右边猛虎来伤人，","前进撞在铁矛上，","后退途中逢强弓，","无法抵挡伤透心。"]],[["郑国谗多，","数被楚忧。","征夫愁苦，","民困无聊。"],["郑国屡屡遭谗言，","楚军数侵成祸患。","士卒忧愁又苦闷，","黎民困顿不聊生。"]],[["弓矢斯张，","把弹弦折。","丸发不至，","道遇害患。"],["张开弓箭欲发射，","弓儿强拉弦儿折。","弹丸未达目的地，","路上遇到灾与祸。"]],[["举觞饮酒，","未得至口。","侧弁醉酗，","拔剑斫怒，","武侯作悔。"],["幽王举杯狂烂饮，","不能到口醉醺醺。","歪戴帽子胡行凶，","拔出利剑发雷霆，","卫国武公生悔恨。"]],[["苍鹰群行，","相得旅前。","王孙申公，","惊夺我雄。","北天门开，","神火飞灾。","如不敬信，","事入尘埃。"],["雄鹰群集高飞行，","相互配合向前进。","王室子孙和申公，","惊恐纷乱起争雄。","北方开启苍天门，","神火飞来造灾凶。","如不恭敬信奉她，","好事将会化埃尘。"]],[["穿屋相宜，","利倍我北。","循邪诡道，","逃不可得。","南北望邑，","遂归入室。"],["房屋破敝漏洞多，","大利逃走背弃我。","循着邪门歪道行，","生意逃走利难得。","放眼南北望城邑，","随即回归自家室。"]],[["寿如松乔，","与日月俱。","常安康乐，","不罹祸忧。"],["寿比赤松王子乔，","如同日月普天照。","长久平安又康乐，","没有忧愁和烦恼。"]],[["出门望东，","伯仲不来。","疾病为患，","使母忧叹。"],["走出家门向东看，","老大老二不回还。","疾病使人生忧患，","母亲惦念又悲叹。"]],[["太姒之孙，","周文九子。","咸遂受成，","宠贵富有。"],["太姒之孙懂礼仪，","文王生育九个子。","教诲长大都成人，","尊宠显贵很富裕。"]],[["桃李花实，","累累日息。","长大成熟，","甘美可食，","为我利福。"],["桃李开花又结实，","硕果累累多存积。","长大之后都成熟，","甘甜可口成美食，","为我带来好福利。"]],[["昏礼不明，","男女失常。","行露反言，","出争我讼。"],["结婚联姻礼不明，","男女不按规矩行。","《召南·行露》词严厉，","我自出面去争讼。"]],[["室穿敝漏，","破桴残缺。","阴弗能完，","瓦碎不全。"],["房屋穿孔漏洞多，","残缺不全船儿破。","阴气盛行没个完，","瓦砾破碎难复全。"]],[["数穷廊落，","因於历室。","往登玉堂，","与尧侑食。"],["宽宏旷达而受穷，","舜被困于历室中。","玉堂陪尧共进餐，","终于受到尧重用。"]],[["道湿为坑，","轮陷踬僵。","南国作讳，","使我多畏。"],["道路泥泞又多坑，","车轮陷入路难行。","南国途中多忌讳，","使我胆战又心惊。"]],[["鳏寡孤独，","福禄苦薄。","入室无妻，","武子悲哀。"],["光棍寡妇难生活，","福气禄位都苦薄。","回到家中没有妻，","武子悲伤向谁说？"]],[["举袂覆目，","不见日月。","衣衾杖机，","就其夜室。"],["举起袖子遮住眼，","太阳月亮都不见。","衣被杖几入棺椁，","一同送入坟墓间。"]],[["长尾踒跎，","画地为河，","深不可涉。","绝无以北，","悯然愤息。"],["长长尾巴伏地过，","画地而成江与河，","水深流急不可涉。","没有办法行向北，","惆怅愤怒自谴责。"]],[["晨风文翰，","大举就温。","昧过我邑，","羿无所得。"],["鹯鸟皋鸡鼓其翼，","高飞去寻温和地。","黎明之前过城邑，","射手后羿未得利。"]],[["出入节时，","南北无忧。","行者亟至，","在外来归。"],["出门赶上好时候，","南去北往不用愁。","行旅之人速来到，","自外归家乐悠悠。"]],[["阳氏狂惑，","季孙乱愦。","陪臣执政，","平子拘折，","我心不快。"],["阳虎猖狂惑朝廷，","季孙糊涂又昏庸。","家臣篡权掌国政，","平子受挫遭拘禁，","使我看了很痛心。"]],[["五乌六鸮，","相对蹲跂。","礼让不兴，","虞芮争讼。"],["五只乌鸦六只鸮，","相对而起又踮脚。","双方各自不礼让，","虞芮两国相争吵。"]],[["顾念所生，","隔在东平。","遭离满沸，","河川决溃。","幸得无恙，","复归相室。"],["思念儿女手足情，","阻挡隔离于东平。","洪水暴涨乱流淌，","大河决堤人受惊。","幸亏安然无灾害，","返回保姆怀抱中。"]],[["追猎东走，","兔逃我后。","吾锐不利，","独空无有。"],["追逐猎物向东走，","兔子逃到我身后。","我的武器不锋利，","独自空归无所有。"]],[["犬吠非主，","上下膠扰。","敌人袭战，","闵王逃走。"],["家狗望着生人叫，","上下混乱受搅扰。","敌人突然来袭击，","齐国闵王急逃跑。"]],[["嵩高岱宗，","峻直且神。","触石肤寸，","千里蒙恩。"],["中岳嵩山和泰山，","高峻矗立且神验。","云海翻腾多汹涌，","千里大地降甘霖。"]],[["陈鱼观社，","佷荒逾矩。","为民开绪，","亡其祖考。"],["去看捕鱼又观社，","固执荒唐规矩越。","君为百姓开坏头，","乱了祖法亡其国。"]],[["四壁无户，","三步一止。","东西南北，","利不可得。"],["宅院四面都无门，","三步一止难走行。","东西南北出不去，","无利可得枉费心。"]],[["求君衣裳，","情不可当。","触讳西行，","为伯生殃。","君之上欢，","得其安存。"],["借你上衣和下裳，","情意深深不可当。","向西行进犯忌讳，","使我大哥生灾殃。","君居高位多欢欣，","安居乐业又健康。"]],[["春鸿飞东，","以马贸金，","利可得深。"],["春天鸿雁飞向东，","出门卖马换黄金，","生意兴隆把利赢。"]],[["禾生早蠹，","还自克贼，","使我无得。"],["蛀虫侵害我稼禾，","庄稼不能抵御过，","使我年终无收获。"]],[["桀乱无道，","民散不聚。","背室弃家，","逃遁出走。"],["夏桀残暴无人道，","百姓离散四处逃。","背乡离井弃家室，","流亡在外受煎熬。"]]],[[["一衣三冠，","冠无所绊。","元服不成，","为我灾患。"],["一人头上三顶冠，","实在无法去加冕。","职位不能得提升，","给我招来灾与患。"]],[["百足俱行，","相辅为强。","三圣翼事，","王室宠光。"],["一群马蚿行路上，","相互辅助力量强。","三位圣人辅政事，","君王之室显宠光。"]],[["鱼蛇之怪，","大人忧惧。","梁君好城，","失其安居。"],["蛇妖鱼怪别墅闹，","大人恐惧又烦恼。","梁国君主爱筑城，","安乐之窝失掉了。"]],[["少无强辅，","长不见母。","劳心远思，","自伤忧苦。"],["少年时代无辅助，","长大成人不见母。","心情劳累思虑重，","自叹自伤自忧苦。"]],[["前涉溽暑，","解不可取。","离门二里，","败我利市。","老牛病马，","去之何悔。"],["向前赶路遇酷暑，","行装难解难休步。","出门离家二里远，","断了我的发财路。","老牛和那患病马，","不痛不痒丢了它。"]],[["君明有德，","登天大禄。","布政施惠，","以成恩福。","中子南游，","翱翔未复。"],["君王怀德真圣明，","禄位齐天居九重。","治国安民施惠政，","大恩大福一并成。","老二出门游南方，","流连没有回家中。"]],[["哓然唯诺，","敬上尊客。","执恭除患，","御侮致福。"],["诚惶诚恐从其命，","小心谨慎待贵宾。","毕恭毕敬消祸患，","除去羞辱福临门。"]],[["黍稷禾稻，","垂秀方造。","中旱不雨，","伤风病槁。"],["糜子谷子和水稻，","实饱穗垂长势好。","中途天旱不下雨，","热风吹伤全枯槁。"]],[["三羸六罢，","不能越跪。","东贾失马，","往返劳苦。"],["三人瘦弱六人倦，","行走坐立不方便。","东去经商丢了马，","徒劳无益往回返。"]],[["倚立相望，","引衣欲装。","阴云蔽日，","暴雨降集。","使道不通，","阻我欢会。"],["端正站立遥相望，","正要穿衣整行装。","不料阴云遮蔽日，","暴雨倾盆从天降。","道路不通难出行，","欢乐约会被阻挡。"]],[["高脚疾步，","受肩善趋。","日走千里，","贾市有得。"],["脚长脚大走得快，","肩扛物品经商来。","一日能行千里路，","生意兴隆好买卖。"]],[["北风寒凉，","雨雪益冰。","忧思不乐，","哀悲伤心。"],["北风吹来透骨凉，","大雪纷飞至冰上。","忧愁思虑不高兴，","哀怜悲痛真心伤。"]],[["贞鸟雎鸠，","执一无尤；","寝门治理，","君子悦喜。"],["忠贞不渝雎鸠鸟，","专心致志过失少；","身处内宫善治理，","为官之人兴致高。"]],[["蓼萧露瀼，","君子龙光。","鸣鸾噰噰，","福禄来同。"],["雨露滋润香蒿壮，","大人身上显宠光。","鸾铃声儿叮铛响，","幸福利禄同登堂。"]],[["南行求福，","与喜相得。","封受上赏，","鼎足辅国。"],["前去南方求幸福，","得到欢喜和福禄。","上等奖赏得封受，","辅佐君主成鼎足。"]],[["桑叶腐蠹，","衣敝如络。","女工不成，","丝布为玉。"],["桑叶生芽被虫吃，","衣服破敝如乱丝。","织布女工无活干，","丝布奇缺贵如玉。"]],[["左服易右，","王良心欢，","嘉利从己。"],["辕马自左换右边，","王良赶车心中欢，","吉利喜事遂人愿。"]],[["寿考不忘，","驾驷东行。","三适陈宋，","南贾楚荆，","得利息长。","旅身多罢，","畏昼喜夜。"],["不顾年迈和高龄，","驾车向东去出行。","多次前往陈宋国，","经商南至楚和荆，","买卖生意很兴隆。","旅途漫漫甚疲劳，","喜欢夜晚怕天明。"]],[["羔羊皮革，","君子朝服。","辅政扶德，","以合万国。"],["羔羊皮儿多润泽，","大臣朝服用它做。","辅佐朝政正民德，","万国往来多和合。"]],[["鹯鸠徒巢，","西至平州。","遭逢雷电，","破我苇芦。","室家饥寒，","思吾故初。"],["鹯鸠鸟儿迁其居，","向西到达平州府。","不幸遭逢雷电击，","苇巢损坏无居处。","家中忍饥又受寒，","思念当初之故土。"]],[["大尾小头，","重不可摇。","上弱下强，","阴制其雄。"],["尾巴大大脑袋小，","沉重异常不可摇。","上面软弱下盛强，","阴气逞雄控制阳。"]],[["疏足息肩，","有所忌难。","金城铜郭，","以铁为关。","藩屏自卫，","安止无患。"],["驻足歇脚又歇肩，","担子沉重有危难。","铜墙铁壁护金城，","关口牢固防侵犯。","藩篱屏障自守卫，","君主在上很平安。"]],[["天命玄鸟，","下生大商。","造定四表，","享国久长。"],["上天命令神燕降，","降而生契始建商。","治理天下管四方，","享国时间很久长。"]],[["赋敛重数，","政为民贼。","杼轴空虚，","家去其室。"],["苛捐杂税甚频繁，","官府如贼逼民反。","织机空空无布织，","家中妻离子失散。"]],[["阴阳隔塞，","许嫁不答。","宛丘新台，","悔往叹息。"],["男女隔绝不相通，","请求出嫁不答应。","宛丘新台刺昏君，","往事充满悔与恨。"]],[["愿望登虚，","意常欲逃。","贾辛丑恶，","妻不安夫。"],["登上土丘四下望，","心思常常飞远方。","贾辛其人丑模样，","妻子总把别人想。"]],[["踧行窃视，","有所畏避。","蔽目伏藏，","以夜为利。"],["惊恐行走目窃视，","有所畏惧而躲避。","遮住眼睛去隐藏，","夜间行动谋暴利。"]],[["信敏恭谦，","敬鬼尊神。","五岳四读，","克厌帝心，","受福宜年。"],["诚实聪敏又谦恭，","尊重敬奉鬼和神。","五座大山四条河，","征服君主帝王心，","受福延年无穷尽。"]],[["悬悬南海，","去家万里。","飞兔腰褭，","一日见母，","除我忧悔。"],["南海之地远又远，","离家万里盼回还。","归心似箭跨骏马，","一天即到母身边，","除去忧伤好欣欢。"]],[["虽污不辱，","因何跣足？","童子褰衣，","五步平复。"],["虽然肮脏不至辱，","为何你要光着足？","小儿过河提起衣，","五步之后即平复。"]],[["宫城立见，","衣就袂裙。","恭谦自卫，","终无祸尤。"],["宫内传旨急召见，","戴冠整衣忙上前。","恭敬谦虚自护卫，","终归不会有祸乱。"]],[["敝笱在梁，","不能得鱼。","望食千里，","所至空虚。"],["破敝竹笼搁鱼梁，","欲得鲜鱼无希望。","千里之外望食物，","所到之处没有粮。"]],[["千里骍驹，","为王服车。","嘉其骊荣，","君子有成。"],["日行千里枣红马，","为我君王把车驾。","还有那匹黑骏马，","好人乘用成就大。"]],[["鼎足承德，","嘉谋生福。","为王开庭，","得心所欲。"],["大臣继承君王德，","出谋划策生福泽。","为王打开庭院门，","心想事成有收获。"]],[["销锋铸耜，","休牛放马。","甲兵解散，","夫妇相保。"],["销戈铸犁耕农田，","牛儿马儿放南山。","军队解散士回还，","丈夫妻子得团圆。"]],[["右手无合，","独折左指。","禹汤失佐，","事功不立。"],["右手无法再合作，","左手指头全断折。","夏禹商汤失辅佐，","无法建功立大业。"]],[["忧凶增累，","患近不解。","心意西东，","事无成功。"],["忧愁灾凶日日增，","祸患临头难脱身。","心意茫然无所从，","什么事都办不成。"]],[["东行食榆，","困於枯株。","失妻无家，","志穷为忧。"],["东行路上吃榆皮，","无奈困于干枯枝。","失掉妻子没有家，","丧失志气甚忧虑。"]],[["五经六纪，","仁道所在。","正月繁霜，","独不离咎。"],["五经六经是总纲，","仁义道德其中藏。","六月降霜不正常，","独独不能离祸殃。"]],[["懈缓不前，","怠惰失便。","二至之戒，","家无祸凶。","刻木象形，","闻言不信。"],["行动迟缓难前进，","坐失良机难再寻。","冬至夏至守忌禁，","祝福家中无灾凶。","双亲形象木上刻，","听到凶言皆不信。"]],[["仁爱笃厚，","不以所忿，","害其所子。","从我旧都，","日益富有。"],["仁爱笃厚好德性，","从不随意泄私愤，","伤害他家子和孙。","甘愿迁回原居室，","生活美满财丰盈。"]],[["缺破不成，","胎卵未生，","弗见兆形。"],["残缺破敝已坏损，","胎卵未能得萌生，","不能见到其雏形。"]],[["摧角不伤，","虽折复长。","秉德无愆，","老赖荣光。"],["犄角受撞无大伤，","纵然折断又生长。","道德高尚无过失，","老年靠它享荣光。"]],[["乘桴渡海，","免脆厄中，","虽困无咎。"],["乘着木筏去渡海，","脱离危难免了灾，","虽受困厄终无害。"]],[["孔鸾鸳雏，","鹈鹕，","翱翔紫渊，","嘉禾之圃，","君子以娱。"],["孔雀鸳鸯自由行，","百鸟翱翔紫渊中。","树木葱郁山水秀，","苗圃花香又醉人，","明德之君好开心。"]],[["甘露湿润，","众来得愿。","乐易君子，","不逢祸乱。"],["露珠润泽又甘甜，","众人愿望得实现。","喜事改善君情绪，","走运未逢祸与患。"]],[["东骑堕落，","千里独宿。","高岸为谷，","阳失其室。"],["骑马东行坠落地，","千里之外独自宿。","高地变成为低谷，","丈夫痛心失爱妻。"]],[["八才既登，","以成嘉功。","尨降庭坚，","国无忧凶。"],["八个才子辅王君，","所行之事都成功。","尨降庭坚受重用，","国家不会有忧凶。"]],[["邯郸反言，","父兄生患。","竟涉忧恨，","卒死不还。"],["邯郸传来造反言，","父老兄弟受灾患。","竟使陈胜怀忧恨，","卒然战死不回还。"]],[["玉铣铁顾，","仓库空虚。","贾市无盈，","与利为仇。"],["玉角镶在铁钟口，","仓库空虚无所有。","市场生意不盈利，","我独与利结怨仇。"]],[["白鸟衔饵，","鸣呼其子。","旋枝张翅，","来从其母。"],["白鸟妈妈衔来食，","呼叫其子都来吃。","小鸟旋枝张开翅，","投入慈母怀抱里。"]],[["学灵三年，","圣且神明。","先见善祥，","喜吉福庆。","鹄知来，","告我无咎。"],["学仙修道整三年，","圣明灵验会预见。","先兆呈现善与祥，","好事自来入门槛，","嘉鹊飞来报喜讯，","神明告我无灾难。"]],[["云孽蒸起，","失其道理。","伤害年谷，","福君乏祀。"],["妖云作孽腾空起，","丧失天道逆常礼。","庄稼受损无收获，","神灵在位缺祭祀。"]],[["春耕有息，","秋入利福。","献豜大豵，","以乐成功。"],["春天播种即生长，","秋有收获福长长。","大猪小猪敬献上，","庆贺丰收喜洋洋。"]],[["赢豕踯躅，","虎入都邑。","遮遏左右，","国门敕急。"],["老虎闯入我京城，","瘦猪惊恐不敢动。","前面遏道后面堵，","城门挂出君主令。"]],[["东行西维，","南北善迷。","逐旅失群，","亡我襦衣。"],["东来西往很繁忙，","南北颠倒迷方向。","追赶行人失伙伴，","乱中丢了我衣裳。"]],[["居室之伦，","夫妇和亲；","小人乘车，","硕果失豢。"],["男女居家有规循，","夫妇和睦又相亲；","小人居于高位上，","硕果虽丰不养民。"]],[["东方孟春，","乘冰戴盆。","惧危不安，","终失所欢。"],["东方之神携春降，","头顶瓦盆行冰上。","危险不安心恐慌，","终竟未能得欢畅。"]],[["风吹尘起，","十里无所。","南国年伤，","不可安处。"],["大风吹来尘飞扬，","十里之内无住房。","南方受灾谷物伤，","住在那里不安详。"]],[["重载伤车，","妇女无夫；","三十不室，","独坐空庐。"],["负载过重车难行，","姑娘成年未配君；","男子三十无家室，","独守空房过单身。"]],[["败失羸马，","与利为市，","不我嘉喜。"],["瘦弱之马和疲牛，","与利与福结怨仇，","没有欢喜令人忧。"]],[["日出阜东，","山蔽其明。","章甫荐履，","箕子佯狂。"],["日出东方山坡上，","大山遮住太阳光。","手执帽子当鞋穿，","箕子无奈装疯狂。"]],[["出入门所，","与道开通。","杞梁之信，","不失日中。","少季渡江，","来归其邦，","疾病危亡。"],["往来出入朝廷门，","所行道路都畅通。","齐国杞梁守信用，","正午不违君王令。","小弟渡江涉过水，","重新返回故乡中，","身患疾病把命送。"]],[["邑兵卫师，","如转蓬时，","居之凶危。"],["国都京城守卫队，","犹如蓬蒿随风吹，","在此居住有凶危。"]]],[[["践履寒冰，","十步九寻。","虽有苦痛，","不为忧病。"],["脚踩寒冰向前行，","十步九寻难进行。","纵是自身有苦痛，","安然不会成重病。"]],[["太公避纣，","七十隐处。","卒逢圣文，","为王室辅。"],["太公为避殷纣王，","七十高龄隐居忙。","终遇圣人周文王，","辅佐王室兴国邦。"]],[["日月之途，","所行必到，","无有患悔。"],["太阳月亮之途径，","沿着天体轨道行，","忧患悔恨不来临。"]],[["讽德颂功，","美风盛隆。","旦辅成周，","光济冲人。"],["歌颂大德赞功勋，","美好风尚得兴盛。","周公朝廷佐辅臣，","辉光济助成王身。"]],[["童女无室，","未有配合，","空坐独宿。"],["少女方小未出嫁，","没有少男来配她，","空坐独睡守在家。"]],[["穿鼻系株，","为虎所拘。","王母祝词，","祸不成灾，","遂然脱来。"],["穿了鼻孔拴树上，","被虎拘制心惶惶。","幸亏王母来祷告，","祸去未能成灾殃，","脱难归来未受伤。"]],[["黄帝神明，","八子圣聪。","佚受大福，","天下平康。"],["黄帝神圣又英明，","八个儿子很聪颖。","平顺安闲享大福，","天下太平永康宁。"]],[["深谷为陵，","衰者复兴。","乱倾之国，","民得安息；","中妇病因，","遂人冥室。"],["幽幽深谷变丘陵，","衰者转而又复兴。","动乱倾覆危难国，","黎民百姓得安宁；","中年妇女受病困，","随之进入地府中。"]],[["道远辽绝，","路宿多悔。","顽嚣相聚，","生我畏忌。"],["道路曲折又遥远，","途中住宿不方便。","暴徒喧嚣聚一处，","使我畏惧生忌难。"]],[["旦树菽豆，","暮成藿羹。","心之所乐，","志快心欢。"],["早上下田种豆子，","傍晚即有豆汤食。","劳动之人有所慰，","志向实现心欢娱。"]],[["切切之患，","凶忧不成。","虎不敢䖪，","利当我身。"],["时时慎防生危难，","凶祸不会入门槛。","恶虎不敢来伤害，","保我顺利又平安。"]],[["王伯远宿，","长妇在室。","异庖待食，","所求不得。"],["王家大哥外地住，","大嫂一人独自居。","邻里厨房等饭吃，","欲求饮食未允许。"]],[["寒懊失时，","阳旱为灾，","虽耗无忧。"],["冷热不按时节来，","阳强阴弱成旱灾，","虽有耗损无大害。"]],[["虽穷复通，","履危不凶，","保其明功。"],["走投无路又顺通，","历经危难未逢凶，","保君功名自然成。"]],[["狼虎所宅，","不可以居，","为我患忧。"],["恶狼猛虎居住地，","不可在此久留居，","以免招患招灾异。"]],[["喋嗫噱嚾，","昧冥相搏。","多言少实，","语无成事。"],["窃窃私语喧嚣声，","暗中相互斗又争。","空话连篇难兑现，","只说不做事无成。"]],[["履冰蹈凌，","虽困不穷。","播鼓登岩，","卒无忧凶。"],["踩着坚冰踏着凌，","纵然受困路可通。","一鼓作气登上岸，","终于不会有忧凶。"]],[["文文墨墨，","忧祸相杂。","南北失志，","东西不得。"],["污秽昏暗不明亮，","忧患祸凶聚一堂。","南来北往不得志，","东行西步徒奔忙。"]],[["争讼不已，","更相谈询。","张季弱口，","披发北走。"],["争论纷纷无休止，","更相谩骂和攻击。","张家小三输了理，","披头散发朝北去。"]],[["德积逢时，","宜其美才。","相明辅圣，","拜受福休；","长女不嫁，","后为大悔。"],["积善行德逢时运，","得以施展好才能。","宰相之才辅圣居，","跪拜接受大福恩；","长女大龄不嫁人，","最终独把后悔生。"]],[["江水沱汜，","思附君子。","仲氏爰归，","不我肯顾，","姪娣恨悔。"],["江水分流又汇合，","思念丈夫求依托。","二姐已经嫁出门，","离去不肯照顾我，","陪嫁女子悔恨多。"]],[["光祀春成，","陈宝鸡鸣。","阳明失道，","不能自守，","消亡为咎。"],["夜来光辉如流星，","北阪城里野鸡鸣。","阳明之气失常道，","不能遵守规律行，","发散消亡造灾凶。"]],[["惊虎为患，","虞为我言，","赖得以安。"],["猛虎受惊成祸患，","幸亏林官来传言，","使我有幸得平安。"]],[["伪言妄语，","转为诖误，","不知狼处。"],["轻信伪语和妄言，","相互传播受牵连，","狼居何处谁人见？"]],[["履隙自敌，","凶忧来到，","痛不能笑。"],["过隙犹如自树敌，","凶患忧虑把我逼，","痛苦难笑独哭泣。"]],[["牵尾不前，","逆理失臣，","惠朔以奔。"],["首尾牵制难行进，","君主逆理失众臣，","惠公受攻向齐奔。"]],[["三狸捕鼠，","遮遏前后。","死于环城，","不得脱走。"],["三只山猫捕老鼠，","前面截来后面堵。","最终死于环城内，","不能脱身难逃出。"]],[["言笑未毕，","忧来暴卒；","身加槛缆，","囚系缚束。"],["欢声笑语未完毕，","忧患降临暴病死；","身加囚栅去服刑，","监牢之中度时日。"]],[["阴积不已，","云作霪雨。","伤害平陆，","民无室屋。"],["阴气聚集无休止，","乌云翻腾化霪雨。","毁坏平原和陆地，","黎民百姓无家室。"]],[["山林麓薮，","非人所处。","鸟兽无礼，","使我心苦。"],["山中草深树林密，","不是人类居住地，","鸟兽无礼来侵害，","使我劳苦生忧思。"]],[["新作初陵，","蹈险难登。","三驹推车，","跌顿伤颐。"],["新丰高地建初陵，","一路艰险难攀登。","三匹骡子拉重车，","翻车伤畜又伤人。"]],[["魂微惙惙，","属纩听绝。","扩然大通，","复更生活。"],["魂魄失散神疲倦，","病入膏肓呼吸难。","骤然扩大得通畅，","起死回生转平安。"]],[["栾子作殃，","伯氏诛伤。","州犁奔楚，","去其邑乡。"],["栾子行凶造灾殃，","伯宗一同受诛伤。","州犁逃往楚国地，","避难异国去他乡。"]],[["骄胡犬形，","造恶作凶。","无所能成，","还自灭身。"],["骄横如狗匈奴人，","到处作恶又造凶。","最终一事无所成，","反而招殃灭自身。"]],[["陈词达情，","使安不倾。","增荣益誉，","以成功名。"],["向上陈辞表忠心，","使君地位得安稳。","增加荣耀添荣誉，","以使名就又功成。"]],[["他山之错，","与璆为仇。","来攻吾城，","伤我肌肤，","邦家骚扰。"],["他山之上磨玉石，","与我美玉成仇敌。","坏人来攻我城池，","伤我肌肉伤肤皮，","骚扰家庭乱国事。"]],[["三杞无枣，","家无积莠。","使鸠求妇，","顽不我许。"],["家中贫穷剩三杞，","想要喂鸟无草籽。","斑鸠寻偶因无食，","拒之门外不允许。"]],[["慎祸重患，","颜子为友，","乃能安存。","牢户系羊，","乃能受福。"],["谨慎小心免祸患，","颜子高德真圣贤，","赖此使君能平安。","修好羊圈管好羊，","方能享得福长长。"]],[["鹿得美草，","鸣呼其友。","九族和睦，","不忧饥乏。"],["鹿儿得到鲜美草，","呦呦鸣呼把友叫。","群体上下都和睦，","不用惆怅吃不饱。"]],[["亡玉失鹿，","不知所伏。","利以避危，","全我生福。","甘雨时降，","年谷有得。"],["丢了美玉又失鹿，","不知失物在何处。","破财免灾可避祸，","保全我家生与福。","好雨逢时从天降，","年岁丰收家有谷。"]],[["逢时积德，","身受福庆。"],["适逢好运修德行，","保君终身受福庆。"]],[["鹄思其雄，","欲随凤东。","顺里羽翼，","出次须日。","中留北邑，","复反其室。"],["天鹅觅偶长相思，","跟随凤凰东飞去。","梳理羽毛理好翼，","迎着太阳高飞起。","途中留止于城北，","重新返回自家室。"]],[["环堵倚鉏，","升斗属口。","贫贱所处，","心寒悲苦。"],["院墙周围开垦出，","种上五谷把口糊。","贫困低贱处此地，","身受寒冷心悲苦。"]],[["孤独特处，","莫依为辅，","心劳志苦。"],["孤苦伶仃独自处，","无依无靠无佑辅，","心思劳累志多苦。"]],[["稷为尧使，","西见王母，","拜请百福。","赐我喜子，","长乐富有。"],["后稷作为尧使臣，","前往西方见王母，","拜请天地赐百福。","王母送我一喜蛛，","保我长乐又富裕。"]],[["鸣条之灾，","北奔犬胡。","左衽为长，","国号匈奴。","王君旄头，","立尊单于。"],["鸣条逢灾受劳苦，","向北奔跑逃往胡。","身上穿着大襟服，","国家号称为匈奴。","王君旗帜旄尾饰，","高举飘扬称单于。"]],[["绝而复通，","虽危不穷。","终得其愿，","姬姜相从。"],["历经绝境得复通，","虽有危险不困穷。","最终愿望得实现，","患难夫妻永相从。"]],[["阳并悖狂，","拔剑自伤，","为身生殃。"],["阳气太盛乱发狂，","拔出利剑自招伤，","致使身体遭灾殃。"]],[["方圆不同，","刚柔异乡。","掘井得石，","劳而无功。"],["方圆双双各不同，","刚强柔弱不相容。","挖井取水得到石，","徒然劳苦白费功。"]],[["乘风驾雨，","与鸣鸟俱。","动举千里，","见我爱母。"],["乘着风儿驾着雨，","飞鸟给我作伴侣。","一举行至千里外，","和我慈母相团聚。"]],[["三涂五岳，","阳城太室。","神明所扶，","独无兵革。"],["巍巍三涂五岳山，","阳城太室入云间。","神明仙人来保佑，","没有兵燹造灾难。"]],[["鸱鸮娶妇，","深目窈身。","折腰不媚，","与伯相背。"],["猫头鹰儿娶媳妇，","妖声妖气深凹目。","弯腰驼背无媚态，","和它丈夫难相处。"]],[["转行轨轨，","行近不远。","旦夕入门，","与君笑言。"],["行走路线绕圆圈，","家为中心走不远。","早晚随时入宅来，","与我好友笑开颜。"]],[["求利难国，","逃去我北。","复归其城，","不为吾贼。"],["为求发财危难国，","与我争利奔向朔。","最终返回故里地，","不再前来打扰我。"]],[["日月之途，","所行必到。","无凶无咎，","安宁不殆。"],["太阳月亮之路途，","东升西落通无阻。","没有凶祸与灾难，","平安顺利无危险。"]],[["管仲遇桓，","得其愿欢。","胶目启牢，","振冠无忧；","笑戏不庄，","空言妄行。"],["管仲遇到齐桓公，","平生所愿皆成真。","胶粘眼睛出狱门，","着衣整冠重做人；","玩笑戏弄不庄重，","空言妄行难善终。"]],[["出入蹈践，","动顺天时。","俯仰有节，","祸灾不来。"],["出入双脚踩大地，","举动皆能顺天时。","垂首仰头有节序，","祸灾永不来家里。"]],[["内崩中伤，","上乱无常。","虽有美粟，","我不得食。"],["内部崩溃受中伤，","上边混乱不正常。","虽有良米优谷在，","我却无法吃得上。"]],[["逐祸除患，","道德神仙。","遏恶万里。","福常在前，","身乐以安。"],["驱逐灾祸除患难，","道德节操如神仙。","阻挡恶事万里外。","幸福常在君眼前，","身受快乐永平安。"]],[["牛惊马走，","上下浑扰。","鼓音不绝，","顷公奔败。"],["牛惊马走车掀翻，","上下混乱成一团。","战鼓声声不休止，","顷公狼狈而逃窜。"]],[["西上九阪，","往来流连。","止须时日，","虚与有得。"],["向西登上九重山，","来来往往空流连。","只需等待好时日，","幻想方能得实现。"]],[["虎怒捕羊，","猬不能攘。"],["猛虎暴怒捕捉羊，","刺猬不敢去抵挡。"]],[["涌泉涓涓，","南流不绝，","卒为江海。","败坏邑里，","家无所处。"],["清泉流水细又长，","向着南方慢慢淌，","汇合变成大海洋。","冲坏城填和村庄，","黎民失居无住房。"]],[["将帅袭战，","获其丑虏。","桃弓苇戟，","除残去恶，","敌人执服。"],["将帅领兵去袭击，","大获全胜俘顽敌。","桃木为弓苇作戟，","驱逐残暴消灾异，","降服敌人庆胜利。"]]],[[["千岁槐根，","身多斧瘢。","伤夷倒掘，","枝叶不存。"],["千年槐树根腐烂，","身上几多利斧瘢。","受伤倒地遭人刨，","枝儿无存叶儿残。"]],[["喭喭谔谔，","虎豹相齚。","畏惧悚息，","终无难恶。"],["凶猛强悍怒声吼，","恶虎猛豹相厮斗。","惊恐畏惧屏呼吸，","终使难恶不临头。"]],[["娶于姜吕，","驾迎新妇。","少齐在门，","夫子欢喜。"],["前往齐国去娶亲，","驾车把我新妇迎。","少女立在家门口，","小伙喜悦甚欢欣。"]],[["豪壤肥泽，","民人孔乐。","宜利居止，","长安富有。"],["土壤肥沃雨水多，","庄稼丰收民安乐。","此地适合长居住，","富裕日子好生活。"]],[["主有圣德，","上配太极。","皇灵建中，","授我以福。"],["君主德明有礼仪，","功高上能配太极。","先王为民立中道，","给我带来大福气。"]],[["耄老蒙钝，","不见东西。","少者弗慕，","君不与谋。","悬舆致仕，","退归里居。"],["老人糊涂头脑钝，","不辨南北与西东。","年轻人儿瞧不起，","君不用他谋朝政。","挂起车子辞掉官，","退休返回老家中。"]],[["三狂北行，","道逢大狼。","暮宿患宅，","为祸堪伤。"],["三个狂人向北行，","路逢恶狼来逞凶。","晚上住宿在患宅，","被狼残害伤其身。"]],[["更旦初岁，","振除祸败。","新衣元服，","拜受利福。"],["大年初一新岁到，","驱除祸患使灾消。","穿上新衣戴新帽，","磕头受福真逍遥。"]],[["杲杲白日，","为月所食。","损上毁下，","郑昭出走。"],["一轮皎皎大白日，","竟被月亮所残食。","上天受损下受毁，","昭公出奔卫国去。"]],[["君子失意，","小人得志。","乱扰并作，","奸邪充塞。","虽有百尧，","颠不可救。"],["有德之人失了意，","无耻之徒却得志。","混乱困扰都临至，","奸佞邪恶充我室。","纵然世间有百尧，","颠覆灭亡不可治。"]],[["仁德利洽，","恩及异域，","泽被殊方，","福庆隐伏。","作蚕不织，","寒无所得。"],["仁义道德益浸润，","大惠施于异地中，","他方黎民蒙泽恩，","福庆独在我处隐。","蚕不吐丝衣难成，","没有冬装受寒冷。"]],[["东求金玉，","反得弊石。","名曰无宜，","字曰丑恶，","众所贱薄。"],["前去东方求宝玉，","反而得到破弊石。","徒有虚名不适用，","冠以丑名无价值，","众人轻视瞧不起。"]],[["击鼓合战，","士怯叛亡。","威令不行，","败我成功。"],["击鼓进兵相交战，","士卒胆怯而逃窜。","将帅命令行不通，","必然失败难成功。"]],[["仲春孟夏，","和气所舍。","生我嘉福，","国无残贼。"],["春夏之交好时令，","和祥之气在此生。","天赐大福和好运，","国中安宁无恶人。"]],[["尹氏伯奇，","父子生离。","无罪被辜，","长舌为灾。"],["君吉甫子名伯奇，","父子二人生别离。","无罪被逐于野外，","长舌后母施毒计。"]],[["五谷不熟，","民苦困急。","驾之新邑，","嘉乐有得。"],["田里庄稼未成熟，","百姓焦急又困苦。","驾起车儿去新城，","与欢与乐同相处。"]],[["登虚望贫，","暮食无飡。","长子南戍，","与我生分。"],["登上废墟望清贫，","晚餐无食腹中空。","老大南方去从军，","父子活活两离分。"]],[["东市齐鲁，","南贾荆楚。","羽毛齿革，","为吾利宝。"],["东到齐鲁做买卖，","南往荆楚跑生意。","羽毛象牙和皮革，","使我发财赚大利。"]],[["节情省欲，","赋敛有度。","家给人足，","公刘以富。"],["节制情欲和奢望，","征赋收租有度量。","家家丰衣又足食，","周朝因之得兴旺。"]],[["恭宽信敏，","功加四海。","辟去不祥，","喜来从母。"],["庄重宽容又诚实，","功德普及八方地。","除去不祥获吉利，","喜事跟着我母子。"]],[["张狂妄行，","与恶相逢。","不得所欲，","生我独凶。"],["胡作非为狂妄人，","必然与恶而相逢。","所求欲望得不到，","使我蒙受灾与凶。"]],[["画龙头颈，","文章不成。","甘言美语，","诡辞无名。"],["画龙只画头和颈，","龙身花纹绘不成。","甜言蜜语虽动听，","空话连篇难成名。"]],[["骑龙乘风，","上见神公。","彭祖受刺，","王乔赞通。","巫咸就位，","拜寿无穷。"],["骑着飞龙乘着风，","上天去见神仙公。","彭祖出门接名帖，","王乔入宫去通禀。","卜卦巫咸就位坐，","求得长寿无止境。"]],[["温仁君子，","忠孝所在。","八国为邻，","祸灾不处。"],["温顺仁爱有德人，","忠诚孝敬风盛行。","各国结成好邻邦，","灾祸永不临我身。"]],[["威权分离，","乌夜徘徊。","群蔽月光，","大人诛伤。"],["权力威望两分开，","群乌无首夜徘徊。","众人目光皆遮蔽，","国政要人遭伤害。"]],[["学灵三年，","仁圣且神。","明见善祥，","吉喜福庆。","鹄知来，","告我无忧。"],["学仙修道整三年，","仁义聪圣似神仙。","先知先觉明吉祥，","好事自来入门槛。","喜鹊飞来报喜讯，","告我不用忧灾难。"]],[["东山辞家，","处妇思夫。","伊威盈室，","长股赢户。","叹我君子，","役日未已。"],["丈夫东去远离家，","妻子天天思念他。","屋里潮虫到处爬，","蜘蛛作网窗户下。","哀叹思念我老公，","劳役不止难回家。"]],[["张颔开口，","舌直距齿。","然诺不行，","政乱无绪。"],["伸长下巴张开口，","舌头僵直话没有。","答应许诺不算数，","政治混乱无群首。"]],[["吹角高邦，","有失牛羊，","众民惊惶。","敬慎避咎，","不行殃。"],["高处吹得号角响，","有人丢了牛和羊，","众人失措心惶惶。","谨之慎之去避祸，","行动顺利未逢殃。"]],[["南行出城，","世得福祉。","王姬归齐，","赖其所欲。"],["向南行走出城门，","福祉世世得降临。","周王女儿嫁齐国，","圆了她的新婚梦。"]],[["心狂志悖，","视听从类。","政令无常，","下民多孽。"],["心志狂乱掌权人，","行为处事依随从。","政令变幻无常法，","罪恶殃及老百姓。"]],[["安上宜官，","一日九迁。","踰群越等，","牧养常山。"],["安慰上司好做官，","一日能有九升迁。","超越平凡同等人，","如同田氏居常山。"]],[["东邻嫁女，","为王妃后。","庄公筑馆，","以尊王母。","归于京师，","季姜悦喜。"],["东边邻国出嫁女，","做了桓王的正室。","庄公城外建新馆，","以示尊敬周王姬。","嫁至周都洛邑城，","季姜心中很欢喜。"]],[["六甲无子，","巳丧其戊。","五丁不亲，","庚失曾孙，","癸走出门。"],["六甲无子事不成，","巳丧其戊难孤存。","五丁缺一不完整，","庚失重孙和曾孙，","癸亥走出干支门。"]],[["阴雾不清，","浊政乱民。","孟秋季夏，","水坏我居。"],["阴雾迷漫看不清，","政治污浊乱民心。","夏末秋初时节里，","我家房屋遭水冲。"]],[["骑豚逐羊，","不见所望。","经涉虎庐，","亡身失羔。"],["骑着小猪去追羊，","不见羊儿在何方。","中途经过老虎洞，","羊儿竟被虎伤亡。"]],[["天命赤乌，","与兵徼期。","征伐无道，","诛其君傲，","居止何忧。"],["上天命令慈祥鸟，","与那大军同相邀。","前往征伐无道君，","诛灭纣王之狂暴，","居之安乐无烦恼。"]],[["安床厚褥，","不得久宿。","充我喜宴，","困于南国。","投杼之忧，","不成祸灾。"],["床稳褥厚虽无忧，","不得在此久住留。","舍弃我的美酒宴，","隐居南方不出头。","丢下机梭心怀忧，","最终祸灾被逐走。"]],[["五方四维，","平安不危。","利以居止，","保有玉女。"],["纵观四面和八方，","到处平安呈吉祥。","住在这个好地方，","保有美女来身旁。"]],[["西贾巴蜀，","寒雪至毂。","欲前不得，","复反其室。"],["西往四川去经商，","厚雪埋至车轴上。","向前寸步难行进，","原路退回其故乡。"]],[["刚柔相呼，","二姓为家。","霜降既同，","惠我以仁。"],["小伙姑娘相招呼，","两姓结合成一户。","霜降时节即成婚，","上天赐我爱与仁。"]],[["天马五道，","炎火分处。","往来上下，","相随哭歌，","凶恶如何。"],["天马分成五路行，","炎火闪闪远离分。","来来往往上又下，","哭笑悲歌相随从，","是凶是恶说不清。"]],[["出门怀忧，","东上祸丘。","与凶相遇，","自为灾患。"],["出门在外怀忧愁，","向东登上祸之丘。","途中与凶而相逢，","自找倒霉把罪受。"]],[["西行求玉，","冀得随璞。","反见凶恶，","使我惊惑。"],["西行前去求宝玉，","希望得到随侯珠。","反而遇上凶与恶，","使我惊慌又恐惑。"]],[["出门无妄，","动作失利。","衔忧怀祸，","使我多悴。"],["出门意外逢灾异，","行为动作皆失利。","衔着忧愁怀着祸，","使我憔悴悔恨多。"]],[["高楼无柱，","颠僵不久。","纣失三仁，","身死牧野。"],["高楼无柱难支撑，","不久必然要倒倾。","纣王失去三贤臣，","牧野战败丧其身。"]],[["避祸逃殃，","身全不伤；","高位疾颠，","华落坠亡。"],["躲避灾祸逃患殃，","保全身体不受伤；","贪恋高位易垮台，","花落枝头自坠亡。"]],[["张牙反目，","怒龌作怒。","狂马挠犬，","道惊伤轸。"],["张牙舞爪反其目，","咬牙切齿大发怒。","马儿受惊搅忧狗，","途中摔坏车横木。"]],[["泉涸龙忧，","箕子为奴。","干叔殒命，","殷破其家。"],["泉水干涸龙忧愁，","箕子成为阶下囚。","比干剖心陨了命，","殷纣残暴江山丢。"]],[["向食饮酒，","嘉宾聚会。","牂羊大猪，","君子饶有。"],["对着美食饮美酒，","欢宴亲朋和好友。","献上母羊和大猪，","主人家中很富有。"]],[["黄牛骍犊，","东行折角。","冀得百祥，","反亡我囊。"],["赶着黄牛赤色犊，","东行碰折牛角骨。","希望得到大吉祥，","反而丢失我行囊。"]],[["路多枳棘，","步刺我足。","不利旅客，","为心作毒。"],["路上枳棘多又多，","我的双脚被刺破。","不利出门去远行，","心烦意乱悔恨生。"]],[["执斧破薪，","使媒求妇。","和合二姓，","亲御饮酒。","召彼邻里，","公姑悦喜。"],["手执斧头去劈薪，","找好媒人去求亲。","两姓和合成一家，","亲手捧杯把酒敬。","请来邻里开怀饮，","公公婆婆都高兴。"]],[["驾车出门，","顺时宜西。","福佑我身，","安宁无患。"],["驾起车儿出了门，","顺应天时向西行。","幸福保佑我的身，","没有灾患多安宁。"]],[["日新东升，","魁杓为祸。","仆台为秦，","使我久坐。"],["太阳又从东方升，","魁杓二星兆灾凶。","在下为了秦国事，","使我昼夜空坐等。"]],[["山陵丘墓，","魂魄房屋。","精光竭尽，","长卧无觉。"],["山陵之间造丘墓，","鬼魂以此为室屋。","一生精力全耗尽，","长眠地下死为伍。"]],[["孩子贪饵，","为利所说。","探釜把甑，","烂其手臂。"],["孩童无知贪诱物，","见到好处心中悦。","手儿伸进锅盆内，","烫烂双手和臂膊。"]],[["何材待时，","闭门独愁。","蚯蚓冬行，","解我无忧。","桑蚕不得，","女红无成。"],["为何有才不逢时，","关上屋门独愁思。","蚯蚓寒冬出土行，","解了我的心头虑。","采桑养蚕无收获，","纺织女工无布织。"]],[["解商惊惶，","散我衣装，","君不安邦。"],["休止商贾人惊惶，","丢失我的旅行装，","君主不能安其邦。"]],[["害政养贼，","背主人衍。","跛行不安，","国为危患。"],["国有害政养贼人，","背叛君主祸事生。","跛足行路不安稳，","国家处于危难中。"]],[["祸走患伏，","喜为我福。","凶恶消亡，","灾害不作。"],["灾祸离去患隐伏，","喜庆为我降幸福。","凶恶全部消亡尽，","灾害不再来逞凶。"]],[["老马无驹，","病鸡不雏。","三雌独宿，","利在山北。"],["老马不能生马驹，","病鸡难以孵小鸡。","三个雌性独自居，","利在山北难获取。"]],[["播天舞，","光地乳。","神所守，","乐无咎。"],["传播天帝宫廷舞，","光及东南之地乳。","神灵在上来守护，","使我欢乐多幸福。"]],[["异国殊俗，","情不相得。","金木为仇，","酋贼擅杀。"],["两国风俗各不同，","性情与我不相通。","金木相克成仇敌，","匪首擅自杀黎民。"]]],[[["被服文衣，","游观酒池。","上堂见觞，","喜为吾兄，","使我忧亡。"],["身穿华贵衣和裳，","酒池游览观风光。","大堂之上酒装杯，","欢乐是我好兄长，","使我消愁除忧伤。"]],[["邑姜叔子，","天文在手。","实沈参墟，","封为晋侯。"],["皇后邑姜生叔虞，","天赐字纹在手里。","实沈星宿分野地，","晋侯封为虞之子。"]],[["改柯易叶，","饭温不食。","豪雄争强，","先者受福。"],["砍掉枯树更新枝，","废寝忘食争朝夕。","英雄豪杰争强盛，","先声夺人获福喜。"]],[["馨香陟降，","明德上登。","社神佑顾，","命予大邻。"],["馨香自高而降临，","圣明之德往上升。","土地之神来保佑，","恩赐乡亲和近邻。"]],[["老狼白驴，","长尾大胡。","前颠却踬，","进退遇祟。"],["老狼和那大白犬，","长尾颔内垂成片。","前颠后跌难行走，","行进退却遇祸端。"]],[["山没丘浮，","陆为水鱼，","燕雀无庐。"],["大水淹设那山冈，","陆地成为鱼儿乡，","燕雀失去其住房。"]],[["懿公浅愚，","不受深谋。","无援失国，","为狄所贼。"],["懿公浅薄又顽愚，","深谋远虑不听取。","孤立无援失掉国，","终被狄人所消灭。"]],[["鼎炀其耳，","热不可举。","大涂塞壅，","旅人心苦。"],["鼎下火烧其耳烫，","炽热难举心惶惶。","出行之人太劳苦，","路途受阻不通畅。"]],[["凶声丑言，","恶不可闻。","君子舍之，","往恨我心。"],["口吐狂言气势凶，","恶语伤人不可听。","贤士离开是非地，","以免伤害我的心。"]],[["昧暮乘车，","履危陷沟。","亡失群物，","摧折两轴。"],["黄昏乘车出门行，","车子陷入深沟中。","大批物品被丢失，","断折两轴坏车轮。"]],[["南有嘉鱼，","驾黄取。","鲂诩诩，","利来毋忧。"],["南方水乡有好鱼，","驾车前往做生意。","鲂鱼鱼真新鲜，","商人坦然获大利。"]],[["隔在九山，","往来劳难。","心结不通，","失其所欢。"],["两人相隔九重山，","往来劳苦甚艰难。","音信双双不相通，","失去亲人心不欢。"]],[["下流难居，","狂夫多疲。","贞良温柔，","年岁不富。"],["下流之地难安居，","狂妄之徒行不义。","贞良温柔耿直人，","苦熬岁月难富足。"]],[["狐狸雉兔，","畏人逃去。","分首窜匿，","不知所处。"],["狐狸野鸡和兔子，","畏惧行人逃离去。","四下分走躲藏起，","不知匿身在何地。"]],[["异体殊俗，","各有所属。","西邻孤妪，","欲寄我室。","主母骂詈，","终不可得。"],["各人习俗不相同，","爱好厌恶难随从。","西邻有个孤老妪，","想要寄居我家中。","主母闻讯骂不停，","老妪终难进家门。"]],[["怒非怨妒，","贪得腐鼠。","而呼鹰鹯，","自令失饵，","致被困患。"],["愤怒并非生嫉妒，","贪得一只腐烂鼠。","呼唤老鹰猛禽来，","自失食物口难糊，","招来忧患与困苦。"]],[["五心六意，","歧道多怪。","非君本心，","生我恨悔。"],["五人主意各不同，","岔道途中怪事生。","纵然并非君本意，","使我心中生悔恨。"]],[["三班六黑，","同室共食。","日长月息，","我家有德。"],["三只老虎六头猪，","同槽饲养同舍住。","随着日月长与息，","我家有德感化畜。"]],[["方船备水，","旁河燃火，","终身无祸！"],["两船并行备水害，","傍河燃火灾不来，","终身无祸多自在！"]],[["翳屏独语，","不闻朝市。","以利居服，","免跛后闻。"],["隔着屏风独自语，","不知早市新消息。","掌握信息早得利，","以免生祸误正事。"]],[["居处不安，","徒反触患。"],["所居之地不安全，","外出返回逢灾难。"]],[["剠刖髡劓，","人所贱弃。","批捍之言，","我心不快。"],["面部脚端受酷刑，","众人鄙视不亲近。","恶言秽语遭伤害，","使我痛心又伤心。"]],[["皋田禾黍，","堆壤麻枲。","衣食我躬，","室家饶有。"],["水边高地种糜子，","大麻如山广堆积。","自己动手衣食足，","不愁吃穿家富裕。"]],[["两目失明，","日夺无光。","胫足跛倚，","不可以行，","顿于丘旁。"],["两只眼睛都失明，","白天不见日照临。","腿儿瘸来脚又跛，","不能出门去远行，","驻足丘旁受困顿。"]],[["金城朔方，","外国多羊。","履霜不时，","去复为忧。"],["金城远在西北方，","异族之地多牛羊。","不到时节寒霜降，","前往那里有忧伤。"]],[["匿病不医，","乱政伤灾。","纣作淫虐，","商破其墟。"],["患病隐瞒不医治，","政治混乱生灾异。","纣王荒淫又残暴，","商朝灭亡废其墟。"]],[["鬼哭泣社，","悲伤无后。","甲子昧爽，","殷人绝嗣。"],["鬼魂哭泣宗社间，","悲伤其后难繁衍。","甲子之日拂晓时，","殷商灭国绝后裔。"]],[["猋风卒起，","车驰揭揭。","弃古追亡，","失其和节，","忧心惙惙。"],["暴风骤然逞凶狂，","车儿跑得飞一样。","舍弃大道逐虚无，","和谐节奏丧失光，","使我心中生忧伤。"]],[["耄老失明，","闻善不从。","自令颠沛，","败为咎殃。"],["年老双眼都失明，","听见良言不相从。","颠沛摇荡不稳定，","致使灾殃接连生。"]],[["随风骑龙，","与利相逢。","田获三狐，","商伯有功。","冲冲之邑，","长安无他。"],["乘着风儿骑着龙，","与那大利喜相逢。","畋猎获得三只狐，","行商之人立了功。","众多城镇和乡村，","长住永安永无凶。"]],[["三牛五牂，","重明作福，","使我有德；","疾入官狱，","忧在心腹。"],["三头大牛五只羊，","得来之路都正当，","使我多福心堂堂；","不幸逢患入监狱，","心中忧虑真冤枉。"]],[["孟夏己丑，","哀呼尼父。","明德讫终，","乱害滋起。"],["农历四月己丑日，","尼父孔子离人世。","明德至此都终结，","动乱祸害又兴起。"]],[["华灯百枝，","消暗衰微，","精光讫尽，","奄如灰糜。"],["百枝蜡烛齐点燃，","灯火辉煌转微暗，","精光全都消耗尽，","只剩灰尘浮上面。"]],[["鹰飞雉退，","兔伏不起。","狐张狼鸣，","野鸡飞惊。"],["鹰飞长空鸡藏匿，","兔子潜伏不敢起。","狐狸舞爪狼嚎叫，","野鸡受惊飞离去。"]],[["斗战天门，","身有何患？","室家俱在，","不失其欢。"],["与敌奋战南天门，","我身健在有何凶？","老少平安居家中，","欢享人间天伦情。"]],[["东家杀牛，","行逆腥臊。","神背西顾，","命衰绝周。","毫社灾烧，","宋人夷诛。"],["东家杀牛欲祭神，","行为逆理又臊腥。","神灵全都向西望，","殷商衰灭周朝兴。","殷人宗庙被火焚，","后代宋人遭杀凶。"]],[["阴阳辨舒，","二姓相合。","婚姻孔云，","生我利福。"],["阴阳二气都协调，","两姓和合百年好。","婚姻带来家繁荣，","是我福利好吉兆。"]],[["仓盈庚亿，","宜稼黍稷，","年岁有息。"],["仓库积粮逾千亿，","装满糜子和谷子，","年丰岁熟获大利。"]],[["东入海口，","循流北走。","一高一下，","五色无主。","七日六夜，","死于水涘。"],["向东欲入大海口，","顺着水流朝北走。","随波逐浪上又下，","惊恐畏惧招罪咎。","经过七天又六夜，","水旁岸边把命丢。"]],[["孤竹之墟，","老妇无夫。","伤于蒺藜，","不见其妻。","东郭棠姜，","武子以亡。"],["孤竹国的旧址上，","老妇独居丈夫亡。","遭受蒺藜所伤害，","不见其妻心惶惶。","东郭棠姜武子娶，","困惑凶险家败亡。"]],[["天门东墟，","尽既为灾。","跰喑聋，","秦伯受殃。"],["天帝宫阙东门虚，","太阳受灾成日食。","倾跌不稳哑又聋，","秦伯身受其灾异。"]],[["赖先休光，","受福之祉。","虽遭乱溃，","独不危殆。"],["依赖祖先之荣光，","承受福气和瑞祥。","虽然遭受其溃乱，","独享安宁无灾殃。"]],[["折若蔽日，","不见稚叔。","三叔孤乌，","远其元夫。"],["折下树叶遮太阳，","不见公子在何方。","如同三足之孤乌，","难与原夫聚一堂。"]],[["二人同室，","兄弟合食。","和乐相好，","各得所欲。"],["两个小儿住一室，","兄弟一起共进食。","和睦安乐又相好，","双双愿望得满足。"]],[["继体守藩，","纵欲废贤。","君臣淫佚，","夏氏失身。","侧室之门，","福禄来存。"],["继承君位把侯封，","放纵贪欲废贤臣。","君王臣下共荒淫，","夏姬灭国丧其身。","燕寝旁室深又深，","福禄隐之不出门。"]],[["老狐屈尾，","东西为鬼。","病我长女，","哭涕屈指。","或西或东，","大华易诱。"],["老狐狸精卷着尾，","东西作祟又闹鬼。","使我长女患重病，","蜷指痛哭甚苦悲。","东来西往蛊惑人，","姑娘上当受其罪。"]],[["大树之子，","百条共母。","当夏六月，","枝叶茂盛。","鸾凤以庇，","召伯避暑。","翩翩偃仰，","各得其所。"],["同为大树之骄子，","百根枝条共母体。","正当盛夏六月时，","枝繁叶子茂又密。","凤凰来此寻庇佑，","召公避暑是圣地。","生活悠闲多自得，","各获其愿真欢娱。"]],[["井堙木刊，","国多暴残。","秦王失戍，","坏其太坛。"],["水井堵塞树遭砍，","国有恶人多暴残。","秦王边境失防守，","坏其祭坛丧政权。"]],[["驾黄买苍，","与利相迎。","心获所守，","不累弟兄。"],["驾上黄马买青马，","生意兴隆业发达。","盈利目的能达到，","不累兄弟和全家。"]],[["仓盈庚亿，","宜稼黍稷。","年丰岁熟，","民得安息。"],["仓库积粮逾千亿，","装满糜子和谷子。","年成获得大丰收，","黎民休养得安息。"]],[["龙生马渊，","寿考且神。","飞腾上天，","舍宿轩辕，","居常乐安。"],["龙马负图出河间，","长寿神通大无边。","飞腾直上九重霄，","住进轩辕星座殿，","长享快乐永平安。"]],[["思愿所之，","今乃逢时。","洗我故忧，","拜我欢来。"],["长期思慕欲至地，","今日正逢好时机。","洗去我的旧忧虑，","迎接将来大欢喜。"]],[["魁罡所当，","初为败殃。","君子留连，","困於水浆。","求金东山，","利在代乡。","贾市有息，","子载母行。"],["魁罡所指坏地方，","初始即败成祸殃。","好人停留在此地，","干涸无水受恐慌。","欲想经商和求利，","须至东山好地方。","生意兴隆有利息，","获得厚利有希望。"]],[["铅刀攻玉，","无不钻凿。","龙体具举，","鲁般为辅。","三仁翼事，","所求必喜。"],["钝刀攻玉甚艰难，","开凿钻穿形难显。","龙体形象要逼真，","雕刻须去请鲁班。","三位仁人辅政事，","所求必得心中欢。"]],[["喜来如云，","举家欢忻。","众才君子，","驾福盈门。"],["喜事降临多如云，","全家上下得欢欣。","诸多德才高尚人，","驾着幸福拥入门。"]],[["响像无形，","骨体不成。","微行衰索，","消灭无名。"],["只有声音却无形，","骨骼身体俱未成。","易服出行渐衰尽，","消减息灭难留名。"]],[["积水不温，","北陆苦寒。","露宿多风，","君子伤心。"],["积水成冰无暖温，","北方原野极寒冷。","冬夜露宿在野外，","寒风刺骨伤人心。"]],[["黄马绿车，","驾之大都。","达才能，","使我无忧。"],["黄马拉着绿车行，","一路前往都市中。","赞美推荐有才人，","使我欢欣得荣升。"]],[["从风放火，","艾芝俱死。","三害积房，","叔子中伤。"],["顺风放火火势旺，","莠草香草全烧光。","三个坏人聚一堂，","叔向之子受中伤。"]],[["一身三手，","无益於辅。","两足共节，","不能克敏。"],["一人身上三只手，","一点益处也没有。","同一踝节生两脚，","不能敏捷把路走。"]],[["南向陋室，","风雨并入。","尘埃积湿，","王母盲痹。","偏枯心疾，","乱我家次。"],["一座北屋简陋室，","刮风下雨难遮蔽。","尘埃堆积又潮湿，","祖母眼盲四肢痹。","半身偏瘫患心疾，","搅得家中失次序。"]],[["采薇出车，","鱼丽思初。","上下促急，","君子怀忧。"],["出戍之时采薇食，","边陲士卒思归期。","狄夷入侵军心乱，","将帅心中怀忧虑。"]],[["先易后否，","告我利市？","骚苏自苦，","思吾故止。"],["开头容易后艰难，","告我大利在哪边？","忧愁横生自痛苦，","想念我家旧田园。"]],[["生宜地乳，","上皇大喜。","隆我福祉，","贵寿无极。"],["生存得到地哺育，","皇天大帝心中喜。","赐予我家福与利，","富贵长寿无止极。"]]],[[["叔肹居冤，","祁子自邑。","乘遽解患，","羊舌脱免，","赖得生全。"],["叔向囚禁含屈冤，","祁奚自邑来解患。","乘坐驿车来劝说，","羊舌终于得赦免，","赖此得以保平安。"]],[["兔聚东郭，","众犬俱猎。","围缺不成，","无所能获。"],["兔子聚集在城东，","一群猎犬去围攻。","突破缺口全逃逸，","终无所获狂费功。"]],[["作室山根，","人以为安。","一旦崩颠，","败我壶餐。"],["房屋建在山根前，","人们以为很安全。","一旦山崖崩塌倒，","使我无饮又无餐。"]],[["疾风尘起，","乱扰崩始。","强大并小，","先否后喜。"],["狂风漫卷尘埃起，","吹着沙石飞行疾。","貌似强大实渺小，","先受困厄后逢喜。"]],[["洁斋沐浴，","思明君德。","哀公怯弱，","风氏复北。"],["濯发沐浴洁身心，","思念圣君好德性。","哀公胆怯又无能，","陈氏再次违君命。"]],[["土瘠瘦薄，","培无柏，","使我不乐。"],["土壤贫瘠又瘦薄，","小山不见生松柏，","使我心中无欢乐。"]],[["褰衣涉河，","水深渍罢。","赖遇舟子，","济脱无他。"],["提起衣服欲过河，","水深流急难以涉。","幸赖遇上小渡船，","使我平安到对岸。"]],[["送我季女，","至于荡道。","齐子旦夕，","留连久处。"],["送我小妹赶路忙，","送至坦荡大道上。","齐子日夜思念他，","恋恋不舍久彷徨。"]],[["三孙六子，","安无所苦。","中岁废殆，","亡我所使。"],["三个孙儿六个子，","同堂平安过日子。","到了中年遇灾难，","失去我的好役使。"]],[["扬风偃草，","尘埃俱起。","清浊溷散，","忠直隐处。"],["狂风劲吹草伏匿，","尘埃灰土俱扬起。","清澈污浊难分辨，","忠臣道士去隐居。"]],[["历险登危，","道远劳罢。","去家自归，","困涉大波。"],["历经艰险涉危途，","路遥人疲难行步。","辛苦劳累欲回家，","困于大波难涉渡。"]],[["六艺之门，","仁义俱存。","镃基逢时，","尧舜为君。"],["六种科目学者门，","仁义道德其间存。","银锄巧逢好时机，","唐尧虞舜为圣君。"]],[["被服文衣，","游观酒池。","上堂见觞，","喜为吾兄，","使我忧亡。"],["身穿华贵衣和裳，","酒池游览观风光。","盛满美酒摆上堂，","欢喜是我好兄长，","使我消愁除忧伤。"]],[["生时不利，","天命灾至。","制于斧瘢，","昼夜勤苦。"],["出生未逢好年代，","苍天为我造灾害。","浑身遭受斧伤痕，","昼夜劳累苦难挨。"]],[["天门开辟，","牢户寥阔。","桎梏解脱，","拘囚纵释。"],["上天之门得开敞，","牢房里面空荡荡。","枷锁束缚被解除，","拘禁囚犯获释放。"]],[["川原难游，","水为我忧。","多言少实，","命鹿为驹。"],["大川平原不利游，","无水使我枉犯愁。","满口空言和谎话，","指着鹿儿说是马。"]],[["乡岁逢时，","与生为期。","枝叶盛茂，","君子无忧。"],["乡野农夫逢佳时，","丰收光景连年遇。","枝叶盛茂生机旺，","好人无忧亦无虑。"]],[["六鹢退飞，","为襄败祥。","陈师合战，","左股夷伤。","遂崩不起，","霸功不成。"],["六鹢退飞过长空，","襄公衰败兆头凶。","陈师进军战于泓，","左股负伤不得行。","宋军战败全覆灭，","霸主功业不能成。"]],[["雷君出装，","隐隐西行。","霖雨不止，","流为河江，","南国以伤。"],["雷神整装去出行，","轰轰向西而挺进。","阴雨连绵不停止，","水流成河多汹涌，","使得南方遭伤损。"]],[["牙孽生达，","室堂启户。","幽人利贞，","鼓翼起舞。"],["草木出土得萌生，","屋门敞开得通行。","隐居之人得自由，","翩翩起舞多高兴。"]],[["火起上门，","不为我残。","跳脱东西，","独得生完。","不利出邻，","病疾忧患。"],["大火起于邻家门，","我自坦然未受损。","东跳西躲逃灾祸，","得以平安保自身。","不利出门去邻家，","以免受困患疾病。"]],[["举事无成，","不利出征。","言不可用，","众莫能平。"],["行动办事都难成，","不利出门去远征。","空言谬语皆无用，","众人心中怒难平。"]],[["老狼白驴，","长尾大胡。","前颠却踬，","进退遇祟。"],["老狼和那大白犬，","长尾颔内垂成片。","前颠后跌走路难，","行进退却都遇患。"]],[["日入道极，","劳者休息。","班马还师，","复我燕室。"],["日头落山路尽极，","劳累之人得休息。","班师还朝来休整，","重新回家得团聚。"]],[["山林麓薮，","非人所处。","鸟兽无礼，","使我心苦。"],["深山之中树林密，","并非贤人居住地。","鸟兽无礼来侵害，","使我心中生悲哀。"]],[["蓄利积福，","日新其德。","高氏饮食，","忧不为患。"],["积蓄财福宜生存，","自修德行乐身心。","高氏有饮又有食，","不会招来祸与凶。"]],[["张罗百目，","鸟不得北。","缩颈挂翼，","困于窘国；","君子治德，","获誉受福。"],["百孔罗网都开启，","鸟雀不得向北去。","缩起脖颈垂下翅，","受困受窘于此地；","高尚之人行仁德。","获取名誉受福喜。"]],[["伯虎仲熊，","德义渊宏。","使布五教，","阴阳顺序。"],["伯虎仲熊两弟兄，","品德义气广又深。","使其前往传五教，","阴阳二气都协调。"]],[["跛踦相随，","日暮牛罢。","陵迟后旅，","失利亡雌。"],["跛脚赶路相随从，","黄昏牛疲难行进。","斜坡之上落伍后，","利益女友皆无踪。"]],[["嬴氏违良，","使孟寻兵。","老师不已，","败于齐卿。"],["穆公不听良言劝，","孟明帅军去征战。","日久用兵甚疲惫，","败于大臣之手端。"]],[["日月并居，","常暗且微。","高山崩颠，","丘陵为谿。"],["太阳月亮同出现，","光线微弱甚暗淡。","高山崩塌遭覆颠，","丘陵变为谷和涧。"]],[["鸟鹊食谷，","张口受哺。","蒙被恩德，","长大成就。","柔顺利贞，","君臣合好。"],["鸟鹊前来食谷粒，","张开嘴巴受哺育。","承蒙养育之恩德，","个个长大都成器。","温柔恭顺又守正，","君上臣下如知己。"]],[["虽踬复起，","不毁牙齿。","克免平复，","忧除无疾。"],["虽然跌倒又爬起，","没有毁坏我牙齿。","免除危险得平安，","忧患消去无病疾。"]],[["草木黄落，","岁暮无室。","虐政为贼，","大人失福。"],["草木枯黄叶儿落，","年终未得安乐窝。","政治暴虐害人民，","为官之人失福泽。"]],[["避凶东走，","反入祸口。","制于牙爪，","骨为灰土。"],["逃避凶祸往东走，","反而进入灾祸口。","受制帮凶和爪牙，","遗骨化灰把命丢。"]],[["欲飞不能，","志苦心劳，","福不我来。"],["想要高飞又不能，","意志悲苦枉劳神，","福气不向我降临。"]],[["羔裘豹祛，","东与福遇。","驾迎吾兄，","送我骊黄。"],["羔皮袍子豹皮袖，","向东迎接我长兄。","送我黑马和黄马，","幸福与我来相从。"]],[["东耕破犁，","西失良妻。","灾祸不避，","家贫无资。"],["东边耕地破了犁，","西边失去我爱妻。","灾害无法能避免，","家贫如洗无财资。"]],[["同载共舆，","中道别去。","丧我元夫，","独与孤居。"],["两人同乘一辆车，","中途双双远离别。","失去我的原配夫，","妻子孤居独生活。"]],[["鱼陆失所，","凫蛙困苦。","泽无萑蒲，","晋国以虚。"],["鱼处陆地失其居，","野鸭青蛙受困苦。","沼泽干枯不长草，","晋国空虚无财富。"]],[["脱兔无蹄，","三步五罢。","南行不进，","后市劳苦。"],["逃亡之兔脚受损，","疲劳不堪事不顺。","朝南行走不能进，","后到集市误营生。"]],[["行役未已，","新事复起。","姬姜劳苦，","不得休止。"],["外出服役未完毕，","新的役事又来逼。","夫妻双双多劳苦，","不得休闲和安息。"]],[["白日扬光，","火为正王。","消金厌兵，","雷车避藏。","阴雨不行，","民安其乡。"],["白天骄阳放光芒，","大火成为正统王。","销熔兵器战争止，","雷神之车也隐藏。","绵绵阴雨不临至，","百姓安居其家乡。"]],[["放衔垂辔，","奔马不制。","弃法作奸，","君失其位。"],["放松缰绳和勒口，","骏马飞奔难制收。","弃去法规行坏事，","君王失意帝位丢。"]],[["司命下游，","喜解我忧。","皇母缓带，","婴儿笑喜。"],["生命之神下凡游，","带来喜悦解我愁。","祖母松开牵儿带，","孩子心中乐悠悠。"]],[["黄帝出游，","驾龙乘马。","东上泰山，","南过齐鲁，","邦国咸喜。"],["轩辕黄帝去出巡，","乘着骏马驾着龙。","向东登上泰山顶，","南到齐国鲁国中，","举国上下多欢欣。"]],[["既往不说，","忧来祸结。","比户为患，","无所申雪。"],["从前日子少喜悦，","忧愁来临灾祸结。","自从近邻成仇家，","无处申冤和昭雪。"]],[["荷蒉隐名，","以避乱倾。","终身不仕，","遂其洁清。"],["肩负草筐隐真名，","以避乱世保自身。","终身不为升官忙，","保我声名洁又清。"]],[["折梃舂稷，","君不得食。","头痒搔跟，","无益于疾。"],["折木为槌捣谷子，","愚夫口中难得食。","头痒去搔脚后跟，","无济于事枉费心。"]],[["植根不固，","花叶落去，","便为枯树。"],["种植根基不牢固，","花叶落地自败腐，","成为一枝干枯树。"]],[["凶门生患，","牢户多冤。","沙池秃齿，","使叔困贫。"],["凶险之门生灾患，","牢狱之内多冤案。","差池不齐又秃齿，","小弟困苦受贫寒。"]],[["登山履谷，","与虎相触。","猬为功曹，","班叔奔北，","脱之喜国。"],["登上高山入深谷，","途中不幸碰到虎。","多亏刺猬来相助，","恶虎潜逃向北去，","使我脱险至乐都。"]],[["麟凤所翔，","国无咎殃。","贾市十倍，","复归惠里。"],["麟凤翱翔好地方，","国家平安无灾殃。","经商获得十倍利，","重新返回我家乡。"]],[["路险道难，","水遏我前。","进往不利，","回车复还。"],["路途遥远甚艰难，","大水阻我难向前。","行进之中不顺利，","掉回车头又返还。"]],[["延颈望邑，","思归我室。","台榭不成，","未得安息。"],["伸长脖颈望家乡，","想要返回原住房。","台上之屋未建成，","未能安居好地方。"]],[["蒙生株瞿，","棘挂我须。","小人妒忌，","使恩不遂。"],["生长处于杂草里，","荆棘挂住我胡须。","奸佞小人生妒忌，","使我难得惠与利。"]],[["南至隐域，","深潜处匿。","聪明闭塞，","与死为伍
